apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8f5dea3-d95a-4745-a120-52c668f2d906.fullname" . }}
  labels:
    {{- include "go-echob8f5dea3-d95a-4745-a120-52c668f2d906.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8f5dea3-d95a-4745-a120-52c668f2d906.selectorLabels" . | nindent 6 }}
