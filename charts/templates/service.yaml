apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00f6f261-a5eb-4b0f-a582-3ee9ad234c40.fullname" . }}
  labels:
    {{- include "go-echo00f6f261-a5eb-4b0f-a582-3ee9ad234c40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00f6f261-a5eb-4b0f-a582-3ee9ad234c40.selectorLabels" . | nindent 6 }}
