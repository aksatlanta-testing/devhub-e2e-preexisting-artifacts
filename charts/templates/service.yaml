apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo317d6b4a-c79f-4cbc-be4e-3c383e7e7919.fullname" . }}
  labels:
    {{- include "go-echo317d6b4a-c79f-4cbc-be4e-3c383e7e7919.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo317d6b4a-c79f-4cbc-be4e-3c383e7e7919.selectorLabels" . | nindent 6 }}
