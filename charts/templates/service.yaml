apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb410f5c-b459-40c9-81d9-d1d008f8bdfd.fullname" . }}
  labels:
    {{- include "go-echobb410f5c-b459-40c9-81d9-d1d008f8bdfd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb410f5c-b459-40c9-81d9-d1d008f8bdfd.selectorLabels" . | nindent 6 }}
