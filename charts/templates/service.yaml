apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee3fc5d6-3067-42b6-9861-71a0f7325c0a.fullname" . }}
  labels:
    {{- include "go-echoee3fc5d6-3067-42b6-9861-71a0f7325c0a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee3fc5d6-3067-42b6-9861-71a0f7325c0a.selectorLabels" . | nindent 6 }}
