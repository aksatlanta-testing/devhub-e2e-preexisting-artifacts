apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo797f991a-a4be-4675-94be-332f8dc287fa.fullname" . }}
  labels:
    {{- include "go-echo797f991a-a4be-4675-94be-332f8dc287fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo797f991a-a4be-4675-94be-332f8dc287fa.selectorLabels" . | nindent 6 }}
