apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3669cc5e-6f1c-4fe7-9d2c-819f48d8c373.fullname" . }}
  labels:
    {{- include "go-echo3669cc5e-6f1c-4fe7-9d2c-819f48d8c373.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3669cc5e-6f1c-4fe7-9d2c-819f48d8c373.selectorLabels" . | nindent 6 }}
