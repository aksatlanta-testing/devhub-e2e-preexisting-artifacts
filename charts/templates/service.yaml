apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80338efb-02cb-4eec-9916-d3f432e1e648.fullname" . }}
  labels:
    {{- include "go-echo80338efb-02cb-4eec-9916-d3f432e1e648.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80338efb-02cb-4eec-9916-d3f432e1e648.selectorLabels" . | nindent 6 }}
