apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bab7a73-4680-4020-b979-2af5dd9c78ff.fullname" . }}
  labels:
    {{- include "go-echo8bab7a73-4680-4020-b979-2af5dd9c78ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bab7a73-4680-4020-b979-2af5dd9c78ff.selectorLabels" . | nindent 6 }}
