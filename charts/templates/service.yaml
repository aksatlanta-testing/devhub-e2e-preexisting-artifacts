apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe27513d1-3423-463c-be2e-1e930a27627a.fullname" . }}
  labels:
    {{- include "go-echoe27513d1-3423-463c-be2e-1e930a27627a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe27513d1-3423-463c-be2e-1e930a27627a.selectorLabels" . | nindent 6 }}
