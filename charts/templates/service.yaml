apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc97c6cbe-447b-40e3-84c2-5d0643a0b023.fullname" . }}
  labels:
    {{- include "go-echoc97c6cbe-447b-40e3-84c2-5d0643a0b023.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc97c6cbe-447b-40e3-84c2-5d0643a0b023.selectorLabels" . | nindent 6 }}
