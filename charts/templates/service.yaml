apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f7905ec-7617-4457-b7fb-38970c14411d.fullname" . }}
  labels:
    {{- include "go-echo5f7905ec-7617-4457-b7fb-38970c14411d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f7905ec-7617-4457-b7fb-38970c14411d.selectorLabels" . | nindent 6 }}
