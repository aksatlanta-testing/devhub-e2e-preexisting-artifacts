apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob56f6f10-e4cb-4089-b99a-26da486a8188.fullname" . }}
  labels:
    {{- include "go-echob56f6f10-e4cb-4089-b99a-26da486a8188.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob56f6f10-e4cb-4089-b99a-26da486a8188.selectorLabels" . | nindent 6 }}
