apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc4ab618-04a7-45c8-961d-d6b003408ce0.fullname" . }}
  labels:
    {{- include "go-echocc4ab618-04a7-45c8-961d-d6b003408ce0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc4ab618-04a7-45c8-961d-d6b003408ce0.selectorLabels" . | nindent 6 }}
