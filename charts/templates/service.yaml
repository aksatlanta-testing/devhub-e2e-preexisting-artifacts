apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee2a7b54-5730-4292-80f3-310a65d5fd7f.fullname" . }}
  labels:
    {{- include "go-echoee2a7b54-5730-4292-80f3-310a65d5fd7f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee2a7b54-5730-4292-80f3-310a65d5fd7f.selectorLabels" . | nindent 6 }}
