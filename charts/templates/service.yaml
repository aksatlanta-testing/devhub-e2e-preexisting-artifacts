apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc35a7d6-4235-40d0-a3b7-6ee2e364880b.fullname" . }}
  labels:
    {{- include "go-echodc35a7d6-4235-40d0-a3b7-6ee2e364880b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc35a7d6-4235-40d0-a3b7-6ee2e364880b.selectorLabels" . | nindent 6 }}
