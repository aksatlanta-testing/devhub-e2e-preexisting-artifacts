apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2032db4-0821-48b8-8c99-96102cac29f6.fullname" . }}
  labels:
    {{- include "go-echod2032db4-0821-48b8-8c99-96102cac29f6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2032db4-0821-48b8-8c99-96102cac29f6.selectorLabels" . | nindent 6 }}
