apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffa3dfae-eb3c-4032-8e45-e5ca934c7618.fullname" . }}
  labels:
    {{- include "go-echoffa3dfae-eb3c-4032-8e45-e5ca934c7618.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffa3dfae-eb3c-4032-8e45-e5ca934c7618.selectorLabels" . | nindent 6 }}
