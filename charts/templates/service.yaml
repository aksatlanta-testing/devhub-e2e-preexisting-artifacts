apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo11c4a0a3-c1ee-4466-9723-2ef24a48efcc.fullname" . }}
  labels:
    {{- include "go-echo11c4a0a3-c1ee-4466-9723-2ef24a48efcc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo11c4a0a3-c1ee-4466-9723-2ef24a48efcc.selectorLabels" . | nindent 6 }}
