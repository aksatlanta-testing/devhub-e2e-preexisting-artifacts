apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32505399-f7d7-4642-9968-36b6a5c9c95b.fullname" . }}
  labels:
    {{- include "go-echo32505399-f7d7-4642-9968-36b6a5c9c95b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32505399-f7d7-4642-9968-36b6a5c9c95b.selectorLabels" . | nindent 6 }}
