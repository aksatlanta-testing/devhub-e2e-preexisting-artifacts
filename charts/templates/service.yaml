apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c58c5bf-20fd-454f-b9bc-af767a3c2b58.fullname" . }}
  labels:
    {{- include "go-echo7c58c5bf-20fd-454f-b9bc-af767a3c2b58.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c58c5bf-20fd-454f-b9bc-af767a3c2b58.selectorLabels" . | nindent 6 }}
