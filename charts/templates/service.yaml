apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5a44e81-ab8e-47d1-9a5b-2e6f0e0364db.fullname" . }}
  labels:
    {{- include "go-echod5a44e81-ab8e-47d1-9a5b-2e6f0e0364db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5a44e81-ab8e-47d1-9a5b-2e6f0e0364db.selectorLabels" . | nindent 6 }}
