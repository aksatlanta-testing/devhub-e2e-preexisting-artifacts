apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5453be41-4a30-4f1a-af66-ca37c72210b7.fullname" . }}
  labels:
    {{- include "go-echo5453be41-4a30-4f1a-af66-ca37c72210b7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5453be41-4a30-4f1a-af66-ca37c72210b7.selectorLabels" . | nindent 6 }}
