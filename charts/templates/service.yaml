apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2584753-6af4-4d12-a12b-feed418b0ee4.fullname" . }}
  labels:
    {{- include "go-echob2584753-6af4-4d12-a12b-feed418b0ee4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2584753-6af4-4d12-a12b-feed418b0ee4.selectorLabels" . | nindent 6 }}
