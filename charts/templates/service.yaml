apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8edbd9f9-799f-486a-90d5-a1ffdf188987.fullname" . }}
  labels:
    {{- include "go-echo8edbd9f9-799f-486a-90d5-a1ffdf188987.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8edbd9f9-799f-486a-90d5-a1ffdf188987.selectorLabels" . | nindent 6 }}
