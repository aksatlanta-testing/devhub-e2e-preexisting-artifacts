apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08b52aa0-8da1-44ea-ace5-52194ef41e1d.fullname" . }}
  labels:
    {{- include "go-echo08b52aa0-8da1-44ea-ace5-52194ef41e1d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08b52aa0-8da1-44ea-ace5-52194ef41e1d.selectorLabels" . | nindent 6 }}
