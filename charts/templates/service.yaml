apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodaf60323-a4bb-474e-a535-df8e4389e8b8.fullname" . }}
  labels:
    {{- include "go-echodaf60323-a4bb-474e-a535-df8e4389e8b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodaf60323-a4bb-474e-a535-df8e4389e8b8.selectorLabels" . | nindent 6 }}
