apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4901afa2-39d0-4a90-a0c0-c4519c5e876c.fullname" . }}
  labels:
    {{- include "go-echo4901afa2-39d0-4a90-a0c0-c4519c5e876c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4901afa2-39d0-4a90-a0c0-c4519c5e876c.selectorLabels" . | nindent 6 }}
