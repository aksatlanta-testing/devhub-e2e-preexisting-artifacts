apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobfd15935-e028-498a-b2d8-96374783da24.fullname" . }}
  labels:
    {{- include "go-echobfd15935-e028-498a-b2d8-96374783da24.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobfd15935-e028-498a-b2d8-96374783da24.selectorLabels" . | nindent 6 }}
