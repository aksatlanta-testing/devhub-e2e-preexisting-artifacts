apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo845bcbfc-bb09-4602-87fa-786ca5afbf1f.fullname" . }}
  labels:
    {{- include "go-echo845bcbfc-bb09-4602-87fa-786ca5afbf1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo845bcbfc-bb09-4602-87fa-786ca5afbf1f.selectorLabels" . | nindent 6 }}
