apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5c28bec-c2ce-4a72-8a70-077409724716.fullname" . }}
  labels:
    {{- include "go-echod5c28bec-c2ce-4a72-8a70-077409724716.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5c28bec-c2ce-4a72-8a70-077409724716.selectorLabels" . | nindent 6 }}
