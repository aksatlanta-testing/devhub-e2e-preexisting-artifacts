apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ad7137c-3ed3-4f0c-9178-a54f7f8f012a.fullname" . }}
  labels:
    {{- include "go-echo8ad7137c-3ed3-4f0c-9178-a54f7f8f012a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ad7137c-3ed3-4f0c-9178-a54f7f8f012a.selectorLabels" . | nindent 6 }}
