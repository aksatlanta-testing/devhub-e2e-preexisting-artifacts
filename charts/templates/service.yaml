apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12e97e2d-b5e6-45b9-b4a1-3ebf45bb4c91.fullname" . }}
  labels:
    {{- include "go-echo12e97e2d-b5e6-45b9-b4a1-3ebf45bb4c91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12e97e2d-b5e6-45b9-b4a1-3ebf45bb4c91.selectorLabels" . | nindent 6 }}
