apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d815f1a-4f5a-4c0e-a670-8ea8d79b17bd.fullname" . }}
  labels:
    {{- include "go-echo1d815f1a-4f5a-4c0e-a670-8ea8d79b17bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d815f1a-4f5a-4c0e-a670-8ea8d79b17bd.selectorLabels" . | nindent 6 }}
