apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodac9120a-2a05-42f0-bebb-08e20c39cd29.fullname" . }}
  labels:
    {{- include "go-echodac9120a-2a05-42f0-bebb-08e20c39cd29.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodac9120a-2a05-42f0-bebb-08e20c39cd29.selectorLabels" . | nindent 6 }}
