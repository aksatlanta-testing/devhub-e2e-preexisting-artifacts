apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10ea30e6-5bd6-420e-8ff0-e089ff61f16b.fullname" . }}
  labels:
    {{- include "go-echo10ea30e6-5bd6-420e-8ff0-e089ff61f16b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10ea30e6-5bd6-420e-8ff0-e089ff61f16b.selectorLabels" . | nindent 6 }}
