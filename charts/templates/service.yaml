apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ea478a9-fdd5-4bc2-a8b9-1f2d53233933.fullname" . }}
  labels:
    {{- include "go-echo7ea478a9-fdd5-4bc2-a8b9-1f2d53233933.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ea478a9-fdd5-4bc2-a8b9-1f2d53233933.selectorLabels" . | nindent 6 }}
