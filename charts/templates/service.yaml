apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7c628af-df29-406f-a9b7-d772289f74f8.fullname" . }}
  labels:
    {{- include "go-echoc7c628af-df29-406f-a9b7-d772289f74f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7c628af-df29-406f-a9b7-d772289f74f8.selectorLabels" . | nindent 6 }}
