apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03dce682-7f91-45bb-9b7a-055517a90daf.fullname" . }}
  labels:
    {{- include "go-echo03dce682-7f91-45bb-9b7a-055517a90daf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03dce682-7f91-45bb-9b7a-055517a90daf.selectorLabels" . | nindent 6 }}
