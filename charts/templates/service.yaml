apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3083c9a5-46fd-4b3d-b2f2-c6cb8c0ff79c.fullname" . }}
  labels:
    {{- include "go-echo3083c9a5-46fd-4b3d-b2f2-c6cb8c0ff79c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3083c9a5-46fd-4b3d-b2f2-c6cb8c0ff79c.selectorLabels" . | nindent 6 }}
