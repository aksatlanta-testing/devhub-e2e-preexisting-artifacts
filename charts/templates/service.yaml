apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01a33f5f-b48e-44b9-88fa-fbafbc2ce0e2.fullname" . }}
  labels:
    {{- include "go-echo01a33f5f-b48e-44b9-88fa-fbafbc2ce0e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01a33f5f-b48e-44b9-88fa-fbafbc2ce0e2.selectorLabels" . | nindent 6 }}
