apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob578d34b-f432-4ded-8518-3ee92a44cad8.fullname" . }}
  labels:
    {{- include "go-echob578d34b-f432-4ded-8518-3ee92a44cad8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob578d34b-f432-4ded-8518-3ee92a44cad8.selectorLabels" . | nindent 6 }}
