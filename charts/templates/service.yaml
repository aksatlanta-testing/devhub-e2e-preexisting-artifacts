apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fb5cbda-57a9-4b3a-8aba-c71edc68548b.fullname" . }}
  labels:
    {{- include "go-echo4fb5cbda-57a9-4b3a-8aba-c71edc68548b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fb5cbda-57a9-4b3a-8aba-c71edc68548b.selectorLabels" . | nindent 6 }}
