apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6dd1b7d3-a297-43b0-9369-6e94949b0fac.fullname" . }}
  labels:
    {{- include "go-echo6dd1b7d3-a297-43b0-9369-6e94949b0fac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6dd1b7d3-a297-43b0-9369-6e94949b0fac.selectorLabels" . | nindent 6 }}
