apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo826e511a-5623-4876-bd4c-3375eaf1407c.fullname" . }}
  labels:
    {{- include "go-echo826e511a-5623-4876-bd4c-3375eaf1407c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo826e511a-5623-4876-bd4c-3375eaf1407c.selectorLabels" . | nindent 6 }}
