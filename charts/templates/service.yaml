apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32912d7a-9d3c-430c-9e7d-a134b1bfce74.fullname" . }}
  labels:
    {{- include "go-echo32912d7a-9d3c-430c-9e7d-a134b1bfce74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32912d7a-9d3c-430c-9e7d-a134b1bfce74.selectorLabels" . | nindent 6 }}
