apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72173bfe-1126-4123-9c07-483935f89463.fullname" . }}
  labels:
    {{- include "go-echo72173bfe-1126-4123-9c07-483935f89463.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72173bfe-1126-4123-9c07-483935f89463.selectorLabels" . | nindent 6 }}
