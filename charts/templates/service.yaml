apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaaa0d254-b872-4300-9f97-53dc7d72e124.fullname" . }}
  labels:
    {{- include "go-echoaaa0d254-b872-4300-9f97-53dc7d72e124.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaaa0d254-b872-4300-9f97-53dc7d72e124.selectorLabels" . | nindent 6 }}
