apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b3d2c14-7c07-4fba-b3e3-aa30ecac1df2.fullname" . }}
  labels:
    {{- include "go-echo8b3d2c14-7c07-4fba-b3e3-aa30ecac1df2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b3d2c14-7c07-4fba-b3e3-aa30ecac1df2.selectorLabels" . | nindent 6 }}
