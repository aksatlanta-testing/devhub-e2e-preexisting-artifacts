apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof927230e-4384-4421-87d4-cec7c72c2e24.fullname" . }}
  labels:
    {{- include "go-echof927230e-4384-4421-87d4-cec7c72c2e24.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof927230e-4384-4421-87d4-cec7c72c2e24.selectorLabels" . | nindent 6 }}
