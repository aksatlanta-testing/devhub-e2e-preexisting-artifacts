apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c0d2aab-db8e-46eb-86b7-90a8dfa4e64c.fullname" . }}
  labels:
    {{- include "go-echo6c0d2aab-db8e-46eb-86b7-90a8dfa4e64c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c0d2aab-db8e-46eb-86b7-90a8dfa4e64c.selectorLabels" . | nindent 6 }}
