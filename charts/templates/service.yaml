apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62306a34-7716-4320-9970-e173d947fbf5.fullname" . }}
  labels:
    {{- include "go-echo62306a34-7716-4320-9970-e173d947fbf5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62306a34-7716-4320-9970-e173d947fbf5.selectorLabels" . | nindent 6 }}
