apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82bf0b18-3bb7-4af3-a619-a905bb14cc3b.fullname" . }}
  labels:
    {{- include "go-echo82bf0b18-3bb7-4af3-a619-a905bb14cc3b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82bf0b18-3bb7-4af3-a619-a905bb14cc3b.selectorLabels" . | nindent 6 }}
