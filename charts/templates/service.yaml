apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa4e6d66-99a5-453c-9552-ecfc3143d3a7.fullname" . }}
  labels:
    {{- include "go-echoaa4e6d66-99a5-453c-9552-ecfc3143d3a7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa4e6d66-99a5-453c-9552-ecfc3143d3a7.selectorLabels" . | nindent 6 }}
