apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo630ff60b-cd21-4443-a43c-3ab25b9133d9.fullname" . }}
  labels:
    {{- include "go-echo630ff60b-cd21-4443-a43c-3ab25b9133d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo630ff60b-cd21-4443-a43c-3ab25b9133d9.selectorLabels" . | nindent 6 }}
