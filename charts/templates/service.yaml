apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof11aecd7-0fbb-4688-abc5-d5246b2d5293.fullname" . }}
  labels:
    {{- include "go-echof11aecd7-0fbb-4688-abc5-d5246b2d5293.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof11aecd7-0fbb-4688-abc5-d5246b2d5293.selectorLabels" . | nindent 6 }}
