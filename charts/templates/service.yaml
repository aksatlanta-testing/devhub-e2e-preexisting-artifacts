apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo441c16d4-72b6-4d14-9757-7693c0609f68.fullname" . }}
  labels:
    {{- include "go-echo441c16d4-72b6-4d14-9757-7693c0609f68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo441c16d4-72b6-4d14-9757-7693c0609f68.selectorLabels" . | nindent 6 }}
