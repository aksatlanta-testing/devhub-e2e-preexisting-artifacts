apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e6e3ad4-2732-44c0-8ec4-0770c47014eb.fullname" . }}
  labels:
    {{- include "go-echo3e6e3ad4-2732-44c0-8ec4-0770c47014eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e6e3ad4-2732-44c0-8ec4-0770c47014eb.selectorLabels" . | nindent 6 }}
