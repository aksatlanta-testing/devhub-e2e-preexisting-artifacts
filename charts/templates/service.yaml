apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e11de66-9d44-413e-bcd9-5d52ff9c5db5.fullname" . }}
  labels:
    {{- include "go-echo2e11de66-9d44-413e-bcd9-5d52ff9c5db5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e11de66-9d44-413e-bcd9-5d52ff9c5db5.selectorLabels" . | nindent 6 }}
