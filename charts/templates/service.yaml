apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe726c70e-20d3-43d5-b709-1c1f04e034f1.fullname" . }}
  labels:
    {{- include "go-echoe726c70e-20d3-43d5-b709-1c1f04e034f1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe726c70e-20d3-43d5-b709-1c1f04e034f1.selectorLabels" . | nindent 6 }}
