apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacdebfb3-6225-44f7-a964-a972b64706cb.fullname" . }}
  labels:
    {{- include "go-echoacdebfb3-6225-44f7-a964-a972b64706cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacdebfb3-6225-44f7-a964-a972b64706cb.selectorLabels" . | nindent 6 }}
