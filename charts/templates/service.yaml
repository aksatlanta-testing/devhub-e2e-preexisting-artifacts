apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7a0fe5d-62f7-4074-b7f0-3d955f66b5e3.fullname" . }}
  labels:
    {{- include "go-echoa7a0fe5d-62f7-4074-b7f0-3d955f66b5e3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7a0fe5d-62f7-4074-b7f0-3d955f66b5e3.selectorLabels" . | nindent 6 }}
