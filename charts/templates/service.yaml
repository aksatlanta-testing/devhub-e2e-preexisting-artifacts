apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd1da4b4-ea46-4a98-a08f-7b3e2d127635.fullname" . }}
  labels:
    {{- include "go-echobd1da4b4-ea46-4a98-a08f-7b3e2d127635.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd1da4b4-ea46-4a98-a08f-7b3e2d127635.selectorLabels" . | nindent 6 }}
