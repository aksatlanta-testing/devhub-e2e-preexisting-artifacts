apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01db466d-9016-4f63-be2d-2618b598e41f.fullname" . }}
  labels:
    {{- include "go-echo01db466d-9016-4f63-be2d-2618b598e41f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01db466d-9016-4f63-be2d-2618b598e41f.selectorLabels" . | nindent 6 }}
