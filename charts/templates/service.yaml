apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef8e5d0b-4674-46b5-887a-bd11c9da19ff.fullname" . }}
  labels:
    {{- include "go-echoef8e5d0b-4674-46b5-887a-bd11c9da19ff.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef8e5d0b-4674-46b5-887a-bd11c9da19ff.selectorLabels" . | nindent 6 }}
