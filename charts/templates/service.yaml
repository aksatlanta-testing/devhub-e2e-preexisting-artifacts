apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36a2ce5a-cfcd-46a2-905c-68c529e56d90.fullname" . }}
  labels:
    {{- include "go-echo36a2ce5a-cfcd-46a2-905c-68c529e56d90.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36a2ce5a-cfcd-46a2-905c-68c529e56d90.selectorLabels" . | nindent 6 }}
