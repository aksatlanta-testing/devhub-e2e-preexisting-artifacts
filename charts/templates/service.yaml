apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa42f1f0-b5fa-471c-8875-84b74de3d6d7.fullname" . }}
  labels:
    {{- include "go-echoaa42f1f0-b5fa-471c-8875-84b74de3d6d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa42f1f0-b5fa-471c-8875-84b74de3d6d7.selectorLabels" . | nindent 6 }}
