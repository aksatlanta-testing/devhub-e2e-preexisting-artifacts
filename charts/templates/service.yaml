apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39c52336-ee15-4715-b8c5-81436c9fa63f.fullname" . }}
  labels:
    {{- include "go-echo39c52336-ee15-4715-b8c5-81436c9fa63f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39c52336-ee15-4715-b8c5-81436c9fa63f.selectorLabels" . | nindent 6 }}
