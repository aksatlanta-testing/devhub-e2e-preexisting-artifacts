apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32f7455e-0d49-46fe-8768-85beba33fa80.fullname" . }}
  labels:
    {{- include "go-echo32f7455e-0d49-46fe-8768-85beba33fa80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
