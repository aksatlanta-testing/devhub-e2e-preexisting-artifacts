apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7532a72a-1edd-43b9-b5c1-cacef681b34a.fullname" . }}
  labels:
    {{- include "go-echo7532a72a-1edd-43b9-b5c1-cacef681b34a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7532a72a-1edd-43b9-b5c1-cacef681b34a.selectorLabels" . | nindent 6 }}
