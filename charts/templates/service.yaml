apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac09811d-a628-4889-94ef-f67ced756896.fullname" . }}
  labels:
    {{- include "go-echoac09811d-a628-4889-94ef-f67ced756896.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac09811d-a628-4889-94ef-f67ced756896.selectorLabels" . | nindent 6 }}
