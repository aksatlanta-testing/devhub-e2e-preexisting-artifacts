apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocabc6c03-c234-4500-90e3-db97d8265b69.fullname" . }}
  labels:
    {{- include "go-echocabc6c03-c234-4500-90e3-db97d8265b69.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocabc6c03-c234-4500-90e3-db97d8265b69.selectorLabels" . | nindent 6 }}
