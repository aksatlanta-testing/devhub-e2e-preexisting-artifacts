apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba047e64-3929-497f-8c81-d7099cd54fff.fullname" . }}
  labels:
    {{- include "go-echoba047e64-3929-497f-8c81-d7099cd54fff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba047e64-3929-497f-8c81-d7099cd54fff.selectorLabels" . | nindent 6 }}
