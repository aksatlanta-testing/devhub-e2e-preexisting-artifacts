apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cd577a1-edf4-4dfe-875d-4fbe3610fbfc.fullname" . }}
  labels:
    {{- include "go-echo7cd577a1-edf4-4dfe-875d-4fbe3610fbfc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7cd577a1-edf4-4dfe-875d-4fbe3610fbfc.selectorLabels" . | nindent 6 }}
