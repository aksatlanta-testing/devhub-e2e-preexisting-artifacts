apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a7995c9-e2cb-4a36-a60c-9702583bad4e.fullname" . }}
  labels:
    {{- include "go-echo8a7995c9-e2cb-4a36-a60c-9702583bad4e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a7995c9-e2cb-4a36-a60c-9702583bad4e.selectorLabels" . | nindent 6 }}
