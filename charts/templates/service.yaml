apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7fb9575a-1cc7-4eba-9826-d108e18c7127.fullname" . }}
  labels:
    {{- include "go-echo7fb9575a-1cc7-4eba-9826-d108e18c7127.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7fb9575a-1cc7-4eba-9826-d108e18c7127.selectorLabels" . | nindent 6 }}
