apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc0076ecb-2de6-44b9-b03a-dbcede73cacf.fullname" . }}
  labels:
    {{- include "go-echoc0076ecb-2de6-44b9-b03a-dbcede73cacf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc0076ecb-2de6-44b9-b03a-dbcede73cacf.selectorLabels" . | nindent 6 }}
