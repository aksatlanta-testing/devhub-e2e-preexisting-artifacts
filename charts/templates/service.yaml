apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa86f4084-98f9-43c9-9339-d6519bcf2043.fullname" . }}
  labels:
    {{- include "go-echoa86f4084-98f9-43c9-9339-d6519bcf2043.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa86f4084-98f9-43c9-9339-d6519bcf2043.selectorLabels" . | nindent 6 }}
