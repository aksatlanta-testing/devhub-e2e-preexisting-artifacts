apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeb5dee8e-88c5-459a-9ae9-4719a2f92385.fullname" . }}
  labels:
    {{- include "go-echoeb5dee8e-88c5-459a-9ae9-4719a2f92385.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeb5dee8e-88c5-459a-9ae9-4719a2f92385.selectorLabels" . | nindent 6 }}
