apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4475b47-d9f6-4b85-a9ad-4eca226675f0.fullname" . }}
  labels:
    {{- include "go-echoe4475b47-d9f6-4b85-a9ad-4eca226675f0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4475b47-d9f6-4b85-a9ad-4eca226675f0.selectorLabels" . | nindent 6 }}
