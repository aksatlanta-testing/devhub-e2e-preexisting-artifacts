apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof916a9a1-56c4-427b-807d-657a7a4d8b37.fullname" . }}
  labels:
    {{- include "go-echof916a9a1-56c4-427b-807d-657a7a4d8b37.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof916a9a1-56c4-427b-807d-657a7a4d8b37.selectorLabels" . | nindent 6 }}
