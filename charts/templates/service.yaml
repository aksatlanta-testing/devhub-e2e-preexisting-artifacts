apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob283dc3c-1769-4f28-be1e-cb49407f58c0.fullname" . }}
  labels:
    {{- include "go-echob283dc3c-1769-4f28-be1e-cb49407f58c0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob283dc3c-1769-4f28-be1e-cb49407f58c0.selectorLabels" . | nindent 6 }}
