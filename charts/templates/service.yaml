apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo16e449ba-5ec0-4f8d-9cc4-11aeb9fb17d3.fullname" . }}
  labels:
    {{- include "go-echo16e449ba-5ec0-4f8d-9cc4-11aeb9fb17d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo16e449ba-5ec0-4f8d-9cc4-11aeb9fb17d3.selectorLabels" . | nindent 6 }}
