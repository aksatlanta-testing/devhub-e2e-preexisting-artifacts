apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02b6a91d-76ae-4328-a98c-583226fa8c75.fullname" . }}
  labels:
    {{- include "go-echo02b6a91d-76ae-4328-a98c-583226fa8c75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02b6a91d-76ae-4328-a98c-583226fa8c75.selectorLabels" . | nindent 6 }}
