apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42f35ee2-3d84-445c-b0d2-1cbf30c97cee.fullname" . }}
  labels:
    {{- include "go-echo42f35ee2-3d84-445c-b0d2-1cbf30c97cee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42f35ee2-3d84-445c-b0d2-1cbf30c97cee.selectorLabels" . | nindent 6 }}
