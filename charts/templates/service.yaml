apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e386da8-6f04-422e-ad1b-97e4feffdc09.fullname" . }}
  labels:
    {{- include "go-echo6e386da8-6f04-422e-ad1b-97e4feffdc09.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e386da8-6f04-422e-ad1b-97e4feffdc09.selectorLabels" . | nindent 6 }}
