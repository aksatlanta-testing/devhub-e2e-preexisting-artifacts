apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92d32073-70eb-450e-8737-94d1c4730d91.fullname" . }}
  labels:
    {{- include "go-echo92d32073-70eb-450e-8737-94d1c4730d91.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92d32073-70eb-450e-8737-94d1c4730d91.selectorLabels" . | nindent 6 }}
