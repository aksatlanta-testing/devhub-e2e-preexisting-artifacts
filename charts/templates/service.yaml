apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7da55441-e027-4851-8ef9-ab3b905c7c73.fullname" . }}
  labels:
    {{- include "go-echo7da55441-e027-4851-8ef9-ab3b905c7c73.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7da55441-e027-4851-8ef9-ab3b905c7c73.selectorLabels" . | nindent 6 }}
