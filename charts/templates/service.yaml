apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4d4e42f-75cc-4e5e-bfc3-e0be1c9e547e.fullname" . }}
  labels:
    {{- include "go-echof4d4e42f-75cc-4e5e-bfc3-e0be1c9e547e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4d4e42f-75cc-4e5e-bfc3-e0be1c9e547e.selectorLabels" . | nindent 6 }}
