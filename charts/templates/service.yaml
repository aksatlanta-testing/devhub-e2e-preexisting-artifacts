apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c01c0ee-f439-4508-bd13-72b940aaf3a4.fullname" . }}
  labels:
    {{- include "go-echo3c01c0ee-f439-4508-bd13-72b940aaf3a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c01c0ee-f439-4508-bd13-72b940aaf3a4.selectorLabels" . | nindent 6 }}
