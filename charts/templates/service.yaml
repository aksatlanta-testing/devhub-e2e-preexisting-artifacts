apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof06ecc13-4f6d-45db-b186-b9f1c66ac9df.fullname" . }}
  labels:
    {{- include "go-echof06ecc13-4f6d-45db-b186-b9f1c66ac9df.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof06ecc13-4f6d-45db-b186-b9f1c66ac9df.selectorLabels" . | nindent 6 }}
