apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76e1e337-01be-43e3-b76f-e60d027de89e.fullname" . }}
  labels:
    {{- include "go-echo76e1e337-01be-43e3-b76f-e60d027de89e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76e1e337-01be-43e3-b76f-e60d027de89e.selectorLabels" . | nindent 6 }}
