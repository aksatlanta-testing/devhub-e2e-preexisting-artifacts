apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c68a249-cbd6-45bc-b204-0c816273dd43.fullname" . }}
  labels:
    {{- include "go-echo6c68a249-cbd6-45bc-b204-0c816273dd43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c68a249-cbd6-45bc-b204-0c816273dd43.selectorLabels" . | nindent 6 }}
