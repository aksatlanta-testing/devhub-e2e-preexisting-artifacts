apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e86172d-b173-470b-8949-d448c704ad03.fullname" . }}
  labels:
    {{- include "go-echo5e86172d-b173-470b-8949-d448c704ad03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e86172d-b173-470b-8949-d448c704ad03.selectorLabels" . | nindent 6 }}
