apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo923dbd94-fa78-48ce-bcf1-2cd1a6b1a211.fullname" . }}
  labels:
    {{- include "go-echo923dbd94-fa78-48ce-bcf1-2cd1a6b1a211.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo923dbd94-fa78-48ce-bcf1-2cd1a6b1a211.selectorLabels" . | nindent 6 }}
