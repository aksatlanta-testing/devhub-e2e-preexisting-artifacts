apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41ab3611-bfa2-4ad9-a54c-66778da6ccba.fullname" . }}
  labels:
    {{- include "go-echo41ab3611-bfa2-4ad9-a54c-66778da6ccba.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41ab3611-bfa2-4ad9-a54c-66778da6ccba.selectorLabels" . | nindent 6 }}
