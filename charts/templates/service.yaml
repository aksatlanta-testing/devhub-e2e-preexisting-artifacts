apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c577ea2-dd9e-435a-8f10-58d49c43ed28.fullname" . }}
  labels:
    {{- include "go-echo1c577ea2-dd9e-435a-8f10-58d49c43ed28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c577ea2-dd9e-435a-8f10-58d49c43ed28.selectorLabels" . | nindent 6 }}
