apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9bb3cfb-c984-49e7-8569-be52d555596c.fullname" . }}
  labels:
    {{- include "go-echob9bb3cfb-c984-49e7-8569-be52d555596c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9bb3cfb-c984-49e7-8569-be52d555596c.selectorLabels" . | nindent 6 }}
