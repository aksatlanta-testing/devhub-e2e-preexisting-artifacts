apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo597f4777-3b31-4fda-9c92-b8ed5103edae.fullname" . }}
  labels:
    {{- include "go-echo597f4777-3b31-4fda-9c92-b8ed5103edae.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo597f4777-3b31-4fda-9c92-b8ed5103edae.selectorLabels" . | nindent 6 }}
