apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo724810f3-c261-4e73-a7bf-f47b5cc8bcd2.fullname" . }}
  labels:
    {{- include "go-echo724810f3-c261-4e73-a7bf-f47b5cc8bcd2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo724810f3-c261-4e73-a7bf-f47b5cc8bcd2.selectorLabels" . | nindent 6 }}
