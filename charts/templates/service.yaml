apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9cca2918-4eb5-49a4-ab69-29571d466061.fullname" . }}
  labels:
    {{- include "go-echo9cca2918-4eb5-49a4-ab69-29571d466061.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9cca2918-4eb5-49a4-ab69-29571d466061.selectorLabels" . | nindent 6 }}
