apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob586de84-e5f9-4012-ac47-a6bdd13bf67e.fullname" . }}
  labels:
    {{- include "go-echob586de84-e5f9-4012-ac47-a6bdd13bf67e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob586de84-e5f9-4012-ac47-a6bdd13bf67e.selectorLabels" . | nindent 6 }}
