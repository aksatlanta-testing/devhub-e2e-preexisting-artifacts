apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof571538a-e250-4ee1-bb5a-05be6132a069.fullname" . }}
  labels:
    {{- include "go-echof571538a-e250-4ee1-bb5a-05be6132a069.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof571538a-e250-4ee1-bb5a-05be6132a069.selectorLabels" . | nindent 6 }}
