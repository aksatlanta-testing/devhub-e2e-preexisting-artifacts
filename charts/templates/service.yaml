apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob10d63e6-6bb7-4434-bf95-4c7bbbd23a8b.fullname" . }}
  labels:
    {{- include "go-echob10d63e6-6bb7-4434-bf95-4c7bbbd23a8b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob10d63e6-6bb7-4434-bf95-4c7bbbd23a8b.selectorLabels" . | nindent 6 }}
