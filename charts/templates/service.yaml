apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo319103b6-0b18-4fb2-8112-e60c30794115.fullname" . }}
  labels:
    {{- include "go-echo319103b6-0b18-4fb2-8112-e60c30794115.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo319103b6-0b18-4fb2-8112-e60c30794115.selectorLabels" . | nindent 6 }}
