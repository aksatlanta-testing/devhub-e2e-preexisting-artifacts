apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe74a762e-f06b-43e9-8872-03f00c019b9d.fullname" . }}
  labels:
    {{- include "go-echoe74a762e-f06b-43e9-8872-03f00c019b9d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe74a762e-f06b-43e9-8872-03f00c019b9d.selectorLabels" . | nindent 6 }}
