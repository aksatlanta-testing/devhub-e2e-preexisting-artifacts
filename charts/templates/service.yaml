apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod970c261-e721-4bbf-9404-902f5bb8c949.fullname" . }}
  labels:
    {{- include "go-echod970c261-e721-4bbf-9404-902f5bb8c949.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod970c261-e721-4bbf-9404-902f5bb8c949.selectorLabels" . | nindent 6 }}
