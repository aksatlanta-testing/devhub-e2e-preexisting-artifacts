apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49e33a0e-38fd-4e5c-a27a-40ef78b13bfc.fullname" . }}
  labels:
    {{- include "go-echo49e33a0e-38fd-4e5c-a27a-40ef78b13bfc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49e33a0e-38fd-4e5c-a27a-40ef78b13bfc.selectorLabels" . | nindent 6 }}
