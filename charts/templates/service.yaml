apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a7a4171-93b3-4341-bde0-d5a8d0b9a06f.fullname" . }}
  labels:
    {{- include "go-echo4a7a4171-93b3-4341-bde0-d5a8d0b9a06f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a7a4171-93b3-4341-bde0-d5a8d0b9a06f.selectorLabels" . | nindent 6 }}
