apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73f2974c-3537-4770-a7a4-011ba0500320.fullname" . }}
  labels:
    {{- include "go-echo73f2974c-3537-4770-a7a4-011ba0500320.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73f2974c-3537-4770-a7a4-011ba0500320.selectorLabels" . | nindent 6 }}
