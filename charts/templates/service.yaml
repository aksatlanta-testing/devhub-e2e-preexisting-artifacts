apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c8d5eea-7b6f-406c-9545-468014df990f.fullname" . }}
  labels:
    {{- include "go-echo7c8d5eea-7b6f-406c-9545-468014df990f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c8d5eea-7b6f-406c-9545-468014df990f.selectorLabels" . | nindent 6 }}
