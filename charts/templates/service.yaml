apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf7c7e74-dbd5-4db3-9e03-ab387e6eeeb2.fullname" . }}
  labels:
    {{- include "go-echocf7c7e74-dbd5-4db3-9e03-ab387e6eeeb2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf7c7e74-dbd5-4db3-9e03-ab387e6eeeb2.selectorLabels" . | nindent 6 }}
