apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0170adb-55b2-4161-a86d-f9ed19bd365e.fullname" . }}
  labels:
    {{- include "go-echod0170adb-55b2-4161-a86d-f9ed19bd365e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0170adb-55b2-4161-a86d-f9ed19bd365e.selectorLabels" . | nindent 6 }}
