apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5d90558-bce1-416d-b341-807f9fdf12c2.fullname" . }}
  labels:
    {{- include "go-echoe5d90558-bce1-416d-b341-807f9fdf12c2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5d90558-bce1-416d-b341-807f9fdf12c2.selectorLabels" . | nindent 6 }}
