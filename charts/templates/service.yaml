apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo429409bb-bc1f-48dd-95d3-ee50c76e4690.fullname" . }}
  labels:
    {{- include "go-echo429409bb-bc1f-48dd-95d3-ee50c76e4690.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo429409bb-bc1f-48dd-95d3-ee50c76e4690.selectorLabels" . | nindent 6 }}
