apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc4b4570-85f8-4bdd-aa3f-2e9222e98643.fullname" . }}
  labels:
    {{- include "go-echodc4b4570-85f8-4bdd-aa3f-2e9222e98643.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc4b4570-85f8-4bdd-aa3f-2e9222e98643.selectorLabels" . | nindent 6 }}
