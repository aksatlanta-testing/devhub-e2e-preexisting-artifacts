apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3af541e-6c40-4f30-abfb-686031936074.fullname" . }}
  labels:
    {{- include "go-echoe3af541e-6c40-4f30-abfb-686031936074.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3af541e-6c40-4f30-abfb-686031936074.selectorLabels" . | nindent 6 }}
