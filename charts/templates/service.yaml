apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0688816-00b4-4e84-a037-c79f2636ccfe.fullname" . }}
  labels:
    {{- include "go-echod0688816-00b4-4e84-a037-c79f2636ccfe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0688816-00b4-4e84-a037-c79f2636ccfe.selectorLabels" . | nindent 6 }}
