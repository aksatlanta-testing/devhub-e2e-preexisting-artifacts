apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoddd6d959-b2a3-4da6-8866-bccdc4733864.fullname" . }}
  labels:
    {{- include "go-echoddd6d959-b2a3-4da6-8866-bccdc4733864.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoddd6d959-b2a3-4da6-8866-bccdc4733864.selectorLabels" . | nindent 6 }}
