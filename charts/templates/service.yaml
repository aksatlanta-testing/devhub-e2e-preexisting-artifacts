apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoefbbf7dd-a17b-4a97-aeba-a68ab8a8bb5a.fullname" . }}
  labels:
    {{- include "go-echoefbbf7dd-a17b-4a97-aeba-a68ab8a8bb5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoefbbf7dd-a17b-4a97-aeba-a68ab8a8bb5a.selectorLabels" . | nindent 6 }}
