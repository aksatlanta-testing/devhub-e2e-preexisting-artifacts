apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo078467bc-c747-4236-8b77-318871ab7486.fullname" . }}
  labels:
    {{- include "go-echo078467bc-c747-4236-8b77-318871ab7486.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo078467bc-c747-4236-8b77-318871ab7486.selectorLabels" . | nindent 6 }}
