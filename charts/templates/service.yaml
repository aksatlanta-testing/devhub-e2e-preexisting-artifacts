apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfff0926-2eed-48fe-bbdf-dc05471e3e62.fullname" . }}
  labels:
    {{- include "go-echocfff0926-2eed-48fe-bbdf-dc05471e3e62.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfff0926-2eed-48fe-bbdf-dc05471e3e62.selectorLabels" . | nindent 6 }}
