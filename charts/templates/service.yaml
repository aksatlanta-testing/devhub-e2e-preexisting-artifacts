apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b1207ea-348d-4bae-bbd8-4149b9e0a982.fullname" . }}
  labels:
    {{- include "go-echo0b1207ea-348d-4bae-bbd8-4149b9e0a982.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b1207ea-348d-4bae-bbd8-4149b9e0a982.selectorLabels" . | nindent 6 }}
