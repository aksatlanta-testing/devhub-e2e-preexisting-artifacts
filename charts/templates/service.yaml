apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7036a86d-5662-4008-bc66-865674ab2dc9.fullname" . }}
  labels:
    {{- include "go-echo7036a86d-5662-4008-bc66-865674ab2dc9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7036a86d-5662-4008-bc66-865674ab2dc9.selectorLabels" . | nindent 6 }}
