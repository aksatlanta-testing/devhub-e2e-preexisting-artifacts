apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4240a09-8b10-4d8a-8237-6bc2a577a686.fullname" . }}
  labels:
    {{- include "go-echoe4240a09-8b10-4d8a-8237-6bc2a577a686.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4240a09-8b10-4d8a-8237-6bc2a577a686.selectorLabels" . | nindent 6 }}
