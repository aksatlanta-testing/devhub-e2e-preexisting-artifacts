apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02359f5a-a743-4a3d-ac29-86d26ce2f36f.fullname" . }}
  labels:
    {{- include "go-echo02359f5a-a743-4a3d-ac29-86d26ce2f36f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02359f5a-a743-4a3d-ac29-86d26ce2f36f.selectorLabels" . | nindent 6 }}
