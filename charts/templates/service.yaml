apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80b4281d-e74d-41ea-b5e1-1a42f0772caa.fullname" . }}
  labels:
    {{- include "go-echo80b4281d-e74d-41ea-b5e1-1a42f0772caa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80b4281d-e74d-41ea-b5e1-1a42f0772caa.selectorLabels" . | nindent 6 }}
