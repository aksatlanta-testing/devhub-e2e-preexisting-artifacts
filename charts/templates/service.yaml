apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a664eb6-a835-4160-a629-7543068cfbb4.fullname" . }}
  labels:
    {{- include "go-echo1a664eb6-a835-4160-a629-7543068cfbb4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a664eb6-a835-4160-a629-7543068cfbb4.selectorLabels" . | nindent 6 }}
