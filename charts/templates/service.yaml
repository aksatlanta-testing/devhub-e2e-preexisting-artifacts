apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9ea2c3c-52b3-4f53-9c13-0dfc0cfb8963.fullname" . }}
  labels:
    {{- include "go-echoa9ea2c3c-52b3-4f53-9c13-0dfc0cfb8963.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9ea2c3c-52b3-4f53-9c13-0dfc0cfb8963.selectorLabels" . | nindent 6 }}
