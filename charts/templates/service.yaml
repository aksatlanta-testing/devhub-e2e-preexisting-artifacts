apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5dc88ef-0cfb-446f-a2b9-aea0ccd4a6c5.fullname" . }}
  labels:
    {{- include "go-echof5dc88ef-0cfb-446f-a2b9-aea0ccd4a6c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5dc88ef-0cfb-446f-a2b9-aea0ccd4a6c5.selectorLabels" . | nindent 6 }}
