apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8743c061-08fe-4a46-9b9d-2f82ec32617e.fullname" . }}
  labels:
    {{- include "go-echo8743c061-08fe-4a46-9b9d-2f82ec32617e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8743c061-08fe-4a46-9b9d-2f82ec32617e.selectorLabels" . | nindent 6 }}
