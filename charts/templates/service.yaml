apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod784ea8c-ec7c-4830-bc68-2d9871d0b9fe.fullname" . }}
  labels:
    {{- include "go-echod784ea8c-ec7c-4830-bc68-2d9871d0b9fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod784ea8c-ec7c-4830-bc68-2d9871d0b9fe.selectorLabels" . | nindent 6 }}
