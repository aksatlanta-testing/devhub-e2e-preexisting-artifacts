apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca364091-e574-4e24-b98a-4b86ac647315.fullname" . }}
  labels:
    {{- include "go-echoca364091-e574-4e24-b98a-4b86ac647315.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca364091-e574-4e24-b98a-4b86ac647315.selectorLabels" . | nindent 6 }}
