apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78defdf6-ad93-4e26-b273-6ec4890e7a51.fullname" . }}
  labels:
    {{- include "go-echo78defdf6-ad93-4e26-b273-6ec4890e7a51.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78defdf6-ad93-4e26-b273-6ec4890e7a51.selectorLabels" . | nindent 6 }}
