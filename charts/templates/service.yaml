apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48edc178-2684-41c3-b098-fd206ee2a383.fullname" . }}
  labels:
    {{- include "go-echo48edc178-2684-41c3-b098-fd206ee2a383.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48edc178-2684-41c3-b098-fd206ee2a383.selectorLabels" . | nindent 6 }}
