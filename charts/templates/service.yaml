apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe28e524d-f28a-44cb-8ab0-54e4cf79c421.fullname" . }}
  labels:
    {{- include "go-echoe28e524d-f28a-44cb-8ab0-54e4cf79c421.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe28e524d-f28a-44cb-8ab0-54e4cf79c421.selectorLabels" . | nindent 6 }}
