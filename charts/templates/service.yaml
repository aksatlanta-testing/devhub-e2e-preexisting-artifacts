apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebd2e7cf-5136-4ae5-a677-51c3992b918a.fullname" . }}
  labels:
    {{- include "go-echoebd2e7cf-5136-4ae5-a677-51c3992b918a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebd2e7cf-5136-4ae5-a677-51c3992b918a.selectorLabels" . | nindent 6 }}
