apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94987272-865c-4f41-a498-0e4803380076.fullname" . }}
  labels:
    {{- include "go-echo94987272-865c-4f41-a498-0e4803380076.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94987272-865c-4f41-a498-0e4803380076.selectorLabels" . | nindent 6 }}
