apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3c2b36f-55ad-4828-a31f-b72e335e2c17.fullname" . }}
  labels:
    {{- include "go-echob3c2b36f-55ad-4828-a31f-b72e335e2c17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3c2b36f-55ad-4828-a31f-b72e335e2c17.selectorLabels" . | nindent 6 }}
