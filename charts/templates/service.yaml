apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83de1cf0-5009-42c6-ab0a-e10eab66ae5c.fullname" . }}
  labels:
    {{- include "go-echo83de1cf0-5009-42c6-ab0a-e10eab66ae5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83de1cf0-5009-42c6-ab0a-e10eab66ae5c.selectorLabels" . | nindent 6 }}
