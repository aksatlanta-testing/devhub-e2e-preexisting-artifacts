apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f6770dd-a512-4e0c-8de2-312fa81eab73.fullname" . }}
  labels:
    {{- include "go-echo0f6770dd-a512-4e0c-8de2-312fa81eab73.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f6770dd-a512-4e0c-8de2-312fa81eab73.selectorLabels" . | nindent 6 }}
