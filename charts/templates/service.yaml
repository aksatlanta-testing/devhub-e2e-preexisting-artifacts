apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo518e433a-419b-489b-9173-d57cdedf0d9c.fullname" . }}
  labels:
    {{- include "go-echo518e433a-419b-489b-9173-d57cdedf0d9c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo518e433a-419b-489b-9173-d57cdedf0d9c.selectorLabels" . | nindent 6 }}
