apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo653dcb12-459b-4421-a826-d9a3a327e5a6.fullname" . }}
  labels:
    {{- include "go-echo653dcb12-459b-4421-a826-d9a3a327e5a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo653dcb12-459b-4421-a826-d9a3a327e5a6.selectorLabels" . | nindent 6 }}
