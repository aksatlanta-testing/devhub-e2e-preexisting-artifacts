apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo14e3a90e-506a-4e47-93b2-f16653b7d5f4.fullname" . }}
  labels:
    {{- include "go-echo14e3a90e-506a-4e47-93b2-f16653b7d5f4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo14e3a90e-506a-4e47-93b2-f16653b7d5f4.selectorLabels" . | nindent 6 }}
