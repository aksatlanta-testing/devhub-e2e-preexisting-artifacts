apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocad0e83b-2a59-4a4a-b347-6714052db429.fullname" . }}
  labels:
    {{- include "go-echocad0e83b-2a59-4a4a-b347-6714052db429.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocad0e83b-2a59-4a4a-b347-6714052db429.selectorLabels" . | nindent 6 }}
