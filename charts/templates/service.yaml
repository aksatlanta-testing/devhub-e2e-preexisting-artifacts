apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62fe8c0b-c61f-4c18-b261-87ded3a758b2.fullname" . }}
  labels:
    {{- include "go-echo62fe8c0b-c61f-4c18-b261-87ded3a758b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62fe8c0b-c61f-4c18-b261-87ded3a758b2.selectorLabels" . | nindent 6 }}
