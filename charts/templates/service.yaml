apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6caa1638-7f00-489f-9705-383b240e3103.fullname" . }}
  labels:
    {{- include "go-echo6caa1638-7f00-489f-9705-383b240e3103.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6caa1638-7f00-489f-9705-383b240e3103.selectorLabels" . | nindent 6 }}
