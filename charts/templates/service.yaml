apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f2af130-65e3-481f-8867-3c114e9ad94a.fullname" . }}
  labels:
    {{- include "go-echo8f2af130-65e3-481f-8867-3c114e9ad94a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f2af130-65e3-481f-8867-3c114e9ad94a.selectorLabels" . | nindent 6 }}
