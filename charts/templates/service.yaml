apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd7246ad-1c3a-42ca-b838-b9076fc8e030.fullname" . }}
  labels:
    {{- include "go-echocd7246ad-1c3a-42ca-b838-b9076fc8e030.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd7246ad-1c3a-42ca-b838-b9076fc8e030.selectorLabels" . | nindent 6 }}
