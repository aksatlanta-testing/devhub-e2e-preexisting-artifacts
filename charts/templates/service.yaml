apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fbb275c-99b3-4ff2-b716-fb43d31ec804.fullname" . }}
  labels:
    {{- include "go-echo8fbb275c-99b3-4ff2-b716-fb43d31ec804.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fbb275c-99b3-4ff2-b716-fb43d31ec804.selectorLabels" . | nindent 6 }}
