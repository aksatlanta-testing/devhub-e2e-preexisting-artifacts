apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc65796d3-82f7-4ceb-aa10-7e566d19d81f.fullname" . }}
  labels:
    {{- include "go-echoc65796d3-82f7-4ceb-aa10-7e566d19d81f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc65796d3-82f7-4ceb-aa10-7e566d19d81f.selectorLabels" . | nindent 6 }}
