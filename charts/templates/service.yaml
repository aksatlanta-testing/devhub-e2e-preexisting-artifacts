apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a1a8f4e-d2ad-45ce-9c71-356c9d18f50a.fullname" . }}
  labels:
    {{- include "go-echo4a1a8f4e-d2ad-45ce-9c71-356c9d18f50a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a1a8f4e-d2ad-45ce-9c71-356c9d18f50a.selectorLabels" . | nindent 6 }}
