apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e6c2285-fb48-4b39-a316-ca47e4dc104c.fullname" . }}
  labels:
    {{- include "go-echo3e6c2285-fb48-4b39-a316-ca47e4dc104c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e6c2285-fb48-4b39-a316-ca47e4dc104c.selectorLabels" . | nindent 6 }}
