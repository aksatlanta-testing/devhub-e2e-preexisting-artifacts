apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo364467f9-0056-4225-bfc5-1fac8a951446.fullname" . }}
  labels:
    {{- include "go-echo364467f9-0056-4225-bfc5-1fac8a951446.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo364467f9-0056-4225-bfc5-1fac8a951446.selectorLabels" . | nindent 6 }}
