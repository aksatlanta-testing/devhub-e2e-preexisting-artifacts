apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb321759-481e-4aa4-8063-82a9537cdb25.fullname" . }}
  labels:
    {{- include "go-echodb321759-481e-4aa4-8063-82a9537cdb25.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb321759-481e-4aa4-8063-82a9537cdb25.selectorLabels" . | nindent 6 }}
