apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15c67bac-d0e1-4e41-934f-d2d440434894.fullname" . }}
  labels:
    {{- include "go-echo15c67bac-d0e1-4e41-934f-d2d440434894.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15c67bac-d0e1-4e41-934f-d2d440434894.selectorLabels" . | nindent 6 }}
