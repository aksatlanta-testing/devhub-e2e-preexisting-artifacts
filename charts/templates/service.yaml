apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo033c6e59-7aac-4d1b-b0f8-21dd52325b68.fullname" . }}
  labels:
    {{- include "go-echo033c6e59-7aac-4d1b-b0f8-21dd52325b68.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo033c6e59-7aac-4d1b-b0f8-21dd52325b68.selectorLabels" . | nindent 6 }}
