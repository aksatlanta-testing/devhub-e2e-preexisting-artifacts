apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e38ee6b-98df-46b0-a2c2-bf8c6938cbf3.fullname" . }}
  labels:
    {{- include "go-echo5e38ee6b-98df-46b0-a2c2-bf8c6938cbf3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e38ee6b-98df-46b0-a2c2-bf8c6938cbf3.selectorLabels" . | nindent 6 }}
