apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51b7e435-a512-4842-80c5-be4add77537a.fullname" . }}
  labels:
    {{- include "go-echo51b7e435-a512-4842-80c5-be4add77537a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51b7e435-a512-4842-80c5-be4add77537a.selectorLabels" . | nindent 6 }}
