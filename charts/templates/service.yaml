apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e0d3f8d-f8d9-40dd-8015-1430738f0e58.fullname" . }}
  labels:
    {{- include "go-echo7e0d3f8d-f8d9-40dd-8015-1430738f0e58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e0d3f8d-f8d9-40dd-8015-1430738f0e58.selectorLabels" . | nindent 6 }}
