apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabb94a36-e947-438d-ad55-3614b45df291.fullname" . }}
  labels:
    {{- include "go-echoabb94a36-e947-438d-ad55-3614b45df291.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabb94a36-e947-438d-ad55-3614b45df291.selectorLabels" . | nindent 6 }}
