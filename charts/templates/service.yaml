apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb28284b-4bac-447e-ab97-00573b2e9cb1.fullname" . }}
  labels:
    {{- include "go-echofb28284b-4bac-447e-ab97-00573b2e9cb1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb28284b-4bac-447e-ab97-00573b2e9cb1.selectorLabels" . | nindent 6 }}
