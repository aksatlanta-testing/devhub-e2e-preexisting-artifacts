apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34561409-e471-4b4b-aae8-9b4ae7e221b7.fullname" . }}
  labels:
    {{- include "go-echo34561409-e471-4b4b-aae8-9b4ae7e221b7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34561409-e471-4b4b-aae8-9b4ae7e221b7.selectorLabels" . | nindent 6 }}
