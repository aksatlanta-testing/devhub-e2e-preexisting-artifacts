apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8fa8534-8919-4d09-b465-a4f60c8e48c2.fullname" . }}
  labels:
    {{- include "go-echoc8fa8534-8919-4d09-b465-a4f60c8e48c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8fa8534-8919-4d09-b465-a4f60c8e48c2.selectorLabels" . | nindent 6 }}
