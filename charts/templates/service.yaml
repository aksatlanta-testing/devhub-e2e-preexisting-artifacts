apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo128f732b-6c07-4e1a-949f-01512f3bb5bd.fullname" . }}
  labels:
    {{- include "go-echo128f732b-6c07-4e1a-949f-01512f3bb5bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo128f732b-6c07-4e1a-949f-01512f3bb5bd.selectorLabels" . | nindent 6 }}
