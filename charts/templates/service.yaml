apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fcf9660-6033-4143-bebc-047804e69853.fullname" . }}
  labels:
    {{- include "go-echo4fcf9660-6033-4143-bebc-047804e69853.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fcf9660-6033-4143-bebc-047804e69853.selectorLabels" . | nindent 6 }}
