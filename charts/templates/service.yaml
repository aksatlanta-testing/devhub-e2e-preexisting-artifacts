apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7c8acb3-f01c-41af-b579-6061abfab791.fullname" . }}
  labels:
    {{- include "go-echoc7c8acb3-f01c-41af-b579-6061abfab791.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7c8acb3-f01c-41af-b579-6061abfab791.selectorLabels" . | nindent 6 }}
