apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd7352a7-fb19-433d-8b35-861e4f7dc4ed.fullname" . }}
  labels:
    {{- include "go-echofd7352a7-fb19-433d-8b35-861e4f7dc4ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd7352a7-fb19-433d-8b35-861e4f7dc4ed.selectorLabels" . | nindent 6 }}
