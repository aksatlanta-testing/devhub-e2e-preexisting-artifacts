apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46d13a46-c05c-406a-82b3-ef03d8af1381.fullname" . }}
  labels:
    {{- include "go-echo46d13a46-c05c-406a-82b3-ef03d8af1381.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46d13a46-c05c-406a-82b3-ef03d8af1381.selectorLabels" . | nindent 6 }}
