apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a25c3b6-1171-4843-aae9-edb006175685.fullname" . }}
  labels:
    {{- include "go-echo6a25c3b6-1171-4843-aae9-edb006175685.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a25c3b6-1171-4843-aae9-edb006175685.selectorLabels" . | nindent 6 }}
