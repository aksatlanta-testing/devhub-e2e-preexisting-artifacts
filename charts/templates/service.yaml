apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3bc7a5f1-823f-40cd-8c2d-64662f7222a3.fullname" . }}
  labels:
    {{- include "go-echo3bc7a5f1-823f-40cd-8c2d-64662f7222a3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3bc7a5f1-823f-40cd-8c2d-64662f7222a3.selectorLabels" . | nindent 6 }}
