apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae8645f9-bdfb-44e2-a3b4-6ec6eec268ab.fullname" . }}
  labels:
    {{- include "go-echoae8645f9-bdfb-44e2-a3b4-6ec6eec268ab.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae8645f9-bdfb-44e2-a3b4-6ec6eec268ab.selectorLabels" . | nindent 6 }}
