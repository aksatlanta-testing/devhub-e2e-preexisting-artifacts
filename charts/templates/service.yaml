apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc89bbf32-95be-4b07-9390-45ac7f7b87f6.fullname" . }}
  labels:
    {{- include "go-echoc89bbf32-95be-4b07-9390-45ac7f7b87f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc89bbf32-95be-4b07-9390-45ac7f7b87f6.selectorLabels" . | nindent 6 }}
