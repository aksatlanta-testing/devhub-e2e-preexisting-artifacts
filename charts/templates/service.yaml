apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3031c011-4cba-4ecb-95d8-73f740a35ed7.fullname" . }}
  labels:
    {{- include "go-echo3031c011-4cba-4ecb-95d8-73f740a35ed7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3031c011-4cba-4ecb-95d8-73f740a35ed7.selectorLabels" . | nindent 6 }}
