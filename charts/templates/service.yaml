apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7a2e746-88b4-4cdf-9262-b1a881c4a551.fullname" . }}
  labels:
    {{- include "go-echod7a2e746-88b4-4cdf-9262-b1a881c4a551.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7a2e746-88b4-4cdf-9262-b1a881c4a551.selectorLabels" . | nindent 6 }}
