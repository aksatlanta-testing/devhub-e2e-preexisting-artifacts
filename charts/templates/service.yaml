apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocbd43bf3-d3bc-4ad1-83fe-97b71beb2c5f.fullname" . }}
  labels:
    {{- include "go-echocbd43bf3-d3bc-4ad1-83fe-97b71beb2c5f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocbd43bf3-d3bc-4ad1-83fe-97b71beb2c5f.selectorLabels" . | nindent 6 }}
