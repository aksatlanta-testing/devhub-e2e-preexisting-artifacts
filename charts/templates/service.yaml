apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70d68e11-479a-4dd5-8116-5136eeea1500.fullname" . }}
  labels:
    {{- include "go-echo70d68e11-479a-4dd5-8116-5136eeea1500.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70d68e11-479a-4dd5-8116-5136eeea1500.selectorLabels" . | nindent 6 }}
