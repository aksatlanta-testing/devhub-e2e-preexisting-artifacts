apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43c3b1de-f192-4ed0-95f2-d359e4e185a2.fullname" . }}
  labels:
    {{- include "go-echo43c3b1de-f192-4ed0-95f2-d359e4e185a2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43c3b1de-f192-4ed0-95f2-d359e4e185a2.selectorLabels" . | nindent 6 }}
