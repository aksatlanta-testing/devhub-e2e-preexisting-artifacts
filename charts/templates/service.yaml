apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5f3a2a7-04dd-4bb1-99fe-15165e261a07.fullname" . }}
  labels:
    {{- include "go-echoe5f3a2a7-04dd-4bb1-99fe-15165e261a07.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5f3a2a7-04dd-4bb1-99fe-15165e261a07.selectorLabels" . | nindent 6 }}
