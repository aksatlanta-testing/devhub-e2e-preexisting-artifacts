apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57e71aa0-060f-4147-91bd-e190454e0564.fullname" . }}
  labels:
    {{- include "go-echo57e71aa0-060f-4147-91bd-e190454e0564.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57e71aa0-060f-4147-91bd-e190454e0564.selectorLabels" . | nindent 6 }}
