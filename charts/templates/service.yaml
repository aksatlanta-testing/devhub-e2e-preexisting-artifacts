apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc82a6d34-f20d-43ea-aad8-5bb96375ff10.fullname" . }}
  labels:
    {{- include "go-echoc82a6d34-f20d-43ea-aad8-5bb96375ff10.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc82a6d34-f20d-43ea-aad8-5bb96375ff10.selectorLabels" . | nindent 6 }}
