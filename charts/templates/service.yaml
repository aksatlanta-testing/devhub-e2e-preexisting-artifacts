apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo054c10ef-3ee5-4cc9-93d4-6f387ac9f8d7.fullname" . }}
  labels:
    {{- include "go-echo054c10ef-3ee5-4cc9-93d4-6f387ac9f8d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo054c10ef-3ee5-4cc9-93d4-6f387ac9f8d7.selectorLabels" . | nindent 6 }}
