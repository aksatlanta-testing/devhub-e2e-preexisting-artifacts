apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48747ee9-b85c-4dea-8e46-f2636be3e845.fullname" . }}
  labels:
    {{- include "go-echo48747ee9-b85c-4dea-8e46-f2636be3e845.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48747ee9-b85c-4dea-8e46-f2636be3e845.selectorLabels" . | nindent 6 }}
