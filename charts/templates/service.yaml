apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b62a03a-c278-4837-a48d-ed8813aaad1f.fullname" . }}
  labels:
    {{- include "go-echo4b62a03a-c278-4837-a48d-ed8813aaad1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b62a03a-c278-4837-a48d-ed8813aaad1f.selectorLabels" . | nindent 6 }}
