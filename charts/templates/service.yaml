apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a91c7ba-6433-460f-966a-59d2446b64f9.fullname" . }}
  labels:
    {{- include "go-echo0a91c7ba-6433-460f-966a-59d2446b64f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a91c7ba-6433-460f-966a-59d2446b64f9.selectorLabels" . | nindent 6 }}
