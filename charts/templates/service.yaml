apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28cf65fb-d8e3-456f-821b-4ac353623a00.fullname" . }}
  labels:
    {{- include "go-echo28cf65fb-d8e3-456f-821b-4ac353623a00.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28cf65fb-d8e3-456f-821b-4ac353623a00.selectorLabels" . | nindent 6 }}
