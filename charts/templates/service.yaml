apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6d68a91-9ae6-4c74-adbf-1a0582bd8865.fullname" . }}
  labels:
    {{- include "go-echod6d68a91-9ae6-4c74-adbf-1a0582bd8865.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6d68a91-9ae6-4c74-adbf-1a0582bd8865.selectorLabels" . | nindent 6 }}
