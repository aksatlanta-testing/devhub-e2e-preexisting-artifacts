apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfe42e3c-e399-4c18-9d75-52b43c11da70.fullname" . }}
  labels:
    {{- include "go-echocfe42e3c-e399-4c18-9d75-52b43c11da70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfe42e3c-e399-4c18-9d75-52b43c11da70.selectorLabels" . | nindent 6 }}
