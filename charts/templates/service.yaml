apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba474ffe-6bfe-439a-8787-e0251adf0dcc.fullname" . }}
  labels:
    {{- include "go-echoba474ffe-6bfe-439a-8787-e0251adf0dcc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba474ffe-6bfe-439a-8787-e0251adf0dcc.selectorLabels" . | nindent 6 }}
