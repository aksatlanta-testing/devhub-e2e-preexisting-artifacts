apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0c7daf7c-563e-4df4-8872-ae0017c0768d.fullname" . }}
  labels:
    {{- include "go-echo0c7daf7c-563e-4df4-8872-ae0017c0768d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0c7daf7c-563e-4df4-8872-ae0017c0768d.selectorLabels" . | nindent 6 }}
