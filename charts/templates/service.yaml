apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67e533c1-ac13-4420-abc1-ba9e388caf19.fullname" . }}
  labels:
    {{- include "go-echo67e533c1-ac13-4420-abc1-ba9e388caf19.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67e533c1-ac13-4420-abc1-ba9e388caf19.selectorLabels" . | nindent 6 }}
