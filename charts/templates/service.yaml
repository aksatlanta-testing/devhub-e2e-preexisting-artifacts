apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod38c486d-2708-4f99-8408-282a4ee86bbd.fullname" . }}
  labels:
    {{- include "go-echod38c486d-2708-4f99-8408-282a4ee86bbd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod38c486d-2708-4f99-8408-282a4ee86bbd.selectorLabels" . | nindent 6 }}
