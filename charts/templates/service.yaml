apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47eaf0c5-c359-4cd6-8a2a-643db5273399.fullname" . }}
  labels:
    {{- include "go-echo47eaf0c5-c359-4cd6-8a2a-643db5273399.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47eaf0c5-c359-4cd6-8a2a-643db5273399.selectorLabels" . | nindent 6 }}
