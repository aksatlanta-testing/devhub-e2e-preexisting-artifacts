apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo655dc357-6011-44ee-9b4c-d33021b9cad2.fullname" . }}
  labels:
    {{- include "go-echo655dc357-6011-44ee-9b4c-d33021b9cad2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo655dc357-6011-44ee-9b4c-d33021b9cad2.selectorLabels" . | nindent 6 }}
