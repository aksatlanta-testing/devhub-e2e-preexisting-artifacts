apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9da3408-4d1b-404a-8f9a-d8c14585f082.fullname" . }}
  labels:
    {{- include "go-echoa9da3408-4d1b-404a-8f9a-d8c14585f082.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9da3408-4d1b-404a-8f9a-d8c14585f082.selectorLabels" . | nindent 6 }}
