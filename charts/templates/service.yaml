apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf1b62f1-e4b9-4afe-91d4-eb1d9c6b9684.fullname" . }}
  labels:
    {{- include "go-echoaf1b62f1-e4b9-4afe-91d4-eb1d9c6b9684.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf1b62f1-e4b9-4afe-91d4-eb1d9c6b9684.selectorLabels" . | nindent 6 }}
