apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63294465-015d-4523-a88e-ea95489af0bd.fullname" . }}
  labels:
    {{- include "go-echo63294465-015d-4523-a88e-ea95489af0bd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63294465-015d-4523-a88e-ea95489af0bd.selectorLabels" . | nindent 6 }}
