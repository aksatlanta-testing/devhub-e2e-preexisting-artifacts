apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5f6e731-7e0c-4088-b9b6-799bd23c2428.fullname" . }}
  labels:
    {{- include "go-echoc5f6e731-7e0c-4088-b9b6-799bd23c2428.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5f6e731-7e0c-4088-b9b6-799bd23c2428.selectorLabels" . | nindent 6 }}
