apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07c59dc4-1b12-48ae-8b58-aea81444ab12.fullname" . }}
  labels:
    {{- include "go-echo07c59dc4-1b12-48ae-8b58-aea81444ab12.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07c59dc4-1b12-48ae-8b58-aea81444ab12.selectorLabels" . | nindent 6 }}
