apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba0fe335-9bcf-4a04-938f-99e3842134f9.fullname" . }}
  labels:
    {{- include "go-echoba0fe335-9bcf-4a04-938f-99e3842134f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba0fe335-9bcf-4a04-938f-99e3842134f9.selectorLabels" . | nindent 6 }}
