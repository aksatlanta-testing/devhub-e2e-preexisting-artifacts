apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23c82edd-9beb-4c52-a1d4-bfd4ecdf2912.fullname" . }}
  labels:
    {{- include "go-echo23c82edd-9beb-4c52-a1d4-bfd4ecdf2912.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23c82edd-9beb-4c52-a1d4-bfd4ecdf2912.selectorLabels" . | nindent 6 }}
