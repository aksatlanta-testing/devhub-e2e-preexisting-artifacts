apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff5f0a75-8e19-4889-92f2-4ec01c5743f2.fullname" . }}
  labels:
    {{- include "go-echoff5f0a75-8e19-4889-92f2-4ec01c5743f2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff5f0a75-8e19-4889-92f2-4ec01c5743f2.selectorLabels" . | nindent 6 }}
