apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e9aed69-b8f6-4fea-8baf-b3e3724100f5.fullname" . }}
  labels:
    {{- include "go-echo8e9aed69-b8f6-4fea-8baf-b3e3724100f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e9aed69-b8f6-4fea-8baf-b3e3724100f5.selectorLabels" . | nindent 6 }}
