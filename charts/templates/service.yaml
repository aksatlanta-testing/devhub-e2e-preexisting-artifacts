apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1030d53-bf1c-42b8-a1ea-90bf23c985b3.fullname" . }}
  labels:
    {{- include "go-echoa1030d53-bf1c-42b8-a1ea-90bf23c985b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1030d53-bf1c-42b8-a1ea-90bf23c985b3.selectorLabels" . | nindent 6 }}
