apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob212d85d-3174-4649-ade2-6129a0e49635.fullname" . }}
  labels:
    {{- include "go-echob212d85d-3174-4649-ade2-6129a0e49635.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob212d85d-3174-4649-ade2-6129a0e49635.selectorLabels" . | nindent 6 }}
