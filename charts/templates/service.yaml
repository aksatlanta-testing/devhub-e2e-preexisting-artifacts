apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob455912f-307f-486f-bbe7-3890972f2c1f.fullname" . }}
  labels:
    {{- include "go-echob455912f-307f-486f-bbe7-3890972f2c1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob455912f-307f-486f-bbe7-3890972f2c1f.selectorLabels" . | nindent 6 }}
