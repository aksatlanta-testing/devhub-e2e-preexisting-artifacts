apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea353897-070d-42e2-a171-3964537d6634.fullname" . }}
  labels:
    {{- include "go-echoea353897-070d-42e2-a171-3964537d6634.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea353897-070d-42e2-a171-3964537d6634.selectorLabels" . | nindent 6 }}
