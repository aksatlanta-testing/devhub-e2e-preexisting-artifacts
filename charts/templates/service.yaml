apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2689e6d-601d-49f8-a8e3-113d7711ef24.fullname" . }}
  labels:
    {{- include "go-echoe2689e6d-601d-49f8-a8e3-113d7711ef24.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2689e6d-601d-49f8-a8e3-113d7711ef24.selectorLabels" . | nindent 6 }}
