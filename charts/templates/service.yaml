apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff1da199-26c8-4c66-9c69-4ae8f39cd7e6.fullname" . }}
  labels:
    {{- include "go-echoff1da199-26c8-4c66-9c69-4ae8f39cd7e6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff1da199-26c8-4c66-9c69-4ae8f39cd7e6.selectorLabels" . | nindent 6 }}
