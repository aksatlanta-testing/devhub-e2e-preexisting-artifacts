apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0aa7674e-816a-4920-9a53-25df0fe5e67c.fullname" . }}
  labels:
    {{- include "go-echo0aa7674e-816a-4920-9a53-25df0fe5e67c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0aa7674e-816a-4920-9a53-25df0fe5e67c.selectorLabels" . | nindent 6 }}
