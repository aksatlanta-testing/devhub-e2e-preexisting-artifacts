apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4dd829f1-5d3f-4f69-98d6-6d6fcbf3047e.fullname" . }}
  labels:
    {{- include "go-echo4dd829f1-5d3f-4f69-98d6-6d6fcbf3047e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4dd829f1-5d3f-4f69-98d6-6d6fcbf3047e.selectorLabels" . | nindent 6 }}
