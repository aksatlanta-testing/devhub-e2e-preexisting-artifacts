apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3112abd8-9226-4207-9aaa-cb9a398cbdac.fullname" . }}
  labels:
    {{- include "go-echo3112abd8-9226-4207-9aaa-cb9a398cbdac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3112abd8-9226-4207-9aaa-cb9a398cbdac.selectorLabels" . | nindent 6 }}
