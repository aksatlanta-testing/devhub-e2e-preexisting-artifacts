apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20197845-cccd-4c4a-a7c3-ffa1ca8cc303.fullname" . }}
  labels:
    {{- include "go-echo20197845-cccd-4c4a-a7c3-ffa1ca8cc303.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20197845-cccd-4c4a-a7c3-ffa1ca8cc303.selectorLabels" . | nindent 6 }}
