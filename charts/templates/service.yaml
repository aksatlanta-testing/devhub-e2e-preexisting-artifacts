apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fa52862-c705-4bf2-b0e4-4983a9d20fd6.fullname" . }}
  labels:
    {{- include "go-echo4fa52862-c705-4bf2-b0e4-4983a9d20fd6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fa52862-c705-4bf2-b0e4-4983a9d20fd6.selectorLabels" . | nindent 6 }}
