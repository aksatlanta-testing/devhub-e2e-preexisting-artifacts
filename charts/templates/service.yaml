apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9f3d506-fb1e-4255-b159-aa7d2e675e34.fullname" . }}
  labels:
    {{- include "go-echoa9f3d506-fb1e-4255-b159-aa7d2e675e34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9f3d506-fb1e-4255-b159-aa7d2e675e34.selectorLabels" . | nindent 6 }}
