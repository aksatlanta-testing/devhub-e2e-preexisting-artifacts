apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0eb92d27-6d95-4a98-ac3c-be28d35d498e.fullname" . }}
  labels:
    {{- include "go-echo0eb92d27-6d95-4a98-ac3c-be28d35d498e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0eb92d27-6d95-4a98-ac3c-be28d35d498e.selectorLabels" . | nindent 6 }}
