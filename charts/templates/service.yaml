apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe82031e4-d9b8-4d5e-b077-a508f361218a.fullname" . }}
  labels:
    {{- include "go-echoe82031e4-d9b8-4d5e-b077-a508f361218a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe82031e4-d9b8-4d5e-b077-a508f361218a.selectorLabels" . | nindent 6 }}
