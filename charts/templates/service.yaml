apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35cce74d-7e69-468c-a4b9-4ff106859a76.fullname" . }}
  labels:
    {{- include "go-echo35cce74d-7e69-468c-a4b9-4ff106859a76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35cce74d-7e69-468c-a4b9-4ff106859a76.selectorLabels" . | nindent 6 }}
