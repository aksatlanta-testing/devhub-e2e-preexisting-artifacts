apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4de8bbaa-ef90-4b2b-aa30-66b2ee42a48c.fullname" . }}
  labels:
    {{- include "go-echo4de8bbaa-ef90-4b2b-aa30-66b2ee42a48c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4de8bbaa-ef90-4b2b-aa30-66b2ee42a48c.selectorLabels" . | nindent 6 }}
