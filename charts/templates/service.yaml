apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1dcb5aa-3df7-4649-a9c4-307267ae77b5.fullname" . }}
  labels:
    {{- include "go-echoc1dcb5aa-3df7-4649-a9c4-307267ae77b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1dcb5aa-3df7-4649-a9c4-307267ae77b5.selectorLabels" . | nindent 6 }}
