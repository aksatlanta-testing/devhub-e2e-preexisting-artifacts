apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77bf032a-02f8-44b8-b443-fd742e0353b7.fullname" . }}
  labels:
    {{- include "go-echo77bf032a-02f8-44b8-b443-fd742e0353b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77bf032a-02f8-44b8-b443-fd742e0353b7.selectorLabels" . | nindent 6 }}
