apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fcbe5a1-521c-45b7-b2d2-e53587e34cd6.fullname" . }}
  labels:
    {{- include "go-echo9fcbe5a1-521c-45b7-b2d2-e53587e34cd6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fcbe5a1-521c-45b7-b2d2-e53587e34cd6.selectorLabels" . | nindent 6 }}
