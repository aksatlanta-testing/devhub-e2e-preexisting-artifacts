apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo222d0ff5-d501-455a-a4a1-771da4fb9dc6.fullname" . }}
  labels:
    {{- include "go-echo222d0ff5-d501-455a-a4a1-771da4fb9dc6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo222d0ff5-d501-455a-a4a1-771da4fb9dc6.selectorLabels" . | nindent 6 }}
