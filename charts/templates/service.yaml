apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac16ffa3-cb3d-4e43-9ad9-51c75b311c89.fullname" . }}
  labels:
    {{- include "go-echoac16ffa3-cb3d-4e43-9ad9-51c75b311c89.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac16ffa3-cb3d-4e43-9ad9-51c75b311c89.selectorLabels" . | nindent 6 }}
