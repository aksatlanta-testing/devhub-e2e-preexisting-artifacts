apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc30fb901-279c-4528-882d-3faccddd3a95.fullname" . }}
  labels:
    {{- include "go-echoc30fb901-279c-4528-882d-3faccddd3a95.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc30fb901-279c-4528-882d-3faccddd3a95.selectorLabels" . | nindent 6 }}
