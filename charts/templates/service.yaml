apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3a899bb-778a-4e68-8573-c02e010cfcf1.fullname" . }}
  labels:
    {{- include "go-echoe3a899bb-778a-4e68-8573-c02e010cfcf1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3a899bb-778a-4e68-8573-c02e010cfcf1.selectorLabels" . | nindent 6 }}
