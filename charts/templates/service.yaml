apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1574b794-2779-4421-aacf-0c09b17d027b.fullname" . }}
  labels:
    {{- include "go-echo1574b794-2779-4421-aacf-0c09b17d027b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1574b794-2779-4421-aacf-0c09b17d027b.selectorLabels" . | nindent 6 }}
