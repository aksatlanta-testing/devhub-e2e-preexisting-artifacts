apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d400c85-d4de-49cc-94b7-6adfe5f54738.fullname" . }}
  labels:
    {{- include "go-echo8d400c85-d4de-49cc-94b7-6adfe5f54738.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d400c85-d4de-49cc-94b7-6adfe5f54738.selectorLabels" . | nindent 6 }}
