apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo103c1446-5557-4ad7-badb-f9bba8a4aeac.fullname" . }}
  labels:
    {{- include "go-echo103c1446-5557-4ad7-badb-f9bba8a4aeac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo103c1446-5557-4ad7-badb-f9bba8a4aeac.selectorLabels" . | nindent 6 }}
