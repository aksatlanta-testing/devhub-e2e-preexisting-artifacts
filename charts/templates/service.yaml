apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6687e214-ac53-40e9-92fb-83337b6a5dab.fullname" . }}
  labels:
    {{- include "go-echo6687e214-ac53-40e9-92fb-83337b6a5dab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6687e214-ac53-40e9-92fb-83337b6a5dab.selectorLabels" . | nindent 6 }}
