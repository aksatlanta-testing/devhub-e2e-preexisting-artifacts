apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo083e57bf-d275-4424-b5f6-8020f19c2d7d.fullname" . }}
  labels:
    {{- include "go-echo083e57bf-d275-4424-b5f6-8020f19c2d7d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo083e57bf-d275-4424-b5f6-8020f19c2d7d.selectorLabels" . | nindent 6 }}
