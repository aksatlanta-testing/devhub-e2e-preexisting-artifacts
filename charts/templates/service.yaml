apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc71d26b7-c85e-47ce-8016-76d9f4f768e7.fullname" . }}
  labels:
    {{- include "go-echoc71d26b7-c85e-47ce-8016-76d9f4f768e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc71d26b7-c85e-47ce-8016-76d9f4f768e7.selectorLabels" . | nindent 6 }}
