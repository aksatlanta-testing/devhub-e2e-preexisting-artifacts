apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6936288-2e1a-4091-8d41-e13bc6afa65b.fullname" . }}
  labels:
    {{- include "go-echof6936288-2e1a-4091-8d41-e13bc6afa65b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6936288-2e1a-4091-8d41-e13bc6afa65b.selectorLabels" . | nindent 6 }}
