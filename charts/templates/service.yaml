apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof65730f7-67b6-4470-915a-02636ea87a65.fullname" . }}
  labels:
    {{- include "go-echof65730f7-67b6-4470-915a-02636ea87a65.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof65730f7-67b6-4470-915a-02636ea87a65.selectorLabels" . | nindent 6 }}
