apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a099e85-485a-46d8-ae4e-b6f2b2383222.fullname" . }}
  labels:
    {{- include "go-echo3a099e85-485a-46d8-ae4e-b6f2b2383222.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a099e85-485a-46d8-ae4e-b6f2b2383222.selectorLabels" . | nindent 6 }}
