apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob549fe45-7328-4b3a-9c6e-87d461784579.fullname" . }}
  labels:
    {{- include "go-echob549fe45-7328-4b3a-9c6e-87d461784579.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob549fe45-7328-4b3a-9c6e-87d461784579.selectorLabels" . | nindent 6 }}
