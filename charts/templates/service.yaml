apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c5f6156-5a53-4fdd-b722-b63a9856ad5e.fullname" . }}
  labels:
    {{- include "go-echo7c5f6156-5a53-4fdd-b722-b63a9856ad5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c5f6156-5a53-4fdd-b722-b63a9856ad5e.selectorLabels" . | nindent 6 }}
