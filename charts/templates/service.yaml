apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b703f51-b21d-4b32-999f-64d766f0c7f3.fullname" . }}
  labels:
    {{- include "go-echo3b703f51-b21d-4b32-999f-64d766f0c7f3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b703f51-b21d-4b32-999f-64d766f0c7f3.selectorLabels" . | nindent 6 }}
