apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo404ca464-e99a-4de8-b7fb-cc20e17c47bb.fullname" . }}
  labels:
    {{- include "go-echo404ca464-e99a-4de8-b7fb-cc20e17c47bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo404ca464-e99a-4de8-b7fb-cc20e17c47bb.selectorLabels" . | nindent 6 }}
