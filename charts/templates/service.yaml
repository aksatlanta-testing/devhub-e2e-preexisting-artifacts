apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1c8d50b-df78-41a2-bd51-9d010bf6b624.fullname" . }}
  labels:
    {{- include "go-echob1c8d50b-df78-41a2-bd51-9d010bf6b624.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1c8d50b-df78-41a2-bd51-9d010bf6b624.selectorLabels" . | nindent 6 }}
