apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d8662dc-ad85-4e2c-9927-f2de1f1014d9.fullname" . }}
  labels:
    {{- include "go-echo7d8662dc-ad85-4e2c-9927-f2de1f1014d9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d8662dc-ad85-4e2c-9927-f2de1f1014d9.selectorLabels" . | nindent 6 }}
