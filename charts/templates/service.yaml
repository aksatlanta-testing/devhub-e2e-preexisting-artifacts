apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8d92683-0564-48c3-b0d8-da0e178d866d.fullname" . }}
  labels:
    {{- include "go-echof8d92683-0564-48c3-b0d8-da0e178d866d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8d92683-0564-48c3-b0d8-da0e178d866d.selectorLabels" . | nindent 6 }}
