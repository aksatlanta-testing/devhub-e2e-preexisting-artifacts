apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3d6961b-e0d7-4496-9b42-bce7129dc351.fullname" . }}
  labels:
    {{- include "go-echob3d6961b-e0d7-4496-9b42-bce7129dc351.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3d6961b-e0d7-4496-9b42-bce7129dc351.selectorLabels" . | nindent 6 }}
