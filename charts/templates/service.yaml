apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e8913e1-d953-459c-8662-e80865977532.fullname" . }}
  labels:
    {{- include "go-echo1e8913e1-d953-459c-8662-e80865977532.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e8913e1-d953-459c-8662-e80865977532.selectorLabels" . | nindent 6 }}
