apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18517dbf-e7fc-4e1c-ad48-fe4d43b0f6a3.fullname" . }}
  labels:
    {{- include "go-echo18517dbf-e7fc-4e1c-ad48-fe4d43b0f6a3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18517dbf-e7fc-4e1c-ad48-fe4d43b0f6a3.selectorLabels" . | nindent 6 }}
