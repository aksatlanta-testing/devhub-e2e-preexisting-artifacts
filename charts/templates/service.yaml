apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4be33d4-4d73-4b31-98ae-d988bbb506b9.fullname" . }}
  labels:
    {{- include "go-echoa4be33d4-4d73-4b31-98ae-d988bbb506b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4be33d4-4d73-4b31-98ae-d988bbb506b9.selectorLabels" . | nindent 6 }}
