apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f71f9cc-c1a3-4498-816f-9894c4a60d0d.fullname" . }}
  labels:
    {{- include "go-echo5f71f9cc-c1a3-4498-816f-9894c4a60d0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f71f9cc-c1a3-4498-816f-9894c4a60d0d.selectorLabels" . | nindent 6 }}
