apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b4ef189-a6c0-4a8d-846e-01c2e70f5fe9.fullname" . }}
  labels:
    {{- include "go-echo7b4ef189-a6c0-4a8d-846e-01c2e70f5fe9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b4ef189-a6c0-4a8d-846e-01c2e70f5fe9.selectorLabels" . | nindent 6 }}
