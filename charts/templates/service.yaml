apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49279a7b-66b3-472f-ad13-e260a27e47b7.fullname" . }}
  labels:
    {{- include "go-echo49279a7b-66b3-472f-ad13-e260a27e47b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49279a7b-66b3-472f-ad13-e260a27e47b7.selectorLabels" . | nindent 6 }}
