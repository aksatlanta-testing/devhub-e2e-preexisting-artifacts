apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7144744b-97f1-4286-89d2-3ea9d09b4918.fullname" . }}
  labels:
    {{- include "go-echo7144744b-97f1-4286-89d2-3ea9d09b4918.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7144744b-97f1-4286-89d2-3ea9d09b4918.selectorLabels" . | nindent 6 }}
