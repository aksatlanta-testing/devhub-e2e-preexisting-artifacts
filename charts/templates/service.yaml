apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15f0bda1-7adf-4b81-9db7-d9f233fc3f50.fullname" . }}
  labels:
    {{- include "go-echo15f0bda1-7adf-4b81-9db7-d9f233fc3f50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15f0bda1-7adf-4b81-9db7-d9f233fc3f50.selectorLabels" . | nindent 6 }}
