apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06ac6b04-f33c-4525-88b2-035d115ecd3d.fullname" . }}
  labels:
    {{- include "go-echo06ac6b04-f33c-4525-88b2-035d115ecd3d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06ac6b04-f33c-4525-88b2-035d115ecd3d.selectorLabels" . | nindent 6 }}
