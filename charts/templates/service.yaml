apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72e3ff1f-89cf-4db1-b9a4-be33ddb11cc7.fullname" . }}
  labels:
    {{- include "go-echo72e3ff1f-89cf-4db1-b9a4-be33ddb11cc7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72e3ff1f-89cf-4db1-b9a4-be33ddb11cc7.selectorLabels" . | nindent 6 }}
