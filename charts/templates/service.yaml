apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d4bf38f-af50-459c-953a-65224d70f391.fullname" . }}
  labels:
    {{- include "go-echo9d4bf38f-af50-459c-953a-65224d70f391.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d4bf38f-af50-459c-953a-65224d70f391.selectorLabels" . | nindent 6 }}
