apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc4e3972-7366-4954-9585-6bcdd8aa0d00.fullname" . }}
  labels:
    {{- include "go-echodc4e3972-7366-4954-9585-6bcdd8aa0d00.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc4e3972-7366-4954-9585-6bcdd8aa0d00.selectorLabels" . | nindent 6 }}
