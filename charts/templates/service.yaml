apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof09efcc2-5387-466c-ab59-3f8f2a40f64a.fullname" . }}
  labels:
    {{- include "go-echof09efcc2-5387-466c-ab59-3f8f2a40f64a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof09efcc2-5387-466c-ab59-3f8f2a40f64a.selectorLabels" . | nindent 6 }}
