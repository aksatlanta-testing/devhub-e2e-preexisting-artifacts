apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ad6061e-7196-4ecc-b70e-4b056273f704.fullname" . }}
  labels:
    {{- include "go-echo3ad6061e-7196-4ecc-b70e-4b056273f704.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ad6061e-7196-4ecc-b70e-4b056273f704.selectorLabels" . | nindent 6 }}
