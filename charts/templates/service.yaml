apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3be3bc8b-1a5a-4147-ad44-0a008d624df3.fullname" . }}
  labels:
    {{- include "go-echo3be3bc8b-1a5a-4147-ad44-0a008d624df3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3be3bc8b-1a5a-4147-ad44-0a008d624df3.selectorLabels" . | nindent 6 }}
