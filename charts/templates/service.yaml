apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo990b89bc-3b02-47bd-8a19-58258ca7488c.fullname" . }}
  labels:
    {{- include "go-echo990b89bc-3b02-47bd-8a19-58258ca7488c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo990b89bc-3b02-47bd-8a19-58258ca7488c.selectorLabels" . | nindent 6 }}
