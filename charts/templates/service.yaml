apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76b4aa0a-f87b-4520-853d-006ab6ee6f3a.fullname" . }}
  labels:
    {{- include "go-echo76b4aa0a-f87b-4520-853d-006ab6ee6f3a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76b4aa0a-f87b-4520-853d-006ab6ee6f3a.selectorLabels" . | nindent 6 }}
