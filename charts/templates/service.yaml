apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65f43914-12ee-48cf-b72c-f6ca16d9c569.fullname" . }}
  labels:
    {{- include "go-echo65f43914-12ee-48cf-b72c-f6ca16d9c569.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65f43914-12ee-48cf-b72c-f6ca16d9c569.selectorLabels" . | nindent 6 }}
