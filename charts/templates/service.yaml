apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9479dc91-2b18-42a6-8ad1-5bf5c6e5dcbc.fullname" . }}
  labels:
    {{- include "go-echo9479dc91-2b18-42a6-8ad1-5bf5c6e5dcbc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9479dc91-2b18-42a6-8ad1-5bf5c6e5dcbc.selectorLabels" . | nindent 6 }}
