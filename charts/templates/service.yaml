apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74ea9997-a0b2-4b8a-844e-6099f86849a0.fullname" . }}
  labels:
    {{- include "go-echo74ea9997-a0b2-4b8a-844e-6099f86849a0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74ea9997-a0b2-4b8a-844e-6099f86849a0.selectorLabels" . | nindent 6 }}
