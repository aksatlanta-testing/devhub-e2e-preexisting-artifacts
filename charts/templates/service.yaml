apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4c31061-49a4-4f1d-a65f-837b4a763850.fullname" . }}
  labels:
    {{- include "go-echoe4c31061-49a4-4f1d-a65f-837b4a763850.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4c31061-49a4-4f1d-a65f-837b4a763850.selectorLabels" . | nindent 6 }}
