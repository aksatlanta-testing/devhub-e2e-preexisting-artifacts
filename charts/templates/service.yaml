apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bee99cf-b2f2-4a3e-b65e-49399cf24c72.fullname" . }}
  labels:
    {{- include "go-echo0bee99cf-b2f2-4a3e-b65e-49399cf24c72.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bee99cf-b2f2-4a3e-b65e-49399cf24c72.selectorLabels" . | nindent 6 }}
