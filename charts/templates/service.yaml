apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a655fff-094d-48e2-9bfc-42076174bd75.fullname" . }}
  labels:
    {{- include "go-echo9a655fff-094d-48e2-9bfc-42076174bd75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a655fff-094d-48e2-9bfc-42076174bd75.selectorLabels" . | nindent 6 }}
