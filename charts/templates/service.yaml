apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19e1f6ad-c5be-4dd4-a353-ba57318418f9.fullname" . }}
  labels:
    {{- include "go-echo19e1f6ad-c5be-4dd4-a353-ba57318418f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19e1f6ad-c5be-4dd4-a353-ba57318418f9.selectorLabels" . | nindent 6 }}
