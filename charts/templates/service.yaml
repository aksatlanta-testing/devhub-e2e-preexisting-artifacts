apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29be6aa8-1c84-4955-bd8c-0f4fb1e7996b.fullname" . }}
  labels:
    {{- include "go-echo29be6aa8-1c84-4955-bd8c-0f4fb1e7996b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29be6aa8-1c84-4955-bd8c-0f4fb1e7996b.selectorLabels" . | nindent 6 }}
