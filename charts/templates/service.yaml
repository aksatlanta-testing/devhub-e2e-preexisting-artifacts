apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb561cc2-bd4d-4243-b73e-26ac934e01cc.fullname" . }}
  labels:
    {{- include "go-echocb561cc2-bd4d-4243-b73e-26ac934e01cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb561cc2-bd4d-4243-b73e-26ac934e01cc.selectorLabels" . | nindent 6 }}
