apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88a0690e-4ea0-47c1-91e1-760f0e844f19.fullname" . }}
  labels:
    {{- include "go-echo88a0690e-4ea0-47c1-91e1-760f0e844f19.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88a0690e-4ea0-47c1-91e1-760f0e844f19.selectorLabels" . | nindent 6 }}
