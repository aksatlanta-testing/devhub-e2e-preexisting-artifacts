apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod05af802-0534-4770-b910-8738f47bdcf9.fullname" . }}
  labels:
    {{- include "go-echod05af802-0534-4770-b910-8738f47bdcf9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod05af802-0534-4770-b910-8738f47bdcf9.selectorLabels" . | nindent 6 }}
