apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo046d7b27-7800-4e31-b43e-0a842c0e0578.fullname" . }}
  labels:
    {{- include "go-echo046d7b27-7800-4e31-b43e-0a842c0e0578.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo046d7b27-7800-4e31-b43e-0a842c0e0578.selectorLabels" . | nindent 6 }}
