apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe46b256a-5785-4f3f-8f97-939030d9a6b5.fullname" . }}
  labels:
    {{- include "go-echoe46b256a-5785-4f3f-8f97-939030d9a6b5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe46b256a-5785-4f3f-8f97-939030d9a6b5.selectorLabels" . | nindent 6 }}
