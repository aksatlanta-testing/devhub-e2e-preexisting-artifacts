apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ecea4f7-8852-4ad1-adea-6fe4eea44093.fullname" . }}
  labels:
    {{- include "go-echo6ecea4f7-8852-4ad1-adea-6fe4eea44093.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ecea4f7-8852-4ad1-adea-6fe4eea44093.selectorLabels" . | nindent 6 }}
