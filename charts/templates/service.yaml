apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5c3df9e-4d9f-4fbc-ac6b-2cc6a7ee1eed.fullname" . }}
  labels:
    {{- include "go-echof5c3df9e-4d9f-4fbc-ac6b-2cc6a7ee1eed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5c3df9e-4d9f-4fbc-ac6b-2cc6a7ee1eed.selectorLabels" . | nindent 6 }}
