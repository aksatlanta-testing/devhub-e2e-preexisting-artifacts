apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba30c82c-888f-4fd1-b6b6-4338423ec873.fullname" . }}
  labels:
    {{- include "go-echoba30c82c-888f-4fd1-b6b6-4338423ec873.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba30c82c-888f-4fd1-b6b6-4338423ec873.selectorLabels" . | nindent 6 }}
