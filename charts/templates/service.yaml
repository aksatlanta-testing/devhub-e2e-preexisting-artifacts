apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e0d49f7-f9e2-4826-8b15-09f373072b08.fullname" . }}
  labels:
    {{- include "go-echo5e0d49f7-f9e2-4826-8b15-09f373072b08.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e0d49f7-f9e2-4826-8b15-09f373072b08.selectorLabels" . | nindent 6 }}
