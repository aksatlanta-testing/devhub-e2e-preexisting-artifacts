apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cf481a9-a87c-4a27-a1b9-cbcc865656f2.fullname" . }}
  labels:
    {{- include "go-echo8cf481a9-a87c-4a27-a1b9-cbcc865656f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cf481a9-a87c-4a27-a1b9-cbcc865656f2.selectorLabels" . | nindent 6 }}
