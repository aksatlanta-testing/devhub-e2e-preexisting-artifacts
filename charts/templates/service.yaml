apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf0e49d7-c76f-461e-abb1-b5b2b369842a.fullname" . }}
  labels:
    {{- include "go-echoaf0e49d7-c76f-461e-abb1-b5b2b369842a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf0e49d7-c76f-461e-abb1-b5b2b369842a.selectorLabels" . | nindent 6 }}
