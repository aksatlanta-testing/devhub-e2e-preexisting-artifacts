apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47791b1b-72e0-476b-af6f-da044d3d23fb.fullname" . }}
  labels:
    {{- include "go-echo47791b1b-72e0-476b-af6f-da044d3d23fb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47791b1b-72e0-476b-af6f-da044d3d23fb.selectorLabels" . | nindent 6 }}
