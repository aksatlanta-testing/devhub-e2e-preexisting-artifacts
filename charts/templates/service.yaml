apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8a81b46-46ce-4295-a543-f9ee6b8ebb17.fullname" . }}
  labels:
    {{- include "go-echoe8a81b46-46ce-4295-a543-f9ee6b8ebb17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8a81b46-46ce-4295-a543-f9ee6b8ebb17.selectorLabels" . | nindent 6 }}
