apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6fdd7cf-f6a4-449f-a25f-588edf3947ed.fullname" . }}
  labels:
    {{- include "go-echof6fdd7cf-f6a4-449f-a25f-588edf3947ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6fdd7cf-f6a4-449f-a25f-588edf3947ed.selectorLabels" . | nindent 6 }}
