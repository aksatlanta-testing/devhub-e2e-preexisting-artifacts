apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f6ed17c-b64a-4645-abdd-4c157a95375f.fullname" . }}
  labels:
    {{- include "go-echo4f6ed17c-b64a-4645-abdd-4c157a95375f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f6ed17c-b64a-4645-abdd-4c157a95375f.selectorLabels" . | nindent 6 }}
