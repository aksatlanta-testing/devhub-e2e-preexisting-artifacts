apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9262b0a-8e9c-4cff-8e34-d798b4734e48.fullname" . }}
  labels:
    {{- include "go-echoe9262b0a-8e9c-4cff-8e34-d798b4734e48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9262b0a-8e9c-4cff-8e34-d798b4734e48.selectorLabels" . | nindent 6 }}
