apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo473d9913-61d6-4085-8042-1d000984f178.fullname" . }}
  labels:
    {{- include "go-echo473d9913-61d6-4085-8042-1d000984f178.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
