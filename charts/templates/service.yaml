apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0df8d0f9-50a4-446e-a557-e12ed801a791.fullname" . }}
  labels:
    {{- include "go-echo0df8d0f9-50a4-446e-a557-e12ed801a791.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0df8d0f9-50a4-446e-a557-e12ed801a791.selectorLabels" . | nindent 6 }}
