apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65ade1ba-1294-4de7-98f6-b8a717e86a45.fullname" . }}
  labels:
    {{- include "go-echo65ade1ba-1294-4de7-98f6-b8a717e86a45.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65ade1ba-1294-4de7-98f6-b8a717e86a45.selectorLabels" . | nindent 6 }}
