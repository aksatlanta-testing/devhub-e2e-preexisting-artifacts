apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d4f3fcb-2aa1-4f19-a3a5-3f6d96b977f1.fullname" . }}
  labels:
    {{- include "go-echo7d4f3fcb-2aa1-4f19-a3a5-3f6d96b977f1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d4f3fcb-2aa1-4f19-a3a5-3f6d96b977f1.selectorLabels" . | nindent 6 }}
