apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72b62f31-9095-45c9-a431-d5c834a059d9.fullname" . }}
  labels:
    {{- include "go-echo72b62f31-9095-45c9-a431-d5c834a059d9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72b62f31-9095-45c9-a431-d5c834a059d9.selectorLabels" . | nindent 6 }}
