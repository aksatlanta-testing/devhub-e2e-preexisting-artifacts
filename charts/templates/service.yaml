apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo234348c9-f5a3-4d0f-a0c1-49ef426b4afd.fullname" . }}
  labels:
    {{- include "go-echo234348c9-f5a3-4d0f-a0c1-49ef426b4afd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo234348c9-f5a3-4d0f-a0c1-49ef426b4afd.selectorLabels" . | nindent 6 }}
