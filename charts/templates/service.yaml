apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof640a176-09b5-48ef-b86e-fa14a5032912.fullname" . }}
  labels:
    {{- include "go-echof640a176-09b5-48ef-b86e-fa14a5032912.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof640a176-09b5-48ef-b86e-fa14a5032912.selectorLabels" . | nindent 6 }}
