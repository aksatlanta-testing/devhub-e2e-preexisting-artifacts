apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02b157c1-50b4-4937-aa8d-797929a38f2e.fullname" . }}
  labels:
    {{- include "go-echo02b157c1-50b4-4937-aa8d-797929a38f2e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02b157c1-50b4-4937-aa8d-797929a38f2e.selectorLabels" . | nindent 6 }}
