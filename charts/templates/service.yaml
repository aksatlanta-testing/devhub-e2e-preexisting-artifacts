apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75ea89b1-a8c3-4a91-a596-d8a391aed67a.fullname" . }}
  labels:
    {{- include "go-echo75ea89b1-a8c3-4a91-a596-d8a391aed67a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75ea89b1-a8c3-4a91-a596-d8a391aed67a.selectorLabels" . | nindent 6 }}
