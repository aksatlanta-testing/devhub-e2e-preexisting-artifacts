apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0dbf302d-1412-462c-9649-f37e6cc339f7.fullname" . }}
  labels:
    {{- include "go-echo0dbf302d-1412-462c-9649-f37e6cc339f7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0dbf302d-1412-462c-9649-f37e6cc339f7.selectorLabels" . | nindent 6 }}
