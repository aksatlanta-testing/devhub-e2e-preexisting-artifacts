apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bc3dde8-d429-4827-9ac0-91bef7f0d259.fullname" . }}
  labels:
    {{- include "go-echo8bc3dde8-d429-4827-9ac0-91bef7f0d259.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bc3dde8-d429-4827-9ac0-91bef7f0d259.selectorLabels" . | nindent 6 }}
