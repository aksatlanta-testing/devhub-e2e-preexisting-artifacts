apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d40ecb2-4deb-47f9-94d2-47017a437869.fullname" . }}
  labels:
    {{- include "go-echo7d40ecb2-4deb-47f9-94d2-47017a437869.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d40ecb2-4deb-47f9-94d2-47017a437869.selectorLabels" . | nindent 6 }}
