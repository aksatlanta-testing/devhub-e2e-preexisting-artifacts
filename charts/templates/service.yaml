apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb0a04b2-eee4-46d4-b4ea-a232f161675d.fullname" . }}
  labels:
    {{- include "go-echocb0a04b2-eee4-46d4-b4ea-a232f161675d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb0a04b2-eee4-46d4-b4ea-a232f161675d.selectorLabels" . | nindent 6 }}
