apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo637afd31-b323-4116-85c0-72bb08a047b5.fullname" . }}
  labels:
    {{- include "go-echo637afd31-b323-4116-85c0-72bb08a047b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo637afd31-b323-4116-85c0-72bb08a047b5.selectorLabels" . | nindent 6 }}
