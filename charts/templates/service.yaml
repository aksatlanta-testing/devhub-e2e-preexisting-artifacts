apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83d64f6a-7380-48a5-ba89-ea3ecbddef38.fullname" . }}
  labels:
    {{- include "go-echo83d64f6a-7380-48a5-ba89-ea3ecbddef38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83d64f6a-7380-48a5-ba89-ea3ecbddef38.selectorLabels" . | nindent 6 }}
