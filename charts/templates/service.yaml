apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f7e33fc-eb87-46a9-b81c-50ae570b3c2c.fullname" . }}
  labels:
    {{- include "go-echo7f7e33fc-eb87-46a9-b81c-50ae570b3c2c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f7e33fc-eb87-46a9-b81c-50ae570b3c2c.selectorLabels" . | nindent 6 }}
