apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9505904-731b-4416-b728-9f82e5afa120.fullname" . }}
  labels:
    {{- include "go-echod9505904-731b-4416-b728-9f82e5afa120.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9505904-731b-4416-b728-9f82e5afa120.selectorLabels" . | nindent 6 }}
