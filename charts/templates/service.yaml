apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6ab0ef1-fac5-41a3-9774-d623cbece80c.fullname" . }}
  labels:
    {{- include "go-echoa6ab0ef1-fac5-41a3-9774-d623cbece80c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6ab0ef1-fac5-41a3-9774-d623cbece80c.selectorLabels" . | nindent 6 }}
