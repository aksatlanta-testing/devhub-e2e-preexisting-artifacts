apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo307ee12d-340b-4aed-944c-1b57174b6f0d.fullname" . }}
  labels:
    {{- include "go-echo307ee12d-340b-4aed-944c-1b57174b6f0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo307ee12d-340b-4aed-944c-1b57174b6f0d.selectorLabels" . | nindent 6 }}
