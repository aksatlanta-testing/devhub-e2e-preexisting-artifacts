apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo526d15f9-21ac-42c0-bac5-e6ceb2ce07ed.fullname" . }}
  labels:
    {{- include "go-echo526d15f9-21ac-42c0-bac5-e6ceb2ce07ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo526d15f9-21ac-42c0-bac5-e6ceb2ce07ed.selectorLabels" . | nindent 6 }}
