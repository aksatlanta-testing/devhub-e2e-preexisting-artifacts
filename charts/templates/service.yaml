apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo815c9331-85ba-49c0-a4fd-6cb9e0bbf41e.fullname" . }}
  labels:
    {{- include "go-echo815c9331-85ba-49c0-a4fd-6cb9e0bbf41e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo815c9331-85ba-49c0-a4fd-6cb9e0bbf41e.selectorLabels" . | nindent 6 }}
