apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6eee7c0e-4195-4716-b0e8-8218c9d7b499.fullname" . }}
  labels:
    {{- include "go-echo6eee7c0e-4195-4716-b0e8-8218c9d7b499.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6eee7c0e-4195-4716-b0e8-8218c9d7b499.selectorLabels" . | nindent 6 }}
