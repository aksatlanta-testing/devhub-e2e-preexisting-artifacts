apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf6f882e-3141-40dc-bae9-2333a6c2d85e.fullname" . }}
  labels:
    {{- include "go-echobf6f882e-3141-40dc-bae9-2333a6c2d85e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf6f882e-3141-40dc-bae9-2333a6c2d85e.selectorLabels" . | nindent 6 }}
