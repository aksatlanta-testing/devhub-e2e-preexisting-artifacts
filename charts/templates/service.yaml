apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo04141620-de76-486c-8361-493daefc1295.fullname" . }}
  labels:
    {{- include "go-echo04141620-de76-486c-8361-493daefc1295.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo04141620-de76-486c-8361-493daefc1295.selectorLabels" . | nindent 6 }}
