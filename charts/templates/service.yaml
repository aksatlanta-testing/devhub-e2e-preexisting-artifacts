apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e007df2-deaa-4b1b-b711-633e0aa802df.fullname" . }}
  labels:
    {{- include "go-echo6e007df2-deaa-4b1b-b711-633e0aa802df.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e007df2-deaa-4b1b-b711-633e0aa802df.selectorLabels" . | nindent 6 }}
