apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e5d9361-f679-4272-a2e9-45e264dee544.fullname" . }}
  labels:
    {{- include "go-echo5e5d9361-f679-4272-a2e9-45e264dee544.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e5d9361-f679-4272-a2e9-45e264dee544.selectorLabels" . | nindent 6 }}
