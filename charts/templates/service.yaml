apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44701ce0-1fa5-47e3-bc7e-3b0f39587827.fullname" . }}
  labels:
    {{- include "go-echo44701ce0-1fa5-47e3-bc7e-3b0f39587827.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44701ce0-1fa5-47e3-bc7e-3b0f39587827.selectorLabels" . | nindent 6 }}
