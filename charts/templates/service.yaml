apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof62b1384-f3cc-4936-bffa-5ebef9968161.fullname" . }}
  labels:
    {{- include "go-echof62b1384-f3cc-4936-bffa-5ebef9968161.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof62b1384-f3cc-4936-bffa-5ebef9968161.selectorLabels" . | nindent 6 }}
