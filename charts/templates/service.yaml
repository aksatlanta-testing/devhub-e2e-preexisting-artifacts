apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7eebcf1-a9cf-4e55-8d3c-602d10241e8a.fullname" . }}
  labels:
    {{- include "go-echof7eebcf1-a9cf-4e55-8d3c-602d10241e8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7eebcf1-a9cf-4e55-8d3c-602d10241e8a.selectorLabels" . | nindent 6 }}
