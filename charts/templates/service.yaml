apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod868fa2d-7353-4a61-98bf-de4fe171686e.fullname" . }}
  labels:
    {{- include "go-echod868fa2d-7353-4a61-98bf-de4fe171686e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod868fa2d-7353-4a61-98bf-de4fe171686e.selectorLabels" . | nindent 6 }}
