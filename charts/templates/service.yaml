apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc272f0f-869d-47c7-980b-38f4f7bebaf0.fullname" . }}
  labels:
    {{- include "go-echobc272f0f-869d-47c7-980b-38f4f7bebaf0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc272f0f-869d-47c7-980b-38f4f7bebaf0.selectorLabels" . | nindent 6 }}
