apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo142d235c-9777-4d6d-be89-d368cd30d1a0.fullname" . }}
  labels:
    {{- include "go-echo142d235c-9777-4d6d-be89-d368cd30d1a0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo142d235c-9777-4d6d-be89-d368cd30d1a0.selectorLabels" . | nindent 6 }}
