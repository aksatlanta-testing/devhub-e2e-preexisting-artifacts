apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod34b7192-fcfe-4539-a78a-d8a5289231bc.fullname" . }}
  labels:
    {{- include "go-echod34b7192-fcfe-4539-a78a-d8a5289231bc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod34b7192-fcfe-4539-a78a-d8a5289231bc.selectorLabels" . | nindent 6 }}
