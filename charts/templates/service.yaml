apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc160f93-9be3-4e0d-a68e-37d31f0e7fbb.fullname" . }}
  labels:
    {{- include "go-echofc160f93-9be3-4e0d-a68e-37d31f0e7fbb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc160f93-9be3-4e0d-a68e-37d31f0e7fbb.selectorLabels" . | nindent 6 }}
