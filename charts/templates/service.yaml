apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7d1a2c9-2761-4b3a-8292-3ffdb7eea447.fullname" . }}
  labels:
    {{- include "go-echob7d1a2c9-2761-4b3a-8292-3ffdb7eea447.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7d1a2c9-2761-4b3a-8292-3ffdb7eea447.selectorLabels" . | nindent 6 }}
