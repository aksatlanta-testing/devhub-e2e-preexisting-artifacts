apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo503ae451-ed22-4f2e-a3f4-f83f40a867e0.fullname" . }}
  labels:
    {{- include "go-echo503ae451-ed22-4f2e-a3f4-f83f40a867e0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo503ae451-ed22-4f2e-a3f4-f83f40a867e0.selectorLabels" . | nindent 6 }}
