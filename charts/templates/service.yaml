apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo904d3df5-d42a-4a00-9861-5fd436f3c571.fullname" . }}
  labels:
    {{- include "go-echo904d3df5-d42a-4a00-9861-5fd436f3c571.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo904d3df5-d42a-4a00-9861-5fd436f3c571.selectorLabels" . | nindent 6 }}
