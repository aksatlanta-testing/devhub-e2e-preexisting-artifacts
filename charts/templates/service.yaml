apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo710a4f78-55ce-40d9-bd5e-b3fef153b2c1.fullname" . }}
  labels:
    {{- include "go-echo710a4f78-55ce-40d9-bd5e-b3fef153b2c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo710a4f78-55ce-40d9-bd5e-b3fef153b2c1.selectorLabels" . | nindent 6 }}
