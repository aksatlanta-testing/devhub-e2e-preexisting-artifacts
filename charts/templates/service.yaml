apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff73ba51-bb0a-4a3b-8a59-5d0b6aab8420.fullname" . }}
  labels:
    {{- include "go-echoff73ba51-bb0a-4a3b-8a59-5d0b6aab8420.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff73ba51-bb0a-4a3b-8a59-5d0b6aab8420.selectorLabels" . | nindent 6 }}
