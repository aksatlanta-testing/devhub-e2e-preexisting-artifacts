apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27d7e833-05f8-4220-8069-e3d162cd6f7b.fullname" . }}
  labels:
    {{- include "go-echo27d7e833-05f8-4220-8069-e3d162cd6f7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27d7e833-05f8-4220-8069-e3d162cd6f7b.selectorLabels" . | nindent 6 }}
