apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofedc26e5-efdd-4ea9-a4fb-dfcd1a4480fc.fullname" . }}
  labels:
    {{- include "go-echofedc26e5-efdd-4ea9-a4fb-dfcd1a4480fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofedc26e5-efdd-4ea9-a4fb-dfcd1a4480fc.selectorLabels" . | nindent 6 }}
