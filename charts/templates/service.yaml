apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19936414-1d1f-460c-84f8-aa276a4db2ef.fullname" . }}
  labels:
    {{- include "go-echo19936414-1d1f-460c-84f8-aa276a4db2ef.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19936414-1d1f-460c-84f8-aa276a4db2ef.selectorLabels" . | nindent 6 }}
