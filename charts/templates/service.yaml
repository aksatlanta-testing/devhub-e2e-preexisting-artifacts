apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18d4b4de-58d0-4a4e-8567-38906e1de658.fullname" . }}
  labels:
    {{- include "go-echo18d4b4de-58d0-4a4e-8567-38906e1de658.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18d4b4de-58d0-4a4e-8567-38906e1de658.selectorLabels" . | nindent 6 }}
