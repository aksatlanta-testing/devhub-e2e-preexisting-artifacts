apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6604f58-84c5-4653-8080-83f6d308315d.fullname" . }}
  labels:
    {{- include "go-echob6604f58-84c5-4653-8080-83f6d308315d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6604f58-84c5-4653-8080-83f6d308315d.selectorLabels" . | nindent 6 }}
