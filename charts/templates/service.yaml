apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ec020ff-d0c0-4d0f-a8f7-0969c0f09045.fullname" . }}
  labels:
    {{- include "go-echo0ec020ff-d0c0-4d0f-a8f7-0969c0f09045.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ec020ff-d0c0-4d0f-a8f7-0969c0f09045.selectorLabels" . | nindent 6 }}
