apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ee7f08d-56a2-4d8d-ace8-11d6f20ca9e6.fullname" . }}
  labels:
    {{- include "go-echo4ee7f08d-56a2-4d8d-ace8-11d6f20ca9e6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ee7f08d-56a2-4d8d-ace8-11d6f20ca9e6.selectorLabels" . | nindent 6 }}
