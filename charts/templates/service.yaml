apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc67b90c5-05d6-42ee-86ad-a24c3a5947b4.fullname" . }}
  labels:
    {{- include "go-echoc67b90c5-05d6-42ee-86ad-a24c3a5947b4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc67b90c5-05d6-42ee-86ad-a24c3a5947b4.selectorLabels" . | nindent 6 }}
