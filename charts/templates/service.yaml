apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35d40721-71c0-441e-95f8-c7fd41db8438.fullname" . }}
  labels:
    {{- include "go-echo35d40721-71c0-441e-95f8-c7fd41db8438.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
