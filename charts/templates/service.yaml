apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6aaa6f8d-6df7-41af-8d97-1b2b8ad0f993.fullname" . }}
  labels:
    {{- include "go-echo6aaa6f8d-6df7-41af-8d97-1b2b8ad0f993.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6aaa6f8d-6df7-41af-8d97-1b2b8ad0f993.selectorLabels" . | nindent 6 }}
