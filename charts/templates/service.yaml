apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67913e12-4208-4464-9516-c27a641c6442.fullname" . }}
  labels:
    {{- include "go-echo67913e12-4208-4464-9516-c27a641c6442.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67913e12-4208-4464-9516-c27a641c6442.selectorLabels" . | nindent 6 }}
