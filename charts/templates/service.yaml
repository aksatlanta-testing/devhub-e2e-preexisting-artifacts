apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ac0475b-24d9-4e0d-b47c-e1b59706cc0c.fullname" . }}
  labels:
    {{- include "go-echo4ac0475b-24d9-4e0d-b47c-e1b59706cc0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ac0475b-24d9-4e0d-b47c-e1b59706cc0c.selectorLabels" . | nindent 6 }}
