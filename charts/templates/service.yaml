apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5339881-3a19-4cd9-b73e-063f3dca2f0a.fullname" . }}
  labels:
    {{- include "go-echof5339881-3a19-4cd9-b73e-063f3dca2f0a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5339881-3a19-4cd9-b73e-063f3dca2f0a.selectorLabels" . | nindent 6 }}
