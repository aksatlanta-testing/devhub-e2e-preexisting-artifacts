apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo112a09bb-056a-4c06-a95c-b310462bc757.fullname" . }}
  labels:
    {{- include "go-echo112a09bb-056a-4c06-a95c-b310462bc757.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo112a09bb-056a-4c06-a95c-b310462bc757.selectorLabels" . | nindent 6 }}
