apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76b43160-09e9-4259-90a4-7696a7c2033a.fullname" . }}
  labels:
    {{- include "go-echo76b43160-09e9-4259-90a4-7696a7c2033a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76b43160-09e9-4259-90a4-7696a7c2033a.selectorLabels" . | nindent 6 }}
