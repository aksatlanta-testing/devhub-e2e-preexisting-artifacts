apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f921aa4-b719-4c4a-aa11-2e00c830fe6d.fullname" . }}
  labels:
    {{- include "go-echo9f921aa4-b719-4c4a-aa11-2e00c830fe6d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f921aa4-b719-4c4a-aa11-2e00c830fe6d.selectorLabels" . | nindent 6 }}
