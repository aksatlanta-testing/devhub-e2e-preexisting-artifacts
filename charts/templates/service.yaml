apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35e94d88-b258-4130-88b2-e82ff11169a3.fullname" . }}
  labels:
    {{- include "go-echo35e94d88-b258-4130-88b2-e82ff11169a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35e94d88-b258-4130-88b2-e82ff11169a3.selectorLabels" . | nindent 6 }}
