apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0744f2c7-2764-4d32-a1a0-98742f6d7f5b.fullname" . }}
  labels:
    {{- include "go-echo0744f2c7-2764-4d32-a1a0-98742f6d7f5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0744f2c7-2764-4d32-a1a0-98742f6d7f5b.selectorLabels" . | nindent 6 }}
