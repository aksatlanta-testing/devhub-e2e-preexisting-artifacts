apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce3f99a6-2b04-454e-b1be-2643f5555ec1.fullname" . }}
  labels:
    {{- include "go-echoce3f99a6-2b04-454e-b1be-2643f5555ec1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce3f99a6-2b04-454e-b1be-2643f5555ec1.selectorLabels" . | nindent 6 }}
