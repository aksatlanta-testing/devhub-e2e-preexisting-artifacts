apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18e0e8c9-c75d-40b3-bec4-60134ff2e388.fullname" . }}
  labels:
    {{- include "go-echo18e0e8c9-c75d-40b3-bec4-60134ff2e388.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18e0e8c9-c75d-40b3-bec4-60134ff2e388.selectorLabels" . | nindent 4 }}
