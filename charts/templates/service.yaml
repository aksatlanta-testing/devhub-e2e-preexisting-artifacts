apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31c29847-a67e-46ac-9c85-e49e7c9022f7.fullname" . }}
  labels:
    {{- include "go-echo31c29847-a67e-46ac-9c85-e49e7c9022f7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31c29847-a67e-46ac-9c85-e49e7c9022f7.selectorLabels" . | nindent 6 }}
