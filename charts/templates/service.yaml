apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4deff1a-ba72-437f-9678-9925d28aa920.fullname" . }}
  labels:
    {{- include "go-echob4deff1a-ba72-437f-9678-9925d28aa920.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4deff1a-ba72-437f-9678-9925d28aa920.selectorLabels" . | nindent 6 }}
