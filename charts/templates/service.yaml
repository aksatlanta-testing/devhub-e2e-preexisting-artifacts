apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo550a042e-448c-4e94-9c5b-db1b7455fb15.fullname" . }}
  labels:
    {{- include "go-echo550a042e-448c-4e94-9c5b-db1b7455fb15.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo550a042e-448c-4e94-9c5b-db1b7455fb15.selectorLabels" . | nindent 6 }}
