apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8e3aa67-f77f-461d-b21c-9061b4eb3ccb.fullname" . }}
  labels:
    {{- include "go-echod8e3aa67-f77f-461d-b21c-9061b4eb3ccb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8e3aa67-f77f-461d-b21c-9061b4eb3ccb.selectorLabels" . | nindent 6 }}
