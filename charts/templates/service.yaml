apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa04a7bf0-e908-4107-a652-968005308def.fullname" . }}
  labels:
    {{- include "go-echoa04a7bf0-e908-4107-a652-968005308def.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa04a7bf0-e908-4107-a652-968005308def.selectorLabels" . | nindent 6 }}
