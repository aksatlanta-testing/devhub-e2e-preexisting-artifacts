apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26890ebd-d6cb-412b-8816-0d3ca841e874.fullname" . }}
  labels:
    {{- include "go-echo26890ebd-d6cb-412b-8816-0d3ca841e874.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26890ebd-d6cb-412b-8816-0d3ca841e874.selectorLabels" . | nindent 6 }}
