apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36e1cef9-460a-4742-87ef-96c3647a9572.fullname" . }}
  labels:
    {{- include "go-echo36e1cef9-460a-4742-87ef-96c3647a9572.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36e1cef9-460a-4742-87ef-96c3647a9572.selectorLabels" . | nindent 6 }}
