apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cbe4150-1c38-43bc-9be0-75deb703ed86.fullname" . }}
  labels:
    {{- include "go-echo6cbe4150-1c38-43bc-9be0-75deb703ed86.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cbe4150-1c38-43bc-9be0-75deb703ed86.selectorLabels" . | nindent 6 }}
