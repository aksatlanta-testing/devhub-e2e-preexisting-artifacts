apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3829747e-a508-45c9-8127-e43a7d698c83.fullname" . }}
  labels:
    {{- include "go-echo3829747e-a508-45c9-8127-e43a7d698c83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3829747e-a508-45c9-8127-e43a7d698c83.selectorLabels" . | nindent 6 }}
