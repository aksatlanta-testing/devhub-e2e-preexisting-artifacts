apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f1901b4-a938-43cf-bce2-5772b4940303.fullname" . }}
  labels:
    {{- include "go-echo1f1901b4-a938-43cf-bce2-5772b4940303.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f1901b4-a938-43cf-bce2-5772b4940303.selectorLabels" . | nindent 6 }}
