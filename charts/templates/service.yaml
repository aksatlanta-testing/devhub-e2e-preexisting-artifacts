apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6baa63b3-cc1d-4e4c-aed5-acac2db46a69.fullname" . }}
  labels:
    {{- include "go-echo6baa63b3-cc1d-4e4c-aed5-acac2db46a69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6baa63b3-cc1d-4e4c-aed5-acac2db46a69.selectorLabels" . | nindent 6 }}
