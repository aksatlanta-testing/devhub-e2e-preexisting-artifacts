apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo860ba17e-c684-49f7-b7e0-4a763bd04129.fullname" . }}
  labels:
    {{- include "go-echo860ba17e-c684-49f7-b7e0-4a763bd04129.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo860ba17e-c684-49f7-b7e0-4a763bd04129.selectorLabels" . | nindent 6 }}
