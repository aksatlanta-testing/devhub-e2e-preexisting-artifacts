apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa34dc410-fdf7-4023-a297-0f318df6df58.fullname" . }}
  labels:
    {{- include "go-echoa34dc410-fdf7-4023-a297-0f318df6df58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa34dc410-fdf7-4023-a297-0f318df6df58.selectorLabels" . | nindent 6 }}
