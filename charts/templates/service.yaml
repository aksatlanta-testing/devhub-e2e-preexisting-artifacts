apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe57e5c18-2340-4276-8734-96d9c21e7073.fullname" . }}
  labels:
    {{- include "go-echoe57e5c18-2340-4276-8734-96d9c21e7073.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe57e5c18-2340-4276-8734-96d9c21e7073.selectorLabels" . | nindent 6 }}
