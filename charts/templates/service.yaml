apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9669879-7e63-47a5-86b8-47fb0666c108.fullname" . }}
  labels:
    {{- include "go-echoe9669879-7e63-47a5-86b8-47fb0666c108.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9669879-7e63-47a5-86b8-47fb0666c108.selectorLabels" . | nindent 6 }}
