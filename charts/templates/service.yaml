apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5de075c-5259-4402-be71-498875c66c13.fullname" . }}
  labels:
    {{- include "go-echof5de075c-5259-4402-be71-498875c66c13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5de075c-5259-4402-be71-498875c66c13.selectorLabels" . | nindent 6 }}
