apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof005488c-e1e7-417d-bb68-5cec79b80eeb.fullname" . }}
  labels:
    {{- include "go-echof005488c-e1e7-417d-bb68-5cec79b80eeb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof005488c-e1e7-417d-bb68-5cec79b80eeb.selectorLabels" . | nindent 6 }}
