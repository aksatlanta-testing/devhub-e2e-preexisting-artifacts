apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6533a7c2-5827-4a4c-bc56-b0a119baaaeb.fullname" . }}
  labels:
    {{- include "go-echo6533a7c2-5827-4a4c-bc56-b0a119baaaeb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6533a7c2-5827-4a4c-bc56-b0a119baaaeb.selectorLabels" . | nindent 6 }}
