apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo771be08c-4add-48bb-9cd5-7c9ea2ce413e.fullname" . }}
  labels:
    {{- include "go-echo771be08c-4add-48bb-9cd5-7c9ea2ce413e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo771be08c-4add-48bb-9cd5-7c9ea2ce413e.selectorLabels" . | nindent 6 }}
