apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo348ef4f4-db07-46ec-914f-662c7192a1c9.fullname" . }}
  labels:
    {{- include "go-echo348ef4f4-db07-46ec-914f-662c7192a1c9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo348ef4f4-db07-46ec-914f-662c7192a1c9.selectorLabels" . | nindent 6 }}
