apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo337289c6-0223-4a5d-b5cd-71a7b19fac0f.fullname" . }}
  labels:
    {{- include "go-echo337289c6-0223-4a5d-b5cd-71a7b19fac0f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo337289c6-0223-4a5d-b5cd-71a7b19fac0f.selectorLabels" . | nindent 6 }}
