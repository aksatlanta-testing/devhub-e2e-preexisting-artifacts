apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof27a5f47-a080-4c38-88f2-5fa6be2bed7b.fullname" . }}
  labels:
    {{- include "go-echof27a5f47-a080-4c38-88f2-5fa6be2bed7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof27a5f47-a080-4c38-88f2-5fa6be2bed7b.selectorLabels" . | nindent 6 }}
