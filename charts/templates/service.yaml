apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof840ec1a-2974-4b77-88cb-18a65837dc22.fullname" . }}
  labels:
    {{- include "go-echof840ec1a-2974-4b77-88cb-18a65837dc22.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof840ec1a-2974-4b77-88cb-18a65837dc22.selectorLabels" . | nindent 6 }}
