apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf2f9600-a07c-4f64-a4ca-6351286f22bf.fullname" . }}
  labels:
    {{- include "go-echodf2f9600-a07c-4f64-a4ca-6351286f22bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf2f9600-a07c-4f64-a4ca-6351286f22bf.selectorLabels" . | nindent 6 }}
