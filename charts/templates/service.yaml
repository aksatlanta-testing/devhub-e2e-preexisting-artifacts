apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod42022c4-4769-436d-bee3-e0ec654e8bed.fullname" . }}
  labels:
    {{- include "go-echod42022c4-4769-436d-bee3-e0ec654e8bed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod42022c4-4769-436d-bee3-e0ec654e8bed.selectorLabels" . | nindent 6 }}
