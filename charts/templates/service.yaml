apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f290faf-1182-4ca3-82d4-c8f459d2db55.fullname" . }}
  labels:
    {{- include "go-echo5f290faf-1182-4ca3-82d4-c8f459d2db55.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f290faf-1182-4ca3-82d4-c8f459d2db55.selectorLabels" . | nindent 6 }}
