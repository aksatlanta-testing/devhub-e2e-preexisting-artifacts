apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2276eb7-2ded-428e-ad4a-a4e2b69a8670.fullname" . }}
  labels:
    {{- include "go-echob2276eb7-2ded-428e-ad4a-a4e2b69a8670.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2276eb7-2ded-428e-ad4a-a4e2b69a8670.selectorLabels" . | nindent 6 }}
