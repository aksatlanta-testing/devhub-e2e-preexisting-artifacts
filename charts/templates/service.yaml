apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fd7b62a-95e6-486f-a03f-7388e2f0c2a2.fullname" . }}
  labels:
    {{- include "go-echo9fd7b62a-95e6-486f-a03f-7388e2f0c2a2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fd7b62a-95e6-486f-a03f-7388e2f0c2a2.selectorLabels" . | nindent 6 }}
