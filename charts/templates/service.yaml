apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda0127d9-9c5f-4065-8972-aece9a9c1092.fullname" . }}
  labels:
    {{- include "go-echoda0127d9-9c5f-4065-8972-aece9a9c1092.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda0127d9-9c5f-4065-8972-aece9a9c1092.selectorLabels" . | nindent 6 }}
