apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79750da3-6cc1-4b2f-a49e-87b2d201d36e.fullname" . }}
  labels:
    {{- include "go-echo79750da3-6cc1-4b2f-a49e-87b2d201d36e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79750da3-6cc1-4b2f-a49e-87b2d201d36e.selectorLabels" . | nindent 6 }}
