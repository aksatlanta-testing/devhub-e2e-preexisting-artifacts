apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e11b35e-e5f9-4041-9d0b-6ba54047ea43.fullname" . }}
  labels:
    {{- include "go-echo0e11b35e-e5f9-4041-9d0b-6ba54047ea43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e11b35e-e5f9-4041-9d0b-6ba54047ea43.selectorLabels" . | nindent 6 }}
