apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47cfefb6-0862-40ac-ae33-f5f4534f030d.fullname" . }}
  labels:
    {{- include "go-echo47cfefb6-0862-40ac-ae33-f5f4534f030d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47cfefb6-0862-40ac-ae33-f5f4534f030d.selectorLabels" . | nindent 6 }}
