apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d25cf20-115d-443c-a61e-c0b3b53f0416.fullname" . }}
  labels:
    {{- include "go-echo0d25cf20-115d-443c-a61e-c0b3b53f0416.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d25cf20-115d-443c-a61e-c0b3b53f0416.selectorLabels" . | nindent 6 }}
