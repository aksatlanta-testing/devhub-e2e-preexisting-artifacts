apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8129ae57-930d-43df-8c13-7d754207c44d.fullname" . }}
  labels:
    {{- include "go-echo8129ae57-930d-43df-8c13-7d754207c44d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8129ae57-930d-43df-8c13-7d754207c44d.selectorLabels" . | nindent 6 }}
