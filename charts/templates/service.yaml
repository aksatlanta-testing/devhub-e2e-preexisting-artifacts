apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66b269a1-351e-452b-911b-963acf14690a.fullname" . }}
  labels:
    {{- include "go-echo66b269a1-351e-452b-911b-963acf14690a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66b269a1-351e-452b-911b-963acf14690a.selectorLabels" . | nindent 6 }}
