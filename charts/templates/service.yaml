apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo192a847d-d23f-44e7-b5c4-0b9e896a735d.fullname" . }}
  labels:
    {{- include "go-echo192a847d-d23f-44e7-b5c4-0b9e896a735d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo192a847d-d23f-44e7-b5c4-0b9e896a735d.selectorLabels" . | nindent 6 }}
