apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a49b9a8-c15f-4faf-85ce-bef893565483.fullname" . }}
  labels:
    {{- include "go-echo0a49b9a8-c15f-4faf-85ce-bef893565483.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a49b9a8-c15f-4faf-85ce-bef893565483.selectorLabels" . | nindent 6 }}
