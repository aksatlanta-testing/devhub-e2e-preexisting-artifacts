apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeb8148b1-3275-4da1-a216-d9f8018e8ddc.fullname" . }}
  labels:
    {{- include "go-echoeb8148b1-3275-4da1-a216-d9f8018e8ddc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeb8148b1-3275-4da1-a216-d9f8018e8ddc.selectorLabels" . | nindent 6 }}
