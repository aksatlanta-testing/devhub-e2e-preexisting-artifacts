apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2741398b-1bcc-4235-ae61-33bcf59ea838.fullname" . }}
  labels:
    {{- include "go-echo2741398b-1bcc-4235-ae61-33bcf59ea838.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2741398b-1bcc-4235-ae61-33bcf59ea838.selectorLabels" . | nindent 6 }}
