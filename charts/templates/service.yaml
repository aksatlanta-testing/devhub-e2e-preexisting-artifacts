apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ad844b4-5e12-4ae2-9189-e0ce6726fd10.fullname" . }}
  labels:
    {{- include "go-echo0ad844b4-5e12-4ae2-9189-e0ce6726fd10.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ad844b4-5e12-4ae2-9189-e0ce6726fd10.selectorLabels" . | nindent 6 }}
