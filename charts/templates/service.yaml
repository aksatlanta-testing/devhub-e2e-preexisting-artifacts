apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod59ddf08-b842-4adb-b5fa-dba67608702a.fullname" . }}
  labels:
    {{- include "go-echod59ddf08-b842-4adb-b5fa-dba67608702a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod59ddf08-b842-4adb-b5fa-dba67608702a.selectorLabels" . | nindent 6 }}
