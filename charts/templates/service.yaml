apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a5cc2cc-e190-4a59-b16b-d7d949ba3bc3.fullname" . }}
  labels:
    {{- include "go-echo7a5cc2cc-e190-4a59-b16b-d7d949ba3bc3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a5cc2cc-e190-4a59-b16b-d7d949ba3bc3.selectorLabels" . | nindent 6 }}
