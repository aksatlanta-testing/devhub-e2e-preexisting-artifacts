apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa24d6e1c-9aef-4175-9d87-2bc83c06b509.fullname" . }}
  labels:
    {{- include "go-echoa24d6e1c-9aef-4175-9d87-2bc83c06b509.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa24d6e1c-9aef-4175-9d87-2bc83c06b509.selectorLabels" . | nindent 6 }}
