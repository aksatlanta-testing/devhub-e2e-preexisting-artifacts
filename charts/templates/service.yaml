apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82cb132b-8768-437c-a4b9-1a71890da278.fullname" . }}
  labels:
    {{- include "go-echo82cb132b-8768-437c-a4b9-1a71890da278.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82cb132b-8768-437c-a4b9-1a71890da278.selectorLabels" . | nindent 6 }}
