apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6794d54a-6433-44b8-b4a3-b699061244fe.fullname" . }}
  labels:
    {{- include "go-echo6794d54a-6433-44b8-b4a3-b699061244fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6794d54a-6433-44b8-b4a3-b699061244fe.selectorLabels" . | nindent 6 }}
