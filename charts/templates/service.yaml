apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod847a9c8-5adc-44ed-a7d4-481613417eab.fullname" . }}
  labels:
    {{- include "go-echod847a9c8-5adc-44ed-a7d4-481613417eab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod847a9c8-5adc-44ed-a7d4-481613417eab.selectorLabels" . | nindent 6 }}
