apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb053326-0f65-4807-aac0-8dd6b5c68b33.fullname" . }}
  labels:
    {{- include "go-echocb053326-0f65-4807-aac0-8dd6b5c68b33.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb053326-0f65-4807-aac0-8dd6b5c68b33.selectorLabels" . | nindent 6 }}
