apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoddeeca20-34e5-47e4-b3ec-f17fa3105ee9.fullname" . }}
  labels:
    {{- include "go-echoddeeca20-34e5-47e4-b3ec-f17fa3105ee9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoddeeca20-34e5-47e4-b3ec-f17fa3105ee9.selectorLabels" . | nindent 6 }}
