apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2e27f50-6e8c-4ef5-b710-c99e18fe222f.fullname" . }}
  labels:
    {{- include "go-echof2e27f50-6e8c-4ef5-b710-c99e18fe222f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2e27f50-6e8c-4ef5-b710-c99e18fe222f.selectorLabels" . | nindent 6 }}
