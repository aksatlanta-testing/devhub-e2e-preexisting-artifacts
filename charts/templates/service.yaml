apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo14dd5e27-bdaf-4adb-a7f1-3ab0531ce4b7.fullname" . }}
  labels:
    {{- include "go-echo14dd5e27-bdaf-4adb-a7f1-3ab0531ce4b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo14dd5e27-bdaf-4adb-a7f1-3ab0531ce4b7.selectorLabels" . | nindent 6 }}
