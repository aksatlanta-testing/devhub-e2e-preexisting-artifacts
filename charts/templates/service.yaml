apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe121f22-c454-4a71-9e89-df29cd10dac3.fullname" . }}
  labels:
    {{- include "go-echobe121f22-c454-4a71-9e89-df29cd10dac3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe121f22-c454-4a71-9e89-df29cd10dac3.selectorLabels" . | nindent 6 }}
