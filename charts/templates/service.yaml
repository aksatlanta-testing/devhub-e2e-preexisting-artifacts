apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo022b787e-bcb2-42c8-bc9c-4e825fda06d9.fullname" . }}
  labels:
    {{- include "go-echo022b787e-bcb2-42c8-bc9c-4e825fda06d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo022b787e-bcb2-42c8-bc9c-4e825fda06d9.selectorLabels" . | nindent 6 }}
