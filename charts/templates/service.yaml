apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a07c8ad-31fd-4c25-a387-382210a5e452.fullname" . }}
  labels:
    {{- include "go-echo9a07c8ad-31fd-4c25-a387-382210a5e452.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a07c8ad-31fd-4c25-a387-382210a5e452.selectorLabels" . | nindent 6 }}
