apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4e82034-ac5b-4135-8c87-6e7de30b95f7.fullname" . }}
  labels:
    {{- include "go-echod4e82034-ac5b-4135-8c87-6e7de30b95f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4e82034-ac5b-4135-8c87-6e7de30b95f7.selectorLabels" . | nindent 6 }}
