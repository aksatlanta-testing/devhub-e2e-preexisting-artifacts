apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c15f063-bbb8-4bef-8072-dd1c0c1cc29b.fullname" . }}
  labels:
    {{- include "go-echo6c15f063-bbb8-4bef-8072-dd1c0c1cc29b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c15f063-bbb8-4bef-8072-dd1c0c1cc29b.selectorLabels" . | nindent 6 }}
