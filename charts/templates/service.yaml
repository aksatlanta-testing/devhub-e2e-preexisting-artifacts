apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac016d71-e353-45e5-b86b-5ead94f6539c.fullname" . }}
  labels:
    {{- include "go-echoac016d71-e353-45e5-b86b-5ead94f6539c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac016d71-e353-45e5-b86b-5ead94f6539c.selectorLabels" . | nindent 6 }}
