apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo742235c8-69a7-474b-9630-18d79d4b5853.fullname" . }}
  labels:
    {{- include "go-echo742235c8-69a7-474b-9630-18d79d4b5853.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo742235c8-69a7-474b-9630-18d79d4b5853.selectorLabels" . | nindent 6 }}
