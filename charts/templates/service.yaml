apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo024f9e89-60ff-467a-bc26-f54f0202f58d.fullname" . }}
  labels:
    {{- include "go-echo024f9e89-60ff-467a-bc26-f54f0202f58d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo024f9e89-60ff-467a-bc26-f54f0202f58d.selectorLabels" . | nindent 6 }}
