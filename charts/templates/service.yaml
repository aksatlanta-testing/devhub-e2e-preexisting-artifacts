apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb170302-4b77-465f-9320-c64ed6a82072.fullname" . }}
  labels:
    {{- include "go-echofb170302-4b77-465f-9320-c64ed6a82072.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb170302-4b77-465f-9320-c64ed6a82072.selectorLabels" . | nindent 6 }}
