apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc56437fe-765e-4a86-b38e-fb5202739909.fullname" . }}
  labels:
    {{- include "go-echoc56437fe-765e-4a86-b38e-fb5202739909.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc56437fe-765e-4a86-b38e-fb5202739909.selectorLabels" . | nindent 6 }}
