apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacf7d651-2679-4e87-982c-9ce96d3b4f49.fullname" . }}
  labels:
    {{- include "go-echoacf7d651-2679-4e87-982c-9ce96d3b4f49.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacf7d651-2679-4e87-982c-9ce96d3b4f49.selectorLabels" . | nindent 6 }}
