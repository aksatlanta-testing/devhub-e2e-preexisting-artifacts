apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81df0b3d-1f40-4a0e-8156-9c6817b4835f.fullname" . }}
  labels:
    {{- include "go-echo81df0b3d-1f40-4a0e-8156-9c6817b4835f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81df0b3d-1f40-4a0e-8156-9c6817b4835f.selectorLabels" . | nindent 6 }}
