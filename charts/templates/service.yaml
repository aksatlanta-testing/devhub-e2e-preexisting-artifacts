apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof935894d-5539-4f10-9cd9-e0a2f06de1eb.fullname" . }}
  labels:
    {{- include "go-echof935894d-5539-4f10-9cd9-e0a2f06de1eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof935894d-5539-4f10-9cd9-e0a2f06de1eb.selectorLabels" . | nindent 6 }}
