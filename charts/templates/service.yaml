apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37ef7e1e-d6c1-4eca-b3c0-68122c0f813c.fullname" . }}
  labels:
    {{- include "go-echo37ef7e1e-d6c1-4eca-b3c0-68122c0f813c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37ef7e1e-d6c1-4eca-b3c0-68122c0f813c.selectorLabels" . | nindent 6 }}
