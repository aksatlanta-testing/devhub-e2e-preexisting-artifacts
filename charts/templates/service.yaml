apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaad8a635-67ec-48ab-90da-219e575b431f.fullname" . }}
  labels:
    {{- include "go-echoaad8a635-67ec-48ab-90da-219e575b431f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaad8a635-67ec-48ab-90da-219e575b431f.selectorLabels" . | nindent 6 }}
