apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c9469d6-7645-4eaf-b71f-d0c3e4fc4209.fullname" . }}
  labels:
    {{- include "go-echo3c9469d6-7645-4eaf-b71f-d0c3e4fc4209.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c9469d6-7645-4eaf-b71f-d0c3e4fc4209.selectorLabels" . | nindent 6 }}
