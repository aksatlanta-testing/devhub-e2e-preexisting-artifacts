apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed1264a4-1028-4016-9e5f-40484d2913a8.fullname" . }}
  labels:
    {{- include "go-echoed1264a4-1028-4016-9e5f-40484d2913a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed1264a4-1028-4016-9e5f-40484d2913a8.selectorLabels" . | nindent 6 }}
