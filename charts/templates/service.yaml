apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo894a53c4-a36f-42de-a5e0-70b825cd9c28.fullname" . }}
  labels:
    {{- include "go-echo894a53c4-a36f-42de-a5e0-70b825cd9c28.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo894a53c4-a36f-42de-a5e0-70b825cd9c28.selectorLabels" . | nindent 6 }}
