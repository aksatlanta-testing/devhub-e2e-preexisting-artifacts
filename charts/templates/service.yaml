apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5c9efcf-e101-46db-a64a-b1b4b87c7d7a.fullname" . }}
  labels:
    {{- include "go-echoe5c9efcf-e101-46db-a64a-b1b4b87c7d7a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5c9efcf-e101-46db-a64a-b1b4b87c7d7a.selectorLabels" . | nindent 6 }}
