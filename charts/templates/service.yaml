apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeec8fd02-c8a2-4273-9683-c4c7b871f4a5.fullname" . }}
  labels:
    {{- include "go-echoeec8fd02-c8a2-4273-9683-c4c7b871f4a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeec8fd02-c8a2-4273-9683-c4c7b871f4a5.selectorLabels" . | nindent 6 }}
