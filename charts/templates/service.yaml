apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8df3d444-f45e-45c4-8dd6-e64144da742f.fullname" . }}
  labels:
    {{- include "go-echo8df3d444-f45e-45c4-8dd6-e64144da742f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8df3d444-f45e-45c4-8dd6-e64144da742f.selectorLabels" . | nindent 6 }}
