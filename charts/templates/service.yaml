apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo422c3208-eff7-46f1-a56b-fc314ef92917.fullname" . }}
  labels:
    {{- include "go-echo422c3208-eff7-46f1-a56b-fc314ef92917.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo422c3208-eff7-46f1-a56b-fc314ef92917.selectorLabels" . | nindent 6 }}
