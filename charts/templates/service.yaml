apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f927261-110f-4915-8bf6-9cf086ac03e7.fullname" . }}
  labels:
    {{- include "go-echo3f927261-110f-4915-8bf6-9cf086ac03e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f927261-110f-4915-8bf6-9cf086ac03e7.selectorLabels" . | nindent 6 }}
