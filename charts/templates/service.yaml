apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bfff1e8-ca76-4bc6-ad1c-916c548cafe0.fullname" . }}
  labels:
    {{- include "go-echo8bfff1e8-ca76-4bc6-ad1c-916c548cafe0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bfff1e8-ca76-4bc6-ad1c-916c548cafe0.selectorLabels" . | nindent 6 }}
