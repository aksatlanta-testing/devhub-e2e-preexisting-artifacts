apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ff65f12-ad39-4bb7-b4d5-f6c416c69312.fullname" . }}
  labels:
    {{- include "go-echo2ff65f12-ad39-4bb7-b4d5-f6c416c69312.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ff65f12-ad39-4bb7-b4d5-f6c416c69312.selectorLabels" . | nindent 6 }}
