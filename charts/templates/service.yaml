apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9d2c1df-7f18-4b62-8f55-e36f79429165.fullname" . }}
  labels:
    {{- include "go-echoa9d2c1df-7f18-4b62-8f55-e36f79429165.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9d2c1df-7f18-4b62-8f55-e36f79429165.selectorLabels" . | nindent 6 }}
