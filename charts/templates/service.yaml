apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b22b973-874e-495e-be74-5b97992024b5.fullname" . }}
  labels:
    {{- include "go-echo9b22b973-874e-495e-be74-5b97992024b5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b22b973-874e-495e-be74-5b97992024b5.selectorLabels" . | nindent 6 }}
