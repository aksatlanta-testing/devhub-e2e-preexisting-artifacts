apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0244cff9-4248-4c50-bb16-290747ede70b.fullname" . }}
  labels:
    {{- include "go-echo0244cff9-4248-4c50-bb16-290747ede70b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0244cff9-4248-4c50-bb16-290747ede70b.selectorLabels" . | nindent 6 }}
