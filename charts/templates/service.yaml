apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb118cde-6692-4174-9d38-da7395384954.fullname" . }}
  labels:
    {{- include "go-echobb118cde-6692-4174-9d38-da7395384954.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb118cde-6692-4174-9d38-da7395384954.selectorLabels" . | nindent 6 }}
