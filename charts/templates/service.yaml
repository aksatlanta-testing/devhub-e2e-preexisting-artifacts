apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26be5989-4c5b-4d03-a18b-c2e27c1d2c67.fullname" . }}
  labels:
    {{- include "go-echo26be5989-4c5b-4d03-a18b-c2e27c1d2c67.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26be5989-4c5b-4d03-a18b-c2e27c1d2c67.selectorLabels" . | nindent 6 }}
