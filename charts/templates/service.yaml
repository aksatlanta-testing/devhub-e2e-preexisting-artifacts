apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f53fc04-e56c-4793-a121-1479e01a2a27.fullname" . }}
  labels:
    {{- include "go-echo0f53fc04-e56c-4793-a121-1479e01a2a27.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f53fc04-e56c-4793-a121-1479e01a2a27.selectorLabels" . | nindent 6 }}
