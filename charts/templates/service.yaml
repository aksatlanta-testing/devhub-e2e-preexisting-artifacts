apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc55c9ddd-f478-4e12-988f-04f506ba0c8c.fullname" . }}
  labels:
    {{- include "go-echoc55c9ddd-f478-4e12-988f-04f506ba0c8c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc55c9ddd-f478-4e12-988f-04f506ba0c8c.selectorLabels" . | nindent 6 }}
