apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28915ad0-f594-4ea5-a28a-adf456febc1b.fullname" . }}
  labels:
    {{- include "go-echo28915ad0-f594-4ea5-a28a-adf456febc1b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28915ad0-f594-4ea5-a28a-adf456febc1b.selectorLabels" . | nindent 6 }}
