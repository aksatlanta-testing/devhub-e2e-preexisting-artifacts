apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo562ca6a2-b680-4e5c-b9de-b6be2c25d563.fullname" . }}
  labels:
    {{- include "go-echo562ca6a2-b680-4e5c-b9de-b6be2c25d563.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo562ca6a2-b680-4e5c-b9de-b6be2c25d563.selectorLabels" . | nindent 6 }}
