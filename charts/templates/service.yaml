apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo351dffc7-c453-45fb-9f1c-cb65c1650e08.fullname" . }}
  labels:
    {{- include "go-echo351dffc7-c453-45fb-9f1c-cb65c1650e08.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo351dffc7-c453-45fb-9f1c-cb65c1650e08.selectorLabels" . | nindent 6 }}
