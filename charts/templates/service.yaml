apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo199578e1-f020-47e5-8fe3-119c397871ea.fullname" . }}
  labels:
    {{- include "go-echo199578e1-f020-47e5-8fe3-119c397871ea.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo199578e1-f020-47e5-8fe3-119c397871ea.selectorLabels" . | nindent 6 }}
