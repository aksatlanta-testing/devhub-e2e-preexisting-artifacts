apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe44f5872-e54a-4f06-8523-d5bf35155df3.fullname" . }}
  labels:
    {{- include "go-echoe44f5872-e54a-4f06-8523-d5bf35155df3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe44f5872-e54a-4f06-8523-d5bf35155df3.selectorLabels" . | nindent 6 }}
