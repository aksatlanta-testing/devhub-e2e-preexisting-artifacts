apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3ba2b75-8d20-487f-b357-1f3732816bfc.fullname" . }}
  labels:
    {{- include "go-echoa3ba2b75-8d20-487f-b357-1f3732816bfc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3ba2b75-8d20-487f-b357-1f3732816bfc.selectorLabels" . | nindent 6 }}
