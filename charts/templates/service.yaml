apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa129f5be-24d0-4bc4-a5b5-0575b10d11ab.fullname" . }}
  labels:
    {{- include "go-echoa129f5be-24d0-4bc4-a5b5-0575b10d11ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa129f5be-24d0-4bc4-a5b5-0575b10d11ab.selectorLabels" . | nindent 6 }}
