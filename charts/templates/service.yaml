apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28e89a53-046b-4916-bc24-62e389890427.fullname" . }}
  labels:
    {{- include "go-echo28e89a53-046b-4916-bc24-62e389890427.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28e89a53-046b-4916-bc24-62e389890427.selectorLabels" . | nindent 6 }}
