apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob85a7c76-6fd1-4cca-ad00-551a4f8efebf.fullname" . }}
  labels:
    {{- include "go-echob85a7c76-6fd1-4cca-ad00-551a4f8efebf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob85a7c76-6fd1-4cca-ad00-551a4f8efebf.selectorLabels" . | nindent 6 }}
