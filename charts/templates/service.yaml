apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ea79502-0246-4106-bd7f-bf16ab3e2e76.fullname" . }}
  labels:
    {{- include "go-echo3ea79502-0246-4106-bd7f-bf16ab3e2e76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ea79502-0246-4106-bd7f-bf16ab3e2e76.selectorLabels" . | nindent 6 }}
