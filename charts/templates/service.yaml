apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1de6b072-8945-4408-a0ff-450a92b2cbdf.fullname" . }}
  labels:
    {{- include "go-echo1de6b072-8945-4408-a0ff-450a92b2cbdf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1de6b072-8945-4408-a0ff-450a92b2cbdf.selectorLabels" . | nindent 6 }}
