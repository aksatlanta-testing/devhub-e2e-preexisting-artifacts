apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa0dada42-1e05-4475-bec0-7c3226d56778.fullname" . }}
  labels:
    {{- include "go-echoa0dada42-1e05-4475-bec0-7c3226d56778.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa0dada42-1e05-4475-bec0-7c3226d56778.selectorLabels" . | nindent 6 }}
