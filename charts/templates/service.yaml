apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51b6f722-d9de-4355-9ac7-d98fecebcc73.fullname" . }}
  labels:
    {{- include "go-echo51b6f722-d9de-4355-9ac7-d98fecebcc73.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51b6f722-d9de-4355-9ac7-d98fecebcc73.selectorLabels" . | nindent 6 }}
