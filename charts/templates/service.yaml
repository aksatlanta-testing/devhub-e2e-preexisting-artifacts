apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a3feeaa-de10-48ad-842e-eba92982e31a.fullname" . }}
  labels:
    {{- include "go-echo9a3feeaa-de10-48ad-842e-eba92982e31a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a3feeaa-de10-48ad-842e-eba92982e31a.selectorLabels" . | nindent 6 }}
