apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo021b3a9a-30cb-4ad1-ad8f-c0384ccbcf53.fullname" . }}
  labels:
    {{- include "go-echo021b3a9a-30cb-4ad1-ad8f-c0384ccbcf53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo021b3a9a-30cb-4ad1-ad8f-c0384ccbcf53.selectorLabels" . | nindent 6 }}
