apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0972ddde-3e46-4d6a-8ffa-5c3eb2fb8525.fullname" . }}
  labels:
    {{- include "go-echo0972ddde-3e46-4d6a-8ffa-5c3eb2fb8525.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0972ddde-3e46-4d6a-8ffa-5c3eb2fb8525.selectorLabels" . | nindent 6 }}
