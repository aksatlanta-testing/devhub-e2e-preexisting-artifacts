apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8815e05a-e12d-4af4-b66b-21f30f21dab8.fullname" . }}
  labels:
    {{- include "go-echo8815e05a-e12d-4af4-b66b-21f30f21dab8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8815e05a-e12d-4af4-b66b-21f30f21dab8.selectorLabels" . | nindent 6 }}
