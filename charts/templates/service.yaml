apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobaf3f863-82e6-4478-8954-4aee1405dc4f.fullname" . }}
  labels:
    {{- include "go-echobaf3f863-82e6-4478-8954-4aee1405dc4f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobaf3f863-82e6-4478-8954-4aee1405dc4f.selectorLabels" . | nindent 6 }}
