apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2407429-a4ad-418a-85d7-21016072b523.fullname" . }}
  labels:
    {{- include "go-echof2407429-a4ad-418a-85d7-21016072b523.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2407429-a4ad-418a-85d7-21016072b523.selectorLabels" . | nindent 6 }}
