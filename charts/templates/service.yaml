apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob73afc1f-05c1-4f41-9d2f-2f148d350b8f.fullname" . }}
  labels:
    {{- include "go-echob73afc1f-05c1-4f41-9d2f-2f148d350b8f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob73afc1f-05c1-4f41-9d2f-2f148d350b8f.selectorLabels" . | nindent 6 }}
