apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98ca8773-f106-4e83-8910-3c211586771d.fullname" . }}
  labels:
    {{- include "go-echo98ca8773-f106-4e83-8910-3c211586771d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98ca8773-f106-4e83-8910-3c211586771d.selectorLabels" . | nindent 6 }}
