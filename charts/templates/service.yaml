apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc91dbe31-25fd-46f6-abbb-ac952572d133.fullname" . }}
  labels:
    {{- include "go-echoc91dbe31-25fd-46f6-abbb-ac952572d133.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc91dbe31-25fd-46f6-abbb-ac952572d133.selectorLabels" . | nindent 6 }}
