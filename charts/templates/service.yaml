apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe745e59e-7eab-4410-b277-38e4e01a6f56.fullname" . }}
  labels:
    {{- include "go-echoe745e59e-7eab-4410-b277-38e4e01a6f56.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe745e59e-7eab-4410-b277-38e4e01a6f56.selectorLabels" . | nindent 6 }}
