apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2bc1f3a9-ddb1-483a-9d32-58dcda228fcc.fullname" . }}
  labels:
    {{- include "go-echo2bc1f3a9-ddb1-483a-9d32-58dcda228fcc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2bc1f3a9-ddb1-483a-9d32-58dcda228fcc.selectorLabels" . | nindent 6 }}
