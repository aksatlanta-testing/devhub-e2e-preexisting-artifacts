apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1a30cc8-c4d0-4b07-ad3c-7a406e21a9f7.fullname" . }}
  labels:
    {{- include "go-echoe1a30cc8-c4d0-4b07-ad3c-7a406e21a9f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1a30cc8-c4d0-4b07-ad3c-7a406e21a9f7.selectorLabels" . | nindent 6 }}
