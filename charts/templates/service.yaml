apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12ac3619-4ed0-410b-bb06-2c9c13e1203c.fullname" . }}
  labels:
    {{- include "go-echo12ac3619-4ed0-410b-bb06-2c9c13e1203c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12ac3619-4ed0-410b-bb06-2c9c13e1203c.selectorLabels" . | nindent 6 }}
