apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c464e98-7223-4462-b012-a8c7e5535ccf.fullname" . }}
  labels:
    {{- include "go-echo2c464e98-7223-4462-b012-a8c7e5535ccf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c464e98-7223-4462-b012-a8c7e5535ccf.selectorLabels" . | nindent 6 }}
