apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo452ad8be-c0da-4893-aac9-0c9944abb1d2.fullname" . }}
  labels:
    {{- include "go-echo452ad8be-c0da-4893-aac9-0c9944abb1d2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo452ad8be-c0da-4893-aac9-0c9944abb1d2.selectorLabels" . | nindent 6 }}
