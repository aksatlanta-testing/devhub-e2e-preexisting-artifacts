apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe87d5fcd-6277-41ba-9a9d-fc98eb9c3359.fullname" . }}
  labels:
    {{- include "go-echoe87d5fcd-6277-41ba-9a9d-fc98eb9c3359.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe87d5fcd-6277-41ba-9a9d-fc98eb9c3359.selectorLabels" . | nindent 6 }}
