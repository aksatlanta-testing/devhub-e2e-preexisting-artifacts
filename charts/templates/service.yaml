apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobfe8e9bd-9839-4f1e-acc7-55d39de59e12.fullname" . }}
  labels:
    {{- include "go-echobfe8e9bd-9839-4f1e-acc7-55d39de59e12.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobfe8e9bd-9839-4f1e-acc7-55d39de59e12.selectorLabels" . | nindent 6 }}
