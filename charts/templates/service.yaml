apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02478c93-6636-477c-8295-04ece2aaff83.fullname" . }}
  labels:
    {{- include "go-echo02478c93-6636-477c-8295-04ece2aaff83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02478c93-6636-477c-8295-04ece2aaff83.selectorLabels" . | nindent 6 }}
