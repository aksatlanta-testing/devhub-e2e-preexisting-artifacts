apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo344b3d1c-414e-4c9a-b5ed-e4b76642e87e.fullname" . }}
  labels:
    {{- include "go-echo344b3d1c-414e-4c9a-b5ed-e4b76642e87e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo344b3d1c-414e-4c9a-b5ed-e4b76642e87e.selectorLabels" . | nindent 6 }}
