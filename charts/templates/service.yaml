apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7460d50-7248-44a8-b7d1-59b8dc3c695f.fullname" . }}
  labels:
    {{- include "go-echoa7460d50-7248-44a8-b7d1-59b8dc3c695f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7460d50-7248-44a8-b7d1-59b8dc3c695f.selectorLabels" . | nindent 6 }}
