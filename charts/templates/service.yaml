apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoded0d85d-b9b0-48b3-95ee-68c17bfc692a.fullname" . }}
  labels:
    {{- include "go-echoded0d85d-b9b0-48b3-95ee-68c17bfc692a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoded0d85d-b9b0-48b3-95ee-68c17bfc692a.selectorLabels" . | nindent 6 }}
