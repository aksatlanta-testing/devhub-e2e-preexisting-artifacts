apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d98943f-5697-4ba2-af88-f9c0613f8602.fullname" . }}
  labels:
    {{- include "go-echo5d98943f-5697-4ba2-af88-f9c0613f8602.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d98943f-5697-4ba2-af88-f9c0613f8602.selectorLabels" . | nindent 6 }}
