apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47e0cf3b-7c9c-42d0-8597-d3791987ad92.fullname" . }}
  labels:
    {{- include "go-echo47e0cf3b-7c9c-42d0-8597-d3791987ad92.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47e0cf3b-7c9c-42d0-8597-d3791987ad92.selectorLabels" . | nindent 6 }}
