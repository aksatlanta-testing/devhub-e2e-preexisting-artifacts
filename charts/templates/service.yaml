apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2af1e45e-88e6-4fe6-a4a5-09cb571ad0f3.fullname" . }}
  labels:
    {{- include "go-echo2af1e45e-88e6-4fe6-a4a5-09cb571ad0f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2af1e45e-88e6-4fe6-a4a5-09cb571ad0f3.selectorLabels" . | nindent 6 }}
