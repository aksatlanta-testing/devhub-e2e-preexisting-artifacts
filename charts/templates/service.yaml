apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo272d9d78-ee33-4b58-94b3-e3c509f84f28.fullname" . }}
  labels:
    {{- include "go-echo272d9d78-ee33-4b58-94b3-e3c509f84f28.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo272d9d78-ee33-4b58-94b3-e3c509f84f28.selectorLabels" . | nindent 6 }}
