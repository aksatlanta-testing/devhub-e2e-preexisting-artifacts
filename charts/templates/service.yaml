apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62d53efa-f62d-40db-9440-3a3bcfd9639f.fullname" . }}
  labels:
    {{- include "go-echo62d53efa-f62d-40db-9440-3a3bcfd9639f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62d53efa-f62d-40db-9440-3a3bcfd9639f.selectorLabels" . | nindent 6 }}
