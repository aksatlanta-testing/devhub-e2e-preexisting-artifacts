apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe618f16f-ace1-4b2e-a9b6-95a0cdb754a9.fullname" . }}
  labels:
    {{- include "go-echoe618f16f-ace1-4b2e-a9b6-95a0cdb754a9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe618f16f-ace1-4b2e-a9b6-95a0cdb754a9.selectorLabels" . | nindent 6 }}
