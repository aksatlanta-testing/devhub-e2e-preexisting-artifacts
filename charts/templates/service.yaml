apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92aa992d-9c53-4930-a748-0a5464a3d165.fullname" . }}
  labels:
    {{- include "go-echo92aa992d-9c53-4930-a748-0a5464a3d165.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92aa992d-9c53-4930-a748-0a5464a3d165.selectorLabels" . | nindent 6 }}
