apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e8c0585-cb48-4422-b731-4e021a503a0a.fullname" . }}
  labels:
    {{- include "go-echo0e8c0585-cb48-4422-b731-4e021a503a0a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e8c0585-cb48-4422-b731-4e021a503a0a.selectorLabels" . | nindent 6 }}
