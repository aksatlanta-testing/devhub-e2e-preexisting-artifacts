apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo85216edd-0bcc-4f91-a6c3-c20810c2cde2.fullname" . }}
  labels:
    {{- include "go-echo85216edd-0bcc-4f91-a6c3-c20810c2cde2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo85216edd-0bcc-4f91-a6c3-c20810c2cde2.selectorLabels" . | nindent 6 }}
