apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod20ae143-7c2a-4c12-9fe9-50086013320d.fullname" . }}
  labels:
    {{- include "go-echod20ae143-7c2a-4c12-9fe9-50086013320d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod20ae143-7c2a-4c12-9fe9-50086013320d.selectorLabels" . | nindent 6 }}
