apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ed80bb7-320a-4790-99fb-ab3a7d3cd024.fullname" . }}
  labels:
    {{- include "go-echo7ed80bb7-320a-4790-99fb-ab3a7d3cd024.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ed80bb7-320a-4790-99fb-ab3a7d3cd024.selectorLabels" . | nindent 6 }}
