apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d9c1a98-7e8f-4395-a65a-43507ed752ab.fullname" . }}
  labels:
    {{- include "go-echo6d9c1a98-7e8f-4395-a65a-43507ed752ab.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d9c1a98-7e8f-4395-a65a-43507ed752ab.selectorLabels" . | nindent 6 }}
