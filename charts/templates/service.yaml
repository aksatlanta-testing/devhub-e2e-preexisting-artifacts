apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05d8fd9f-79c6-4d08-be56-4d720e1576b5.fullname" . }}
  labels:
    {{- include "go-echo05d8fd9f-79c6-4d08-be56-4d720e1576b5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05d8fd9f-79c6-4d08-be56-4d720e1576b5.selectorLabels" . | nindent 6 }}
