apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2678a1f-9334-444f-86bf-aa2cf4aab804.fullname" . }}
  labels:
    {{- include "go-echoc2678a1f-9334-444f-86bf-aa2cf4aab804.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2678a1f-9334-444f-86bf-aa2cf4aab804.selectorLabels" . | nindent 6 }}
