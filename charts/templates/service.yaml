apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f402e0f-6a0d-4aea-8552-0a82f795b65f.fullname" . }}
  labels:
    {{- include "go-echo3f402e0f-6a0d-4aea-8552-0a82f795b65f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f402e0f-6a0d-4aea-8552-0a82f795b65f.selectorLabels" . | nindent 6 }}
