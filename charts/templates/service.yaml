apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c3a49a6-5173-4a74-b8ab-22f33d4a9fa1.fullname" . }}
  labels:
    {{- include "go-echo8c3a49a6-5173-4a74-b8ab-22f33d4a9fa1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c3a49a6-5173-4a74-b8ab-22f33d4a9fa1.selectorLabels" . | nindent 6 }}
