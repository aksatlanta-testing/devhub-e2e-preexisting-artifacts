apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a1ea31f-6f81-42d7-be48-3cb220b7c5ed.fullname" . }}
  labels:
    {{- include "go-echo6a1ea31f-6f81-42d7-be48-3cb220b7c5ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a1ea31f-6f81-42d7-be48-3cb220b7c5ed.selectorLabels" . | nindent 6 }}
