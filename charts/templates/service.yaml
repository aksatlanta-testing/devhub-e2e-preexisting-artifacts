apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08c2ef13-ef07-4124-8fcf-3883b0cab6bb.fullname" . }}
  labels:
    {{- include "go-echo08c2ef13-ef07-4124-8fcf-3883b0cab6bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08c2ef13-ef07-4124-8fcf-3883b0cab6bb.selectorLabels" . | nindent 6 }}
