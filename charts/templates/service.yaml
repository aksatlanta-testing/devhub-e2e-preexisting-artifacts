apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5f631ce-d879-406d-a521-682e8a48fa5e.fullname" . }}
  labels:
    {{- include "go-echoe5f631ce-d879-406d-a521-682e8a48fa5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5f631ce-d879-406d-a521-682e8a48fa5e.selectorLabels" . | nindent 6 }}
