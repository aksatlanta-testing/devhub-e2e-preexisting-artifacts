apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a728d52-dd5f-46d2-ad21-df048baaa276.fullname" . }}
  labels:
    {{- include "go-echo7a728d52-dd5f-46d2-ad21-df048baaa276.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a728d52-dd5f-46d2-ad21-df048baaa276.selectorLabels" . | nindent 6 }}
