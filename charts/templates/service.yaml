apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6071f4fa-1377-4220-a3a8-16d60f5b4d35.fullname" . }}
  labels:
    {{- include "go-echo6071f4fa-1377-4220-a3a8-16d60f5b4d35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6071f4fa-1377-4220-a3a8-16d60f5b4d35.selectorLabels" . | nindent 6 }}
