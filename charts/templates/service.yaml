apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f6ee2a5-414e-4bac-ad44-073bfe35fa61.fullname" . }}
  labels:
    {{- include "go-echo7f6ee2a5-414e-4bac-ad44-073bfe35fa61.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f6ee2a5-414e-4bac-ad44-073bfe35fa61.selectorLabels" . | nindent 6 }}
