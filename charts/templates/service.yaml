apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b332f1b-551b-4a24-b96e-6c970cde2afa.fullname" . }}
  labels:
    {{- include "go-echo0b332f1b-551b-4a24-b96e-6c970cde2afa.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b332f1b-551b-4a24-b96e-6c970cde2afa.selectorLabels" . | nindent 6 }}
