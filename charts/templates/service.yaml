apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ed826a8-addd-4399-9eba-3026f69ff073.fullname" . }}
  labels:
    {{- include "go-echo6ed826a8-addd-4399-9eba-3026f69ff073.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ed826a8-addd-4399-9eba-3026f69ff073.selectorLabels" . | nindent 6 }}
