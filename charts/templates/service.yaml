apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9d25c28-5299-4348-818e-541c82961968.fullname" . }}
  labels:
    {{- include "go-echoc9d25c28-5299-4348-818e-541c82961968.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9d25c28-5299-4348-818e-541c82961968.selectorLabels" . | nindent 6 }}
