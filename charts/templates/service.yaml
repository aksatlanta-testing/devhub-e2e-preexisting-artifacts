apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo564a7475-2e8c-4149-a07b-5eb2a4dc908f.fullname" . }}
  labels:
    {{- include "go-echo564a7475-2e8c-4149-a07b-5eb2a4dc908f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo564a7475-2e8c-4149-a07b-5eb2a4dc908f.selectorLabels" . | nindent 6 }}
