apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fcab582-caaa-45ad-85eb-ef8e6e0e0d50.fullname" . }}
  labels:
    {{- include "go-echo8fcab582-caaa-45ad-85eb-ef8e6e0e0d50.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fcab582-caaa-45ad-85eb-ef8e6e0e0d50.selectorLabels" . | nindent 6 }}
