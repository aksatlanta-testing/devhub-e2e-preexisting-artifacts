apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce1b4942-72a9-4cba-9602-f2248da13dac.fullname" . }}
  labels:
    {{- include "go-echoce1b4942-72a9-4cba-9602-f2248da13dac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce1b4942-72a9-4cba-9602-f2248da13dac.selectorLabels" . | nindent 6 }}
