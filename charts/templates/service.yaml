apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo039d0967-145c-481d-a246-0d6197bf763d.fullname" . }}
  labels:
    {{- include "go-echo039d0967-145c-481d-a246-0d6197bf763d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo039d0967-145c-481d-a246-0d6197bf763d.selectorLabels" . | nindent 6 }}
