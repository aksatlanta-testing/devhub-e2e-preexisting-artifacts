apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob690865b-2280-4859-98fb-80d3955dbd10.fullname" . }}
  labels:
    {{- include "go-echob690865b-2280-4859-98fb-80d3955dbd10.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob690865b-2280-4859-98fb-80d3955dbd10.selectorLabels" . | nindent 6 }}
