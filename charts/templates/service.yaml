apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe232637-a338-4b6c-931c-053afe653e02.fullname" . }}
  labels:
    {{- include "go-echobe232637-a338-4b6c-931c-053afe653e02.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe232637-a338-4b6c-931c-053afe653e02.selectorLabels" . | nindent 6 }}
