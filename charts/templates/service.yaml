apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e0c8790-8b2b-4fb9-9e36-65d9ce10de8a.fullname" . }}
  labels:
    {{- include "go-echo3e0c8790-8b2b-4fb9-9e36-65d9ce10de8a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e0c8790-8b2b-4fb9-9e36-65d9ce10de8a.selectorLabels" . | nindent 6 }}
