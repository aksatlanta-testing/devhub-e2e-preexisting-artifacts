apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo474e7c0f-c6c1-46d3-b84f-28fa66458342.fullname" . }}
  labels:
    {{- include "go-echo474e7c0f-c6c1-46d3-b84f-28fa66458342.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo474e7c0f-c6c1-46d3-b84f-28fa66458342.selectorLabels" . | nindent 6 }}
