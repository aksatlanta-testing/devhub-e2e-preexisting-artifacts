apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98847ec0-0f3b-48c4-a3d7-63fcc5e2855b.fullname" . }}
  labels:
    {{- include "go-echo98847ec0-0f3b-48c4-a3d7-63fcc5e2855b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98847ec0-0f3b-48c4-a3d7-63fcc5e2855b.selectorLabels" . | nindent 6 }}
