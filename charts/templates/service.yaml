apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e55084c-fa36-47cb-a345-75a1f719c087.fullname" . }}
  labels:
    {{- include "go-echo4e55084c-fa36-47cb-a345-75a1f719c087.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e55084c-fa36-47cb-a345-75a1f719c087.selectorLabels" . | nindent 6 }}
