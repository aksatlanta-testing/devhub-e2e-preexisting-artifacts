apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofaee2964-ae24-4b9b-bea2-58ac1cb9ac29.fullname" . }}
  labels:
    {{- include "go-echofaee2964-ae24-4b9b-bea2-58ac1cb9ac29.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofaee2964-ae24-4b9b-bea2-58ac1cb9ac29.selectorLabels" . | nindent 6 }}
