apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo85b8e55f-3b45-4d48-904a-c582bcb1a613.fullname" . }}
  labels:
    {{- include "go-echo85b8e55f-3b45-4d48-904a-c582bcb1a613.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo85b8e55f-3b45-4d48-904a-c582bcb1a613.selectorLabels" . | nindent 6 }}
