apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa33eaa71-f332-4d1e-8cb3-b5335beaecb7.fullname" . }}
  labels:
    {{- include "go-echoa33eaa71-f332-4d1e-8cb3-b5335beaecb7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa33eaa71-f332-4d1e-8cb3-b5335beaecb7.selectorLabels" . | nindent 6 }}
