apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo092fc6f2-db27-42ef-aa86-da8131b5d10a.fullname" . }}
  labels:
    {{- include "go-echo092fc6f2-db27-42ef-aa86-da8131b5d10a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo092fc6f2-db27-42ef-aa86-da8131b5d10a.selectorLabels" . | nindent 6 }}
