apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo587945cb-9bc9-4422-ace4-bf998c98c5c8.fullname" . }}
  labels:
    {{- include "go-echo587945cb-9bc9-4422-ace4-bf998c98c5c8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo587945cb-9bc9-4422-ace4-bf998c98c5c8.selectorLabels" . | nindent 6 }}
