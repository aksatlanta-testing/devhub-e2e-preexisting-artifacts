apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f0688b3-08f8-4eb3-83a6-f022a9ff0b42.fullname" . }}
  labels:
    {{- include "go-echo8f0688b3-08f8-4eb3-83a6-f022a9ff0b42.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f0688b3-08f8-4eb3-83a6-f022a9ff0b42.selectorLabels" . | nindent 6 }}
