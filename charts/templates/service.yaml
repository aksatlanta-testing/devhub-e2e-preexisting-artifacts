apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ecbc087-c092-4a30-9eae-9935ddb188d0.fullname" . }}
  labels:
    {{- include "go-echo1ecbc087-c092-4a30-9eae-9935ddb188d0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ecbc087-c092-4a30-9eae-9935ddb188d0.selectorLabels" . | nindent 6 }}
