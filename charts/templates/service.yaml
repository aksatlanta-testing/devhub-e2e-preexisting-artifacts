apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd4b6e15-a2d1-4625-9cc2-e4b7d3c27c87.fullname" . }}
  labels:
    {{- include "go-echodd4b6e15-a2d1-4625-9cc2-e4b7d3c27c87.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd4b6e15-a2d1-4625-9cc2-e4b7d3c27c87.selectorLabels" . | nindent 6 }}
