apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17b9682b-fd11-427f-9387-c0d898e97c08.fullname" . }}
  labels:
    {{- include "go-echo17b9682b-fd11-427f-9387-c0d898e97c08.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17b9682b-fd11-427f-9387-c0d898e97c08.selectorLabels" . | nindent 6 }}
