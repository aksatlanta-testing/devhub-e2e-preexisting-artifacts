apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55ed065c-3506-4d52-a785-b4be7c3b8e40.fullname" . }}
  labels:
    {{- include "go-echo55ed065c-3506-4d52-a785-b4be7c3b8e40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55ed065c-3506-4d52-a785-b4be7c3b8e40.selectorLabels" . | nindent 6 }}
