apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82ebb5d4-542c-4150-8ba9-2d4deff4ed64.fullname" . }}
  labels:
    {{- include "go-echo82ebb5d4-542c-4150-8ba9-2d4deff4ed64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82ebb5d4-542c-4150-8ba9-2d4deff4ed64.selectorLabels" . | nindent 6 }}
