apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9285d8b9-4d5e-49d8-9e15-7c4f007d52d9.fullname" . }}
  labels:
    {{- include "go-echo9285d8b9-4d5e-49d8-9e15-7c4f007d52d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9285d8b9-4d5e-49d8-9e15-7c4f007d52d9.selectorLabels" . | nindent 6 }}
