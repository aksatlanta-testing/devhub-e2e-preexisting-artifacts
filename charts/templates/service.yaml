apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ec64093-4b2f-4acb-98aa-81b234fbdc74.fullname" . }}
  labels:
    {{- include "go-echo0ec64093-4b2f-4acb-98aa-81b234fbdc74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ec64093-4b2f-4acb-98aa-81b234fbdc74.selectorLabels" . | nindent 6 }}
