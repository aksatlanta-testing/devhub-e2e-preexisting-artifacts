apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo079454f9-e0d7-4a40-bfea-eeda9e1e1c9a.fullname" . }}
  labels:
    {{- include "go-echo079454f9-e0d7-4a40-bfea-eeda9e1e1c9a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo079454f9-e0d7-4a40-bfea-eeda9e1e1c9a.selectorLabels" . | nindent 6 }}
