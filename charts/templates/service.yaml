apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabb4d401-75b7-432d-a817-a15b65d849ce.fullname" . }}
  labels:
    {{- include "go-echoabb4d401-75b7-432d-a817-a15b65d849ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabb4d401-75b7-432d-a817-a15b65d849ce.selectorLabels" . | nindent 6 }}
