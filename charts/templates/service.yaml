apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobef746b1-535b-4a34-9dcb-786b64e6bf54.fullname" . }}
  labels:
    {{- include "go-echobef746b1-535b-4a34-9dcb-786b64e6bf54.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobef746b1-535b-4a34-9dcb-786b64e6bf54.selectorLabels" . | nindent 6 }}
