apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ef95ce1-648f-412a-9997-08195e0b7af1.fullname" . }}
  labels:
    {{- include "go-echo9ef95ce1-648f-412a-9997-08195e0b7af1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ef95ce1-648f-412a-9997-08195e0b7af1.selectorLabels" . | nindent 6 }}
