apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40ce3a0e-5199-47f5-95a5-ee388d3ac553.fullname" . }}
  labels:
    {{- include "go-echo40ce3a0e-5199-47f5-95a5-ee388d3ac553.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40ce3a0e-5199-47f5-95a5-ee388d3ac553.selectorLabels" . | nindent 6 }}
