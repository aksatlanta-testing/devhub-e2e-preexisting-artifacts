apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebb0291c-24a5-4edb-bb62-b8b43a0e1788.fullname" . }}
  labels:
    {{- include "go-echoebb0291c-24a5-4edb-bb62-b8b43a0e1788.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebb0291c-24a5-4edb-bb62-b8b43a0e1788.selectorLabels" . | nindent 6 }}
