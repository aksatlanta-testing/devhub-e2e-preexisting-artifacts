apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0c9e755-2e93-46a5-9e54-fa3c38b5907a.fullname" . }}
  labels:
    {{- include "go-echob0c9e755-2e93-46a5-9e54-fa3c38b5907a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0c9e755-2e93-46a5-9e54-fa3c38b5907a.selectorLabels" . | nindent 6 }}
