apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99a861f5-a35f-444e-a2c7-d7d175b221a5.fullname" . }}
  labels:
    {{- include "go-echo99a861f5-a35f-444e-a2c7-d7d175b221a5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99a861f5-a35f-444e-a2c7-d7d175b221a5.selectorLabels" . | nindent 6 }}
