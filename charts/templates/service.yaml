apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo434bd23f-d92d-407c-a5d6-f8e06ca6d9d4.fullname" . }}
  labels:
    {{- include "go-echo434bd23f-d92d-407c-a5d6-f8e06ca6d9d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo434bd23f-d92d-407c-a5d6-f8e06ca6d9d4.selectorLabels" . | nindent 6 }}
