apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92a62604-be72-493f-b281-733d4b0357b9.fullname" . }}
  labels:
    {{- include "go-echo92a62604-be72-493f-b281-733d4b0357b9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92a62604-be72-493f-b281-733d4b0357b9.selectorLabels" . | nindent 6 }}
