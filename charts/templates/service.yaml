apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofcc33057-a19a-46c4-8d7d-84f40c29c833.fullname" . }}
  labels:
    {{- include "go-echofcc33057-a19a-46c4-8d7d-84f40c29c833.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofcc33057-a19a-46c4-8d7d-84f40c29c833.selectorLabels" . | nindent 6 }}
