apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61f77f79-80a8-46a9-86b3-3a69f3f990fc.fullname" . }}
  labels:
    {{- include "go-echo61f77f79-80a8-46a9-86b3-3a69f3f990fc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61f77f79-80a8-46a9-86b3-3a69f3f990fc.selectorLabels" . | nindent 6 }}
