apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4ac2370-8cbb-49c8-a0bc-1ae6ed04ffac.fullname" . }}
  labels:
    {{- include "go-echod4ac2370-8cbb-49c8-a0bc-1ae6ed04ffac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4ac2370-8cbb-49c8-a0bc-1ae6ed04ffac.selectorLabels" . | nindent 6 }}
