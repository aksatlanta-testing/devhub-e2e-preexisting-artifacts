apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0af7f8d0-ab12-4943-90ff-cc760cace89f.fullname" . }}
  labels:
    {{- include "go-echo0af7f8d0-ab12-4943-90ff-cc760cace89f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0af7f8d0-ab12-4943-90ff-cc760cace89f.selectorLabels" . | nindent 6 }}
