apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c2bc6b5-1001-42f5-ab32-424f322bbbdc.fullname" . }}
  labels:
    {{- include "go-echo8c2bc6b5-1001-42f5-ab32-424f322bbbdc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c2bc6b5-1001-42f5-ab32-424f322bbbdc.selectorLabels" . | nindent 6 }}
