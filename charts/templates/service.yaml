apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c0756c2-33a1-4775-aa4e-41bcf898eff6.fullname" . }}
  labels:
    {{- include "go-echo6c0756c2-33a1-4775-aa4e-41bcf898eff6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
