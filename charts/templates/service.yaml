apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe131912d-7124-4dc6-a329-53d162daa287.fullname" . }}
  labels:
    {{- include "go-echoe131912d-7124-4dc6-a329-53d162daa287.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe131912d-7124-4dc6-a329-53d162daa287.selectorLabels" . | nindent 6 }}
