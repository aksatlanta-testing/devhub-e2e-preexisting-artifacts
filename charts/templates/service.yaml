apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7337b75-57e8-47e1-9104-17a3c38e0057.fullname" . }}
  labels:
    {{- include "go-echoa7337b75-57e8-47e1-9104-17a3c38e0057.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7337b75-57e8-47e1-9104-17a3c38e0057.selectorLabels" . | nindent 6 }}
