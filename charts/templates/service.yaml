apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe6712a5-ff64-4303-8206-e3ba6667f521.fullname" . }}
  labels:
    {{- include "go-echofe6712a5-ff64-4303-8206-e3ba6667f521.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe6712a5-ff64-4303-8206-e3ba6667f521.selectorLabels" . | nindent 6 }}
