apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe55679a7-b62a-4c7e-bf8f-18a51b99ab56.fullname" . }}
  labels:
    {{- include "go-echoe55679a7-b62a-4c7e-bf8f-18a51b99ab56.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe55679a7-b62a-4c7e-bf8f-18a51b99ab56.selectorLabels" . | nindent 6 }}
