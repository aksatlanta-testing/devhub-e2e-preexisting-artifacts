apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7380b4c4-d3fd-4436-b950-d6020053a254.fullname" . }}
  labels:
    {{- include "go-echo7380b4c4-d3fd-4436-b950-d6020053a254.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7380b4c4-d3fd-4436-b950-d6020053a254.selectorLabels" . | nindent 6 }}
