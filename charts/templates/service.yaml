apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4eb8c23a-0eb3-4d42-bc53-da4102b29c2f.fullname" . }}
  labels:
    {{- include "go-echo4eb8c23a-0eb3-4d42-bc53-da4102b29c2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4eb8c23a-0eb3-4d42-bc53-da4102b29c2f.selectorLabels" . | nindent 6 }}
