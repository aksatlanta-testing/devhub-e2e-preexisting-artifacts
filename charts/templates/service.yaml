apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3bb7cc0-9a50-468a-8734-5a6b89e8beef.fullname" . }}
  labels:
    {{- include "go-echoc3bb7cc0-9a50-468a-8734-5a6b89e8beef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3bb7cc0-9a50-468a-8734-5a6b89e8beef.selectorLabels" . | nindent 6 }}
