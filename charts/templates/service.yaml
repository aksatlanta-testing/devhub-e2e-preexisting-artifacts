apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59d71e03-477f-4169-af1d-93e58f82760b.fullname" . }}
  labels:
    {{- include "go-echo59d71e03-477f-4169-af1d-93e58f82760b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59d71e03-477f-4169-af1d-93e58f82760b.selectorLabels" . | nindent 6 }}
