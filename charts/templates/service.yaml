apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a2069a0-f0f8-4877-aed4-aebb54b8fc87.fullname" . }}
  labels:
    {{- include "go-echo7a2069a0-f0f8-4877-aed4-aebb54b8fc87.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a2069a0-f0f8-4877-aed4-aebb54b8fc87.selectorLabels" . | nindent 6 }}
