apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad5352d7-c3eb-4dac-94ca-1d6b1ff85c90.fullname" . }}
  labels:
    {{- include "go-echoad5352d7-c3eb-4dac-94ca-1d6b1ff85c90.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad5352d7-c3eb-4dac-94ca-1d6b1ff85c90.selectorLabels" . | nindent 6 }}
