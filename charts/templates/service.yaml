apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe45a34de-3265-445c-a43d-fec716feaf11.fullname" . }}
  labels:
    {{- include "go-echoe45a34de-3265-445c-a43d-fec716feaf11.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe45a34de-3265-445c-a43d-fec716feaf11.selectorLabels" . | nindent 6 }}
