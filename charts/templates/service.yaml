apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof61cf745-aaa5-46a5-acd4-e098b1213738.fullname" . }}
  labels:
    {{- include "go-echof61cf745-aaa5-46a5-acd4-e098b1213738.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof61cf745-aaa5-46a5-acd4-e098b1213738.selectorLabels" . | nindent 6 }}
