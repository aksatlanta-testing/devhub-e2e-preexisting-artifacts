apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd989f1e-09d9-44eb-98fb-db660776f532.fullname" . }}
  labels:
    {{- include "go-echobd989f1e-09d9-44eb-98fb-db660776f532.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd989f1e-09d9-44eb-98fb-db660776f532.selectorLabels" . | nindent 6 }}
