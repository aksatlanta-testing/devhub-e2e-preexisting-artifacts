apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0c00e066-f0db-4036-a6ba-eb07eaece7f3.fullname" . }}
  labels:
    {{- include "go-echo0c00e066-f0db-4036-a6ba-eb07eaece7f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0c00e066-f0db-4036-a6ba-eb07eaece7f3.selectorLabels" . | nindent 6 }}
