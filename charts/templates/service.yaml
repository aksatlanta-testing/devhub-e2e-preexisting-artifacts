apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25fdd327-561a-4bee-9c47-bcb10ee58938.fullname" . }}
  labels:
    {{- include "go-echo25fdd327-561a-4bee-9c47-bcb10ee58938.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25fdd327-561a-4bee-9c47-bcb10ee58938.selectorLabels" . | nindent 6 }}
