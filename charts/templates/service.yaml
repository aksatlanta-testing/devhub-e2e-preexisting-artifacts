apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob850f193-02e2-467d-8e97-5decf6c81b18.fullname" . }}
  labels:
    {{- include "go-echob850f193-02e2-467d-8e97-5decf6c81b18.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob850f193-02e2-467d-8e97-5decf6c81b18.selectorLabels" . | nindent 6 }}
