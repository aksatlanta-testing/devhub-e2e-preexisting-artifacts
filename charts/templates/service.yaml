apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6999f27-6d5e-4fcf-bd77-d0613b73e266.fullname" . }}
  labels:
    {{- include "go-echoa6999f27-6d5e-4fcf-bd77-d0613b73e266.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6999f27-6d5e-4fcf-bd77-d0613b73e266.selectorLabels" . | nindent 6 }}
