apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe89a7db-0245-4ec7-9b7b-f2de16b483c9.fullname" . }}
  labels:
    {{- include "go-echobe89a7db-0245-4ec7-9b7b-f2de16b483c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe89a7db-0245-4ec7-9b7b-f2de16b483c9.selectorLabels" . | nindent 6 }}
