apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f8d2126-17b2-4a38-8b62-02d9a425761c.fullname" . }}
  labels:
    {{- include "go-echo7f8d2126-17b2-4a38-8b62-02d9a425761c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f8d2126-17b2-4a38-8b62-02d9a425761c.selectorLabels" . | nindent 6 }}
