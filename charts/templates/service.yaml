apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4aa12e8-e549-4d5c-ab75-2679ff6fc69e.fullname" . }}
  labels:
    {{- include "go-echod4aa12e8-e549-4d5c-ab75-2679ff6fc69e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4aa12e8-e549-4d5c-ab75-2679ff6fc69e.selectorLabels" . | nindent 6 }}
