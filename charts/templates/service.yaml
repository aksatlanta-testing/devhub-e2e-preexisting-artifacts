apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a69d15a-8e32-4030-9f7f-29d59708576b.fullname" . }}
  labels:
    {{- include "go-echo9a69d15a-8e32-4030-9f7f-29d59708576b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a69d15a-8e32-4030-9f7f-29d59708576b.selectorLabels" . | nindent 6 }}
