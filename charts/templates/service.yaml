apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78595de0-f1ee-4e76-adee-f1551d341d9b.fullname" . }}
  labels:
    {{- include "go-echo78595de0-f1ee-4e76-adee-f1551d341d9b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78595de0-f1ee-4e76-adee-f1551d341d9b.selectorLabels" . | nindent 6 }}
