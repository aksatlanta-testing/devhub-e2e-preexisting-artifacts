apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo540d8a41-9adb-453f-a61a-a97f29f5031b.fullname" . }}
  labels:
    {{- include "go-echo540d8a41-9adb-453f-a61a-a97f29f5031b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo540d8a41-9adb-453f-a61a-a97f29f5031b.selectorLabels" . | nindent 6 }}
