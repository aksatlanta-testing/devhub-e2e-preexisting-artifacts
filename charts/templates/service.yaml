apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17f11297-e132-4990-9001-f2fa729e9ceb.fullname" . }}
  labels:
    {{- include "go-echo17f11297-e132-4990-9001-f2fa729e9ceb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17f11297-e132-4990-9001-f2fa729e9ceb.selectorLabels" . | nindent 6 }}
