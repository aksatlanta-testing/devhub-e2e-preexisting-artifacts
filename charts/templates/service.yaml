apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa89a7cf7-e47b-4210-aa29-8ab904a9cdaa.fullname" . }}
  labels:
    {{- include "go-echoa89a7cf7-e47b-4210-aa29-8ab904a9cdaa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa89a7cf7-e47b-4210-aa29-8ab904a9cdaa.selectorLabels" . | nindent 6 }}
