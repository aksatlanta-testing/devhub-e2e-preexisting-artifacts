apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7405e6d-e39c-451c-88b7-da8c65945e9e.fullname" . }}
  labels:
    {{- include "go-echoc7405e6d-e39c-451c-88b7-da8c65945e9e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7405e6d-e39c-451c-88b7-da8c65945e9e.selectorLabels" . | nindent 6 }}
