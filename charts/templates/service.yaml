apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe423370c-f178-497c-aff5-abf4be76e11e.fullname" . }}
  labels:
    {{- include "go-echoe423370c-f178-497c-aff5-abf4be76e11e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe423370c-f178-497c-aff5-abf4be76e11e.selectorLabels" . | nindent 6 }}
