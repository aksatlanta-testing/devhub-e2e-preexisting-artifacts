apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01607f83-d416-4f14-a998-943a8e73fd6d.fullname" . }}
  labels:
    {{- include "go-echo01607f83-d416-4f14-a998-943a8e73fd6d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01607f83-d416-4f14-a998-943a8e73fd6d.selectorLabels" . | nindent 6 }}
