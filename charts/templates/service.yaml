apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d37651f-93e7-45b1-82f2-0905e7150161.fullname" . }}
  labels:
    {{- include "go-echo2d37651f-93e7-45b1-82f2-0905e7150161.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d37651f-93e7-45b1-82f2-0905e7150161.selectorLabels" . | nindent 6 }}
