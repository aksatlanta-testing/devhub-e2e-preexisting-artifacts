apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo374fc87e-ad1f-4796-833a-fee509e5025d.fullname" . }}
  labels:
    {{- include "go-echo374fc87e-ad1f-4796-833a-fee509e5025d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo374fc87e-ad1f-4796-833a-fee509e5025d.selectorLabels" . | nindent 6 }}
