apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21c11037-157e-49b5-a4fa-9b8ce88e5e37.fullname" . }}
  labels:
    {{- include "go-echo21c11037-157e-49b5-a4fa-9b8ce88e5e37.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21c11037-157e-49b5-a4fa-9b8ce88e5e37.selectorLabels" . | nindent 6 }}
