apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa4b0cef-dc09-4700-be6e-0905aac2e0d2.fullname" . }}
  labels:
    {{- include "go-echoaa4b0cef-dc09-4700-be6e-0905aac2e0d2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa4b0cef-dc09-4700-be6e-0905aac2e0d2.selectorLabels" . | nindent 6 }}
