apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa346eeca-243d-44a1-80fb-7d0dcb44e011.fullname" . }}
  labels:
    {{- include "go-echoa346eeca-243d-44a1-80fb-7d0dcb44e011.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa346eeca-243d-44a1-80fb-7d0dcb44e011.selectorLabels" . | nindent 6 }}
