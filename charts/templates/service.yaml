apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfbe34ca-cb62-4ef7-8bcd-772837a17da4.fullname" . }}
  labels:
    {{- include "go-echodfbe34ca-cb62-4ef7-8bcd-772837a17da4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfbe34ca-cb62-4ef7-8bcd-772837a17da4.selectorLabels" . | nindent 6 }}
