apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a2b20fa-e7cd-4166-832b-19e4b862aaaa.fullname" . }}
  labels:
    {{- include "go-echo4a2b20fa-e7cd-4166-832b-19e4b862aaaa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a2b20fa-e7cd-4166-832b-19e4b862aaaa.selectorLabels" . | nindent 6 }}
