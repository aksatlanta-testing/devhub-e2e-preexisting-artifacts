apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05c855c0-3b31-4be9-a2b9-3b442b600c20.fullname" . }}
  labels:
    {{- include "go-echo05c855c0-3b31-4be9-a2b9-3b442b600c20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05c855c0-3b31-4be9-a2b9-3b442b600c20.selectorLabels" . | nindent 6 }}
