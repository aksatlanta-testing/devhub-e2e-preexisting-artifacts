apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe72280c2-fb04-41bd-b4bd-7a4e91ce20ea.fullname" . }}
  labels:
    {{- include "go-echoe72280c2-fb04-41bd-b4bd-7a4e91ce20ea.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe72280c2-fb04-41bd-b4bd-7a4e91ce20ea.selectorLabels" . | nindent 6 }}
