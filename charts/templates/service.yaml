apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedaded5a-8928-461e-94bc-dbca5be2436d.fullname" . }}
  labels:
    {{- include "go-echoedaded5a-8928-461e-94bc-dbca5be2436d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedaded5a-8928-461e-94bc-dbca5be2436d.selectorLabels" . | nindent 6 }}
