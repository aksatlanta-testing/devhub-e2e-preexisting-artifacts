apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo918eda68-c7dd-4a0a-b2d1-e5991841a0cc.fullname" . }}
  labels:
    {{- include "go-echo918eda68-c7dd-4a0a-b2d1-e5991841a0cc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo918eda68-c7dd-4a0a-b2d1-e5991841a0cc.selectorLabels" . | nindent 6 }}
