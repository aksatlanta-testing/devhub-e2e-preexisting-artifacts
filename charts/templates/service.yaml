apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae311548-54c4-43e7-8ff7-64ec501ceeda.fullname" . }}
  labels:
    {{- include "go-echoae311548-54c4-43e7-8ff7-64ec501ceeda.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae311548-54c4-43e7-8ff7-64ec501ceeda.selectorLabels" . | nindent 6 }}
