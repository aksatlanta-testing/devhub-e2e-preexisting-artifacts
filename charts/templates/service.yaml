apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1720c5ac-d544-4f75-afe9-ad45162a9d36.fullname" . }}
  labels:
    {{- include "go-echo1720c5ac-d544-4f75-afe9-ad45162a9d36.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1720c5ac-d544-4f75-afe9-ad45162a9d36.selectorLabels" . | nindent 6 }}
