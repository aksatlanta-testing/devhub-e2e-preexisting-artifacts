apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3f14baa-0e3d-49ef-be80-ad57b6a03bb4.fullname" . }}
  labels:
    {{- include "go-echoe3f14baa-0e3d-49ef-be80-ad57b6a03bb4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3f14baa-0e3d-49ef-be80-ad57b6a03bb4.selectorLabels" . | nindent 6 }}
