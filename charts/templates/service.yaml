apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72f7f4b2-5bdc-4843-8e04-5b6c2b59483b.fullname" . }}
  labels:
    {{- include "go-echo72f7f4b2-5bdc-4843-8e04-5b6c2b59483b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72f7f4b2-5bdc-4843-8e04-5b6c2b59483b.selectorLabels" . | nindent 6 }}
