apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9463ab3e-12e1-4326-a64e-16f7685767b5.fullname" . }}
  labels:
    {{- include "go-echo9463ab3e-12e1-4326-a64e-16f7685767b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9463ab3e-12e1-4326-a64e-16f7685767b5.selectorLabels" . | nindent 6 }}
