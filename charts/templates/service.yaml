apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ca6f453-afb1-488a-bc7a-35feaebaaadc.fullname" . }}
  labels:
    {{- include "go-echo8ca6f453-afb1-488a-bc7a-35feaebaaadc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ca6f453-afb1-488a-bc7a-35feaebaaadc.selectorLabels" . | nindent 6 }}
