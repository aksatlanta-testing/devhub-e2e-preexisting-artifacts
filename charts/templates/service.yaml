apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b7a81fb-9c01-441d-aad9-f8b474722dc4.fullname" . }}
  labels:
    {{- include "go-echo2b7a81fb-9c01-441d-aad9-f8b474722dc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b7a81fb-9c01-441d-aad9-f8b474722dc4.selectorLabels" . | nindent 6 }}
