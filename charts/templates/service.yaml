apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ab4993d-ef0d-4b61-8cbf-80087b26cac5.fullname" . }}
  labels:
    {{- include "go-echo9ab4993d-ef0d-4b61-8cbf-80087b26cac5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ab4993d-ef0d-4b61-8cbf-80087b26cac5.selectorLabels" . | nindent 6 }}
