apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c18f084-aa4a-4b1d-bbc8-a7b16de86e50.fullname" . }}
  labels:
    {{- include "go-echo1c18f084-aa4a-4b1d-bbc8-a7b16de86e50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c18f084-aa4a-4b1d-bbc8-a7b16de86e50.selectorLabels" . | nindent 6 }}
