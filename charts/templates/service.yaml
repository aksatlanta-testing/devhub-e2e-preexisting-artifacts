apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd866fc3-3fdc-4b52-a9f3-b1615efbef00.fullname" . }}
  labels:
    {{- include "go-echodd866fc3-3fdc-4b52-a9f3-b1615efbef00.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd866fc3-3fdc-4b52-a9f3-b1615efbef00.selectorLabels" . | nindent 6 }}
