apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32b77eaf-1c8f-4bd7-9ac5-3027d72be0db.fullname" . }}
  labels:
    {{- include "go-echo32b77eaf-1c8f-4bd7-9ac5-3027d72be0db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32b77eaf-1c8f-4bd7-9ac5-3027d72be0db.selectorLabels" . | nindent 6 }}
