apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91abedae-cbac-4bf5-8903-71eddffb98ac.fullname" . }}
  labels:
    {{- include "go-echo91abedae-cbac-4bf5-8903-71eddffb98ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91abedae-cbac-4bf5-8903-71eddffb98ac.selectorLabels" . | nindent 6 }}
