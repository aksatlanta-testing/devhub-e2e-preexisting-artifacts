apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc68ce0ab-6a81-452f-9f61-94733473989d.fullname" . }}
  labels:
    {{- include "go-echoc68ce0ab-6a81-452f-9f61-94733473989d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc68ce0ab-6a81-452f-9f61-94733473989d.selectorLabels" . | nindent 6 }}
