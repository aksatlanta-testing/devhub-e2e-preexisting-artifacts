apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1d327c4-ec74-4eae-866a-55f3d4b0ac1b.fullname" . }}
  labels:
    {{- include "go-echoa1d327c4-ec74-4eae-866a-55f3d4b0ac1b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1d327c4-ec74-4eae-866a-55f3d4b0ac1b.selectorLabels" . | nindent 6 }}
