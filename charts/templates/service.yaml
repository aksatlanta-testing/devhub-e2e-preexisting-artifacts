apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0f76d77-3b60-4c1d-8491-40b592f907ef.fullname" . }}
  labels:
    {{- include "go-echob0f76d77-3b60-4c1d-8491-40b592f907ef.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0f76d77-3b60-4c1d-8491-40b592f907ef.selectorLabels" . | nindent 6 }}
