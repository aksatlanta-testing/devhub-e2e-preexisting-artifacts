apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fada2a1-eaa6-4501-8492-52eafae997ad.fullname" . }}
  labels:
    {{- include "go-echo6fada2a1-eaa6-4501-8492-52eafae997ad.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fada2a1-eaa6-4501-8492-52eafae997ad.selectorLabels" . | nindent 6 }}
