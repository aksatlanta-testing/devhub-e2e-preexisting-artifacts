apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1efcfce-9fb0-42c6-9a03-70dd2b528241.fullname" . }}
  labels:
    {{- include "go-echof1efcfce-9fb0-42c6-9a03-70dd2b528241.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1efcfce-9fb0-42c6-9a03-70dd2b528241.selectorLabels" . | nindent 6 }}
