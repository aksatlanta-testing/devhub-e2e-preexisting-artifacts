apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo185cc6d9-d376-42e7-b357-27820b618663.fullname" . }}
  labels:
    {{- include "go-echo185cc6d9-d376-42e7-b357-27820b618663.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo185cc6d9-d376-42e7-b357-27820b618663.selectorLabels" . | nindent 6 }}
