apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2826c657-6c66-4c4d-b0d8-f61b578a2550.fullname" . }}
  labels:
    {{- include "go-echo2826c657-6c66-4c4d-b0d8-f61b578a2550.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2826c657-6c66-4c4d-b0d8-f61b578a2550.selectorLabels" . | nindent 6 }}
