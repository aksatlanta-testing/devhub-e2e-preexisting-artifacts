apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76e4ade2-66cf-4f93-b8d9-22081739ba17.fullname" . }}
  labels:
    {{- include "go-echo76e4ade2-66cf-4f93-b8d9-22081739ba17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76e4ade2-66cf-4f93-b8d9-22081739ba17.selectorLabels" . | nindent 6 }}
