apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c639f4b-af90-4519-8271-278e8749eda8.fullname" . }}
  labels:
    {{- include "go-echo8c639f4b-af90-4519-8271-278e8749eda8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c639f4b-af90-4519-8271-278e8749eda8.selectorLabels" . | nindent 6 }}
