apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e38f69e-07bf-449c-9a5c-7b58c05fe830.fullname" . }}
  labels:
    {{- include "go-echo9e38f69e-07bf-449c-9a5c-7b58c05fe830.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e38f69e-07bf-449c-9a5c-7b58c05fe830.selectorLabels" . | nindent 6 }}
