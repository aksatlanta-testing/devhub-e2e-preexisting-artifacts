apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo638a4735-276f-426e-af49-2156485c6818.fullname" . }}
  labels:
    {{- include "go-echo638a4735-276f-426e-af49-2156485c6818.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo638a4735-276f-426e-af49-2156485c6818.selectorLabels" . | nindent 6 }}
