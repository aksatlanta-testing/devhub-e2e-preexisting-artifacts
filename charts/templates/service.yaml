apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0275737-0c37-4df0-9ea9-c2f5753b6257.fullname" . }}
  labels:
    {{- include "go-echof0275737-0c37-4df0-9ea9-c2f5753b6257.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0275737-0c37-4df0-9ea9-c2f5753b6257.selectorLabels" . | nindent 6 }}
