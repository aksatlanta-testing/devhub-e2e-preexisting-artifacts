apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23bcb27b-a007-4e02-a7f5-93e49dc5c70e.fullname" . }}
  labels:
    {{- include "go-echo23bcb27b-a007-4e02-a7f5-93e49dc5c70e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23bcb27b-a007-4e02-a7f5-93e49dc5c70e.selectorLabels" . | nindent 6 }}
