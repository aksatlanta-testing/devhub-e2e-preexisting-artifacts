apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1ec6095-9af4-4b54-b62c-b2626fd4d895.fullname" . }}
  labels:
    {{- include "go-echob1ec6095-9af4-4b54-b62c-b2626fd4d895.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1ec6095-9af4-4b54-b62c-b2626fd4d895.selectorLabels" . | nindent 6 }}
