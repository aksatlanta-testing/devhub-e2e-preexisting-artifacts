apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocafad87d-226a-4d70-a356-329544cb4bf8.fullname" . }}
  labels:
    {{- include "go-echocafad87d-226a-4d70-a356-329544cb4bf8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocafad87d-226a-4d70-a356-329544cb4bf8.selectorLabels" . | nindent 6 }}
