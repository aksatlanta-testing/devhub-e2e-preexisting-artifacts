apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19414661-94e6-4606-a195-ece392c95e18.fullname" . }}
  labels:
    {{- include "go-echo19414661-94e6-4606-a195-ece392c95e18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19414661-94e6-4606-a195-ece392c95e18.selectorLabels" . | nindent 6 }}
