apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof39fc3b6-ea5b-4d2e-94aa-66d920740b88.fullname" . }}
  labels:
    {{- include "go-echof39fc3b6-ea5b-4d2e-94aa-66d920740b88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof39fc3b6-ea5b-4d2e-94aa-66d920740b88.selectorLabels" . | nindent 6 }}
