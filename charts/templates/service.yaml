apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79ece38e-a55b-4256-a840-49c1b2a63ce2.fullname" . }}
  labels:
    {{- include "go-echo79ece38e-a55b-4256-a840-49c1b2a63ce2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79ece38e-a55b-4256-a840-49c1b2a63ce2.selectorLabels" . | nindent 6 }}
