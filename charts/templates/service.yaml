apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeeadda15-c86f-47a3-a1bb-edab365bf727.fullname" . }}
  labels:
    {{- include "go-echoeeadda15-c86f-47a3-a1bb-edab365bf727.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeeadda15-c86f-47a3-a1bb-edab365bf727.selectorLabels" . | nindent 6 }}
