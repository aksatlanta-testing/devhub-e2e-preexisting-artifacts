apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo423873c8-a3e8-4a94-b385-4f2ea0f0b336.fullname" . }}
  labels:
    {{- include "go-echo423873c8-a3e8-4a94-b385-4f2ea0f0b336.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo423873c8-a3e8-4a94-b385-4f2ea0f0b336.selectorLabels" . | nindent 6 }}
