apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27849b56-4802-4c62-a8f7-5965af3feb09.fullname" . }}
  labels:
    {{- include "go-echo27849b56-4802-4c62-a8f7-5965af3feb09.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27849b56-4802-4c62-a8f7-5965af3feb09.selectorLabels" . | nindent 6 }}
