apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo727e5423-a298-415a-b05b-9381d5777567.fullname" . }}
  labels:
    {{- include "go-echo727e5423-a298-415a-b05b-9381d5777567.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo727e5423-a298-415a-b05b-9381d5777567.selectorLabels" . | nindent 6 }}
