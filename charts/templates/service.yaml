apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74f39f04-3a20-4c62-98c4-140776677bfa.fullname" . }}
  labels:
    {{- include "go-echo74f39f04-3a20-4c62-98c4-140776677bfa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74f39f04-3a20-4c62-98c4-140776677bfa.selectorLabels" . | nindent 6 }}
