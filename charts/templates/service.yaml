apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo842f3f20-9244-497a-b4a0-2f30ad810f5b.fullname" . }}
  labels:
    {{- include "go-echo842f3f20-9244-497a-b4a0-2f30ad810f5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo842f3f20-9244-497a-b4a0-2f30ad810f5b.selectorLabels" . | nindent 6 }}
