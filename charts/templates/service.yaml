apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cf3b02a-feb7-4ecf-b654-2e6b056d4287.fullname" . }}
  labels:
    {{- include "go-echo5cf3b02a-feb7-4ecf-b654-2e6b056d4287.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cf3b02a-feb7-4ecf-b654-2e6b056d4287.selectorLabels" . | nindent 6 }}
