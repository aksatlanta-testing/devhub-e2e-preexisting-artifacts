apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66c5d00b-3c02-48c6-bb39-41c639ac3f5f.fullname" . }}
  labels:
    {{- include "go-echo66c5d00b-3c02-48c6-bb39-41c639ac3f5f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66c5d00b-3c02-48c6-bb39-41c639ac3f5f.selectorLabels" . | nindent 6 }}
