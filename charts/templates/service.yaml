apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92267935-819f-4953-bc56-0ee3f9d8e80d.fullname" . }}
  labels:
    {{- include "go-echo92267935-819f-4953-bc56-0ee3f9d8e80d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92267935-819f-4953-bc56-0ee3f9d8e80d.selectorLabels" . | nindent 6 }}
