apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53469fa1-ca29-40a2-a3e8-cfd90fe5a3e5.fullname" . }}
  labels:
    {{- include "go-echo53469fa1-ca29-40a2-a3e8-cfd90fe5a3e5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53469fa1-ca29-40a2-a3e8-cfd90fe5a3e5.selectorLabels" . | nindent 6 }}
