apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43685fc4-7b6c-444b-9554-b9013d0f0eff.fullname" . }}
  labels:
    {{- include "go-echo43685fc4-7b6c-444b-9554-b9013d0f0eff.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43685fc4-7b6c-444b-9554-b9013d0f0eff.selectorLabels" . | nindent 6 }}
