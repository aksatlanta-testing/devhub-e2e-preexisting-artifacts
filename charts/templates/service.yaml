apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofdb18b13-b970-46d9-b98d-8fcfecc8595c.fullname" . }}
  labels:
    {{- include "go-echofdb18b13-b970-46d9-b98d-8fcfecc8595c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofdb18b13-b970-46d9-b98d-8fcfecc8595c.selectorLabels" . | nindent 6 }}
