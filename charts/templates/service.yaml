apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2236c898-b2ea-4942-a937-3e057321a9f8.fullname" . }}
  labels:
    {{- include "go-echo2236c898-b2ea-4942-a937-3e057321a9f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2236c898-b2ea-4942-a937-3e057321a9f8.selectorLabels" . | nindent 6 }}
