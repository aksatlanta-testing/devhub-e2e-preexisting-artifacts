apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d317f9d-329d-421e-971d-e218c438d4ea.fullname" . }}
  labels:
    {{- include "go-echo0d317f9d-329d-421e-971d-e218c438d4ea.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d317f9d-329d-421e-971d-e218c438d4ea.selectorLabels" . | nindent 6 }}
