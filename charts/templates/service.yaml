apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cd3822a-6d68-45f0-bf7b-b7ed308ba479.fullname" . }}
  labels:
    {{- include "go-echo4cd3822a-6d68-45f0-bf7b-b7ed308ba479.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cd3822a-6d68-45f0-bf7b-b7ed308ba479.selectorLabels" . | nindent 6 }}
