apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff8ebaf4-cce0-4eab-8468-c08cbd2613a1.fullname" . }}
  labels:
    {{- include "go-echoff8ebaf4-cce0-4eab-8468-c08cbd2613a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff8ebaf4-cce0-4eab-8468-c08cbd2613a1.selectorLabels" . | nindent 6 }}
