apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61582d06-8e4c-44e7-8ddc-02eb584ff6c1.fullname" . }}
  labels:
    {{- include "go-echo61582d06-8e4c-44e7-8ddc-02eb584ff6c1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61582d06-8e4c-44e7-8ddc-02eb584ff6c1.selectorLabels" . | nindent 6 }}
