apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4d873da-f3ac-4fd8-b5d4-c662f9a5a052.fullname" . }}
  labels:
    {{- include "go-echoa4d873da-f3ac-4fd8-b5d4-c662f9a5a052.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4d873da-f3ac-4fd8-b5d4-c662f9a5a052.selectorLabels" . | nindent 6 }}
