apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf15d279-7f6f-4524-9a35-f3da019d7923.fullname" . }}
  labels:
    {{- include "go-echodf15d279-7f6f-4524-9a35-f3da019d7923.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf15d279-7f6f-4524-9a35-f3da019d7923.selectorLabels" . | nindent 6 }}
