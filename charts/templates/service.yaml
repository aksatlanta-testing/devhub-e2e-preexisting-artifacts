apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b75992a-cb6a-46fe-9012-949c68ad33a1.fullname" . }}
  labels:
    {{- include "go-echo1b75992a-cb6a-46fe-9012-949c68ad33a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b75992a-cb6a-46fe-9012-949c68ad33a1.selectorLabels" . | nindent 6 }}
