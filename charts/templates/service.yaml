apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1db05a72-6178-4f40-98e1-0e71b40df804.fullname" . }}
  labels:
    {{- include "go-echo1db05a72-6178-4f40-98e1-0e71b40df804.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1db05a72-6178-4f40-98e1-0e71b40df804.selectorLabels" . | nindent 6 }}
