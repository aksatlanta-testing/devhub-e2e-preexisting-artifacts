apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c62afa4-bca3-4d5e-8d48-293e7f40b153.fullname" . }}
  labels:
    {{- include "go-echo9c62afa4-bca3-4d5e-8d48-293e7f40b153.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c62afa4-bca3-4d5e-8d48-293e7f40b153.selectorLabels" . | nindent 6 }}
