apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6379ade3-852e-464c-a9e5-1f1b64ca10af.fullname" . }}
  labels:
    {{- include "go-echo6379ade3-852e-464c-a9e5-1f1b64ca10af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6379ade3-852e-464c-a9e5-1f1b64ca10af.selectorLabels" . | nindent 6 }}
