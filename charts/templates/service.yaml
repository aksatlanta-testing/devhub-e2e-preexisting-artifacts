apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2f46417-fe0e-48b3-802d-7d564b024003.fullname" . }}
  labels:
    {{- include "go-echoc2f46417-fe0e-48b3-802d-7d564b024003.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2f46417-fe0e-48b3-802d-7d564b024003.selectorLabels" . | nindent 6 }}
