apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa79e647e-3c70-4596-bc60-b0661122454b.fullname" . }}
  labels:
    {{- include "go-echoa79e647e-3c70-4596-bc60-b0661122454b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa79e647e-3c70-4596-bc60-b0661122454b.selectorLabels" . | nindent 6 }}
