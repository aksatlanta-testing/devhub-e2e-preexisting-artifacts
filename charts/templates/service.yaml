apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86ce66fc-6c03-4509-9edb-3cc8f8d37997.fullname" . }}
  labels:
    {{- include "go-echo86ce66fc-6c03-4509-9edb-3cc8f8d37997.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86ce66fc-6c03-4509-9edb-3cc8f8d37997.selectorLabels" . | nindent 6 }}
