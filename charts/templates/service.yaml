apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc73d6cd8-ddf7-45a6-ba90-285aef834d2f.fullname" . }}
  labels:
    {{- include "go-echoc73d6cd8-ddf7-45a6-ba90-285aef834d2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc73d6cd8-ddf7-45a6-ba90-285aef834d2f.selectorLabels" . | nindent 6 }}
