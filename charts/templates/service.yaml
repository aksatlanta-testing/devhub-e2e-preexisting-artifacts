apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ea2fb6c-b3a8-47c6-96e9-019f541a3715.fullname" . }}
  labels:
    {{- include "go-echo0ea2fb6c-b3a8-47c6-96e9-019f541a3715.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ea2fb6c-b3a8-47c6-96e9-019f541a3715.selectorLabels" . | nindent 6 }}
