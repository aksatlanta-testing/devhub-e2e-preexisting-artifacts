apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6df897e3-7cf9-458a-8ddd-369ed366e7e4.fullname" . }}
  labels:
    {{- include "go-echo6df897e3-7cf9-458a-8ddd-369ed366e7e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6df897e3-7cf9-458a-8ddd-369ed366e7e4.selectorLabels" . | nindent 6 }}
