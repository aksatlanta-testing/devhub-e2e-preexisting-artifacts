apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed76653a-c43c-4888-ad6f-203d2185cbcf.fullname" . }}
  labels:
    {{- include "go-echoed76653a-c43c-4888-ad6f-203d2185cbcf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed76653a-c43c-4888-ad6f-203d2185cbcf.selectorLabels" . | nindent 6 }}
