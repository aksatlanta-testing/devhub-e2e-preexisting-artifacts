apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd24cfc2-99b8-45f2-8069-689ab6fb5fd9.fullname" . }}
  labels:
    {{- include "go-echofd24cfc2-99b8-45f2-8069-689ab6fb5fd9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd24cfc2-99b8-45f2-8069-689ab6fb5fd9.selectorLabels" . | nindent 6 }}
