apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48a4fa84-9dcb-4a48-ae21-6367c4ac7aeb.fullname" . }}
  labels:
    {{- include "go-echo48a4fa84-9dcb-4a48-ae21-6367c4ac7aeb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48a4fa84-9dcb-4a48-ae21-6367c4ac7aeb.selectorLabels" . | nindent 6 }}
