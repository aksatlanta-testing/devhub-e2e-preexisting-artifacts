apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa9536f7-a8f1-4bc6-b240-9e74f56ce887.fullname" . }}
  labels:
    {{- include "go-echofa9536f7-a8f1-4bc6-b240-9e74f56ce887.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa9536f7-a8f1-4bc6-b240-9e74f56ce887.selectorLabels" . | nindent 6 }}
