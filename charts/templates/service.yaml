apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06aab6ee-c259-4295-b1e7-f248ed47ae61.fullname" . }}
  labels:
    {{- include "go-echo06aab6ee-c259-4295-b1e7-f248ed47ae61.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06aab6ee-c259-4295-b1e7-f248ed47ae61.selectorLabels" . | nindent 6 }}
