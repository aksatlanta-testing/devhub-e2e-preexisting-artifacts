apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3555e41d-1f81-4080-8661-0d1c841f6129.fullname" . }}
  labels:
    {{- include "go-echo3555e41d-1f81-4080-8661-0d1c841f6129.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3555e41d-1f81-4080-8661-0d1c841f6129.selectorLabels" . | nindent 6 }}
