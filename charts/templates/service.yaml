apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71639c34-c9df-4f46-b4b3-3a0dfc8bd477.fullname" . }}
  labels:
    {{- include "go-echo71639c34-c9df-4f46-b4b3-3a0dfc8bd477.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71639c34-c9df-4f46-b4b3-3a0dfc8bd477.selectorLabels" . | nindent 6 }}
