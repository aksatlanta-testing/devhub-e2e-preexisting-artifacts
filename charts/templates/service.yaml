apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8489633a-cb71-4a46-803a-4780af1db8a7.fullname" . }}
  labels:
    {{- include "go-echo8489633a-cb71-4a46-803a-4780af1db8a7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8489633a-cb71-4a46-803a-4780af1db8a7.selectorLabels" . | nindent 6 }}
