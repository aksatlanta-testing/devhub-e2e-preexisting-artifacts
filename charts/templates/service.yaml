apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fa163d0-2f8c-4dcf-8c15-ee1686982248.fullname" . }}
  labels:
    {{- include "go-echo4fa163d0-2f8c-4dcf-8c15-ee1686982248.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fa163d0-2f8c-4dcf-8c15-ee1686982248.selectorLabels" . | nindent 6 }}
