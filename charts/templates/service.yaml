apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71908b5b-1cbc-4d60-85e8-e80ad2f4d80f.fullname" . }}
  labels:
    {{- include "go-echo71908b5b-1cbc-4d60-85e8-e80ad2f4d80f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
