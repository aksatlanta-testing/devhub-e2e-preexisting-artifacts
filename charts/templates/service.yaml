apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02738982-1a75-4872-aa6c-d74cd4a0e4d4.fullname" . }}
  labels:
    {{- include "go-echo02738982-1a75-4872-aa6c-d74cd4a0e4d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02738982-1a75-4872-aa6c-d74cd4a0e4d4.selectorLabels" . | nindent 6 }}
