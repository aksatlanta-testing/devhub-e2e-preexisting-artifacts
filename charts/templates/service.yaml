apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1a2ab74-6f37-4174-9b44-f5e2616925de.fullname" . }}
  labels:
    {{- include "go-echof1a2ab74-6f37-4174-9b44-f5e2616925de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1a2ab74-6f37-4174-9b44-f5e2616925de.selectorLabels" . | nindent 6 }}
