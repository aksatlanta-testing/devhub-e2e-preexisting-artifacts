apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6a23f1e-3487-476e-93ff-985507c2cdd4.fullname" . }}
  labels:
    {{- include "go-echoa6a23f1e-3487-476e-93ff-985507c2cdd4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6a23f1e-3487-476e-93ff-985507c2cdd4.selectorLabels" . | nindent 6 }}
