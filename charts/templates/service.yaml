apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoddf4ba27-b702-4193-96ef-18314fdcd11c.fullname" . }}
  labels:
    {{- include "go-echoddf4ba27-b702-4193-96ef-18314fdcd11c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoddf4ba27-b702-4193-96ef-18314fdcd11c.selectorLabels" . | nindent 6 }}
