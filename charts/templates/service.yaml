apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1620526-79f1-4038-a22a-263e902ffbc8.fullname" . }}
  labels:
    {{- include "go-echoe1620526-79f1-4038-a22a-263e902ffbc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1620526-79f1-4038-a22a-263e902ffbc8.selectorLabels" . | nindent 6 }}
