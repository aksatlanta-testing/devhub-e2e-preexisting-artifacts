apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a81d5cd-5546-41e8-9e1e-97512fe96859.fullname" . }}
  labels:
    {{- include "go-echo3a81d5cd-5546-41e8-9e1e-97512fe96859.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a81d5cd-5546-41e8-9e1e-97512fe96859.selectorLabels" . | nindent 6 }}
