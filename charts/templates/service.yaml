apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc640c544-1141-4172-9c61-0f8b50d67998.fullname" . }}
  labels:
    {{- include "go-echoc640c544-1141-4172-9c61-0f8b50d67998.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc640c544-1141-4172-9c61-0f8b50d67998.selectorLabels" . | nindent 6 }}
