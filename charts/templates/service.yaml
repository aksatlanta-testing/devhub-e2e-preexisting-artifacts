apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof21a511e-7c50-42be-9173-79f36011f059.fullname" . }}
  labels:
    {{- include "go-echof21a511e-7c50-42be-9173-79f36011f059.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof21a511e-7c50-42be-9173-79f36011f059.selectorLabels" . | nindent 6 }}
