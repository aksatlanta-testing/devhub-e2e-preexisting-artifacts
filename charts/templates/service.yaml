apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof592811b-cedf-43d7-af90-7f0ecc345694.fullname" . }}
  labels:
    {{- include "go-echof592811b-cedf-43d7-af90-7f0ecc345694.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof592811b-cedf-43d7-af90-7f0ecc345694.selectorLabels" . | nindent 6 }}
