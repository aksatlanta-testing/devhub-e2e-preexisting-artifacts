apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1bd3799-12d2-46d3-943c-1e53c9cf4b36.fullname" . }}
  labels:
    {{- include "go-echod1bd3799-12d2-46d3-943c-1e53c9cf4b36.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1bd3799-12d2-46d3-943c-1e53c9cf4b36.selectorLabels" . | nindent 6 }}
