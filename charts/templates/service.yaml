apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob863e8dc-b6a0-4663-8461-26234168c100.fullname" . }}
  labels:
    {{- include "go-echob863e8dc-b6a0-4663-8461-26234168c100.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob863e8dc-b6a0-4663-8461-26234168c100.selectorLabels" . | nindent 6 }}
