apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc03e4283-8f31-4bf6-b53f-369e00bd8d93.fullname" . }}
  labels:
    {{- include "go-echoc03e4283-8f31-4bf6-b53f-369e00bd8d93.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc03e4283-8f31-4bf6-b53f-369e00bd8d93.selectorLabels" . | nindent 6 }}
