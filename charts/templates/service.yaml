apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce073b28-5800-4ead-88ca-ca32a8a069c1.fullname" . }}
  labels:
    {{- include "go-echoce073b28-5800-4ead-88ca-ca32a8a069c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce073b28-5800-4ead-88ca-ca32a8a069c1.selectorLabels" . | nindent 6 }}
