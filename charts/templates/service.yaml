apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo332a1e7c-6596-4f87-9edf-6eaa1ea28447.fullname" . }}
  labels:
    {{- include "go-echo332a1e7c-6596-4f87-9edf-6eaa1ea28447.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo332a1e7c-6596-4f87-9edf-6eaa1ea28447.selectorLabels" . | nindent 6 }}
