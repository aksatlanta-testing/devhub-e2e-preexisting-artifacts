apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo554f360e-69a0-49b4-a66b-f2e2fd36c441.fullname" . }}
  labels:
    {{- include "go-echo554f360e-69a0-49b4-a66b-f2e2fd36c441.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo554f360e-69a0-49b4-a66b-f2e2fd36c441.selectorLabels" . | nindent 6 }}
