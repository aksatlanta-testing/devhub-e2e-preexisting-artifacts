apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48539ae8-c7aa-4bfe-823b-3fa88ed5076c.fullname" . }}
  labels:
    {{- include "go-echo48539ae8-c7aa-4bfe-823b-3fa88ed5076c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48539ae8-c7aa-4bfe-823b-3fa88ed5076c.selectorLabels" . | nindent 6 }}
