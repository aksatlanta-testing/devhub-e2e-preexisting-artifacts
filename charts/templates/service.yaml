apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob79ca72f-b75f-484d-988c-26aea3a2edf9.fullname" . }}
  labels:
    {{- include "go-echob79ca72f-b75f-484d-988c-26aea3a2edf9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob79ca72f-b75f-484d-988c-26aea3a2edf9.selectorLabels" . | nindent 6 }}
