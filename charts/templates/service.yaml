apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea9160f5-18f5-45f2-b1bf-acf7af2a6c24.fullname" . }}
  labels:
    {{- include "go-echoea9160f5-18f5-45f2-b1bf-acf7af2a6c24.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea9160f5-18f5-45f2-b1bf-acf7af2a6c24.selectorLabels" . | nindent 6 }}
