apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6323d9a3-aa91-427d-b033-296810a2092e.fullname" . }}
  labels:
    {{- include "go-echo6323d9a3-aa91-427d-b033-296810a2092e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6323d9a3-aa91-427d-b033-296810a2092e.selectorLabels" . | nindent 6 }}
