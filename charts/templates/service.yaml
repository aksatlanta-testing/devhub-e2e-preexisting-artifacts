apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc49e92b8-9a68-4611-9ddf-23212fb31994.fullname" . }}
  labels:
    {{- include "go-echoc49e92b8-9a68-4611-9ddf-23212fb31994.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc49e92b8-9a68-4611-9ddf-23212fb31994.selectorLabels" . | nindent 6 }}
