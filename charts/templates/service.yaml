apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cf54cc7-a2e1-4de6-901b-86eb55a20fcf.fullname" . }}
  labels:
    {{- include "go-echo7cf54cc7-a2e1-4de6-901b-86eb55a20fcf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7cf54cc7-a2e1-4de6-901b-86eb55a20fcf.selectorLabels" . | nindent 6 }}
