apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0700d6c-d7bb-4649-b4d3-4fe0846bf08c.fullname" . }}
  labels:
    {{- include "go-echoe0700d6c-d7bb-4649-b4d3-4fe0846bf08c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0700d6c-d7bb-4649-b4d3-4fe0846bf08c.selectorLabels" . | nindent 6 }}
