apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9dc0d63-3cd4-412a-a0fa-2e9e0557ba2b.fullname" . }}
  labels:
    {{- include "go-echoe9dc0d63-3cd4-412a-a0fa-2e9e0557ba2b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9dc0d63-3cd4-412a-a0fa-2e9e0557ba2b.selectorLabels" . | nindent 6 }}
