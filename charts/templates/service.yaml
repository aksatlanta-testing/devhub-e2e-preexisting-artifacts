apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6b1e289-dc04-43c4-a6bf-8c615fc9ceb1.fullname" . }}
  labels:
    {{- include "go-echoe6b1e289-dc04-43c4-a6bf-8c615fc9ceb1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6b1e289-dc04-43c4-a6bf-8c615fc9ceb1.selectorLabels" . | nindent 6 }}
