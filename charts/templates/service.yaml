apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e3d29ef-d443-434c-a20a-7841beaaca93.fullname" . }}
  labels:
    {{- include "go-echo7e3d29ef-d443-434c-a20a-7841beaaca93.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e3d29ef-d443-434c-a20a-7841beaaca93.selectorLabels" . | nindent 6 }}
