apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo735477cf-af7c-46b8-ad75-475415a0ebc0.fullname" . }}
  labels:
    {{- include "go-echo735477cf-af7c-46b8-ad75-475415a0ebc0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo735477cf-af7c-46b8-ad75-475415a0ebc0.selectorLabels" . | nindent 6 }}
