apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39f49d3a-4f16-4de7-a81a-ddcf761cbd00.fullname" . }}
  labels:
    {{- include "go-echo39f49d3a-4f16-4de7-a81a-ddcf761cbd00.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39f49d3a-4f16-4de7-a81a-ddcf761cbd00.selectorLabels" . | nindent 6 }}
