apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ece1393-bdb6-4df0-a548-7fd7735d2419.fullname" . }}
  labels:
    {{- include "go-echo5ece1393-bdb6-4df0-a548-7fd7735d2419.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ece1393-bdb6-4df0-a548-7fd7735d2419.selectorLabels" . | nindent 6 }}
