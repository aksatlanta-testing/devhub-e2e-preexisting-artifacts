apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo837f7871-91cb-4c49-973c-2760ff0b8dde.fullname" . }}
  labels:
    {{- include "go-echo837f7871-91cb-4c49-973c-2760ff0b8dde.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo837f7871-91cb-4c49-973c-2760ff0b8dde.selectorLabels" . | nindent 6 }}
