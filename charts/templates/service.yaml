apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo153e2c66-0b03-4aa5-ac30-955f6f112541.fullname" . }}
  labels:
    {{- include "go-echo153e2c66-0b03-4aa5-ac30-955f6f112541.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo153e2c66-0b03-4aa5-ac30-955f6f112541.selectorLabels" . | nindent 6 }}
