apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe95b2c10-a33f-49e8-8756-40465da3ec33.fullname" . }}
  labels:
    {{- include "go-echoe95b2c10-a33f-49e8-8756-40465da3ec33.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe95b2c10-a33f-49e8-8756-40465da3ec33.selectorLabels" . | nindent 6 }}
