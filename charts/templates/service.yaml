apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1cbb46c-44bd-4ad0-9b2d-5cc3cdac5e58.fullname" . }}
  labels:
    {{- include "go-echoa1cbb46c-44bd-4ad0-9b2d-5cc3cdac5e58.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1cbb46c-44bd-4ad0-9b2d-5cc3cdac5e58.selectorLabels" . | nindent 6 }}
