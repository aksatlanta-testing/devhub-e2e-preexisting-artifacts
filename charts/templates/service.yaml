apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77d91c2e-0fb3-4dff-8a1b-bd86479d5cd8.fullname" . }}
  labels:
    {{- include "go-echo77d91c2e-0fb3-4dff-8a1b-bd86479d5cd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77d91c2e-0fb3-4dff-8a1b-bd86479d5cd8.selectorLabels" . | nindent 6 }}
