apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b62c2c8-31b3-4e4c-9d7a-82d8af0c7aee.fullname" . }}
  labels:
    {{- include "go-echo5b62c2c8-31b3-4e4c-9d7a-82d8af0c7aee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b62c2c8-31b3-4e4c-9d7a-82d8af0c7aee.selectorLabels" . | nindent 6 }}
