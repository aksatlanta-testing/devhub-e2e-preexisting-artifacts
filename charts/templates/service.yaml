apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo465870c0-64ad-4680-ae62-e7ae4eef415a.fullname" . }}
  labels:
    {{- include "go-echo465870c0-64ad-4680-ae62-e7ae4eef415a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo465870c0-64ad-4680-ae62-e7ae4eef415a.selectorLabels" . | nindent 6 }}
