apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b7dad13-2c8c-43dd-b69a-86be9aa450b9.fullname" . }}
  labels:
    {{- include "go-echo0b7dad13-2c8c-43dd-b69a-86be9aa450b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b7dad13-2c8c-43dd-b69a-86be9aa450b9.selectorLabels" . | nindent 6 }}
