apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo554bb3cb-09dc-4b5e-9820-6224109deaef.fullname" . }}
  labels:
    {{- include "go-echo554bb3cb-09dc-4b5e-9820-6224109deaef.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo554bb3cb-09dc-4b5e-9820-6224109deaef.selectorLabels" . | nindent 6 }}
