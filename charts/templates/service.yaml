apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c2a7ac0-715e-45e0-87de-f97fa7512926.fullname" . }}
  labels:
    {{- include "go-echo9c2a7ac0-715e-45e0-87de-f97fa7512926.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c2a7ac0-715e-45e0-87de-f97fa7512926.selectorLabels" . | nindent 6 }}
