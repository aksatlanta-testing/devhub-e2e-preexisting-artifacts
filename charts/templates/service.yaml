apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a38f3c8-c23b-488a-8fe6-0da0f910ff91.fullname" . }}
  labels:
    {{- include "go-echo9a38f3c8-c23b-488a-8fe6-0da0f910ff91.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a38f3c8-c23b-488a-8fe6-0da0f910ff91.selectorLabels" . | nindent 6 }}
