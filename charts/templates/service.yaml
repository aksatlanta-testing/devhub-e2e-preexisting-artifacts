apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f15f723-ca49-4712-b90f-ebb266054cc1.fullname" . }}
  labels:
    {{- include "go-echo9f15f723-ca49-4712-b90f-ebb266054cc1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f15f723-ca49-4712-b90f-ebb266054cc1.selectorLabels" . | nindent 6 }}
