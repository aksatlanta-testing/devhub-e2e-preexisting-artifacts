apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c12650b-d827-4b02-8f42-3661bb83636e.fullname" . }}
  labels:
    {{- include "go-echo3c12650b-d827-4b02-8f42-3661bb83636e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c12650b-d827-4b02-8f42-3661bb83636e.selectorLabels" . | nindent 6 }}
