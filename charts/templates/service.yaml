apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa94b2bb-03cb-4fdf-bec9-c15107e33fd2.fullname" . }}
  labels:
    {{- include "go-echofa94b2bb-03cb-4fdf-bec9-c15107e33fd2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa94b2bb-03cb-4fdf-bec9-c15107e33fd2.selectorLabels" . | nindent 6 }}
