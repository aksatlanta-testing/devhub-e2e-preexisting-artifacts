apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2a6e9f2-e97f-404c-83a3-2e143fd5b2d9.fullname" . }}
  labels:
    {{- include "go-echoe2a6e9f2-e97f-404c-83a3-2e143fd5b2d9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2a6e9f2-e97f-404c-83a3-2e143fd5b2d9.selectorLabels" . | nindent 6 }}
