apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc563d90d-c449-4a84-b4dd-a10f71a3ea60.fullname" . }}
  labels:
    {{- include "go-echoc563d90d-c449-4a84-b4dd-a10f71a3ea60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc563d90d-c449-4a84-b4dd-a10f71a3ea60.selectorLabels" . | nindent 6 }}
