apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof01c3713-fbfe-4f34-9855-4f381c5d7fd8.fullname" . }}
  labels:
    {{- include "go-echof01c3713-fbfe-4f34-9855-4f381c5d7fd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof01c3713-fbfe-4f34-9855-4f381c5d7fd8.selectorLabels" . | nindent 6 }}
