apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo739470cd-b0d0-432b-9dac-90347200b0f6.fullname" . }}
  labels:
    {{- include "go-echo739470cd-b0d0-432b-9dac-90347200b0f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo739470cd-b0d0-432b-9dac-90347200b0f6.selectorLabels" . | nindent 6 }}
