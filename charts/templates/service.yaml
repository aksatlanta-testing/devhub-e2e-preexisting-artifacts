apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3b3a51b-819b-4f93-8549-618fe9b0b98f.fullname" . }}
  labels:
    {{- include "go-echod3b3a51b-819b-4f93-8549-618fe9b0b98f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3b3a51b-819b-4f93-8549-618fe9b0b98f.selectorLabels" . | nindent 6 }}
