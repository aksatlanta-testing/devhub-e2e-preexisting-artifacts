apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c9c2897-7102-46d1-b923-7e4c611f1dac.fullname" . }}
  labels:
    {{- include "go-echo2c9c2897-7102-46d1-b923-7e4c611f1dac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c9c2897-7102-46d1-b923-7e4c611f1dac.selectorLabels" . | nindent 6 }}
