apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3de8f5be-e761-45f5-b305-2c797fab9a9e.fullname" . }}
  labels:
    {{- include "go-echo3de8f5be-e761-45f5-b305-2c797fab9a9e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3de8f5be-e761-45f5-b305-2c797fab9a9e.selectorLabels" . | nindent 6 }}
