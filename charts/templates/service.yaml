apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf8e0d9d-80cb-4339-921b-a83744732c0d.fullname" . }}
  labels:
    {{- include "go-echoaf8e0d9d-80cb-4339-921b-a83744732c0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf8e0d9d-80cb-4339-921b-a83744732c0d.selectorLabels" . | nindent 6 }}
