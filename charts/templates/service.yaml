apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d306e70-e948-476c-a573-3248d6529381.fullname" . }}
  labels:
    {{- include "go-echo4d306e70-e948-476c-a573-3248d6529381.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d306e70-e948-476c-a573-3248d6529381.selectorLabels" . | nindent 6 }}
