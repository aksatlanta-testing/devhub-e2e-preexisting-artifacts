apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeed8336a-7ab8-4fe1-a207-a6912855c6b9.fullname" . }}
  labels:
    {{- include "go-echoeed8336a-7ab8-4fe1-a207-a6912855c6b9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeed8336a-7ab8-4fe1-a207-a6912855c6b9.selectorLabels" . | nindent 6 }}
