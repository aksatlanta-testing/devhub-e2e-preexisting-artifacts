apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36184267-d6b7-472d-aa76-3ea1c0018043.fullname" . }}
  labels:
    {{- include "go-echo36184267-d6b7-472d-aa76-3ea1c0018043.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36184267-d6b7-472d-aa76-3ea1c0018043.selectorLabels" . | nindent 6 }}
