apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo257eefdb-37a1-48c9-9034-2b789f625608.fullname" . }}
  labels:
    {{- include "go-echo257eefdb-37a1-48c9-9034-2b789f625608.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo257eefdb-37a1-48c9-9034-2b789f625608.selectorLabels" . | nindent 6 }}
