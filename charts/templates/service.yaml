apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f1a5ee2-0211-440c-af17-7fc8a845c030.fullname" . }}
  labels:
    {{- include "go-echo3f1a5ee2-0211-440c-af17-7fc8a845c030.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f1a5ee2-0211-440c-af17-7fc8a845c030.selectorLabels" . | nindent 6 }}
