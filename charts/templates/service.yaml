apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b876dbd-b796-4764-bd69-97c1e7e99c81.fullname" . }}
  labels:
    {{- include "go-echo2b876dbd-b796-4764-bd69-97c1e7e99c81.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b876dbd-b796-4764-bd69-97c1e7e99c81.selectorLabels" . | nindent 6 }}
