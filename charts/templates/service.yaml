apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9bb3674e-c31a-462d-8a6c-a38b4a1c2163.fullname" . }}
  labels:
    {{- include "go-echo9bb3674e-c31a-462d-8a6c-a38b4a1c2163.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9bb3674e-c31a-462d-8a6c-a38b4a1c2163.selectorLabels" . | nindent 6 }}
