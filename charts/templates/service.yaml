apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo625859bd-17e4-4476-bee4-47a9147217be.fullname" . }}
  labels:
    {{- include "go-echo625859bd-17e4-4476-bee4-47a9147217be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo625859bd-17e4-4476-bee4-47a9147217be.selectorLabels" . | nindent 6 }}
