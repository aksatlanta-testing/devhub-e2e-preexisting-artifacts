apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof03d4a12-baf4-4d8e-af7c-85bee67ccb3a.fullname" . }}
  labels:
    {{- include "go-echof03d4a12-baf4-4d8e-af7c-85bee67ccb3a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof03d4a12-baf4-4d8e-af7c-85bee67ccb3a.selectorLabels" . | nindent 6 }}
