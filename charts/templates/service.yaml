apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4513d99d-cf3c-40d5-bddb-88d0a98c767d.fullname" . }}
  labels:
    {{- include "go-echo4513d99d-cf3c-40d5-bddb-88d0a98c767d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4513d99d-cf3c-40d5-bddb-88d0a98c767d.selectorLabels" . | nindent 6 }}
