apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd1a8114-828b-43b7-917a-51e20eb6206a.fullname" . }}
  labels:
    {{- include "go-echobd1a8114-828b-43b7-917a-51e20eb6206a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd1a8114-828b-43b7-917a-51e20eb6206a.selectorLabels" . | nindent 6 }}
