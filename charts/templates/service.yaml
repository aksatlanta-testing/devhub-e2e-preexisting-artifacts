apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo847bda67-1ae4-47f2-b80c-3b77d293789a.fullname" . }}
  labels:
    {{- include "go-echo847bda67-1ae4-47f2-b80c-3b77d293789a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo847bda67-1ae4-47f2-b80c-3b77d293789a.selectorLabels" . | nindent 6 }}
