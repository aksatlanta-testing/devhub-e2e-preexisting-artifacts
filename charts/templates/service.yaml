apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod799eeaa-d513-4568-accd-b25cdacfe69d.fullname" . }}
  labels:
    {{- include "go-echod799eeaa-d513-4568-accd-b25cdacfe69d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod799eeaa-d513-4568-accd-b25cdacfe69d.selectorLabels" . | nindent 6 }}
