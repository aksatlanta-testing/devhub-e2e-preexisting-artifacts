apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8032ead-a620-480c-a89f-cacbdd8b3429.fullname" . }}
  labels:
    {{- include "go-echoe8032ead-a620-480c-a89f-cacbdd8b3429.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8032ead-a620-480c-a89f-cacbdd8b3429.selectorLabels" . | nindent 6 }}
