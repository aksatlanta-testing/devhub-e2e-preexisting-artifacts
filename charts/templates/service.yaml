apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e0defa4-71c8-4ed9-94fb-596fee9abd2b.fullname" . }}
  labels:
    {{- include "go-echo1e0defa4-71c8-4ed9-94fb-596fee9abd2b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e0defa4-71c8-4ed9-94fb-596fee9abd2b.selectorLabels" . | nindent 6 }}
