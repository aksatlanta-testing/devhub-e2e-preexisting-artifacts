apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1198edf-180e-43d8-8377-20f5040692d6.fullname" . }}
  labels:
    {{- include "go-echod1198edf-180e-43d8-8377-20f5040692d6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1198edf-180e-43d8-8377-20f5040692d6.selectorLabels" . | nindent 6 }}
