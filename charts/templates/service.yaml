apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bcd9862-d710-4e40-b482-31dae33c9b5d.fullname" . }}
  labels:
    {{- include "go-echo0bcd9862-d710-4e40-b482-31dae33c9b5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bcd9862-d710-4e40-b482-31dae33c9b5d.selectorLabels" . | nindent 6 }}
