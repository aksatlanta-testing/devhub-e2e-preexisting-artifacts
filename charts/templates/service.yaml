apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo084abb3e-f15e-4dff-b28d-b8c925cb1610.fullname" . }}
  labels:
    {{- include "go-echo084abb3e-f15e-4dff-b28d-b8c925cb1610.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo084abb3e-f15e-4dff-b28d-b8c925cb1610.selectorLabels" . | nindent 6 }}
