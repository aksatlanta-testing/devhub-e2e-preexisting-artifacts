apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo307b3f39-5c89-4e9d-a8b2-9ea76cfab917.fullname" . }}
  labels:
    {{- include "go-echo307b3f39-5c89-4e9d-a8b2-9ea76cfab917.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo307b3f39-5c89-4e9d-a8b2-9ea76cfab917.selectorLabels" . | nindent 6 }}
