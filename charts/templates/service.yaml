apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8cea8e5-cdb4-4b8f-acb3-2be5aca9ef18.fullname" . }}
  labels:
    {{- include "go-echob8cea8e5-cdb4-4b8f-acb3-2be5aca9ef18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8cea8e5-cdb4-4b8f-acb3-2be5aca9ef18.selectorLabels" . | nindent 6 }}
