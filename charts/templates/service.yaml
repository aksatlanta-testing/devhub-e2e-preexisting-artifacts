apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob76992b7-35b9-4901-abe4-03583fbacafc.fullname" . }}
  labels:
    {{- include "go-echob76992b7-35b9-4901-abe4-03583fbacafc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob76992b7-35b9-4901-abe4-03583fbacafc.selectorLabels" . | nindent 6 }}
