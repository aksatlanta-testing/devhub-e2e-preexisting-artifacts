apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5dff5d0d-0ed8-4e89-92c4-ea6756087cde.fullname" . }}
  labels:
    {{- include "go-echo5dff5d0d-0ed8-4e89-92c4-ea6756087cde.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5dff5d0d-0ed8-4e89-92c4-ea6756087cde.selectorLabels" . | nindent 6 }}
