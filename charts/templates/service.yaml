apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo144caa50-ecd0-41cf-aef3-f463ba4d92bb.fullname" . }}
  labels:
    {{- include "go-echo144caa50-ecd0-41cf-aef3-f463ba4d92bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo144caa50-ecd0-41cf-aef3-f463ba4d92bb.selectorLabels" . | nindent 6 }}
