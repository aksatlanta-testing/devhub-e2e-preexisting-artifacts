apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a336d34-fd42-4d49-b452-ceae1784a19b.fullname" . }}
  labels:
    {{- include "go-echo2a336d34-fd42-4d49-b452-ceae1784a19b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a336d34-fd42-4d49-b452-ceae1784a19b.selectorLabels" . | nindent 6 }}
