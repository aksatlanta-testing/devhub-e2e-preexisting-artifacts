apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a219e92-643b-4d09-9c3d-7433281b9dca.fullname" . }}
  labels:
    {{- include "go-echo7a219e92-643b-4d09-9c3d-7433281b9dca.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
