apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cb2d016-2470-4ed2-bdd2-f08aa5117113.fullname" . }}
  labels:
    {{- include "go-echo4cb2d016-2470-4ed2-bdd2-f08aa5117113.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cb2d016-2470-4ed2-bdd2-f08aa5117113.selectorLabels" . | nindent 6 }}
