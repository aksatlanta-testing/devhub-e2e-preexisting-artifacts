apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo981ad9ab-b6bd-4668-8f4d-01d87dd307fb.fullname" . }}
  labels:
    {{- include "go-echo981ad9ab-b6bd-4668-8f4d-01d87dd307fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo981ad9ab-b6bd-4668-8f4d-01d87dd307fb.selectorLabels" . | nindent 6 }}
