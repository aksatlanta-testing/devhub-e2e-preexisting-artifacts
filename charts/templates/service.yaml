apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6eacf38-356f-4da5-9a19-3b7b27cccc29.fullname" . }}
  labels:
    {{- include "go-echoe6eacf38-356f-4da5-9a19-3b7b27cccc29.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6eacf38-356f-4da5-9a19-3b7b27cccc29.selectorLabels" . | nindent 6 }}
