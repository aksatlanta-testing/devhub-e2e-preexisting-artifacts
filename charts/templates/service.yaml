apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8914cc77-59df-44cb-bce4-281e0fad3d72.fullname" . }}
  labels:
    {{- include "go-echo8914cc77-59df-44cb-bce4-281e0fad3d72.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8914cc77-59df-44cb-bce4-281e0fad3d72.selectorLabels" . | nindent 6 }}
