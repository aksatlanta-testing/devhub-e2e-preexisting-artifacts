apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca1e0651-9d68-46e0-ae07-dfb24a77be06.fullname" . }}
  labels:
    {{- include "go-echoca1e0651-9d68-46e0-ae07-dfb24a77be06.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca1e0651-9d68-46e0-ae07-dfb24a77be06.selectorLabels" . | nindent 6 }}
