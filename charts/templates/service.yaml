apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf00ab74-60f9-4d62-a852-3da7dbe5c498.fullname" . }}
  labels:
    {{- include "go-echobf00ab74-60f9-4d62-a852-3da7dbe5c498.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf00ab74-60f9-4d62-a852-3da7dbe5c498.selectorLabels" . | nindent 6 }}
