apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68ae4f6e-901d-46d5-9ea7-33ab6dc42554.fullname" . }}
  labels:
    {{- include "go-echo68ae4f6e-901d-46d5-9ea7-33ab6dc42554.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68ae4f6e-901d-46d5-9ea7-33ab6dc42554.selectorLabels" . | nindent 6 }}
