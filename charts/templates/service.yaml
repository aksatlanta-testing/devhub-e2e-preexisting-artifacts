apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73416506-ed6a-4bd8-9cee-c564c35f0848.fullname" . }}
  labels:
    {{- include "go-echo73416506-ed6a-4bd8-9cee-c564c35f0848.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73416506-ed6a-4bd8-9cee-c564c35f0848.selectorLabels" . | nindent 6 }}
