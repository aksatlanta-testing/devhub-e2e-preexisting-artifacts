apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfe88265-ffd1-48ab-8183-2e7e8f4fcb32.fullname" . }}
  labels:
    {{- include "go-echocfe88265-ffd1-48ab-8183-2e7e8f4fcb32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfe88265-ffd1-48ab-8183-2e7e8f4fcb32.selectorLabels" . | nindent 6 }}
