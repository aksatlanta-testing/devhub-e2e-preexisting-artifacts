apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9aa8891-a6ac-4238-b2df-53dde8e982a4.fullname" . }}
  labels:
    {{- include "go-echoc9aa8891-a6ac-4238-b2df-53dde8e982a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9aa8891-a6ac-4238-b2df-53dde8e982a4.selectorLabels" . | nindent 6 }}
