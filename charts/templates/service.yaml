apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff775eb6-d9d7-4d2d-95f8-20c59713b73f.fullname" . }}
  labels:
    {{- include "go-echoff775eb6-d9d7-4d2d-95f8-20c59713b73f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff775eb6-d9d7-4d2d-95f8-20c59713b73f.selectorLabels" . | nindent 6 }}
