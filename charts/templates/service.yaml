apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2f536d4-8bc0-45c1-a6cf-9622253ad7b5.fullname" . }}
  labels:
    {{- include "go-echod2f536d4-8bc0-45c1-a6cf-9622253ad7b5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2f536d4-8bc0-45c1-a6cf-9622253ad7b5.selectorLabels" . | nindent 6 }}
