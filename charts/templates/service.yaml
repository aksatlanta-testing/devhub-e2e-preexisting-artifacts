apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo794254ee-7e63-4b46-a52f-63a8df556867.fullname" . }}
  labels:
    {{- include "go-echo794254ee-7e63-4b46-a52f-63a8df556867.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo794254ee-7e63-4b46-a52f-63a8df556867.selectorLabels" . | nindent 6 }}
