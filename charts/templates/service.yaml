apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0fa40d85-c792-4f9b-a0f7-8db539cbe4e4.fullname" . }}
  labels:
    {{- include "go-echo0fa40d85-c792-4f9b-a0f7-8db539cbe4e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0fa40d85-c792-4f9b-a0f7-8db539cbe4e4.selectorLabels" . | nindent 6 }}
