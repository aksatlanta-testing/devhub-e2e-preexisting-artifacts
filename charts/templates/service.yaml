apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo672b01a0-6379-4e39-9c3d-1fe6617f690f.fullname" . }}
  labels:
    {{- include "go-echo672b01a0-6379-4e39-9c3d-1fe6617f690f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo672b01a0-6379-4e39-9c3d-1fe6617f690f.selectorLabels" . | nindent 6 }}
