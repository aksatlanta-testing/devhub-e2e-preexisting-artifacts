apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5886053-c5b3-436f-950c-5ad85cbc46ce.fullname" . }}
  labels:
    {{- include "go-echob5886053-c5b3-436f-950c-5ad85cbc46ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5886053-c5b3-436f-950c-5ad85cbc46ce.selectorLabels" . | nindent 6 }}
