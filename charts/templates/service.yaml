apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a34689a-9977-4cfd-8754-e159706cf322.fullname" . }}
  labels:
    {{- include "go-echo1a34689a-9977-4cfd-8754-e159706cf322.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
