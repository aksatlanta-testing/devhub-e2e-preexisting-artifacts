apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9de505e-ceb3-4bdf-a685-1f2c3892e559.fullname" . }}
  labels:
    {{- include "go-echof9de505e-ceb3-4bdf-a685-1f2c3892e559.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9de505e-ceb3-4bdf-a685-1f2c3892e559.selectorLabels" . | nindent 6 }}
