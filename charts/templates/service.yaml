apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed5431f2-1a70-4348-b77a-7c0b9eefbfaa.fullname" . }}
  labels:
    {{- include "go-echoed5431f2-1a70-4348-b77a-7c0b9eefbfaa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed5431f2-1a70-4348-b77a-7c0b9eefbfaa.selectorLabels" . | nindent 6 }}
