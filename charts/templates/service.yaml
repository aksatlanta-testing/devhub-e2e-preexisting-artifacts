apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5df3b016-c530-4d04-b04b-449ff24ab979.fullname" . }}
  labels:
    {{- include "go-echo5df3b016-c530-4d04-b04b-449ff24ab979.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5df3b016-c530-4d04-b04b-449ff24ab979.selectorLabels" . | nindent 6 }}
