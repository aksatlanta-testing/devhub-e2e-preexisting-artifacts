apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b019af4-d035-43e1-a348-f1efa1c599cf.fullname" . }}
  labels:
    {{- include "go-echo0b019af4-d035-43e1-a348-f1efa1c599cf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b019af4-d035-43e1-a348-f1efa1c599cf.selectorLabels" . | nindent 6 }}
