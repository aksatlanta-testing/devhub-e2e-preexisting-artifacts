apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo912e22e9-bce4-476d-a550-ec4d44a317e8.fullname" . }}
  labels:
    {{- include "go-echo912e22e9-bce4-476d-a550-ec4d44a317e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo912e22e9-bce4-476d-a550-ec4d44a317e8.selectorLabels" . | nindent 6 }}
