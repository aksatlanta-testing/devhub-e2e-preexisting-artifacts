apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod285ea2b-c488-47c6-ba58-2231dba286a2.fullname" . }}
  labels:
    {{- include "go-echod285ea2b-c488-47c6-ba58-2231dba286a2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod285ea2b-c488-47c6-ba58-2231dba286a2.selectorLabels" . | nindent 6 }}
