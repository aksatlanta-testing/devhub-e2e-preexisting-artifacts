apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8a8dbce-6dbf-48b9-bfb1-a8fccbe9500b.fullname" . }}
  labels:
    {{- include "go-echoc8a8dbce-6dbf-48b9-bfb1-a8fccbe9500b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8a8dbce-6dbf-48b9-bfb1-a8fccbe9500b.selectorLabels" . | nindent 6 }}
