apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5620bd39-5320-487f-9995-c823f6b4a9f7.fullname" . }}
  labels:
    {{- include "go-echo5620bd39-5320-487f-9995-c823f6b4a9f7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5620bd39-5320-487f-9995-c823f6b4a9f7.selectorLabels" . | nindent 6 }}
