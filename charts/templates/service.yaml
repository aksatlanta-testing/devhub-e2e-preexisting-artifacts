apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7306a3f-0b8d-4bb0-9dea-0bac5d4aca88.fullname" . }}
  labels:
    {{- include "go-echof7306a3f-0b8d-4bb0-9dea-0bac5d4aca88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7306a3f-0b8d-4bb0-9dea-0bac5d4aca88.selectorLabels" . | nindent 6 }}
