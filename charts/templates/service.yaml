apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo973ec3d9-d873-4376-8edf-405e89bca754.fullname" . }}
  labels:
    {{- include "go-echo973ec3d9-d873-4376-8edf-405e89bca754.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo973ec3d9-d873-4376-8edf-405e89bca754.selectorLabels" . | nindent 6 }}
