apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf5cef30-3e30-44ac-897e-687041ea27b0.fullname" . }}
  labels:
    {{- include "go-echoaf5cef30-3e30-44ac-897e-687041ea27b0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf5cef30-3e30-44ac-897e-687041ea27b0.selectorLabels" . | nindent 6 }}
