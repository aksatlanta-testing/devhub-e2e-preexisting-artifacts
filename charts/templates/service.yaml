apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo372254b3-b676-48e3-8262-12a170a827b2.fullname" . }}
  labels:
    {{- include "go-echo372254b3-b676-48e3-8262-12a170a827b2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo372254b3-b676-48e3-8262-12a170a827b2.selectorLabels" . | nindent 6 }}
