apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4eb4fb42-097b-4dab-b21f-f8ff4d65bd08.fullname" . }}
  labels:
    {{- include "go-echo4eb4fb42-097b-4dab-b21f-f8ff4d65bd08.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4eb4fb42-097b-4dab-b21f-f8ff4d65bd08.selectorLabels" . | nindent 6 }}
