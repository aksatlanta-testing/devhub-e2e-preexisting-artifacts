apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod162c2b3-5c8b-431a-9106-1b52038b3430.fullname" . }}
  labels:
    {{- include "go-echod162c2b3-5c8b-431a-9106-1b52038b3430.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod162c2b3-5c8b-431a-9106-1b52038b3430.selectorLabels" . | nindent 6 }}
