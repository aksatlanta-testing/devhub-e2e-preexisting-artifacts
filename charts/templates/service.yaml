apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e4fa8fc-f28f-4a9d-8585-d031e17d764f.fullname" . }}
  labels:
    {{- include "go-echo3e4fa8fc-f28f-4a9d-8585-d031e17d764f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e4fa8fc-f28f-4a9d-8585-d031e17d764f.selectorLabels" . | nindent 6 }}
