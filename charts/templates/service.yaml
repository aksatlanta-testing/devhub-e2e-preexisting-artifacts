apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b60099e-e3fc-417a-a0cf-a05d2fc7483c.fullname" . }}
  labels:
    {{- include "go-echo4b60099e-e3fc-417a-a0cf-a05d2fc7483c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b60099e-e3fc-417a-a0cf-a05d2fc7483c.selectorLabels" . | nindent 6 }}
