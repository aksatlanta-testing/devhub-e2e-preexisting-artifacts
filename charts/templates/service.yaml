apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a91afc9-b516-4ae7-bf8f-ec489a2e4bff.fullname" . }}
  labels:
    {{- include "go-echo1a91afc9-b516-4ae7-bf8f-ec489a2e4bff.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a91afc9-b516-4ae7-bf8f-ec489a2e4bff.selectorLabels" . | nindent 6 }}
