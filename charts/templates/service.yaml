apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e94c81b-4aa1-4021-8cf1-f90604bef4dd.fullname" . }}
  labels:
    {{- include "go-echo8e94c81b-4aa1-4021-8cf1-f90604bef4dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e94c81b-4aa1-4021-8cf1-f90604bef4dd.selectorLabels" . | nindent 6 }}
