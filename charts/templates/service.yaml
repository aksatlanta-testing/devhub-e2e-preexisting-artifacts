apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobba6ab64-ae41-432d-b3e4-326019ce8338.fullname" . }}
  labels:
    {{- include "go-echobba6ab64-ae41-432d-b3e4-326019ce8338.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobba6ab64-ae41-432d-b3e4-326019ce8338.selectorLabels" . | nindent 6 }}
