apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo93a69f9d-b935-412a-b93f-30c1cd4a6fa1.fullname" . }}
  labels:
    {{- include "go-echo93a69f9d-b935-412a-b93f-30c1cd4a6fa1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo93a69f9d-b935-412a-b93f-30c1cd4a6fa1.selectorLabels" . | nindent 6 }}
