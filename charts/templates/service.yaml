apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1d764f4-7ecd-4272-a4e5-276e16000a5d.fullname" . }}
  labels:
    {{- include "go-echoe1d764f4-7ecd-4272-a4e5-276e16000a5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1d764f4-7ecd-4272-a4e5-276e16000a5d.selectorLabels" . | nindent 6 }}
