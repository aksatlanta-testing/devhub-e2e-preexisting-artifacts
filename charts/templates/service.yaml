apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02de8629-8296-4277-9d20-5c99841807cb.fullname" . }}
  labels:
    {{- include "go-echo02de8629-8296-4277-9d20-5c99841807cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02de8629-8296-4277-9d20-5c99841807cb.selectorLabels" . | nindent 6 }}
