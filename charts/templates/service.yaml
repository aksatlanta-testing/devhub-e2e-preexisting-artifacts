apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocefc205e-e299-4137-919e-3cd9196a8db7.fullname" . }}
  labels:
    {{- include "go-echocefc205e-e299-4137-919e-3cd9196a8db7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocefc205e-e299-4137-919e-3cd9196a8db7.selectorLabels" . | nindent 6 }}
