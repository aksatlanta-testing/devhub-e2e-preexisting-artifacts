apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod95d5e5a-34b9-42f3-aeed-f09f9f998acd.fullname" . }}
  labels:
    {{- include "go-echod95d5e5a-34b9-42f3-aeed-f09f9f998acd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod95d5e5a-34b9-42f3-aeed-f09f9f998acd.selectorLabels" . | nindent 6 }}
