apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42ecfda1-474a-49eb-88bb-23a9864d4c78.fullname" . }}
  labels:
    {{- include "go-echo42ecfda1-474a-49eb-88bb-23a9864d4c78.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42ecfda1-474a-49eb-88bb-23a9864d4c78.selectorLabels" . | nindent 6 }}
