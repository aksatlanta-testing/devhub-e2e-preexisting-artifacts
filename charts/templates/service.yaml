apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ab149cd-51a2-4569-b7b2-9a1e4b6e9e37.fullname" . }}
  labels:
    {{- include "go-echo3ab149cd-51a2-4569-b7b2-9a1e4b6e9e37.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ab149cd-51a2-4569-b7b2-9a1e4b6e9e37.selectorLabels" . | nindent 6 }}
