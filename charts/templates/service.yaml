apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e1785c1-fafa-4401-bc2e-dac85c3d46e4.fullname" . }}
  labels:
    {{- include "go-echo5e1785c1-fafa-4401-bc2e-dac85c3d46e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e1785c1-fafa-4401-bc2e-dac85c3d46e4.selectorLabels" . | nindent 6 }}
