apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f9acfe5-c946-44c6-981c-1490e29742d0.fullname" . }}
  labels:
    {{- include "go-echo2f9acfe5-c946-44c6-981c-1490e29742d0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f9acfe5-c946-44c6-981c-1490e29742d0.selectorLabels" . | nindent 6 }}
