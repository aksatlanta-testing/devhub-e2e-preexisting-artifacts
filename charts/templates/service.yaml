apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob638583f-75b7-435c-b5a1-fceff7d921a3.fullname" . }}
  labels:
    {{- include "go-echob638583f-75b7-435c-b5a1-fceff7d921a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob638583f-75b7-435c-b5a1-fceff7d921a3.selectorLabels" . | nindent 6 }}
