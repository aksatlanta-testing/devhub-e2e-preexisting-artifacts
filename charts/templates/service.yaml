apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo229a6916-81d8-4471-82f1-4597cb501d0e.fullname" . }}
  labels:
    {{- include "go-echo229a6916-81d8-4471-82f1-4597cb501d0e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo229a6916-81d8-4471-82f1-4597cb501d0e.selectorLabels" . | nindent 6 }}
