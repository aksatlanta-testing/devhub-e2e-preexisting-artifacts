apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeddab034-d051-49ed-9dd2-bf7f249688ca.fullname" . }}
  labels:
    {{- include "go-echoeddab034-d051-49ed-9dd2-bf7f249688ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeddab034-d051-49ed-9dd2-bf7f249688ca.selectorLabels" . | nindent 6 }}
