apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof907160a-542d-4f7b-9fcd-443879a027b2.fullname" . }}
  labels:
    {{- include "go-echof907160a-542d-4f7b-9fcd-443879a027b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof907160a-542d-4f7b-9fcd-443879a027b2.selectorLabels" . | nindent 6 }}
