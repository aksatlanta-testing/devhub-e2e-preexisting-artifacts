apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2ce29b8-57ff-4a88-8162-c8c447f4bec7.fullname" . }}
  labels:
    {{- include "go-echod2ce29b8-57ff-4a88-8162-c8c447f4bec7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2ce29b8-57ff-4a88-8162-c8c447f4bec7.selectorLabels" . | nindent 6 }}
