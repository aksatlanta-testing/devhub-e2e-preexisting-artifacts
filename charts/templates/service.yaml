apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad267a63-c25b-465b-9e08-69ef4e8f8f80.fullname" . }}
  labels:
    {{- include "go-echoad267a63-c25b-465b-9e08-69ef4e8f8f80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad267a63-c25b-465b-9e08-69ef4e8f8f80.selectorLabels" . | nindent 6 }}
