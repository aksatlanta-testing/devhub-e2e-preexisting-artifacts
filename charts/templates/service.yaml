apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6eb6da5-8657-46ef-9c7e-e32507463c74.fullname" . }}
  labels:
    {{- include "go-echof6eb6da5-8657-46ef-9c7e-e32507463c74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6eb6da5-8657-46ef-9c7e-e32507463c74.selectorLabels" . | nindent 6 }}
