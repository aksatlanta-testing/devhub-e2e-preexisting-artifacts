apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84b788a4-100c-4b64-b2e3-5a9a67922af4.fullname" . }}
  labels:
    {{- include "go-echo84b788a4-100c-4b64-b2e3-5a9a67922af4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84b788a4-100c-4b64-b2e3-5a9a67922af4.selectorLabels" . | nindent 6 }}
