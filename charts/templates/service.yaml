apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0722abf-322e-4607-a6fb-ba945f65dff6.fullname" . }}
  labels:
    {{- include "go-echof0722abf-322e-4607-a6fb-ba945f65dff6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0722abf-322e-4607-a6fb-ba945f65dff6.selectorLabels" . | nindent 6 }}
