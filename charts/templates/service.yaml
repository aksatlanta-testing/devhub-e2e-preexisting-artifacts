apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3881f51-a020-43c9-bede-78ec1b16b581.fullname" . }}
  labels:
    {{- include "go-echod3881f51-a020-43c9-bede-78ec1b16b581.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3881f51-a020-43c9-bede-78ec1b16b581.selectorLabels" . | nindent 6 }}
