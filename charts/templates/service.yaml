apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1757d8df-d6ff-4156-a2fb-e4f416140ac5.fullname" . }}
  labels:
    {{- include "go-echo1757d8df-d6ff-4156-a2fb-e4f416140ac5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1757d8df-d6ff-4156-a2fb-e4f416140ac5.selectorLabels" . | nindent 6 }}
