apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2119bb6d-72fd-4f6e-8985-b9188b50755c.fullname" . }}
  labels:
    {{- include "go-echo2119bb6d-72fd-4f6e-8985-b9188b50755c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2119bb6d-72fd-4f6e-8985-b9188b50755c.selectorLabels" . | nindent 6 }}
