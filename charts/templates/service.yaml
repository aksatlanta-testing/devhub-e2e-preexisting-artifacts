apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87eaf134-dc0c-4597-9ce2-44da2968a6f8.fullname" . }}
  labels:
    {{- include "go-echo87eaf134-dc0c-4597-9ce2-44da2968a6f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87eaf134-dc0c-4597-9ce2-44da2968a6f8.selectorLabels" . | nindent 6 }}
