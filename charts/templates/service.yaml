apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof090f19b-317a-4220-8f27-b3fca6e1184d.fullname" . }}
  labels:
    {{- include "go-echof090f19b-317a-4220-8f27-b3fca6e1184d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof090f19b-317a-4220-8f27-b3fca6e1184d.selectorLabels" . | nindent 6 }}
