apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66d54e14-c2f4-409c-9780-19b3541c5b35.fullname" . }}
  labels:
    {{- include "go-echo66d54e14-c2f4-409c-9780-19b3541c5b35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66d54e14-c2f4-409c-9780-19b3541c5b35.selectorLabels" . | nindent 6 }}
