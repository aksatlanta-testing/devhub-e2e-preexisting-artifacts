apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc661161e-f1b2-4f30-980e-cb709d57407a.fullname" . }}
  labels:
    {{- include "go-echoc661161e-f1b2-4f30-980e-cb709d57407a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc661161e-f1b2-4f30-980e-cb709d57407a.selectorLabels" . | nindent 6 }}
