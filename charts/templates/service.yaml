apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4b1f2d9-f27e-4ebe-9672-d1bd11d8ac3a.fullname" . }}
  labels:
    {{- include "go-echof4b1f2d9-f27e-4ebe-9672-d1bd11d8ac3a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4b1f2d9-f27e-4ebe-9672-d1bd11d8ac3a.selectorLabels" . | nindent 6 }}
