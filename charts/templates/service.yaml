apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7beee6c0-04d2-4eaf-b42f-e2bd79b21388.fullname" . }}
  labels:
    {{- include "go-echo7beee6c0-04d2-4eaf-b42f-e2bd79b21388.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7beee6c0-04d2-4eaf-b42f-e2bd79b21388.selectorLabels" . | nindent 6 }}
