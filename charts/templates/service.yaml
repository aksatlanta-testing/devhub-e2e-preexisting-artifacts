apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55febc94-c3a3-4d6a-b14c-e3ccb4fe3643.fullname" . }}
  labels:
    {{- include "go-echo55febc94-c3a3-4d6a-b14c-e3ccb4fe3643.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55febc94-c3a3-4d6a-b14c-e3ccb4fe3643.selectorLabels" . | nindent 6 }}
