apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodaeaee6c-8522-4c6b-885a-6055a06abf64.fullname" . }}
  labels:
    {{- include "go-echodaeaee6c-8522-4c6b-885a-6055a06abf64.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodaeaee6c-8522-4c6b-885a-6055a06abf64.selectorLabels" . | nindent 6 }}
