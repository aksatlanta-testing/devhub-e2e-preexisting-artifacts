apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc10c0d89-86d9-40e1-84d7-d5c6c7ccea17.fullname" . }}
  labels:
    {{- include "go-echoc10c0d89-86d9-40e1-84d7-d5c6c7ccea17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc10c0d89-86d9-40e1-84d7-d5c6c7ccea17.selectorLabels" . | nindent 6 }}
