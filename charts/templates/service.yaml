apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc60e2d83-fdd7-4eaf-988d-5c8faa86a002.fullname" . }}
  labels:
    {{- include "go-echoc60e2d83-fdd7-4eaf-988d-5c8faa86a002.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc60e2d83-fdd7-4eaf-988d-5c8faa86a002.selectorLabels" . | nindent 6 }}
