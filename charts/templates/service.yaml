apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd59e77b-43cd-4c30-bee3-7748bbd393a0.fullname" . }}
  labels:
    {{- include "go-echofd59e77b-43cd-4c30-bee3-7748bbd393a0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd59e77b-43cd-4c30-bee3-7748bbd393a0.selectorLabels" . | nindent 6 }}
