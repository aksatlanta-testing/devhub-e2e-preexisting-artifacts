apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e350fc6-37f5-42c7-8af3-c762219a3fac.fullname" . }}
  labels:
    {{- include "go-echo7e350fc6-37f5-42c7-8af3-c762219a3fac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e350fc6-37f5-42c7-8af3-c762219a3fac.selectorLabels" . | nindent 6 }}
