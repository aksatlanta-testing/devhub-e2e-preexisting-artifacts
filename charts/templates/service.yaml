apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab2bfc46-99b2-4547-97f4-8f7debdf2107.fullname" . }}
  labels:
    {{- include "go-echoab2bfc46-99b2-4547-97f4-8f7debdf2107.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab2bfc46-99b2-4547-97f4-8f7debdf2107.selectorLabels" . | nindent 6 }}
