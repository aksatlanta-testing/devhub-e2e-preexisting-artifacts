apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2bc7ff0c-bb7c-4a44-b975-dc938f2bbcd6.fullname" . }}
  labels:
    {{- include "go-echo2bc7ff0c-bb7c-4a44-b975-dc938f2bbcd6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2bc7ff0c-bb7c-4a44-b975-dc938f2bbcd6.selectorLabels" . | nindent 6 }}
