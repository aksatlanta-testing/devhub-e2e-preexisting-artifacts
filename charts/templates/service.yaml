apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25ee6e6b-07bb-4500-ab40-8fa766851343.fullname" . }}
  labels:
    {{- include "go-echo25ee6e6b-07bb-4500-ab40-8fa766851343.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25ee6e6b-07bb-4500-ab40-8fa766851343.selectorLabels" . | nindent 6 }}
