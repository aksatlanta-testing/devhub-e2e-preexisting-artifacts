apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f62a232-3ac5-44cb-9b21-67944d74f885.fullname" . }}
  labels:
    {{- include "go-echo1f62a232-3ac5-44cb-9b21-67944d74f885.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f62a232-3ac5-44cb-9b21-67944d74f885.selectorLabels" . | nindent 6 }}
