apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55772b72-dc2f-4e1f-833b-a0125fd755dd.fullname" . }}
  labels:
    {{- include "go-echo55772b72-dc2f-4e1f-833b-a0125fd755dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55772b72-dc2f-4e1f-833b-a0125fd755dd.selectorLabels" . | nindent 6 }}
