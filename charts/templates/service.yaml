apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo684d7833-a91a-4d92-a10a-f6d74f20779d.fullname" . }}
  labels:
    {{- include "go-echo684d7833-a91a-4d92-a10a-f6d74f20779d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo684d7833-a91a-4d92-a10a-f6d74f20779d.selectorLabels" . | nindent 6 }}
