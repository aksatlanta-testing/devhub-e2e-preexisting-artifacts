apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob98fd007-0bdb-41e9-8567-c59871a4f7ca.fullname" . }}
  labels:
    {{- include "go-echob98fd007-0bdb-41e9-8567-c59871a4f7ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob98fd007-0bdb-41e9-8567-c59871a4f7ca.selectorLabels" . | nindent 6 }}
