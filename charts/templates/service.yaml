apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodaff1ff4-13cf-439a-a245-d0409d57f662.fullname" . }}
  labels:
    {{- include "go-echodaff1ff4-13cf-439a-a245-d0409d57f662.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodaff1ff4-13cf-439a-a245-d0409d57f662.selectorLabels" . | nindent 6 }}
