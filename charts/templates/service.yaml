apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo909290c3-4cb8-44dd-a01f-ce1cdaaa2d0e.fullname" . }}
  labels:
    {{- include "go-echo909290c3-4cb8-44dd-a01f-ce1cdaaa2d0e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo909290c3-4cb8-44dd-a01f-ce1cdaaa2d0e.selectorLabels" . | nindent 6 }}
