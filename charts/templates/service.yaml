apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29724421-8286-4966-ace0-4678b61abb22.fullname" . }}
  labels:
    {{- include "go-echo29724421-8286-4966-ace0-4678b61abb22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29724421-8286-4966-ace0-4678b61abb22.selectorLabels" . | nindent 6 }}
