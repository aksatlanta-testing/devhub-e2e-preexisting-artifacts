apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ace4c1e-719c-4fed-9afb-e5281ec3def0.fullname" . }}
  labels:
    {{- include "go-echo7ace4c1e-719c-4fed-9afb-e5281ec3def0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ace4c1e-719c-4fed-9afb-e5281ec3def0.selectorLabels" . | nindent 6 }}
