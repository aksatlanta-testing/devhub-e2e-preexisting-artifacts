apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7a0282e-1c98-4a91-8fa6-989db18f43fb.fullname" . }}
  labels:
    {{- include "go-echof7a0282e-1c98-4a91-8fa6-989db18f43fb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7a0282e-1c98-4a91-8fa6-989db18f43fb.selectorLabels" . | nindent 6 }}
