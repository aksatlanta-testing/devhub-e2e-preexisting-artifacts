apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5177e930-2b28-489f-bf37-560b9bf547e2.fullname" . }}
  labels:
    {{- include "go-echo5177e930-2b28-489f-bf37-560b9bf547e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5177e930-2b28-489f-bf37-560b9bf547e2.selectorLabels" . | nindent 6 }}
