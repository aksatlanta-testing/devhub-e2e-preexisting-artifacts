apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo925c1eed-ad21-4ca4-8d17-c1701760e807.fullname" . }}
  labels:
    {{- include "go-echo925c1eed-ad21-4ca4-8d17-c1701760e807.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo925c1eed-ad21-4ca4-8d17-c1701760e807.selectorLabels" . | nindent 6 }}
