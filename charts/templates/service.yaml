apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob14b8698-55e6-4c86-85a4-77fb4bd49d81.fullname" . }}
  labels:
    {{- include "go-echob14b8698-55e6-4c86-85a4-77fb4bd49d81.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob14b8698-55e6-4c86-85a4-77fb4bd49d81.selectorLabels" . | nindent 6 }}
