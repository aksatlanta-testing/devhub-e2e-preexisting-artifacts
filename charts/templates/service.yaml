apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo872d0178-535b-41df-af8c-6fdd0b60a189.fullname" . }}
  labels:
    {{- include "go-echo872d0178-535b-41df-af8c-6fdd0b60a189.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo872d0178-535b-41df-af8c-6fdd0b60a189.selectorLabels" . | nindent 6 }}
