apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8334fc0-d9d1-4541-ae26-1686bcc3c182.fullname" . }}
  labels:
    {{- include "go-echod8334fc0-d9d1-4541-ae26-1686bcc3c182.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8334fc0-d9d1-4541-ae26-1686bcc3c182.selectorLabels" . | nindent 6 }}
