apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f972754-1a38-48b7-903d-90c673d8dc37.fullname" . }}
  labels:
    {{- include "go-echo0f972754-1a38-48b7-903d-90c673d8dc37.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f972754-1a38-48b7-903d-90c673d8dc37.selectorLabels" . | nindent 6 }}
