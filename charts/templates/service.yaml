apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofce4c8b8-e9c0-4ae7-8864-b9ff8b1d1220.fullname" . }}
  labels:
    {{- include "go-echofce4c8b8-e9c0-4ae7-8864-b9ff8b1d1220.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofce4c8b8-e9c0-4ae7-8864-b9ff8b1d1220.selectorLabels" . | nindent 6 }}
