apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a65beeb-f4aa-4c20-80ae-1d56df8684ee.fullname" . }}
  labels:
    {{- include "go-echo1a65beeb-f4aa-4c20-80ae-1d56df8684ee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a65beeb-f4aa-4c20-80ae-1d56df8684ee.selectorLabels" . | nindent 6 }}
