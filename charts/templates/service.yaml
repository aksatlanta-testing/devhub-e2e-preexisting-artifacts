apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe05c093d-ebee-46b3-bb34-29404752df50.fullname" . }}
  labels:
    {{- include "go-echoe05c093d-ebee-46b3-bb34-29404752df50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe05c093d-ebee-46b3-bb34-29404752df50.selectorLabels" . | nindent 6 }}
