apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c8b15bd-56f9-4242-ad7c-80e0a957181c.fullname" . }}
  labels:
    {{- include "go-echo1c8b15bd-56f9-4242-ad7c-80e0a957181c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c8b15bd-56f9-4242-ad7c-80e0a957181c.selectorLabels" . | nindent 6 }}
