apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo794c0db9-3411-4629-bdf6-d5289015b372.fullname" . }}
  labels:
    {{- include "go-echo794c0db9-3411-4629-bdf6-d5289015b372.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo794c0db9-3411-4629-bdf6-d5289015b372.selectorLabels" . | nindent 6 }}
