apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c976a79-85a4-4a1c-8411-25f79e3ecbf2.fullname" . }}
  labels:
    {{- include "go-echo1c976a79-85a4-4a1c-8411-25f79e3ecbf2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c976a79-85a4-4a1c-8411-25f79e3ecbf2.selectorLabels" . | nindent 6 }}
