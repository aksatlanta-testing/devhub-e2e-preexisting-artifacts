apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c5afa80-4af1-4b3c-b4dc-3e8a301ac4bc.fullname" . }}
  labels:
    {{- include "go-echo9c5afa80-4af1-4b3c-b4dc-3e8a301ac4bc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c5afa80-4af1-4b3c-b4dc-3e8a301ac4bc.selectorLabels" . | nindent 6 }}
