apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23c60c70-67de-4875-b212-b5c319060b62.fullname" . }}
  labels:
    {{- include "go-echo23c60c70-67de-4875-b212-b5c319060b62.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23c60c70-67de-4875-b212-b5c319060b62.selectorLabels" . | nindent 6 }}
