apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2a25d4d-42b2-451d-88ac-9cd46f696602.fullname" . }}
  labels:
    {{- include "go-echoa2a25d4d-42b2-451d-88ac-9cd46f696602.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2a25d4d-42b2-451d-88ac-9cd46f696602.selectorLabels" . | nindent 6 }}
