apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86dbb1d8-05a8-48b3-a106-e7c5b9f609a5.fullname" . }}
  labels:
    {{- include "go-echo86dbb1d8-05a8-48b3-a106-e7c5b9f609a5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86dbb1d8-05a8-48b3-a106-e7c5b9f609a5.selectorLabels" . | nindent 6 }}
