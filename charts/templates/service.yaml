apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ba795e9-def5-4579-853f-cf59928a7e3a.fullname" . }}
  labels:
    {{- include "go-echo0ba795e9-def5-4579-853f-cf59928a7e3a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ba795e9-def5-4579-853f-cf59928a7e3a.selectorLabels" . | nindent 6 }}
