apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc096a27-92f6-41e2-90f7-c1b327bb470a.fullname" . }}
  labels:
    {{- include "go-echocc096a27-92f6-41e2-90f7-c1b327bb470a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc096a27-92f6-41e2-90f7-c1b327bb470a.selectorLabels" . | nindent 6 }}
