apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b288e03-e547-4bae-b7ab-e8c6c72134bc.fullname" . }}
  labels:
    {{- include "go-echo7b288e03-e547-4bae-b7ab-e8c6c72134bc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b288e03-e547-4bae-b7ab-e8c6c72134bc.selectorLabels" . | nindent 6 }}
