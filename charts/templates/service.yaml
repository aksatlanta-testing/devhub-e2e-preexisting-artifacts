apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76ebfc2e-21db-42e3-ba4b-ab74aef04e32.fullname" . }}
  labels:
    {{- include "go-echo76ebfc2e-21db-42e3-ba4b-ab74aef04e32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76ebfc2e-21db-42e3-ba4b-ab74aef04e32.selectorLabels" . | nindent 6 }}
