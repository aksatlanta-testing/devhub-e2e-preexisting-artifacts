apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa82597fe-71cc-4f7a-b72e-6f9b05e65e65.fullname" . }}
  labels:
    {{- include "go-echoa82597fe-71cc-4f7a-b72e-6f9b05e65e65.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa82597fe-71cc-4f7a-b72e-6f9b05e65e65.selectorLabels" . | nindent 6 }}
