apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoefdcc2c5-b62a-4ba0-8c3c-d377f69e67d7.fullname" . }}
  labels:
    {{- include "go-echoefdcc2c5-b62a-4ba0-8c3c-d377f69e67d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoefdcc2c5-b62a-4ba0-8c3c-d377f69e67d7.selectorLabels" . | nindent 6 }}
