apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73d7c108-839c-4942-88bd-0b0c3112f84d.fullname" . }}
  labels:
    {{- include "go-echo73d7c108-839c-4942-88bd-0b0c3112f84d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73d7c108-839c-4942-88bd-0b0c3112f84d.selectorLabels" . | nindent 6 }}
