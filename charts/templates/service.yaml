apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo846f1812-74b2-4f27-9798-bca746f37fd3.fullname" . }}
  labels:
    {{- include "go-echo846f1812-74b2-4f27-9798-bca746f37fd3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo846f1812-74b2-4f27-9798-bca746f37fd3.selectorLabels" . | nindent 6 }}
