apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02a9abac-ebb1-42ea-8ebf-0a54cf140682.fullname" . }}
  labels:
    {{- include "go-echo02a9abac-ebb1-42ea-8ebf-0a54cf140682.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02a9abac-ebb1-42ea-8ebf-0a54cf140682.selectorLabels" . | nindent 6 }}
