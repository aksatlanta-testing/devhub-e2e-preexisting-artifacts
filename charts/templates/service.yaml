apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod10aed8e-33c5-4455-8c6d-852d26838079.fullname" . }}
  labels:
    {{- include "go-echod10aed8e-33c5-4455-8c6d-852d26838079.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod10aed8e-33c5-4455-8c6d-852d26838079.selectorLabels" . | nindent 6 }}
