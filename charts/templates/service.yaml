apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bead123-3251-4e1d-b9b9-d0278479e22b.fullname" . }}
  labels:
    {{- include "go-echo8bead123-3251-4e1d-b9b9-d0278479e22b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bead123-3251-4e1d-b9b9-d0278479e22b.selectorLabels" . | nindent 6 }}
