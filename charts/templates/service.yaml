apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoede2e406-3251-47fb-ba59-53d2df91131e.fullname" . }}
  labels:
    {{- include "go-echoede2e406-3251-47fb-ba59-53d2df91131e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoede2e406-3251-47fb-ba59-53d2df91131e.selectorLabels" . | nindent 6 }}
