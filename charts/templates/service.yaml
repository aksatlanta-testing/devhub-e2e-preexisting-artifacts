apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1afe1259-faf4-472a-9d71-50aa3866650f.fullname" . }}
  labels:
    {{- include "go-echo1afe1259-faf4-472a-9d71-50aa3866650f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1afe1259-faf4-472a-9d71-50aa3866650f.selectorLabels" . | nindent 6 }}
