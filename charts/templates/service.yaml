apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1518cd63-f00b-4f3b-8633-2e16b2019c27.fullname" . }}
  labels:
    {{- include "go-echo1518cd63-f00b-4f3b-8633-2e16b2019c27.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1518cd63-f00b-4f3b-8633-2e16b2019c27.selectorLabels" . | nindent 6 }}
