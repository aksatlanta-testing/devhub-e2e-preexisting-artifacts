apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4abad210-bc45-4dec-882e-3b1b23c7d0c8.fullname" . }}
  labels:
    {{- include "go-echo4abad210-bc45-4dec-882e-3b1b23c7d0c8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4abad210-bc45-4dec-882e-3b1b23c7d0c8.selectorLabels" . | nindent 6 }}
