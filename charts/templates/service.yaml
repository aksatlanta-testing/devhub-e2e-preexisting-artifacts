apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6da11ed0-8708-4c42-b503-83659127ae48.fullname" . }}
  labels:
    {{- include "go-echo6da11ed0-8708-4c42-b503-83659127ae48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6da11ed0-8708-4c42-b503-83659127ae48.selectorLabels" . | nindent 6 }}
