apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b668b4e-6fcc-48bb-af85-ff9774cae01b.fullname" . }}
  labels:
    {{- include "go-echo6b668b4e-6fcc-48bb-af85-ff9774cae01b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b668b4e-6fcc-48bb-af85-ff9774cae01b.selectorLabels" . | nindent 6 }}
