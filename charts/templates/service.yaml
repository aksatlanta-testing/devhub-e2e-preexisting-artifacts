apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8571fd9-086a-48c6-aa9b-b75d88951afd.fullname" . }}
  labels:
    {{- include "go-echoc8571fd9-086a-48c6-aa9b-b75d88951afd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8571fd9-086a-48c6-aa9b-b75d88951afd.selectorLabels" . | nindent 6 }}
