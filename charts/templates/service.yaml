apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof89c583e-fa18-419a-9758-e10b4bc89a1a.fullname" . }}
  labels:
    {{- include "go-echof89c583e-fa18-419a-9758-e10b4bc89a1a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof89c583e-fa18-419a-9758-e10b4bc89a1a.selectorLabels" . | nindent 6 }}
