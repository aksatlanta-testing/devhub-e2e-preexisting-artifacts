apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fe59fe0-b4a7-4945-819a-cea5e8977628.fullname" . }}
  labels:
    {{- include "go-echo4fe59fe0-b4a7-4945-819a-cea5e8977628.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fe59fe0-b4a7-4945-819a-cea5e8977628.selectorLabels" . | nindent 6 }}
