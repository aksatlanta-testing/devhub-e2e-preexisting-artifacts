apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62c3c581-b6bb-40bb-acf9-7d03af677b27.fullname" . }}
  labels:
    {{- include "go-echo62c3c581-b6bb-40bb-acf9-7d03af677b27.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62c3c581-b6bb-40bb-acf9-7d03af677b27.selectorLabels" . | nindent 6 }}
