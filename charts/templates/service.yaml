apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1381796f-6d44-445b-825b-d31438879e59.fullname" . }}
  labels:
    {{- include "go-echo1381796f-6d44-445b-825b-d31438879e59.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1381796f-6d44-445b-825b-d31438879e59.selectorLabels" . | nindent 6 }}
