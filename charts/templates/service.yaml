apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7421cb7-c86b-45d5-ab4a-afedf5c46480.fullname" . }}
  labels:
    {{- include "go-echoe7421cb7-c86b-45d5-ab4a-afedf5c46480.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7421cb7-c86b-45d5-ab4a-afedf5c46480.selectorLabels" . | nindent 6 }}
