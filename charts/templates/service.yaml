apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoccfd7e6d-7e55-43bd-83d8-7ebb9e0aa0e7.fullname" . }}
  labels:
    {{- include "go-echoccfd7e6d-7e55-43bd-83d8-7ebb9e0aa0e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoccfd7e6d-7e55-43bd-83d8-7ebb9e0aa0e7.selectorLabels" . | nindent 6 }}
