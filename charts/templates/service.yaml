apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8751925c-2be0-4889-8846-4d2a9aa816dc.fullname" . }}
  labels:
    {{- include "go-echo8751925c-2be0-4889-8846-4d2a9aa816dc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8751925c-2be0-4889-8846-4d2a9aa816dc.selectorLabels" . | nindent 6 }}
