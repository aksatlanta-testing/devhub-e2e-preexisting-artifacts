apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0f284f5-f489-443b-beff-d43ea79adf16.fullname" . }}
  labels:
    {{- include "go-echod0f284f5-f489-443b-beff-d43ea79adf16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0f284f5-f489-443b-beff-d43ea79adf16.selectorLabels" . | nindent 6 }}
