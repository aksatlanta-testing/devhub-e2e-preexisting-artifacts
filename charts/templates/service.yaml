apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofdbb5a73-3966-4fd2-ac38-ae3b614feb73.fullname" . }}
  labels:
    {{- include "go-echofdbb5a73-3966-4fd2-ac38-ae3b614feb73.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofdbb5a73-3966-4fd2-ac38-ae3b614feb73.selectorLabels" . | nindent 6 }}
