apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e2f9b40-a6fb-43be-9ed8-d4834c9de269.fullname" . }}
  labels:
    {{- include "go-echo1e2f9b40-a6fb-43be-9ed8-d4834c9de269.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e2f9b40-a6fb-43be-9ed8-d4834c9de269.selectorLabels" . | nindent 6 }}
