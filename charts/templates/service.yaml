apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo737e0986-ea73-4467-95ca-a40ea5cc6e78.fullname" . }}
  labels:
    {{- include "go-echo737e0986-ea73-4467-95ca-a40ea5cc6e78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo737e0986-ea73-4467-95ca-a40ea5cc6e78.selectorLabels" . | nindent 6 }}
