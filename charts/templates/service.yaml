apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23653505-46fb-45cc-b0ed-bf018ece3ede.fullname" . }}
  labels:
    {{- include "go-echo23653505-46fb-45cc-b0ed-bf018ece3ede.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23653505-46fb-45cc-b0ed-bf018ece3ede.selectorLabels" . | nindent 6 }}
