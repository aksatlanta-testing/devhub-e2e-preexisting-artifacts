apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3fe715b7-05c1-4e32-8427-baf8d6e5912b.fullname" . }}
  labels:
    {{- include "go-echo3fe715b7-05c1-4e32-8427-baf8d6e5912b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3fe715b7-05c1-4e32-8427-baf8d6e5912b.selectorLabels" . | nindent 6 }}
