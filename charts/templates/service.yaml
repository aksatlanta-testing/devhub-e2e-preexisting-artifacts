apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b108abb-9eb9-4718-b962-a42792045505.fullname" . }}
  labels:
    {{- include "go-echo9b108abb-9eb9-4718-b962-a42792045505.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b108abb-9eb9-4718-b962-a42792045505.selectorLabels" . | nindent 6 }}
