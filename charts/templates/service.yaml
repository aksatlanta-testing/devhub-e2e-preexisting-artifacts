apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo391f878e-d2d8-43ef-a54f-1318b229d801.fullname" . }}
  labels:
    {{- include "go-echo391f878e-d2d8-43ef-a54f-1318b229d801.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo391f878e-d2d8-43ef-a54f-1318b229d801.selectorLabels" . | nindent 6 }}
