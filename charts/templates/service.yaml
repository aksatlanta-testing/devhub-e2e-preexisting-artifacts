apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68efd9a0-88a4-499a-a47f-a98480e54846.fullname" . }}
  labels:
    {{- include "go-echo68efd9a0-88a4-499a-a47f-a98480e54846.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68efd9a0-88a4-499a-a47f-a98480e54846.selectorLabels" . | nindent 6 }}
