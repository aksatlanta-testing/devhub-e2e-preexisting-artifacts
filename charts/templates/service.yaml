apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28712cf9-ac1c-40b2-9861-0df4228a83f5.fullname" . }}
  labels:
    {{- include "go-echo28712cf9-ac1c-40b2-9861-0df4228a83f5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28712cf9-ac1c-40b2-9861-0df4228a83f5.selectorLabels" . | nindent 6 }}
