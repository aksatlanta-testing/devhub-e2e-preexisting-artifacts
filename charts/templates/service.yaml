apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo56d4f6b1-8967-4909-90ab-07159f1d764d.fullname" . }}
  labels:
    {{- include "go-echo56d4f6b1-8967-4909-90ab-07159f1d764d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo56d4f6b1-8967-4909-90ab-07159f1d764d.selectorLabels" . | nindent 6 }}
