apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a885720-c119-45b5-a5a3-58504acc3ef9.fullname" . }}
  labels:
    {{- include "go-echo0a885720-c119-45b5-a5a3-58504acc3ef9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a885720-c119-45b5-a5a3-58504acc3ef9.selectorLabels" . | nindent 6 }}
