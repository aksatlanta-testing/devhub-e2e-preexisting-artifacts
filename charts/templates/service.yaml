apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f48c75c-06c9-409d-8732-735bb634c05a.fullname" . }}
  labels:
    {{- include "go-echo9f48c75c-06c9-409d-8732-735bb634c05a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f48c75c-06c9-409d-8732-735bb634c05a.selectorLabels" . | nindent 6 }}
