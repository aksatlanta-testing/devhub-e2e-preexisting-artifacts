apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d11da97-885e-4b4b-b4b6-7bf526c16081.fullname" . }}
  labels:
    {{- include "go-echo6d11da97-885e-4b4b-b4b6-7bf526c16081.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d11da97-885e-4b4b-b4b6-7bf526c16081.selectorLabels" . | nindent 6 }}
