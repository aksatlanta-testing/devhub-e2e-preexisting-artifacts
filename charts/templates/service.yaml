apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3805ebe-8ffd-4db2-bad7-2e0ff4290dd5.fullname" . }}
  labels:
    {{- include "go-echoa3805ebe-8ffd-4db2-bad7-2e0ff4290dd5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3805ebe-8ffd-4db2-bad7-2e0ff4290dd5.selectorLabels" . | nindent 6 }}
