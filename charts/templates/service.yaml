apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob56e2c57-1c72-4aed-b801-63e1bd4f0b07.fullname" . }}
  labels:
    {{- include "go-echob56e2c57-1c72-4aed-b801-63e1bd4f0b07.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob56e2c57-1c72-4aed-b801-63e1bd4f0b07.selectorLabels" . | nindent 6 }}
