apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo752dad10-17a2-4dd7-8696-5d6bdf2a6675.fullname" . }}
  labels:
    {{- include "go-echo752dad10-17a2-4dd7-8696-5d6bdf2a6675.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo752dad10-17a2-4dd7-8696-5d6bdf2a6675.selectorLabels" . | nindent 6 }}
