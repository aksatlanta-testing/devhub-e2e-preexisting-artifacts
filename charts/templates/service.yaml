apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeaa9da63-9670-4b79-ad96-cd51ed476927.fullname" . }}
  labels:
    {{- include "go-echoeaa9da63-9670-4b79-ad96-cd51ed476927.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeaa9da63-9670-4b79-ad96-cd51ed476927.selectorLabels" . | nindent 6 }}
