apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57691580-8664-40c0-bb87-9d45fad8e42d.fullname" . }}
  labels:
    {{- include "go-echo57691580-8664-40c0-bb87-9d45fad8e42d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57691580-8664-40c0-bb87-9d45fad8e42d.selectorLabels" . | nindent 6 }}
