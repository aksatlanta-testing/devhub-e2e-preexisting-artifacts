apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf5a84a1-af3a-4e9c-b760-9e6f62010950.fullname" . }}
  labels:
    {{- include "go-echodf5a84a1-af3a-4e9c-b760-9e6f62010950.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf5a84a1-af3a-4e9c-b760-9e6f62010950.selectorLabels" . | nindent 6 }}
