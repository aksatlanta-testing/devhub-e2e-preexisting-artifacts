apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo758a3fd5-a8ac-490c-82f7-edce6b85ac48.fullname" . }}
  labels:
    {{- include "go-echo758a3fd5-a8ac-490c-82f7-edce6b85ac48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo758a3fd5-a8ac-490c-82f7-edce6b85ac48.selectorLabels" . | nindent 6 }}
