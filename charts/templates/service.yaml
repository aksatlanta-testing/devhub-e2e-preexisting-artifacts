apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35326106-d017-4b84-b180-c1a962430305.fullname" . }}
  labels:
    {{- include "go-echo35326106-d017-4b84-b180-c1a962430305.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35326106-d017-4b84-b180-c1a962430305.selectorLabels" . | nindent 6 }}
