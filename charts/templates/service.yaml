apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd080550-aa9b-4730-a8fe-1c1d9e0bc072.fullname" . }}
  labels:
    {{- include "go-echodd080550-aa9b-4730-a8fe-1c1d9e0bc072.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd080550-aa9b-4730-a8fe-1c1d9e0bc072.selectorLabels" . | nindent 6 }}
