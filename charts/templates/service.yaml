apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00b32c48-a883-4004-93c9-f71724a1020d.fullname" . }}
  labels:
    {{- include "go-echo00b32c48-a883-4004-93c9-f71724a1020d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
