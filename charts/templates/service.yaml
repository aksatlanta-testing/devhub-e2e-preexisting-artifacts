apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59ab86b1-4d93-4c72-bb20-12d5972b346f.fullname" . }}
  labels:
    {{- include "go-echo59ab86b1-4d93-4c72-bb20-12d5972b346f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59ab86b1-4d93-4c72-bb20-12d5972b346f.selectorLabels" . | nindent 6 }}
