apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfe39e95-2a5a-4c23-bee2-ccad7d85d3dc.fullname" . }}
  labels:
    {{- include "go-echodfe39e95-2a5a-4c23-bee2-ccad7d85d3dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfe39e95-2a5a-4c23-bee2-ccad7d85d3dc.selectorLabels" . | nindent 6 }}
