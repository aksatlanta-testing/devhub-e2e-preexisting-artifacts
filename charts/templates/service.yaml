apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo616db193-d852-494c-a5da-748c5d86dce3.fullname" . }}
  labels:
    {{- include "go-echo616db193-d852-494c-a5da-748c5d86dce3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo616db193-d852-494c-a5da-748c5d86dce3.selectorLabels" . | nindent 6 }}
