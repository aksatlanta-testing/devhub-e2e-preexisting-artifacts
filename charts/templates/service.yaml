apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo098a13d8-d062-4d69-ab54-89fb1983e829.fullname" . }}
  labels:
    {{- include "go-echo098a13d8-d062-4d69-ab54-89fb1983e829.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo098a13d8-d062-4d69-ab54-89fb1983e829.selectorLabels" . | nindent 6 }}
