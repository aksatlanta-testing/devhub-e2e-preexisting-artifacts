apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd9e04c1-3c87-4ab0-a6e6-aaa6fdbb567f.fullname" . }}
  labels:
    {{- include "go-echofd9e04c1-3c87-4ab0-a6e6-aaa6fdbb567f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd9e04c1-3c87-4ab0-a6e6-aaa6fdbb567f.selectorLabels" . | nindent 6 }}
