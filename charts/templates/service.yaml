apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe9c3da9-cc61-4298-95a4-2c2194eb74e9.fullname" . }}
  labels:
    {{- include "go-echofe9c3da9-cc61-4298-95a4-2c2194eb74e9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe9c3da9-cc61-4298-95a4-2c2194eb74e9.selectorLabels" . | nindent 6 }}
