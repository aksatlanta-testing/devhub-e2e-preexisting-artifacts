apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2fd33043-92c4-448d-b572-93009d3902d3.fullname" . }}
  labels:
    {{- include "go-echo2fd33043-92c4-448d-b572-93009d3902d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2fd33043-92c4-448d-b572-93009d3902d3.selectorLabels" . | nindent 6 }}
