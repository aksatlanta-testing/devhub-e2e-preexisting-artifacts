apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee40c01c-382f-4583-ba49-eb6a8e7dc9c9.fullname" . }}
  labels:
    {{- include "go-echoee40c01c-382f-4583-ba49-eb6a8e7dc9c9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee40c01c-382f-4583-ba49-eb6a8e7dc9c9.selectorLabels" . | nindent 6 }}
