apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00848e29-8dd0-4dbe-babe-3e562f50779f.fullname" . }}
  labels:
    {{- include "go-echo00848e29-8dd0-4dbe-babe-3e562f50779f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00848e29-8dd0-4dbe-babe-3e562f50779f.selectorLabels" . | nindent 6 }}
