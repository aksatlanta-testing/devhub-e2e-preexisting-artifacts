apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoddbcd65c-047b-44f2-bfd1-e4d6f07aee6a.fullname" . }}
  labels:
    {{- include "go-echoddbcd65c-047b-44f2-bfd1-e4d6f07aee6a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoddbcd65c-047b-44f2-bfd1-e4d6f07aee6a.selectorLabels" . | nindent 6 }}
