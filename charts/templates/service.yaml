apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff6e74d3-afde-4309-9533-1f3c23de29cf.fullname" . }}
  labels:
    {{- include "go-echoff6e74d3-afde-4309-9533-1f3c23de29cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff6e74d3-afde-4309-9533-1f3c23de29cf.selectorLabels" . | nindent 6 }}
