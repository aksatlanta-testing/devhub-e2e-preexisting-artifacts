apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3ec155a-11e3-4112-83dd-98d15d23ada9.fullname" . }}
  labels:
    {{- include "go-echoa3ec155a-11e3-4112-83dd-98d15d23ada9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3ec155a-11e3-4112-83dd-98d15d23ada9.selectorLabels" . | nindent 6 }}
