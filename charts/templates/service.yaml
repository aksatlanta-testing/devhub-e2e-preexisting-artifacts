apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a2e913f-d3e4-488d-b5b7-fef00a3157a5.fullname" . }}
  labels:
    {{- include "go-echo2a2e913f-d3e4-488d-b5b7-fef00a3157a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a2e913f-d3e4-488d-b5b7-fef00a3157a5.selectorLabels" . | nindent 6 }}
