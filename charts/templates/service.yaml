apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50a5ebe6-7d9c-4226-afee-c816b11d5d42.fullname" . }}
  labels:
    {{- include "go-echo50a5ebe6-7d9c-4226-afee-c816b11d5d42.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50a5ebe6-7d9c-4226-afee-c816b11d5d42.selectorLabels" . | nindent 6 }}
