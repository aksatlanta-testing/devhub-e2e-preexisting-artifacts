apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d0c21ed-e024-445b-a860-7e50926ff6b9.fullname" . }}
  labels:
    {{- include "go-echo1d0c21ed-e024-445b-a860-7e50926ff6b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d0c21ed-e024-445b-a860-7e50926ff6b9.selectorLabels" . | nindent 6 }}
