apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8db8e76b-1137-408b-bd30-9d39f88a37c7.fullname" . }}
  labels:
    {{- include "go-echo8db8e76b-1137-408b-bd30-9d39f88a37c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8db8e76b-1137-408b-bd30-9d39f88a37c7.selectorLabels" . | nindent 6 }}
