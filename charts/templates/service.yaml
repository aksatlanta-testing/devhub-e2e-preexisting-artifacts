apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe599bff3-d798-480f-b7d0-0fd51cd89cb4.fullname" . }}
  labels:
    {{- include "go-echoe599bff3-d798-480f-b7d0-0fd51cd89cb4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe599bff3-d798-480f-b7d0-0fd51cd89cb4.selectorLabels" . | nindent 6 }}
