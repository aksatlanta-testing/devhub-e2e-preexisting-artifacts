apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33fcb792-208f-47f4-88ff-c9f944e3f0ca.fullname" . }}
  labels:
    {{- include "go-echo33fcb792-208f-47f4-88ff-c9f944e3f0ca.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33fcb792-208f-47f4-88ff-c9f944e3f0ca.selectorLabels" . | nindent 6 }}
