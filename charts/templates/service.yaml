apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf1a46e3-afd0-4553-ab3f-80012ee809ef.fullname" . }}
  labels:
    {{- include "go-echocf1a46e3-afd0-4553-ab3f-80012ee809ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf1a46e3-afd0-4553-ab3f-80012ee809ef.selectorLabels" . | nindent 6 }}
