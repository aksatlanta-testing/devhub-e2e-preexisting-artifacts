apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod224709b-0b46-42d4-95da-067d59dc21a4.fullname" . }}
  labels:
    {{- include "go-echod224709b-0b46-42d4-95da-067d59dc21a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod224709b-0b46-42d4-95da-067d59dc21a4.selectorLabels" . | nindent 6 }}
