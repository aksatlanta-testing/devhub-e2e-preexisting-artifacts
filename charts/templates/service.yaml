apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1d94bf2-db0b-4386-bd15-9be4055ff403.fullname" . }}
  labels:
    {{- include "go-echoa1d94bf2-db0b-4386-bd15-9be4055ff403.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1d94bf2-db0b-4386-bd15-9be4055ff403.selectorLabels" . | nindent 6 }}
