apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5022816-fc5b-4774-bbf3-bb074ea4bc77.fullname" . }}
  labels:
    {{- include "go-echoc5022816-fc5b-4774-bbf3-bb074ea4bc77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5022816-fc5b-4774-bbf3-bb074ea4bc77.selectorLabels" . | nindent 6 }}
