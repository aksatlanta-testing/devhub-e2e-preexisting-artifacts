apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob471cdb4-85ae-4a3a-b5d7-42172b2a5456.fullname" . }}
  labels:
    {{- include "go-echob471cdb4-85ae-4a3a-b5d7-42172b2a5456.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob471cdb4-85ae-4a3a-b5d7-42172b2a5456.selectorLabels" . | nindent 6 }}
