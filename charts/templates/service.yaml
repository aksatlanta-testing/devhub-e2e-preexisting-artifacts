apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7baea04-65c0-4dc6-a9ed-e2a9a76fba80.fullname" . }}
  labels:
    {{- include "go-echoa7baea04-65c0-4dc6-a9ed-e2a9a76fba80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7baea04-65c0-4dc6-a9ed-e2a9a76fba80.selectorLabels" . | nindent 6 }}
