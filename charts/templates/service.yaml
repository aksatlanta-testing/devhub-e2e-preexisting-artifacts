apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54544f97-d718-4e3f-901c-e0f137f2d01e.fullname" . }}
  labels:
    {{- include "go-echo54544f97-d718-4e3f-901c-e0f137f2d01e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54544f97-d718-4e3f-901c-e0f137f2d01e.selectorLabels" . | nindent 6 }}
