apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69ef188b-050e-4124-80cb-58ed6c24550c.fullname" . }}
  labels:
    {{- include "go-echo69ef188b-050e-4124-80cb-58ed6c24550c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69ef188b-050e-4124-80cb-58ed6c24550c.selectorLabels" . | nindent 6 }}
