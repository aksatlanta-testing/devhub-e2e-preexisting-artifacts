apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeb91fec7-5829-48aa-ac6b-f6cf5c39fb11.fullname" . }}
  labels:
    {{- include "go-echoeb91fec7-5829-48aa-ac6b-f6cf5c39fb11.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeb91fec7-5829-48aa-ac6b-f6cf5c39fb11.selectorLabels" . | nindent 6 }}
