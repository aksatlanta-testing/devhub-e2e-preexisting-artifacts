apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2fdc049a-fc8f-41c8-b2fb-94d9761f4f76.fullname" . }}
  labels:
    {{- include "go-echo2fdc049a-fc8f-41c8-b2fb-94d9761f4f76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2fdc049a-fc8f-41c8-b2fb-94d9761f4f76.selectorLabels" . | nindent 6 }}
