apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22c83f0c-5a7d-4486-87d8-55dc65fe90ec.fullname" . }}
  labels:
    {{- include "go-echo22c83f0c-5a7d-4486-87d8-55dc65fe90ec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22c83f0c-5a7d-4486-87d8-55dc65fe90ec.selectorLabels" . | nindent 6 }}
