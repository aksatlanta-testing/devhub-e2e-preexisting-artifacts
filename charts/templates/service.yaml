apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa572174-fb3b-4aff-9019-879b773f0a52.fullname" . }}
  labels:
    {{- include "go-echoaa572174-fb3b-4aff-9019-879b773f0a52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa572174-fb3b-4aff-9019-879b773f0a52.selectorLabels" . | nindent 6 }}
