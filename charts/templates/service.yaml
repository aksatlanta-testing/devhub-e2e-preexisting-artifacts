apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod80802d5-6402-4bdb-a0f9-c923736c9c51.fullname" . }}
  labels:
    {{- include "go-echod80802d5-6402-4bdb-a0f9-c923736c9c51.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod80802d5-6402-4bdb-a0f9-c923736c9c51.selectorLabels" . | nindent 6 }}
