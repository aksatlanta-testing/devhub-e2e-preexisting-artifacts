apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c52cb1a-3a40-41cf-99a6-1c7a723a0989.fullname" . }}
  labels:
    {{- include "go-echo8c52cb1a-3a40-41cf-99a6-1c7a723a0989.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c52cb1a-3a40-41cf-99a6-1c7a723a0989.selectorLabels" . | nindent 6 }}
