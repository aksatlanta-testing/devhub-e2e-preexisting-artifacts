apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c2c2360-c94e-4166-8a85-2666e440fa8a.fullname" . }}
  labels:
    {{- include "go-echo1c2c2360-c94e-4166-8a85-2666e440fa8a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c2c2360-c94e-4166-8a85-2666e440fa8a.selectorLabels" . | nindent 6 }}
