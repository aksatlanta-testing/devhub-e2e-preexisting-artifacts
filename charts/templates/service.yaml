apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33e26d6d-af42-4f19-bb39-c9597d898f61.fullname" . }}
  labels:
    {{- include "go-echo33e26d6d-af42-4f19-bb39-c9597d898f61.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33e26d6d-af42-4f19-bb39-c9597d898f61.selectorLabels" . | nindent 6 }}
