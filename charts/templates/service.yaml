apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c64a751-28a3-44a6-8dd7-c8f9a94511ee.fullname" . }}
  labels:
    {{- include "go-echo2c64a751-28a3-44a6-8dd7-c8f9a94511ee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c64a751-28a3-44a6-8dd7-c8f9a94511ee.selectorLabels" . | nindent 6 }}
