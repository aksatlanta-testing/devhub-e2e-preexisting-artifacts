apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo004f7342-95f4-4fba-a8d8-165fed53ffae.fullname" . }}
  labels:
    {{- include "go-echo004f7342-95f4-4fba-a8d8-165fed53ffae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo004f7342-95f4-4fba-a8d8-165fed53ffae.selectorLabels" . | nindent 6 }}
