apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52c7b0d5-5fe0-4872-b54c-f688c5dfb66c.fullname" . }}
  labels:
    {{- include "go-echo52c7b0d5-5fe0-4872-b54c-f688c5dfb66c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52c7b0d5-5fe0-4872-b54c-f688c5dfb66c.selectorLabels" . | nindent 6 }}
