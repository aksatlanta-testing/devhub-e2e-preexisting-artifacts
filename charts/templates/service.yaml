apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8846ec4-9069-4435-b1c6-96fd3e160a07.fullname" . }}
  labels:
    {{- include "go-echoe8846ec4-9069-4435-b1c6-96fd3e160a07.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8846ec4-9069-4435-b1c6-96fd3e160a07.selectorLabels" . | nindent 6 }}
