apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob07cc7a9-4504-46b0-b083-dcf0f877b8bb.fullname" . }}
  labels:
    {{- include "go-echob07cc7a9-4504-46b0-b083-dcf0f877b8bb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob07cc7a9-4504-46b0-b083-dcf0f877b8bb.selectorLabels" . | nindent 6 }}
