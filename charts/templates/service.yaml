apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fb628e8-b95e-48b8-9940-cfcd3e3b55e4.fullname" . }}
  labels:
    {{- include "go-echo8fb628e8-b95e-48b8-9940-cfcd3e3b55e4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fb628e8-b95e-48b8-9940-cfcd3e3b55e4.selectorLabels" . | nindent 6 }}
