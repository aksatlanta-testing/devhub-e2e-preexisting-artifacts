apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo813a96e7-f946-41a8-b52e-994d99364d65.fullname" . }}
  labels:
    {{- include "go-echo813a96e7-f946-41a8-b52e-994d99364d65.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo813a96e7-f946-41a8-b52e-994d99364d65.selectorLabels" . | nindent 6 }}
