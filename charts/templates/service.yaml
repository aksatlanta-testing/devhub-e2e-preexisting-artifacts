apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5770d14e-c7ee-4ede-b62d-1491fdfd44fe.fullname" . }}
  labels:
    {{- include "go-echo5770d14e-c7ee-4ede-b62d-1491fdfd44fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5770d14e-c7ee-4ede-b62d-1491fdfd44fe.selectorLabels" . | nindent 6 }}
