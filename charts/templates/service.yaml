apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo401406ef-1430-444c-80ce-aabdbecb0d07.fullname" . }}
  labels:
    {{- include "go-echo401406ef-1430-444c-80ce-aabdbecb0d07.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo401406ef-1430-444c-80ce-aabdbecb0d07.selectorLabels" . | nindent 6 }}
