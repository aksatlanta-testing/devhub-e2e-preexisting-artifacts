apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c465402-6fe8-4faf-a86a-1bfd951357de.fullname" . }}
  labels:
    {{- include "go-echo7c465402-6fe8-4faf-a86a-1bfd951357de.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c465402-6fe8-4faf-a86a-1bfd951357de.selectorLabels" . | nindent 6 }}
