apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e4a7b96-e4e1-4db1-bbf0-f7f46ca77781.fullname" . }}
  labels:
    {{- include "go-echo9e4a7b96-e4e1-4db1-bbf0-f7f46ca77781.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e4a7b96-e4e1-4db1-bbf0-f7f46ca77781.selectorLabels" . | nindent 6 }}
