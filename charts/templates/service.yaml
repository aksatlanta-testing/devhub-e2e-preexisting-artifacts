apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae415d82-066e-4971-a8f9-6f6e6ca71d57.fullname" . }}
  labels:
    {{- include "go-echoae415d82-066e-4971-a8f9-6f6e6ca71d57.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae415d82-066e-4971-a8f9-6f6e6ca71d57.selectorLabels" . | nindent 6 }}
