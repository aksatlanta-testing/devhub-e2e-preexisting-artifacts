apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc168ff46-da4b-4809-b820-4945858422d4.fullname" . }}
  labels:
    {{- include "go-echoc168ff46-da4b-4809-b820-4945858422d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc168ff46-da4b-4809-b820-4945858422d4.selectorLabels" . | nindent 6 }}
