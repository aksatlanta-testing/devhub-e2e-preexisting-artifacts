apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2911193-b415-4b6d-aa34-125c2eb7aae8.fullname" . }}
  labels:
    {{- include "go-echoe2911193-b415-4b6d-aa34-125c2eb7aae8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2911193-b415-4b6d-aa34-125c2eb7aae8.selectorLabels" . | nindent 6 }}
