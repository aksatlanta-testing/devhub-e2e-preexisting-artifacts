apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa8d32af-7e52-4f56-89fc-d250af4d5135.fullname" . }}
  labels:
    {{- include "go-echofa8d32af-7e52-4f56-89fc-d250af4d5135.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa8d32af-7e52-4f56-89fc-d250af4d5135.selectorLabels" . | nindent 6 }}
