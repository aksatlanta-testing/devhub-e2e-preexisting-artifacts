apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54215ed4-5dcf-4e5e-8448-fad836c3d923.fullname" . }}
  labels:
    {{- include "go-echo54215ed4-5dcf-4e5e-8448-fad836c3d923.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54215ed4-5dcf-4e5e-8448-fad836c3d923.selectorLabels" . | nindent 6 }}
