apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobcf7f7ea-63a6-41d1-bed8-84aafe81c69b.fullname" . }}
  labels:
    {{- include "go-echobcf7f7ea-63a6-41d1-bed8-84aafe81c69b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobcf7f7ea-63a6-41d1-bed8-84aafe81c69b.selectorLabels" . | nindent 6 }}
