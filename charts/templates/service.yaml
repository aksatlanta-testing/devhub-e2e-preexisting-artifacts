apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7bf9b31-7465-49e7-82a6-fb8be002a4f1.fullname" . }}
  labels:
    {{- include "go-echoe7bf9b31-7465-49e7-82a6-fb8be002a4f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7bf9b31-7465-49e7-82a6-fb8be002a4f1.selectorLabels" . | nindent 6 }}
