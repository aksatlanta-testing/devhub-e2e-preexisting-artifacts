apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdeaab21-53f1-47b3-872e-2c534a9f1552.fullname" . }}
  labels:
    {{- include "go-echobdeaab21-53f1-47b3-872e-2c534a9f1552.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdeaab21-53f1-47b3-872e-2c534a9f1552.selectorLabels" . | nindent 6 }}
