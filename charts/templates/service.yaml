apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3340216-4759-4494-be3f-7addab46112b.fullname" . }}
  labels:
    {{- include "go-echoe3340216-4759-4494-be3f-7addab46112b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3340216-4759-4494-be3f-7addab46112b.selectorLabels" . | nindent 6 }}
