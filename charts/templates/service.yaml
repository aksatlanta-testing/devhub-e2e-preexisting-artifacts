apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67c8ed85-d52f-4c0a-94f7-4e59c4686739.fullname" . }}
  labels:
    {{- include "go-echo67c8ed85-d52f-4c0a-94f7-4e59c4686739.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67c8ed85-d52f-4c0a-94f7-4e59c4686739.selectorLabels" . | nindent 6 }}
