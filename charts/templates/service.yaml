apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf687adf-2c37-42cc-90b2-d89d2a34d722.fullname" . }}
  labels:
    {{- include "go-echodf687adf-2c37-42cc-90b2-d89d2a34d722.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf687adf-2c37-42cc-90b2-d89d2a34d722.selectorLabels" . | nindent 6 }}
