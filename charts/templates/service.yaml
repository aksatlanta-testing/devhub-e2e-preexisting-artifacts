apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0aa6606-3628-41d3-b37c-565e3b0ba400.fullname" . }}
  labels:
    {{- include "go-echod0aa6606-3628-41d3-b37c-565e3b0ba400.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0aa6606-3628-41d3-b37c-565e3b0ba400.selectorLabels" . | nindent 6 }}
