apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ac0de9d-3a54-4e82-92a8-3a4e5643bb03.fullname" . }}
  labels:
    {{- include "go-echo8ac0de9d-3a54-4e82-92a8-3a4e5643bb03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ac0de9d-3a54-4e82-92a8-3a4e5643bb03.selectorLabels" . | nindent 6 }}
