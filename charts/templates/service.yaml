apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d436a79-d785-4012-b709-b28a76c8dfab.fullname" . }}
  labels:
    {{- include "go-echo1d436a79-d785-4012-b709-b28a76c8dfab.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d436a79-d785-4012-b709-b28a76c8dfab.selectorLabels" . | nindent 6 }}
