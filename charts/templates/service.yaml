apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe017a742-2220-45cd-a6b2-3100427b024c.fullname" . }}
  labels:
    {{- include "go-echoe017a742-2220-45cd-a6b2-3100427b024c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe017a742-2220-45cd-a6b2-3100427b024c.selectorLabels" . | nindent 6 }}
