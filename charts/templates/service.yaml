apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71d2fa8f-5521-4caf-a43c-154d676fd525.fullname" . }}
  labels:
    {{- include "go-echo71d2fa8f-5521-4caf-a43c-154d676fd525.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71d2fa8f-5521-4caf-a43c-154d676fd525.selectorLabels" . | nindent 6 }}
