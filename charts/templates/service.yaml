apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d2695fb-954f-4aa0-8c7c-a80ee48bdcea.fullname" . }}
  labels:
    {{- include "go-echo1d2695fb-954f-4aa0-8c7c-a80ee48bdcea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d2695fb-954f-4aa0-8c7c-a80ee48bdcea.selectorLabels" . | nindent 6 }}
