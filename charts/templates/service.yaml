apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d49ede3-b6d2-485d-9dfc-974495416ce0.fullname" . }}
  labels:
    {{- include "go-echo5d49ede3-b6d2-485d-9dfc-974495416ce0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d49ede3-b6d2-485d-9dfc-974495416ce0.selectorLabels" . | nindent 6 }}
