apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3502ac93-1761-46bd-9c18-8c0541fcbf91.fullname" . }}
  labels:
    {{- include "go-echo3502ac93-1761-46bd-9c18-8c0541fcbf91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3502ac93-1761-46bd-9c18-8c0541fcbf91.selectorLabels" . | nindent 6 }}
