apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bfa2d7b-a2e1-466d-8562-9e91222e5832.fullname" . }}
  labels:
    {{- include "go-echo0bfa2d7b-a2e1-466d-8562-9e91222e5832.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bfa2d7b-a2e1-466d-8562-9e91222e5832.selectorLabels" . | nindent 6 }}
