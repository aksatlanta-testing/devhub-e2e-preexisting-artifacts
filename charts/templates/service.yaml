apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e2aa6e6-ebe2-4815-8478-99e403953382.fullname" . }}
  labels:
    {{- include "go-echo8e2aa6e6-ebe2-4815-8478-99e403953382.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e2aa6e6-ebe2-4815-8478-99e403953382.selectorLabels" . | nindent 6 }}
