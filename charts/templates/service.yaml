apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6df32ff4-3e60-4af9-ae6a-dcf3e27c29b5.fullname" . }}
  labels:
    {{- include "go-echo6df32ff4-3e60-4af9-ae6a-dcf3e27c29b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6df32ff4-3e60-4af9-ae6a-dcf3e27c29b5.selectorLabels" . | nindent 6 }}
