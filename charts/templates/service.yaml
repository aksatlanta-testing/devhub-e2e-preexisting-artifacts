apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c02eca5-6042-4e8b-890c-1ff92805896e.fullname" . }}
  labels:
    {{- include "go-echo1c02eca5-6042-4e8b-890c-1ff92805896e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c02eca5-6042-4e8b-890c-1ff92805896e.selectorLabels" . | nindent 6 }}
