apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5492726-3bdf-4f35-97e8-99eced6b6adb.fullname" . }}
  labels:
    {{- include "go-echoe5492726-3bdf-4f35-97e8-99eced6b6adb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5492726-3bdf-4f35-97e8-99eced6b6adb.selectorLabels" . | nindent 6 }}
