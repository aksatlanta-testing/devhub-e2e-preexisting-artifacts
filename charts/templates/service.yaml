apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ee11ebf-9955-41e6-ba59-47fe6d406ba6.fullname" . }}
  labels:
    {{- include "go-echo6ee11ebf-9955-41e6-ba59-47fe6d406ba6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ee11ebf-9955-41e6-ba59-47fe6d406ba6.selectorLabels" . | nindent 6 }}
