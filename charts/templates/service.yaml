apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo525feca4-7d62-461b-8c24-b482c89f95b7.fullname" . }}
  labels:
    {{- include "go-echo525feca4-7d62-461b-8c24-b482c89f95b7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo525feca4-7d62-461b-8c24-b482c89f95b7.selectorLabels" . | nindent 6 }}
