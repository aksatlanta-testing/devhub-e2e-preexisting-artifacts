apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91c430fe-1e20-4307-adbe-7847e259fa76.fullname" . }}
  labels:
    {{- include "go-echo91c430fe-1e20-4307-adbe-7847e259fa76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91c430fe-1e20-4307-adbe-7847e259fa76.selectorLabels" . | nindent 6 }}
