apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocda24194-9dfd-4fd3-850c-4c2440342a2f.fullname" . }}
  labels:
    {{- include "go-echocda24194-9dfd-4fd3-850c-4c2440342a2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocda24194-9dfd-4fd3-850c-4c2440342a2f.selectorLabels" . | nindent 6 }}
