apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo719a461f-005d-412a-82be-d0928b8e76fa.fullname" . }}
  labels:
    {{- include "go-echo719a461f-005d-412a-82be-d0928b8e76fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo719a461f-005d-412a-82be-d0928b8e76fa.selectorLabels" . | nindent 6 }}
