apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7f31799-ceaf-47ce-b658-35386f9abf3a.fullname" . }}
  labels:
    {{- include "go-echoc7f31799-ceaf-47ce-b658-35386f9abf3a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7f31799-ceaf-47ce-b658-35386f9abf3a.selectorLabels" . | nindent 6 }}
