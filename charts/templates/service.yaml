apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3710f6ca-be90-49e6-82bc-e9a104c6dfe8.fullname" . }}
  labels:
    {{- include "go-echo3710f6ca-be90-49e6-82bc-e9a104c6dfe8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3710f6ca-be90-49e6-82bc-e9a104c6dfe8.selectorLabels" . | nindent 6 }}
