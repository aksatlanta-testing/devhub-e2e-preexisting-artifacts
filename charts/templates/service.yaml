apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cd72b5b-2ecd-44b5-9985-58b51fcee874.fullname" . }}
  labels:
    {{- include "go-echo5cd72b5b-2ecd-44b5-9985-58b51fcee874.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cd72b5b-2ecd-44b5-9985-58b51fcee874.selectorLabels" . | nindent 6 }}
