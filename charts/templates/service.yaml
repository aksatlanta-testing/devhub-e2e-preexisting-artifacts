apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f254a3f-dafe-40a6-9f1d-48d2be2043d1.fullname" . }}
  labels:
    {{- include "go-echo9f254a3f-dafe-40a6-9f1d-48d2be2043d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f254a3f-dafe-40a6-9f1d-48d2be2043d1.selectorLabels" . | nindent 6 }}
