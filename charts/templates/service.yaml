apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62a987ea-d6d6-4467-ad1c-2f0035fc0fbc.fullname" . }}
  labels:
    {{- include "go-echo62a987ea-d6d6-4467-ad1c-2f0035fc0fbc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62a987ea-d6d6-4467-ad1c-2f0035fc0fbc.selectorLabels" . | nindent 6 }}
