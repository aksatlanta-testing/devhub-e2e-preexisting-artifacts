apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00c1864b-e7eb-46ad-a060-89680a67c1af.fullname" . }}
  labels:
    {{- include "go-echo00c1864b-e7eb-46ad-a060-89680a67c1af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00c1864b-e7eb-46ad-a060-89680a67c1af.selectorLabels" . | nindent 6 }}
