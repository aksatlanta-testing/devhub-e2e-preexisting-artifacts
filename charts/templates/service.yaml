apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo657cb787-152b-4cb9-8d04-9758fdfc76c6.fullname" . }}
  labels:
    {{- include "go-echo657cb787-152b-4cb9-8d04-9758fdfc76c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo657cb787-152b-4cb9-8d04-9758fdfc76c6.selectorLabels" . | nindent 6 }}
