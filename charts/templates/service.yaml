apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa962bb47-127d-4cfd-b80d-89b877582cc6.fullname" . }}
  labels:
    {{- include "go-echoa962bb47-127d-4cfd-b80d-89b877582cc6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa962bb47-127d-4cfd-b80d-89b877582cc6.selectorLabels" . | nindent 6 }}
