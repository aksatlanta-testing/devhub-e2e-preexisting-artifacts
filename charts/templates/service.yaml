apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19ff4c3c-dc74-4dfb-b4e0-7f61b0a101f2.fullname" . }}
  labels:
    {{- include "go-echo19ff4c3c-dc74-4dfb-b4e0-7f61b0a101f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19ff4c3c-dc74-4dfb-b4e0-7f61b0a101f2.selectorLabels" . | nindent 6 }}
