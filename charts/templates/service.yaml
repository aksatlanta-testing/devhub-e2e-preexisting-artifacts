apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17160c14-8bc0-48f4-9085-b4de4ab8efc8.fullname" . }}
  labels:
    {{- include "go-echo17160c14-8bc0-48f4-9085-b4de4ab8efc8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17160c14-8bc0-48f4-9085-b4de4ab8efc8.selectorLabels" . | nindent 6 }}
