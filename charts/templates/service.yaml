apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e3747a8-a916-4089-a687-b25bda11c327.fullname" . }}
  labels:
    {{- include "go-echo5e3747a8-a916-4089-a687-b25bda11c327.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e3747a8-a916-4089-a687-b25bda11c327.selectorLabels" . | nindent 6 }}
