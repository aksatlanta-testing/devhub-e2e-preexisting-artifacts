apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7584edce-1bf9-43e0-aed7-f57dca2dda57.fullname" . }}
  labels:
    {{- include "go-echo7584edce-1bf9-43e0-aed7-f57dca2dda57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7584edce-1bf9-43e0-aed7-f57dca2dda57.selectorLabels" . | nindent 6 }}
