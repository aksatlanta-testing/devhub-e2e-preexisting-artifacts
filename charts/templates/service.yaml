apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo558fd2dd-9542-44ff-9386-97c8c8a30aa8.fullname" . }}
  labels:
    {{- include "go-echo558fd2dd-9542-44ff-9386-97c8c8a30aa8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo558fd2dd-9542-44ff-9386-97c8c8a30aa8.selectorLabels" . | nindent 6 }}
