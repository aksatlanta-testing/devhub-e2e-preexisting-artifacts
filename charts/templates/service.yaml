apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45e81c6f-ba77-46f8-ab8f-d2c32d9f0592.fullname" . }}
  labels:
    {{- include "go-echo45e81c6f-ba77-46f8-ab8f-d2c32d9f0592.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45e81c6f-ba77-46f8-ab8f-d2c32d9f0592.selectorLabels" . | nindent 6 }}
