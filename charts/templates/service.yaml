apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc23c3ef6-3235-4c7d-a06f-ba1b4ea64c89.fullname" . }}
  labels:
    {{- include "go-echoc23c3ef6-3235-4c7d-a06f-ba1b4ea64c89.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc23c3ef6-3235-4c7d-a06f-ba1b4ea64c89.selectorLabels" . | nindent 6 }}
