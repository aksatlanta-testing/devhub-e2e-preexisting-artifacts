apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8192b61c-3cd0-4c2c-8bbf-23647ac3d4b9.fullname" . }}
  labels:
    {{- include "go-echo8192b61c-3cd0-4c2c-8bbf-23647ac3d4b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8192b61c-3cd0-4c2c-8bbf-23647ac3d4b9.selectorLabels" . | nindent 6 }}
