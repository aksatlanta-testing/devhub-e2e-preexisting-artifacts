apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod66f185d-1677-44dd-a8a5-7758aff79a2a.fullname" . }}
  labels:
    {{- include "go-echod66f185d-1677-44dd-a8a5-7758aff79a2a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod66f185d-1677-44dd-a8a5-7758aff79a2a.selectorLabels" . | nindent 6 }}
