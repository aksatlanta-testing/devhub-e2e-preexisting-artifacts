apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocddf97ce-5bc2-495f-8a01-01b0f8576441.fullname" . }}
  labels:
    {{- include "go-echocddf97ce-5bc2-495f-8a01-01b0f8576441.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocddf97ce-5bc2-495f-8a01-01b0f8576441.selectorLabels" . | nindent 6 }}
