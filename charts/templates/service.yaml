apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d90dc06-82c8-438f-8727-aca08e172dc8.fullname" . }}
  labels:
    {{- include "go-echo4d90dc06-82c8-438f-8727-aca08e172dc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d90dc06-82c8-438f-8727-aca08e172dc8.selectorLabels" . | nindent 6 }}
