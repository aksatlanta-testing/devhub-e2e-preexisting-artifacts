apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36af3aef-2f15-4830-867b-13b5d3f71edc.fullname" . }}
  labels:
    {{- include "go-echo36af3aef-2f15-4830-867b-13b5d3f71edc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36af3aef-2f15-4830-867b-13b5d3f71edc.selectorLabels" . | nindent 6 }}
