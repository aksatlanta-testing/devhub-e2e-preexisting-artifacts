apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61747172-48fb-48ea-a14e-58929f4a1396.fullname" . }}
  labels:
    {{- include "go-echo61747172-48fb-48ea-a14e-58929f4a1396.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61747172-48fb-48ea-a14e-58929f4a1396.selectorLabels" . | nindent 6 }}
