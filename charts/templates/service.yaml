apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob157974d-172e-468a-9dc6-97e46eb890d5.fullname" . }}
  labels:
    {{- include "go-echob157974d-172e-468a-9dc6-97e46eb890d5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob157974d-172e-468a-9dc6-97e46eb890d5.selectorLabels" . | nindent 6 }}
