apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c929040-aa0b-4060-b577-f57cdfd726c7.fullname" . }}
  labels:
    {{- include "go-echo2c929040-aa0b-4060-b577-f57cdfd726c7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c929040-aa0b-4060-b577-f57cdfd726c7.selectorLabels" . | nindent 6 }}
