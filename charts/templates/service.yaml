apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob360aa72-4725-43e8-842c-2a01b1b0f02d.fullname" . }}
  labels:
    {{- include "go-echob360aa72-4725-43e8-842c-2a01b1b0f02d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob360aa72-4725-43e8-842c-2a01b1b0f02d.selectorLabels" . | nindent 6 }}
