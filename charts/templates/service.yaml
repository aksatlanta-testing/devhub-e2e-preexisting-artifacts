apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24980c79-71b1-44cc-b3e8-42df164359bc.fullname" . }}
  labels:
    {{- include "go-echo24980c79-71b1-44cc-b3e8-42df164359bc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24980c79-71b1-44cc-b3e8-42df164359bc.selectorLabels" . | nindent 6 }}
