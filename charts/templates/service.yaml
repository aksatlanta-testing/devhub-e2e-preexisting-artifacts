apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b8b947f-ca1d-47ca-9d7a-de15ec3de008.fullname" . }}
  labels:
    {{- include "go-echo6b8b947f-ca1d-47ca-9d7a-de15ec3de008.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b8b947f-ca1d-47ca-9d7a-de15ec3de008.selectorLabels" . | nindent 6 }}
