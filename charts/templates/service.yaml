apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e99cde1-e75e-42f2-8cbc-a8dd21aa027d.fullname" . }}
  labels:
    {{- include "go-echo5e99cde1-e75e-42f2-8cbc-a8dd21aa027d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e99cde1-e75e-42f2-8cbc-a8dd21aa027d.selectorLabels" . | nindent 6 }}
