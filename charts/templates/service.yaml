apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9149d1a-efa3-4b2c-a75d-0476dfc84fac.fullname" . }}
  labels:
    {{- include "go-echoc9149d1a-efa3-4b2c-a75d-0476dfc84fac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9149d1a-efa3-4b2c-a75d-0476dfc84fac.selectorLabels" . | nindent 6 }}
