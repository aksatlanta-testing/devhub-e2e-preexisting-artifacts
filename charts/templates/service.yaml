apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob63cc7e5-c5b3-4e57-9369-adeecd7d934d.fullname" . }}
  labels:
    {{- include "go-echob63cc7e5-c5b3-4e57-9369-adeecd7d934d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob63cc7e5-c5b3-4e57-9369-adeecd7d934d.selectorLabels" . | nindent 6 }}
