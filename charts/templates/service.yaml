apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8492b32-bfb2-4db5-bfe5-916e7d404664.fullname" . }}
  labels:
    {{- include "go-echod8492b32-bfb2-4db5-bfe5-916e7d404664.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8492b32-bfb2-4db5-bfe5-916e7d404664.selectorLabels" . | nindent 6 }}
