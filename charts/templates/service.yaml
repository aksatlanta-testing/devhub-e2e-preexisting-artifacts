apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf5c15c8-97a3-4792-b76e-f6a16efebec7.fullname" . }}
  labels:
    {{- include "go-echodf5c15c8-97a3-4792-b76e-f6a16efebec7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf5c15c8-97a3-4792-b76e-f6a16efebec7.selectorLabels" . | nindent 6 }}
