apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d8d311d-132c-41ac-8915-1b6e72d4cb9c.fullname" . }}
  labels:
    {{- include "go-echo8d8d311d-132c-41ac-8915-1b6e72d4cb9c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d8d311d-132c-41ac-8915-1b6e72d4cb9c.selectorLabels" . | nindent 6 }}
