apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9f37a51-91ce-4781-81a6-ad78de8385fe.fullname" . }}
  labels:
    {{- include "go-echod9f37a51-91ce-4781-81a6-ad78de8385fe.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9f37a51-91ce-4781-81a6-ad78de8385fe.selectorLabels" . | nindent 6 }}
