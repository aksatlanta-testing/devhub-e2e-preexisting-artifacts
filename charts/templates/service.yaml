apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe097f875-f049-479e-bc3c-3c35fcfb9365.fullname" . }}
  labels:
    {{- include "go-echoe097f875-f049-479e-bc3c-3c35fcfb9365.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe097f875-f049-479e-bc3c-3c35fcfb9365.selectorLabels" . | nindent 6 }}
