apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo080e63a0-2811-4f41-93a8-24f9b33ef634.fullname" . }}
  labels:
    {{- include "go-echo080e63a0-2811-4f41-93a8-24f9b33ef634.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo080e63a0-2811-4f41-93a8-24f9b33ef634.selectorLabels" . | nindent 6 }}
