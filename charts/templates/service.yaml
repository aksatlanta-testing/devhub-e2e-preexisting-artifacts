apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c564ead-c6db-4e59-a907-12aace853ec3.fullname" . }}
  labels:
    {{- include "go-echo4c564ead-c6db-4e59-a907-12aace853ec3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c564ead-c6db-4e59-a907-12aace853ec3.selectorLabels" . | nindent 6 }}
