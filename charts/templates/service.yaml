apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8e04493-4e53-4b65-befe-449a8aa6494b.fullname" . }}
  labels:
    {{- include "go-echod8e04493-4e53-4b65-befe-449a8aa6494b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8e04493-4e53-4b65-befe-449a8aa6494b.selectorLabels" . | nindent 6 }}
