apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc51b9623-04bc-455c-9e0e-d0cf4892db83.fullname" . }}
  labels:
    {{- include "go-echoc51b9623-04bc-455c-9e0e-d0cf4892db83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc51b9623-04bc-455c-9e0e-d0cf4892db83.selectorLabels" . | nindent 6 }}
