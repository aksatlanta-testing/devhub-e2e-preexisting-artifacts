apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod51e33d1-6260-4138-81a8-2c1ff9489232.fullname" . }}
  labels:
    {{- include "go-echod51e33d1-6260-4138-81a8-2c1ff9489232.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod51e33d1-6260-4138-81a8-2c1ff9489232.selectorLabels" . | nindent 6 }}
