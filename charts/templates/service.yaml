apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo705d1c4e-9a8c-4582-9b7b-21a860c46194.fullname" . }}
  labels:
    {{- include "go-echo705d1c4e-9a8c-4582-9b7b-21a860c46194.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo705d1c4e-9a8c-4582-9b7b-21a860c46194.selectorLabels" . | nindent 6 }}
