apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa095c66d-9657-4e71-8768-d073c7632753.fullname" . }}
  labels:
    {{- include "go-echoa095c66d-9657-4e71-8768-d073c7632753.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa095c66d-9657-4e71-8768-d073c7632753.selectorLabels" . | nindent 6 }}
