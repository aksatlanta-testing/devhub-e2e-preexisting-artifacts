apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof86bf5b6-6413-4087-9fc7-d1cdd7300004.fullname" . }}
  labels:
    {{- include "go-echof86bf5b6-6413-4087-9fc7-d1cdd7300004.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof86bf5b6-6413-4087-9fc7-d1cdd7300004.selectorLabels" . | nindent 6 }}
