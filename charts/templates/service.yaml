apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab160cf1-4628-47f7-8153-37e58f3dc0f1.fullname" . }}
  labels:
    {{- include "go-echoab160cf1-4628-47f7-8153-37e58f3dc0f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab160cf1-4628-47f7-8153-37e58f3dc0f1.selectorLabels" . | nindent 6 }}
