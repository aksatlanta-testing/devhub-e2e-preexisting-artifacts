apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacf4907f-66b9-4cb6-9d1a-765677734740.fullname" . }}
  labels:
    {{- include "go-echoacf4907f-66b9-4cb6-9d1a-765677734740.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacf4907f-66b9-4cb6-9d1a-765677734740.selectorLabels" . | nindent 6 }}
