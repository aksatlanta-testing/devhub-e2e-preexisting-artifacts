apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof827e670-4396-4078-a413-04a4ecec8ee1.fullname" . }}
  labels:
    {{- include "go-echof827e670-4396-4078-a413-04a4ecec8ee1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof827e670-4396-4078-a413-04a4ecec8ee1.selectorLabels" . | nindent 6 }}
