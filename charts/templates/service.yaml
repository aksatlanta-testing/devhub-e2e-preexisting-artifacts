apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50474a72-3fe9-4f5e-9c7b-5d0fe03c640d.fullname" . }}
  labels:
    {{- include "go-echo50474a72-3fe9-4f5e-9c7b-5d0fe03c640d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50474a72-3fe9-4f5e-9c7b-5d0fe03c640d.selectorLabels" . | nindent 6 }}
