apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a45fd44-626f-4151-b3f3-34f461e7d81f.fullname" . }}
  labels:
    {{- include "go-echo1a45fd44-626f-4151-b3f3-34f461e7d81f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a45fd44-626f-4151-b3f3-34f461e7d81f.selectorLabels" . | nindent 6 }}
