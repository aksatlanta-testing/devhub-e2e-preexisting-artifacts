apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo466eeff9-14a6-4dea-a391-4f53d83b15e1.fullname" . }}
  labels:
    {{- include "go-echo466eeff9-14a6-4dea-a391-4f53d83b15e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo466eeff9-14a6-4dea-a391-4f53d83b15e1.selectorLabels" . | nindent 6 }}
