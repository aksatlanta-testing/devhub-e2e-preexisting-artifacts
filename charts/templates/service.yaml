apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo482f964d-6f41-42eb-b7fe-e7dcff5aa0e8.fullname" . }}
  labels:
    {{- include "go-echo482f964d-6f41-42eb-b7fe-e7dcff5aa0e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo482f964d-6f41-42eb-b7fe-e7dcff5aa0e8.selectorLabels" . | nindent 6 }}
