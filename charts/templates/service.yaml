apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafc461d2-6483-43b0-89fa-60e5b4897fe8.fullname" . }}
  labels:
    {{- include "go-echoafc461d2-6483-43b0-89fa-60e5b4897fe8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafc461d2-6483-43b0-89fa-60e5b4897fe8.selectorLabels" . | nindent 6 }}
