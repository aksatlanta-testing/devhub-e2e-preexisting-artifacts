apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfb7dbcf-5861-4a59-91d7-9b9cef9dd68a.fullname" . }}
  labels:
    {{- include "go-echodfb7dbcf-5861-4a59-91d7-9b9cef9dd68a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfb7dbcf-5861-4a59-91d7-9b9cef9dd68a.selectorLabels" . | nindent 6 }}
