apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24e73c19-5f60-4b75-b6b8-f4c9ddbc8edb.fullname" . }}
  labels:
    {{- include "go-echo24e73c19-5f60-4b75-b6b8-f4c9ddbc8edb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24e73c19-5f60-4b75-b6b8-f4c9ddbc8edb.selectorLabels" . | nindent 6 }}
