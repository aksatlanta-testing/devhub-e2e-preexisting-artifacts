apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbde2825-fe82-47a4-bedd-58bc08bde70f.fullname" . }}
  labels:
    {{- include "go-echobbde2825-fe82-47a4-bedd-58bc08bde70f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbde2825-fe82-47a4-bedd-58bc08bde70f.selectorLabels" . | nindent 6 }}
