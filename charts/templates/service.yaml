apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod575893e-8bcc-4f93-8e26-748f7f5da71f.fullname" . }}
  labels:
    {{- include "go-echod575893e-8bcc-4f93-8e26-748f7f5da71f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod575893e-8bcc-4f93-8e26-748f7f5da71f.selectorLabels" . | nindent 6 }}
