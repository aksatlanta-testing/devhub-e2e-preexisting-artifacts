apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1cd41de-90d3-46f3-9c69-55080fb629c3.fullname" . }}
  labels:
    {{- include "go-echob1cd41de-90d3-46f3-9c69-55080fb629c3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1cd41de-90d3-46f3-9c69-55080fb629c3.selectorLabels" . | nindent 6 }}
