apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29404d0f-38b7-4095-8f09-f682946dd6fc.fullname" . }}
  labels:
    {{- include "go-echo29404d0f-38b7-4095-8f09-f682946dd6fc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29404d0f-38b7-4095-8f09-f682946dd6fc.selectorLabels" . | nindent 6 }}
