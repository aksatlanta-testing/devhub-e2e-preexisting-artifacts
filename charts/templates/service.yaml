apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a27406d-3368-4854-8565-06ae2d43cbfb.fullname" . }}
  labels:
    {{- include "go-echo3a27406d-3368-4854-8565-06ae2d43cbfb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a27406d-3368-4854-8565-06ae2d43cbfb.selectorLabels" . | nindent 6 }}
