apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2a848a5-ae52-4a0f-a5d3-cc7cece3298f.fullname" . }}
  labels:
    {{- include "go-echoc2a848a5-ae52-4a0f-a5d3-cc7cece3298f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2a848a5-ae52-4a0f-a5d3-cc7cece3298f.selectorLabels" . | nindent 6 }}
