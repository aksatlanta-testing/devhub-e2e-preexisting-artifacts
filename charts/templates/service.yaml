apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d62fb1d-da8a-4c9e-b5ba-2736d99bc0fb.fullname" . }}
  labels:
    {{- include "go-echo9d62fb1d-da8a-4c9e-b5ba-2736d99bc0fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d62fb1d-da8a-4c9e-b5ba-2736d99bc0fb.selectorLabels" . | nindent 6 }}
