apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob62dc131-ffee-4de3-ab70-3cc7bbb93e61.fullname" . }}
  labels:
    {{- include "go-echob62dc131-ffee-4de3-ab70-3cc7bbb93e61.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob62dc131-ffee-4de3-ab70-3cc7bbb93e61.selectorLabels" . | nindent 6 }}
