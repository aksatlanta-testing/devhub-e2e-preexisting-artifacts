apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b36c778-f0d6-49b2-8db1-838294f0e968.fullname" . }}
  labels:
    {{- include "go-echo0b36c778-f0d6-49b2-8db1-838294f0e968.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b36c778-f0d6-49b2-8db1-838294f0e968.selectorLabels" . | nindent 6 }}
