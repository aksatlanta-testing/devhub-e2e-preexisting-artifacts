apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83ee0d1a-3664-49cc-a1b4-08c8a534b5fd.fullname" . }}
  labels:
    {{- include "go-echo83ee0d1a-3664-49cc-a1b4-08c8a534b5fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83ee0d1a-3664-49cc-a1b4-08c8a534b5fd.selectorLabels" . | nindent 6 }}
