apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f0d19fb-031a-40cf-b201-14941807ca04.fullname" . }}
  labels:
    {{- include "go-echo4f0d19fb-031a-40cf-b201-14941807ca04.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f0d19fb-031a-40cf-b201-14941807ca04.selectorLabels" . | nindent 6 }}
