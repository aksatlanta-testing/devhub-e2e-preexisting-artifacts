apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0c1354d-c2b3-47c5-ba56-7444a83b4612.fullname" . }}
  labels:
    {{- include "go-echof0c1354d-c2b3-47c5-ba56-7444a83b4612.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0c1354d-c2b3-47c5-ba56-7444a83b4612.selectorLabels" . | nindent 6 }}
