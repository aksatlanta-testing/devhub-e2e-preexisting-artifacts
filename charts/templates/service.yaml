apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobcaaf0fc-0b9d-400a-81a0-afbb10ef312e.fullname" . }}
  labels:
    {{- include "go-echobcaaf0fc-0b9d-400a-81a0-afbb10ef312e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobcaaf0fc-0b9d-400a-81a0-afbb10ef312e.selectorLabels" . | nindent 6 }}
