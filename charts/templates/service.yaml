apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00a1f066-47d3-4ffa-b665-15add9fe4cdc.fullname" . }}
  labels:
    {{- include "go-echo00a1f066-47d3-4ffa-b665-15add9fe4cdc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00a1f066-47d3-4ffa-b665-15add9fe4cdc.selectorLabels" . | nindent 6 }}
