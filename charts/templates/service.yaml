apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7509e87-7cf0-4b57-b31a-7b9251eb9074.fullname" . }}
  labels:
    {{- include "go-echod7509e87-7cf0-4b57-b31a-7b9251eb9074.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7509e87-7cf0-4b57-b31a-7b9251eb9074.selectorLabels" . | nindent 6 }}
