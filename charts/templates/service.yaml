apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob10ea2a9-d4b8-4d46-8cd3-9701c0881f43.fullname" . }}
  labels:
    {{- include "go-echob10ea2a9-d4b8-4d46-8cd3-9701c0881f43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob10ea2a9-d4b8-4d46-8cd3-9701c0881f43.selectorLabels" . | nindent 6 }}
