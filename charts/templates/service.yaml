apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f5c3d5f-7355-4422-b568-f16e3418cf58.fullname" . }}
  labels:
    {{- include "go-echo0f5c3d5f-7355-4422-b568-f16e3418cf58.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f5c3d5f-7355-4422-b568-f16e3418cf58.selectorLabels" . | nindent 6 }}
