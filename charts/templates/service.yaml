apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36c92ad0-3cad-4cb6-9a75-f1557235e00b.fullname" . }}
  labels:
    {{- include "go-echo36c92ad0-3cad-4cb6-9a75-f1557235e00b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36c92ad0-3cad-4cb6-9a75-f1557235e00b.selectorLabels" . | nindent 6 }}
