apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01e98074-8c19-458f-b2d1-e9d0b208e148.fullname" . }}
  labels:
    {{- include "go-echo01e98074-8c19-458f-b2d1-e9d0b208e148.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01e98074-8c19-458f-b2d1-e9d0b208e148.selectorLabels" . | nindent 6 }}
