apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a4e4ad9-e8e2-4157-95d2-68fe8018c8d3.fullname" . }}
  labels:
    {{- include "go-echo1a4e4ad9-e8e2-4157-95d2-68fe8018c8d3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a4e4ad9-e8e2-4157-95d2-68fe8018c8d3.selectorLabels" . | nindent 6 }}
