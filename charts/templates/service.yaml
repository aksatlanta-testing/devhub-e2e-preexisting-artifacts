apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc86b95ef-791c-4091-b313-1d549843c835.fullname" . }}
  labels:
    {{- include "go-echoc86b95ef-791c-4091-b313-1d549843c835.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc86b95ef-791c-4091-b313-1d549843c835.selectorLabels" . | nindent 6 }}
