apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18d35e17-e2ad-4bdb-8066-35a73d7f6858.fullname" . }}
  labels:
    {{- include "go-echo18d35e17-e2ad-4bdb-8066-35a73d7f6858.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18d35e17-e2ad-4bdb-8066-35a73d7f6858.selectorLabels" . | nindent 6 }}
