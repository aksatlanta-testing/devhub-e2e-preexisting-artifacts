apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27b980c4-6c6c-45fe-819f-8bfd9971b04e.fullname" . }}
  labels:
    {{- include "go-echo27b980c4-6c6c-45fe-819f-8bfd9971b04e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27b980c4-6c6c-45fe-819f-8bfd9971b04e.selectorLabels" . | nindent 6 }}
