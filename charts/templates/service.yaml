apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo93d58d25-9266-476b-b4f6-cfe2f74c5a31.fullname" . }}
  labels:
    {{- include "go-echo93d58d25-9266-476b-b4f6-cfe2f74c5a31.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo93d58d25-9266-476b-b4f6-cfe2f74c5a31.selectorLabels" . | nindent 6 }}
