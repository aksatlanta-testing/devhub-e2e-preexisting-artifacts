apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc207a796-8361-4ad3-9818-bc6f1cc93e3d.fullname" . }}
  labels:
    {{- include "go-echoc207a796-8361-4ad3-9818-bc6f1cc93e3d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc207a796-8361-4ad3-9818-bc6f1cc93e3d.selectorLabels" . | nindent 6 }}
