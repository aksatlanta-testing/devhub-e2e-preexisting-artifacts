apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12141c6e-bb1b-4806-8a4c-504d52912140.fullname" . }}
  labels:
    {{- include "go-echo12141c6e-bb1b-4806-8a4c-504d52912140.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12141c6e-bb1b-4806-8a4c-504d52912140.selectorLabels" . | nindent 6 }}
