apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f6b1f2a-21b2-4538-aacd-925a4ed9b4a6.fullname" . }}
  labels:
    {{- include "go-echo6f6b1f2a-21b2-4538-aacd-925a4ed9b4a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f6b1f2a-21b2-4538-aacd-925a4ed9b4a6.selectorLabels" . | nindent 6 }}
