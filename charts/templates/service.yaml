apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd269be8-9799-4851-b95e-dcd7127d731f.fullname" . }}
  labels:
    {{- include "go-echofd269be8-9799-4851-b95e-dcd7127d731f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd269be8-9799-4851-b95e-dcd7127d731f.selectorLabels" . | nindent 6 }}
