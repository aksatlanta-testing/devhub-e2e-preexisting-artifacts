apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bb1ac8d-94a7-4e81-a375-f9449d862ef8.fullname" . }}
  labels:
    {{- include "go-echo0bb1ac8d-94a7-4e81-a375-f9449d862ef8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bb1ac8d-94a7-4e81-a375-f9449d862ef8.selectorLabels" . | nindent 6 }}
