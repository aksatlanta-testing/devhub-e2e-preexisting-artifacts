apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdb1b507-e58f-4403-9f2d-50504cdd1840.fullname" . }}
  labels:
    {{- include "go-echobdb1b507-e58f-4403-9f2d-50504cdd1840.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdb1b507-e58f-4403-9f2d-50504cdd1840.selectorLabels" . | nindent 6 }}
