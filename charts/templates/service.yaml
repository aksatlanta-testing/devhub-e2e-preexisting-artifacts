apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6af93cd-0cfb-4242-973f-5244d7a1addd.fullname" . }}
  labels:
    {{- include "go-echoa6af93cd-0cfb-4242-973f-5244d7a1addd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6af93cd-0cfb-4242-973f-5244d7a1addd.selectorLabels" . | nindent 4 }}
