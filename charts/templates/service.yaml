apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18537407-e667-47d8-8140-2a220f3cf7e8.fullname" . }}
  labels:
    {{- include "go-echo18537407-e667-47d8-8140-2a220f3cf7e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18537407-e667-47d8-8140-2a220f3cf7e8.selectorLabels" . | nindent 6 }}
