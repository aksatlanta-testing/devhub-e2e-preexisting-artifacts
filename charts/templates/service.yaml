apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo841b4173-5f41-4eae-b2d9-edc9132e0a63.fullname" . }}
  labels:
    {{- include "go-echo841b4173-5f41-4eae-b2d9-edc9132e0a63.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo841b4173-5f41-4eae-b2d9-edc9132e0a63.selectorLabels" . | nindent 6 }}
