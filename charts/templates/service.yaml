apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa769613-a260-4418-be6e-aeb34a93daa1.fullname" . }}
  labels:
    {{- include "go-echoaa769613-a260-4418-be6e-aeb34a93daa1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa769613-a260-4418-be6e-aeb34a93daa1.selectorLabels" . | nindent 6 }}
