apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofaba9a0e-a0d3-4bbe-874f-d874e2527dfc.fullname" . }}
  labels:
    {{- include "go-echofaba9a0e-a0d3-4bbe-874f-d874e2527dfc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofaba9a0e-a0d3-4bbe-874f-d874e2527dfc.selectorLabels" . | nindent 6 }}
