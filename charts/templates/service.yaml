apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00cc9587-76a4-4964-9e4e-ddc56ae322d4.fullname" . }}
  labels:
    {{- include "go-echo00cc9587-76a4-4964-9e4e-ddc56ae322d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00cc9587-76a4-4964-9e4e-ddc56ae322d4.selectorLabels" . | nindent 6 }}
