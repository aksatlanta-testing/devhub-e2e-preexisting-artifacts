apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe1e29af-7678-4ea8-838d-44f9b1e922d9.fullname" . }}
  labels:
    {{- include "go-echofe1e29af-7678-4ea8-838d-44f9b1e922d9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe1e29af-7678-4ea8-838d-44f9b1e922d9.selectorLabels" . | nindent 6 }}
