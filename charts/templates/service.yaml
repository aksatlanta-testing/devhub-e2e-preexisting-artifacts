apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e2cb319-2d12-46a1-b295-359b8bd15c1f.fullname" . }}
  labels:
    {{- include "go-echo4e2cb319-2d12-46a1-b295-359b8bd15c1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e2cb319-2d12-46a1-b295-359b8bd15c1f.selectorLabels" . | nindent 6 }}
