apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa603ffdc-ccb0-4fcd-9bbc-9d3d725f38d1.fullname" . }}
  labels:
    {{- include "go-echoa603ffdc-ccb0-4fcd-9bbc-9d3d725f38d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa603ffdc-ccb0-4fcd-9bbc-9d3d725f38d1.selectorLabels" . | nindent 6 }}
