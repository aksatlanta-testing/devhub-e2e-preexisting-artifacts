apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo923778fd-2fa1-461c-a6c5-a4b311f454f4.fullname" . }}
  labels:
    {{- include "go-echo923778fd-2fa1-461c-a6c5-a4b311f454f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo923778fd-2fa1-461c-a6c5-a4b311f454f4.selectorLabels" . | nindent 6 }}
