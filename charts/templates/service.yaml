apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1611f49-a795-4f4c-a01d-d61af291010e.fullname" . }}
  labels:
    {{- include "go-echof1611f49-a795-4f4c-a01d-d61af291010e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1611f49-a795-4f4c-a01d-d61af291010e.selectorLabels" . | nindent 6 }}
