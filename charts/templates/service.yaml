apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75120b76-3000-4a7d-b1e7-a2142905071e.fullname" . }}
  labels:
    {{- include "go-echo75120b76-3000-4a7d-b1e7-a2142905071e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75120b76-3000-4a7d-b1e7-a2142905071e.selectorLabels" . | nindent 6 }}
