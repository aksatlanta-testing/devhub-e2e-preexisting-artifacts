apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c18878a-2dcc-47be-9734-e46b557e0f58.fullname" . }}
  labels:
    {{- include "go-echo2c18878a-2dcc-47be-9734-e46b557e0f58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c18878a-2dcc-47be-9734-e46b557e0f58.selectorLabels" . | nindent 6 }}
