apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d7eaf1f-93b5-43b4-94ba-b41e33cd022d.fullname" . }}
  labels:
    {{- include "go-echo1d7eaf1f-93b5-43b4-94ba-b41e33cd022d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d7eaf1f-93b5-43b4-94ba-b41e33cd022d.selectorLabels" . | nindent 6 }}
