apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf6e0ffd-d1b0-455a-833b-d8974029161e.fullname" . }}
  labels:
    {{- include "go-echobf6e0ffd-d1b0-455a-833b-d8974029161e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf6e0ffd-d1b0-455a-833b-d8974029161e.selectorLabels" . | nindent 6 }}
