apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bcf4161-29ab-40ab-bdf3-20c5b028c697.fullname" . }}
  labels:
    {{- include "go-echo8bcf4161-29ab-40ab-bdf3-20c5b028c697.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bcf4161-29ab-40ab-bdf3-20c5b028c697.selectorLabels" . | nindent 6 }}
