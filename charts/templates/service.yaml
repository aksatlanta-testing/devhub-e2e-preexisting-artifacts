apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d4b65be-a550-4628-9273-1c504b3db473.fullname" . }}
  labels:
    {{- include "go-echo4d4b65be-a550-4628-9273-1c504b3db473.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d4b65be-a550-4628-9273-1c504b3db473.selectorLabels" . | nindent 6 }}
