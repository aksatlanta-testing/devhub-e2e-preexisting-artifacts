apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91700592-3659-4fd6-ac99-ad86e39ec733.fullname" . }}
  labels:
    {{- include "go-echo91700592-3659-4fd6-ac99-ad86e39ec733.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91700592-3659-4fd6-ac99-ad86e39ec733.selectorLabels" . | nindent 6 }}
