apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5bd389fc-c90c-49b1-b8f2-547883c1218a.fullname" . }}
  labels:
    {{- include "go-echo5bd389fc-c90c-49b1-b8f2-547883c1218a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5bd389fc-c90c-49b1-b8f2-547883c1218a.selectorLabels" . | nindent 6 }}
