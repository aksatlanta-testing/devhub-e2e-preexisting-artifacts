apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo927a3dbb-70c9-4f74-bb8b-29bdcc4d949e.fullname" . }}
  labels:
    {{- include "go-echo927a3dbb-70c9-4f74-bb8b-29bdcc4d949e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo927a3dbb-70c9-4f74-bb8b-29bdcc4d949e.selectorLabels" . | nindent 6 }}
