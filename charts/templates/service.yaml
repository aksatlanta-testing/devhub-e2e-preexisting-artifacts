apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86b8c342-6c0c-466d-a739-6e23bc9edebb.fullname" . }}
  labels:
    {{- include "go-echo86b8c342-6c0c-466d-a739-6e23bc9edebb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86b8c342-6c0c-466d-a739-6e23bc9edebb.selectorLabels" . | nindent 6 }}
