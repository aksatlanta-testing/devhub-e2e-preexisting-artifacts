apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27790f3c-332c-4e28-bc73-52fcbf63b04d.fullname" . }}
  labels:
    {{- include "go-echo27790f3c-332c-4e28-bc73-52fcbf63b04d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27790f3c-332c-4e28-bc73-52fcbf63b04d.selectorLabels" . | nindent 6 }}
