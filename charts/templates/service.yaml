apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo609ef0f9-b22b-4613-8d3e-ee5064dee570.fullname" . }}
  labels:
    {{- include "go-echo609ef0f9-b22b-4613-8d3e-ee5064dee570.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo609ef0f9-b22b-4613-8d3e-ee5064dee570.selectorLabels" . | nindent 6 }}
