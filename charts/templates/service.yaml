apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3caeaab6-8837-4d5c-b973-15e3e8a891b0.fullname" . }}
  labels:
    {{- include "go-echo3caeaab6-8837-4d5c-b973-15e3e8a891b0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3caeaab6-8837-4d5c-b973-15e3e8a891b0.selectorLabels" . | nindent 6 }}
