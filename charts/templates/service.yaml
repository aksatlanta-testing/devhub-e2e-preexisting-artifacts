apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc72340fb-6659-49fc-9174-b0f9bcb8d227.fullname" . }}
  labels:
    {{- include "go-echoc72340fb-6659-49fc-9174-b0f9bcb8d227.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc72340fb-6659-49fc-9174-b0f9bcb8d227.selectorLabels" . | nindent 6 }}
