apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob89e1e07-3340-45c5-9c69-cbec8d5f74eb.fullname" . }}
  labels:
    {{- include "go-echob89e1e07-3340-45c5-9c69-cbec8d5f74eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob89e1e07-3340-45c5-9c69-cbec8d5f74eb.selectorLabels" . | nindent 6 }}
