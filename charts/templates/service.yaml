apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof335aaa6-2a37-448b-a03f-ea1d4366aeae.fullname" . }}
  labels:
    {{- include "go-echof335aaa6-2a37-448b-a03f-ea1d4366aeae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof335aaa6-2a37-448b-a03f-ea1d4366aeae.selectorLabels" . | nindent 6 }}
