apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo463ca915-8727-4c5e-a1cd-18c925493e6f.fullname" . }}
  labels:
    {{- include "go-echo463ca915-8727-4c5e-a1cd-18c925493e6f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo463ca915-8727-4c5e-a1cd-18c925493e6f.selectorLabels" . | nindent 6 }}
