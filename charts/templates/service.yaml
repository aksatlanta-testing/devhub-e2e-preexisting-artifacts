apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof385a493-c22d-4ff0-a1fb-252de2c7bbd8.fullname" . }}
  labels:
    {{- include "go-echof385a493-c22d-4ff0-a1fb-252de2c7bbd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof385a493-c22d-4ff0-a1fb-252de2c7bbd8.selectorLabels" . | nindent 6 }}
