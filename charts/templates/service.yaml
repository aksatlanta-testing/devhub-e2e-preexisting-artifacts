apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53837418-888c-467b-862d-84137bc04898.fullname" . }}
  labels:
    {{- include "go-echo53837418-888c-467b-862d-84137bc04898.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53837418-888c-467b-862d-84137bc04898.selectorLabels" . | nindent 6 }}
