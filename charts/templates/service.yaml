apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa740a1d7-ce53-46ce-9f2f-21bfb7887ede.fullname" . }}
  labels:
    {{- include "go-echoa740a1d7-ce53-46ce-9f2f-21bfb7887ede.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa740a1d7-ce53-46ce-9f2f-21bfb7887ede.selectorLabels" . | nindent 6 }}
