apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7535f5e3-3b75-4513-9231-d81688eda0a0.fullname" . }}
  labels:
    {{- include "go-echo7535f5e3-3b75-4513-9231-d81688eda0a0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7535f5e3-3b75-4513-9231-d81688eda0a0.selectorLabels" . | nindent 6 }}
