apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32297601-b11f-40aa-85af-f2a138c4ef5c.fullname" . }}
  labels:
    {{- include "go-echo32297601-b11f-40aa-85af-f2a138c4ef5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32297601-b11f-40aa-85af-f2a138c4ef5c.selectorLabels" . | nindent 6 }}
