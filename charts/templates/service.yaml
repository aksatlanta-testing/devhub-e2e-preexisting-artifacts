apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc79b1195-2478-4f63-90e8-32eb4988c765.fullname" . }}
  labels:
    {{- include "go-echoc79b1195-2478-4f63-90e8-32eb4988c765.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc79b1195-2478-4f63-90e8-32eb4988c765.selectorLabels" . | nindent 6 }}
