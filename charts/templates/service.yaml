apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4dc72b1-ba33-4cbf-857e-ecd73592eae8.fullname" . }}
  labels:
    {{- include "go-echof4dc72b1-ba33-4cbf-857e-ecd73592eae8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4dc72b1-ba33-4cbf-857e-ecd73592eae8.selectorLabels" . | nindent 6 }}
