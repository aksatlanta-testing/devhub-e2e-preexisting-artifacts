apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08760765-d89c-421a-b588-893ad6ef4a89.fullname" . }}
  labels:
    {{- include "go-echo08760765-d89c-421a-b588-893ad6ef4a89.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08760765-d89c-421a-b588-893ad6ef4a89.selectorLabels" . | nindent 6 }}
