apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod103ee9c-9304-4a0f-9784-6027b5209cfb.fullname" . }}
  labels:
    {{- include "go-echod103ee9c-9304-4a0f-9784-6027b5209cfb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod103ee9c-9304-4a0f-9784-6027b5209cfb.selectorLabels" . | nindent 6 }}
