apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95fe8dac-faa1-4926-a3ff-1934f6783c87.fullname" . }}
  labels:
    {{- include "go-echo95fe8dac-faa1-4926-a3ff-1934f6783c87.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95fe8dac-faa1-4926-a3ff-1934f6783c87.selectorLabels" . | nindent 6 }}
