apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37241bfa-8349-4b98-8717-8f9cf9ac9587.fullname" . }}
  labels:
    {{- include "go-echo37241bfa-8349-4b98-8717-8f9cf9ac9587.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37241bfa-8349-4b98-8717-8f9cf9ac9587.selectorLabels" . | nindent 6 }}
