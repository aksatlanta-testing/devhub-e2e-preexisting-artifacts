apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31d9f4f7-5745-49b4-b4e2-036359e327b9.fullname" . }}
  labels:
    {{- include "go-echo31d9f4f7-5745-49b4-b4e2-036359e327b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31d9f4f7-5745-49b4-b4e2-036359e327b9.selectorLabels" . | nindent 6 }}
