apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9e39119-3b76-4cbe-88f3-05c690233940.fullname" . }}
  labels:
    {{- include "go-echof9e39119-3b76-4cbe-88f3-05c690233940.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9e39119-3b76-4cbe-88f3-05c690233940.selectorLabels" . | nindent 6 }}
