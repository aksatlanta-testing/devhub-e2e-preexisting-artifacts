apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7621a43-1cdf-4944-a841-68c080a1749f.fullname" . }}
  labels:
    {{- include "go-echob7621a43-1cdf-4944-a841-68c080a1749f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7621a43-1cdf-4944-a841-68c080a1749f.selectorLabels" . | nindent 6 }}
