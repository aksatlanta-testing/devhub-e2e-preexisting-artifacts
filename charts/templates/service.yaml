apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0245227b-dca3-471c-9247-f9969fb63514.fullname" . }}
  labels:
    {{- include "go-echo0245227b-dca3-471c-9247-f9969fb63514.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0245227b-dca3-471c-9247-f9969fb63514.selectorLabels" . | nindent 6 }}
