apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ffe7e09-8981-4025-a6f8-d9de79adb2f6.fullname" . }}
  labels:
    {{- include "go-echo3ffe7e09-8981-4025-a6f8-d9de79adb2f6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ffe7e09-8981-4025-a6f8-d9de79adb2f6.selectorLabels" . | nindent 6 }}
