apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc730f7a2-9f28-42f4-a935-1bea794ac989.fullname" . }}
  labels:
    {{- include "go-echoc730f7a2-9f28-42f4-a935-1bea794ac989.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc730f7a2-9f28-42f4-a935-1bea794ac989.selectorLabels" . | nindent 6 }}
