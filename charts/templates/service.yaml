apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78456e75-e6ca-4c16-ae9c-227067243774.fullname" . }}
  labels:
    {{- include "go-echo78456e75-e6ca-4c16-ae9c-227067243774.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78456e75-e6ca-4c16-ae9c-227067243774.selectorLabels" . | nindent 6 }}
