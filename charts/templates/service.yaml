apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d4c220e-6229-4af9-9880-dc07a2ea6296.fullname" . }}
  labels:
    {{- include "go-echo3d4c220e-6229-4af9-9880-dc07a2ea6296.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d4c220e-6229-4af9-9880-dc07a2ea6296.selectorLabels" . | nindent 6 }}
