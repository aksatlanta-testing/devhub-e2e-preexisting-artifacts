apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9d50e20-1f70-4ab2-be89-deb3216dae7e.fullname" . }}
  labels:
    {{- include "go-echof9d50e20-1f70-4ab2-be89-deb3216dae7e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9d50e20-1f70-4ab2-be89-deb3216dae7e.selectorLabels" . | nindent 6 }}
