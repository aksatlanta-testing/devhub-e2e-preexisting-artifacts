apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd44058e-3dd9-498b-9389-1f9a0f4595a9.fullname" . }}
  labels:
    {{- include "go-echocd44058e-3dd9-498b-9389-1f9a0f4595a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd44058e-3dd9-498b-9389-1f9a0f4595a9.selectorLabels" . | nindent 6 }}
