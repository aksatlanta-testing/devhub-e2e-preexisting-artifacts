apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc095a803-164e-482e-9859-70cd7f9b9bc0.fullname" . }}
  labels:
    {{- include "go-echoc095a803-164e-482e-9859-70cd7f9b9bc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc095a803-164e-482e-9859-70cd7f9b9bc0.selectorLabels" . | nindent 6 }}
