apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa064557e-d4eb-45a7-bfa7-5e6e508ef270.fullname" . }}
  labels:
    {{- include "go-echoa064557e-d4eb-45a7-bfa7-5e6e508ef270.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa064557e-d4eb-45a7-bfa7-5e6e508ef270.selectorLabels" . | nindent 6 }}
