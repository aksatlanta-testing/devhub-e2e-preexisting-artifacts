apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69348033-9c56-4050-ab33-a88744a1f3be.fullname" . }}
  labels:
    {{- include "go-echo69348033-9c56-4050-ab33-a88744a1f3be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69348033-9c56-4050-ab33-a88744a1f3be.selectorLabels" . | nindent 6 }}
