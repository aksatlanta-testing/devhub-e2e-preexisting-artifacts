apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1da0c06f-b41f-4b7e-9c9f-40fae30107b5.fullname" . }}
  labels:
    {{- include "go-echo1da0c06f-b41f-4b7e-9c9f-40fae30107b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1da0c06f-b41f-4b7e-9c9f-40fae30107b5.selectorLabels" . | nindent 6 }}
