apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36150f86-5413-4706-a36e-a581dd2262fb.fullname" . }}
  labels:
    {{- include "go-echo36150f86-5413-4706-a36e-a581dd2262fb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36150f86-5413-4706-a36e-a581dd2262fb.selectorLabels" . | nindent 6 }}
