apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91147295-fa8f-46f7-bdcc-bdf7dc3abbff.fullname" . }}
  labels:
    {{- include "go-echo91147295-fa8f-46f7-bdcc-bdf7dc3abbff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91147295-fa8f-46f7-bdcc-bdf7dc3abbff.selectorLabels" . | nindent 6 }}
