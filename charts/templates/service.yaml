apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo510ffe7f-ff12-4762-a171-f22831e31227.fullname" . }}
  labels:
    {{- include "go-echo510ffe7f-ff12-4762-a171-f22831e31227.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo510ffe7f-ff12-4762-a171-f22831e31227.selectorLabels" . | nindent 6 }}
