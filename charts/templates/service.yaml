apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf472a3f-fc59-4f30-89a4-548c67e5e383.fullname" . }}
  labels:
    {{- include "go-echoaf472a3f-fc59-4f30-89a4-548c67e5e383.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf472a3f-fc59-4f30-89a4-548c67e5e383.selectorLabels" . | nindent 6 }}
