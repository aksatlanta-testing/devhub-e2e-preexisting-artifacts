apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7489f11e-c80f-49ec-b11b-b70a3395b20d.fullname" . }}
  labels:
    {{- include "go-echo7489f11e-c80f-49ec-b11b-b70a3395b20d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7489f11e-c80f-49ec-b11b-b70a3395b20d.selectorLabels" . | nindent 6 }}
