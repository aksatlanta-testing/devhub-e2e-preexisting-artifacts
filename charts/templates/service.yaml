apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3287258c-e181-4777-bcc1-7b9e6ded1286.fullname" . }}
  labels:
    {{- include "go-echo3287258c-e181-4777-bcc1-7b9e6ded1286.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3287258c-e181-4777-bcc1-7b9e6ded1286.selectorLabels" . | nindent 6 }}
