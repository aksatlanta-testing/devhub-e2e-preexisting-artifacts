apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62c7f446-83f4-444e-9b14-46af75335872.fullname" . }}
  labels:
    {{- include "go-echo62c7f446-83f4-444e-9b14-46af75335872.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62c7f446-83f4-444e-9b14-46af75335872.selectorLabels" . | nindent 6 }}
