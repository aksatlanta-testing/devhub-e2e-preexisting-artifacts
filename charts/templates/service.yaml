apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90a154ba-c891-4c32-9228-ea964acc3ae4.fullname" . }}
  labels:
    {{- include "go-echo90a154ba-c891-4c32-9228-ea964acc3ae4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90a154ba-c891-4c32-9228-ea964acc3ae4.selectorLabels" . | nindent 6 }}
