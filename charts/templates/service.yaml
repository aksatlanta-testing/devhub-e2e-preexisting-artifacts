apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd1c28d8-7f89-40b6-b43e-92fd80b8326d.fullname" . }}
  labels:
    {{- include "go-echofd1c28d8-7f89-40b6-b43e-92fd80b8326d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd1c28d8-7f89-40b6-b43e-92fd80b8326d.selectorLabels" . | nindent 6 }}
