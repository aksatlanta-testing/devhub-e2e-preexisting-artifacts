apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80664aa5-6aa6-4a0e-9c67-e77b0cae73dc.fullname" . }}
  labels:
    {{- include "go-echo80664aa5-6aa6-4a0e-9c67-e77b0cae73dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80664aa5-6aa6-4a0e-9c67-e77b0cae73dc.selectorLabels" . | nindent 6 }}
