apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb10905b-d5a9-4d7f-b42a-4f70417fb8f8.fullname" . }}
  labels:
    {{- include "go-echofb10905b-d5a9-4d7f-b42a-4f70417fb8f8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb10905b-d5a9-4d7f-b42a-4f70417fb8f8.selectorLabels" . | nindent 6 }}
