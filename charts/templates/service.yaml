apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88c094d6-2664-4994-9e40-c0ebe1360bc2.fullname" . }}
  labels:
    {{- include "go-echo88c094d6-2664-4994-9e40-c0ebe1360bc2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88c094d6-2664-4994-9e40-c0ebe1360bc2.selectorLabels" . | nindent 6 }}
