apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9adc62d6-874d-48b1-a00a-f3b59c7c82ec.fullname" . }}
  labels:
    {{- include "go-echo9adc62d6-874d-48b1-a00a-f3b59c7c82ec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9adc62d6-874d-48b1-a00a-f3b59c7c82ec.selectorLabels" . | nindent 6 }}
