apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fc26a9a-749b-42ba-97a1-ac992f2527eb.fullname" . }}
  labels:
    {{- include "go-echo8fc26a9a-749b-42ba-97a1-ac992f2527eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fc26a9a-749b-42ba-97a1-ac992f2527eb.selectorLabels" . | nindent 6 }}
