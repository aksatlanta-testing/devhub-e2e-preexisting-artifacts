apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e997392-764c-40dd-a9f3-a9d0104bffce.fullname" . }}
  labels:
    {{- include "go-echo0e997392-764c-40dd-a9f3-a9d0104bffce.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e997392-764c-40dd-a9f3-a9d0104bffce.selectorLabels" . | nindent 6 }}
