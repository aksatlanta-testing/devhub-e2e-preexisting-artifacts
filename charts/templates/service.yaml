apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof345cfb4-e6fa-4b8b-a54d-35321a248ae3.fullname" . }}
  labels:
    {{- include "go-echof345cfb4-e6fa-4b8b-a54d-35321a248ae3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof345cfb4-e6fa-4b8b-a54d-35321a248ae3.selectorLabels" . | nindent 6 }}
