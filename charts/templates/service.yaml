apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b682390-7e6c-436f-8cc6-bdd61b78edf2.fullname" . }}
  labels:
    {{- include "go-echo2b682390-7e6c-436f-8cc6-bdd61b78edf2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b682390-7e6c-436f-8cc6-bdd61b78edf2.selectorLabels" . | nindent 6 }}
