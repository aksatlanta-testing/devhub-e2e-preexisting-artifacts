apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa64afd5b-2715-40e4-8fe1-2659c1582f1f.fullname" . }}
  labels:
    {{- include "go-echoa64afd5b-2715-40e4-8fe1-2659c1582f1f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa64afd5b-2715-40e4-8fe1-2659c1582f1f.selectorLabels" . | nindent 6 }}
