apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5bc607c8-f022-4372-9953-10653931f6a1.fullname" . }}
  labels:
    {{- include "go-echo5bc607c8-f022-4372-9953-10653931f6a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5bc607c8-f022-4372-9953-10653931f6a1.selectorLabels" . | nindent 6 }}
