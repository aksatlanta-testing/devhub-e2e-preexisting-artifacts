apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9f6ca7e-cdfb-4f6a-a227-ff08b0268cfb.fullname" . }}
  labels:
    {{- include "go-echob9f6ca7e-cdfb-4f6a-a227-ff08b0268cfb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9f6ca7e-cdfb-4f6a-a227-ff08b0268cfb.selectorLabels" . | nindent 6 }}
