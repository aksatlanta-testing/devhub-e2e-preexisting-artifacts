apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3605cb76-e73c-4fa5-8200-bb63dfaa0bab.fullname" . }}
  labels:
    {{- include "go-echo3605cb76-e73c-4fa5-8200-bb63dfaa0bab.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3605cb76-e73c-4fa5-8200-bb63dfaa0bab.selectorLabels" . | nindent 6 }}
