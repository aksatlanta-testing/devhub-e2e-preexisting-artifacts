apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05c76c53-3db6-45c3-91bb-821662919f46.fullname" . }}
  labels:
    {{- include "go-echo05c76c53-3db6-45c3-91bb-821662919f46.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05c76c53-3db6-45c3-91bb-821662919f46.selectorLabels" . | nindent 6 }}
