apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07cc971a-d9d2-4427-a09d-b1b7228ed575.fullname" . }}
  labels:
    {{- include "go-echo07cc971a-d9d2-4427-a09d-b1b7228ed575.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07cc971a-d9d2-4427-a09d-b1b7228ed575.selectorLabels" . | nindent 6 }}
