apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6a45267-a9ff-4d74-b627-946bc7e9b829.fullname" . }}
  labels:
    {{- include "go-echof6a45267-a9ff-4d74-b627-946bc7e9b829.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6a45267-a9ff-4d74-b627-946bc7e9b829.selectorLabels" . | nindent 6 }}
