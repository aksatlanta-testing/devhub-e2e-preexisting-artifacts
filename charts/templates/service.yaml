apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoadff867a-105e-402b-8755-9658550c62da.fullname" . }}
  labels:
    {{- include "go-echoadff867a-105e-402b-8755-9658550c62da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoadff867a-105e-402b-8755-9658550c62da.selectorLabels" . | nindent 6 }}
