apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5090f5f0-7203-4741-822a-b5b52c262e0e.fullname" . }}
  labels:
    {{- include "go-echo5090f5f0-7203-4741-822a-b5b52c262e0e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5090f5f0-7203-4741-822a-b5b52c262e0e.selectorLabels" . | nindent 6 }}
