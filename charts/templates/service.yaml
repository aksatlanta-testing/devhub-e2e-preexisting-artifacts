apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cff8c85-9f3e-4e41-80d4-be11e89f5be7.fullname" . }}
  labels:
    {{- include "go-echo1cff8c85-9f3e-4e41-80d4-be11e89f5be7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cff8c85-9f3e-4e41-80d4-be11e89f5be7.selectorLabels" . | nindent 6 }}
