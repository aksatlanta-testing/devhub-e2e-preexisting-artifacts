apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed3a9c9c-60ff-4931-b77a-9cc73b1b463a.fullname" . }}
  labels:
    {{- include "go-echoed3a9c9c-60ff-4931-b77a-9cc73b1b463a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed3a9c9c-60ff-4931-b77a-9cc73b1b463a.selectorLabels" . | nindent 6 }}
