apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocdbde38c-5eb4-4434-8007-ac90d65ff739.fullname" . }}
  labels:
    {{- include "go-echocdbde38c-5eb4-4434-8007-ac90d65ff739.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocdbde38c-5eb4-4434-8007-ac90d65ff739.selectorLabels" . | nindent 6 }}
