apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof63b80cf-7d5e-4871-9d7f-4a7225a49e85.fullname" . }}
  labels:
    {{- include "go-echof63b80cf-7d5e-4871-9d7f-4a7225a49e85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof63b80cf-7d5e-4871-9d7f-4a7225a49e85.selectorLabels" . | nindent 6 }}
