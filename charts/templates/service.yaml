apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f933b5d-3ff4-4ad4-96fd-770efc30e1ff.fullname" . }}
  labels:
    {{- include "go-echo4f933b5d-3ff4-4ad4-96fd-770efc30e1ff.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f933b5d-3ff4-4ad4-96fd-770efc30e1ff.selectorLabels" . | nindent 6 }}
