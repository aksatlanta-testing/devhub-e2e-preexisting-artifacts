apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96f2cffc-cc12-4439-82e7-0c6e19b49a15.fullname" . }}
  labels:
    {{- include "go-echo96f2cffc-cc12-4439-82e7-0c6e19b49a15.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96f2cffc-cc12-4439-82e7-0c6e19b49a15.selectorLabels" . | nindent 6 }}
