apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78356964-78f5-45c6-8bcd-59328d05c788.fullname" . }}
  labels:
    {{- include "go-echo78356964-78f5-45c6-8bcd-59328d05c788.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78356964-78f5-45c6-8bcd-59328d05c788.selectorLabels" . | nindent 6 }}
