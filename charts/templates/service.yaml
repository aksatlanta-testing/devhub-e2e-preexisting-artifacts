apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99cb5b71-ba6f-454c-b74b-362fc9b3140b.fullname" . }}
  labels:
    {{- include "go-echo99cb5b71-ba6f-454c-b74b-362fc9b3140b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99cb5b71-ba6f-454c-b74b-362fc9b3140b.selectorLabels" . | nindent 6 }}
