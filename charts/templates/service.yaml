apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45dab6b7-28aa-411a-9802-828cb1205551.fullname" . }}
  labels:
    {{- include "go-echo45dab6b7-28aa-411a-9802-828cb1205551.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45dab6b7-28aa-411a-9802-828cb1205551.selectorLabels" . | nindent 6 }}
