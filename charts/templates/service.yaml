apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo635dbaaa-684c-4a57-ae79-7257f4e0a561.fullname" . }}
  labels:
    {{- include "go-echo635dbaaa-684c-4a57-ae79-7257f4e0a561.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo635dbaaa-684c-4a57-ae79-7257f4e0a561.selectorLabels" . | nindent 6 }}
