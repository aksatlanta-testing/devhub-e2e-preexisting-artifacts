apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37eb7345-c443-4786-be0d-8256c1f31bec.fullname" . }}
  labels:
    {{- include "go-echo37eb7345-c443-4786-be0d-8256c1f31bec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37eb7345-c443-4786-be0d-8256c1f31bec.selectorLabels" . | nindent 6 }}
