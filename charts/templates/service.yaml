apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a83b1d6-b4d1-472d-9a40-e1a956fb6742.fullname" . }}
  labels:
    {{- include "go-echo0a83b1d6-b4d1-472d-9a40-e1a956fb6742.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a83b1d6-b4d1-472d-9a40-e1a956fb6742.selectorLabels" . | nindent 6 }}
