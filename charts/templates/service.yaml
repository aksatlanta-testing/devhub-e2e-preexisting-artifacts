apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo733a8b53-3514-4e5e-a99a-9f69866b117c.fullname" . }}
  labels:
    {{- include "go-echo733a8b53-3514-4e5e-a99a-9f69866b117c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo733a8b53-3514-4e5e-a99a-9f69866b117c.selectorLabels" . | nindent 6 }}
