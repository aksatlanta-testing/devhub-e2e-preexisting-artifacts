apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo981bb98a-b9ae-4f36-b41a-57a6b11aa7ca.fullname" . }}
  labels:
    {{- include "go-echo981bb98a-b9ae-4f36-b41a-57a6b11aa7ca.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo981bb98a-b9ae-4f36-b41a-57a6b11aa7ca.selectorLabels" . | nindent 6 }}
