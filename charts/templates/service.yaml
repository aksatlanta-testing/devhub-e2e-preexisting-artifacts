apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3eca47e4-9222-4312-b68e-75303176b353.fullname" . }}
  labels:
    {{- include "go-echo3eca47e4-9222-4312-b68e-75303176b353.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3eca47e4-9222-4312-b68e-75303176b353.selectorLabels" . | nindent 6 }}
