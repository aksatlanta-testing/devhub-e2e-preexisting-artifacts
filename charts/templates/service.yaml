apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofba08db5-6b17-47d0-a878-0468cc7a53b1.fullname" . }}
  labels:
    {{- include "go-echofba08db5-6b17-47d0-a878-0468cc7a53b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofba08db5-6b17-47d0-a878-0468cc7a53b1.selectorLabels" . | nindent 6 }}
