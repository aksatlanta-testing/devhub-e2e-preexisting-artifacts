apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e5414f6-c468-4d6f-bc95-64d3a0717357.fullname" . }}
  labels:
    {{- include "go-echo6e5414f6-c468-4d6f-bc95-64d3a0717357.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e5414f6-c468-4d6f-bc95-64d3a0717357.selectorLabels" . | nindent 6 }}
