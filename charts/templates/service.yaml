apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e0c2907-d409-4bba-9bfb-a5af6503fdd6.fullname" . }}
  labels:
    {{- include "go-echo8e0c2907-d409-4bba-9bfb-a5af6503fdd6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e0c2907-d409-4bba-9bfb-a5af6503fdd6.selectorLabels" . | nindent 6 }}
