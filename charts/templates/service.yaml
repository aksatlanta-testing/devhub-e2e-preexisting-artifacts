apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe32f4934-c8d7-4e12-8f75-399762bc8177.fullname" . }}
  labels:
    {{- include "go-echoe32f4934-c8d7-4e12-8f75-399762bc8177.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe32f4934-c8d7-4e12-8f75-399762bc8177.selectorLabels" . | nindent 6 }}
