apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48a2571f-349d-4a51-acd6-5bf713cb5532.fullname" . }}
  labels:
    {{- include "go-echo48a2571f-349d-4a51-acd6-5bf713cb5532.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48a2571f-349d-4a51-acd6-5bf713cb5532.selectorLabels" . | nindent 6 }}
