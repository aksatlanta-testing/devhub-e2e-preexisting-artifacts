apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c4164b1-3fdb-49d1-b219-d471d1915aa0.fullname" . }}
  labels:
    {{- include "go-echo2c4164b1-3fdb-49d1-b219-d471d1915aa0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c4164b1-3fdb-49d1-b219-d471d1915aa0.selectorLabels" . | nindent 6 }}
