apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78b62378-c269-4948-88bf-dea44739f182.fullname" . }}
  labels:
    {{- include "go-echo78b62378-c269-4948-88bf-dea44739f182.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78b62378-c269-4948-88bf-dea44739f182.selectorLabels" . | nindent 6 }}
