apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fae20a0-15aa-4a0d-a4ec-a6a6d83b73f4.fullname" . }}
  labels:
    {{- include "go-echo9fae20a0-15aa-4a0d-a4ec-a6a6d83b73f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fae20a0-15aa-4a0d-a4ec-a6a6d83b73f4.selectorLabels" . | nindent 6 }}
