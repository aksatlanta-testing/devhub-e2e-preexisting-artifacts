apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa34a3bfe-2a80-475d-8aca-dfe8a4cef898.fullname" . }}
  labels:
    {{- include "go-echoa34a3bfe-2a80-475d-8aca-dfe8a4cef898.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa34a3bfe-2a80-475d-8aca-dfe8a4cef898.selectorLabels" . | nindent 6 }}
