apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1307da09-9b45-4029-9aca-4476ac1dfd78.fullname" . }}
  labels:
    {{- include "go-echo1307da09-9b45-4029-9aca-4476ac1dfd78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1307da09-9b45-4029-9aca-4476ac1dfd78.selectorLabels" . | nindent 6 }}
