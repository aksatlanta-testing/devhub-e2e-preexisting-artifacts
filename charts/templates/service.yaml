apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57294157-9127-4ee5-866b-8da7befda2f8.fullname" . }}
  labels:
    {{- include "go-echo57294157-9127-4ee5-866b-8da7befda2f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57294157-9127-4ee5-866b-8da7befda2f8.selectorLabels" . | nindent 6 }}
