apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d61065d-f3f9-4374-88c4-231d2fcd7329.fullname" . }}
  labels:
    {{- include "go-echo3d61065d-f3f9-4374-88c4-231d2fcd7329.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d61065d-f3f9-4374-88c4-231d2fcd7329.selectorLabels" . | nindent 6 }}
