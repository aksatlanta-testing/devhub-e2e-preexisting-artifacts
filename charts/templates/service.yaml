apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoece68f9e-87e1-4acb-8c43-e3a0a1caa867.fullname" . }}
  labels:
    {{- include "go-echoece68f9e-87e1-4acb-8c43-e3a0a1caa867.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoece68f9e-87e1-4acb-8c43-e3a0a1caa867.selectorLabels" . | nindent 6 }}
