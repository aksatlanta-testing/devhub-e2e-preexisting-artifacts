apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f53128a-349a-4134-ae77-02c6003cb601.fullname" . }}
  labels:
    {{- include "go-echo6f53128a-349a-4134-ae77-02c6003cb601.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f53128a-349a-4134-ae77-02c6003cb601.selectorLabels" . | nindent 6 }}
