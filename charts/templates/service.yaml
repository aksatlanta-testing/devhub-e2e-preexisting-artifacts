apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fc511e1-6ee0-4c2d-9838-2bbbddcc6114.fullname" . }}
  labels:
    {{- include "go-echo9fc511e1-6ee0-4c2d-9838-2bbbddcc6114.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fc511e1-6ee0-4c2d-9838-2bbbddcc6114.selectorLabels" . | nindent 6 }}
