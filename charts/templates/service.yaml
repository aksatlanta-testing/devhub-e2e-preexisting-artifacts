apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40c9f39f-c170-4959-86d2-0da31a404ea0.fullname" . }}
  labels:
    {{- include "go-echo40c9f39f-c170-4959-86d2-0da31a404ea0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40c9f39f-c170-4959-86d2-0da31a404ea0.selectorLabels" . | nindent 6 }}
