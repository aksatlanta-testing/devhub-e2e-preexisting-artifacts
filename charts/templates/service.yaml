apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5944a5b-5101-4a58-ab19-156aa64d3ad1.fullname" . }}
  labels:
    {{- include "go-echof5944a5b-5101-4a58-ab19-156aa64d3ad1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5944a5b-5101-4a58-ab19-156aa64d3ad1.selectorLabels" . | nindent 6 }}
