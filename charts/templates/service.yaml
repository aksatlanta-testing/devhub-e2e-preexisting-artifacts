apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7473e5f-f628-4535-8fe1-c8dd5e4c9f2c.fullname" . }}
  labels:
    {{- include "go-echoc7473e5f-f628-4535-8fe1-c8dd5e4c9f2c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7473e5f-f628-4535-8fe1-c8dd5e4c9f2c.selectorLabels" . | nindent 6 }}
