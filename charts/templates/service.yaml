apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8f568a1-f450-4e5b-a113-40094e485a9b.fullname" . }}
  labels:
    {{- include "go-echof8f568a1-f450-4e5b-a113-40094e485a9b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8f568a1-f450-4e5b-a113-40094e485a9b.selectorLabels" . | nindent 6 }}
