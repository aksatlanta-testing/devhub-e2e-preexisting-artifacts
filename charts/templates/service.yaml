apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo881b731d-c1c5-439d-9252-f5ae09d5243c.fullname" . }}
  labels:
    {{- include "go-echo881b731d-c1c5-439d-9252-f5ae09d5243c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo881b731d-c1c5-439d-9252-f5ae09d5243c.selectorLabels" . | nindent 6 }}
