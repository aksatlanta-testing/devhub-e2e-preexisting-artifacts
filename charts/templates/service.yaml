apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb0d85a3-ef6e-4554-816e-e03dcd8ce098.fullname" . }}
  labels:
    {{- include "go-echofb0d85a3-ef6e-4554-816e-e03dcd8ce098.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb0d85a3-ef6e-4554-816e-e03dcd8ce098.selectorLabels" . | nindent 6 }}
