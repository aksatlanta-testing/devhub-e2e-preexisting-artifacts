apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8033a04-e32a-4974-9745-7b3212617fe7.fullname" . }}
  labels:
    {{- include "go-echod8033a04-e32a-4974-9745-7b3212617fe7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8033a04-e32a-4974-9745-7b3212617fe7.selectorLabels" . | nindent 6 }}
