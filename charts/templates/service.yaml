apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f09346c-ba27-48a2-804a-bc7038a03fa1.fullname" . }}
  labels:
    {{- include "go-echo6f09346c-ba27-48a2-804a-bc7038a03fa1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f09346c-ba27-48a2-804a-bc7038a03fa1.selectorLabels" . | nindent 6 }}
