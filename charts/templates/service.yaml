apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d8754e5-24f7-4ab7-9ad1-001b3920b505.fullname" . }}
  labels:
    {{- include "go-echo7d8754e5-24f7-4ab7-9ad1-001b3920b505.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d8754e5-24f7-4ab7-9ad1-001b3920b505.selectorLabels" . | nindent 6 }}
