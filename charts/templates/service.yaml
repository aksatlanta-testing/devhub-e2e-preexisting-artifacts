apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo968a9f5a-6653-4b94-8043-8bd8fdbca4e9.fullname" . }}
  labels:
    {{- include "go-echo968a9f5a-6653-4b94-8043-8bd8fdbca4e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo968a9f5a-6653-4b94-8043-8bd8fdbca4e9.selectorLabels" . | nindent 6 }}
