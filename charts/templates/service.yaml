apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9162a52-38d4-4e5f-b249-4100ea4c7512.fullname" . }}
  labels:
    {{- include "go-echoa9162a52-38d4-4e5f-b249-4100ea4c7512.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9162a52-38d4-4e5f-b249-4100ea4c7512.selectorLabels" . | nindent 6 }}
