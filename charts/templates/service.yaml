apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66cd3026-bd53-4932-a11a-e081113947c1.fullname" . }}
  labels:
    {{- include "go-echo66cd3026-bd53-4932-a11a-e081113947c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66cd3026-bd53-4932-a11a-e081113947c1.selectorLabels" . | nindent 6 }}
