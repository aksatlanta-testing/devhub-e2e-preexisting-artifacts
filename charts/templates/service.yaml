apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17f56def-5a1e-42a5-bd50-8a1b6b5587af.fullname" . }}
  labels:
    {{- include "go-echo17f56def-5a1e-42a5-bd50-8a1b6b5587af.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17f56def-5a1e-42a5-bd50-8a1b6b5587af.selectorLabels" . | nindent 6 }}
