apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo873d7a0a-1d89-4243-9a3f-477bde3a1bb5.fullname" . }}
  labels:
    {{- include "go-echo873d7a0a-1d89-4243-9a3f-477bde3a1bb5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo873d7a0a-1d89-4243-9a3f-477bde3a1bb5.selectorLabels" . | nindent 6 }}
