apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b8d884f-bd99-4f68-a222-bfbecd96b7ff.fullname" . }}
  labels:
    {{- include "go-echo7b8d884f-bd99-4f68-a222-bfbecd96b7ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b8d884f-bd99-4f68-a222-bfbecd96b7ff.selectorLabels" . | nindent 6 }}
