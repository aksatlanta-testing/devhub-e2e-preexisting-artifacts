apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo923edf8e-10f2-4526-90b6-2cb5cc64434a.fullname" . }}
  labels:
    {{- include "go-echo923edf8e-10f2-4526-90b6-2cb5cc64434a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo923edf8e-10f2-4526-90b6-2cb5cc64434a.selectorLabels" . | nindent 6 }}
