apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e039996-191b-4147-a0f3-77388587e346.fullname" . }}
  labels:
    {{- include "go-echo8e039996-191b-4147-a0f3-77388587e346.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e039996-191b-4147-a0f3-77388587e346.selectorLabels" . | nindent 6 }}
