apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc05be388-2530-4e78-9152-4d05a76e1a2e.fullname" . }}
  labels:
    {{- include "go-echoc05be388-2530-4e78-9152-4d05a76e1a2e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc05be388-2530-4e78-9152-4d05a76e1a2e.selectorLabels" . | nindent 6 }}
