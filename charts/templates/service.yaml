apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo04301631-8dca-472c-af0d-1747db1aa81b.fullname" . }}
  labels:
    {{- include "go-echo04301631-8dca-472c-af0d-1747db1aa81b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo04301631-8dca-472c-af0d-1747db1aa81b.selectorLabels" . | nindent 6 }}
