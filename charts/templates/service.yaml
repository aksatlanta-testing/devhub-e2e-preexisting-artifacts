apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c50136c-02ad-4b5c-a60b-0c3904c8b651.fullname" . }}
  labels:
    {{- include "go-echo4c50136c-02ad-4b5c-a60b-0c3904c8b651.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c50136c-02ad-4b5c-a60b-0c3904c8b651.selectorLabels" . | nindent 6 }}
