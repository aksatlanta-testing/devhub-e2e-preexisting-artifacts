apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocca01fea-c2fa-4629-8ea6-7b70450f761c.fullname" . }}
  labels:
    {{- include "go-echocca01fea-c2fa-4629-8ea6-7b70450f761c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocca01fea-c2fa-4629-8ea6-7b70450f761c.selectorLabels" . | nindent 6 }}
