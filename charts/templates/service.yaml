apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5d33bbe-665e-41b9-8218-e9efdf7d95aa.fullname" . }}
  labels:
    {{- include "go-echoc5d33bbe-665e-41b9-8218-e9efdf7d95aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5d33bbe-665e-41b9-8218-e9efdf7d95aa.selectorLabels" . | nindent 6 }}
