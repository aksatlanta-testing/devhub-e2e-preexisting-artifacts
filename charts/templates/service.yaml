apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob88f6b96-ac5f-44a3-99ca-2e0cf5817e29.fullname" . }}
  labels:
    {{- include "go-echob88f6b96-ac5f-44a3-99ca-2e0cf5817e29.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob88f6b96-ac5f-44a3-99ca-2e0cf5817e29.selectorLabels" . | nindent 6 }}
