apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fcc092a-4cbe-412b-8519-9f0cfea67a27.fullname" . }}
  labels:
    {{- include "go-echo4fcc092a-4cbe-412b-8519-9f0cfea67a27.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fcc092a-4cbe-412b-8519-9f0cfea67a27.selectorLabels" . | nindent 6 }}
