apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7569f5a3-dac0-4fbb-a10b-1cb319dccfc9.fullname" . }}
  labels:
    {{- include "go-echo7569f5a3-dac0-4fbb-a10b-1cb319dccfc9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7569f5a3-dac0-4fbb-a10b-1cb319dccfc9.selectorLabels" . | nindent 6 }}
