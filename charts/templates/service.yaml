apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo56c83e48-429f-42ac-980d-5436e7be5e75.fullname" . }}
  labels:
    {{- include "go-echo56c83e48-429f-42ac-980d-5436e7be5e75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo56c83e48-429f-42ac-980d-5436e7be5e75.selectorLabels" . | nindent 6 }}
