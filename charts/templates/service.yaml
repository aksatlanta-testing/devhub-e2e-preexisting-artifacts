apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27a0da32-bcaa-4c06-a4f3-ac2692acb6f3.fullname" . }}
  labels:
    {{- include "go-echo27a0da32-bcaa-4c06-a4f3-ac2692acb6f3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27a0da32-bcaa-4c06-a4f3-ac2692acb6f3.selectorLabels" . | nindent 6 }}
