apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea5dc4b2-4fa8-444e-9bfa-69dc010908dd.fullname" . }}
  labels:
    {{- include "go-echoea5dc4b2-4fa8-444e-9bfa-69dc010908dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea5dc4b2-4fa8-444e-9bfa-69dc010908dd.selectorLabels" . | nindent 6 }}
