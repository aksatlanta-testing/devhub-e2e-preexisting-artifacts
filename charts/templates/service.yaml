apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc64bb642-5bbe-49ea-83f5-d9f9345631be.fullname" . }}
  labels:
    {{- include "go-echoc64bb642-5bbe-49ea-83f5-d9f9345631be.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc64bb642-5bbe-49ea-83f5-d9f9345631be.selectorLabels" . | nindent 6 }}
