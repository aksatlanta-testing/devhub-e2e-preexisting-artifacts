apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0496bd8d-a2e1-4ad3-8925-79beda783476.fullname" . }}
  labels:
    {{- include "go-echo0496bd8d-a2e1-4ad3-8925-79beda783476.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0496bd8d-a2e1-4ad3-8925-79beda783476.selectorLabels" . | nindent 6 }}
