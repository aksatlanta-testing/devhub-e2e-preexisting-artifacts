apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e3bba22-f59b-4593-b268-aee0c52bbb22.fullname" . }}
  labels:
    {{- include "go-echo6e3bba22-f59b-4593-b268-aee0c52bbb22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e3bba22-f59b-4593-b268-aee0c52bbb22.selectorLabels" . | nindent 6 }}
