apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5404330e-243a-4dc8-a94e-7b3cdfe7090f.fullname" . }}
  labels:
    {{- include "go-echo5404330e-243a-4dc8-a94e-7b3cdfe7090f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5404330e-243a-4dc8-a94e-7b3cdfe7090f.selectorLabels" . | nindent 6 }}
