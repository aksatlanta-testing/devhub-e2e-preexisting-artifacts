apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo826b2d81-a71f-4051-b97e-8261a0396ea2.fullname" . }}
  labels:
    {{- include "go-echo826b2d81-a71f-4051-b97e-8261a0396ea2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo826b2d81-a71f-4051-b97e-8261a0396ea2.selectorLabels" . | nindent 6 }}
