apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5d9bafb-6ea9-41eb-93ea-a82328244823.fullname" . }}
  labels:
    {{- include "go-echoa5d9bafb-6ea9-41eb-93ea-a82328244823.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5d9bafb-6ea9-41eb-93ea-a82328244823.selectorLabels" . | nindent 6 }}
