apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo656d692f-e6ac-4b9f-963a-9f68a1a7f358.fullname" . }}
  labels:
    {{- include "go-echo656d692f-e6ac-4b9f-963a-9f68a1a7f358.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo656d692f-e6ac-4b9f-963a-9f68a1a7f358.selectorLabels" . | nindent 6 }}
