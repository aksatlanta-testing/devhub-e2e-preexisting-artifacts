apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b9ac272-f483-40a0-9819-b0cb09100cd7.fullname" . }}
  labels:
    {{- include "go-echo9b9ac272-f483-40a0-9819-b0cb09100cd7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b9ac272-f483-40a0-9819-b0cb09100cd7.selectorLabels" . | nindent 6 }}
