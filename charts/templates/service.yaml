apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23d1d5c6-bb7d-4a9f-891a-e49ccd177ccc.fullname" . }}
  labels:
    {{- include "go-echo23d1d5c6-bb7d-4a9f-891a-e49ccd177ccc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23d1d5c6-bb7d-4a9f-891a-e49ccd177ccc.selectorLabels" . | nindent 6 }}
