apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94709f17-0037-4c07-a94d-939e01895571.fullname" . }}
  labels:
    {{- include "go-echo94709f17-0037-4c07-a94d-939e01895571.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94709f17-0037-4c07-a94d-939e01895571.selectorLabels" . | nindent 6 }}
