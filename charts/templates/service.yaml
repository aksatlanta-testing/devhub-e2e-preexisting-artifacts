apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b15a38d-964c-4ae2-ac75-cdf11f6b29f3.fullname" . }}
  labels:
    {{- include "go-echo9b15a38d-964c-4ae2-ac75-cdf11f6b29f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b15a38d-964c-4ae2-ac75-cdf11f6b29f3.selectorLabels" . | nindent 6 }}
