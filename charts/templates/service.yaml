apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40ff1c68-38df-4853-8b95-d867dae34948.fullname" . }}
  labels:
    {{- include "go-echo40ff1c68-38df-4853-8b95-d867dae34948.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40ff1c68-38df-4853-8b95-d867dae34948.selectorLabels" . | nindent 6 }}
