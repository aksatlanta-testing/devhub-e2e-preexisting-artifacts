apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc25b8990-c23f-4e10-80b0-399b6080fbe5.fullname" . }}
  labels:
    {{- include "go-echoc25b8990-c23f-4e10-80b0-399b6080fbe5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc25b8990-c23f-4e10-80b0-399b6080fbe5.selectorLabels" . | nindent 6 }}
