apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof69342bb-1317-41ad-ac05-921262220db8.fullname" . }}
  labels:
    {{- include "go-echof69342bb-1317-41ad-ac05-921262220db8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof69342bb-1317-41ad-ac05-921262220db8.selectorLabels" . | nindent 6 }}
