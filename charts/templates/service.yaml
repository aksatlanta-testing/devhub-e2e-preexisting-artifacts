apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc665b7ba-6f94-4b71-b2a2-0348ba83ac6d.fullname" . }}
  labels:
    {{- include "go-echoc665b7ba-6f94-4b71-b2a2-0348ba83ac6d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc665b7ba-6f94-4b71-b2a2-0348ba83ac6d.selectorLabels" . | nindent 6 }}
