apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8a3bdaf-91fd-4fc7-a8a9-004d33df8c2e.fullname" . }}
  labels:
    {{- include "go-echoe8a3bdaf-91fd-4fc7-a8a9-004d33df8c2e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8a3bdaf-91fd-4fc7-a8a9-004d33df8c2e.selectorLabels" . | nindent 6 }}
