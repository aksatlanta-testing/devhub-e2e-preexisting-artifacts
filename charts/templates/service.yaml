apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d0852cf-ba2a-4602-8c20-ea87c9a07e8c.fullname" . }}
  labels:
    {{- include "go-echo9d0852cf-ba2a-4602-8c20-ea87c9a07e8c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d0852cf-ba2a-4602-8c20-ea87c9a07e8c.selectorLabels" . | nindent 6 }}
