apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0d0259a-2b20-4ab8-9421-e5178ce3142b.fullname" . }}
  labels:
    {{- include "go-echod0d0259a-2b20-4ab8-9421-e5178ce3142b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0d0259a-2b20-4ab8-9421-e5178ce3142b.selectorLabels" . | nindent 6 }}
