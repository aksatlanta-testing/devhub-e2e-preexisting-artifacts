apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo127d94fa-1478-4b31-b831-3ab725fb94ab.fullname" . }}
  labels:
    {{- include "go-echo127d94fa-1478-4b31-b831-3ab725fb94ab.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo127d94fa-1478-4b31-b831-3ab725fb94ab.selectorLabels" . | nindent 6 }}
