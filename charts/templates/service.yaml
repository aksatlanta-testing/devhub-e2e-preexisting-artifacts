apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01cc5c79-aae5-4283-a4f4-8d4626e1bbb4.fullname" . }}
  labels:
    {{- include "go-echo01cc5c79-aae5-4283-a4f4-8d4626e1bbb4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01cc5c79-aae5-4283-a4f4-8d4626e1bbb4.selectorLabels" . | nindent 6 }}
