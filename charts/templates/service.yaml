apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b5f85f1-49fb-4214-a2dc-b95ef83c0fc1.fullname" . }}
  labels:
    {{- include "go-echo5b5f85f1-49fb-4214-a2dc-b95ef83c0fc1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b5f85f1-49fb-4214-a2dc-b95ef83c0fc1.selectorLabels" . | nindent 6 }}
