apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo668d0825-0d21-4a84-8df3-46aad200e25b.fullname" . }}
  labels:
    {{- include "go-echo668d0825-0d21-4a84-8df3-46aad200e25b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo668d0825-0d21-4a84-8df3-46aad200e25b.selectorLabels" . | nindent 6 }}
