apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf3acf21-4543-4941-82ba-f5894b27dbe1.fullname" . }}
  labels:
    {{- include "go-echocf3acf21-4543-4941-82ba-f5894b27dbe1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf3acf21-4543-4941-82ba-f5894b27dbe1.selectorLabels" . | nindent 6 }}
