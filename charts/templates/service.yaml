apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof67f1916-15ae-4389-9c9f-c191b88e0cd5.fullname" . }}
  labels:
    {{- include "go-echof67f1916-15ae-4389-9c9f-c191b88e0cd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof67f1916-15ae-4389-9c9f-c191b88e0cd5.selectorLabels" . | nindent 6 }}
