apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c3a3fa5-b621-4432-bf6b-259ee8ce492b.fullname" . }}
  labels:
    {{- include "go-echo7c3a3fa5-b621-4432-bf6b-259ee8ce492b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c3a3fa5-b621-4432-bf6b-259ee8ce492b.selectorLabels" . | nindent 6 }}
