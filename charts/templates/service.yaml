apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07b8ab45-e4b4-48e1-9f07-6c56a50af5f8.fullname" . }}
  labels:
    {{- include "go-echo07b8ab45-e4b4-48e1-9f07-6c56a50af5f8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07b8ab45-e4b4-48e1-9f07-6c56a50af5f8.selectorLabels" . | nindent 6 }}
