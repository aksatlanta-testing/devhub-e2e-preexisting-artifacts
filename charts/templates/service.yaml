apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ff75550-4a67-44e2-8df2-a50bc2ece882.fullname" . }}
  labels:
    {{- include "go-echo1ff75550-4a67-44e2-8df2-a50bc2ece882.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ff75550-4a67-44e2-8df2-a50bc2ece882.selectorLabels" . | nindent 6 }}
