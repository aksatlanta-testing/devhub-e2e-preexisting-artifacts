apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo989a6530-c9d6-476e-a614-f98fb9fdf108.fullname" . }}
  labels:
    {{- include "go-echo989a6530-c9d6-476e-a614-f98fb9fdf108.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo989a6530-c9d6-476e-a614-f98fb9fdf108.selectorLabels" . | nindent 6 }}
