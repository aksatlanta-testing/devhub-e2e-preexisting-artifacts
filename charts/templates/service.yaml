apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo031a4b62-9abd-44a1-ab68-5f1c8d5534cc.fullname" . }}
  labels:
    {{- include "go-echo031a4b62-9abd-44a1-ab68-5f1c8d5534cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo031a4b62-9abd-44a1-ab68-5f1c8d5534cc.selectorLabels" . | nindent 6 }}
