apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo139c57cc-e84e-46e3-8606-c72dfc736b60.fullname" . }}
  labels:
    {{- include "go-echo139c57cc-e84e-46e3-8606-c72dfc736b60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo139c57cc-e84e-46e3-8606-c72dfc736b60.selectorLabels" . | nindent 6 }}
