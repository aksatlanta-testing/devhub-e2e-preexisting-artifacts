apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b3afa39-07af-4e1f-ba56-30ea7094d7e7.fullname" . }}
  labels:
    {{- include "go-echo0b3afa39-07af-4e1f-ba56-30ea7094d7e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b3afa39-07af-4e1f-ba56-30ea7094d7e7.selectorLabels" . | nindent 6 }}
