apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob674e48b-e7d7-4c7e-9d70-4f8a4da9786d.fullname" . }}
  labels:
    {{- include "go-echob674e48b-e7d7-4c7e-9d70-4f8a4da9786d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob674e48b-e7d7-4c7e-9d70-4f8a4da9786d.selectorLabels" . | nindent 6 }}
