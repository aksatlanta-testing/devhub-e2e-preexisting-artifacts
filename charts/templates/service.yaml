apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof733dfea-c570-49c8-adfa-db5d112ffab7.fullname" . }}
  labels:
    {{- include "go-echof733dfea-c570-49c8-adfa-db5d112ffab7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof733dfea-c570-49c8-adfa-db5d112ffab7.selectorLabels" . | nindent 6 }}
