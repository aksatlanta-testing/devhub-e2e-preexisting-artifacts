apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50809915-405e-4d4c-9535-8af72adb679b.fullname" . }}
  labels:
    {{- include "go-echo50809915-405e-4d4c-9535-8af72adb679b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50809915-405e-4d4c-9535-8af72adb679b.selectorLabels" . | nindent 6 }}
