apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaea8e22a-86ee-40f8-b192-d00761d0e027.fullname" . }}
  labels:
    {{- include "go-echoaea8e22a-86ee-40f8-b192-d00761d0e027.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaea8e22a-86ee-40f8-b192-d00761d0e027.selectorLabels" . | nindent 6 }}
