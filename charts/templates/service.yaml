apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod55cd782-17b5-4f21-9a75-5e2e98993d54.fullname" . }}
  labels:
    {{- include "go-echod55cd782-17b5-4f21-9a75-5e2e98993d54.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod55cd782-17b5-4f21-9a75-5e2e98993d54.selectorLabels" . | nindent 6 }}
