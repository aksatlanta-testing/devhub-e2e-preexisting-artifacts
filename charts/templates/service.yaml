apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f0e61ed-65ed-4796-a073-5f9e10189714.fullname" . }}
  labels:
    {{- include "go-echo8f0e61ed-65ed-4796-a073-5f9e10189714.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f0e61ed-65ed-4796-a073-5f9e10189714.selectorLabels" . | nindent 6 }}
