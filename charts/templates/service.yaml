apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9c398d6-b5dd-427f-bf40-1b9720e413e4.fullname" . }}
  labels:
    {{- include "go-echoc9c398d6-b5dd-427f-bf40-1b9720e413e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9c398d6-b5dd-427f-bf40-1b9720e413e4.selectorLabels" . | nindent 6 }}
