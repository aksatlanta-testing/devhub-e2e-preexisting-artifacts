apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e9ff7ee-9b2b-44da-8176-02a79c45d94a.fullname" . }}
  labels:
    {{- include "go-echo6e9ff7ee-9b2b-44da-8176-02a79c45d94a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e9ff7ee-9b2b-44da-8176-02a79c45d94a.selectorLabels" . | nindent 6 }}
