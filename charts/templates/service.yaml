apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06cc9911-932e-4492-a122-f41e433d1bf5.fullname" . }}
  labels:
    {{- include "go-echo06cc9911-932e-4492-a122-f41e433d1bf5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06cc9911-932e-4492-a122-f41e433d1bf5.selectorLabels" . | nindent 6 }}
