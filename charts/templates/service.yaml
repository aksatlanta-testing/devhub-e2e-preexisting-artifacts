apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ce0379e-619d-4a96-8b96-fbb2adfa6a2d.fullname" . }}
  labels:
    {{- include "go-echo7ce0379e-619d-4a96-8b96-fbb2adfa6a2d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ce0379e-619d-4a96-8b96-fbb2adfa6a2d.selectorLabels" . | nindent 6 }}
