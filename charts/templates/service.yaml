apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0618415-b0ea-45c4-9725-1b54e4e57358.fullname" . }}
  labels:
    {{- include "go-echod0618415-b0ea-45c4-9725-1b54e4e57358.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0618415-b0ea-45c4-9725-1b54e4e57358.selectorLabels" . | nindent 6 }}
