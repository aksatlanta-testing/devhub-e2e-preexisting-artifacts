apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe14fbb0a-1550-4d0e-a9e6-559f17ae250f.fullname" . }}
  labels:
    {{- include "go-echoe14fbb0a-1550-4d0e-a9e6-559f17ae250f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe14fbb0a-1550-4d0e-a9e6-559f17ae250f.selectorLabels" . | nindent 6 }}
