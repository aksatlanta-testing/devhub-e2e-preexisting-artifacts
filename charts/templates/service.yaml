apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1858dea1-35b0-471c-b0be-c4f74b976e06.fullname" . }}
  labels:
    {{- include "go-echo1858dea1-35b0-471c-b0be-c4f74b976e06.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1858dea1-35b0-471c-b0be-c4f74b976e06.selectorLabels" . | nindent 6 }}
