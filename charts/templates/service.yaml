apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5c16fdc-4f7e-49ad-b33d-c23d8cb15a06.fullname" . }}
  labels:
    {{- include "go-echod5c16fdc-4f7e-49ad-b33d-c23d8cb15a06.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5c16fdc-4f7e-49ad-b33d-c23d8cb15a06.selectorLabels" . | nindent 6 }}
