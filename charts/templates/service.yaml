apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c4a372a-6556-4429-a1b4-877c7e395248.fullname" . }}
  labels:
    {{- include "go-echo6c4a372a-6556-4429-a1b4-877c7e395248.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c4a372a-6556-4429-a1b4-877c7e395248.selectorLabels" . | nindent 6 }}
