apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5909014-9661-4bde-b690-412bcf3c0b31.fullname" . }}
  labels:
    {{- include "go-echoa5909014-9661-4bde-b690-412bcf3c0b31.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5909014-9661-4bde-b690-412bcf3c0b31.selectorLabels" . | nindent 6 }}
