apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe18c78f0-7e37-43fd-8ed6-e38fc4f4b4f7.fullname" . }}
  labels:
    {{- include "go-echoe18c78f0-7e37-43fd-8ed6-e38fc4f4b4f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe18c78f0-7e37-43fd-8ed6-e38fc4f4b4f7.selectorLabels" . | nindent 6 }}
