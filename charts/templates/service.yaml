apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac2585a5-ff04-4f8e-8e90-185414d755f6.fullname" . }}
  labels:
    {{- include "go-echoac2585a5-ff04-4f8e-8e90-185414d755f6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac2585a5-ff04-4f8e-8e90-185414d755f6.selectorLabels" . | nindent 6 }}
