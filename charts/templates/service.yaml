apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffd432ae-ccb0-4d26-bbf4-9184c803e8a5.fullname" . }}
  labels:
    {{- include "go-echoffd432ae-ccb0-4d26-bbf4-9184c803e8a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffd432ae-ccb0-4d26-bbf4-9184c803e8a5.selectorLabels" . | nindent 6 }}
