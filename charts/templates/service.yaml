apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c587ff4-ccdb-43d3-b844-90017c4e9e9f.fullname" . }}
  labels:
    {{- include "go-echo7c587ff4-ccdb-43d3-b844-90017c4e9e9f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c587ff4-ccdb-43d3-b844-90017c4e9e9f.selectorLabels" . | nindent 6 }}
