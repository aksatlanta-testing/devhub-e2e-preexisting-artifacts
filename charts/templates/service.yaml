apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07880e3d-477c-464a-b6ba-a3d8600d4944.fullname" . }}
  labels:
    {{- include "go-echo07880e3d-477c-464a-b6ba-a3d8600d4944.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07880e3d-477c-464a-b6ba-a3d8600d4944.selectorLabels" . | nindent 6 }}
