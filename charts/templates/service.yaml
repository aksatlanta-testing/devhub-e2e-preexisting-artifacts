apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaaee9dc4-27fe-4161-b212-652eebc53c3e.fullname" . }}
  labels:
    {{- include "go-echoaaee9dc4-27fe-4161-b212-652eebc53c3e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaaee9dc4-27fe-4161-b212-652eebc53c3e.selectorLabels" . | nindent 6 }}
