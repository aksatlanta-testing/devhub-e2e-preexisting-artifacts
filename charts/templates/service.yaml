apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6dd9578b-b020-4ee7-9e65-c4d37ad706d0.fullname" . }}
  labels:
    {{- include "go-echo6dd9578b-b020-4ee7-9e65-c4d37ad706d0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6dd9578b-b020-4ee7-9e65-c4d37ad706d0.selectorLabels" . | nindent 6 }}
