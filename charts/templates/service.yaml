apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d41b2aa-5b9e-4fac-895a-4a45918380ac.fullname" . }}
  labels:
    {{- include "go-echo8d41b2aa-5b9e-4fac-895a-4a45918380ac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d41b2aa-5b9e-4fac-895a-4a45918380ac.selectorLabels" . | nindent 6 }}
