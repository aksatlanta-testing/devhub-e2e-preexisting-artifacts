apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73e52a5d-c9c7-4b1f-9532-0c7fab2165c8.fullname" . }}
  labels:
    {{- include "go-echo73e52a5d-c9c7-4b1f-9532-0c7fab2165c8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73e52a5d-c9c7-4b1f-9532-0c7fab2165c8.selectorLabels" . | nindent 6 }}
