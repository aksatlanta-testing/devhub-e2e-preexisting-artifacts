apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad567de7-7d39-47be-b4ff-ed82113d1635.fullname" . }}
  labels:
    {{- include "go-echoad567de7-7d39-47be-b4ff-ed82113d1635.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad567de7-7d39-47be-b4ff-ed82113d1635.selectorLabels" . | nindent 6 }}
