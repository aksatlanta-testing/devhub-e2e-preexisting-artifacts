apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36a1911a-e5bb-4028-bf9b-c2f248818e85.fullname" . }}
  labels:
    {{- include "go-echo36a1911a-e5bb-4028-bf9b-c2f248818e85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36a1911a-e5bb-4028-bf9b-c2f248818e85.selectorLabels" . | nindent 6 }}
