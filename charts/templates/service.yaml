apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo93a9510b-6aff-450c-b6ff-cc4f799de3c2.fullname" . }}
  labels:
    {{- include "go-echo93a9510b-6aff-450c-b6ff-cc4f799de3c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo93a9510b-6aff-450c-b6ff-cc4f799de3c2.selectorLabels" . | nindent 6 }}
