apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ab25648-0d4c-45ac-ae32-9021bd2fed4b.fullname" . }}
  labels:
    {{- include "go-echo9ab25648-0d4c-45ac-ae32-9021bd2fed4b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ab25648-0d4c-45ac-ae32-9021bd2fed4b.selectorLabels" . | nindent 6 }}
