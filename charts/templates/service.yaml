apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81849e77-b43a-499b-bc8f-9dfaa186b891.fullname" . }}
  labels:
    {{- include "go-echo81849e77-b43a-499b-bc8f-9dfaa186b891.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81849e77-b43a-499b-bc8f-9dfaa186b891.selectorLabels" . | nindent 6 }}
