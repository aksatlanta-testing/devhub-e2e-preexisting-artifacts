apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5b867e8-d44f-4595-876d-02e2e654a850.fullname" . }}
  labels:
    {{- include "go-echoe5b867e8-d44f-4595-876d-02e2e654a850.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5b867e8-d44f-4595-876d-02e2e654a850.selectorLabels" . | nindent 6 }}
