apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6c5ef9c-76df-44e9-8e1c-fb8460ecf73a.fullname" . }}
  labels:
    {{- include "go-echof6c5ef9c-76df-44e9-8e1c-fb8460ecf73a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6c5ef9c-76df-44e9-8e1c-fb8460ecf73a.selectorLabels" . | nindent 6 }}
