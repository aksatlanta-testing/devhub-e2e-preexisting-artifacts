apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d20b005-3f03-4f12-9ea4-924beda4e703.fullname" . }}
  labels:
    {{- include "go-echo3d20b005-3f03-4f12-9ea4-924beda4e703.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d20b005-3f03-4f12-9ea4-924beda4e703.selectorLabels" . | nindent 6 }}
