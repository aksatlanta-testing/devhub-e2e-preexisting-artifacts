apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00dc4a76-a9c6-4273-865e-6a32d8b0dc7a.fullname" . }}
  labels:
    {{- include "go-echo00dc4a76-a9c6-4273-865e-6a32d8b0dc7a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00dc4a76-a9c6-4273-865e-6a32d8b0dc7a.selectorLabels" . | nindent 6 }}
