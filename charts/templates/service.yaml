apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3092cfbf-8d22-43e3-ab82-2ae7dc312f12.fullname" . }}
  labels:
    {{- include "go-echo3092cfbf-8d22-43e3-ab82-2ae7dc312f12.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3092cfbf-8d22-43e3-ab82-2ae7dc312f12.selectorLabels" . | nindent 6 }}
