apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ce96884-a92c-44e8-b320-11f923dd4ab3.fullname" . }}
  labels:
    {{- include "go-echo2ce96884-a92c-44e8-b320-11f923dd4ab3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ce96884-a92c-44e8-b320-11f923dd4ab3.selectorLabels" . | nindent 6 }}
