apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2022b02-a655-4949-94c3-dc7a8f6bf58b.fullname" . }}
  labels:
    {{- include "go-echob2022b02-a655-4949-94c3-dc7a8f6bf58b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2022b02-a655-4949-94c3-dc7a8f6bf58b.selectorLabels" . | nindent 6 }}
