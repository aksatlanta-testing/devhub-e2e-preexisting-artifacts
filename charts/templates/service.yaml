apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31c97cc0-b42b-4813-861b-656e81a9bc52.fullname" . }}
  labels:
    {{- include "go-echo31c97cc0-b42b-4813-861b-656e81a9bc52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31c97cc0-b42b-4813-861b-656e81a9bc52.selectorLabels" . | nindent 6 }}
