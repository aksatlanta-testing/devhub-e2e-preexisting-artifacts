apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof404d970-59ed-4085-adb4-4ae5b0d6fdab.fullname" . }}
  labels:
    {{- include "go-echof404d970-59ed-4085-adb4-4ae5b0d6fdab.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof404d970-59ed-4085-adb4-4ae5b0d6fdab.selectorLabels" . | nindent 6 }}
