apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a1e98a7-1f03-4753-a1c2-33b09e8208b2.fullname" . }}
  labels:
    {{- include "go-echo4a1e98a7-1f03-4753-a1c2-33b09e8208b2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a1e98a7-1f03-4753-a1c2-33b09e8208b2.selectorLabels" . | nindent 6 }}
