apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7641a24-9ad4-4b38-bff2-b1057ae2c2b9.fullname" . }}
  labels:
    {{- include "go-echoc7641a24-9ad4-4b38-bff2-b1057ae2c2b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7641a24-9ad4-4b38-bff2-b1057ae2c2b9.selectorLabels" . | nindent 6 }}
