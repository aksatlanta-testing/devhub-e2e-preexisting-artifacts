apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66fc2296-0f5d-4fd5-9e48-c09b7dfee66d.fullname" . }}
  labels:
    {{- include "go-echo66fc2296-0f5d-4fd5-9e48-c09b7dfee66d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66fc2296-0f5d-4fd5-9e48-c09b7dfee66d.selectorLabels" . | nindent 6 }}
