apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce93ec1b-0d0f-4515-8006-3ce140315d1b.fullname" . }}
  labels:
    {{- include "go-echoce93ec1b-0d0f-4515-8006-3ce140315d1b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce93ec1b-0d0f-4515-8006-3ce140315d1b.selectorLabels" . | nindent 6 }}
