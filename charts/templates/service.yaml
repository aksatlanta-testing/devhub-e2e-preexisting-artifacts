apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a1c2efd-6aeb-484e-8ab3-9778c83532a9.fullname" . }}
  labels:
    {{- include "go-echo0a1c2efd-6aeb-484e-8ab3-9778c83532a9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a1c2efd-6aeb-484e-8ab3-9778c83532a9.selectorLabels" . | nindent 6 }}
