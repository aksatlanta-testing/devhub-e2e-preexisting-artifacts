apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52e2a49b-d288-45a0-af19-4e6b9b3b01b8.fullname" . }}
  labels:
    {{- include "go-echo52e2a49b-d288-45a0-af19-4e6b9b3b01b8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52e2a49b-d288-45a0-af19-4e6b9b3b01b8.selectorLabels" . | nindent 6 }}
