apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fc0c2de-d43c-4000-b8a1-7b7368ff8d40.fullname" . }}
  labels:
    {{- include "go-echo9fc0c2de-d43c-4000-b8a1-7b7368ff8d40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fc0c2de-d43c-4000-b8a1-7b7368ff8d40.selectorLabels" . | nindent 6 }}
