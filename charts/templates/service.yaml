apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2eb6e51-3012-4026-9bd1-306880961921.fullname" . }}
  labels:
    {{- include "go-echob2eb6e51-3012-4026-9bd1-306880961921.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2eb6e51-3012-4026-9bd1-306880961921.selectorLabels" . | nindent 6 }}
