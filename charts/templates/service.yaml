apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3498d93-f2a0-4633-bb26-2347fb7d4126.fullname" . }}
  labels:
    {{- include "go-echob3498d93-f2a0-4633-bb26-2347fb7d4126.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3498d93-f2a0-4633-bb26-2347fb7d4126.selectorLabels" . | nindent 6 }}
