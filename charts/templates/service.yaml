apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo731b6e61-add3-49cc-8652-cd4a270488cc.fullname" . }}
  labels:
    {{- include "go-echo731b6e61-add3-49cc-8652-cd4a270488cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo731b6e61-add3-49cc-8652-cd4a270488cc.selectorLabels" . | nindent 6 }}
