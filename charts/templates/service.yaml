apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof218f553-bd74-4a88-ba10-ba2769d52fef.fullname" . }}
  labels:
    {{- include "go-echof218f553-bd74-4a88-ba10-ba2769d52fef.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof218f553-bd74-4a88-ba10-ba2769d52fef.selectorLabels" . | nindent 6 }}
