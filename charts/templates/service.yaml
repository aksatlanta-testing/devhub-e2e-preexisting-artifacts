apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1882c17-0b89-45bb-a49f-47e1c559daf7.fullname" . }}
  labels:
    {{- include "go-echoc1882c17-0b89-45bb-a49f-47e1c559daf7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1882c17-0b89-45bb-a49f-47e1c559daf7.selectorLabels" . | nindent 6 }}
