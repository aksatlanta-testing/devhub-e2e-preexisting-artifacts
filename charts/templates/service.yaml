apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f4b1a81-7a68-4912-9cb6-c168ce3ffe18.fullname" . }}
  labels:
    {{- include "go-echo3f4b1a81-7a68-4912-9cb6-c168ce3ffe18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f4b1a81-7a68-4912-9cb6-c168ce3ffe18.selectorLabels" . | nindent 6 }}
