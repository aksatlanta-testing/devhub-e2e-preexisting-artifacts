apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe56d9be2-daee-48d9-af38-e1717a0000f0.fullname" . }}
  labels:
    {{- include "go-echoe56d9be2-daee-48d9-af38-e1717a0000f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe56d9be2-daee-48d9-af38-e1717a0000f0.selectorLabels" . | nindent 6 }}
