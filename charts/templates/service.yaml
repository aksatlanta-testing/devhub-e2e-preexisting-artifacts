apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7129d37e-0e24-4bf3-b514-333ba5a32878.fullname" . }}
  labels:
    {{- include "go-echo7129d37e-0e24-4bf3-b514-333ba5a32878.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7129d37e-0e24-4bf3-b514-333ba5a32878.selectorLabels" . | nindent 6 }}
