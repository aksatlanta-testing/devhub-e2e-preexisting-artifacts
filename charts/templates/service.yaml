apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b931919-c773-4bbe-833f-bc5ae652d77d.fullname" . }}
  labels:
    {{- include "go-echo9b931919-c773-4bbe-833f-bc5ae652d77d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
