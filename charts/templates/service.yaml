apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8dc93676-2ab2-4b93-bb97-772f6b5ec2e6.fullname" . }}
  labels:
    {{- include "go-echo8dc93676-2ab2-4b93-bb97-772f6b5ec2e6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8dc93676-2ab2-4b93-bb97-772f6b5ec2e6.selectorLabels" . | nindent 6 }}
