apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5ce5b23-b9e6-4818-a181-67bf2cf7550d.fullname" . }}
  labels:
    {{- include "go-echoe5ce5b23-b9e6-4818-a181-67bf2cf7550d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5ce5b23-b9e6-4818-a181-67bf2cf7550d.selectorLabels" . | nindent 6 }}
