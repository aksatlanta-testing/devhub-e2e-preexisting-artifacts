apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94839331-d0ff-4851-a432-dcaaddc7055e.fullname" . }}
  labels:
    {{- include "go-echo94839331-d0ff-4851-a432-dcaaddc7055e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94839331-d0ff-4851-a432-dcaaddc7055e.selectorLabels" . | nindent 6 }}
