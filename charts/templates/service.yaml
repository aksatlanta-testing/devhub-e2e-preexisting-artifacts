apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2ba6f98-ec59-4d98-9414-65f9acacaddb.fullname" . }}
  labels:
    {{- include "go-echoe2ba6f98-ec59-4d98-9414-65f9acacaddb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2ba6f98-ec59-4d98-9414-65f9acacaddb.selectorLabels" . | nindent 6 }}
