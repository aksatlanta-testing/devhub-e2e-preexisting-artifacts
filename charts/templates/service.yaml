apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b031fed-e925-4daa-b4d1-f4c711f218eb.fullname" . }}
  labels:
    {{- include "go-echo3b031fed-e925-4daa-b4d1-f4c711f218eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b031fed-e925-4daa-b4d1-f4c711f218eb.selectorLabels" . | nindent 6 }}
