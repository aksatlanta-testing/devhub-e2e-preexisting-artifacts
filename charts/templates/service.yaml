apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo767070c1-2db8-4512-b229-9c287787a1d7.fullname" . }}
  labels:
    {{- include "go-echo767070c1-2db8-4512-b229-9c287787a1d7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo767070c1-2db8-4512-b229-9c287787a1d7.selectorLabels" . | nindent 6 }}
