apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa3a4997-f510-405e-914c-24b4a6fc8048.fullname" . }}
  labels:
    {{- include "go-echofa3a4997-f510-405e-914c-24b4a6fc8048.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa3a4997-f510-405e-914c-24b4a6fc8048.selectorLabels" . | nindent 6 }}
