apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cb71ee9-5dc7-4404-90db-235331d37a49.fullname" . }}
  labels:
    {{- include "go-echo4cb71ee9-5dc7-4404-90db-235331d37a49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cb71ee9-5dc7-4404-90db-235331d37a49.selectorLabels" . | nindent 6 }}
