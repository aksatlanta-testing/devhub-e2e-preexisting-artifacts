apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89bdd5bf-0a58-4070-9df2-22900152a6ea.fullname" . }}
  labels:
    {{- include "go-echo89bdd5bf-0a58-4070-9df2-22900152a6ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89bdd5bf-0a58-4070-9df2-22900152a6ea.selectorLabels" . | nindent 6 }}
