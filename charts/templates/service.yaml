apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8407f50-6d64-44c7-993e-4c5942a81a68.fullname" . }}
  labels:
    {{- include "go-echoa8407f50-6d64-44c7-993e-4c5942a81a68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8407f50-6d64-44c7-993e-4c5942a81a68.selectorLabels" . | nindent 6 }}
