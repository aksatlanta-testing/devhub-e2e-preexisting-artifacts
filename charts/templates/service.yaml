apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo787f5151-7307-4487-bbf3-6f5d28cc24b2.fullname" . }}
  labels:
    {{- include "go-echo787f5151-7307-4487-bbf3-6f5d28cc24b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo787f5151-7307-4487-bbf3-6f5d28cc24b2.selectorLabels" . | nindent 6 }}
