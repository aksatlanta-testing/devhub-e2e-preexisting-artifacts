apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac6f0fa6-2726-4a58-88c0-1dd1d76f1a7f.fullname" . }}
  labels:
    {{- include "go-echoac6f0fa6-2726-4a58-88c0-1dd1d76f1a7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac6f0fa6-2726-4a58-88c0-1dd1d76f1a7f.selectorLabels" . | nindent 6 }}
