apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6e26224-4d2c-47f9-8b8d-4f6968697b29.fullname" . }}
  labels:
    {{- include "go-echoe6e26224-4d2c-47f9-8b8d-4f6968697b29.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6e26224-4d2c-47f9-8b8d-4f6968697b29.selectorLabels" . | nindent 6 }}
