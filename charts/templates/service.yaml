apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee924fdc-8655-4e88-b73f-e65d16a9b8ce.fullname" . }}
  labels:
    {{- include "go-echoee924fdc-8655-4e88-b73f-e65d16a9b8ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee924fdc-8655-4e88-b73f-e65d16a9b8ce.selectorLabels" . | nindent 6 }}
