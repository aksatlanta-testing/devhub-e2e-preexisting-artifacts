apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9cf0d8d1-d741-4d80-9001-0db3aeffe2fb.fullname" . }}
  labels:
    {{- include "go-echo9cf0d8d1-d741-4d80-9001-0db3aeffe2fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9cf0d8d1-d741-4d80-9001-0db3aeffe2fb.selectorLabels" . | nindent 6 }}
