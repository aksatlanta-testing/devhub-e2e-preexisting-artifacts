apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48f2da1a-bc6b-417b-b774-dfa15babf6cc.fullname" . }}
  labels:
    {{- include "go-echo48f2da1a-bc6b-417b-b774-dfa15babf6cc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48f2da1a-bc6b-417b-b774-dfa15babf6cc.selectorLabels" . | nindent 6 }}
