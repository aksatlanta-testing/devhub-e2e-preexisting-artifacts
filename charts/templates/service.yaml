apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44d13f3e-9843-4edc-844f-3722135e77b7.fullname" . }}
  labels:
    {{- include "go-echo44d13f3e-9843-4edc-844f-3722135e77b7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44d13f3e-9843-4edc-844f-3722135e77b7.selectorLabels" . | nindent 6 }}
