apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc29aa1fe-d9a3-4327-ba62-484382cfd006.fullname" . }}
  labels:
    {{- include "go-echoc29aa1fe-d9a3-4327-ba62-484382cfd006.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc29aa1fe-d9a3-4327-ba62-484382cfd006.selectorLabels" . | nindent 6 }}
