apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f72e905-2af5-4a7c-b159-47b9503b353a.fullname" . }}
  labels:
    {{- include "go-echo8f72e905-2af5-4a7c-b159-47b9503b353a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f72e905-2af5-4a7c-b159-47b9503b353a.selectorLabels" . | nindent 6 }}
