apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo292252bc-8133-4463-8d7e-e275c0c5be57.fullname" . }}
  labels:
    {{- include "go-echo292252bc-8133-4463-8d7e-e275c0c5be57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo292252bc-8133-4463-8d7e-e275c0c5be57.selectorLabels" . | nindent 6 }}
