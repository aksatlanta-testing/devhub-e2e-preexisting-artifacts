apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo16baa7e6-3d40-44c5-9227-c6e5d2742f0f.fullname" . }}
  labels:
    {{- include "go-echo16baa7e6-3d40-44c5-9227-c6e5d2742f0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo16baa7e6-3d40-44c5-9227-c6e5d2742f0f.selectorLabels" . | nindent 6 }}
