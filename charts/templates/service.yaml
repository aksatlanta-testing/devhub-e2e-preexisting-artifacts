apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35f602bd-c8b5-4429-849c-9d49519123ea.fullname" . }}
  labels:
    {{- include "go-echo35f602bd-c8b5-4429-849c-9d49519123ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35f602bd-c8b5-4429-849c-9d49519123ea.selectorLabels" . | nindent 6 }}
