apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42f9125f-3ba5-44f8-8e96-17c27b8e3187.fullname" . }}
  labels:
    {{- include "go-echo42f9125f-3ba5-44f8-8e96-17c27b8e3187.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42f9125f-3ba5-44f8-8e96-17c27b8e3187.selectorLabels" . | nindent 6 }}
