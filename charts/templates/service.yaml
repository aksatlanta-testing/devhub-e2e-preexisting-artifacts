apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob262f0da-3e57-48cd-a5ed-891d121dc4be.fullname" . }}
  labels:
    {{- include "go-echob262f0da-3e57-48cd-a5ed-891d121dc4be.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob262f0da-3e57-48cd-a5ed-891d121dc4be.selectorLabels" . | nindent 6 }}
