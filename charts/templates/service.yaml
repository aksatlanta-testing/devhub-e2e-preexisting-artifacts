apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d6ae5b3-5c4a-4a36-9870-af9e4579c840.fullname" . }}
  labels:
    {{- include "go-echo9d6ae5b3-5c4a-4a36-9870-af9e4579c840.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d6ae5b3-5c4a-4a36-9870-af9e4579c840.selectorLabels" . | nindent 6 }}
