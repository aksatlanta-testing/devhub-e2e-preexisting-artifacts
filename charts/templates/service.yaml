apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47e106e7-3ee5-4d61-8258-111a94690c8a.fullname" . }}
  labels:
    {{- include "go-echo47e106e7-3ee5-4d61-8258-111a94690c8a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47e106e7-3ee5-4d61-8258-111a94690c8a.selectorLabels" . | nindent 6 }}
