apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo637e543a-6c56-4b02-b9b8-d86b9ff46b2e.fullname" . }}
  labels:
    {{- include "go-echo637e543a-6c56-4b02-b9b8-d86b9ff46b2e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo637e543a-6c56-4b02-b9b8-d86b9ff46b2e.selectorLabels" . | nindent 6 }}
