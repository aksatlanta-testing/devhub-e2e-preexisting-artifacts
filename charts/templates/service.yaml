apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68ab618d-88ee-4302-b4db-6c3d2d3ebb75.fullname" . }}
  labels:
    {{- include "go-echo68ab618d-88ee-4302-b4db-6c3d2d3ebb75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68ab618d-88ee-4302-b4db-6c3d2d3ebb75.selectorLabels" . | nindent 6 }}
