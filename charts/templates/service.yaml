apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob73f0e72-409f-4582-a2bf-7c1ce9f9b98e.fullname" . }}
  labels:
    {{- include "go-echob73f0e72-409f-4582-a2bf-7c1ce9f9b98e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob73f0e72-409f-4582-a2bf-7c1ce9f9b98e.selectorLabels" . | nindent 6 }}
