apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3cb0fd1b-249c-473f-a185-900dd539d7cb.fullname" . }}
  labels:
    {{- include "go-echo3cb0fd1b-249c-473f-a185-900dd539d7cb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3cb0fd1b-249c-473f-a185-900dd539d7cb.selectorLabels" . | nindent 6 }}
