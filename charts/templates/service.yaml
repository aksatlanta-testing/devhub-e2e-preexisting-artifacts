apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ae1bbda-7e6b-4d5f-83af-70212f59ca36.fullname" . }}
  labels:
    {{- include "go-echo4ae1bbda-7e6b-4d5f-83af-70212f59ca36.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ae1bbda-7e6b-4d5f-83af-70212f59ca36.selectorLabels" . | nindent 6 }}
