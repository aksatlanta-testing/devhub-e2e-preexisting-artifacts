apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0273a089-0236-4c2a-8962-6c1a64adf8d4.fullname" . }}
  labels:
    {{- include "go-echo0273a089-0236-4c2a-8962-6c1a64adf8d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0273a089-0236-4c2a-8962-6c1a64adf8d4.selectorLabels" . | nindent 6 }}
