apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9424c4c-b613-488f-9d94-f8165ffc2de9.fullname" . }}
  labels:
    {{- include "go-echoe9424c4c-b613-488f-9d94-f8165ffc2de9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9424c4c-b613-488f-9d94-f8165ffc2de9.selectorLabels" . | nindent 6 }}
