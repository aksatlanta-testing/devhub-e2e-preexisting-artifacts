apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo715e1489-c85c-4e24-89c6-05b53d2da4d8.fullname" . }}
  labels:
    {{- include "go-echo715e1489-c85c-4e24-89c6-05b53d2da4d8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo715e1489-c85c-4e24-89c6-05b53d2da4d8.selectorLabels" . | nindent 6 }}
