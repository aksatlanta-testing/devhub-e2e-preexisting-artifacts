apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77067cc7-82f6-4ff1-8f62-0de6d0d5ae31.fullname" . }}
  labels:
    {{- include "go-echo77067cc7-82f6-4ff1-8f62-0de6d0d5ae31.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77067cc7-82f6-4ff1-8f62-0de6d0d5ae31.selectorLabels" . | nindent 6 }}
