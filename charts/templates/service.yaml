apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cf0f0bf-5007-4934-82a2-c7215919f978.fullname" . }}
  labels:
    {{- include "go-echo1cf0f0bf-5007-4934-82a2-c7215919f978.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cf0f0bf-5007-4934-82a2-c7215919f978.selectorLabels" . | nindent 6 }}
