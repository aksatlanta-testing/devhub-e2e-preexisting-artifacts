apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb5a9136-7fc8-4e39-a17b-e438494f5e27.fullname" . }}
  labels:
    {{- include "go-echobb5a9136-7fc8-4e39-a17b-e438494f5e27.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb5a9136-7fc8-4e39-a17b-e438494f5e27.selectorLabels" . | nindent 6 }}
