apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32691088-afd2-4347-8810-f4be8c114f70.fullname" . }}
  labels:
    {{- include "go-echo32691088-afd2-4347-8810-f4be8c114f70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32691088-afd2-4347-8810-f4be8c114f70.selectorLabels" . | nindent 6 }}
