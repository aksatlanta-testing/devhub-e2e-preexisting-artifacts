apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fd4ed8f-e5f7-4480-948d-0f3a2f4152d8.fullname" . }}
  labels:
    {{- include "go-echo9fd4ed8f-e5f7-4480-948d-0f3a2f4152d8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fd4ed8f-e5f7-4480-948d-0f3a2f4152d8.selectorLabels" . | nindent 6 }}
