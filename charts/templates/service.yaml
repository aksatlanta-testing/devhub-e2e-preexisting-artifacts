apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof516b40d-6b31-4f80-940e-aa58e2217dda.fullname" . }}
  labels:
    {{- include "go-echof516b40d-6b31-4f80-940e-aa58e2217dda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof516b40d-6b31-4f80-940e-aa58e2217dda.selectorLabels" . | nindent 6 }}
