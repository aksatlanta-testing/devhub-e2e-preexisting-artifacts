apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bb4fe6c-95bc-4db1-b8b1-bb179e7eccf4.fullname" . }}
  labels:
    {{- include "go-echo8bb4fe6c-95bc-4db1-b8b1-bb179e7eccf4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bb4fe6c-95bc-4db1-b8b1-bb179e7eccf4.selectorLabels" . | nindent 6 }}
