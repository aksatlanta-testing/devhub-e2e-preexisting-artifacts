apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62c0120e-9077-4ec2-867e-bec59b9ba20d.fullname" . }}
  labels:
    {{- include "go-echo62c0120e-9077-4ec2-867e-bec59b9ba20d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62c0120e-9077-4ec2-867e-bec59b9ba20d.selectorLabels" . | nindent 6 }}
