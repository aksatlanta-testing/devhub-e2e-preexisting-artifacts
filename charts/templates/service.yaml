apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6ce824d-e947-4887-9895-e3a72612c4a3.fullname" . }}
  labels:
    {{- include "go-echob6ce824d-e947-4887-9895-e3a72612c4a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6ce824d-e947-4887-9895-e3a72612c4a3.selectorLabels" . | nindent 6 }}
