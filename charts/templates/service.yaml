apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7b971b3-6043-4199-9491-f8e8eedc8be3.fullname" . }}
  labels:
    {{- include "go-echoa7b971b3-6043-4199-9491-f8e8eedc8be3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7b971b3-6043-4199-9491-f8e8eedc8be3.selectorLabels" . | nindent 6 }}
