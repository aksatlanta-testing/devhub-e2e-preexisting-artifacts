apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo948bcbfd-144c-4f76-afd8-415b952df9a6.fullname" . }}
  labels:
    {{- include "go-echo948bcbfd-144c-4f76-afd8-415b952df9a6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo948bcbfd-144c-4f76-afd8-415b952df9a6.selectorLabels" . | nindent 6 }}
