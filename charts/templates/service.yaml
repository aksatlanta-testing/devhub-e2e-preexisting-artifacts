apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cdd7b00-d9ad-40c0-831a-8bf76041bd97.fullname" . }}
  labels:
    {{- include "go-echo5cdd7b00-d9ad-40c0-831a-8bf76041bd97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cdd7b00-d9ad-40c0-831a-8bf76041bd97.selectorLabels" . | nindent 6 }}
