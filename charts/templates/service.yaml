apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f7fd7cd-4c91-4d09-b814-2c391452023e.fullname" . }}
  labels:
    {{- include "go-echo8f7fd7cd-4c91-4d09-b814-2c391452023e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f7fd7cd-4c91-4d09-b814-2c391452023e.selectorLabels" . | nindent 6 }}
