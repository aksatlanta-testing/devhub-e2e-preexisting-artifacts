apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1032ed6-4165-42cb-90b5-a5e822ef360a.fullname" . }}
  labels:
    {{- include "go-echob1032ed6-4165-42cb-90b5-a5e822ef360a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1032ed6-4165-42cb-90b5-a5e822ef360a.selectorLabels" . | nindent 6 }}
