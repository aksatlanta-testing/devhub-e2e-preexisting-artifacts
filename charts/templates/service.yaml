apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3cd2dad7-fa73-4f50-962a-1aa6ac74091e.fullname" . }}
  labels:
    {{- include "go-echo3cd2dad7-fa73-4f50-962a-1aa6ac74091e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3cd2dad7-fa73-4f50-962a-1aa6ac74091e.selectorLabels" . | nindent 6 }}
