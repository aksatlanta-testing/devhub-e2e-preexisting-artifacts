apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod44605ac-5731-4523-8196-364d08809663.fullname" . }}
  labels:
    {{- include "go-echod44605ac-5731-4523-8196-364d08809663.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod44605ac-5731-4523-8196-364d08809663.selectorLabels" . | nindent 6 }}
