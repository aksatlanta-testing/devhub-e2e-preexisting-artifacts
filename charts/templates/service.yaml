apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8de5fd8-c6a8-4f42-9984-0d7e105553f8.fullname" . }}
  labels:
    {{- include "go-echod8de5fd8-c6a8-4f42-9984-0d7e105553f8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8de5fd8-c6a8-4f42-9984-0d7e105553f8.selectorLabels" . | nindent 6 }}
