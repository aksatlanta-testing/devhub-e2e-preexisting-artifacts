apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo721c48b9-9cf5-4032-9e92-cb0f706f514d.fullname" . }}
  labels:
    {{- include "go-echo721c48b9-9cf5-4032-9e92-cb0f706f514d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo721c48b9-9cf5-4032-9e92-cb0f706f514d.selectorLabels" . | nindent 6 }}
