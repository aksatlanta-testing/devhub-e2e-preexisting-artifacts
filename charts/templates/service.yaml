apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62fbe495-a6ac-4b0f-b269-0e0dfc44c562.fullname" . }}
  labels:
    {{- include "go-echo62fbe495-a6ac-4b0f-b269-0e0dfc44c562.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62fbe495-a6ac-4b0f-b269-0e0dfc44c562.selectorLabels" . | nindent 6 }}
