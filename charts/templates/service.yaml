apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo008bda6b-081b-4181-a8a0-eb18e9be4006.fullname" . }}
  labels:
    {{- include "go-echo008bda6b-081b-4181-a8a0-eb18e9be4006.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo008bda6b-081b-4181-a8a0-eb18e9be4006.selectorLabels" . | nindent 6 }}
