apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e217229-c865-4043-a354-d0756da43f29.fullname" . }}
  labels:
    {{- include "go-echo6e217229-c865-4043-a354-d0756da43f29.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e217229-c865-4043-a354-d0756da43f29.selectorLabels" . | nindent 6 }}
