apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23cdf869-7ae6-4dc2-9771-df6050652f90.fullname" . }}
  labels:
    {{- include "go-echo23cdf869-7ae6-4dc2-9771-df6050652f90.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23cdf869-7ae6-4dc2-9771-df6050652f90.selectorLabels" . | nindent 6 }}
