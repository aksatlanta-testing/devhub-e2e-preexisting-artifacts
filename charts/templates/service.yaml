apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43616b14-af3e-4112-b36d-484a57164fa6.fullname" . }}
  labels:
    {{- include "go-echo43616b14-af3e-4112-b36d-484a57164fa6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43616b14-af3e-4112-b36d-484a57164fa6.selectorLabels" . | nindent 6 }}
