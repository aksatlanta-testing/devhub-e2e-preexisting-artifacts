apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a4d4e06-5836-4b92-9635-acecf5321cc7.fullname" . }}
  labels:
    {{- include "go-echo0a4d4e06-5836-4b92-9635-acecf5321cc7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a4d4e06-5836-4b92-9635-acecf5321cc7.selectorLabels" . | nindent 6 }}
