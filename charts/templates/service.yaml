apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46ff816a-9210-4672-95e0-a6d85092e035.fullname" . }}
  labels:
    {{- include "go-echo46ff816a-9210-4672-95e0-a6d85092e035.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46ff816a-9210-4672-95e0-a6d85092e035.selectorLabels" . | nindent 6 }}
