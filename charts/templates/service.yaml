apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1430616-1e03-46ee-933f-0dda95075f1c.fullname" . }}
  labels:
    {{- include "go-echoe1430616-1e03-46ee-933f-0dda95075f1c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1430616-1e03-46ee-933f-0dda95075f1c.selectorLabels" . | nindent 6 }}
