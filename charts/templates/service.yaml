apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob75cda36-f3af-46d0-a986-a505b92dd714.fullname" . }}
  labels:
    {{- include "go-echob75cda36-f3af-46d0-a986-a505b92dd714.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob75cda36-f3af-46d0-a986-a505b92dd714.selectorLabels" . | nindent 6 }}
