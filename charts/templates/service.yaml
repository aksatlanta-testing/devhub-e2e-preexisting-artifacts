apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98731207-0a06-4998-8f8e-200f1855c84c.fullname" . }}
  labels:
    {{- include "go-echo98731207-0a06-4998-8f8e-200f1855c84c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98731207-0a06-4998-8f8e-200f1855c84c.selectorLabels" . | nindent 6 }}
