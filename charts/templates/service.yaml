apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30f3681a-e6a8-420d-9c07-610cfc0ea3d2.fullname" . }}
  labels:
    {{- include "go-echo30f3681a-e6a8-420d-9c07-610cfc0ea3d2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30f3681a-e6a8-420d-9c07-610cfc0ea3d2.selectorLabels" . | nindent 6 }}
