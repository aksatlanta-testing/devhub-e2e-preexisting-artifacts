apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cf72fcf-efd0-439c-ba4f-85a9f238e285.fullname" . }}
  labels:
    {{- include "go-echo4cf72fcf-efd0-439c-ba4f-85a9f238e285.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cf72fcf-efd0-439c-ba4f-85a9f238e285.selectorLabels" . | nindent 6 }}
