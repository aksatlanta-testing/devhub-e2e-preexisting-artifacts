apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8741fd8-9391-48dd-8911-044df2ce2832.fullname" . }}
  labels:
    {{- include "go-echoa8741fd8-9391-48dd-8911-044df2ce2832.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8741fd8-9391-48dd-8911-044df2ce2832.selectorLabels" . | nindent 6 }}
