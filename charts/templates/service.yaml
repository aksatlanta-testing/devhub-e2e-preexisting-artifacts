apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3113201-d97e-41f0-811d-bf291d504805.fullname" . }}
  labels:
    {{- include "go-echoe3113201-d97e-41f0-811d-bf291d504805.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3113201-d97e-41f0-811d-bf291d504805.selectorLabels" . | nindent 6 }}
