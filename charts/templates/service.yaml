apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe991e003-5ee6-48d0-9fd9-80e68011af1e.fullname" . }}
  labels:
    {{- include "go-echoe991e003-5ee6-48d0-9fd9-80e68011af1e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe991e003-5ee6-48d0-9fd9-80e68011af1e.selectorLabels" . | nindent 6 }}
