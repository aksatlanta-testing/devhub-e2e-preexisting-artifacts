apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba830b99-9e9c-4176-bf21-55d315947903.fullname" . }}
  labels:
    {{- include "go-echoba830b99-9e9c-4176-bf21-55d315947903.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba830b99-9e9c-4176-bf21-55d315947903.selectorLabels" . | nindent 6 }}
