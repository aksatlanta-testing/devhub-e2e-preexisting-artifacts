apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b3e9982-9e3f-45fd-91cb-22733b3a6edc.fullname" . }}
  labels:
    {{- include "go-echo6b3e9982-9e3f-45fd-91cb-22733b3a6edc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b3e9982-9e3f-45fd-91cb-22733b3a6edc.selectorLabels" . | nindent 6 }}
