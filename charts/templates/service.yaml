apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98e6f1ab-4e13-4fc2-a164-3ee7dcb96dd8.fullname" . }}
  labels:
    {{- include "go-echo98e6f1ab-4e13-4fc2-a164-3ee7dcb96dd8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98e6f1ab-4e13-4fc2-a164-3ee7dcb96dd8.selectorLabels" . | nindent 6 }}
