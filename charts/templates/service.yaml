apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a958c8a-e165-4b3c-b311-5ffd030af792.fullname" . }}
  labels:
    {{- include "go-echo4a958c8a-e165-4b3c-b311-5ffd030af792.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a958c8a-e165-4b3c-b311-5ffd030af792.selectorLabels" . | nindent 6 }}
