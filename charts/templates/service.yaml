apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo285e7fdf-ff64-430c-90f3-6c010ed6767c.fullname" . }}
  labels:
    {{- include "go-echo285e7fdf-ff64-430c-90f3-6c010ed6767c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo285e7fdf-ff64-430c-90f3-6c010ed6767c.selectorLabels" . | nindent 6 }}
