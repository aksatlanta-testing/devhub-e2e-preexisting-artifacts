apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6dc33b88-5fa0-4c74-bd90-29e95a131a2f.fullname" . }}
  labels:
    {{- include "go-echo6dc33b88-5fa0-4c74-bd90-29e95a131a2f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6dc33b88-5fa0-4c74-bd90-29e95a131a2f.selectorLabels" . | nindent 6 }}
