apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobca45013-24a4-4f9a-93c2-869be7940572.fullname" . }}
  labels:
    {{- include "go-echobca45013-24a4-4f9a-93c2-869be7940572.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobca45013-24a4-4f9a-93c2-869be7940572.selectorLabels" . | nindent 6 }}
