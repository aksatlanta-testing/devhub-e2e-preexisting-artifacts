apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7afcb6c-f03d-4c54-97e0-6fa124e5b302.fullname" . }}
  labels:
    {{- include "go-echoa7afcb6c-f03d-4c54-97e0-6fa124e5b302.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7afcb6c-f03d-4c54-97e0-6fa124e5b302.selectorLabels" . | nindent 6 }}
