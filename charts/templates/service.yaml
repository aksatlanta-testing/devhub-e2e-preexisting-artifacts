apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod62d9f34-0d46-4520-b7bc-ac7b4a2e1db0.fullname" . }}
  labels:
    {{- include "go-echod62d9f34-0d46-4520-b7bc-ac7b4a2e1db0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod62d9f34-0d46-4520-b7bc-ac7b4a2e1db0.selectorLabels" . | nindent 6 }}
