apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab0dd8f0-ea5e-4319-9e9d-625702e2f167.fullname" . }}
  labels:
    {{- include "go-echoab0dd8f0-ea5e-4319-9e9d-625702e2f167.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab0dd8f0-ea5e-4319-9e9d-625702e2f167.selectorLabels" . | nindent 6 }}
