apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ea37236-0de0-4f6f-87ee-e2b4b6305f60.fullname" . }}
  labels:
    {{- include "go-echo2ea37236-0de0-4f6f-87ee-e2b4b6305f60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ea37236-0de0-4f6f-87ee-e2b4b6305f60.selectorLabels" . | nindent 6 }}
