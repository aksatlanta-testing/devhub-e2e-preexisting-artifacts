apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e21c406-01e5-4c30-9069-fb9182f80b50.fullname" . }}
  labels:
    {{- include "go-echo5e21c406-01e5-4c30-9069-fb9182f80b50.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e21c406-01e5-4c30-9069-fb9182f80b50.selectorLabels" . | nindent 6 }}
