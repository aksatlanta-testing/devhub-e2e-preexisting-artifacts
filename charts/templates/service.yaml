apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo072b3fc4-db8d-44d9-bce6-2497b5109614.fullname" . }}
  labels:
    {{- include "go-echo072b3fc4-db8d-44d9-bce6-2497b5109614.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo072b3fc4-db8d-44d9-bce6-2497b5109614.selectorLabels" . | nindent 6 }}
