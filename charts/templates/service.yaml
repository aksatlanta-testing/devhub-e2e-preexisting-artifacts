apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b0e74fc-bac7-488c-8c3d-39d1edb6de08.fullname" . }}
  labels:
    {{- include "go-echo2b0e74fc-bac7-488c-8c3d-39d1edb6de08.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b0e74fc-bac7-488c-8c3d-39d1edb6de08.selectorLabels" . | nindent 6 }}
