apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa40c5dd9-d907-4fc1-a193-ef6c20cdfb49.fullname" . }}
  labels:
    {{- include "go-echoa40c5dd9-d907-4fc1-a193-ef6c20cdfb49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa40c5dd9-d907-4fc1-a193-ef6c20cdfb49.selectorLabels" . | nindent 6 }}
