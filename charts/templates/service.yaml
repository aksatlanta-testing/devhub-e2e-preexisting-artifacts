apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo848d9e55-591e-48fa-9ea7-82b552a262ce.fullname" . }}
  labels:
    {{- include "go-echo848d9e55-591e-48fa-9ea7-82b552a262ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo848d9e55-591e-48fa-9ea7-82b552a262ce.selectorLabels" . | nindent 6 }}
