apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2f82169-62cb-4ff6-b3d9-63ea3722e476.fullname" . }}
  labels:
    {{- include "go-echod2f82169-62cb-4ff6-b3d9-63ea3722e476.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2f82169-62cb-4ff6-b3d9-63ea3722e476.selectorLabels" . | nindent 6 }}
