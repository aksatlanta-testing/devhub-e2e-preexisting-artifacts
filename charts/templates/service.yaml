apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo278ea9ca-c91e-4ccb-82f3-1667cf37359a.fullname" . }}
  labels:
    {{- include "go-echo278ea9ca-c91e-4ccb-82f3-1667cf37359a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo278ea9ca-c91e-4ccb-82f3-1667cf37359a.selectorLabels" . | nindent 6 }}
