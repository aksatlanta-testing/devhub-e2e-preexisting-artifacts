apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e521d34-16b0-4ab8-aa79-3c5228251b03.fullname" . }}
  labels:
    {{- include "go-echo8e521d34-16b0-4ab8-aa79-3c5228251b03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e521d34-16b0-4ab8-aa79-3c5228251b03.selectorLabels" . | nindent 6 }}
