apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9560fee5-98ff-4f5f-8ed4-a65570404233.fullname" . }}
  labels:
    {{- include "go-echo9560fee5-98ff-4f5f-8ed4-a65570404233.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9560fee5-98ff-4f5f-8ed4-a65570404233.selectorLabels" . | nindent 6 }}
