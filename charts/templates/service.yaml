apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1d9b7cf-9c29-46f6-99be-b1cd908a7f22.fullname" . }}
  labels:
    {{- include "go-echoc1d9b7cf-9c29-46f6-99be-b1cd908a7f22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1d9b7cf-9c29-46f6-99be-b1cd908a7f22.selectorLabels" . | nindent 6 }}
