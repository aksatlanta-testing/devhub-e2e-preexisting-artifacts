apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80c98173-05b9-4492-80c4-1defff59764f.fullname" . }}
  labels:
    {{- include "go-echo80c98173-05b9-4492-80c4-1defff59764f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80c98173-05b9-4492-80c4-1defff59764f.selectorLabels" . | nindent 6 }}
