apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod306d9a8-904c-49d8-af15-4c26d12f7651.fullname" . }}
  labels:
    {{- include "go-echod306d9a8-904c-49d8-af15-4c26d12f7651.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod306d9a8-904c-49d8-af15-4c26d12f7651.selectorLabels" . | nindent 6 }}
