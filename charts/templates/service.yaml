apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e047d24-799a-4164-b7ce-46c3093c11ce.fullname" . }}
  labels:
    {{- include "go-echo0e047d24-799a-4164-b7ce-46c3093c11ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e047d24-799a-4164-b7ce-46c3093c11ce.selectorLabels" . | nindent 6 }}
