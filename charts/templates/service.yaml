apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0977b926-9ed6-40b4-b186-9297e420c5ee.fullname" . }}
  labels:
    {{- include "go-echo0977b926-9ed6-40b4-b186-9297e420c5ee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0977b926-9ed6-40b4-b186-9297e420c5ee.selectorLabels" . | nindent 6 }}
