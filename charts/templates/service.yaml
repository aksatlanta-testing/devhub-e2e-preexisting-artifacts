apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof45590bd-4362-4318-abd7-dd6af8de74c8.fullname" . }}
  labels:
    {{- include "go-echof45590bd-4362-4318-abd7-dd6af8de74c8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof45590bd-4362-4318-abd7-dd6af8de74c8.selectorLabels" . | nindent 6 }}
