apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca6d6ff4-a99e-4102-a753-d7df51bd5a1d.fullname" . }}
  labels:
    {{- include "go-echoca6d6ff4-a99e-4102-a753-d7df51bd5a1d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca6d6ff4-a99e-4102-a753-d7df51bd5a1d.selectorLabels" . | nindent 6 }}
