apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob504f749-ebd4-4ce8-9681-360e0eda1469.fullname" . }}
  labels:
    {{- include "go-echob504f749-ebd4-4ce8-9681-360e0eda1469.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob504f749-ebd4-4ce8-9681-360e0eda1469.selectorLabels" . | nindent 6 }}
