apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod600359a-41a3-4c20-91a6-8e43c42892b2.fullname" . }}
  labels:
    {{- include "go-echod600359a-41a3-4c20-91a6-8e43c42892b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod600359a-41a3-4c20-91a6-8e43c42892b2.selectorLabels" . | nindent 6 }}
