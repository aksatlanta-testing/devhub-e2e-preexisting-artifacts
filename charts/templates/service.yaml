apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cc980c5-5e75-4b26-9221-952c9c94cc1c.fullname" . }}
  labels:
    {{- include "go-echo4cc980c5-5e75-4b26-9221-952c9c94cc1c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cc980c5-5e75-4b26-9221-952c9c94cc1c.selectorLabels" . | nindent 6 }}
