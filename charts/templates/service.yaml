apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a3d8ea3-a2c6-4920-99ce-b13fbf0c9eda.fullname" . }}
  labels:
    {{- include "go-echo6a3d8ea3-a2c6-4920-99ce-b13fbf0c9eda.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a3d8ea3-a2c6-4920-99ce-b13fbf0c9eda.selectorLabels" . | nindent 6 }}
