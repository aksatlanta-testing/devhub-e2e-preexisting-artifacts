apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocce77ae9-5133-4085-9c83-d25bc3f28d0b.fullname" . }}
  labels:
    {{- include "go-echocce77ae9-5133-4085-9c83-d25bc3f28d0b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocce77ae9-5133-4085-9c83-d25bc3f28d0b.selectorLabels" . | nindent 6 }}
