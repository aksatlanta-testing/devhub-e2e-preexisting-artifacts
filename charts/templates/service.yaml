apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e019ab7-54c4-450c-a223-1a1e0fd4b1de.fullname" . }}
  labels:
    {{- include "go-echo6e019ab7-54c4-450c-a223-1a1e0fd4b1de.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e019ab7-54c4-450c-a223-1a1e0fd4b1de.selectorLabels" . | nindent 6 }}
