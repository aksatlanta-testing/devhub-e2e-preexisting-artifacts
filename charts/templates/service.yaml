apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74c7c9b1-b8e0-4c03-aedb-99be84aad3a8.fullname" . }}
  labels:
    {{- include "go-echo74c7c9b1-b8e0-4c03-aedb-99be84aad3a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74c7c9b1-b8e0-4c03-aedb-99be84aad3a8.selectorLabels" . | nindent 6 }}
