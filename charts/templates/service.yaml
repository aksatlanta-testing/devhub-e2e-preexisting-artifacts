apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a4b2938-ac33-489d-b5cf-60c2241850ad.fullname" . }}
  labels:
    {{- include "go-echo4a4b2938-ac33-489d-b5cf-60c2241850ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a4b2938-ac33-489d-b5cf-60c2241850ad.selectorLabels" . | nindent 6 }}
