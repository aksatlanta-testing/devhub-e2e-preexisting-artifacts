apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f755bd6-d9ea-49ae-8f64-2b25742bb522.fullname" . }}
  labels:
    {{- include "go-echo9f755bd6-d9ea-49ae-8f64-2b25742bb522.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f755bd6-d9ea-49ae-8f64-2b25742bb522.selectorLabels" . | nindent 6 }}
