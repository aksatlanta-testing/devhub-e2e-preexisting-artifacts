apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2404f2ae-1c59-4a94-9157-cfc1a88664fb.fullname" . }}
  labels:
    {{- include "go-echo2404f2ae-1c59-4a94-9157-cfc1a88664fb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2404f2ae-1c59-4a94-9157-cfc1a88664fb.selectorLabels" . | nindent 6 }}
