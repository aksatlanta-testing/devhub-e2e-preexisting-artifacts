apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38301574-445c-4089-8f47-50293a952ea3.fullname" . }}
  labels:
    {{- include "go-echo38301574-445c-4089-8f47-50293a952ea3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38301574-445c-4089-8f47-50293a952ea3.selectorLabels" . | nindent 6 }}
