apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ad8eac3-7791-4cac-b2d4-b58a5a8f7fce.fullname" . }}
  labels:
    {{- include "go-echo5ad8eac3-7791-4cac-b2d4-b58a5a8f7fce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ad8eac3-7791-4cac-b2d4-b58a5a8f7fce.selectorLabels" . | nindent 6 }}
