apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe28853b6-7cd2-462a-a10c-579d7acdceb1.fullname" . }}
  labels:
    {{- include "go-echoe28853b6-7cd2-462a-a10c-579d7acdceb1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe28853b6-7cd2-462a-a10c-579d7acdceb1.selectorLabels" . | nindent 6 }}
