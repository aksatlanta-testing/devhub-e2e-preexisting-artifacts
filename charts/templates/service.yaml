apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7a24d30-433b-443f-8d49-5c74014241db.fullname" . }}
  labels:
    {{- include "go-echoc7a24d30-433b-443f-8d49-5c74014241db.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7a24d30-433b-443f-8d49-5c74014241db.selectorLabels" . | nindent 6 }}
