apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa36db6f7-1c6a-46e3-ad14-4bf126645eed.fullname" . }}
  labels:
    {{- include "go-echoa36db6f7-1c6a-46e3-ad14-4bf126645eed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa36db6f7-1c6a-46e3-ad14-4bf126645eed.selectorLabels" . | nindent 6 }}
