apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f67d0fd-0a74-4e1b-9f91-4d58721ef262.fullname" . }}
  labels:
    {{- include "go-echo1f67d0fd-0a74-4e1b-9f91-4d58721ef262.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f67d0fd-0a74-4e1b-9f91-4d58721ef262.selectorLabels" . | nindent 6 }}
