apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe47a846a-ed16-4772-9c2d-17ae74a2bbbd.fullname" . }}
  labels:
    {{- include "go-echoe47a846a-ed16-4772-9c2d-17ae74a2bbbd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe47a846a-ed16-4772-9c2d-17ae74a2bbbd.selectorLabels" . | nindent 6 }}
