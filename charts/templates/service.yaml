apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ea23fa0-0bcd-4cf6-9874-011037a2e469.fullname" . }}
  labels:
    {{- include "go-echo0ea23fa0-0bcd-4cf6-9874-011037a2e469.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ea23fa0-0bcd-4cf6-9874-011037a2e469.selectorLabels" . | nindent 6 }}
