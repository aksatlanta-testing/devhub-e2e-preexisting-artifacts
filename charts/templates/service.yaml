apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo950aba39-d9ed-46e0-8ca8-c7c0da469609.fullname" . }}
  labels:
    {{- include "go-echo950aba39-d9ed-46e0-8ca8-c7c0da469609.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo950aba39-d9ed-46e0-8ca8-c7c0da469609.selectorLabels" . | nindent 6 }}
