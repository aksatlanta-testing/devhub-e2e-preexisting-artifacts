apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo432aa0b3-1a68-4b0b-9660-525e37c6a423.fullname" . }}
  labels:
    {{- include "go-echo432aa0b3-1a68-4b0b-9660-525e37c6a423.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo432aa0b3-1a68-4b0b-9660-525e37c6a423.selectorLabels" . | nindent 6 }}
