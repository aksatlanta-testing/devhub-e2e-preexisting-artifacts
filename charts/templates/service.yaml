apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3faf05f4-12b4-4064-bb06-eeb301c96552.fullname" . }}
  labels:
    {{- include "go-echo3faf05f4-12b4-4064-bb06-eeb301c96552.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3faf05f4-12b4-4064-bb06-eeb301c96552.selectorLabels" . | nindent 6 }}
