apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7bfbf64f-fa5d-46d2-bb09-afc1da52af8a.fullname" . }}
  labels:
    {{- include "go-echo7bfbf64f-fa5d-46d2-bb09-afc1da52af8a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7bfbf64f-fa5d-46d2-bb09-afc1da52af8a.selectorLabels" . | nindent 6 }}
