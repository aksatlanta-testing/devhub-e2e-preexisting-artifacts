apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa52270b2-6e38-45b2-b783-3975812657c0.fullname" . }}
  labels:
    {{- include "go-echoa52270b2-6e38-45b2-b783-3975812657c0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa52270b2-6e38-45b2-b783-3975812657c0.selectorLabels" . | nindent 6 }}
