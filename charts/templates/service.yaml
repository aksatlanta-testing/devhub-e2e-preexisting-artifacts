apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo481a1084-41c5-4c9e-a298-fc65c8815ee6.fullname" . }}
  labels:
    {{- include "go-echo481a1084-41c5-4c9e-a298-fc65c8815ee6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo481a1084-41c5-4c9e-a298-fc65c8815ee6.selectorLabels" . | nindent 6 }}
