apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3fd7598-57b2-47c1-b706-5bb0f33e9e70.fullname" . }}
  labels:
    {{- include "go-echoa3fd7598-57b2-47c1-b706-5bb0f33e9e70.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3fd7598-57b2-47c1-b706-5bb0f33e9e70.selectorLabels" . | nindent 6 }}
