apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bb1069e-de5a-4f60-9090-1fd6921d0db0.fullname" . }}
  labels:
    {{- include "go-echo1bb1069e-de5a-4f60-9090-1fd6921d0db0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bb1069e-de5a-4f60-9090-1fd6921d0db0.selectorLabels" . | nindent 6 }}
