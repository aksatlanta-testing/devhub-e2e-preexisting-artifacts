apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec98aaa6-0695-4092-ab2e-64aa6f4641a6.fullname" . }}
  labels:
    {{- include "go-echoec98aaa6-0695-4092-ab2e-64aa6f4641a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec98aaa6-0695-4092-ab2e-64aa6f4641a6.selectorLabels" . | nindent 6 }}
