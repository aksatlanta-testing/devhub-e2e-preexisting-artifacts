apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f5699f7-4a65-49a8-b732-86d8907dff6e.fullname" . }}
  labels:
    {{- include "go-echo8f5699f7-4a65-49a8-b732-86d8907dff6e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f5699f7-4a65-49a8-b732-86d8907dff6e.selectorLabels" . | nindent 6 }}
