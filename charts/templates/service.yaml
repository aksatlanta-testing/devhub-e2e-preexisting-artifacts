apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodbe3e0c5-c0a0-44ed-b9ec-f3980c387196.fullname" . }}
  labels:
    {{- include "go-echodbe3e0c5-c0a0-44ed-b9ec-f3980c387196.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodbe3e0c5-c0a0-44ed-b9ec-f3980c387196.selectorLabels" . | nindent 6 }}
