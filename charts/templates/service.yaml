apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc263070c-26c1-44da-b594-183b09203a10.fullname" . }}
  labels:
    {{- include "go-echoc263070c-26c1-44da-b594-183b09203a10.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc263070c-26c1-44da-b594-183b09203a10.selectorLabels" . | nindent 6 }}
