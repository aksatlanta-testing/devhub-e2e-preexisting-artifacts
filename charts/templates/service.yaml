apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8e3b5f8-e5e6-4c09-8809-b90a2bb34ade.fullname" . }}
  labels:
    {{- include "go-echoc8e3b5f8-e5e6-4c09-8809-b90a2bb34ade.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8e3b5f8-e5e6-4c09-8809-b90a2bb34ade.selectorLabels" . | nindent 6 }}
