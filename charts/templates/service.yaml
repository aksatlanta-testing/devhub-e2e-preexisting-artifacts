apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa35ab57d-a959-4aea-817f-e39c45f30b2d.fullname" . }}
  labels:
    {{- include "go-echoa35ab57d-a959-4aea-817f-e39c45f30b2d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa35ab57d-a959-4aea-817f-e39c45f30b2d.selectorLabels" . | nindent 6 }}
