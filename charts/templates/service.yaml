apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cc54309-d1e0-4fe7-9993-49198d6ab834.fullname" . }}
  labels:
    {{- include "go-echo5cc54309-d1e0-4fe7-9993-49198d6ab834.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cc54309-d1e0-4fe7-9993-49198d6ab834.selectorLabels" . | nindent 6 }}
