apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a9b40fe-e179-43a7-b67a-bff8ec9a12f9.fullname" . }}
  labels:
    {{- include "go-echo8a9b40fe-e179-43a7-b67a-bff8ec9a12f9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a9b40fe-e179-43a7-b67a-bff8ec9a12f9.selectorLabels" . | nindent 6 }}
