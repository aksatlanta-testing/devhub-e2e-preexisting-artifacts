apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d587eca-2cb3-45b6-aebb-f4c8ec891ae0.fullname" . }}
  labels:
    {{- include "go-echo3d587eca-2cb3-45b6-aebb-f4c8ec891ae0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d587eca-2cb3-45b6-aebb-f4c8ec891ae0.selectorLabels" . | nindent 6 }}
