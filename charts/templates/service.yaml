apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob078b05b-4cbf-4b95-8426-84481f4c3dad.fullname" . }}
  labels:
    {{- include "go-echob078b05b-4cbf-4b95-8426-84481f4c3dad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob078b05b-4cbf-4b95-8426-84481f4c3dad.selectorLabels" . | nindent 6 }}
