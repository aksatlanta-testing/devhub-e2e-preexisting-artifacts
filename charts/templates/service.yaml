apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab6dcf56-c368-4ba6-a8b2-86f9918003f4.fullname" . }}
  labels:
    {{- include "go-echoab6dcf56-c368-4ba6-a8b2-86f9918003f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab6dcf56-c368-4ba6-a8b2-86f9918003f4.selectorLabels" . | nindent 6 }}
