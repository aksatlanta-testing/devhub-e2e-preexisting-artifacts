apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo169c46e9-338c-4f8c-a5b4-cf048513a60c.fullname" . }}
  labels:
    {{- include "go-echo169c46e9-338c-4f8c-a5b4-cf048513a60c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo169c46e9-338c-4f8c-a5b4-cf048513a60c.selectorLabels" . | nindent 6 }}
