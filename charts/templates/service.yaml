apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef2de007-a0d3-4fa3-bf29-dfcf71dc4a2a.fullname" . }}
  labels:
    {{- include "go-echoef2de007-a0d3-4fa3-bf29-dfcf71dc4a2a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef2de007-a0d3-4fa3-bf29-dfcf71dc4a2a.selectorLabels" . | nindent 6 }}
