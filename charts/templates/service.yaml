apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34d7efbe-a3c5-435d-a7ab-d4819c0cdd68.fullname" . }}
  labels:
    {{- include "go-echo34d7efbe-a3c5-435d-a7ab-d4819c0cdd68.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34d7efbe-a3c5-435d-a7ab-d4819c0cdd68.selectorLabels" . | nindent 6 }}
