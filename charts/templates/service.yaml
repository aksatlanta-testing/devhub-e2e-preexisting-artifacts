apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20189ac0-e420-4472-92c6-fde081a8fedc.fullname" . }}
  labels:
    {{- include "go-echo20189ac0-e420-4472-92c6-fde081a8fedc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20189ac0-e420-4472-92c6-fde081a8fedc.selectorLabels" . | nindent 6 }}
