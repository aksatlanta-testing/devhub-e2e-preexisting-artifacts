apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a9c119a-a025-477d-a6d2-38bf34456aa8.fullname" . }}
  labels:
    {{- include "go-echo7a9c119a-a025-477d-a6d2-38bf34456aa8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a9c119a-a025-477d-a6d2-38bf34456aa8.selectorLabels" . | nindent 6 }}
