apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57eee120-8aa7-42fc-b1d2-da657598a893.fullname" . }}
  labels:
    {{- include "go-echo57eee120-8aa7-42fc-b1d2-da657598a893.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57eee120-8aa7-42fc-b1d2-da657598a893.selectorLabels" . | nindent 6 }}
