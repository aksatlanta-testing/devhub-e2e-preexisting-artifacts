apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod81a478a-28a2-42b8-874f-f2ea2562257d.fullname" . }}
  labels:
    {{- include "go-echod81a478a-28a2-42b8-874f-f2ea2562257d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod81a478a-28a2-42b8-874f-f2ea2562257d.selectorLabels" . | nindent 6 }}
