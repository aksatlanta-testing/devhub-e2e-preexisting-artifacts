apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe048cfb5-665b-407f-9dae-163bb66ecf2b.fullname" . }}
  labels:
    {{- include "go-echoe048cfb5-665b-407f-9dae-163bb66ecf2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe048cfb5-665b-407f-9dae-163bb66ecf2b.selectorLabels" . | nindent 6 }}
