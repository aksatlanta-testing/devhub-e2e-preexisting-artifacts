apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44a7a1e9-d349-46c2-8509-309eec7aa343.fullname" . }}
  labels:
    {{- include "go-echo44a7a1e9-d349-46c2-8509-309eec7aa343.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44a7a1e9-d349-46c2-8509-309eec7aa343.selectorLabels" . | nindent 6 }}
