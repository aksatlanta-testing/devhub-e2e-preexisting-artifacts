apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3fcfb28f-b2a1-45e4-8bd7-87376da7c006.fullname" . }}
  labels:
    {{- include "go-echo3fcfb28f-b2a1-45e4-8bd7-87376da7c006.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3fcfb28f-b2a1-45e4-8bd7-87376da7c006.selectorLabels" . | nindent 6 }}
