apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2619e9c-5724-427f-a504-a525e63852af.fullname" . }}
  labels:
    {{- include "go-echod2619e9c-5724-427f-a504-a525e63852af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2619e9c-5724-427f-a504-a525e63852af.selectorLabels" . | nindent 6 }}
