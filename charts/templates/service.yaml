apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2c1b901-30ef-4818-9bef-d4adc7be2f07.fullname" . }}
  labels:
    {{- include "go-echof2c1b901-30ef-4818-9bef-d4adc7be2f07.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2c1b901-30ef-4818-9bef-d4adc7be2f07.selectorLabels" . | nindent 6 }}
