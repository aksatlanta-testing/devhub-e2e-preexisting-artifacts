apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo329f35fc-5e3c-4580-80fb-2cfc212e7c57.fullname" . }}
  labels:
    {{- include "go-echo329f35fc-5e3c-4580-80fb-2cfc212e7c57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo329f35fc-5e3c-4580-80fb-2cfc212e7c57.selectorLabels" . | nindent 6 }}
