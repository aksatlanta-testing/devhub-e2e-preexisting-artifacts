apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo034e62db-fe89-42f4-831a-45c9dbcb22cd.fullname" . }}
  labels:
    {{- include "go-echo034e62db-fe89-42f4-831a-45c9dbcb22cd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo034e62db-fe89-42f4-831a-45c9dbcb22cd.selectorLabels" . | nindent 6 }}
