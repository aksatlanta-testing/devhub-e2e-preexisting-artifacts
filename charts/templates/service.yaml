apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo251e4d10-96dc-425b-88e4-246e90b7843b.fullname" . }}
  labels:
    {{- include "go-echo251e4d10-96dc-425b-88e4-246e90b7843b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo251e4d10-96dc-425b-88e4-246e90b7843b.selectorLabels" . | nindent 6 }}
