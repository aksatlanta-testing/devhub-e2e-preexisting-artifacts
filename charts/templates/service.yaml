apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob73f33ef-9452-4a13-839b-34de27ea87b8.fullname" . }}
  labels:
    {{- include "go-echob73f33ef-9452-4a13-839b-34de27ea87b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob73f33ef-9452-4a13-839b-34de27ea87b8.selectorLabels" . | nindent 6 }}
