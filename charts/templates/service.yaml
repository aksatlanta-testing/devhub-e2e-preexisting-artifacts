apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0267ba32-c873-42b2-aee2-ef6c0d853d39.fullname" . }}
  labels:
    {{- include "go-echo0267ba32-c873-42b2-aee2-ef6c0d853d39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0267ba32-c873-42b2-aee2-ef6c0d853d39.selectorLabels" . | nindent 6 }}
