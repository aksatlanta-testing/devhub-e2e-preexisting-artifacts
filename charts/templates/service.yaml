apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a9f5316-40b4-4e9a-b82f-b06c9dfdc9ae.fullname" . }}
  labels:
    {{- include "go-echo7a9f5316-40b4-4e9a-b82f-b06c9dfdc9ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a9f5316-40b4-4e9a-b82f-b06c9dfdc9ae.selectorLabels" . | nindent 6 }}
