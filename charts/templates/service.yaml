apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca5c0faf-47ef-4264-bf82-b07a9729ddd8.fullname" . }}
  labels:
    {{- include "go-echoca5c0faf-47ef-4264-bf82-b07a9729ddd8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca5c0faf-47ef-4264-bf82-b07a9729ddd8.selectorLabels" . | nindent 6 }}
