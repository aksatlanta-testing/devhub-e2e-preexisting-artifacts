apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e62e512-8cc1-40e0-907e-172323643db2.fullname" . }}
  labels:
    {{- include "go-echo7e62e512-8cc1-40e0-907e-172323643db2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e62e512-8cc1-40e0-907e-172323643db2.selectorLabels" . | nindent 6 }}
