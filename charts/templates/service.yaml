apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo030bbac1-5b02-4ca1-b339-31783030ad29.fullname" . }}
  labels:
    {{- include "go-echo030bbac1-5b02-4ca1-b339-31783030ad29.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo030bbac1-5b02-4ca1-b339-31783030ad29.selectorLabels" . | nindent 6 }}
