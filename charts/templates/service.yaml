apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2f5c5bc-2f4c-42ea-af9d-060dba03dd3e.fullname" . }}
  labels:
    {{- include "go-echoa2f5c5bc-2f4c-42ea-af9d-060dba03dd3e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2f5c5bc-2f4c-42ea-af9d-060dba03dd3e.selectorLabels" . | nindent 6 }}
