apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo11e1b734-5c84-427a-a0b0-e9a4d5e190c6.fullname" . }}
  labels:
    {{- include "go-echo11e1b734-5c84-427a-a0b0-e9a4d5e190c6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo11e1b734-5c84-427a-a0b0-e9a4d5e190c6.selectorLabels" . | nindent 6 }}
