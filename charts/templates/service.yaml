apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84fc8e1e-e135-45b3-97c2-d8c509ade838.fullname" . }}
  labels:
    {{- include "go-echo84fc8e1e-e135-45b3-97c2-d8c509ade838.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84fc8e1e-e135-45b3-97c2-d8c509ade838.selectorLabels" . | nindent 6 }}
