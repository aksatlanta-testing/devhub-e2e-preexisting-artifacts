apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f7fdd19-7f47-40cf-b182-7cdd3b90d7f9.fullname" . }}
  labels:
    {{- include "go-echo1f7fdd19-7f47-40cf-b182-7cdd3b90d7f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f7fdd19-7f47-40cf-b182-7cdd3b90d7f9.selectorLabels" . | nindent 6 }}
