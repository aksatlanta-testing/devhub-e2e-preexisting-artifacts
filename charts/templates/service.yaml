apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa47830be-443f-4fb0-bad7-5b71ff5b2c30.fullname" . }}
  labels:
    {{- include "go-echoa47830be-443f-4fb0-bad7-5b71ff5b2c30.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa47830be-443f-4fb0-bad7-5b71ff5b2c30.selectorLabels" . | nindent 6 }}
