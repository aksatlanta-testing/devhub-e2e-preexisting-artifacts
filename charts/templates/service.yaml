apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c8a6408-0bea-4d2b-974b-1237166a8783.fullname" . }}
  labels:
    {{- include "go-echo6c8a6408-0bea-4d2b-974b-1237166a8783.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c8a6408-0bea-4d2b-974b-1237166a8783.selectorLabels" . | nindent 6 }}
