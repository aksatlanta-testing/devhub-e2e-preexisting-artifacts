apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e66de55-ec09-465f-8e11-75fa657f9e0c.fullname" . }}
  labels:
    {{- include "go-echo6e66de55-ec09-465f-8e11-75fa657f9e0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e66de55-ec09-465f-8e11-75fa657f9e0c.selectorLabels" . | nindent 6 }}
