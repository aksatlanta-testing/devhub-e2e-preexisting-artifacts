apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34938bcd-6076-4283-a451-82f641d6009f.fullname" . }}
  labels:
    {{- include "go-echo34938bcd-6076-4283-a451-82f641d6009f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34938bcd-6076-4283-a451-82f641d6009f.selectorLabels" . | nindent 6 }}
