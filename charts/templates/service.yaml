apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfb610bc-a241-459d-b59d-be4c587773bd.fullname" . }}
  labels:
    {{- include "go-echodfb610bc-a241-459d-b59d-be4c587773bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfb610bc-a241-459d-b59d-be4c587773bd.selectorLabels" . | nindent 6 }}
