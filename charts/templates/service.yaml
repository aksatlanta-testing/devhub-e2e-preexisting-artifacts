apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6aea5147-e488-46c3-aa0c-3cdc67296c84.fullname" . }}
  labels:
    {{- include "go-echo6aea5147-e488-46c3-aa0c-3cdc67296c84.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6aea5147-e488-46c3-aa0c-3cdc67296c84.selectorLabels" . | nindent 6 }}
