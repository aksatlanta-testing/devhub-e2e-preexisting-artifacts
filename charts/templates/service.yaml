apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9afd7a53-d054-4563-abfc-58839ef0b9d4.fullname" . }}
  labels:
    {{- include "go-echo9afd7a53-d054-4563-abfc-58839ef0b9d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9afd7a53-d054-4563-abfc-58839ef0b9d4.selectorLabels" . | nindent 6 }}
