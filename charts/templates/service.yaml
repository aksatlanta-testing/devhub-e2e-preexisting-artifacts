apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1c1bf4e-60e2-4da8-ab31-cf8450d282fd.fullname" . }}
  labels:
    {{- include "go-echoa1c1bf4e-60e2-4da8-ab31-cf8450d282fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1c1bf4e-60e2-4da8-ab31-cf8450d282fd.selectorLabels" . | nindent 6 }}
