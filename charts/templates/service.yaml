apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob07802aa-7031-4df1-8b13-581ec7c53d05.fullname" . }}
  labels:
    {{- include "go-echob07802aa-7031-4df1-8b13-581ec7c53d05.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob07802aa-7031-4df1-8b13-581ec7c53d05.selectorLabels" . | nindent 6 }}
