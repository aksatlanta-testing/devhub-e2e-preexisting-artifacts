apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c624628-c8ad-4cf5-8df8-ee553a15b264.fullname" . }}
  labels:
    {{- include "go-echo2c624628-c8ad-4cf5-8df8-ee553a15b264.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c624628-c8ad-4cf5-8df8-ee553a15b264.selectorLabels" . | nindent 6 }}
