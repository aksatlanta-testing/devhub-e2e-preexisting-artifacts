apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52733460-fbaf-44e0-9acf-7696662c5a7a.fullname" . }}
  labels:
    {{- include "go-echo52733460-fbaf-44e0-9acf-7696662c5a7a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52733460-fbaf-44e0-9acf-7696662c5a7a.selectorLabels" . | nindent 6 }}
