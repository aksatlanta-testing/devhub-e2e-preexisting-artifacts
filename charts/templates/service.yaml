apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof37c2606-cc1b-4165-9e01-204bfb5e29e8.fullname" . }}
  labels:
    {{- include "go-echof37c2606-cc1b-4165-9e01-204bfb5e29e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof37c2606-cc1b-4165-9e01-204bfb5e29e8.selectorLabels" . | nindent 6 }}
