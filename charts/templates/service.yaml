apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab0e98b7-8454-4a54-89f4-7130fb829efd.fullname" . }}
  labels:
    {{- include "go-echoab0e98b7-8454-4a54-89f4-7130fb829efd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab0e98b7-8454-4a54-89f4-7130fb829efd.selectorLabels" . | nindent 6 }}
