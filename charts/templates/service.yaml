apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof806bb38-3f09-4c24-9c63-3dfd8fc82dcc.fullname" . }}
  labels:
    {{- include "go-echof806bb38-3f09-4c24-9c63-3dfd8fc82dcc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof806bb38-3f09-4c24-9c63-3dfd8fc82dcc.selectorLabels" . | nindent 6 }}
