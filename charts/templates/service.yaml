apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc078a604-0a39-4688-a6ad-a621e544a452.fullname" . }}
  labels:
    {{- include "go-echoc078a604-0a39-4688-a6ad-a621e544a452.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc078a604-0a39-4688-a6ad-a621e544a452.selectorLabels" . | nindent 6 }}
