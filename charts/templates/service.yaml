apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a46b7e9-17e6-45a8-9aa1-741d337df54a.fullname" . }}
  labels:
    {{- include "go-echo5a46b7e9-17e6-45a8-9aa1-741d337df54a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a46b7e9-17e6-45a8-9aa1-741d337df54a.selectorLabels" . | nindent 6 }}
