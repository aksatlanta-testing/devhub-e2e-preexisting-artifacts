apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91eda12c-8f7a-4b31-8843-88f988782b40.fullname" . }}
  labels:
    {{- include "go-echo91eda12c-8f7a-4b31-8843-88f988782b40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91eda12c-8f7a-4b31-8843-88f988782b40.selectorLabels" . | nindent 6 }}
