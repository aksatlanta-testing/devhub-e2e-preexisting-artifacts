apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20cdb946-4d78-45bb-a581-ab2a9a987808.fullname" . }}
  labels:
    {{- include "go-echo20cdb946-4d78-45bb-a581-ab2a9a987808.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20cdb946-4d78-45bb-a581-ab2a9a987808.selectorLabels" . | nindent 6 }}
