apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo746bf494-4885-4283-af55-b7592e7c7365.fullname" . }}
  labels:
    {{- include "go-echo746bf494-4885-4283-af55-b7592e7c7365.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo746bf494-4885-4283-af55-b7592e7c7365.selectorLabels" . | nindent 6 }}
