apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo339125f3-500b-403c-8ab0-422c50b1c138.fullname" . }}
  labels:
    {{- include "go-echo339125f3-500b-403c-8ab0-422c50b1c138.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo339125f3-500b-403c-8ab0-422c50b1c138.selectorLabels" . | nindent 6 }}
