apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b154b20-4acf-46c5-b987-08ae62d22747.fullname" . }}
  labels:
    {{- include "go-echo1b154b20-4acf-46c5-b987-08ae62d22747.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b154b20-4acf-46c5-b987-08ae62d22747.selectorLabels" . | nindent 6 }}
