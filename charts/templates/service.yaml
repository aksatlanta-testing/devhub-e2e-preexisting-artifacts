apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b57f918-3b00-4cc9-b758-7e61f3254b3b.fullname" . }}
  labels:
    {{- include "go-echo0b57f918-3b00-4cc9-b758-7e61f3254b3b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b57f918-3b00-4cc9-b758-7e61f3254b3b.selectorLabels" . | nindent 6 }}
