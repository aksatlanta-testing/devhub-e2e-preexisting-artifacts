apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae03494d-51aa-4718-8f4e-092675ac1534.fullname" . }}
  labels:
    {{- include "go-echoae03494d-51aa-4718-8f4e-092675ac1534.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae03494d-51aa-4718-8f4e-092675ac1534.selectorLabels" . | nindent 6 }}
