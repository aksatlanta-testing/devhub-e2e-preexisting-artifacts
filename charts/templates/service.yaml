apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3ad7541-c8cd-416e-9c79-a4fca6263f39.fullname" . }}
  labels:
    {{- include "go-echob3ad7541-c8cd-416e-9c79-a4fca6263f39.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3ad7541-c8cd-416e-9c79-a4fca6263f39.selectorLabels" . | nindent 6 }}
