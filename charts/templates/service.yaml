apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8169a7a-dbc9-4d7b-8f82-08c50dfa33a3.fullname" . }}
  labels:
    {{- include "go-echoa8169a7a-dbc9-4d7b-8f82-08c50dfa33a3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8169a7a-dbc9-4d7b-8f82-08c50dfa33a3.selectorLabels" . | nindent 6 }}
