apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa47a9513-5ce5-4fe7-8681-2194ea405501.fullname" . }}
  labels:
    {{- include "go-echoa47a9513-5ce5-4fe7-8681-2194ea405501.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa47a9513-5ce5-4fe7-8681-2194ea405501.selectorLabels" . | nindent 6 }}
