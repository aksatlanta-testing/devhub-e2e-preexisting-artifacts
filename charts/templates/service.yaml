apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0969ca9-ed65-4540-a0f2-55b77f13416f.fullname" . }}
  labels:
    {{- include "go-echoe0969ca9-ed65-4540-a0f2-55b77f13416f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0969ca9-ed65-4540-a0f2-55b77f13416f.selectorLabels" . | nindent 6 }}
