apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c366ea3-c3bd-45bd-aea4-4046183d742b.fullname" . }}
  labels:
    {{- include "go-echo3c366ea3-c3bd-45bd-aea4-4046183d742b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c366ea3-c3bd-45bd-aea4-4046183d742b.selectorLabels" . | nindent 6 }}
