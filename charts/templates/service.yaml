apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a2fe73e-fcc5-4096-814e-b75e0e6f1a1d.fullname" . }}
  labels:
    {{- include "go-echo1a2fe73e-fcc5-4096-814e-b75e0e6f1a1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a2fe73e-fcc5-4096-814e-b75e0e6f1a1d.selectorLabels" . | nindent 6 }}
