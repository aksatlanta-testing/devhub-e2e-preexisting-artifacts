apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa758563f-d854-42a6-94de-7f341fded5f2.fullname" . }}
  labels:
    {{- include "go-echoa758563f-d854-42a6-94de-7f341fded5f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa758563f-d854-42a6-94de-7f341fded5f2.selectorLabels" . | nindent 6 }}
