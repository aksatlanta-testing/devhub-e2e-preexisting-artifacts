apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06d6bd19-df3c-4e4e-a3c3-09b7fef1e708.fullname" . }}
  labels:
    {{- include "go-echo06d6bd19-df3c-4e4e-a3c3-09b7fef1e708.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06d6bd19-df3c-4e4e-a3c3-09b7fef1e708.selectorLabels" . | nindent 6 }}
