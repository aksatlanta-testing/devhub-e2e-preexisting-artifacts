apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98ce2579-4111-437a-8311-1d78942f6792.fullname" . }}
  labels:
    {{- include "go-echo98ce2579-4111-437a-8311-1d78942f6792.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98ce2579-4111-437a-8311-1d78942f6792.selectorLabels" . | nindent 6 }}
