apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo606c22e0-8999-4052-848c-a4605a75e282.fullname" . }}
  labels:
    {{- include "go-echo606c22e0-8999-4052-848c-a4605a75e282.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo606c22e0-8999-4052-848c-a4605a75e282.selectorLabels" . | nindent 6 }}
