apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c18ce11-5edb-4beb-8925-71fcadb54cdc.fullname" . }}
  labels:
    {{- include "go-echo2c18ce11-5edb-4beb-8925-71fcadb54cdc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c18ce11-5edb-4beb-8925-71fcadb54cdc.selectorLabels" . | nindent 6 }}
