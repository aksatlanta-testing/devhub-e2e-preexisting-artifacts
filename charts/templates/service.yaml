apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo14ade936-5f4c-46af-8196-3cbd1668a1ea.fullname" . }}
  labels:
    {{- include "go-echo14ade936-5f4c-46af-8196-3cbd1668a1ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo14ade936-5f4c-46af-8196-3cbd1668a1ea.selectorLabels" . | nindent 6 }}
