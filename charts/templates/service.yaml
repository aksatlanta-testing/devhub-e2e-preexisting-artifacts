apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod42a721f-d909-486d-aa35-fd7df2058d81.fullname" . }}
  labels:
    {{- include "go-echod42a721f-d909-486d-aa35-fd7df2058d81.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod42a721f-d909-486d-aa35-fd7df2058d81.selectorLabels" . | nindent 6 }}
