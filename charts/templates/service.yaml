apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac0465de-04d2-4522-9dd7-9f1969edbdcf.fullname" . }}
  labels:
    {{- include "go-echoac0465de-04d2-4522-9dd7-9f1969edbdcf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac0465de-04d2-4522-9dd7-9f1969edbdcf.selectorLabels" . | nindent 6 }}
