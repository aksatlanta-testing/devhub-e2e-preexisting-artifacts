apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46a30335-ee06-459b-b43d-faeb619c5ec7.fullname" . }}
  labels:
    {{- include "go-echo46a30335-ee06-459b-b43d-faeb619c5ec7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46a30335-ee06-459b-b43d-faeb619c5ec7.selectorLabels" . | nindent 6 }}
