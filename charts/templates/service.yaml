apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc64f0ab-5cae-45fc-aee5-6a3a087330dd.fullname" . }}
  labels:
    {{- include "go-echobc64f0ab-5cae-45fc-aee5-6a3a087330dd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc64f0ab-5cae-45fc-aee5-6a3a087330dd.selectorLabels" . | nindent 6 }}
