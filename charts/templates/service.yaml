apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce47cc01-f631-4944-a8e9-71fb79161f6f.fullname" . }}
  labels:
    {{- include "go-echoce47cc01-f631-4944-a8e9-71fb79161f6f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce47cc01-f631-4944-a8e9-71fb79161f6f.selectorLabels" . | nindent 6 }}
