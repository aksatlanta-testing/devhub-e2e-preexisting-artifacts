apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo597026cf-1e9a-49d8-8cfa-0779d337c428.fullname" . }}
  labels:
    {{- include "go-echo597026cf-1e9a-49d8-8cfa-0779d337c428.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo597026cf-1e9a-49d8-8cfa-0779d337c428.selectorLabels" . | nindent 6 }}
