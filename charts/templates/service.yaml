apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2b25246-99fa-426c-86cd-6db99df5f0c7.fullname" . }}
  labels:
    {{- include "go-echoe2b25246-99fa-426c-86cd-6db99df5f0c7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2b25246-99fa-426c-86cd-6db99df5f0c7.selectorLabels" . | nindent 6 }}
