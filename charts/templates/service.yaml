apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45ca3424-39f1-420f-966c-63dd11067047.fullname" . }}
  labels:
    {{- include "go-echo45ca3424-39f1-420f-966c-63dd11067047.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45ca3424-39f1-420f-966c-63dd11067047.selectorLabels" . | nindent 6 }}
