apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ec9ec86-e590-4685-ad70-86fb1360d5e2.fullname" . }}
  labels:
    {{- include "go-echo2ec9ec86-e590-4685-ad70-86fb1360d5e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ec9ec86-e590-4685-ad70-86fb1360d5e2.selectorLabels" . | nindent 6 }}
