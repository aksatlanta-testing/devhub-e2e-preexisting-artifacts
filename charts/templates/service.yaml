apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa79e69a1-0cb7-40fd-ac52-8ff6576ca6ac.fullname" . }}
  labels:
    {{- include "go-echoa79e69a1-0cb7-40fd-ac52-8ff6576ca6ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa79e69a1-0cb7-40fd-ac52-8ff6576ca6ac.selectorLabels" . | nindent 6 }}
