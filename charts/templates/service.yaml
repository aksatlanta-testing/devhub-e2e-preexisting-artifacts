apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6006ea88-cb4d-418c-8488-fe81acb7e15a.fullname" . }}
  labels:
    {{- include "go-echo6006ea88-cb4d-418c-8488-fe81acb7e15a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6006ea88-cb4d-418c-8488-fe81acb7e15a.selectorLabels" . | nindent 6 }}
