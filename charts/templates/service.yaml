apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c41f78b-e212-45b4-9d49-7588026f2897.fullname" . }}
  labels:
    {{- include "go-echo2c41f78b-e212-45b4-9d49-7588026f2897.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c41f78b-e212-45b4-9d49-7588026f2897.selectorLabels" . | nindent 6 }}
