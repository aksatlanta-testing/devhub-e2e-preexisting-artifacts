apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec968257-56c7-48f9-be4f-9af7b5a7d37e.fullname" . }}
  labels:
    {{- include "go-echoec968257-56c7-48f9-be4f-9af7b5a7d37e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec968257-56c7-48f9-be4f-9af7b5a7d37e.selectorLabels" . | nindent 6 }}
