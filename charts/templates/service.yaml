apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69bb38f7-7ba7-4f50-be8a-de24da3fc695.fullname" . }}
  labels:
    {{- include "go-echo69bb38f7-7ba7-4f50-be8a-de24da3fc695.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69bb38f7-7ba7-4f50-be8a-de24da3fc695.selectorLabels" . | nindent 6 }}
