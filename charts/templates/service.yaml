apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47390e74-8547-4d36-8f86-6d02d33d12f1.fullname" . }}
  labels:
    {{- include "go-echo47390e74-8547-4d36-8f86-6d02d33d12f1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
