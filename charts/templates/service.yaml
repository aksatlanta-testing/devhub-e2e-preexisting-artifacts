apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof812fa85-93b8-4d7e-ab0d-fdb41b9cfcf1.fullname" . }}
  labels:
    {{- include "go-echof812fa85-93b8-4d7e-ab0d-fdb41b9cfcf1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof812fa85-93b8-4d7e-ab0d-fdb41b9cfcf1.selectorLabels" . | nindent 6 }}
