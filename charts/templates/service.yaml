apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3181667f-9541-4045-bfb6-163aab396fd5.fullname" . }}
  labels:
    {{- include "go-echo3181667f-9541-4045-bfb6-163aab396fd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3181667f-9541-4045-bfb6-163aab396fd5.selectorLabels" . | nindent 6 }}
