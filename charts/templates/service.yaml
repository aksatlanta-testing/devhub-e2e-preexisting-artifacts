apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod843ac96-741b-4e29-98fc-df671eb95c48.fullname" . }}
  labels:
    {{- include "go-echod843ac96-741b-4e29-98fc-df671eb95c48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod843ac96-741b-4e29-98fc-df671eb95c48.selectorLabels" . | nindent 6 }}
