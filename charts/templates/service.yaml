apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d6b6a6b-a4c9-47ce-8df9-0e293781e3da.fullname" . }}
  labels:
    {{- include "go-echo1d6b6a6b-a4c9-47ce-8df9-0e293781e3da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d6b6a6b-a4c9-47ce-8df9-0e293781e3da.selectorLabels" . | nindent 6 }}
