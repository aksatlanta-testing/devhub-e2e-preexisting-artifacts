apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc6c83ebb-4e2d-49f6-a807-1a8e90544c49.fullname" . }}
  labels:
    {{- include "go-echoc6c83ebb-4e2d-49f6-a807-1a8e90544c49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc6c83ebb-4e2d-49f6-a807-1a8e90544c49.selectorLabels" . | nindent 6 }}
