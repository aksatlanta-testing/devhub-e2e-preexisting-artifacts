apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e15a15d-f501-4e19-8a32-c7d4d7035124.fullname" . }}
  labels:
    {{- include "go-echo1e15a15d-f501-4e19-8a32-c7d4d7035124.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e15a15d-f501-4e19-8a32-c7d4d7035124.selectorLabels" . | nindent 6 }}
