apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2ab3504-a897-4a78-8790-9229ed221558.fullname" . }}
  labels:
    {{- include "go-echoa2ab3504-a897-4a78-8790-9229ed221558.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2ab3504-a897-4a78-8790-9229ed221558.selectorLabels" . | nindent 6 }}
