apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof29a7c18-b4cd-431d-9df6-a903bf4d65f1.fullname" . }}
  labels:
    {{- include "go-echof29a7c18-b4cd-431d-9df6-a903bf4d65f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof29a7c18-b4cd-431d-9df6-a903bf4d65f1.selectorLabels" . | nindent 6 }}
