apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc57e4d3b-0c86-4677-a7ae-14bddc73c738.fullname" . }}
  labels:
    {{- include "go-echoc57e4d3b-0c86-4677-a7ae-14bddc73c738.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc57e4d3b-0c86-4677-a7ae-14bddc73c738.selectorLabels" . | nindent 6 }}
