apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo255842ba-d2fd-464a-a52b-3dabdf955af6.fullname" . }}
  labels:
    {{- include "go-echo255842ba-d2fd-464a-a52b-3dabdf955af6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo255842ba-d2fd-464a-a52b-3dabdf955af6.selectorLabels" . | nindent 6 }}
