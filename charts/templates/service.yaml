apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof32d4f7e-e1b0-4f3c-96c9-3e035d6ca951.fullname" . }}
  labels:
    {{- include "go-echof32d4f7e-e1b0-4f3c-96c9-3e035d6ca951.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof32d4f7e-e1b0-4f3c-96c9-3e035d6ca951.selectorLabels" . | nindent 6 }}
