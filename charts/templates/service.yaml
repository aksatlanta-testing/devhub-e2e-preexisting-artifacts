apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25915b4d-ebf2-4001-8db6-c7f944815297.fullname" . }}
  labels:
    {{- include "go-echo25915b4d-ebf2-4001-8db6-c7f944815297.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25915b4d-ebf2-4001-8db6-c7f944815297.selectorLabels" . | nindent 6 }}
