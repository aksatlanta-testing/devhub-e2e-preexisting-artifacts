apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45501c0f-cb4a-4c88-b8f3-d472fe3a19fa.fullname" . }}
  labels:
    {{- include "go-echo45501c0f-cb4a-4c88-b8f3-d472fe3a19fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45501c0f-cb4a-4c88-b8f3-d472fe3a19fa.selectorLabels" . | nindent 6 }}
