apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1a7f9e7-00ff-4cdf-8267-80319126b38c.fullname" . }}
  labels:
    {{- include "go-echoa1a7f9e7-00ff-4cdf-8267-80319126b38c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1a7f9e7-00ff-4cdf-8267-80319126b38c.selectorLabels" . | nindent 6 }}
