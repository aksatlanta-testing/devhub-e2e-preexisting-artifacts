apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d5c9f52-59f4-464f-bb14-cb618c26799d.fullname" . }}
  labels:
    {{- include "go-echo7d5c9f52-59f4-464f-bb14-cb618c26799d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d5c9f52-59f4-464f-bb14-cb618c26799d.selectorLabels" . | nindent 6 }}
