apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo582249d9-b1c4-46bb-9b70-7d0dc0f422d6.fullname" . }}
  labels:
    {{- include "go-echo582249d9-b1c4-46bb-9b70-7d0dc0f422d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo582249d9-b1c4-46bb-9b70-7d0dc0f422d6.selectorLabels" . | nindent 6 }}
