apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e34fd9e-a6c2-4906-bb3b-e2c1ef221fc8.fullname" . }}
  labels:
    {{- include "go-echo4e34fd9e-a6c2-4906-bb3b-e2c1ef221fc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e34fd9e-a6c2-4906-bb3b-e2c1ef221fc8.selectorLabels" . | nindent 6 }}
