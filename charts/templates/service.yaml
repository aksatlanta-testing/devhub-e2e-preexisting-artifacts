apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7d36216-2707-4173-9b91-b8e3d43cd9a6.fullname" . }}
  labels:
    {{- include "go-echoa7d36216-2707-4173-9b91-b8e3d43cd9a6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7d36216-2707-4173-9b91-b8e3d43cd9a6.selectorLabels" . | nindent 6 }}
