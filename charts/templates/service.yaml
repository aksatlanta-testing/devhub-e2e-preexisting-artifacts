apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62793334-4b33-4811-bad3-319ae11be414.fullname" . }}
  labels:
    {{- include "go-echo62793334-4b33-4811-bad3-319ae11be414.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62793334-4b33-4811-bad3-319ae11be414.selectorLabels" . | nindent 6 }}
