apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28b33aa2-7ae7-4e94-9b0b-d3eb28a021a3.fullname" . }}
  labels:
    {{- include "go-echo28b33aa2-7ae7-4e94-9b0b-d3eb28a021a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28b33aa2-7ae7-4e94-9b0b-d3eb28a021a3.selectorLabels" . | nindent 6 }}
