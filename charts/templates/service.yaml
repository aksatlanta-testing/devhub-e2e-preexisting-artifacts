apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e9ebde5-9ad1-4f4f-9ef5-7cfb151f6fda.fullname" . }}
  labels:
    {{- include "go-echo1e9ebde5-9ad1-4f4f-9ef5-7cfb151f6fda.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e9ebde5-9ad1-4f4f-9ef5-7cfb151f6fda.selectorLabels" . | nindent 6 }}
