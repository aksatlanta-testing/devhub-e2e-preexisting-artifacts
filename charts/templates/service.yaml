apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2efff31e-1704-434d-9aad-e3975e703973.fullname" . }}
  labels:
    {{- include "go-echo2efff31e-1704-434d-9aad-e3975e703973.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2efff31e-1704-434d-9aad-e3975e703973.selectorLabels" . | nindent 6 }}
