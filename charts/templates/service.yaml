apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15f35cb2-dd12-4696-9f6f-5cef0266a966.fullname" . }}
  labels:
    {{- include "go-echo15f35cb2-dd12-4696-9f6f-5cef0266a966.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15f35cb2-dd12-4696-9f6f-5cef0266a966.selectorLabels" . | nindent 6 }}
