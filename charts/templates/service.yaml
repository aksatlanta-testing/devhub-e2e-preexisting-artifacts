apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2560a741-b0a6-4f82-8edb-c43a34d6656a.fullname" . }}
  labels:
    {{- include "go-echo2560a741-b0a6-4f82-8edb-c43a34d6656a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2560a741-b0a6-4f82-8edb-c43a34d6656a.selectorLabels" . | nindent 6 }}
