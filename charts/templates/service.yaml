apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca6a08f9-0d94-4ad2-b977-4b3d72af17ca.fullname" . }}
  labels:
    {{- include "go-echoca6a08f9-0d94-4ad2-b977-4b3d72af17ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca6a08f9-0d94-4ad2-b977-4b3d72af17ca.selectorLabels" . | nindent 6 }}
