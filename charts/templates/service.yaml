apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50287735-bedb-4528-916f-b8a300334bdd.fullname" . }}
  labels:
    {{- include "go-echo50287735-bedb-4528-916f-b8a300334bdd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50287735-bedb-4528-916f-b8a300334bdd.selectorLabels" . | nindent 6 }}
