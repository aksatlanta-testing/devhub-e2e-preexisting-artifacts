apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabd4eae9-e67b-4537-ae84-4efc61243998.fullname" . }}
  labels:
    {{- include "go-echoabd4eae9-e67b-4537-ae84-4efc61243998.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabd4eae9-e67b-4537-ae84-4efc61243998.selectorLabels" . | nindent 6 }}
