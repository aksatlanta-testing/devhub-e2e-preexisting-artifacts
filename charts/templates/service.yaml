apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8aef62e6-709c-4694-9b45-6c3db3bb5a6f.fullname" . }}
  labels:
    {{- include "go-echo8aef62e6-709c-4694-9b45-6c3db3bb5a6f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8aef62e6-709c-4694-9b45-6c3db3bb5a6f.selectorLabels" . | nindent 6 }}
