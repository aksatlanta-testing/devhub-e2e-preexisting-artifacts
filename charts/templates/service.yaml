apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82e0f955-73df-4e58-b36f-6a4a95836979.fullname" . }}
  labels:
    {{- include "go-echo82e0f955-73df-4e58-b36f-6a4a95836979.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82e0f955-73df-4e58-b36f-6a4a95836979.selectorLabels" . | nindent 6 }}
