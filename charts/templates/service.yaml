apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7013e193-e722-47a0-95ad-f2ea252967d2.fullname" . }}
  labels:
    {{- include "go-echo7013e193-e722-47a0-95ad-f2ea252967d2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7013e193-e722-47a0-95ad-f2ea252967d2.selectorLabels" . | nindent 6 }}
