apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79e4891c-0ca1-4f94-8de7-7e2d7b47833e.fullname" . }}
  labels:
    {{- include "go-echo79e4891c-0ca1-4f94-8de7-7e2d7b47833e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79e4891c-0ca1-4f94-8de7-7e2d7b47833e.selectorLabels" . | nindent 6 }}
