apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc823d3f-3c04-4551-9911-f7de8dd5e136.fullname" . }}
  labels:
    {{- include "go-echocc823d3f-3c04-4551-9911-f7de8dd5e136.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc823d3f-3c04-4551-9911-f7de8dd5e136.selectorLabels" . | nindent 6 }}
