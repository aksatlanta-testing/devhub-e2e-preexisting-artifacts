apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58b5f5e7-fe3a-441b-8e91-f2fb7f5c9f9d.fullname" . }}
  labels:
    {{- include "go-echo58b5f5e7-fe3a-441b-8e91-f2fb7f5c9f9d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58b5f5e7-fe3a-441b-8e91-f2fb7f5c9f9d.selectorLabels" . | nindent 6 }}
