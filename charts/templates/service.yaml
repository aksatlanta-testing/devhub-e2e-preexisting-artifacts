apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74c9c597-09de-4875-83fe-5b38d1b75113.fullname" . }}
  labels:
    {{- include "go-echo74c9c597-09de-4875-83fe-5b38d1b75113.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74c9c597-09de-4875-83fe-5b38d1b75113.selectorLabels" . | nindent 6 }}
