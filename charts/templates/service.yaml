apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a595efd-0069-47cf-b7a8-b4164fe5112d.fullname" . }}
  labels:
    {{- include "go-echo6a595efd-0069-47cf-b7a8-b4164fe5112d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a595efd-0069-47cf-b7a8-b4164fe5112d.selectorLabels" . | nindent 6 }}
