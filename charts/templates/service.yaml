apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23b6d572-2f26-4bae-bf08-eed4639b116b.fullname" . }}
  labels:
    {{- include "go-echo23b6d572-2f26-4bae-bf08-eed4639b116b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23b6d572-2f26-4bae-bf08-eed4639b116b.selectorLabels" . | nindent 6 }}
