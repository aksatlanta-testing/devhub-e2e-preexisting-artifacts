apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof09b2f3d-9f22-4ad1-8305-933627bfa765.fullname" . }}
  labels:
    {{- include "go-echof09b2f3d-9f22-4ad1-8305-933627bfa765.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof09b2f3d-9f22-4ad1-8305-933627bfa765.selectorLabels" . | nindent 6 }}
