apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode86c616-867e-446e-90e7-ef6f40542fc4.fullname" . }}
  labels:
    {{- include "go-echode86c616-867e-446e-90e7-ef6f40542fc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode86c616-867e-446e-90e7-ef6f40542fc4.selectorLabels" . | nindent 6 }}
