apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68759bf0-6a5e-44b9-aa36-7ac8dab53e88.fullname" . }}
  labels:
    {{- include "go-echo68759bf0-6a5e-44b9-aa36-7ac8dab53e88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68759bf0-6a5e-44b9-aa36-7ac8dab53e88.selectorLabels" . | nindent 6 }}
