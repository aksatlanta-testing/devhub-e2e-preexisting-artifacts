apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo157f2aa2-dda6-4134-b4c2-24b9d485290f.fullname" . }}
  labels:
    {{- include "go-echo157f2aa2-dda6-4134-b4c2-24b9d485290f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo157f2aa2-dda6-4134-b4c2-24b9d485290f.selectorLabels" . | nindent 6 }}
