apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61c24110-8c11-41c8-90c0-38ef9555b88e.fullname" . }}
  labels:
    {{- include "go-echo61c24110-8c11-41c8-90c0-38ef9555b88e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61c24110-8c11-41c8-90c0-38ef9555b88e.selectorLabels" . | nindent 6 }}
