apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96f9e030-361f-40bf-9baf-f59356c2917d.fullname" . }}
  labels:
    {{- include "go-echo96f9e030-361f-40bf-9baf-f59356c2917d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96f9e030-361f-40bf-9baf-f59356c2917d.selectorLabels" . | nindent 6 }}
