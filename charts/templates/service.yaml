apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98c51ebc-e7f1-41da-82af-af9ee61e669e.fullname" . }}
  labels:
    {{- include "go-echo98c51ebc-e7f1-41da-82af-af9ee61e669e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98c51ebc-e7f1-41da-82af-af9ee61e669e.selectorLabels" . | nindent 6 }}
