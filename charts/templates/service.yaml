apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2db92ec6-32a9-4677-8673-b8aba2033848.fullname" . }}
  labels:
    {{- include "go-echo2db92ec6-32a9-4677-8673-b8aba2033848.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2db92ec6-32a9-4677-8673-b8aba2033848.selectorLabels" . | nindent 6 }}
