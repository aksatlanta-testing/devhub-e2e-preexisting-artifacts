apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6ac6bcb-7d75-4c66-9241-403045bf2226.fullname" . }}
  labels:
    {{- include "go-echoe6ac6bcb-7d75-4c66-9241-403045bf2226.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6ac6bcb-7d75-4c66-9241-403045bf2226.selectorLabels" . | nindent 6 }}
