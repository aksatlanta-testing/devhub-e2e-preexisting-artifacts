apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2bf2e948-7ae6-4393-bf3d-b4d5b3ace7f0.fullname" . }}
  labels:
    {{- include "go-echo2bf2e948-7ae6-4393-bf3d-b4d5b3ace7f0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2bf2e948-7ae6-4393-bf3d-b4d5b3ace7f0.selectorLabels" . | nindent 6 }}
