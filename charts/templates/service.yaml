apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3e46b3a-571b-462d-b84e-177602a82e39.fullname" . }}
  labels:
    {{- include "go-echob3e46b3a-571b-462d-b84e-177602a82e39.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3e46b3a-571b-462d-b84e-177602a82e39.selectorLabels" . | nindent 6 }}
