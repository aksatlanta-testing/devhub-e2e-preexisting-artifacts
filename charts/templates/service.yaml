apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d9ccc2e-08e5-4480-b044-0bdb3b370952.fullname" . }}
  labels:
    {{- include "go-echo9d9ccc2e-08e5-4480-b044-0bdb3b370952.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d9ccc2e-08e5-4480-b044-0bdb3b370952.selectorLabels" . | nindent 6 }}
