apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc33b99d-0498-4dae-8b28-f2efe815de40.fullname" . }}
  labels:
    {{- include "go-echobc33b99d-0498-4dae-8b28-f2efe815de40.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc33b99d-0498-4dae-8b28-f2efe815de40.selectorLabels" . | nindent 6 }}
