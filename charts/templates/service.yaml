apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof88c0038-9622-45e8-b753-3bf97318233e.fullname" . }}
  labels:
    {{- include "go-echof88c0038-9622-45e8-b753-3bf97318233e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof88c0038-9622-45e8-b753-3bf97318233e.selectorLabels" . | nindent 6 }}
