apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef84a011-b8fc-4a5c-ad03-1db1003ba9db.fullname" . }}
  labels:
    {{- include "go-echoef84a011-b8fc-4a5c-ad03-1db1003ba9db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef84a011-b8fc-4a5c-ad03-1db1003ba9db.selectorLabels" . | nindent 6 }}
