apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fac57d3-7b26-4b7c-a65b-f57f65153570.fullname" . }}
  labels:
    {{- include "go-echo9fac57d3-7b26-4b7c-a65b-f57f65153570.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fac57d3-7b26-4b7c-a65b-f57f65153570.selectorLabels" . | nindent 6 }}
