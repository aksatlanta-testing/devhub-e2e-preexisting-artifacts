apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf77a3da-f1a2-4b5c-a9e7-461eb3567f95.fullname" . }}
  labels:
    {{- include "go-echodf77a3da-f1a2-4b5c-a9e7-461eb3567f95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf77a3da-f1a2-4b5c-a9e7-461eb3567f95.selectorLabels" . | nindent 6 }}
