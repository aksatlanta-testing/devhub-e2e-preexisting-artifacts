apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18daf192-13ea-4110-8388-0d4f7a939387.fullname" . }}
  labels:
    {{- include "go-echo18daf192-13ea-4110-8388-0d4f7a939387.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18daf192-13ea-4110-8388-0d4f7a939387.selectorLabels" . | nindent 6 }}
