apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob81bf124-a61d-4387-8e8f-dc7030d3f785.fullname" . }}
  labels:
    {{- include "go-echob81bf124-a61d-4387-8e8f-dc7030d3f785.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob81bf124-a61d-4387-8e8f-dc7030d3f785.selectorLabels" . | nindent 6 }}
