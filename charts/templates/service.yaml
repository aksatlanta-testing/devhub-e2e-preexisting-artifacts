apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0fd2605b-1c72-4c00-b04d-e49dabad1984.fullname" . }}
  labels:
    {{- include "go-echo0fd2605b-1c72-4c00-b04d-e49dabad1984.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0fd2605b-1c72-4c00-b04d-e49dabad1984.selectorLabels" . | nindent 6 }}
