apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c28b708-1d3f-41b3-9242-0502b3afcbe0.fullname" . }}
  labels:
    {{- include "go-echo4c28b708-1d3f-41b3-9242-0502b3afcbe0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c28b708-1d3f-41b3-9242-0502b3afcbe0.selectorLabels" . | nindent 6 }}
