apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41f24db2-7cbe-4ee1-82d2-42608a1a1fa2.fullname" . }}
  labels:
    {{- include "go-echo41f24db2-7cbe-4ee1-82d2-42608a1a1fa2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41f24db2-7cbe-4ee1-82d2-42608a1a1fa2.selectorLabels" . | nindent 6 }}
