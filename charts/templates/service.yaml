apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo391a5559-2e34-444c-bf84-9bcda27d867a.fullname" . }}
  labels:
    {{- include "go-echo391a5559-2e34-444c-bf84-9bcda27d867a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo391a5559-2e34-444c-bf84-9bcda27d867a.selectorLabels" . | nindent 6 }}
