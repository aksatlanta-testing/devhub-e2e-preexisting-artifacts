apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31c03a15-33db-4d49-80f0-634727c3bead.fullname" . }}
  labels:
    {{- include "go-echo31c03a15-33db-4d49-80f0-634727c3bead.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31c03a15-33db-4d49-80f0-634727c3bead.selectorLabels" . | nindent 6 }}
