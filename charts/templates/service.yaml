apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b9f12be-0300-41d7-91c3-c762129cb5b1.fullname" . }}
  labels:
    {{- include "go-echo5b9f12be-0300-41d7-91c3-c762129cb5b1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b9f12be-0300-41d7-91c3-c762129cb5b1.selectorLabels" . | nindent 6 }}
