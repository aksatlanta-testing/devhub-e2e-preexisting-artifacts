apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7dadf7ed-0cb0-4118-a30e-0294bf4c9a23.fullname" . }}
  labels:
    {{- include "go-echo7dadf7ed-0cb0-4118-a30e-0294bf4c9a23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7dadf7ed-0cb0-4118-a30e-0294bf4c9a23.selectorLabels" . | nindent 6 }}
