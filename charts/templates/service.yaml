apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90f4b106-4074-4128-9194-0f453f5d2074.fullname" . }}
  labels:
    {{- include "go-echo90f4b106-4074-4128-9194-0f453f5d2074.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90f4b106-4074-4128-9194-0f453f5d2074.selectorLabels" . | nindent 6 }}
