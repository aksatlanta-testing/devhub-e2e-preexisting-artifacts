apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d5c4380-12f2-4f14-b45a-46abd359b18e.fullname" . }}
  labels:
    {{- include "go-echo4d5c4380-12f2-4f14-b45a-46abd359b18e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d5c4380-12f2-4f14-b45a-46abd359b18e.selectorLabels" . | nindent 6 }}
