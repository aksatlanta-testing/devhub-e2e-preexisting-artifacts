apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof143c75b-72a9-4e72-9ec0-a372aacb5947.fullname" . }}
  labels:
    {{- include "go-echof143c75b-72a9-4e72-9ec0-a372aacb5947.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof143c75b-72a9-4e72-9ec0-a372aacb5947.selectorLabels" . | nindent 6 }}
