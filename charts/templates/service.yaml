apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0296f761-683b-4a2d-90c7-559addb7d11c.fullname" . }}
  labels:
    {{- include "go-echo0296f761-683b-4a2d-90c7-559addb7d11c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0296f761-683b-4a2d-90c7-559addb7d11c.selectorLabels" . | nindent 6 }}
