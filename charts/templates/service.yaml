apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa13a819e-1684-480c-9cef-0c81ee047e03.fullname" . }}
  labels:
    {{- include "go-echoa13a819e-1684-480c-9cef-0c81ee047e03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa13a819e-1684-480c-9cef-0c81ee047e03.selectorLabels" . | nindent 6 }}
