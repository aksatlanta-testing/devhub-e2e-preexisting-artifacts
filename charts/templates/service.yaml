apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe00f62de-629a-4bc3-8223-d2eed51cd4f8.fullname" . }}
  labels:
    {{- include "go-echoe00f62de-629a-4bc3-8223-d2eed51cd4f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe00f62de-629a-4bc3-8223-d2eed51cd4f8.selectorLabels" . | nindent 6 }}
