apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f849b5c-3c54-4712-96eb-b3e7ad84fafe.fullname" . }}
  labels:
    {{- include "go-echo3f849b5c-3c54-4712-96eb-b3e7ad84fafe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f849b5c-3c54-4712-96eb-b3e7ad84fafe.selectorLabels" . | nindent 6 }}
