apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocdc471d0-f1f9-403d-b385-c3160ce61492.fullname" . }}
  labels:
    {{- include "go-echocdc471d0-f1f9-403d-b385-c3160ce61492.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocdc471d0-f1f9-403d-b385-c3160ce61492.selectorLabels" . | nindent 6 }}
