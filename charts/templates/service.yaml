apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17814069-5090-4d90-9cf9-adf196a92382.fullname" . }}
  labels:
    {{- include "go-echo17814069-5090-4d90-9cf9-adf196a92382.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17814069-5090-4d90-9cf9-adf196a92382.selectorLabels" . | nindent 6 }}
