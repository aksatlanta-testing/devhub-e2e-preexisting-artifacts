apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73f2f3e2-f37b-4a84-bf28-a9dc63a73f00.fullname" . }}
  labels:
    {{- include "go-echo73f2f3e2-f37b-4a84-bf28-a9dc63a73f00.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73f2f3e2-f37b-4a84-bf28-a9dc63a73f00.selectorLabels" . | nindent 6 }}
