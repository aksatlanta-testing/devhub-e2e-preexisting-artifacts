apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobae3b30f-dc2c-4cf5-8e9f-0cc8af845970.fullname" . }}
  labels:
    {{- include "go-echobae3b30f-dc2c-4cf5-8e9f-0cc8af845970.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobae3b30f-dc2c-4cf5-8e9f-0cc8af845970.selectorLabels" . | nindent 6 }}
