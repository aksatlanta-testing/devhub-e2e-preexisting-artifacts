apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8ba994c-1708-4e56-984a-d0cd9f642c8c.fullname" . }}
  labels:
    {{- include "go-echoe8ba994c-1708-4e56-984a-d0cd9f642c8c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8ba994c-1708-4e56-984a-d0cd9f642c8c.selectorLabels" . | nindent 6 }}
