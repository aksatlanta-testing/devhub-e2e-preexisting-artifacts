apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95d03c5e-81bd-46df-8364-b2cd7975dd82.fullname" . }}
  labels:
    {{- include "go-echo95d03c5e-81bd-46df-8364-b2cd7975dd82.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95d03c5e-81bd-46df-8364-b2cd7975dd82.selectorLabels" . | nindent 6 }}
