apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed2d7bfa-93ee-448f-8d1a-608c919f0bc5.fullname" . }}
  labels:
    {{- include "go-echoed2d7bfa-93ee-448f-8d1a-608c919f0bc5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed2d7bfa-93ee-448f-8d1a-608c919f0bc5.selectorLabels" . | nindent 6 }}
