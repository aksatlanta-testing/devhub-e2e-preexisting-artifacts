apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e88b294-ea0f-479c-9653-a54eba8a60c6.fullname" . }}
  labels:
    {{- include "go-echo3e88b294-ea0f-479c-9653-a54eba8a60c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e88b294-ea0f-479c-9653-a54eba8a60c6.selectorLabels" . | nindent 6 }}
