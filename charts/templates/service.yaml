apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc657b6cf-98e6-44c5-adae-33424438baed.fullname" . }}
  labels:
    {{- include "go-echoc657b6cf-98e6-44c5-adae-33424438baed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc657b6cf-98e6-44c5-adae-33424438baed.selectorLabels" . | nindent 6 }}
