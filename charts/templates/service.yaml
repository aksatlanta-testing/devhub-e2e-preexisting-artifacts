apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo177ad7eb-e04a-44c2-8453-43d53893b900.fullname" . }}
  labels:
    {{- include "go-echo177ad7eb-e04a-44c2-8453-43d53893b900.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo177ad7eb-e04a-44c2-8453-43d53893b900.selectorLabels" . | nindent 6 }}
