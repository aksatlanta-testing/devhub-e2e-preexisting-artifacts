apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd59aa2e-a464-4100-9396-2a2fe9e7f24a.fullname" . }}
  labels:
    {{- include "go-echobd59aa2e-a464-4100-9396-2a2fe9e7f24a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd59aa2e-a464-4100-9396-2a2fe9e7f24a.selectorLabels" . | nindent 6 }}
