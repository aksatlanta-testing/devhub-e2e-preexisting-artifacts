apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc0b28b7-0d49-4696-b2af-7530ee648374.fullname" . }}
  labels:
    {{- include "go-echofc0b28b7-0d49-4696-b2af-7530ee648374.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc0b28b7-0d49-4696-b2af-7530ee648374.selectorLabels" . | nindent 6 }}
