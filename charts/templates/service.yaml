apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7edefaf-ee98-4be4-bff7-0218ddb92950.fullname" . }}
  labels:
    {{- include "go-echoc7edefaf-ee98-4be4-bff7-0218ddb92950.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7edefaf-ee98-4be4-bff7-0218ddb92950.selectorLabels" . | nindent 6 }}
