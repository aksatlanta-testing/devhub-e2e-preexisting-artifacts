apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05dda8b9-9fc1-48ea-8835-9cf7a3970e18.fullname" . }}
  labels:
    {{- include "go-echo05dda8b9-9fc1-48ea-8835-9cf7a3970e18.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05dda8b9-9fc1-48ea-8835-9cf7a3970e18.selectorLabels" . | nindent 6 }}
