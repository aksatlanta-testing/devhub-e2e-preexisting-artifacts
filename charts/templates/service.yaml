apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38dc29c8-8081-47ba-901f-626623b6da2f.fullname" . }}
  labels:
    {{- include "go-echo38dc29c8-8081-47ba-901f-626623b6da2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38dc29c8-8081-47ba-901f-626623b6da2f.selectorLabels" . | nindent 6 }}
