apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo493486f8-f65b-4a01-991b-47e42d4e613e.fullname" . }}
  labels:
    {{- include "go-echo493486f8-f65b-4a01-991b-47e42d4e613e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo493486f8-f65b-4a01-991b-47e42d4e613e.selectorLabels" . | nindent 6 }}
