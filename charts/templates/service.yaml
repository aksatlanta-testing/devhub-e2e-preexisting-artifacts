apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod95d3b7a-30fc-46f1-9306-c15f26ad1762.fullname" . }}
  labels:
    {{- include "go-echod95d3b7a-30fc-46f1-9306-c15f26ad1762.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod95d3b7a-30fc-46f1-9306-c15f26ad1762.selectorLabels" . | nindent 6 }}
