apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00c1f9d0-6258-4c6a-b7eb-487c53a5a362.fullname" . }}
  labels:
    {{- include "go-echo00c1f9d0-6258-4c6a-b7eb-487c53a5a362.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00c1f9d0-6258-4c6a-b7eb-487c53a5a362.selectorLabels" . | nindent 6 }}
