apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5791ce5a-bb51-4e90-9942-aacadaa3ba04.fullname" . }}
  labels:
    {{- include "go-echo5791ce5a-bb51-4e90-9942-aacadaa3ba04.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5791ce5a-bb51-4e90-9942-aacadaa3ba04.selectorLabels" . | nindent 6 }}
