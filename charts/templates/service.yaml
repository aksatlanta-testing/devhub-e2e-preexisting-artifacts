apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo012cc32d-197b-4d79-ab45-8c53d6af7f45.fullname" . }}
  labels:
    {{- include "go-echo012cc32d-197b-4d79-ab45-8c53d6af7f45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo012cc32d-197b-4d79-ab45-8c53d6af7f45.selectorLabels" . | nindent 6 }}
