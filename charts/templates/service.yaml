apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96a31adb-4ae0-4954-ab98-f4205310d1fc.fullname" . }}
  labels:
    {{- include "go-echo96a31adb-4ae0-4954-ab98-f4205310d1fc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96a31adb-4ae0-4954-ab98-f4205310d1fc.selectorLabels" . | nindent 6 }}
