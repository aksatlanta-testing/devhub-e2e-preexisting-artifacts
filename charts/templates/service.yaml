apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a0875d7-d36f-437c-b668-47590a713321.fullname" . }}
  labels:
    {{- include "go-echo1a0875d7-d36f-437c-b668-47590a713321.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a0875d7-d36f-437c-b668-47590a713321.selectorLabels" . | nindent 6 }}
