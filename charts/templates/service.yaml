apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo284dfd01-55e1-4ce2-8ed5-3e25cd19b692.fullname" . }}
  labels:
    {{- include "go-echo284dfd01-55e1-4ce2-8ed5-3e25cd19b692.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo284dfd01-55e1-4ce2-8ed5-3e25cd19b692.selectorLabels" . | nindent 6 }}
