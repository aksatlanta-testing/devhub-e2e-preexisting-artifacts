apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06b774ec-7df7-4c8a-9ff3-4db04c088879.fullname" . }}
  labels:
    {{- include "go-echo06b774ec-7df7-4c8a-9ff3-4db04c088879.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06b774ec-7df7-4c8a-9ff3-4db04c088879.selectorLabels" . | nindent 6 }}
