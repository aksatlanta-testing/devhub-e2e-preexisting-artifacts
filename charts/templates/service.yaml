apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20088a16-c1c5-4d87-8a0f-2d8a8f9b5da9.fullname" . }}
  labels:
    {{- include "go-echo20088a16-c1c5-4d87-8a0f-2d8a8f9b5da9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20088a16-c1c5-4d87-8a0f-2d8a8f9b5da9.selectorLabels" . | nindent 6 }}
