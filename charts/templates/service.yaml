apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2fd5a7a-aedb-448c-819d-dce29bdaa0ca.fullname" . }}
  labels:
    {{- include "go-echoc2fd5a7a-aedb-448c-819d-dce29bdaa0ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2fd5a7a-aedb-448c-819d-dce29bdaa0ca.selectorLabels" . | nindent 6 }}
