apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd2a021f-3e7f-48ea-95ef-f2decf2ea7d7.fullname" . }}
  labels:
    {{- include "go-echofd2a021f-3e7f-48ea-95ef-f2decf2ea7d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd2a021f-3e7f-48ea-95ef-f2decf2ea7d7.selectorLabels" . | nindent 6 }}
