apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe168bf58-f71e-4629-a88b-0eaf6848a231.fullname" . }}
  labels:
    {{- include "go-echoe168bf58-f71e-4629-a88b-0eaf6848a231.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe168bf58-f71e-4629-a88b-0eaf6848a231.selectorLabels" . | nindent 6 }}
