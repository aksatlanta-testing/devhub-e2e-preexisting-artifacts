apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7724182-f198-4149-98b5-fbc97f9353dd.fullname" . }}
  labels:
    {{- include "go-echoa7724182-f198-4149-98b5-fbc97f9353dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7724182-f198-4149-98b5-fbc97f9353dd.selectorLabels" . | nindent 6 }}
