apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9bb933b-0009-46bf-8a21-c57eaa2eca99.fullname" . }}
  labels:
    {{- include "go-echoc9bb933b-0009-46bf-8a21-c57eaa2eca99.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9bb933b-0009-46bf-8a21-c57eaa2eca99.selectorLabels" . | nindent 6 }}
