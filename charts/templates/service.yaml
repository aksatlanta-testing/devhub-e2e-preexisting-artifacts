apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3dc033eb-0a07-4199-a20c-4731502d0731.fullname" . }}
  labels:
    {{- include "go-echo3dc033eb-0a07-4199-a20c-4731502d0731.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3dc033eb-0a07-4199-a20c-4731502d0731.selectorLabels" . | nindent 6 }}
