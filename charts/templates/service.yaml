apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo301a7fe7-bf69-42c7-a47f-1eedc6336cbc.fullname" . }}
  labels:
    {{- include "go-echo301a7fe7-bf69-42c7-a47f-1eedc6336cbc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo301a7fe7-bf69-42c7-a47f-1eedc6336cbc.selectorLabels" . | nindent 6 }}
