apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo239f4124-a620-4c05-9c20-2b2a4367ddc0.fullname" . }}
  labels:
    {{- include "go-echo239f4124-a620-4c05-9c20-2b2a4367ddc0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo239f4124-a620-4c05-9c20-2b2a4367ddc0.selectorLabels" . | nindent 6 }}
