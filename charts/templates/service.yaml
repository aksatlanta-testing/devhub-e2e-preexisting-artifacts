apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8848ab37-1c53-452f-920a-7b0c9edbd3ca.fullname" . }}
  labels:
    {{- include "go-echo8848ab37-1c53-452f-920a-7b0c9edbd3ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8848ab37-1c53-452f-920a-7b0c9edbd3ca.selectorLabels" . | nindent 6 }}
