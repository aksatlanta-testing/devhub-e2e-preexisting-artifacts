apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66f9a5c2-6777-4774-8a4b-18e0b02622fa.fullname" . }}
  labels:
    {{- include "go-echo66f9a5c2-6777-4774-8a4b-18e0b02622fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66f9a5c2-6777-4774-8a4b-18e0b02622fa.selectorLabels" . | nindent 6 }}
