apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe56907de-bb59-4f89-a6ae-6370de0a5653.fullname" . }}
  labels:
    {{- include "go-echoe56907de-bb59-4f89-a6ae-6370de0a5653.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe56907de-bb59-4f89-a6ae-6370de0a5653.selectorLabels" . | nindent 6 }}
