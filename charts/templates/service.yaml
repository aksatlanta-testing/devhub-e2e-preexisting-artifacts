apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a2f8f1c-3776-4b9f-a582-896c9a5c42b9.fullname" . }}
  labels:
    {{- include "go-echo9a2f8f1c-3776-4b9f-a582-896c9a5c42b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a2f8f1c-3776-4b9f-a582-896c9a5c42b9.selectorLabels" . | nindent 6 }}
