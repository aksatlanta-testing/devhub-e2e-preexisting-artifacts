apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3bb4580b-f4d8-4262-a051-1c1b9f725607.fullname" . }}
  labels:
    {{- include "go-echo3bb4580b-f4d8-4262-a051-1c1b9f725607.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3bb4580b-f4d8-4262-a051-1c1b9f725607.selectorLabels" . | nindent 6 }}
