apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa886ca77-ab6d-4c8e-90e6-cd1a1363c06b.fullname" . }}
  labels:
    {{- include "go-echoa886ca77-ab6d-4c8e-90e6-cd1a1363c06b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa886ca77-ab6d-4c8e-90e6-cd1a1363c06b.selectorLabels" . | nindent 6 }}
