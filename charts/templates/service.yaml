apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo482bdc25-4f83-4fa6-8c09-f10eb143bffb.fullname" . }}
  labels:
    {{- include "go-echo482bdc25-4f83-4fa6-8c09-f10eb143bffb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo482bdc25-4f83-4fa6-8c09-f10eb143bffb.selectorLabels" . | nindent 6 }}
