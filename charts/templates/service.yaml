apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17c4bd42-b8be-451c-ab0b-ed4644b5b96e.fullname" . }}
  labels:
    {{- include "go-echo17c4bd42-b8be-451c-ab0b-ed4644b5b96e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17c4bd42-b8be-451c-ab0b-ed4644b5b96e.selectorLabels" . | nindent 6 }}
