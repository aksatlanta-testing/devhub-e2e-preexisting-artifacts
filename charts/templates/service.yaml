apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17e14741-d20d-4e94-bd83-a16bdeb07d9b.fullname" . }}
  labels:
    {{- include "go-echo17e14741-d20d-4e94-bd83-a16bdeb07d9b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17e14741-d20d-4e94-bd83-a16bdeb07d9b.selectorLabels" . | nindent 6 }}
