apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3993e13-6b03-4862-b38b-e8c9bd21e616.fullname" . }}
  labels:
    {{- include "go-echoc3993e13-6b03-4862-b38b-e8c9bd21e616.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3993e13-6b03-4862-b38b-e8c9bd21e616.selectorLabels" . | nindent 6 }}
