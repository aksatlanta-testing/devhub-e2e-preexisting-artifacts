apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23ded38d-1867-4273-a3d1-ae6c2dce8761.fullname" . }}
  labels:
    {{- include "go-echo23ded38d-1867-4273-a3d1-ae6c2dce8761.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23ded38d-1867-4273-a3d1-ae6c2dce8761.selectorLabels" . | nindent 6 }}
