apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo515e44f7-1caf-4a22-94f9-ec990ccccb5a.fullname" . }}
  labels:
    {{- include "go-echo515e44f7-1caf-4a22-94f9-ec990ccccb5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo515e44f7-1caf-4a22-94f9-ec990ccccb5a.selectorLabels" . | nindent 6 }}
