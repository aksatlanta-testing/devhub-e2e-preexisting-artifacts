apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0efc34d5-1e9f-470e-b970-bf465e8df1f4.fullname" . }}
  labels:
    {{- include "go-echo0efc34d5-1e9f-470e-b970-bf465e8df1f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0efc34d5-1e9f-470e-b970-bf465e8df1f4.selectorLabels" . | nindent 6 }}
