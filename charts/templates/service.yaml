apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob70cefd0-84ff-4033-a2ef-de18c3513cce.fullname" . }}
  labels:
    {{- include "go-echob70cefd0-84ff-4033-a2ef-de18c3513cce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob70cefd0-84ff-4033-a2ef-de18c3513cce.selectorLabels" . | nindent 6 }}
