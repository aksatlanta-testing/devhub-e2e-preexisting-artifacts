apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b557a7e-1387-4592-a628-8843e20da88b.fullname" . }}
  labels:
    {{- include "go-echo7b557a7e-1387-4592-a628-8843e20da88b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b557a7e-1387-4592-a628-8843e20da88b.selectorLabels" . | nindent 6 }}
