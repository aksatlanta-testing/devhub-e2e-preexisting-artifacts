apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20a0cb1f-9091-4c7b-92f8-6d81c482345a.fullname" . }}
  labels:
    {{- include "go-echo20a0cb1f-9091-4c7b-92f8-6d81c482345a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20a0cb1f-9091-4c7b-92f8-6d81c482345a.selectorLabels" . | nindent 6 }}
