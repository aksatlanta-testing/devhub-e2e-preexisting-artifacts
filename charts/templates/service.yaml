apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f229d62-532e-4186-8fdd-48922e7a705f.fullname" . }}
  labels:
    {{- include "go-echo4f229d62-532e-4186-8fdd-48922e7a705f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f229d62-532e-4186-8fdd-48922e7a705f.selectorLabels" . | nindent 6 }}
