apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ea60623-1031-40b4-9200-ef70e6ff14ab.fullname" . }}
  labels:
    {{- include "go-echo8ea60623-1031-40b4-9200-ef70e6ff14ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ea60623-1031-40b4-9200-ef70e6ff14ab.selectorLabels" . | nindent 6 }}
