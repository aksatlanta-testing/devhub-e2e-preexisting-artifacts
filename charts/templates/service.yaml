apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea380abf-0732-4aae-8fbe-d3ca3bf1ab9e.fullname" . }}
  labels:
    {{- include "go-echoea380abf-0732-4aae-8fbe-d3ca3bf1ab9e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea380abf-0732-4aae-8fbe-d3ca3bf1ab9e.selectorLabels" . | nindent 6 }}
