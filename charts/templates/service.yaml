apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01da595e-c319-47e5-b75f-2cd7ba4840a4.fullname" . }}
  labels:
    {{- include "go-echo01da595e-c319-47e5-b75f-2cd7ba4840a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01da595e-c319-47e5-b75f-2cd7ba4840a4.selectorLabels" . | nindent 6 }}
