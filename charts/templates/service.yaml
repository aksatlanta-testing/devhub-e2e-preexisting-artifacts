apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45d728df-557a-40b1-bd43-68c3edb1d497.fullname" . }}
  labels:
    {{- include "go-echo45d728df-557a-40b1-bd43-68c3edb1d497.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45d728df-557a-40b1-bd43-68c3edb1d497.selectorLabels" . | nindent 6 }}
