apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41cb659b-cb6b-4649-8dc4-c9c5550813d0.fullname" . }}
  labels:
    {{- include "go-echo41cb659b-cb6b-4649-8dc4-c9c5550813d0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41cb659b-cb6b-4649-8dc4-c9c5550813d0.selectorLabels" . | nindent 6 }}
