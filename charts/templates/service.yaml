apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb086a81-b15c-4f74-8661-b6f164bfa635.fullname" . }}
  labels:
    {{- include "go-echofb086a81-b15c-4f74-8661-b6f164bfa635.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb086a81-b15c-4f74-8661-b6f164bfa635.selectorLabels" . | nindent 6 }}
