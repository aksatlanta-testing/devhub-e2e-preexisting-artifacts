apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofbee31b5-d48e-4459-832e-0ff3fd69d012.fullname" . }}
  labels:
    {{- include "go-echofbee31b5-d48e-4459-832e-0ff3fd69d012.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofbee31b5-d48e-4459-832e-0ff3fd69d012.selectorLabels" . | nindent 6 }}
