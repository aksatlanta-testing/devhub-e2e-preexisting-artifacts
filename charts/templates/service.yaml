apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3c2a0a9-afe4-44bf-85df-07ced15239bf.fullname" . }}
  labels:
    {{- include "go-echoc3c2a0a9-afe4-44bf-85df-07ced15239bf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3c2a0a9-afe4-44bf-85df-07ced15239bf.selectorLabels" . | nindent 6 }}
