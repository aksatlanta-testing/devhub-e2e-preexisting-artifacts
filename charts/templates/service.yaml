apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76280bbb-8cf7-4e0f-8ab1-a62d7f38572a.fullname" . }}
  labels:
    {{- include "go-echo76280bbb-8cf7-4e0f-8ab1-a62d7f38572a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76280bbb-8cf7-4e0f-8ab1-a62d7f38572a.selectorLabels" . | nindent 6 }}
