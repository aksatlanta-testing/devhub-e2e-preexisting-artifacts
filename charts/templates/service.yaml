apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4dd8799f-3daa-4320-883e-5142d651b895.fullname" . }}
  labels:
    {{- include "go-echo4dd8799f-3daa-4320-883e-5142d651b895.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4dd8799f-3daa-4320-883e-5142d651b895.selectorLabels" . | nindent 6 }}
