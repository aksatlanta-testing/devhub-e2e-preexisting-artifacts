apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof48b16e8-1ac8-45c5-9fc8-e7265494f950.fullname" . }}
  labels:
    {{- include "go-echof48b16e8-1ac8-45c5-9fc8-e7265494f950.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof48b16e8-1ac8-45c5-9fc8-e7265494f950.selectorLabels" . | nindent 6 }}
