apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2829e961-46be-4c49-b6f4-699b6d21d42b.fullname" . }}
  labels:
    {{- include "go-echo2829e961-46be-4c49-b6f4-699b6d21d42b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2829e961-46be-4c49-b6f4-699b6d21d42b.selectorLabels" . | nindent 6 }}
