apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2af74ef-e732-473b-bd0e-209d4f0895f5.fullname" . }}
  labels:
    {{- include "go-echoa2af74ef-e732-473b-bd0e-209d4f0895f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2af74ef-e732-473b-bd0e-209d4f0895f5.selectorLabels" . | nindent 6 }}
