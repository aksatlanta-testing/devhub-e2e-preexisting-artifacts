apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d586caf-c161-49bc-9a7f-b193856bbf07.fullname" . }}
  labels:
    {{- include "go-echo7d586caf-c161-49bc-9a7f-b193856bbf07.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d586caf-c161-49bc-9a7f-b193856bbf07.selectorLabels" . | nindent 6 }}
