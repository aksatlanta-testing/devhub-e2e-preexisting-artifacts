apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8de2606b-4625-4f85-be29-9c851519782f.fullname" . }}
  labels:
    {{- include "go-echo8de2606b-4625-4f85-be29-9c851519782f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8de2606b-4625-4f85-be29-9c851519782f.selectorLabels" . | nindent 6 }}
