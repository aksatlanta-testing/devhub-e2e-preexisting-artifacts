apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeea990de-030f-4bca-877e-8a57defa5b53.fullname" . }}
  labels:
    {{- include "go-echoeea990de-030f-4bca-877e-8a57defa5b53.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeea990de-030f-4bca-877e-8a57defa5b53.selectorLabels" . | nindent 6 }}
