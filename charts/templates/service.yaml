apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0319df0f-62cd-4613-82bc-ae02da978dd7.fullname" . }}
  labels:
    {{- include "go-echo0319df0f-62cd-4613-82bc-ae02da978dd7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0319df0f-62cd-4613-82bc-ae02da978dd7.selectorLabels" . | nindent 6 }}
