apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo326d00ee-7008-4de7-afd1-3cd0d0cd323d.fullname" . }}
  labels:
    {{- include "go-echo326d00ee-7008-4de7-afd1-3cd0d0cd323d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo326d00ee-7008-4de7-afd1-3cd0d0cd323d.selectorLabels" . | nindent 6 }}
