apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b5d7f4e-92c5-4634-805d-bd557c598250.fullname" . }}
  labels:
    {{- include "go-echo0b5d7f4e-92c5-4634-805d-bd557c598250.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b5d7f4e-92c5-4634-805d-bd557c598250.selectorLabels" . | nindent 6 }}
