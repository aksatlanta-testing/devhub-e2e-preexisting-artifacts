apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeba78a8f-80c6-47d3-bb6d-601783bb3506.fullname" . }}
  labels:
    {{- include "go-echoeba78a8f-80c6-47d3-bb6d-601783bb3506.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeba78a8f-80c6-47d3-bb6d-601783bb3506.selectorLabels" . | nindent 6 }}
