apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6c55db7-6cf0-4253-9f41-3bf9d797f506.fullname" . }}
  labels:
    {{- include "go-echob6c55db7-6cf0-4253-9f41-3bf9d797f506.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6c55db7-6cf0-4253-9f41-3bf9d797f506.selectorLabels" . | nindent 6 }}
