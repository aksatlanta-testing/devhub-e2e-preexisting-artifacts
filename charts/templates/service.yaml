apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47d2667c-22c6-40be-91f1-9846fb113745.fullname" . }}
  labels:
    {{- include "go-echo47d2667c-22c6-40be-91f1-9846fb113745.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47d2667c-22c6-40be-91f1-9846fb113745.selectorLabels" . | nindent 6 }}
