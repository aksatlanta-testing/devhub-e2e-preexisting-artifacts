apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a526e86-dcc7-4e9e-bd0d-bb7747ac2d39.fullname" . }}
  labels:
    {{- include "go-echo5a526e86-dcc7-4e9e-bd0d-bb7747ac2d39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a526e86-dcc7-4e9e-bd0d-bb7747ac2d39.selectorLabels" . | nindent 6 }}
