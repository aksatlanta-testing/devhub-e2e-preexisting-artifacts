apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2205fb9b-99bd-4bb6-b345-332e7e485776.fullname" . }}
  labels:
    {{- include "go-echo2205fb9b-99bd-4bb6-b345-332e7e485776.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2205fb9b-99bd-4bb6-b345-332e7e485776.selectorLabels" . | nindent 6 }}
