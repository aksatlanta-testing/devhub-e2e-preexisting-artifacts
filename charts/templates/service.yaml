apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fd2d38f-27ea-4b68-a90d-755045521c97.fullname" . }}
  labels:
    {{- include "go-echo5fd2d38f-27ea-4b68-a90d-755045521c97.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fd2d38f-27ea-4b68-a90d-755045521c97.selectorLabels" . | nindent 6 }}
