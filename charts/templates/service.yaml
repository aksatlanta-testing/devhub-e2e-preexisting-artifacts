apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87d27343-0f21-45df-8835-cd716e91aac1.fullname" . }}
  labels:
    {{- include "go-echo87d27343-0f21-45df-8835-cd716e91aac1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87d27343-0f21-45df-8835-cd716e91aac1.selectorLabels" . | nindent 6 }}
