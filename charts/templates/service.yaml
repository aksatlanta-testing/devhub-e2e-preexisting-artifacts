apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88b304a7-e206-482e-a807-5394b71bb7a4.fullname" . }}
  labels:
    {{- include "go-echo88b304a7-e206-482e-a807-5394b71bb7a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88b304a7-e206-482e-a807-5394b71bb7a4.selectorLabels" . | nindent 6 }}
