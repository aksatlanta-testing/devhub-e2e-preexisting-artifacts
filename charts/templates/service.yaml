apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30e2faf6-fe01-458b-b40a-c324230fefd5.fullname" . }}
  labels:
    {{- include "go-echo30e2faf6-fe01-458b-b40a-c324230fefd5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30e2faf6-fe01-458b-b40a-c324230fefd5.selectorLabels" . | nindent 6 }}
