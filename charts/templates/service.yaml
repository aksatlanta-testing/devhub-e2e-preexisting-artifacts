apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a1c6a32-deac-4330-910d-ee0c55acf221.fullname" . }}
  labels:
    {{- include "go-echo9a1c6a32-deac-4330-910d-ee0c55acf221.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a1c6a32-deac-4330-910d-ee0c55acf221.selectorLabels" . | nindent 6 }}
