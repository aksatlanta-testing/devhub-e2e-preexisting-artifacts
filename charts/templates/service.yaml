apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3e8c1d2-de7a-4d92-b392-5714fb01b78a.fullname" . }}
  labels:
    {{- include "go-echoe3e8c1d2-de7a-4d92-b392-5714fb01b78a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3e8c1d2-de7a-4d92-b392-5714fb01b78a.selectorLabels" . | nindent 6 }}
