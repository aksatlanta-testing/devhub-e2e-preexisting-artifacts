apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob126581a-24f0-4ad0-ab8c-af35028d3802.fullname" . }}
  labels:
    {{- include "go-echob126581a-24f0-4ad0-ab8c-af35028d3802.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob126581a-24f0-4ad0-ab8c-af35028d3802.selectorLabels" . | nindent 6 }}
