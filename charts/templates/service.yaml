apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe90288cd-d11e-4a41-ae33-e7a4df772545.fullname" . }}
  labels:
    {{- include "go-echoe90288cd-d11e-4a41-ae33-e7a4df772545.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe90288cd-d11e-4a41-ae33-e7a4df772545.selectorLabels" . | nindent 6 }}
