apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68bda59d-c86f-4927-8c98-85e0e947910b.fullname" . }}
  labels:
    {{- include "go-echo68bda59d-c86f-4927-8c98-85e0e947910b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68bda59d-c86f-4927-8c98-85e0e947910b.selectorLabels" . | nindent 6 }}
