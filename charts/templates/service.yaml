apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8035d06-1099-4b22-a04b-55e236166839.fullname" . }}
  labels:
    {{- include "go-echoe8035d06-1099-4b22-a04b-55e236166839.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8035d06-1099-4b22-a04b-55e236166839.selectorLabels" . | nindent 6 }}
