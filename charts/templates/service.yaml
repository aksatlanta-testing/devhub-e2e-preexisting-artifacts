apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d223d47-4e85-4c55-92ef-b52c2f1be67a.fullname" . }}
  labels:
    {{- include "go-echo1d223d47-4e85-4c55-92ef-b52c2f1be67a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d223d47-4e85-4c55-92ef-b52c2f1be67a.selectorLabels" . | nindent 6 }}
