apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbe34829-2704-4222-88b6-f4cef56f4b49.fullname" . }}
  labels:
    {{- include "go-echobbe34829-2704-4222-88b6-f4cef56f4b49.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbe34829-2704-4222-88b6-f4cef56f4b49.selectorLabels" . | nindent 6 }}
