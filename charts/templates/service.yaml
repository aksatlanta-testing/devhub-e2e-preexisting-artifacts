apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo368057f6-ce1e-4a64-ad47-994c5cba7f57.fullname" . }}
  labels:
    {{- include "go-echo368057f6-ce1e-4a64-ad47-994c5cba7f57.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo368057f6-ce1e-4a64-ad47-994c5cba7f57.selectorLabels" . | nindent 6 }}
