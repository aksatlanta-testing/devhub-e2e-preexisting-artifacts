apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e2a735a-075c-4dc9-8513-f3ed763310ae.fullname" . }}
  labels:
    {{- include "go-echo3e2a735a-075c-4dc9-8513-f3ed763310ae.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e2a735a-075c-4dc9-8513-f3ed763310ae.selectorLabels" . | nindent 6 }}
