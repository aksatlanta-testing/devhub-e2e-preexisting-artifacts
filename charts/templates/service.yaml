apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe398ddf0-d35c-459e-a936-16e633d884a6.fullname" . }}
  labels:
    {{- include "go-echoe398ddf0-d35c-459e-a936-16e633d884a6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe398ddf0-d35c-459e-a936-16e633d884a6.selectorLabels" . | nindent 6 }}
