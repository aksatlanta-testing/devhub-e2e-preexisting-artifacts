apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7d7fb20-36c7-4020-99b9-43bebd1279f4.fullname" . }}
  labels:
    {{- include "go-echod7d7fb20-36c7-4020-99b9-43bebd1279f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7d7fb20-36c7-4020-99b9-43bebd1279f4.selectorLabels" . | nindent 6 }}
