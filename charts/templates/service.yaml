apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae73508a-74cd-4dc4-946d-fdb2545e34e3.fullname" . }}
  labels:
    {{- include "go-echoae73508a-74cd-4dc4-946d-fdb2545e34e3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae73508a-74cd-4dc4-946d-fdb2545e34e3.selectorLabels" . | nindent 6 }}
