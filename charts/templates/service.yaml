apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5561b43-bffa-4da1-aba7-e7fc651e8487.fullname" . }}
  labels:
    {{- include "go-echoc5561b43-bffa-4da1-aba7-e7fc651e8487.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5561b43-bffa-4da1-aba7-e7fc651e8487.selectorLabels" . | nindent 6 }}
