apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo93f50f1d-081d-478d-9f05-5aca8bde8de3.fullname" . }}
  labels:
    {{- include "go-echo93f50f1d-081d-478d-9f05-5aca8bde8de3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo93f50f1d-081d-478d-9f05-5aca8bde8de3.selectorLabels" . | nindent 6 }}
