apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fbf8618-e224-489a-9a40-ace4e0d08697.fullname" . }}
  labels:
    {{- include "go-echo9fbf8618-e224-489a-9a40-ace4e0d08697.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fbf8618-e224-489a-9a40-ace4e0d08697.selectorLabels" . | nindent 6 }}
