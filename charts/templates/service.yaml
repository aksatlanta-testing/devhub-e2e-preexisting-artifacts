apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod610219d-9ebd-4e80-b520-a9b3279c2471.fullname" . }}
  labels:
    {{- include "go-echod610219d-9ebd-4e80-b520-a9b3279c2471.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod610219d-9ebd-4e80-b520-a9b3279c2471.selectorLabels" . | nindent 6 }}
