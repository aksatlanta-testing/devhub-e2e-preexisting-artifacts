apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8695c119-e5b2-4807-b9bf-936acaca8776.fullname" . }}
  labels:
    {{- include "go-echo8695c119-e5b2-4807-b9bf-936acaca8776.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8695c119-e5b2-4807-b9bf-936acaca8776.selectorLabels" . | nindent 6 }}
