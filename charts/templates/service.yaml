apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ff1ee33-6cd3-4168-867c-218e6548c782.fullname" . }}
  labels:
    {{- include "go-echo6ff1ee33-6cd3-4168-867c-218e6548c782.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ff1ee33-6cd3-4168-867c-218e6548c782.selectorLabels" . | nindent 6 }}
