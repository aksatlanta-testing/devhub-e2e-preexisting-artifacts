apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01aba666-a388-458e-9c8c-c20a19f100fc.fullname" . }}
  labels:
    {{- include "go-echo01aba666-a388-458e-9c8c-c20a19f100fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01aba666-a388-458e-9c8c-c20a19f100fc.selectorLabels" . | nindent 6 }}
