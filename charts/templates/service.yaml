apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0f5fe3b-3c98-4a89-afca-cefd9040da15.fullname" . }}
  labels:
    {{- include "go-echof0f5fe3b-3c98-4a89-afca-cefd9040da15.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0f5fe3b-3c98-4a89-afca-cefd9040da15.selectorLabels" . | nindent 6 }}
