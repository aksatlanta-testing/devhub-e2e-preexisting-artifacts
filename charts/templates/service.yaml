apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo087d3699-22cf-4964-8f6b-0670b2d86efb.fullname" . }}
  labels:
    {{- include "go-echo087d3699-22cf-4964-8f6b-0670b2d86efb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo087d3699-22cf-4964-8f6b-0670b2d86efb.selectorLabels" . | nindent 6 }}
