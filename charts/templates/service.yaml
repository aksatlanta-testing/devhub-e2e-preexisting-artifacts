apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo103c5c61-36b0-46c2-9029-2233383e4b23.fullname" . }}
  labels:
    {{- include "go-echo103c5c61-36b0-46c2-9029-2233383e4b23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo103c5c61-36b0-46c2-9029-2233383e4b23.selectorLabels" . | nindent 6 }}
