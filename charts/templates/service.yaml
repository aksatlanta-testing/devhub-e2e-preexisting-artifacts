apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6493b48-3323-42a1-b910-e2fe93149a18.fullname" . }}
  labels:
    {{- include "go-echof6493b48-3323-42a1-b910-e2fe93149a18.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6493b48-3323-42a1-b910-e2fe93149a18.selectorLabels" . | nindent 6 }}
