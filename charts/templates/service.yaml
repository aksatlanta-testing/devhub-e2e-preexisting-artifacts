apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo767ecaab-ec96-4369-b759-59793a7999c8.fullname" . }}
  labels:
    {{- include "go-echo767ecaab-ec96-4369-b759-59793a7999c8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo767ecaab-ec96-4369-b759-59793a7999c8.selectorLabels" . | nindent 6 }}
