apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48a879fb-81fa-40f7-9296-9bc3a44ed707.fullname" . }}
  labels:
    {{- include "go-echo48a879fb-81fa-40f7-9296-9bc3a44ed707.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48a879fb-81fa-40f7-9296-9bc3a44ed707.selectorLabels" . | nindent 6 }}
