apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf16c145-69ee-46aa-a776-b941563541ac.fullname" . }}
  labels:
    {{- include "go-echodf16c145-69ee-46aa-a776-b941563541ac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf16c145-69ee-46aa-a776-b941563541ac.selectorLabels" . | nindent 6 }}
