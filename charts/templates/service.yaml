apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe396017f-4654-4d7d-8531-6e164e529fb4.fullname" . }}
  labels:
    {{- include "go-echoe396017f-4654-4d7d-8531-6e164e529fb4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe396017f-4654-4d7d-8531-6e164e529fb4.selectorLabels" . | nindent 6 }}
