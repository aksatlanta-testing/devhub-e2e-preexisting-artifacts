apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo344c1273-b47d-47b7-81d9-f515bda4739b.fullname" . }}
  labels:
    {{- include "go-echo344c1273-b47d-47b7-81d9-f515bda4739b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo344c1273-b47d-47b7-81d9-f515bda4739b.selectorLabels" . | nindent 6 }}
