apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofef5e3f6-3072-4583-a1f7-17a3376cbb56.fullname" . }}
  labels:
    {{- include "go-echofef5e3f6-3072-4583-a1f7-17a3376cbb56.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofef5e3f6-3072-4583-a1f7-17a3376cbb56.selectorLabels" . | nindent 6 }}
