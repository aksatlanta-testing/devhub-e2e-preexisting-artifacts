apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4afb41bb-7c76-4884-b148-7f959410398a.fullname" . }}
  labels:
    {{- include "go-echo4afb41bb-7c76-4884-b148-7f959410398a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4afb41bb-7c76-4884-b148-7f959410398a.selectorLabels" . | nindent 6 }}
