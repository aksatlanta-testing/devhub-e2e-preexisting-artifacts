apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7a0cf48-5da1-4070-bb6d-251de961afa8.fullname" . }}
  labels:
    {{- include "go-echoe7a0cf48-5da1-4070-bb6d-251de961afa8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7a0cf48-5da1-4070-bb6d-251de961afa8.selectorLabels" . | nindent 6 }}
