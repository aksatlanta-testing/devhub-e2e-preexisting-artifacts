apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo577195a2-8878-40a1-99fb-c9c637b3e86f.fullname" . }}
  labels:
    {{- include "go-echo577195a2-8878-40a1-99fb-c9c637b3e86f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo577195a2-8878-40a1-99fb-c9c637b3e86f.selectorLabels" . | nindent 6 }}
