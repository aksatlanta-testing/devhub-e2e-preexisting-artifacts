apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41c57e5e-46dd-46e8-8908-d7df595fae38.fullname" . }}
  labels:
    {{- include "go-echo41c57e5e-46dd-46e8-8908-d7df595fae38.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41c57e5e-46dd-46e8-8908-d7df595fae38.selectorLabels" . | nindent 6 }}
