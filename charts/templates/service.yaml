apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob052cd16-10dd-4dc2-8ed3-d6595794ece2.fullname" . }}
  labels:
    {{- include "go-echob052cd16-10dd-4dc2-8ed3-d6595794ece2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob052cd16-10dd-4dc2-8ed3-d6595794ece2.selectorLabels" . | nindent 6 }}
