apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b6904eb-760b-4392-84d9-9877c889fceb.fullname" . }}
  labels:
    {{- include "go-echo5b6904eb-760b-4392-84d9-9877c889fceb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b6904eb-760b-4392-84d9-9877c889fceb.selectorLabels" . | nindent 6 }}
