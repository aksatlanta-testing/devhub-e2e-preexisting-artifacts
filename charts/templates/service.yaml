apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9b9c18e-6dd5-452b-836a-a73185956ac3.fullname" . }}
  labels:
    {{- include "go-echoe9b9c18e-6dd5-452b-836a-a73185956ac3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9b9c18e-6dd5-452b-836a-a73185956ac3.selectorLabels" . | nindent 6 }}
