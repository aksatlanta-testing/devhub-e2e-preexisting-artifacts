apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a213b0a-a4d0-492a-96ff-18229ff47225.fullname" . }}
  labels:
    {{- include "go-echo6a213b0a-a4d0-492a-96ff-18229ff47225.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a213b0a-a4d0-492a-96ff-18229ff47225.selectorLabels" . | nindent 6 }}
