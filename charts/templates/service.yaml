apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ed94c7a-cb6e-4585-89fb-09088ade5f54.fullname" . }}
  labels:
    {{- include "go-echo4ed94c7a-cb6e-4585-89fb-09088ade5f54.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ed94c7a-cb6e-4585-89fb-09088ade5f54.selectorLabels" . | nindent 6 }}
