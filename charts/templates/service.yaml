apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40d5ee55-cd29-4b03-b1a0-b22c1e6a7c59.fullname" . }}
  labels:
    {{- include "go-echo40d5ee55-cd29-4b03-b1a0-b22c1e6a7c59.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40d5ee55-cd29-4b03-b1a0-b22c1e6a7c59.selectorLabels" . | nindent 6 }}
