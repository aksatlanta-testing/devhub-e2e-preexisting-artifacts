apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27ba2120-79d6-4370-a86d-f04db5c2df70.fullname" . }}
  labels:
    {{- include "go-echo27ba2120-79d6-4370-a86d-f04db5c2df70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27ba2120-79d6-4370-a86d-f04db5c2df70.selectorLabels" . | nindent 6 }}
