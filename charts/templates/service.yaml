apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa701924-a37b-4fb3-ac08-4681488bdbc8.fullname" . }}
  labels:
    {{- include "go-echoaa701924-a37b-4fb3-ac08-4681488bdbc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa701924-a37b-4fb3-ac08-4681488bdbc8.selectorLabels" . | nindent 6 }}
