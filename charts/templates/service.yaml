apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo176d844b-a592-431e-9175-81e4f7027e84.fullname" . }}
  labels:
    {{- include "go-echo176d844b-a592-431e-9175-81e4f7027e84.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo176d844b-a592-431e-9175-81e4f7027e84.selectorLabels" . | nindent 6 }}
