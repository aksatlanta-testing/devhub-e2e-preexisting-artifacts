apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9e0e8ee-f0cc-49b1-9b43-026834830ff3.fullname" . }}
  labels:
    {{- include "go-echoa9e0e8ee-f0cc-49b1-9b43-026834830ff3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9e0e8ee-f0cc-49b1-9b43-026834830ff3.selectorLabels" . | nindent 6 }}
