apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d30f92d-1c78-4d30-bc16-2fe254a93faf.fullname" . }}
  labels:
    {{- include "go-echo7d30f92d-1c78-4d30-bc16-2fe254a93faf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d30f92d-1c78-4d30-bc16-2fe254a93faf.selectorLabels" . | nindent 6 }}
