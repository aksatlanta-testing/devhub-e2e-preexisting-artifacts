apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22328d47-e6c8-4f9a-a23b-121c3d51ead7.fullname" . }}
  labels:
    {{- include "go-echo22328d47-e6c8-4f9a-a23b-121c3d51ead7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22328d47-e6c8-4f9a-a23b-121c3d51ead7.selectorLabels" . | nindent 6 }}
