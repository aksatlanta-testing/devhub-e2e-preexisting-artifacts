apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc64a56c4-c1ba-45e8-ba51-57a945f74f81.fullname" . }}
  labels:
    {{- include "go-echoc64a56c4-c1ba-45e8-ba51-57a945f74f81.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc64a56c4-c1ba-45e8-ba51-57a945f74f81.selectorLabels" . | nindent 6 }}
