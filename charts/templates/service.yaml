apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b1eedfc-e16e-4ea6-81ec-b585e18c99bf.fullname" . }}
  labels:
    {{- include "go-echo8b1eedfc-e16e-4ea6-81ec-b585e18c99bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b1eedfc-e16e-4ea6-81ec-b585e18c99bf.selectorLabels" . | nindent 6 }}
