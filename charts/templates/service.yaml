apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo667a9c98-9668-429c-b0a5-fa064ed59d0d.fullname" . }}
  labels:
    {{- include "go-echo667a9c98-9668-429c-b0a5-fa064ed59d0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo667a9c98-9668-429c-b0a5-fa064ed59d0d.selectorLabels" . | nindent 6 }}
