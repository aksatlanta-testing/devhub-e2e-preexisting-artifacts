apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo434f2bc3-b58a-4fa6-97af-4a45a59a78d9.fullname" . }}
  labels:
    {{- include "go-echo434f2bc3-b58a-4fa6-97af-4a45a59a78d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo434f2bc3-b58a-4fa6-97af-4a45a59a78d9.selectorLabels" . | nindent 6 }}
