apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84456165-f6e5-4a41-a9ae-a82ea53c9f7e.fullname" . }}
  labels:
    {{- include "go-echo84456165-f6e5-4a41-a9ae-a82ea53c9f7e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84456165-f6e5-4a41-a9ae-a82ea53c9f7e.selectorLabels" . | nindent 6 }}
