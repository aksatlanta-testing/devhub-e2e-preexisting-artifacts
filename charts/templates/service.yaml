apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9a10907-4711-4fbe-98aa-57bb2978008d.fullname" . }}
  labels:
    {{- include "go-echoa9a10907-4711-4fbe-98aa-57bb2978008d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9a10907-4711-4fbe-98aa-57bb2978008d.selectorLabels" . | nindent 6 }}
