apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo042d0a76-42d2-43b9-b4cc-a2df851b97df.fullname" . }}
  labels:
    {{- include "go-echo042d0a76-42d2-43b9-b4cc-a2df851b97df.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo042d0a76-42d2-43b9-b4cc-a2df851b97df.selectorLabels" . | nindent 6 }}
