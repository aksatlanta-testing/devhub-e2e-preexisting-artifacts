apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo999f8f0c-2d53-41ac-8302-8839aecefe3c.fullname" . }}
  labels:
    {{- include "go-echo999f8f0c-2d53-41ac-8302-8839aecefe3c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo999f8f0c-2d53-41ac-8302-8839aecefe3c.selectorLabels" . | nindent 6 }}
