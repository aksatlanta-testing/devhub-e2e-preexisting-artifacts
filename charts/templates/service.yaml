apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod80c149c-5162-4a63-952c-949b5c667b8b.fullname" . }}
  labels:
    {{- include "go-echod80c149c-5162-4a63-952c-949b5c667b8b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod80c149c-5162-4a63-952c-949b5c667b8b.selectorLabels" . | nindent 6 }}
