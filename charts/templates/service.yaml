apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo672d5aaa-52c3-4cd2-bdd9-5eb1a15545d5.fullname" . }}
  labels:
    {{- include "go-echo672d5aaa-52c3-4cd2-bdd9-5eb1a15545d5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo672d5aaa-52c3-4cd2-bdd9-5eb1a15545d5.selectorLabels" . | nindent 6 }}
