apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf07a4a4-5dd3-4bce-973b-493d8f1acb5b.fullname" . }}
  labels:
    {{- include "go-echocf07a4a4-5dd3-4bce-973b-493d8f1acb5b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf07a4a4-5dd3-4bce-973b-493d8f1acb5b.selectorLabels" . | nindent 6 }}
