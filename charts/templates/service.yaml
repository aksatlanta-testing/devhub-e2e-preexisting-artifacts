apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa118c9fc-54f9-46ac-b1fb-b48e3857f915.fullname" . }}
  labels:
    {{- include "go-echoa118c9fc-54f9-46ac-b1fb-b48e3857f915.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa118c9fc-54f9-46ac-b1fb-b48e3857f915.selectorLabels" . | nindent 6 }}
