apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob21127c7-d128-4bdc-9e4f-ce11eba106ae.fullname" . }}
  labels:
    {{- include "go-echob21127c7-d128-4bdc-9e4f-ce11eba106ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob21127c7-d128-4bdc-9e4f-ce11eba106ae.selectorLabels" . | nindent 6 }}
