apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof349428a-3b41-41d4-9ccf-80a46fcf2f26.fullname" . }}
  labels:
    {{- include "go-echof349428a-3b41-41d4-9ccf-80a46fcf2f26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof349428a-3b41-41d4-9ccf-80a46fcf2f26.selectorLabels" . | nindent 6 }}
