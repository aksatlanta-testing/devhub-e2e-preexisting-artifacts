apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa1b09c2-7ff2-4d83-a13f-90618c5a6167.fullname" . }}
  labels:
    {{- include "go-echoaa1b09c2-7ff2-4d83-a13f-90618c5a6167.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa1b09c2-7ff2-4d83-a13f-90618c5a6167.selectorLabels" . | nindent 6 }}
