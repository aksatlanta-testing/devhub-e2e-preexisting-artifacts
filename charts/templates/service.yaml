apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0963fbde-51a4-4cb7-82b7-a40ce3e2f839.fullname" . }}
  labels:
    {{- include "go-echo0963fbde-51a4-4cb7-82b7-a40ce3e2f839.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0963fbde-51a4-4cb7-82b7-a40ce3e2f839.selectorLabels" . | nindent 6 }}
