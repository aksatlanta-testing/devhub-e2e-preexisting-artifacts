apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo067c03a7-d71a-4ad9-abc0-18d21a6070a1.fullname" . }}
  labels:
    {{- include "go-echo067c03a7-d71a-4ad9-abc0-18d21a6070a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo067c03a7-d71a-4ad9-abc0-18d21a6070a1.selectorLabels" . | nindent 6 }}
