apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafc2aa25-78c0-454a-a347-a30cddef3b97.fullname" . }}
  labels:
    {{- include "go-echoafc2aa25-78c0-454a-a347-a30cddef3b97.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafc2aa25-78c0-454a-a347-a30cddef3b97.selectorLabels" . | nindent 6 }}
