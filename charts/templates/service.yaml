apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa51752cc-aa33-4782-a562-4f1eb7dc0eef.fullname" . }}
  labels:
    {{- include "go-echoa51752cc-aa33-4782-a562-4f1eb7dc0eef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa51752cc-aa33-4782-a562-4f1eb7dc0eef.selectorLabels" . | nindent 6 }}
