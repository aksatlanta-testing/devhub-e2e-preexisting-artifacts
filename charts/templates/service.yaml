apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode3e83d4-9701-41a9-9c76-810065415932.fullname" . }}
  labels:
    {{- include "go-echode3e83d4-9701-41a9-9c76-810065415932.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode3e83d4-9701-41a9-9c76-810065415932.selectorLabels" . | nindent 6 }}
