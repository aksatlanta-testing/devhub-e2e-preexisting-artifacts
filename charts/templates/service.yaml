apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cf97168-c6c0-405e-8f3a-1092625c53fc.fullname" . }}
  labels:
    {{- include "go-echo8cf97168-c6c0-405e-8f3a-1092625c53fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cf97168-c6c0-405e-8f3a-1092625c53fc.selectorLabels" . | nindent 6 }}
