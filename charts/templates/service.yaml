apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4a4e3b1-76d7-4f9e-b853-9533aa1a6d39.fullname" . }}
  labels:
    {{- include "go-echoa4a4e3b1-76d7-4f9e-b853-9533aa1a6d39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4a4e3b1-76d7-4f9e-b853-9533aa1a6d39.selectorLabels" . | nindent 6 }}
