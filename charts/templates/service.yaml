apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9dc17f70-6e4d-4920-a492-f3511365c3ab.fullname" . }}
  labels:
    {{- include "go-echo9dc17f70-6e4d-4920-a492-f3511365c3ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9dc17f70-6e4d-4920-a492-f3511365c3ab.selectorLabels" . | nindent 6 }}
