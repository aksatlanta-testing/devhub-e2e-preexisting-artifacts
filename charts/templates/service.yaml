apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6d84c66-6212-40f9-92c7-675a6a1cf837.fullname" . }}
  labels:
    {{- include "go-echoa6d84c66-6212-40f9-92c7-675a6a1cf837.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6d84c66-6212-40f9-92c7-675a6a1cf837.selectorLabels" . | nindent 6 }}
