apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc67419e9-e60e-4034-ba61-4fcf64b3ea28.fullname" . }}
  labels:
    {{- include "go-echoc67419e9-e60e-4034-ba61-4fcf64b3ea28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc67419e9-e60e-4034-ba61-4fcf64b3ea28.selectorLabels" . | nindent 6 }}
