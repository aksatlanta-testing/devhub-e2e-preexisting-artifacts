apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f39dab2-9c72-4bdc-9b89-2ac16ca3237e.fullname" . }}
  labels:
    {{- include "go-echo6f39dab2-9c72-4bdc-9b89-2ac16ca3237e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f39dab2-9c72-4bdc-9b89-2ac16ca3237e.selectorLabels" . | nindent 6 }}
