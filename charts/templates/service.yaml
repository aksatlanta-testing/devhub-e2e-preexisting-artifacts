apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3388d31-26c0-405e-9c1e-7cb5d8842350.fullname" . }}
  labels:
    {{- include "go-echoe3388d31-26c0-405e-9c1e-7cb5d8842350.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3388d31-26c0-405e-9c1e-7cb5d8842350.selectorLabels" . | nindent 6 }}
