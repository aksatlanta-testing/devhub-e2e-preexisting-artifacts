apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc854fe6d-a859-4106-acf6-ff5175902999.fullname" . }}
  labels:
    {{- include "go-echoc854fe6d-a859-4106-acf6-ff5175902999.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc854fe6d-a859-4106-acf6-ff5175902999.selectorLabels" . | nindent 6 }}
