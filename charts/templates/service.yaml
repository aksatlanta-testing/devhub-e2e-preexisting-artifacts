apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5caeebb-73a4-4ec8-b189-066da6c3c6e6.fullname" . }}
  labels:
    {{- include "go-echoa5caeebb-73a4-4ec8-b189-066da6c3c6e6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5caeebb-73a4-4ec8-b189-066da6c3c6e6.selectorLabels" . | nindent 6 }}
