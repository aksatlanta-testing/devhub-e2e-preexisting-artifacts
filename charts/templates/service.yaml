apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0431329-ccc6-42e0-b079-0bab804b80c7.fullname" . }}
  labels:
    {{- include "go-echoe0431329-ccc6-42e0-b079-0bab804b80c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0431329-ccc6-42e0-b079-0bab804b80c7.selectorLabels" . | nindent 6 }}
