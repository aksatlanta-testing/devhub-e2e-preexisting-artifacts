apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0b1c110-54e2-4e2b-95d5-cee6d5b1892b.fullname" . }}
  labels:
    {{- include "go-echod0b1c110-54e2-4e2b-95d5-cee6d5b1892b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0b1c110-54e2-4e2b-95d5-cee6d5b1892b.selectorLabels" . | nindent 6 }}
