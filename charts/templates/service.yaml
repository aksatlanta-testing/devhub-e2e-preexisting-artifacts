apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4255bc09-e7e2-4f62-95b4-03d67df80315.fullname" . }}
  labels:
    {{- include "go-echo4255bc09-e7e2-4f62-95b4-03d67df80315.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4255bc09-e7e2-4f62-95b4-03d67df80315.selectorLabels" . | nindent 6 }}
