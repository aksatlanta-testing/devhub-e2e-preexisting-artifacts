apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe5281a1-8589-41f9-9080-bc20961110d6.fullname" . }}
  labels:
    {{- include "go-echobe5281a1-8589-41f9-9080-bc20961110d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe5281a1-8589-41f9-9080-bc20961110d6.selectorLabels" . | nindent 6 }}
