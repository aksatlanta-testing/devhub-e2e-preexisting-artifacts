apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1847f16f-4b4d-4f12-a666-7ab1e208ded8.fullname" . }}
  labels:
    {{- include "go-echo1847f16f-4b4d-4f12-a666-7ab1e208ded8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1847f16f-4b4d-4f12-a666-7ab1e208ded8.selectorLabels" . | nindent 6 }}
