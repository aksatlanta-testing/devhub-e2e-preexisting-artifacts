apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc39e537a-d490-45e8-aa99-c0fb607dc79e.fullname" . }}
  labels:
    {{- include "go-echoc39e537a-d490-45e8-aa99-c0fb607dc79e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc39e537a-d490-45e8-aa99-c0fb607dc79e.selectorLabels" . | nindent 6 }}
