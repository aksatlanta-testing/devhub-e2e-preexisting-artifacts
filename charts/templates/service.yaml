apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa82c1391-454e-4ec5-8adb-f29c5e6b1251.fullname" . }}
  labels:
    {{- include "go-echoa82c1391-454e-4ec5-8adb-f29c5e6b1251.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa82c1391-454e-4ec5-8adb-f29c5e6b1251.selectorLabels" . | nindent 6 }}
