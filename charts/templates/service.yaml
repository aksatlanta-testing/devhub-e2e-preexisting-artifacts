apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeedff068-ea6a-4b04-af3a-b44e5a960653.fullname" . }}
  labels:
    {{- include "go-echoeedff068-ea6a-4b04-af3a-b44e5a960653.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeedff068-ea6a-4b04-af3a-b44e5a960653.selectorLabels" . | nindent 6 }}
