apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f131932-e1d4-498f-91eb-db4edb8e94bc.fullname" . }}
  labels:
    {{- include "go-echo8f131932-e1d4-498f-91eb-db4edb8e94bc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f131932-e1d4-498f-91eb-db4edb8e94bc.selectorLabels" . | nindent 6 }}
