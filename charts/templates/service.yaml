apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fe27bef-b84e-4f47-96ee-6d1e66b09da1.fullname" . }}
  labels:
    {{- include "go-echo5fe27bef-b84e-4f47-96ee-6d1e66b09da1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fe27bef-b84e-4f47-96ee-6d1e66b09da1.selectorLabels" . | nindent 6 }}
