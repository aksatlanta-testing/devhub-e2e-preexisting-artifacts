apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa011a13c-3643-4e32-ad49-57e8fa71d29b.fullname" . }}
  labels:
    {{- include "go-echoa011a13c-3643-4e32-ad49-57e8fa71d29b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa011a13c-3643-4e32-ad49-57e8fa71d29b.selectorLabels" . | nindent 6 }}
