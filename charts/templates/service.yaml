apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod205ba5f-31ef-4740-aeef-276510ed172b.fullname" . }}
  labels:
    {{- include "go-echod205ba5f-31ef-4740-aeef-276510ed172b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod205ba5f-31ef-4740-aeef-276510ed172b.selectorLabels" . | nindent 6 }}
