apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod901fd23-0ebb-4fec-a90e-b4480d7dc070.fullname" . }}
  labels:
    {{- include "go-echod901fd23-0ebb-4fec-a90e-b4480d7dc070.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod901fd23-0ebb-4fec-a90e-b4480d7dc070.selectorLabels" . | nindent 6 }}
