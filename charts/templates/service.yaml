apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob68e6654-eca2-4d7c-b825-f26e85394da2.fullname" . }}
  labels:
    {{- include "go-echob68e6654-eca2-4d7c-b825-f26e85394da2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob68e6654-eca2-4d7c-b825-f26e85394da2.selectorLabels" . | nindent 6 }}
