apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo872e9d59-2d8d-49be-92cb-61298a726207.fullname" . }}
  labels:
    {{- include "go-echo872e9d59-2d8d-49be-92cb-61298a726207.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo872e9d59-2d8d-49be-92cb-61298a726207.selectorLabels" . | nindent 6 }}
