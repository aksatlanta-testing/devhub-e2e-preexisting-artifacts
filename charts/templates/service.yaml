apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa87f7a5a-efbb-4129-b05d-698ec7f7c6b9.fullname" . }}
  labels:
    {{- include "go-echoa87f7a5a-efbb-4129-b05d-698ec7f7c6b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa87f7a5a-efbb-4129-b05d-698ec7f7c6b9.selectorLabels" . | nindent 6 }}
