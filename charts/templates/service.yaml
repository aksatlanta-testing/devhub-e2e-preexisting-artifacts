apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo545a8899-78ef-4b0d-9b55-411052bbb696.fullname" . }}
  labels:
    {{- include "go-echo545a8899-78ef-4b0d-9b55-411052bbb696.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo545a8899-78ef-4b0d-9b55-411052bbb696.selectorLabels" . | nindent 6 }}
