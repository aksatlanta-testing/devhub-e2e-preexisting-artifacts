apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab35a17d-e4c9-42c0-a3cb-e62dacaf0e6d.fullname" . }}
  labels:
    {{- include "go-echoab35a17d-e4c9-42c0-a3cb-e62dacaf0e6d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab35a17d-e4c9-42c0-a3cb-e62dacaf0e6d.selectorLabels" . | nindent 6 }}
