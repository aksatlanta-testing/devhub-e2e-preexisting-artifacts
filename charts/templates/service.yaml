apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a17018f-5c6e-4b1e-8c58-d7c72a9c5b45.fullname" . }}
  labels:
    {{- include "go-echo2a17018f-5c6e-4b1e-8c58-d7c72a9c5b45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a17018f-5c6e-4b1e-8c58-d7c72a9c5b45.selectorLabels" . | nindent 6 }}
