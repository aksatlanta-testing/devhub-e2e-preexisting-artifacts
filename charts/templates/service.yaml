apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod340b6eb-dfb4-40aa-8245-977650d53cdb.fullname" . }}
  labels:
    {{- include "go-echod340b6eb-dfb4-40aa-8245-977650d53cdb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod340b6eb-dfb4-40aa-8245-977650d53cdb.selectorLabels" . | nindent 6 }}
