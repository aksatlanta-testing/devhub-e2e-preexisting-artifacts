apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0fcbc89-1f63-4efc-a10e-99404da21cc6.fullname" . }}
  labels:
    {{- include "go-echof0fcbc89-1f63-4efc-a10e-99404da21cc6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0fcbc89-1f63-4efc-a10e-99404da21cc6.selectorLabels" . | nindent 6 }}
