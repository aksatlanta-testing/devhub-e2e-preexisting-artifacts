apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo11d7d72d-c9e4-4272-8383-a9ac701d3639.fullname" . }}
  labels:
    {{- include "go-echo11d7d72d-c9e4-4272-8383-a9ac701d3639.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo11d7d72d-c9e4-4272-8383-a9ac701d3639.selectorLabels" . | nindent 6 }}
