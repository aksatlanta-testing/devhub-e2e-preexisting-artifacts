apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5b2f4f4-83d5-4f7f-a8dd-90f0b3f51238.fullname" . }}
  labels:
    {{- include "go-echoa5b2f4f4-83d5-4f7f-a8dd-90f0b3f51238.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5b2f4f4-83d5-4f7f-a8dd-90f0b3f51238.selectorLabels" . | nindent 6 }}
