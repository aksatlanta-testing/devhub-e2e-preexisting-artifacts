apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9d76717-ac4e-4a45-80c7-b47ac92a0a59.fullname" . }}
  labels:
    {{- include "go-echoe9d76717-ac4e-4a45-80c7-b47ac92a0a59.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9d76717-ac4e-4a45-80c7-b47ac92a0a59.selectorLabels" . | nindent 6 }}
