apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabf89c79-c8c4-486d-a3ff-caa174b009e2.fullname" . }}
  labels:
    {{- include "go-echoabf89c79-c8c4-486d-a3ff-caa174b009e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabf89c79-c8c4-486d-a3ff-caa174b009e2.selectorLabels" . | nindent 6 }}
