apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6f22599-a097-4a8d-af91-d66671bfa186.fullname" . }}
  labels:
    {{- include "go-echod6f22599-a097-4a8d-af91-d66671bfa186.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6f22599-a097-4a8d-af91-d66671bfa186.selectorLabels" . | nindent 6 }}
