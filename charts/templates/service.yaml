apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80c4628a-1d1a-41b1-bf96-fb561d37d01d.fullname" . }}
  labels:
    {{- include "go-echo80c4628a-1d1a-41b1-bf96-fb561d37d01d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80c4628a-1d1a-41b1-bf96-fb561d37d01d.selectorLabels" . | nindent 6 }}
