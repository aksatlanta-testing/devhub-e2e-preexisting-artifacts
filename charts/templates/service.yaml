apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1be60fd-ed58-4ed8-aef1-e6b9976ed3a9.fullname" . }}
  labels:
    {{- include "go-echob1be60fd-ed58-4ed8-aef1-e6b9976ed3a9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1be60fd-ed58-4ed8-aef1-e6b9976ed3a9.selectorLabels" . | nindent 6 }}
