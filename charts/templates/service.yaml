apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98a17e0c-cd92-4f77-a129-2b8d007a4db5.fullname" . }}
  labels:
    {{- include "go-echo98a17e0c-cd92-4f77-a129-2b8d007a4db5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98a17e0c-cd92-4f77-a129-2b8d007a4db5.selectorLabels" . | nindent 6 }}
