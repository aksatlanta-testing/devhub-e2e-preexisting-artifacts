apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb90420a-859b-448e-8fb7-141f50ab1484.fullname" . }}
  labels:
    {{- include "go-echodb90420a-859b-448e-8fb7-141f50ab1484.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb90420a-859b-448e-8fb7-141f50ab1484.selectorLabels" . | nindent 6 }}
