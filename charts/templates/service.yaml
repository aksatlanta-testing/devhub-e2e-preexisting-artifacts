apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafc778de-8fd6-4f99-9ae0-9e5548c42d69.fullname" . }}
  labels:
    {{- include "go-echoafc778de-8fd6-4f99-9ae0-9e5548c42d69.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafc778de-8fd6-4f99-9ae0-9e5548c42d69.selectorLabels" . | nindent 6 }}
