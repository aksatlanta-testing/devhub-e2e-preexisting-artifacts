apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f7b3f05-5fe9-40b3-8584-ed1d02e1c4b2.fullname" . }}
  labels:
    {{- include "go-echo4f7b3f05-5fe9-40b3-8584-ed1d02e1c4b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f7b3f05-5fe9-40b3-8584-ed1d02e1c4b2.selectorLabels" . | nindent 6 }}
