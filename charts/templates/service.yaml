apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70571966-0e41-4373-8288-a8ed8eb26fd1.fullname" . }}
  labels:
    {{- include "go-echo70571966-0e41-4373-8288-a8ed8eb26fd1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70571966-0e41-4373-8288-a8ed8eb26fd1.selectorLabels" . | nindent 6 }}
