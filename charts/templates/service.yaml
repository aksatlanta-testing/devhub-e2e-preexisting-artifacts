apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ff1da26-eec7-46bd-a069-ce95424d8b1c.fullname" . }}
  labels:
    {{- include "go-echo0ff1da26-eec7-46bd-a069-ce95424d8b1c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ff1da26-eec7-46bd-a069-ce95424d8b1c.selectorLabels" . | nindent 4 }}
