apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0c5ab2d-b83f-4865-b9b8-53c43173ca65.fullname" . }}
  labels:
    {{- include "go-echod0c5ab2d-b83f-4865-b9b8-53c43173ca65.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0c5ab2d-b83f-4865-b9b8-53c43173ca65.selectorLabels" . | nindent 6 }}
