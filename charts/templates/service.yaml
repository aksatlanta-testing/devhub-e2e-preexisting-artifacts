apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5461c68c-7929-4354-be20-797513ea9b9c.fullname" . }}
  labels:
    {{- include "go-echo5461c68c-7929-4354-be20-797513ea9b9c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5461c68c-7929-4354-be20-797513ea9b9c.selectorLabels" . | nindent 6 }}
