apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1b3fd2b-9c48-47e9-8111-1542457af5da.fullname" . }}
  labels:
    {{- include "go-echoa1b3fd2b-9c48-47e9-8111-1542457af5da.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1b3fd2b-9c48-47e9-8111-1542457af5da.selectorLabels" . | nindent 6 }}
