apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobaa14e33-a5a1-40cf-b7c6-5b2d1bae9016.fullname" . }}
  labels:
    {{- include "go-echobaa14e33-a5a1-40cf-b7c6-5b2d1bae9016.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobaa14e33-a5a1-40cf-b7c6-5b2d1bae9016.selectorLabels" . | nindent 6 }}
