apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ff45416-5eb1-44d9-a995-7c3e02a1ee86.fullname" . }}
  labels:
    {{- include "go-echo0ff45416-5eb1-44d9-a995-7c3e02a1ee86.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ff45416-5eb1-44d9-a995-7c3e02a1ee86.selectorLabels" . | nindent 6 }}
