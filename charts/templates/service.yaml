apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfa15f4f-0ccd-4927-b442-f5e31b946560.fullname" . }}
  labels:
    {{- include "go-echodfa15f4f-0ccd-4927-b442-f5e31b946560.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfa15f4f-0ccd-4927-b442-f5e31b946560.selectorLabels" . | nindent 6 }}
