apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55517d8f-c18e-408a-8f4e-c67a873ca5ed.fullname" . }}
  labels:
    {{- include "go-echo55517d8f-c18e-408a-8f4e-c67a873ca5ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55517d8f-c18e-408a-8f4e-c67a873ca5ed.selectorLabels" . | nindent 6 }}
