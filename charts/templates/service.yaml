apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19ae6b34-17f7-4f3c-b233-4bcef1f79ed7.fullname" . }}
  labels:
    {{- include "go-echo19ae6b34-17f7-4f3c-b233-4bcef1f79ed7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19ae6b34-17f7-4f3c-b233-4bcef1f79ed7.selectorLabels" . | nindent 6 }}
