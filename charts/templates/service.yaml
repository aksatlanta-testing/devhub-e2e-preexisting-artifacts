apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc75cd2d9-b9de-41d8-9ac9-748514eb6253.fullname" . }}
  labels:
    {{- include "go-echoc75cd2d9-b9de-41d8-9ac9-748514eb6253.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc75cd2d9-b9de-41d8-9ac9-748514eb6253.selectorLabels" . | nindent 6 }}
