apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo873ee754-1fef-465b-8fc9-2346ddff9700.fullname" . }}
  labels:
    {{- include "go-echo873ee754-1fef-465b-8fc9-2346ddff9700.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo873ee754-1fef-465b-8fc9-2346ddff9700.selectorLabels" . | nindent 6 }}
