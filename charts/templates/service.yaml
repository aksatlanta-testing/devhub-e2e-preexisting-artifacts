apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo276f42e0-bd73-4ab5-b30a-27441549c1a2.fullname" . }}
  labels:
    {{- include "go-echo276f42e0-bd73-4ab5-b30a-27441549c1a2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo276f42e0-bd73-4ab5-b30a-27441549c1a2.selectorLabels" . | nindent 6 }}
