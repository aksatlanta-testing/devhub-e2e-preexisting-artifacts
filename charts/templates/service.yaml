apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9861d4a-7db2-414a-8528-f6f3937a0eac.fullname" . }}
  labels:
    {{- include "go-echof9861d4a-7db2-414a-8528-f6f3937a0eac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9861d4a-7db2-414a-8528-f6f3937a0eac.selectorLabels" . | nindent 6 }}
