apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfd3a815-da36-4925-b5b5-d6d24197d683.fullname" . }}
  labels:
    {{- include "go-echocfd3a815-da36-4925-b5b5-d6d24197d683.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfd3a815-da36-4925-b5b5-d6d24197d683.selectorLabels" . | nindent 6 }}
