apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd86f909-c5a2-4990-875b-7b2b5a6f1768.fullname" . }}
  labels:
    {{- include "go-echocd86f909-c5a2-4990-875b-7b2b5a6f1768.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd86f909-c5a2-4990-875b-7b2b5a6f1768.selectorLabels" . | nindent 6 }}
