apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ba3cb32-b3e8-4dc6-832f-2b8ddf1e6eb4.fullname" . }}
  labels:
    {{- include "go-echo6ba3cb32-b3e8-4dc6-832f-2b8ddf1e6eb4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ba3cb32-b3e8-4dc6-832f-2b8ddf1e6eb4.selectorLabels" . | nindent 6 }}
