apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e972a18-7157-4790-93ac-8ac68021a2ad.fullname" . }}
  labels:
    {{- include "go-echo3e972a18-7157-4790-93ac-8ac68021a2ad.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e972a18-7157-4790-93ac-8ac68021a2ad.selectorLabels" . | nindent 6 }}
