apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd6732f0-ed87-4f17-b5c3-04316591295f.fullname" . }}
  labels:
    {{- include "go-echocd6732f0-ed87-4f17-b5c3-04316591295f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd6732f0-ed87-4f17-b5c3-04316591295f.selectorLabels" . | nindent 6 }}
