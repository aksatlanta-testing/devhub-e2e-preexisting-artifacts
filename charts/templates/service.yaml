apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fbe9182-a3df-4258-9c74-01d08f7e116a.fullname" . }}
  labels:
    {{- include "go-echo6fbe9182-a3df-4258-9c74-01d08f7e116a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fbe9182-a3df-4258-9c74-01d08f7e116a.selectorLabels" . | nindent 6 }}
