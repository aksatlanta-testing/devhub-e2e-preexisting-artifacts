apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo251e6fc4-74bb-4e0a-852c-f734f3c372d5.fullname" . }}
  labels:
    {{- include "go-echo251e6fc4-74bb-4e0a-852c-f734f3c372d5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo251e6fc4-74bb-4e0a-852c-f734f3c372d5.selectorLabels" . | nindent 6 }}
