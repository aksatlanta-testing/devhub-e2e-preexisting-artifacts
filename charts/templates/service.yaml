apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb0404ca-a59a-4b32-84ac-3c5fe270a79a.fullname" . }}
  labels:
    {{- include "go-echobb0404ca-a59a-4b32-84ac-3c5fe270a79a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb0404ca-a59a-4b32-84ac-3c5fe270a79a.selectorLabels" . | nindent 6 }}
