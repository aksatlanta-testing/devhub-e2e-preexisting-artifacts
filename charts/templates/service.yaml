apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07b17212-1daa-4b9e-8571-d1ff74e839f2.fullname" . }}
  labels:
    {{- include "go-echo07b17212-1daa-4b9e-8571-d1ff74e839f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07b17212-1daa-4b9e-8571-d1ff74e839f2.selectorLabels" . | nindent 6 }}
