apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01f7c93c-4afb-45c8-ac40-7c0abf3d4858.fullname" . }}
  labels:
    {{- include "go-echo01f7c93c-4afb-45c8-ac40-7c0abf3d4858.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01f7c93c-4afb-45c8-ac40-7c0abf3d4858.selectorLabels" . | nindent 6 }}
