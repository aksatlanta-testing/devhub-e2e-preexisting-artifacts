apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b5335f2-7708-4598-a08e-891f05ff137a.fullname" . }}
  labels:
    {{- include "go-echo2b5335f2-7708-4598-a08e-891f05ff137a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b5335f2-7708-4598-a08e-891f05ff137a.selectorLabels" . | nindent 6 }}
