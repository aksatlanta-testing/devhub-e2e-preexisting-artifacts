apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7de704b1-ea3a-4b88-9220-bfbbfa84c715.fullname" . }}
  labels:
    {{- include "go-echo7de704b1-ea3a-4b88-9220-bfbbfa84c715.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7de704b1-ea3a-4b88-9220-bfbbfa84c715.selectorLabels" . | nindent 6 }}
