apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0e2967d-7754-49f4-a40d-657cd62687f1.fullname" . }}
  labels:
    {{- include "go-echob0e2967d-7754-49f4-a40d-657cd62687f1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0e2967d-7754-49f4-a40d-657cd62687f1.selectorLabels" . | nindent 6 }}
