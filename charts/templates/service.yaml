apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo014bb9fd-8708-430e-948d-fa842e326d05.fullname" . }}
  labels:
    {{- include "go-echo014bb9fd-8708-430e-948d-fa842e326d05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo014bb9fd-8708-430e-948d-fa842e326d05.selectorLabels" . | nindent 6 }}
