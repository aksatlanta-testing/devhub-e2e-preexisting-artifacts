apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95cd9b47-7489-467a-a1d5-32ca5b0bb5fc.fullname" . }}
  labels:
    {{- include "go-echo95cd9b47-7489-467a-a1d5-32ca5b0bb5fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95cd9b47-7489-467a-a1d5-32ca5b0bb5fc.selectorLabels" . | nindent 6 }}
