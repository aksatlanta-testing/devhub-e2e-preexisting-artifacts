apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b8a32b8-8385-48f7-baff-8364743629c2.fullname" . }}
  labels:
    {{- include "go-echo4b8a32b8-8385-48f7-baff-8364743629c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b8a32b8-8385-48f7-baff-8364743629c2.selectorLabels" . | nindent 6 }}
