apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc97fed0-a0c6-4738-9396-2540733038ad.fullname" . }}
  labels:
    {{- include "go-echobc97fed0-a0c6-4738-9396-2540733038ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc97fed0-a0c6-4738-9396-2540733038ad.selectorLabels" . | nindent 6 }}
