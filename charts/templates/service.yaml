apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f1667bf-94b9-4a0c-9dcc-1143c8fb792d.fullname" . }}
  labels:
    {{- include "go-echo0f1667bf-94b9-4a0c-9dcc-1143c8fb792d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f1667bf-94b9-4a0c-9dcc-1143c8fb792d.selectorLabels" . | nindent 6 }}
