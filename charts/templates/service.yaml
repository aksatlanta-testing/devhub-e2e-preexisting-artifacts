apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06513d22-a021-428f-a044-74e0b6757608.fullname" . }}
  labels:
    {{- include "go-echo06513d22-a021-428f-a044-74e0b6757608.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06513d22-a021-428f-a044-74e0b6757608.selectorLabels" . | nindent 6 }}
