apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d84ec85-f77d-400a-9a09-fc4d361d3381.fullname" . }}
  labels:
    {{- include "go-echo3d84ec85-f77d-400a-9a09-fc4d361d3381.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d84ec85-f77d-400a-9a09-fc4d361d3381.selectorLabels" . | nindent 6 }}
