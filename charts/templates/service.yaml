apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7d3ff40-76ce-46b3-bc5e-bb7da9571932.fullname" . }}
  labels:
    {{- include "go-echob7d3ff40-76ce-46b3-bc5e-bb7da9571932.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7d3ff40-76ce-46b3-bc5e-bb7da9571932.selectorLabels" . | nindent 6 }}
