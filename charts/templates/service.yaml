apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8fe5846-8954-4ec2-b87f-c72724ddaa16.fullname" . }}
  labels:
    {{- include "go-echoa8fe5846-8954-4ec2-b87f-c72724ddaa16.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8fe5846-8954-4ec2-b87f-c72724ddaa16.selectorLabels" . | nindent 6 }}
