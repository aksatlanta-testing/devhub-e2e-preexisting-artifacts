apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cf5d1a9-0fb5-4d6a-bb1d-5b24c0558687.fullname" . }}
  labels:
    {{- include "go-echo1cf5d1a9-0fb5-4d6a-bb1d-5b24c0558687.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cf5d1a9-0fb5-4d6a-bb1d-5b24c0558687.selectorLabels" . | nindent 6 }}
