apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96a77866-d21b-4327-b281-a9b1f6f1cec0.fullname" . }}
  labels:
    {{- include "go-echo96a77866-d21b-4327-b281-a9b1f6f1cec0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96a77866-d21b-4327-b281-a9b1f6f1cec0.selectorLabels" . | nindent 6 }}
