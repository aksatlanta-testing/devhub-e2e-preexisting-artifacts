apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6acc0416-12b9-4d1a-9d2f-9a888d7a4c43.fullname" . }}
  labels:
    {{- include "go-echo6acc0416-12b9-4d1a-9d2f-9a888d7a4c43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6acc0416-12b9-4d1a-9d2f-9a888d7a4c43.selectorLabels" . | nindent 6 }}
