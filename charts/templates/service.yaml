apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobfc287cf-8e8d-402e-91e7-dea0d0aceedd.fullname" . }}
  labels:
    {{- include "go-echobfc287cf-8e8d-402e-91e7-dea0d0aceedd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobfc287cf-8e8d-402e-91e7-dea0d0aceedd.selectorLabels" . | nindent 6 }}
