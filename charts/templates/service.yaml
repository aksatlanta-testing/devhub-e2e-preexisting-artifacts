apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7d664a7-3b55-47a0-aea2-6fc61bc82a52.fullname" . }}
  labels:
    {{- include "go-echof7d664a7-3b55-47a0-aea2-6fc61bc82a52.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7d664a7-3b55-47a0-aea2-6fc61bc82a52.selectorLabels" . | nindent 6 }}
