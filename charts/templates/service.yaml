apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo720228c0-2f46-45b7-9c01-82c96880d09e.fullname" . }}
  labels:
    {{- include "go-echo720228c0-2f46-45b7-9c01-82c96880d09e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo720228c0-2f46-45b7-9c01-82c96880d09e.selectorLabels" . | nindent 6 }}
