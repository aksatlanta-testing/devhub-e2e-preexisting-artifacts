apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo621e52b0-de3a-46c7-b4f4-33199253bccd.fullname" . }}
  labels:
    {{- include "go-echo621e52b0-de3a-46c7-b4f4-33199253bccd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo621e52b0-de3a-46c7-b4f4-33199253bccd.selectorLabels" . | nindent 6 }}
