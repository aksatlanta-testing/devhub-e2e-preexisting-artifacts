apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo832df5a8-6567-46cf-8130-db072dc06c74.fullname" . }}
  labels:
    {{- include "go-echo832df5a8-6567-46cf-8130-db072dc06c74.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo832df5a8-6567-46cf-8130-db072dc06c74.selectorLabels" . | nindent 6 }}
