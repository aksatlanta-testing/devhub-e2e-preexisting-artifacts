apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc851bb40-129b-4663-8d8a-44610ee665e3.fullname" . }}
  labels:
    {{- include "go-echoc851bb40-129b-4663-8d8a-44610ee665e3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc851bb40-129b-4663-8d8a-44610ee665e3.selectorLabels" . | nindent 6 }}
