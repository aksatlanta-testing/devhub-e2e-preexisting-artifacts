apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb905597-2b4d-43ad-80d4-bc3056bf8c81.fullname" . }}
  labels:
    {{- include "go-echodb905597-2b4d-43ad-80d4-bc3056bf8c81.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb905597-2b4d-43ad-80d4-bc3056bf8c81.selectorLabels" . | nindent 6 }}
