apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1beaa0b8-8398-4ab2-9e4a-a62b60981726.fullname" . }}
  labels:
    {{- include "go-echo1beaa0b8-8398-4ab2-9e4a-a62b60981726.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1beaa0b8-8398-4ab2-9e4a-a62b60981726.selectorLabels" . | nindent 6 }}
