apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda374906-0ac1-4d45-8b01-0c4db2c50c6d.fullname" . }}
  labels:
    {{- include "go-echoda374906-0ac1-4d45-8b01-0c4db2c50c6d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda374906-0ac1-4d45-8b01-0c4db2c50c6d.selectorLabels" . | nindent 6 }}
