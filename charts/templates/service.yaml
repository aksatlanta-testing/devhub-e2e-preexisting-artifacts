apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0249d0e9-1397-4285-9206-4a595a2a23ed.fullname" . }}
  labels:
    {{- include "go-echo0249d0e9-1397-4285-9206-4a595a2a23ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0249d0e9-1397-4285-9206-4a595a2a23ed.selectorLabels" . | nindent 6 }}
