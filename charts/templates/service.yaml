apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f0a23f9-1e12-4feb-863f-7de438c0ba28.fullname" . }}
  labels:
    {{- include "go-echo4f0a23f9-1e12-4feb-863f-7de438c0ba28.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f0a23f9-1e12-4feb-863f-7de438c0ba28.selectorLabels" . | nindent 6 }}
