apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8601cf8d-74ed-4e92-b39a-c2d62d2b2613.fullname" . }}
  labels:
    {{- include "go-echo8601cf8d-74ed-4e92-b39a-c2d62d2b2613.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8601cf8d-74ed-4e92-b39a-c2d62d2b2613.selectorLabels" . | nindent 6 }}
