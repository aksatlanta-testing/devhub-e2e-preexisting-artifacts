apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51b1f845-cdd1-4c6b-9d43-0627153c67e5.fullname" . }}
  labels:
    {{- include "go-echo51b1f845-cdd1-4c6b-9d43-0627153c67e5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51b1f845-cdd1-4c6b-9d43-0627153c67e5.selectorLabels" . | nindent 6 }}
