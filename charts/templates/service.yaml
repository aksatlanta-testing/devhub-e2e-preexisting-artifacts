apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73861bc9-891c-48fc-9b86-ce487a4a70c3.fullname" . }}
  labels:
    {{- include "go-echo73861bc9-891c-48fc-9b86-ce487a4a70c3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73861bc9-891c-48fc-9b86-ce487a4a70c3.selectorLabels" . | nindent 6 }}
