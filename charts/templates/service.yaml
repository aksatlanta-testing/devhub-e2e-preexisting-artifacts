apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95d42b40-58b5-4a04-b6ec-3372099a860d.fullname" . }}
  labels:
    {{- include "go-echo95d42b40-58b5-4a04-b6ec-3372099a860d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95d42b40-58b5-4a04-b6ec-3372099a860d.selectorLabels" . | nindent 6 }}
