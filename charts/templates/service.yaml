apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo618cc628-0acf-4cea-b47b-fbedb49b6744.fullname" . }}
  labels:
    {{- include "go-echo618cc628-0acf-4cea-b47b-fbedb49b6744.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo618cc628-0acf-4cea-b47b-fbedb49b6744.selectorLabels" . | nindent 6 }}
