apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc34f1a8e-0242-494c-854f-23c4b24b5e5e.fullname" . }}
  labels:
    {{- include "go-echoc34f1a8e-0242-494c-854f-23c4b24b5e5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc34f1a8e-0242-494c-854f-23c4b24b5e5e.selectorLabels" . | nindent 6 }}
