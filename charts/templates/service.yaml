apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfeaac09-4856-452f-b9d8-bce5bc1652bd.fullname" . }}
  labels:
    {{- include "go-echocfeaac09-4856-452f-b9d8-bce5bc1652bd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfeaac09-4856-452f-b9d8-bce5bc1652bd.selectorLabels" . | nindent 6 }}
