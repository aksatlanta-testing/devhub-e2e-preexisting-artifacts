apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7c77768-a01f-435d-b656-23002ce8af56.fullname" . }}
  labels:
    {{- include "go-echoc7c77768-a01f-435d-b656-23002ce8af56.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7c77768-a01f-435d-b656-23002ce8af56.selectorLabels" . | nindent 6 }}
