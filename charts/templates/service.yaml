apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoece73696-e25b-4e27-8994-c96363e97778.fullname" . }}
  labels:
    {{- include "go-echoece73696-e25b-4e27-8994-c96363e97778.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoece73696-e25b-4e27-8994-c96363e97778.selectorLabels" . | nindent 6 }}
