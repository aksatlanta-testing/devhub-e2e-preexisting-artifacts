apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b9f833f-cf49-426f-a6d5-c58856ac1fee.fullname" . }}
  labels:
    {{- include "go-echo2b9f833f-cf49-426f-a6d5-c58856ac1fee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b9f833f-cf49-426f-a6d5-c58856ac1fee.selectorLabels" . | nindent 6 }}
