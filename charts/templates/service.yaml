apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7403b498-67e1-403f-b913-b0f30787060d.fullname" . }}
  labels:
    {{- include "go-echo7403b498-67e1-403f-b913-b0f30787060d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7403b498-67e1-403f-b913-b0f30787060d.selectorLabels" . | nindent 6 }}
