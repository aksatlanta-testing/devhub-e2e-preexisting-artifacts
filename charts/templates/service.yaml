apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78c38d8c-bda8-4e8d-9ebc-aab3829c1a39.fullname" . }}
  labels:
    {{- include "go-echo78c38d8c-bda8-4e8d-9ebc-aab3829c1a39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78c38d8c-bda8-4e8d-9ebc-aab3829c1a39.selectorLabels" . | nindent 6 }}
