apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f868af0-e976-4ead-88de-8f6200c2dc94.fullname" . }}
  labels:
    {{- include "go-echo3f868af0-e976-4ead-88de-8f6200c2dc94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f868af0-e976-4ead-88de-8f6200c2dc94.selectorLabels" . | nindent 6 }}
