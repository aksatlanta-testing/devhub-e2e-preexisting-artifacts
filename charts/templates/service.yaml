apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb127106-19ca-4a1b-920c-4318fb710e1d.fullname" . }}
  labels:
    {{- include "go-echobb127106-19ca-4a1b-920c-4318fb710e1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb127106-19ca-4a1b-920c-4318fb710e1d.selectorLabels" . | nindent 6 }}
