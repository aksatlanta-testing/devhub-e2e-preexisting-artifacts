apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof71683d0-f01e-4bc0-af1f-6293bf8dfcb5.fullname" . }}
  labels:
    {{- include "go-echof71683d0-f01e-4bc0-af1f-6293bf8dfcb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof71683d0-f01e-4bc0-af1f-6293bf8dfcb5.selectorLabels" . | nindent 6 }}
