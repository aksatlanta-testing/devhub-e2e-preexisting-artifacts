apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91892406-e2f5-45ee-99f1-747e320b193f.fullname" . }}
  labels:
    {{- include "go-echo91892406-e2f5-45ee-99f1-747e320b193f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91892406-e2f5-45ee-99f1-747e320b193f.selectorLabels" . | nindent 6 }}
