apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf6e15ac-a633-4fc8-91e7-bb31d778e395.fullname" . }}
  labels:
    {{- include "go-echoaf6e15ac-a633-4fc8-91e7-bb31d778e395.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf6e15ac-a633-4fc8-91e7-bb31d778e395.selectorLabels" . | nindent 6 }}
