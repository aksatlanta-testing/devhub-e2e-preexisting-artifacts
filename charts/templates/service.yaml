apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1771ce2-a130-41f4-bcc2-12d9e2d36b13.fullname" . }}
  labels:
    {{- include "go-echob1771ce2-a130-41f4-bcc2-12d9e2d36b13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1771ce2-a130-41f4-bcc2-12d9e2d36b13.selectorLabels" . | nindent 6 }}
