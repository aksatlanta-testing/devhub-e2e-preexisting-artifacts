apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78cf224a-1200-4ad6-97df-f4638dc9409b.fullname" . }}
  labels:
    {{- include "go-echo78cf224a-1200-4ad6-97df-f4638dc9409b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78cf224a-1200-4ad6-97df-f4638dc9409b.selectorLabels" . | nindent 6 }}
