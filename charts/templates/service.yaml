apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof89c40ff-ced7-49f7-9a39-1099caf45c92.fullname" . }}
  labels:
    {{- include "go-echof89c40ff-ced7-49f7-9a39-1099caf45c92.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof89c40ff-ced7-49f7-9a39-1099caf45c92.selectorLabels" . | nindent 6 }}
