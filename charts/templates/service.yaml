apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo718b57e7-f59b-4bd6-8339-ad9aa8eb3165.fullname" . }}
  labels:
    {{- include "go-echo718b57e7-f59b-4bd6-8339-ad9aa8eb3165.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo718b57e7-f59b-4bd6-8339-ad9aa8eb3165.selectorLabels" . | nindent 6 }}
