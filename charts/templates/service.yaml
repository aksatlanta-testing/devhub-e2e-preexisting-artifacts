apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofeb330bb-e929-4b68-98a5-610a8c0b308f.fullname" . }}
  labels:
    {{- include "go-echofeb330bb-e929-4b68-98a5-610a8c0b308f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofeb330bb-e929-4b68-98a5-610a8c0b308f.selectorLabels" . | nindent 6 }}
