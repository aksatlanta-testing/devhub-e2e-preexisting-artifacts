apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobfb52dd4-a8b1-4942-8199-b4437fa3d700.fullname" . }}
  labels:
    {{- include "go-echobfb52dd4-a8b1-4942-8199-b4437fa3d700.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobfb52dd4-a8b1-4942-8199-b4437fa3d700.selectorLabels" . | nindent 6 }}
