apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a13381c-2a67-4dc9-b9c4-2213ef2a5dae.fullname" . }}
  labels:
    {{- include "go-echo7a13381c-2a67-4dc9-b9c4-2213ef2a5dae.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a13381c-2a67-4dc9-b9c4-2213ef2a5dae.selectorLabels" . | nindent 6 }}
