apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo097803f6-9d9c-409e-9e27-02972118024e.fullname" . }}
  labels:
    {{- include "go-echo097803f6-9d9c-409e-9e27-02972118024e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo097803f6-9d9c-409e-9e27-02972118024e.selectorLabels" . | nindent 6 }}
