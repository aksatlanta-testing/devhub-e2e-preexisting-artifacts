apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo198d2bb0-7544-4bee-b0eb-de2d2439099d.fullname" . }}
  labels:
    {{- include "go-echo198d2bb0-7544-4bee-b0eb-de2d2439099d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo198d2bb0-7544-4bee-b0eb-de2d2439099d.selectorLabels" . | nindent 6 }}
