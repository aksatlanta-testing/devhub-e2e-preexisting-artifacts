apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe558975b-aba3-4e8a-a6c7-9ed9a31974ee.fullname" . }}
  labels:
    {{- include "go-echoe558975b-aba3-4e8a-a6c7-9ed9a31974ee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe558975b-aba3-4e8a-a6c7-9ed9a31974ee.selectorLabels" . | nindent 6 }}
