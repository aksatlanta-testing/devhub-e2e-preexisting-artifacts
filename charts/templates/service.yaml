apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3af1758b-b86d-4c7a-ac43-8d1197ac1301.fullname" . }}
  labels:
    {{- include "go-echo3af1758b-b86d-4c7a-ac43-8d1197ac1301.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3af1758b-b86d-4c7a-ac43-8d1197ac1301.selectorLabels" . | nindent 6 }}
