apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02632388-d7bb-4906-844f-84eb782b6570.fullname" . }}
  labels:
    {{- include "go-echo02632388-d7bb-4906-844f-84eb782b6570.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02632388-d7bb-4906-844f-84eb782b6570.selectorLabels" . | nindent 6 }}
