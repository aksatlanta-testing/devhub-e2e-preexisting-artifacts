apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63e28ace-c499-4f1f-9959-7b7c88cca403.fullname" . }}
  labels:
    {{- include "go-echo63e28ace-c499-4f1f-9959-7b7c88cca403.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63e28ace-c499-4f1f-9959-7b7c88cca403.selectorLabels" . | nindent 6 }}
