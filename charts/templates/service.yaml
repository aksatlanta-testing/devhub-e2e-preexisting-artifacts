apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a4f2cee-9d4a-42bf-ac21-6526bd5802f4.fullname" . }}
  labels:
    {{- include "go-echo6a4f2cee-9d4a-42bf-ac21-6526bd5802f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a4f2cee-9d4a-42bf-ac21-6526bd5802f4.selectorLabels" . | nindent 6 }}
