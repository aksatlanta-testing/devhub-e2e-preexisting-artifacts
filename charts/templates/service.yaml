apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2cf5f199-3d42-4192-aabe-025554814772.fullname" . }}
  labels:
    {{- include "go-echo2cf5f199-3d42-4192-aabe-025554814772.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2cf5f199-3d42-4192-aabe-025554814772.selectorLabels" . | nindent 6 }}
