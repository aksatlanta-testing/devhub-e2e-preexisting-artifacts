apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo287dc8d3-a9fe-4102-95f0-2a84ae8938df.fullname" . }}
  labels:
    {{- include "go-echo287dc8d3-a9fe-4102-95f0-2a84ae8938df.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo287dc8d3-a9fe-4102-95f0-2a84ae8938df.selectorLabels" . | nindent 6 }}
