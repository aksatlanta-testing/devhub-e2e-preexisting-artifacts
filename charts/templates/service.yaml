apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2bb94b60-dd5d-47d8-baab-d4c87e21456b.fullname" . }}
  labels:
    {{- include "go-echo2bb94b60-dd5d-47d8-baab-d4c87e21456b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2bb94b60-dd5d-47d8-baab-d4c87e21456b.selectorLabels" . | nindent 6 }}
