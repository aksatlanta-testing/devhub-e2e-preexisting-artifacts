apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo396b49a0-3c21-4dbb-85f3-9e25451153bf.fullname" . }}
  labels:
    {{- include "go-echo396b49a0-3c21-4dbb-85f3-9e25451153bf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo396b49a0-3c21-4dbb-85f3-9e25451153bf.selectorLabels" . | nindent 6 }}
