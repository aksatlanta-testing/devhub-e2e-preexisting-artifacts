apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b63a4cf-a367-431d-9472-577b4be5e8fc.fullname" . }}
  labels:
    {{- include "go-echo8b63a4cf-a367-431d-9472-577b4be5e8fc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b63a4cf-a367-431d-9472-577b4be5e8fc.selectorLabels" . | nindent 6 }}
