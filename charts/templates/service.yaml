apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef59c293-41db-4ef8-84e9-b3b21b4a1647.fullname" . }}
  labels:
    {{- include "go-echoef59c293-41db-4ef8-84e9-b3b21b4a1647.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef59c293-41db-4ef8-84e9-b3b21b4a1647.selectorLabels" . | nindent 6 }}
