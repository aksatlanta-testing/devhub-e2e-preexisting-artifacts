apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77090f6d-dca3-4831-8c4b-8242f6782ab9.fullname" . }}
  labels:
    {{- include "go-echo77090f6d-dca3-4831-8c4b-8242f6782ab9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77090f6d-dca3-4831-8c4b-8242f6782ab9.selectorLabels" . | nindent 6 }}
