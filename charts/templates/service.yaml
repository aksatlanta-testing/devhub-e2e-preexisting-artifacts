apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2db09156-b3fe-490d-9cf5-8e62d62ff5a8.fullname" . }}
  labels:
    {{- include "go-echo2db09156-b3fe-490d-9cf5-8e62d62ff5a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2db09156-b3fe-490d-9cf5-8e62d62ff5a8.selectorLabels" . | nindent 6 }}
