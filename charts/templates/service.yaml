apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod73617b7-e1d8-42c6-9855-a52a4b2e1cc9.fullname" . }}
  labels:
    {{- include "go-echod73617b7-e1d8-42c6-9855-a52a4b2e1cc9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod73617b7-e1d8-42c6-9855-a52a4b2e1cc9.selectorLabels" . | nindent 6 }}
