apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38b6f325-0e6f-45fa-9de9-a7d9485cbf8a.fullname" . }}
  labels:
    {{- include "go-echo38b6f325-0e6f-45fa-9de9-a7d9485cbf8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38b6f325-0e6f-45fa-9de9-a7d9485cbf8a.selectorLabels" . | nindent 6 }}
