apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2912bfbf-902f-4245-acb5-396aca7e1efc.fullname" . }}
  labels:
    {{- include "go-echo2912bfbf-902f-4245-acb5-396aca7e1efc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2912bfbf-902f-4245-acb5-396aca7e1efc.selectorLabels" . | nindent 6 }}
