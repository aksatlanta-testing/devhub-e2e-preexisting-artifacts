apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa66b733-88dd-4557-8ab2-c42570a70fa8.fullname" . }}
  labels:
    {{- include "go-echofa66b733-88dd-4557-8ab2-c42570a70fa8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa66b733-88dd-4557-8ab2-c42570a70fa8.selectorLabels" . | nindent 6 }}
