apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad003ddd-2ea2-4679-81e7-d191fb4a74ed.fullname" . }}
  labels:
    {{- include "go-echoad003ddd-2ea2-4679-81e7-d191fb4a74ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad003ddd-2ea2-4679-81e7-d191fb4a74ed.selectorLabels" . | nindent 6 }}
