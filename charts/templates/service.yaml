apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob12b9207-9fbb-4062-8f95-beae1003c092.fullname" . }}
  labels:
    {{- include "go-echob12b9207-9fbb-4062-8f95-beae1003c092.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob12b9207-9fbb-4062-8f95-beae1003c092.selectorLabels" . | nindent 6 }}
