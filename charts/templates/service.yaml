apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc4af2d6-8c0c-4f02-a4ee-030abd28087f.fullname" . }}
  labels:
    {{- include "go-echobc4af2d6-8c0c-4f02-a4ee-030abd28087f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc4af2d6-8c0c-4f02-a4ee-030abd28087f.selectorLabels" . | nindent 6 }}
