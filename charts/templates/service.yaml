apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo871c3774-7511-4aaf-b736-f2d7a0297e77.fullname" . }}
  labels:
    {{- include "go-echo871c3774-7511-4aaf-b736-f2d7a0297e77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo871c3774-7511-4aaf-b736-f2d7a0297e77.selectorLabels" . | nindent 6 }}
