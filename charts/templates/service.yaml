apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7fc53190-50d8-4669-93cb-2aa62d71dd15.fullname" . }}
  labels:
    {{- include "go-echo7fc53190-50d8-4669-93cb-2aa62d71dd15.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7fc53190-50d8-4669-93cb-2aa62d71dd15.selectorLabels" . | nindent 6 }}
