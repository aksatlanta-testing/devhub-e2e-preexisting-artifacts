apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a4b2b39-5ab0-469c-a686-d756313cf0f2.fullname" . }}
  labels:
    {{- include "go-echo5a4b2b39-5ab0-469c-a686-d756313cf0f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a4b2b39-5ab0-469c-a686-d756313cf0f2.selectorLabels" . | nindent 6 }}
