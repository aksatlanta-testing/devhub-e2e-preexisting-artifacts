apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4709ba48-0f9d-4ab5-84d5-e16381ce7410.fullname" . }}
  labels:
    {{- include "go-echo4709ba48-0f9d-4ab5-84d5-e16381ce7410.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4709ba48-0f9d-4ab5-84d5-e16381ce7410.selectorLabels" . | nindent 6 }}
