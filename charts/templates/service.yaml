apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22dba7a0-f623-4127-b82d-3cb9bdd899df.fullname" . }}
  labels:
    {{- include "go-echo22dba7a0-f623-4127-b82d-3cb9bdd899df.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22dba7a0-f623-4127-b82d-3cb9bdd899df.selectorLabels" . | nindent 6 }}
