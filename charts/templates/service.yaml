apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74a5fe69-e9e2-4a69-a6ac-f2b4393877c1.fullname" . }}
  labels:
    {{- include "go-echo74a5fe69-e9e2-4a69-a6ac-f2b4393877c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74a5fe69-e9e2-4a69-a6ac-f2b4393877c1.selectorLabels" . | nindent 6 }}
