apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53096e33-1994-48f6-af0c-101f64f56bbd.fullname" . }}
  labels:
    {{- include "go-echo53096e33-1994-48f6-af0c-101f64f56bbd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53096e33-1994-48f6-af0c-101f64f56bbd.selectorLabels" . | nindent 6 }}
