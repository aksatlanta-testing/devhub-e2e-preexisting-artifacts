apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec686d24-4847-4d7e-bf3e-c15837a31e80.fullname" . }}
  labels:
    {{- include "go-echoec686d24-4847-4d7e-bf3e-c15837a31e80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec686d24-4847-4d7e-bf3e-c15837a31e80.selectorLabels" . | nindent 6 }}
