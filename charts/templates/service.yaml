apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8701fdb-75f1-471f-8696-ec6f2cefee56.fullname" . }}
  labels:
    {{- include "go-echod8701fdb-75f1-471f-8696-ec6f2cefee56.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8701fdb-75f1-471f-8696-ec6f2cefee56.selectorLabels" . | nindent 6 }}
