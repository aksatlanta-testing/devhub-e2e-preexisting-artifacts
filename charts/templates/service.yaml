apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobebb05f1-586d-42e8-aa3d-971ffecd246a.fullname" . }}
  labels:
    {{- include "go-echobebb05f1-586d-42e8-aa3d-971ffecd246a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobebb05f1-586d-42e8-aa3d-971ffecd246a.selectorLabels" . | nindent 6 }}
