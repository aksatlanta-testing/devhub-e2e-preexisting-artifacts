apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4305b558-f29e-4f82-8873-f40ee4c13927.fullname" . }}
  labels:
    {{- include "go-echo4305b558-f29e-4f82-8873-f40ee4c13927.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4305b558-f29e-4f82-8873-f40ee4c13927.selectorLabels" . | nindent 6 }}
