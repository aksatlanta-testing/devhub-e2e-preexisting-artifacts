apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof192b39b-4e86-4a8d-91b8-2ddf6845adb0.fullname" . }}
  labels:
    {{- include "go-echof192b39b-4e86-4a8d-91b8-2ddf6845adb0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof192b39b-4e86-4a8d-91b8-2ddf6845adb0.selectorLabels" . | nindent 6 }}
