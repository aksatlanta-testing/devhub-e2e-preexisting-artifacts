apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5520a827-16b6-4174-ba2f-5212bdb277a5.fullname" . }}
  labels:
    {{- include "go-echo5520a827-16b6-4174-ba2f-5212bdb277a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5520a827-16b6-4174-ba2f-5212bdb277a5.selectorLabels" . | nindent 6 }}
