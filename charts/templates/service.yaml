apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a59ee12-5e6d-48ac-a95f-da4db5c6fdc1.fullname" . }}
  labels:
    {{- include "go-echo3a59ee12-5e6d-48ac-a95f-da4db5c6fdc1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a59ee12-5e6d-48ac-a95f-da4db5c6fdc1.selectorLabels" . | nindent 6 }}
