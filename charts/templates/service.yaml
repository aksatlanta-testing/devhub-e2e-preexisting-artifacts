apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe5a6987-6ef2-4d54-afca-bea598267be7.fullname" . }}
  labels:
    {{- include "go-echobe5a6987-6ef2-4d54-afca-bea598267be7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe5a6987-6ef2-4d54-afca-bea598267be7.selectorLabels" . | nindent 6 }}
