apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc095473b-6589-457b-a1ef-9f270706df5a.fullname" . }}
  labels:
    {{- include "go-echoc095473b-6589-457b-a1ef-9f270706df5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc095473b-6589-457b-a1ef-9f270706df5a.selectorLabels" . | nindent 6 }}
