apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad11a5c0-a8cb-4ea5-930e-823dd1408cf6.fullname" . }}
  labels:
    {{- include "go-echoad11a5c0-a8cb-4ea5-930e-823dd1408cf6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad11a5c0-a8cb-4ea5-930e-823dd1408cf6.selectorLabels" . | nindent 6 }}
