apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo396bc7e8-a325-4921-a57e-033fbdb94302.fullname" . }}
  labels:
    {{- include "go-echo396bc7e8-a325-4921-a57e-033fbdb94302.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo396bc7e8-a325-4921-a57e-033fbdb94302.selectorLabels" . | nindent 6 }}
