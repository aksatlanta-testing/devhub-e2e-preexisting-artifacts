apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9048da6-ddae-4d93-bde5-8b2f674a4936.fullname" . }}
  labels:
    {{- include "go-echoa9048da6-ddae-4d93-bde5-8b2f674a4936.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9048da6-ddae-4d93-bde5-8b2f674a4936.selectorLabels" . | nindent 6 }}
