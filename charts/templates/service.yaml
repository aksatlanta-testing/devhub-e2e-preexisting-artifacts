apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf03be82-8c10-4f13-912d-4e6f2795530c.fullname" . }}
  labels:
    {{- include "go-echoaf03be82-8c10-4f13-912d-4e6f2795530c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf03be82-8c10-4f13-912d-4e6f2795530c.selectorLabels" . | nindent 6 }}
