apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f8c98ab-a4a6-4ca5-81fd-6eeecbd45a61.fullname" . }}
  labels:
    {{- include "go-echo7f8c98ab-a4a6-4ca5-81fd-6eeecbd45a61.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f8c98ab-a4a6-4ca5-81fd-6eeecbd45a61.selectorLabels" . | nindent 6 }}
