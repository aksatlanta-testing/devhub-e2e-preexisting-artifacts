apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo854c739d-cbd4-4509-be19-e984f73e6ed2.fullname" . }}
  labels:
    {{- include "go-echo854c739d-cbd4-4509-be19-e984f73e6ed2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo854c739d-cbd4-4509-be19-e984f73e6ed2.selectorLabels" . | nindent 6 }}
