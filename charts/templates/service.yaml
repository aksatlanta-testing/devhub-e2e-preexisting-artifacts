apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod248723e-2511-4cd4-8a96-a0354ec6804c.fullname" . }}
  labels:
    {{- include "go-echod248723e-2511-4cd4-8a96-a0354ec6804c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod248723e-2511-4cd4-8a96-a0354ec6804c.selectorLabels" . | nindent 6 }}
