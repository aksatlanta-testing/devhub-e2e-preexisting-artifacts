apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod32ecbe5-a40f-48b5-be4a-432db07239bc.fullname" . }}
  labels:
    {{- include "go-echod32ecbe5-a40f-48b5-be4a-432db07239bc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod32ecbe5-a40f-48b5-be4a-432db07239bc.selectorLabels" . | nindent 6 }}
