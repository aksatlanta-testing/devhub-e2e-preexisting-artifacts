apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69d561a3-68d7-4dca-b77f-4872ea6fa0a7.fullname" . }}
  labels:
    {{- include "go-echo69d561a3-68d7-4dca-b77f-4872ea6fa0a7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69d561a3-68d7-4dca-b77f-4872ea6fa0a7.selectorLabels" . | nindent 6 }}
