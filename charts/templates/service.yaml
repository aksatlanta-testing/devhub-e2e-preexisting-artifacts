apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe914720b-c241-49e3-baa9-b731906dad22.fullname" . }}
  labels:
    {{- include "go-echoe914720b-c241-49e3-baa9-b731906dad22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe914720b-c241-49e3-baa9-b731906dad22.selectorLabels" . | nindent 6 }}
