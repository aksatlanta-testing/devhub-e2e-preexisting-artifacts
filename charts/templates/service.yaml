apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19f54f05-2e91-4f2d-9940-f6c20e8f9473.fullname" . }}
  labels:
    {{- include "go-echo19f54f05-2e91-4f2d-9940-f6c20e8f9473.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19f54f05-2e91-4f2d-9940-f6c20e8f9473.selectorLabels" . | nindent 6 }}
