apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a51a06e-861b-4f17-aa83-47fb138cdd63.fullname" . }}
  labels:
    {{- include "go-echo2a51a06e-861b-4f17-aa83-47fb138cdd63.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a51a06e-861b-4f17-aa83-47fb138cdd63.selectorLabels" . | nindent 6 }}
