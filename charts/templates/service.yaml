apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a76f99f-99de-4b9b-bb31-96884f8dd7f1.fullname" . }}
  labels:
    {{- include "go-echo4a76f99f-99de-4b9b-bb31-96884f8dd7f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a76f99f-99de-4b9b-bb31-96884f8dd7f1.selectorLabels" . | nindent 6 }}
