apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo837fb38b-8322-4a82-b6ed-ce72a1afc010.fullname" . }}
  labels:
    {{- include "go-echo837fb38b-8322-4a82-b6ed-ce72a1afc010.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo837fb38b-8322-4a82-b6ed-ce72a1afc010.selectorLabels" . | nindent 6 }}
