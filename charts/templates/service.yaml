apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08220970-334a-4cd9-9ee2-0897bf3084a9.fullname" . }}
  labels:
    {{- include "go-echo08220970-334a-4cd9-9ee2-0897bf3084a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08220970-334a-4cd9-9ee2-0897bf3084a9.selectorLabels" . | nindent 6 }}
