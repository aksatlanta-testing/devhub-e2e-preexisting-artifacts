apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73bccbcf-20aa-4cf6-9b09-b4de2a942275.fullname" . }}
  labels:
    {{- include "go-echo73bccbcf-20aa-4cf6-9b09-b4de2a942275.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73bccbcf-20aa-4cf6-9b09-b4de2a942275.selectorLabels" . | nindent 6 }}
