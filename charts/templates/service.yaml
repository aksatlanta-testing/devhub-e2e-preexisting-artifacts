apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad4f174d-bfec-4ba5-a25e-de81808b10d3.fullname" . }}
  labels:
    {{- include "go-echoad4f174d-bfec-4ba5-a25e-de81808b10d3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad4f174d-bfec-4ba5-a25e-de81808b10d3.selectorLabels" . | nindent 6 }}
