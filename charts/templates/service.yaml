apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc21a5a1a-92ab-49d7-ac32-47c801aeb1f3.fullname" . }}
  labels:
    {{- include "go-echoc21a5a1a-92ab-49d7-ac32-47c801aeb1f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc21a5a1a-92ab-49d7-ac32-47c801aeb1f3.selectorLabels" . | nindent 6 }}
