apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo503f30cb-f56f-4243-9698-3095225835be.fullname" . }}
  labels:
    {{- include "go-echo503f30cb-f56f-4243-9698-3095225835be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo503f30cb-f56f-4243-9698-3095225835be.selectorLabels" . | nindent 6 }}
