apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b0af9d0-6575-4f5b-a459-7d83d01c2eb4.fullname" . }}
  labels:
    {{- include "go-echo5b0af9d0-6575-4f5b-a459-7d83d01c2eb4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b0af9d0-6575-4f5b-a459-7d83d01c2eb4.selectorLabels" . | nindent 6 }}
