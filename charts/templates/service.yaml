apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo617859a0-54f0-4fc1-a254-f286bbf12585.fullname" . }}
  labels:
    {{- include "go-echo617859a0-54f0-4fc1-a254-f286bbf12585.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo617859a0-54f0-4fc1-a254-f286bbf12585.selectorLabels" . | nindent 6 }}
