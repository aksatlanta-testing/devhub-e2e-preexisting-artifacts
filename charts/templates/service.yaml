apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23a69cbd-1553-4add-b754-f01dc2e16508.fullname" . }}
  labels:
    {{- include "go-echo23a69cbd-1553-4add-b754-f01dc2e16508.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23a69cbd-1553-4add-b754-f01dc2e16508.selectorLabels" . | nindent 6 }}
