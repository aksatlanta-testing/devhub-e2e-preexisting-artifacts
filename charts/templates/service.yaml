apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe66e81b3-0058-41de-b687-1d1407cae33d.fullname" . }}
  labels:
    {{- include "go-echoe66e81b3-0058-41de-b687-1d1407cae33d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe66e81b3-0058-41de-b687-1d1407cae33d.selectorLabels" . | nindent 6 }}
