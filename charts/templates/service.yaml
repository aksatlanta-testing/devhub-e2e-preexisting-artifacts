apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo855cec18-8744-426c-888a-fee0e2c1a105.fullname" . }}
  labels:
    {{- include "go-echo855cec18-8744-426c-888a-fee0e2c1a105.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo855cec18-8744-426c-888a-fee0e2c1a105.selectorLabels" . | nindent 6 }}
