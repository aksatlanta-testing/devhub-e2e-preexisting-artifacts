apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc68b3943-7974-48a1-b7a7-927031b7116d.fullname" . }}
  labels:
    {{- include "go-echoc68b3943-7974-48a1-b7a7-927031b7116d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc68b3943-7974-48a1-b7a7-927031b7116d.selectorLabels" . | nindent 6 }}
