apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d18d0b4-9652-430a-95e2-5626bc6f962e.fullname" . }}
  labels:
    {{- include "go-echo7d18d0b4-9652-430a-95e2-5626bc6f962e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d18d0b4-9652-430a-95e2-5626bc6f962e.selectorLabels" . | nindent 6 }}
