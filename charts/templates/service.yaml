apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7045f42-dc83-4566-8409-945cf99d9fee.fullname" . }}
  labels:
    {{- include "go-echob7045f42-dc83-4566-8409-945cf99d9fee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7045f42-dc83-4566-8409-945cf99d9fee.selectorLabels" . | nindent 6 }}
