apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a30e0c0-d289-4872-b60f-8ab522b7c319.fullname" . }}
  labels:
    {{- include "go-echo1a30e0c0-d289-4872-b60f-8ab522b7c319.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a30e0c0-d289-4872-b60f-8ab522b7c319.selectorLabels" . | nindent 6 }}
