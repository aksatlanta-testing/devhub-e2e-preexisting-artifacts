apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4882cd57-bf7e-4bc1-a994-8f337cfe2371.fullname" . }}
  labels:
    {{- include "go-echo4882cd57-bf7e-4bc1-a994-8f337cfe2371.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4882cd57-bf7e-4bc1-a994-8f337cfe2371.selectorLabels" . | nindent 6 }}
