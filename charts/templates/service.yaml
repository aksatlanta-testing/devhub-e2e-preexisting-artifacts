apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4dcfdca-b6e8-46ea-876d-ba87a91dd8a4.fullname" . }}
  labels:
    {{- include "go-echof4dcfdca-b6e8-46ea-876d-ba87a91dd8a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4dcfdca-b6e8-46ea-876d-ba87a91dd8a4.selectorLabels" . | nindent 6 }}
