apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b17188b-f9cc-459b-8c71-66b2e4b3b52d.fullname" . }}
  labels:
    {{- include "go-echo2b17188b-f9cc-459b-8c71-66b2e4b3b52d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b17188b-f9cc-459b-8c71-66b2e4b3b52d.selectorLabels" . | nindent 6 }}
