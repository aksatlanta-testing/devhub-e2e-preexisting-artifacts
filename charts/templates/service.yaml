apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo323380a6-8c49-4f4b-8f22-68193c4d3079.fullname" . }}
  labels:
    {{- include "go-echo323380a6-8c49-4f4b-8f22-68193c4d3079.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo323380a6-8c49-4f4b-8f22-68193c4d3079.selectorLabels" . | nindent 6 }}
