apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ae98684-264e-422e-a5a8-71e193c34c16.fullname" . }}
  labels:
    {{- include "go-echo8ae98684-264e-422e-a5a8-71e193c34c16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ae98684-264e-422e-a5a8-71e193c34c16.selectorLabels" . | nindent 6 }}
