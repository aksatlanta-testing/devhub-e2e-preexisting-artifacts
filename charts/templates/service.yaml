apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo286c3a6f-6a1c-409f-ac05-0bd2afd12fd6.fullname" . }}
  labels:
    {{- include "go-echo286c3a6f-6a1c-409f-ac05-0bd2afd12fd6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo286c3a6f-6a1c-409f-ac05-0bd2afd12fd6.selectorLabels" . | nindent 6 }}
