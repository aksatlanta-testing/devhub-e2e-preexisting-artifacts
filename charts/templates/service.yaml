apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30d7bc88-5311-4ef1-881a-84bbf9418406.fullname" . }}
  labels:
    {{- include "go-echo30d7bc88-5311-4ef1-881a-84bbf9418406.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30d7bc88-5311-4ef1-881a-84bbf9418406.selectorLabels" . | nindent 6 }}
