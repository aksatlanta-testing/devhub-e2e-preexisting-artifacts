apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo418c4234-5eb9-4cae-95ea-2326fd65901a.fullname" . }}
  labels:
    {{- include "go-echo418c4234-5eb9-4cae-95ea-2326fd65901a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo418c4234-5eb9-4cae-95ea-2326fd65901a.selectorLabels" . | nindent 6 }}
