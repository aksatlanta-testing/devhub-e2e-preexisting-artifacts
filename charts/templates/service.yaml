apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9a3d8d5-23aa-4fc7-a03d-cb354d6956fd.fullname" . }}
  labels:
    {{- include "go-echod9a3d8d5-23aa-4fc7-a03d-cb354d6956fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9a3d8d5-23aa-4fc7-a03d-cb354d6956fd.selectorLabels" . | nindent 6 }}
