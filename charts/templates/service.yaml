apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19a739d7-13e4-4762-84da-fddc9cb40f2b.fullname" . }}
  labels:
    {{- include "go-echo19a739d7-13e4-4762-84da-fddc9cb40f2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19a739d7-13e4-4762-84da-fddc9cb40f2b.selectorLabels" . | nindent 6 }}
