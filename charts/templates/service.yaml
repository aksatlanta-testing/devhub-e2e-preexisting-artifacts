apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f67911e-81bf-46bb-af84-c16fb9c66c8c.fullname" . }}
  labels:
    {{- include "go-echo0f67911e-81bf-46bb-af84-c16fb9c66c8c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f67911e-81bf-46bb-af84-c16fb9c66c8c.selectorLabels" . | nindent 6 }}
