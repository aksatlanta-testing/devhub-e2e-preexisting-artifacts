apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e77346c-e37e-400b-92b4-6e61e3de06e0.fullname" . }}
  labels:
    {{- include "go-echo5e77346c-e37e-400b-92b4-6e61e3de06e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e77346c-e37e-400b-92b4-6e61e3de06e0.selectorLabels" . | nindent 6 }}
