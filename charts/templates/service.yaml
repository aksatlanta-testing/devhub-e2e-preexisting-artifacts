apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e27a5fa-9bdc-45cc-96b1-cb70807983dc.fullname" . }}
  labels:
    {{- include "go-echo3e27a5fa-9bdc-45cc-96b1-cb70807983dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e27a5fa-9bdc-45cc-96b1-cb70807983dc.selectorLabels" . | nindent 6 }}
