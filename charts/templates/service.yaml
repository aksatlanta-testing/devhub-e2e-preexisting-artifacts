apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84c96860-db5b-40ba-bf3a-0297db48e00f.fullname" . }}
  labels:
    {{- include "go-echo84c96860-db5b-40ba-bf3a-0297db48e00f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84c96860-db5b-40ba-bf3a-0297db48e00f.selectorLabels" . | nindent 4 }}
