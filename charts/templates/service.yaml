apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55414c41-7c75-4553-b4e3-c591479bb63e.fullname" . }}
  labels:
    {{- include "go-echo55414c41-7c75-4553-b4e3-c591479bb63e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55414c41-7c75-4553-b4e3-c591479bb63e.selectorLabels" . | nindent 6 }}
