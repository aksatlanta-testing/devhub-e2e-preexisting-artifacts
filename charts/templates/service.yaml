apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b3c6f3e-1a07-4003-a50f-72adc8c023b0.fullname" . }}
  labels:
    {{- include "go-echo0b3c6f3e-1a07-4003-a50f-72adc8c023b0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b3c6f3e-1a07-4003-a50f-72adc8c023b0.selectorLabels" . | nindent 6 }}
