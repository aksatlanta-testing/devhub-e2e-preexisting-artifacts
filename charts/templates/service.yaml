apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9f4eba3-ce3e-4126-a83c-956d48532ea9.fullname" . }}
  labels:
    {{- include "go-echob9f4eba3-ce3e-4126-a83c-956d48532ea9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9f4eba3-ce3e-4126-a83c-956d48532ea9.selectorLabels" . | nindent 6 }}
