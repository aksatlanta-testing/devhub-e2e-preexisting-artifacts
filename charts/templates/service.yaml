apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02f29ace-fb89-42a4-855b-53c38afe8ec6.fullname" . }}
  labels:
    {{- include "go-echo02f29ace-fb89-42a4-855b-53c38afe8ec6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02f29ace-fb89-42a4-855b-53c38afe8ec6.selectorLabels" . | nindent 6 }}
