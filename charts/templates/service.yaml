apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1dc9324-ff00-4a03-b279-6673341d5c76.fullname" . }}
  labels:
    {{- include "go-echod1dc9324-ff00-4a03-b279-6673341d5c76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1dc9324-ff00-4a03-b279-6673341d5c76.selectorLabels" . | nindent 6 }}
