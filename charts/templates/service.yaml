apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaad088ec-9c90-4d70-807d-2ffb3ba6a0e6.fullname" . }}
  labels:
    {{- include "go-echoaad088ec-9c90-4d70-807d-2ffb3ba6a0e6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaad088ec-9c90-4d70-807d-2ffb3ba6a0e6.selectorLabels" . | nindent 6 }}
