apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98810c97-910f-42a9-8e0b-580d47b22fb4.fullname" . }}
  labels:
    {{- include "go-echo98810c97-910f-42a9-8e0b-580d47b22fb4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98810c97-910f-42a9-8e0b-580d47b22fb4.selectorLabels" . | nindent 6 }}
