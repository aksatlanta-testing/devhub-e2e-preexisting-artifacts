apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95c0c7fe-2d34-4f7c-a285-74aec9e59615.fullname" . }}
  labels:
    {{- include "go-echo95c0c7fe-2d34-4f7c-a285-74aec9e59615.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95c0c7fe-2d34-4f7c-a285-74aec9e59615.selectorLabels" . | nindent 6 }}
