apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo458c57c4-c05c-4fd5-b7ec-e2ff89f7c501.fullname" . }}
  labels:
    {{- include "go-echo458c57c4-c05c-4fd5-b7ec-e2ff89f7c501.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo458c57c4-c05c-4fd5-b7ec-e2ff89f7c501.selectorLabels" . | nindent 6 }}
