apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5de7870-b1d2-42f3-9ced-f4f5a14c1e55.fullname" . }}
  labels:
    {{- include "go-echod5de7870-b1d2-42f3-9ced-f4f5a14c1e55.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5de7870-b1d2-42f3-9ced-f4f5a14c1e55.selectorLabels" . | nindent 6 }}
