apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a1381cc-e76d-4242-b7bc-afce29cd3a3a.fullname" . }}
  labels:
    {{- include "go-echo8a1381cc-e76d-4242-b7bc-afce29cd3a3a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a1381cc-e76d-4242-b7bc-afce29cd3a3a.selectorLabels" . | nindent 6 }}
