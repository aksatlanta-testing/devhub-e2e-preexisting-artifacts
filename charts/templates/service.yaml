apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99c888b8-40d6-44b9-8cdc-0e69f2493a44.fullname" . }}
  labels:
    {{- include "go-echo99c888b8-40d6-44b9-8cdc-0e69f2493a44.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99c888b8-40d6-44b9-8cdc-0e69f2493a44.selectorLabels" . | nindent 6 }}
