apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42b65352-b3a3-433f-b3f1-48dc7b98d7d3.fullname" . }}
  labels:
    {{- include "go-echo42b65352-b3a3-433f-b3f1-48dc7b98d7d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42b65352-b3a3-433f-b3f1-48dc7b98d7d3.selectorLabels" . | nindent 6 }}
