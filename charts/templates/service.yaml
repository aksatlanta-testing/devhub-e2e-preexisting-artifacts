apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7395e08-dcfd-47e8-ad0a-c243fc2e4ea6.fullname" . }}
  labels:
    {{- include "go-echoc7395e08-dcfd-47e8-ad0a-c243fc2e4ea6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7395e08-dcfd-47e8-ad0a-c243fc2e4ea6.selectorLabels" . | nindent 6 }}
