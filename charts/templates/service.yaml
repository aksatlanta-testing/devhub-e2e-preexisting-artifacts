apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9cd52ff5-448a-4f8d-9777-2046f8332b1d.fullname" . }}
  labels:
    {{- include "go-echo9cd52ff5-448a-4f8d-9777-2046f8332b1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9cd52ff5-448a-4f8d-9777-2046f8332b1d.selectorLabels" . | nindent 6 }}
