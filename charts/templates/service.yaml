apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo102f01d1-b5fa-44dc-aae2-314ca3c58854.fullname" . }}
  labels:
    {{- include "go-echo102f01d1-b5fa-44dc-aae2-314ca3c58854.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo102f01d1-b5fa-44dc-aae2-314ca3c58854.selectorLabels" . | nindent 6 }}
