apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0840ff07-3a92-4c70-a26e-a6d33421b8a9.fullname" . }}
  labels:
    {{- include "go-echo0840ff07-3a92-4c70-a26e-a6d33421b8a9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0840ff07-3a92-4c70-a26e-a6d33421b8a9.selectorLabels" . | nindent 6 }}
