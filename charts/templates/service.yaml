apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41c7abc7-719c-4978-8398-8ac2d3ce9337.fullname" . }}
  labels:
    {{- include "go-echo41c7abc7-719c-4978-8398-8ac2d3ce9337.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41c7abc7-719c-4978-8398-8ac2d3ce9337.selectorLabels" . | nindent 6 }}
