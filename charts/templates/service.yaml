apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa47f1474-07e4-4a86-b89b-4ac200729deb.fullname" . }}
  labels:
    {{- include "go-echoa47f1474-07e4-4a86-b89b-4ac200729deb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa47f1474-07e4-4a86-b89b-4ac200729deb.selectorLabels" . | nindent 6 }}
