apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43782cdf-3b4d-4bed-819b-a0db2f05ef4f.fullname" . }}
  labels:
    {{- include "go-echo43782cdf-3b4d-4bed-819b-a0db2f05ef4f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43782cdf-3b4d-4bed-819b-a0db2f05ef4f.selectorLabels" . | nindent 6 }}
