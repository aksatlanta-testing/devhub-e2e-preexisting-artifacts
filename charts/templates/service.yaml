apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodafc5ce4-08a3-4cb7-b9c8-b173fc6cbfb4.fullname" . }}
  labels:
    {{- include "go-echodafc5ce4-08a3-4cb7-b9c8-b173fc6cbfb4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodafc5ce4-08a3-4cb7-b9c8-b173fc6cbfb4.selectorLabels" . | nindent 6 }}
