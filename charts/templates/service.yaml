apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32f3572a-b1e5-480c-ac70-3176ad924694.fullname" . }}
  labels:
    {{- include "go-echo32f3572a-b1e5-480c-ac70-3176ad924694.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32f3572a-b1e5-480c-ac70-3176ad924694.selectorLabels" . | nindent 6 }}
