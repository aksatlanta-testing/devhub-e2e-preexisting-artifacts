apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod178438d-4207-43cc-9087-a9f1c1c42af0.fullname" . }}
  labels:
    {{- include "go-echod178438d-4207-43cc-9087-a9f1c1c42af0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod178438d-4207-43cc-9087-a9f1c1c42af0.selectorLabels" . | nindent 6 }}
