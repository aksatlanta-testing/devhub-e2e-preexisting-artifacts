apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo85830815-8649-425c-babf-9ce603c7b015.fullname" . }}
  labels:
    {{- include "go-echo85830815-8649-425c-babf-9ce603c7b015.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo85830815-8649-425c-babf-9ce603c7b015.selectorLabels" . | nindent 6 }}
