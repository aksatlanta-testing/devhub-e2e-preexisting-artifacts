apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91e6d643-6abf-4dd8-8a63-95d5303a3e8c.fullname" . }}
  labels:
    {{- include "go-echo91e6d643-6abf-4dd8-8a63-95d5303a3e8c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91e6d643-6abf-4dd8-8a63-95d5303a3e8c.selectorLabels" . | nindent 6 }}
