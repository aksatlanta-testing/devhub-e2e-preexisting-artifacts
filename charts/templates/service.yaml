apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74fce327-1e3c-41d7-988a-1b9e2f24d3c1.fullname" . }}
  labels:
    {{- include "go-echo74fce327-1e3c-41d7-988a-1b9e2f24d3c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74fce327-1e3c-41d7-988a-1b9e2f24d3c1.selectorLabels" . | nindent 6 }}
