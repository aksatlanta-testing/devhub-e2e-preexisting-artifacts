apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd445366-0a7a-4ad1-83fc-e60ac1dd35c4.fullname" . }}
  labels:
    {{- include "go-echodd445366-0a7a-4ad1-83fc-e60ac1dd35c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd445366-0a7a-4ad1-83fc-e60ac1dd35c4.selectorLabels" . | nindent 6 }}
