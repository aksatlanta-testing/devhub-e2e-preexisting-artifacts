apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo785dcd4b-3ced-42ac-b14b-ed10e01dc319.fullname" . }}
  labels:
    {{- include "go-echo785dcd4b-3ced-42ac-b14b-ed10e01dc319.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo785dcd4b-3ced-42ac-b14b-ed10e01dc319.selectorLabels" . | nindent 6 }}
