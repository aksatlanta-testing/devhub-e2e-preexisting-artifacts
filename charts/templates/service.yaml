apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3d63eb7-80c4-4bbd-84fd-9a1c9d6a308e.fullname" . }}
  labels:
    {{- include "go-echoe3d63eb7-80c4-4bbd-84fd-9a1c9d6a308e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3d63eb7-80c4-4bbd-84fd-9a1c9d6a308e.selectorLabels" . | nindent 6 }}
