apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7951faf-f486-4a0d-852f-15982c2e0804.fullname" . }}
  labels:
    {{- include "go-echob7951faf-f486-4a0d-852f-15982c2e0804.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7951faf-f486-4a0d-852f-15982c2e0804.selectorLabels" . | nindent 6 }}
