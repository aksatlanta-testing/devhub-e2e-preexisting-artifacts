apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b67a135-53f5-4bac-9357-981d15b6b7cb.fullname" . }}
  labels:
    {{- include "go-echo4b67a135-53f5-4bac-9357-981d15b6b7cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b67a135-53f5-4bac-9357-981d15b6b7cb.selectorLabels" . | nindent 6 }}
