apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05abad83-4322-49b1-90d2-518aa3147236.fullname" . }}
  labels:
    {{- include "go-echo05abad83-4322-49b1-90d2-518aa3147236.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05abad83-4322-49b1-90d2-518aa3147236.selectorLabels" . | nindent 6 }}
