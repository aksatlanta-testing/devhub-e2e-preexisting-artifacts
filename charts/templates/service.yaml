apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo981049bd-da37-4f12-ae05-ef326fbe0ab3.fullname" . }}
  labels:
    {{- include "go-echo981049bd-da37-4f12-ae05-ef326fbe0ab3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo981049bd-da37-4f12-ae05-ef326fbe0ab3.selectorLabels" . | nindent 6 }}
