apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo183c33a9-54d6-4b55-9a5d-fbf689af4262.fullname" . }}
  labels:
    {{- include "go-echo183c33a9-54d6-4b55-9a5d-fbf689af4262.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo183c33a9-54d6-4b55-9a5d-fbf689af4262.selectorLabels" . | nindent 6 }}
