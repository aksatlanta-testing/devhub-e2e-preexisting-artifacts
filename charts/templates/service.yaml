apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff6441d0-5190-4936-aaca-3f1e2e025701.fullname" . }}
  labels:
    {{- include "go-echoff6441d0-5190-4936-aaca-3f1e2e025701.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff6441d0-5190-4936-aaca-3f1e2e025701.selectorLabels" . | nindent 6 }}
