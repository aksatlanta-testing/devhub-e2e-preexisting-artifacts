apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73b69796-4d07-4ce5-bfa6-450f541d16c9.fullname" . }}
  labels:
    {{- include "go-echo73b69796-4d07-4ce5-bfa6-450f541d16c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73b69796-4d07-4ce5-bfa6-450f541d16c9.selectorLabels" . | nindent 6 }}
