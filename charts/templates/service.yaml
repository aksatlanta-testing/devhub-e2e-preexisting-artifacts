apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5a41104-6fdc-4e2d-b7f7-f243efc1d3c6.fullname" . }}
  labels:
    {{- include "go-echoe5a41104-6fdc-4e2d-b7f7-f243efc1d3c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5a41104-6fdc-4e2d-b7f7-f243efc1d3c6.selectorLabels" . | nindent 6 }}
