apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e9fb4e8-6bc8-40f7-8709-910d96cb4134.fullname" . }}
  labels:
    {{- include "go-echo5e9fb4e8-6bc8-40f7-8709-910d96cb4134.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e9fb4e8-6bc8-40f7-8709-910d96cb4134.selectorLabels" . | nindent 6 }}
