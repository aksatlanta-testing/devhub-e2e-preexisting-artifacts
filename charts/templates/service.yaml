apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo977aa3c6-677a-43b8-af45-b6cf91a9a37e.fullname" . }}
  labels:
    {{- include "go-echo977aa3c6-677a-43b8-af45-b6cf91a9a37e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo977aa3c6-677a-43b8-af45-b6cf91a9a37e.selectorLabels" . | nindent 6 }}
