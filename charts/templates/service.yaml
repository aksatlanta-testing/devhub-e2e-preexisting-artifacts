apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa0444c5f-437b-4343-8e4b-bbfec850a8a3.fullname" . }}
  labels:
    {{- include "go-echoa0444c5f-437b-4343-8e4b-bbfec850a8a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa0444c5f-437b-4343-8e4b-bbfec850a8a3.selectorLabels" . | nindent 6 }}
