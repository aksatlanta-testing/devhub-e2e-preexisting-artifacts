apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24db0771-748c-4051-bdc7-8560e6222ebd.fullname" . }}
  labels:
    {{- include "go-echo24db0771-748c-4051-bdc7-8560e6222ebd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24db0771-748c-4051-bdc7-8560e6222ebd.selectorLabels" . | nindent 6 }}
