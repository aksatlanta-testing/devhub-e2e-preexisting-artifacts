apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba278ba3-66ee-414e-adfb-846bea8fc273.fullname" . }}
  labels:
    {{- include "go-echoba278ba3-66ee-414e-adfb-846bea8fc273.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba278ba3-66ee-414e-adfb-846bea8fc273.selectorLabels" . | nindent 6 }}
