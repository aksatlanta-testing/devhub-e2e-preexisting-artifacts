apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1def2742-d899-424a-8017-ecc2b7bf4c20.fullname" . }}
  labels:
    {{- include "go-echo1def2742-d899-424a-8017-ecc2b7bf4c20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1def2742-d899-424a-8017-ecc2b7bf4c20.selectorLabels" . | nindent 6 }}
