apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f6ad861-7472-476a-a0ec-eaecf92a7468.fullname" . }}
  labels:
    {{- include "go-echo3f6ad861-7472-476a-a0ec-eaecf92a7468.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f6ad861-7472-476a-a0ec-eaecf92a7468.selectorLabels" . | nindent 6 }}
