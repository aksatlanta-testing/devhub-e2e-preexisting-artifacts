apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafb89047-6e75-4164-a571-7f30a8be882e.fullname" . }}
  labels:
    {{- include "go-echoafb89047-6e75-4164-a571-7f30a8be882e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafb89047-6e75-4164-a571-7f30a8be882e.selectorLabels" . | nindent 6 }}
