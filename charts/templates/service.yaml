apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo239c22da-0a0f-41b9-8f2e-a41fb6aed8ea.fullname" . }}
  labels:
    {{- include "go-echo239c22da-0a0f-41b9-8f2e-a41fb6aed8ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo239c22da-0a0f-41b9-8f2e-a41fb6aed8ea.selectorLabels" . | nindent 6 }}
