apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49fb39c0-f841-423c-a93a-eacab72a2d75.fullname" . }}
  labels:
    {{- include "go-echo49fb39c0-f841-423c-a93a-eacab72a2d75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49fb39c0-f841-423c-a93a-eacab72a2d75.selectorLabels" . | nindent 6 }}
