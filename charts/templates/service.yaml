apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a8f93be-eaf0-452e-b49f-94bf6533703a.fullname" . }}
  labels:
    {{- include "go-echo8a8f93be-eaf0-452e-b49f-94bf6533703a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a8f93be-eaf0-452e-b49f-94bf6533703a.selectorLabels" . | nindent 6 }}
