apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29db0463-df8a-4f1b-98eb-7e40c72cb6c7.fullname" . }}
  labels:
    {{- include "go-echo29db0463-df8a-4f1b-98eb-7e40c72cb6c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29db0463-df8a-4f1b-98eb-7e40c72cb6c7.selectorLabels" . | nindent 6 }}
