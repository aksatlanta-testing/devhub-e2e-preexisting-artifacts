apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55b50136-dea0-4ca7-a5d3-70cdc59013eb.fullname" . }}
  labels:
    {{- include "go-echo55b50136-dea0-4ca7-a5d3-70cdc59013eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55b50136-dea0-4ca7-a5d3-70cdc59013eb.selectorLabels" . | nindent 6 }}
