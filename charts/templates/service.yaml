apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocee9ac2f-a02f-4dc7-a484-f12383d97042.fullname" . }}
  labels:
    {{- include "go-echocee9ac2f-a02f-4dc7-a484-f12383d97042.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocee9ac2f-a02f-4dc7-a484-f12383d97042.selectorLabels" . | nindent 6 }}
