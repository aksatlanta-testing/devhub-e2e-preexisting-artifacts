apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63d2798f-966d-42f0-a8c1-16b8a3738c38.fullname" . }}
  labels:
    {{- include "go-echo63d2798f-966d-42f0-a8c1-16b8a3738c38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63d2798f-966d-42f0-a8c1-16b8a3738c38.selectorLabels" . | nindent 6 }}
