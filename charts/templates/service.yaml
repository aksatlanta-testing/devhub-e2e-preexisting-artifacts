apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo209fc18a-33be-4e2c-97c3-2701d6fd6231.fullname" . }}
  labels:
    {{- include "go-echo209fc18a-33be-4e2c-97c3-2701d6fd6231.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo209fc18a-33be-4e2c-97c3-2701d6fd6231.selectorLabels" . | nindent 6 }}
