apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d509c69-abc6-4f93-acf8-7db1dcc40ed0.fullname" . }}
  labels:
    {{- include "go-echo4d509c69-abc6-4f93-acf8-7db1dcc40ed0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d509c69-abc6-4f93-acf8-7db1dcc40ed0.selectorLabels" . | nindent 6 }}
