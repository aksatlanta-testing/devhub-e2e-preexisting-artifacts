apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa648b5c0-7e84-44fc-a257-35d35894f7bd.fullname" . }}
  labels:
    {{- include "go-echoa648b5c0-7e84-44fc-a257-35d35894f7bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa648b5c0-7e84-44fc-a257-35d35894f7bd.selectorLabels" . | nindent 6 }}
