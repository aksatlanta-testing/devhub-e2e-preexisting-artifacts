apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec619f6b-2667-4673-adb7-1531d32cf7e7.fullname" . }}
  labels:
    {{- include "go-echoec619f6b-2667-4673-adb7-1531d32cf7e7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec619f6b-2667-4673-adb7-1531d32cf7e7.selectorLabels" . | nindent 6 }}
