apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90f404c4-13db-44a7-83fc-4fca775670a3.fullname" . }}
  labels:
    {{- include "go-echo90f404c4-13db-44a7-83fc-4fca775670a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90f404c4-13db-44a7-83fc-4fca775670a3.selectorLabels" . | nindent 6 }}
