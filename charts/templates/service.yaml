apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc617ddcb-2c77-4799-addd-78607cf79be5.fullname" . }}
  labels:
    {{- include "go-echoc617ddcb-2c77-4799-addd-78607cf79be5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc617ddcb-2c77-4799-addd-78607cf79be5.selectorLabels" . | nindent 6 }}
