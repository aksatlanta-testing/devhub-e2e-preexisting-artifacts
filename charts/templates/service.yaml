apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33827758-10c0-43bb-a15a-7a585e38d33c.fullname" . }}
  labels:
    {{- include "go-echo33827758-10c0-43bb-a15a-7a585e38d33c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33827758-10c0-43bb-a15a-7a585e38d33c.selectorLabels" . | nindent 6 }}
