apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa989e343-4184-4768-a4f3-ffb29e2d3da8.fullname" . }}
  labels:
    {{- include "go-echoa989e343-4184-4768-a4f3-ffb29e2d3da8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa989e343-4184-4768-a4f3-ffb29e2d3da8.selectorLabels" . | nindent 6 }}
