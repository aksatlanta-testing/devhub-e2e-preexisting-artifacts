apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41acc26c-e10b-41ee-9ea6-544a919f86e7.fullname" . }}
  labels:
    {{- include "go-echo41acc26c-e10b-41ee-9ea6-544a919f86e7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41acc26c-e10b-41ee-9ea6-544a919f86e7.selectorLabels" . | nindent 6 }}
