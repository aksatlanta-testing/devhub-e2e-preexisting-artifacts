apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95bbabff-c2c3-4ef8-9da3-985d6e6ba811.fullname" . }}
  labels:
    {{- include "go-echo95bbabff-c2c3-4ef8-9da3-985d6e6ba811.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95bbabff-c2c3-4ef8-9da3-985d6e6ba811.selectorLabels" . | nindent 6 }}
