apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo602fd3b2-1acf-4bde-aa1a-c547062ce039.fullname" . }}
  labels:
    {{- include "go-echo602fd3b2-1acf-4bde-aa1a-c547062ce039.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo602fd3b2-1acf-4bde-aa1a-c547062ce039.selectorLabels" . | nindent 6 }}
