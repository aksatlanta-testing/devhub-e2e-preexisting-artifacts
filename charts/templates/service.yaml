apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61050bef-6f9e-4c29-a3a9-7a3626026fd5.fullname" . }}
  labels:
    {{- include "go-echo61050bef-6f9e-4c29-a3a9-7a3626026fd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61050bef-6f9e-4c29-a3a9-7a3626026fd5.selectorLabels" . | nindent 6 }}
