apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo585fa711-830f-48ab-9a9f-e8ae1318f6b8.fullname" . }}
  labels:
    {{- include "go-echo585fa711-830f-48ab-9a9f-e8ae1318f6b8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo585fa711-830f-48ab-9a9f-e8ae1318f6b8.selectorLabels" . | nindent 6 }}
