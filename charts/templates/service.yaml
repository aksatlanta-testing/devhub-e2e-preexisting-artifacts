apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2cd59bc2-042e-4ca6-8281-36a72518ffec.fullname" . }}
  labels:
    {{- include "go-echo2cd59bc2-042e-4ca6-8281-36a72518ffec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2cd59bc2-042e-4ca6-8281-36a72518ffec.selectorLabels" . | nindent 6 }}
