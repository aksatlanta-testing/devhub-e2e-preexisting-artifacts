apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b4691ba-9195-47a7-b100-4e7644efb60e.fullname" . }}
  labels:
    {{- include "go-echo1b4691ba-9195-47a7-b100-4e7644efb60e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b4691ba-9195-47a7-b100-4e7644efb60e.selectorLabels" . | nindent 6 }}
