apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f7da0b1-da15-4328-a8f3-2d1e0022f88e.fullname" . }}
  labels:
    {{- include "go-echo1f7da0b1-da15-4328-a8f3-2d1e0022f88e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f7da0b1-da15-4328-a8f3-2d1e0022f88e.selectorLabels" . | nindent 6 }}
