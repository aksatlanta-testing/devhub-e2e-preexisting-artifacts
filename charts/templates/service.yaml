apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo987ec224-9a4d-43ea-afd7-3f16e8700616.fullname" . }}
  labels:
    {{- include "go-echo987ec224-9a4d-43ea-afd7-3f16e8700616.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo987ec224-9a4d-43ea-afd7-3f16e8700616.selectorLabels" . | nindent 6 }}
