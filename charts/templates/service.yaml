apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod19013ad-853b-466c-8706-972ca48edeb1.fullname" . }}
  labels:
    {{- include "go-echod19013ad-853b-466c-8706-972ca48edeb1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod19013ad-853b-466c-8706-972ca48edeb1.selectorLabels" . | nindent 6 }}
