apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo883093fc-6526-476f-978e-c27f5025f21f.fullname" . }}
  labels:
    {{- include "go-echo883093fc-6526-476f-978e-c27f5025f21f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo883093fc-6526-476f-978e-c27f5025f21f.selectorLabels" . | nindent 6 }}
