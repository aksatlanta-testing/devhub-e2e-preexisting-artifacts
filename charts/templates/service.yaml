apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe761cf06-c902-4ae8-99dd-104b53cd9937.fullname" . }}
  labels:
    {{- include "go-echoe761cf06-c902-4ae8-99dd-104b53cd9937.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe761cf06-c902-4ae8-99dd-104b53cd9937.selectorLabels" . | nindent 6 }}
