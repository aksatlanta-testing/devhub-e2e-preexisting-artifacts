apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb088a6e-754d-40b6-92be-f7d4de2b0524.fullname" . }}
  labels:
    {{- include "go-echobb088a6e-754d-40b6-92be-f7d4de2b0524.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb088a6e-754d-40b6-92be-f7d4de2b0524.selectorLabels" . | nindent 6 }}
