apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo452c6421-654f-4ee1-9619-75d473c94de8.fullname" . }}
  labels:
    {{- include "go-echo452c6421-654f-4ee1-9619-75d473c94de8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo452c6421-654f-4ee1-9619-75d473c94de8.selectorLabels" . | nindent 6 }}
