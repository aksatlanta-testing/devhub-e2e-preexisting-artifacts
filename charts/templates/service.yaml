apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod305dbdf-bebd-47f4-b003-9349dbf5c318.fullname" . }}
  labels:
    {{- include "go-echod305dbdf-bebd-47f4-b003-9349dbf5c318.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod305dbdf-bebd-47f4-b003-9349dbf5c318.selectorLabels" . | nindent 6 }}
