apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob932ff3c-a566-41e9-ae3e-2afe6b0dbeb6.fullname" . }}
  labels:
    {{- include "go-echob932ff3c-a566-41e9-ae3e-2afe6b0dbeb6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob932ff3c-a566-41e9-ae3e-2afe6b0dbeb6.selectorLabels" . | nindent 6 }}
