apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd65acaa-eac9-4ad5-a433-2274f0065e35.fullname" . }}
  labels:
    {{- include "go-echobd65acaa-eac9-4ad5-a433-2274f0065e35.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd65acaa-eac9-4ad5-a433-2274f0065e35.selectorLabels" . | nindent 6 }}
