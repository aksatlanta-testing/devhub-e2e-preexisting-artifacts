apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe596a93e-fdab-4916-b1ec-dd7f1d789af8.fullname" . }}
  labels:
    {{- include "go-echoe596a93e-fdab-4916-b1ec-dd7f1d789af8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe596a93e-fdab-4916-b1ec-dd7f1d789af8.selectorLabels" . | nindent 6 }}
