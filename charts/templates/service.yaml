apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo110f8750-8106-4ee0-b81a-b3a6905965cf.fullname" . }}
  labels:
    {{- include "go-echo110f8750-8106-4ee0-b81a-b3a6905965cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo110f8750-8106-4ee0-b81a-b3a6905965cf.selectorLabels" . | nindent 6 }}
