apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c22b4bf-d47f-4cad-8dfc-36d408ef8398.fullname" . }}
  labels:
    {{- include "go-echo1c22b4bf-d47f-4cad-8dfc-36d408ef8398.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c22b4bf-d47f-4cad-8dfc-36d408ef8398.selectorLabels" . | nindent 6 }}
