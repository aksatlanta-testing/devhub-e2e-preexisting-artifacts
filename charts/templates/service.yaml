apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0646a383-53ef-4f62-9e72-0a8c5a3d0160.fullname" . }}
  labels:
    {{- include "go-echo0646a383-53ef-4f62-9e72-0a8c5a3d0160.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0646a383-53ef-4f62-9e72-0a8c5a3d0160.selectorLabels" . | nindent 6 }}
