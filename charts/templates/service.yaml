apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed814044-22fe-4779-8544-640912b66732.fullname" . }}
  labels:
    {{- include "go-echoed814044-22fe-4779-8544-640912b66732.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed814044-22fe-4779-8544-640912b66732.selectorLabels" . | nindent 6 }}
