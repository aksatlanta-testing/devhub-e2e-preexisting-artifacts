apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48dac6f0-5c75-45a5-aab6-e47c78b0f76e.fullname" . }}
  labels:
    {{- include "go-echo48dac6f0-5c75-45a5-aab6-e47c78b0f76e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48dac6f0-5c75-45a5-aab6-e47c78b0f76e.selectorLabels" . | nindent 6 }}
