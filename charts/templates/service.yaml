apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ef93667-d340-4458-9c6c-8adec983f190.fullname" . }}
  labels:
    {{- include "go-echo9ef93667-d340-4458-9c6c-8adec983f190.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ef93667-d340-4458-9c6c-8adec983f190.selectorLabels" . | nindent 6 }}
