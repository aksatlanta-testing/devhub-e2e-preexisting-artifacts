apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo317022d1-227d-4b1f-a0b7-94e24146563e.fullname" . }}
  labels:
    {{- include "go-echo317022d1-227d-4b1f-a0b7-94e24146563e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo317022d1-227d-4b1f-a0b7-94e24146563e.selectorLabels" . | nindent 6 }}
