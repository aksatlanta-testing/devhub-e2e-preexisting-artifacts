apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69c3a212-1996-43b0-a87c-986ff4eec9c5.fullname" . }}
  labels:
    {{- include "go-echo69c3a212-1996-43b0-a87c-986ff4eec9c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69c3a212-1996-43b0-a87c-986ff4eec9c5.selectorLabels" . | nindent 6 }}
