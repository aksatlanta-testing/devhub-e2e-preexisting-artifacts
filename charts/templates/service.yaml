apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo263e242c-4583-47fb-aa5e-b64a60bb7522.fullname" . }}
  labels:
    {{- include "go-echo263e242c-4583-47fb-aa5e-b64a60bb7522.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo263e242c-4583-47fb-aa5e-b64a60bb7522.selectorLabels" . | nindent 6 }}
