apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaaf05793-abdf-4a30-bb85-19ac504c2ee6.fullname" . }}
  labels:
    {{- include "go-echoaaf05793-abdf-4a30-bb85-19ac504c2ee6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaaf05793-abdf-4a30-bb85-19ac504c2ee6.selectorLabels" . | nindent 6 }}
