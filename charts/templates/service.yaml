apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32307d59-7c2b-4450-a2c9-4cdcb0fb9902.fullname" . }}
  labels:
    {{- include "go-echo32307d59-7c2b-4450-a2c9-4cdcb0fb9902.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32307d59-7c2b-4450-a2c9-4cdcb0fb9902.selectorLabels" . | nindent 6 }}
