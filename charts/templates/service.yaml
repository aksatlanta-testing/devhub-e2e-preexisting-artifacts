apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9bec7bf-7a72-4a9e-b6d3-72aa2e085078.fullname" . }}
  labels:
    {{- include "go-echob9bec7bf-7a72-4a9e-b6d3-72aa2e085078.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9bec7bf-7a72-4a9e-b6d3-72aa2e085078.selectorLabels" . | nindent 6 }}
