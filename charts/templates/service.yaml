apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46b08bd8-6e59-4887-90d0-15a8d8c0598e.fullname" . }}
  labels:
    {{- include "go-echo46b08bd8-6e59-4887-90d0-15a8d8c0598e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46b08bd8-6e59-4887-90d0-15a8d8c0598e.selectorLabels" . | nindent 6 }}
