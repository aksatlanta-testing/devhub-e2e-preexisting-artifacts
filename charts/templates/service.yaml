apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6bec14be-51ab-4d61-913b-7aa6b9250dad.fullname" . }}
  labels:
    {{- include "go-echo6bec14be-51ab-4d61-913b-7aa6b9250dad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6bec14be-51ab-4d61-913b-7aa6b9250dad.selectorLabels" . | nindent 6 }}
