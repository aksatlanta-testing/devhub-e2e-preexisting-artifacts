apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fb6ebe0-9690-47c4-b1d8-341a95ca0b98.fullname" . }}
  labels:
    {{- include "go-echo5fb6ebe0-9690-47c4-b1d8-341a95ca0b98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fb6ebe0-9690-47c4-b1d8-341a95ca0b98.selectorLabels" . | nindent 6 }}
