apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoceab991e-d701-4faa-ab30-f92c229675af.fullname" . }}
  labels:
    {{- include "go-echoceab991e-d701-4faa-ab30-f92c229675af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoceab991e-d701-4faa-ab30-f92c229675af.selectorLabels" . | nindent 6 }}
