apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5dfe88a8-d7f3-4e4e-985e-aa7fffe5f7bf.fullname" . }}
  labels:
    {{- include "go-echo5dfe88a8-d7f3-4e4e-985e-aa7fffe5f7bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5dfe88a8-d7f3-4e4e-985e-aa7fffe5f7bf.selectorLabels" . | nindent 6 }}
