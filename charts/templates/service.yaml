apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2931c790-8dff-4b1b-8ffd-3f96cac49519.fullname" . }}
  labels:
    {{- include "go-echo2931c790-8dff-4b1b-8ffd-3f96cac49519.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2931c790-8dff-4b1b-8ffd-3f96cac49519.selectorLabels" . | nindent 6 }}
