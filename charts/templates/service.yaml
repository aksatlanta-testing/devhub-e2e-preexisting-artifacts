apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ae97639-181c-459a-a819-b2cdf7a80feb.fullname" . }}
  labels:
    {{- include "go-echo8ae97639-181c-459a-a819-b2cdf7a80feb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ae97639-181c-459a-a819-b2cdf7a80feb.selectorLabels" . | nindent 6 }}
