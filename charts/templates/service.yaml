apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4c1c939-e4a9-4af2-b918-4e2d690967ba.fullname" . }}
  labels:
    {{- include "go-echoa4c1c939-e4a9-4af2-b918-4e2d690967ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4c1c939-e4a9-4af2-b918-4e2d690967ba.selectorLabels" . | nindent 6 }}
