apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5d7ae99-6ffa-4a4c-a81a-e1cf4ba6cfa0.fullname" . }}
  labels:
    {{- include "go-echob5d7ae99-6ffa-4a4c-a81a-e1cf4ba6cfa0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5d7ae99-6ffa-4a4c-a81a-e1cf4ba6cfa0.selectorLabels" . | nindent 6 }}
