apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b9b0d06-7ba0-4bfc-9eb2-503170ec43df.fullname" . }}
  labels:
    {{- include "go-echo9b9b0d06-7ba0-4bfc-9eb2-503170ec43df.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b9b0d06-7ba0-4bfc-9eb2-503170ec43df.selectorLabels" . | nindent 6 }}
