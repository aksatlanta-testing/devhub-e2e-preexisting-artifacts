apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb89fed6-7e16-4892-af82-409eb4294d07.fullname" . }}
  labels:
    {{- include "go-echocb89fed6-7e16-4892-af82-409eb4294d07.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb89fed6-7e16-4892-af82-409eb4294d07.selectorLabels" . | nindent 6 }}
