apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68e2cd2f-3b3f-41dd-b57c-3b425eb6f305.fullname" . }}
  labels:
    {{- include "go-echo68e2cd2f-3b3f-41dd-b57c-3b425eb6f305.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68e2cd2f-3b3f-41dd-b57c-3b425eb6f305.selectorLabels" . | nindent 6 }}
