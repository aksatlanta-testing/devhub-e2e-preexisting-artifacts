apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4620ff39-5820-4051-9f7d-6d7509155904.fullname" . }}
  labels:
    {{- include "go-echo4620ff39-5820-4051-9f7d-6d7509155904.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4620ff39-5820-4051-9f7d-6d7509155904.selectorLabels" . | nindent 6 }}
