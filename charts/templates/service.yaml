apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo044524e7-90ea-44c9-ad42-bb49e856c266.fullname" . }}
  labels:
    {{- include "go-echo044524e7-90ea-44c9-ad42-bb49e856c266.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo044524e7-90ea-44c9-ad42-bb49e856c266.selectorLabels" . | nindent 6 }}
