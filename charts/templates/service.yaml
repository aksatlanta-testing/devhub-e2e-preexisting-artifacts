apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d9b25e0-9be0-4c6f-b839-696d781f56bc.fullname" . }}
  labels:
    {{- include "go-echo8d9b25e0-9be0-4c6f-b839-696d781f56bc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d9b25e0-9be0-4c6f-b839-696d781f56bc.selectorLabels" . | nindent 6 }}
