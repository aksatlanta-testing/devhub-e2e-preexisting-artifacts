apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo368f69cb-e9fd-4b0d-996d-5172cfb176e0.fullname" . }}
  labels:
    {{- include "go-echo368f69cb-e9fd-4b0d-996d-5172cfb176e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo368f69cb-e9fd-4b0d-996d-5172cfb176e0.selectorLabels" . | nindent 6 }}
