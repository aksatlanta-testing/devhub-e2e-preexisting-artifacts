apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo914ba046-6143-41c9-b23e-d6a97efb5956.fullname" . }}
  labels:
    {{- include "go-echo914ba046-6143-41c9-b23e-d6a97efb5956.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo914ba046-6143-41c9-b23e-d6a97efb5956.selectorLabels" . | nindent 6 }}
