apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo338c08bb-9b58-4f80-aa37-70086d6c4c9f.fullname" . }}
  labels:
    {{- include "go-echo338c08bb-9b58-4f80-aa37-70086d6c4c9f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo338c08bb-9b58-4f80-aa37-70086d6c4c9f.selectorLabels" . | nindent 6 }}
