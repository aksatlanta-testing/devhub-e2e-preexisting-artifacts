apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf74a9ab-4418-4b03-ad82-72f467666699.fullname" . }}
  labels:
    {{- include "go-echobf74a9ab-4418-4b03-ad82-72f467666699.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf74a9ab-4418-4b03-ad82-72f467666699.selectorLabels" . | nindent 6 }}
