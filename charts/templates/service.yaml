apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b11385c-9962-418f-99af-aaeb48a0940e.fullname" . }}
  labels:
    {{- include "go-echo6b11385c-9962-418f-99af-aaeb48a0940e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b11385c-9962-418f-99af-aaeb48a0940e.selectorLabels" . | nindent 6 }}
