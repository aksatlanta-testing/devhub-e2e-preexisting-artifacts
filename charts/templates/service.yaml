apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe41a1b43-8440-4b44-a94e-87468fa0c22c.fullname" . }}
  labels:
    {{- include "go-echoe41a1b43-8440-4b44-a94e-87468fa0c22c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe41a1b43-8440-4b44-a94e-87468fa0c22c.selectorLabels" . | nindent 6 }}
