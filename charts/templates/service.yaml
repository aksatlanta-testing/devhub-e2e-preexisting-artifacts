apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54eeb97d-1874-4e9e-a71b-177596716c0e.fullname" . }}
  labels:
    {{- include "go-echo54eeb97d-1874-4e9e-a71b-177596716c0e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54eeb97d-1874-4e9e-a71b-177596716c0e.selectorLabels" . | nindent 6 }}
