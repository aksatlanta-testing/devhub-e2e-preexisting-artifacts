apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3703117d-2352-49e8-a09c-9f850d2d8260.fullname" . }}
  labels:
    {{- include "go-echo3703117d-2352-49e8-a09c-9f850d2d8260.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3703117d-2352-49e8-a09c-9f850d2d8260.selectorLabels" . | nindent 6 }}
