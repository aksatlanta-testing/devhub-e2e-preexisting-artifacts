apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92795570-42a4-4b97-a956-d5989979e28e.fullname" . }}
  labels:
    {{- include "go-echo92795570-42a4-4b97-a956-d5989979e28e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92795570-42a4-4b97-a956-d5989979e28e.selectorLabels" . | nindent 6 }}
