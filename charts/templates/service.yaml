apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b95e0d6-5b9e-4214-9ff3-a6c6fcd62043.fullname" . }}
  labels:
    {{- include "go-echo5b95e0d6-5b9e-4214-9ff3-a6c6fcd62043.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b95e0d6-5b9e-4214-9ff3-a6c6fcd62043.selectorLabels" . | nindent 6 }}
