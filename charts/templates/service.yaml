apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocece1a03-0905-4dc9-bab0-f6ed040cce8a.fullname" . }}
  labels:
    {{- include "go-echocece1a03-0905-4dc9-bab0-f6ed040cce8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocece1a03-0905-4dc9-bab0-f6ed040cce8a.selectorLabels" . | nindent 6 }}
