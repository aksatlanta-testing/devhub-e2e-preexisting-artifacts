apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc423f14-53a9-4635-990b-0fdfa42e3907.fullname" . }}
  labels:
    {{- include "go-echofc423f14-53a9-4635-990b-0fdfa42e3907.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc423f14-53a9-4635-990b-0fdfa42e3907.selectorLabels" . | nindent 6 }}
