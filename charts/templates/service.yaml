apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof3dd17b0-25bd-42f1-be67-804c6a3317cb.fullname" . }}
  labels:
    {{- include "go-echof3dd17b0-25bd-42f1-be67-804c6a3317cb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof3dd17b0-25bd-42f1-be67-804c6a3317cb.selectorLabels" . | nindent 6 }}
