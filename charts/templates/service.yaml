apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8039714-f123-492d-a296-fc2838b40b31.fullname" . }}
  labels:
    {{- include "go-echoc8039714-f123-492d-a296-fc2838b40b31.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8039714-f123-492d-a296-fc2838b40b31.selectorLabels" . | nindent 6 }}
