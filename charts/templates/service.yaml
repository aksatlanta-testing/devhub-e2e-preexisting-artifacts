apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46dcdbea-d4a5-45e3-8004-727dfcd66caf.fullname" . }}
  labels:
    {{- include "go-echo46dcdbea-d4a5-45e3-8004-727dfcd66caf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46dcdbea-d4a5-45e3-8004-727dfcd66caf.selectorLabels" . | nindent 6 }}
