apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe40c16a5-0539-4906-bac1-6b7793ab99b7.fullname" . }}
  labels:
    {{- include "go-echoe40c16a5-0539-4906-bac1-6b7793ab99b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe40c16a5-0539-4906-bac1-6b7793ab99b7.selectorLabels" . | nindent 6 }}
