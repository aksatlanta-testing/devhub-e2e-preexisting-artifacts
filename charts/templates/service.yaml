apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79821650-4ed5-45be-b03e-a3cf467aea61.fullname" . }}
  labels:
    {{- include "go-echo79821650-4ed5-45be-b03e-a3cf467aea61.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79821650-4ed5-45be-b03e-a3cf467aea61.selectorLabels" . | nindent 6 }}
