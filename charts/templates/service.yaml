apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8f496c5-ce59-403a-8703-a6c24d2ca940.fullname" . }}
  labels:
    {{- include "go-echob8f496c5-ce59-403a-8703-a6c24d2ca940.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8f496c5-ce59-403a-8703-a6c24d2ca940.selectorLabels" . | nindent 6 }}
