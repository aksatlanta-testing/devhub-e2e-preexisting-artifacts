apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo695a0126-45e7-4520-a03e-4d08cf0c9692.fullname" . }}
  labels:
    {{- include "go-echo695a0126-45e7-4520-a03e-4d08cf0c9692.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo695a0126-45e7-4520-a03e-4d08cf0c9692.selectorLabels" . | nindent 6 }}
