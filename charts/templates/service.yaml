apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74e30406-ac03-4640-adcf-838652fd8110.fullname" . }}
  labels:
    {{- include "go-echo74e30406-ac03-4640-adcf-838652fd8110.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74e30406-ac03-4640-adcf-838652fd8110.selectorLabels" . | nindent 6 }}
