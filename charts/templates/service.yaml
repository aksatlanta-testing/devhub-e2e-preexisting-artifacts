apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob352d9f1-1716-4a1c-88eb-964994156322.fullname" . }}
  labels:
    {{- include "go-echob352d9f1-1716-4a1c-88eb-964994156322.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob352d9f1-1716-4a1c-88eb-964994156322.selectorLabels" . | nindent 6 }}
