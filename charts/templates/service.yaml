apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4019f48-f409-479e-b35b-a6b77204f697.fullname" . }}
  labels:
    {{- include "go-echoc4019f48-f409-479e-b35b-a6b77204f697.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4019f48-f409-479e-b35b-a6b77204f697.selectorLabels" . | nindent 6 }}
