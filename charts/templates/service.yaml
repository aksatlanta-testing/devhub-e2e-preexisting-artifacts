apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa950d486-c5db-4c81-80fa-86c76cff003c.fullname" . }}
  labels:
    {{- include "go-echoa950d486-c5db-4c81-80fa-86c76cff003c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa950d486-c5db-4c81-80fa-86c76cff003c.selectorLabels" . | nindent 6 }}
