apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7cecdb6-8525-4c41-8acd-aa7de4eb064d.fullname" . }}
  labels:
    {{- include "go-echof7cecdb6-8525-4c41-8acd-aa7de4eb064d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7cecdb6-8525-4c41-8acd-aa7de4eb064d.selectorLabels" . | nindent 6 }}
