apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fa0641c-dcc2-4fa4-886c-5a14a817c514.fullname" . }}
  labels:
    {{- include "go-echo5fa0641c-dcc2-4fa4-886c-5a14a817c514.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fa0641c-dcc2-4fa4-886c-5a14a817c514.selectorLabels" . | nindent 6 }}
