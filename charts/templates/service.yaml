apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08d678a8-8bac-4fcd-9c6e-90617cb69deb.fullname" . }}
  labels:
    {{- include "go-echo08d678a8-8bac-4fcd-9c6e-90617cb69deb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08d678a8-8bac-4fcd-9c6e-90617cb69deb.selectorLabels" . | nindent 6 }}
