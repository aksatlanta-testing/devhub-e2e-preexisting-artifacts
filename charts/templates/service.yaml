apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3c34da1-5db2-44fb-8b35-da57e9ab2179.fullname" . }}
  labels:
    {{- include "go-echoc3c34da1-5db2-44fb-8b35-da57e9ab2179.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3c34da1-5db2-44fb-8b35-da57e9ab2179.selectorLabels" . | nindent 6 }}
