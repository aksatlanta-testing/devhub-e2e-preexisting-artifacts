apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo780163d0-f43d-4e9e-b3c7-06cfbac5ddbe.fullname" . }}
  labels:
    {{- include "go-echo780163d0-f43d-4e9e-b3c7-06cfbac5ddbe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo780163d0-f43d-4e9e-b3c7-06cfbac5ddbe.selectorLabels" . | nindent 6 }}
