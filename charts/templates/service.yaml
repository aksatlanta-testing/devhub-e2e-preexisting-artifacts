apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32985db0-1aa3-4cd1-bb9e-2a94bf2aaa66.fullname" . }}
  labels:
    {{- include "go-echo32985db0-1aa3-4cd1-bb9e-2a94bf2aaa66.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32985db0-1aa3-4cd1-bb9e-2a94bf2aaa66.selectorLabels" . | nindent 6 }}
