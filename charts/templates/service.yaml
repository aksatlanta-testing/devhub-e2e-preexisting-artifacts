apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5261efda-be0a-4f8d-a65a-441576b23e9f.fullname" . }}
  labels:
    {{- include "go-echo5261efda-be0a-4f8d-a65a-441576b23e9f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5261efda-be0a-4f8d-a65a-441576b23e9f.selectorLabels" . | nindent 6 }}
