apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41eadad8-6f2e-433b-80be-9b67803ec92a.fullname" . }}
  labels:
    {{- include "go-echo41eadad8-6f2e-433b-80be-9b67803ec92a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41eadad8-6f2e-433b-80be-9b67803ec92a.selectorLabels" . | nindent 6 }}
