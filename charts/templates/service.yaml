apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc3dbd20-aba7-4f5e-b327-4e14f855df2b.fullname" . }}
  labels:
    {{- include "go-echodc3dbd20-aba7-4f5e-b327-4e14f855df2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc3dbd20-aba7-4f5e-b327-4e14f855df2b.selectorLabels" . | nindent 6 }}
