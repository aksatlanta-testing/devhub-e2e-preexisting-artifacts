apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62a493e4-96f9-4b9f-80f5-a4b75f8d69bf.fullname" . }}
  labels:
    {{- include "go-echo62a493e4-96f9-4b9f-80f5-a4b75f8d69bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62a493e4-96f9-4b9f-80f5-a4b75f8d69bf.selectorLabels" . | nindent 6 }}
