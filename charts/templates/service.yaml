apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6391df4e-d5ec-42ef-b1fc-2938989fb78a.fullname" . }}
  labels:
    {{- include "go-echo6391df4e-d5ec-42ef-b1fc-2938989fb78a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6391df4e-d5ec-42ef-b1fc-2938989fb78a.selectorLabels" . | nindent 6 }}
