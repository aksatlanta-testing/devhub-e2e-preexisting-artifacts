apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1eee7cfc-c537-4480-adaf-08a21f2eef69.fullname" . }}
  labels:
    {{- include "go-echo1eee7cfc-c537-4480-adaf-08a21f2eef69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1eee7cfc-c537-4480-adaf-08a21f2eef69.selectorLabels" . | nindent 6 }}
