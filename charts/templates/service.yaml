apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof90a158c-8191-43fa-8ea1-f27ed693e765.fullname" . }}
  labels:
    {{- include "go-echof90a158c-8191-43fa-8ea1-f27ed693e765.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof90a158c-8191-43fa-8ea1-f27ed693e765.selectorLabels" . | nindent 6 }}
