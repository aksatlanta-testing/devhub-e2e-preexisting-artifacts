apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64c3a5e9-98e2-4d76-8573-1a1a5e74bd1f.fullname" . }}
  labels:
    {{- include "go-echo64c3a5e9-98e2-4d76-8573-1a1a5e74bd1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64c3a5e9-98e2-4d76-8573-1a1a5e74bd1f.selectorLabels" . | nindent 6 }}
