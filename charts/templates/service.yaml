apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof361a7fc-8914-41e6-a51f-36956b245a96.fullname" . }}
  labels:
    {{- include "go-echof361a7fc-8914-41e6-a51f-36956b245a96.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof361a7fc-8914-41e6-a51f-36956b245a96.selectorLabels" . | nindent 6 }}
