apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc991f372-b484-4742-acfe-f62d73299522.fullname" . }}
  labels:
    {{- include "go-echoc991f372-b484-4742-acfe-f62d73299522.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc991f372-b484-4742-acfe-f62d73299522.selectorLabels" . | nindent 6 }}
