apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47c291df-e526-47f5-b76f-58be11efe96f.fullname" . }}
  labels:
    {{- include "go-echo47c291df-e526-47f5-b76f-58be11efe96f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47c291df-e526-47f5-b76f-58be11efe96f.selectorLabels" . | nindent 6 }}
