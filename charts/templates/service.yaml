apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cd36c94-33e6-47da-bb54-9b908a2dbbc7.fullname" . }}
  labels:
    {{- include "go-echo5cd36c94-33e6-47da-bb54-9b908a2dbbc7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cd36c94-33e6-47da-bb54-9b908a2dbbc7.selectorLabels" . | nindent 6 }}
