apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe96f9cc2-8edf-4956-87cb-eccb1bf9289c.fullname" . }}
  labels:
    {{- include "go-echoe96f9cc2-8edf-4956-87cb-eccb1bf9289c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe96f9cc2-8edf-4956-87cb-eccb1bf9289c.selectorLabels" . | nindent 6 }}
