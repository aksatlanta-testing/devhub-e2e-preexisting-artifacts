apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0110d21e-070f-4da7-8a24-ad821bd3e5f9.fullname" . }}
  labels:
    {{- include "go-echo0110d21e-070f-4da7-8a24-ad821bd3e5f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0110d21e-070f-4da7-8a24-ad821bd3e5f9.selectorLabels" . | nindent 6 }}
