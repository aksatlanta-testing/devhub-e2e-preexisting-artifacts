apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo080afdd4-530d-4d5f-be57-58a3acf1a1bb.fullname" . }}
  labels:
    {{- include "go-echo080afdd4-530d-4d5f-be57-58a3acf1a1bb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo080afdd4-530d-4d5f-be57-58a3acf1a1bb.selectorLabels" . | nindent 6 }}
