apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54e714a7-8e01-4afc-a84a-540068100861.fullname" . }}
  labels:
    {{- include "go-echo54e714a7-8e01-4afc-a84a-540068100861.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54e714a7-8e01-4afc-a84a-540068100861.selectorLabels" . | nindent 6 }}
