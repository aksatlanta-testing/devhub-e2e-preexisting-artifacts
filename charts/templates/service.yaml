apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod14080ab-717a-475a-9c0e-d701584c9715.fullname" . }}
  labels:
    {{- include "go-echod14080ab-717a-475a-9c0e-d701584c9715.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod14080ab-717a-475a-9c0e-d701584c9715.selectorLabels" . | nindent 6 }}
