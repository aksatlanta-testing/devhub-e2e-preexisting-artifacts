apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobeeb21e3-eaf8-4687-836d-2d2a150c045d.fullname" . }}
  labels:
    {{- include "go-echobeeb21e3-eaf8-4687-836d-2d2a150c045d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobeeb21e3-eaf8-4687-836d-2d2a150c045d.selectorLabels" . | nindent 6 }}
