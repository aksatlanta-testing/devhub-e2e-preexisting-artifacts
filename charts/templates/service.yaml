apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4425877a-239c-41c1-9660-1952c85dd2ae.fullname" . }}
  labels:
    {{- include "go-echo4425877a-239c-41c1-9660-1952c85dd2ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4425877a-239c-41c1-9660-1952c85dd2ae.selectorLabels" . | nindent 6 }}
