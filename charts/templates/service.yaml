apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98105156-6151-4244-a42d-20f7b5f703e4.fullname" . }}
  labels:
    {{- include "go-echo98105156-6151-4244-a42d-20f7b5f703e4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98105156-6151-4244-a42d-20f7b5f703e4.selectorLabels" . | nindent 6 }}
