apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3c8e902-1315-457a-b5c5-247b4b48d949.fullname" . }}
  labels:
    {{- include "go-echoa3c8e902-1315-457a-b5c5-247b4b48d949.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3c8e902-1315-457a-b5c5-247b4b48d949.selectorLabels" . | nindent 6 }}
