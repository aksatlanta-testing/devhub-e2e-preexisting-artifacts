apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c69461e-0acb-4307-932c-b7fbea970040.fullname" . }}
  labels:
    {{- include "go-echo9c69461e-0acb-4307-932c-b7fbea970040.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c69461e-0acb-4307-932c-b7fbea970040.selectorLabels" . | nindent 6 }}
