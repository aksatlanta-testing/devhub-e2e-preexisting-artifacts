apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6645e57-e7f5-4f02-9116-ebde3a9496ce.fullname" . }}
  labels:
    {{- include "go-echoe6645e57-e7f5-4f02-9116-ebde3a9496ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6645e57-e7f5-4f02-9116-ebde3a9496ce.selectorLabels" . | nindent 6 }}
