apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo391ab430-1cf8-4a75-ac46-d68caddbea27.fullname" . }}
  labels:
    {{- include "go-echo391ab430-1cf8-4a75-ac46-d68caddbea27.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo391ab430-1cf8-4a75-ac46-d68caddbea27.selectorLabels" . | nindent 6 }}
