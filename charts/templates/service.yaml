apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6339d5f5-cfc2-40ae-b2a9-d91883dc4a67.fullname" . }}
  labels:
    {{- include "go-echo6339d5f5-cfc2-40ae-b2a9-d91883dc4a67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6339d5f5-cfc2-40ae-b2a9-d91883dc4a67.selectorLabels" . | nindent 6 }}
