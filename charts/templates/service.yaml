apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7439ff5c-3d91-4b4a-b5ad-156a4822348a.fullname" . }}
  labels:
    {{- include "go-echo7439ff5c-3d91-4b4a-b5ad-156a4822348a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7439ff5c-3d91-4b4a-b5ad-156a4822348a.selectorLabels" . | nindent 6 }}
