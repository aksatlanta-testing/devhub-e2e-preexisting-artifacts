apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo265e2cd3-f54e-4608-9bed-6db655de7caa.fullname" . }}
  labels:
    {{- include "go-echo265e2cd3-f54e-4608-9bed-6db655de7caa.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo265e2cd3-f54e-4608-9bed-6db655de7caa.selectorLabels" . | nindent 6 }}
