apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo765fb9f1-6e07-4937-ae47-697d565ddddc.fullname" . }}
  labels:
    {{- include "go-echo765fb9f1-6e07-4937-ae47-697d565ddddc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo765fb9f1-6e07-4937-ae47-697d565ddddc.selectorLabels" . | nindent 6 }}
