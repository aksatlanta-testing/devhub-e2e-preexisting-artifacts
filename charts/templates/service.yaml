apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoadb3a853-c89c-4a34-b86c-cfcca5cc8b43.fullname" . }}
  labels:
    {{- include "go-echoadb3a853-c89c-4a34-b86c-cfcca5cc8b43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoadb3a853-c89c-4a34-b86c-cfcca5cc8b43.selectorLabels" . | nindent 6 }}
