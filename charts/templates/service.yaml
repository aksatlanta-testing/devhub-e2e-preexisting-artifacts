apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80263ba2-f56e-4fdc-8043-635bf04eab55.fullname" . }}
  labels:
    {{- include "go-echo80263ba2-f56e-4fdc-8043-635bf04eab55.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80263ba2-f56e-4fdc-8043-635bf04eab55.selectorLabels" . | nindent 6 }}
