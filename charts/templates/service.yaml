apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed7287fd-031e-4fa3-a2dd-b5e3c6a26ea8.fullname" . }}
  labels:
    {{- include "go-echoed7287fd-031e-4fa3-a2dd-b5e3c6a26ea8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed7287fd-031e-4fa3-a2dd-b5e3c6a26ea8.selectorLabels" . | nindent 6 }}
