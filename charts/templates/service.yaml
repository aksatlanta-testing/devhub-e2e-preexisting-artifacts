apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d985262-f93c-4727-8cdd-82213f5c7565.fullname" . }}
  labels:
    {{- include "go-echo1d985262-f93c-4727-8cdd-82213f5c7565.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d985262-f93c-4727-8cdd-82213f5c7565.selectorLabels" . | nindent 6 }}
