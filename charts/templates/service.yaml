apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof00e7155-acbb-44c5-b294-49aff9984b73.fullname" . }}
  labels:
    {{- include "go-echof00e7155-acbb-44c5-b294-49aff9984b73.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof00e7155-acbb-44c5-b294-49aff9984b73.selectorLabels" . | nindent 6 }}
