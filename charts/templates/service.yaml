apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5ad5a70-1c99-40cc-9f46-f941e11b91a3.fullname" . }}
  labels:
    {{- include "go-echof5ad5a70-1c99-40cc-9f46-f941e11b91a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5ad5a70-1c99-40cc-9f46-f941e11b91a3.selectorLabels" . | nindent 6 }}
