apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf89d076-339a-474e-8b18-2ab8f6f3c847.fullname" . }}
  labels:
    {{- include "go-echoaf89d076-339a-474e-8b18-2ab8f6f3c847.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf89d076-339a-474e-8b18-2ab8f6f3c847.selectorLabels" . | nindent 6 }}
