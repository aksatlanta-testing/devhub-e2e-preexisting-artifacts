apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa50d75e3-c320-4eab-8793-eccd5f526b97.fullname" . }}
  labels:
    {{- include "go-echoa50d75e3-c320-4eab-8793-eccd5f526b97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa50d75e3-c320-4eab-8793-eccd5f526b97.selectorLabels" . | nindent 6 }}
