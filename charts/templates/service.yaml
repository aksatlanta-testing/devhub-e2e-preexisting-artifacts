apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8dead14-63fb-4e19-93d5-70e1d7c0f760.fullname" . }}
  labels:
    {{- include "go-echof8dead14-63fb-4e19-93d5-70e1d7c0f760.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8dead14-63fb-4e19-93d5-70e1d7c0f760.selectorLabels" . | nindent 6 }}
