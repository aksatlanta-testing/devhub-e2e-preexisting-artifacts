apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7fdb7746-009d-42a1-b61e-e32f176e21cb.fullname" . }}
  labels:
    {{- include "go-echo7fdb7746-009d-42a1-b61e-e32f176e21cb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7fdb7746-009d-42a1-b61e-e32f176e21cb.selectorLabels" . | nindent 6 }}
