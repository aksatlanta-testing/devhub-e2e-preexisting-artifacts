apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoecccb75a-3fcf-455f-87c4-46341926bebe.fullname" . }}
  labels:
    {{- include "go-echoecccb75a-3fcf-455f-87c4-46341926bebe.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoecccb75a-3fcf-455f-87c4-46341926bebe.selectorLabels" . | nindent 6 }}
