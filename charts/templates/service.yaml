apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof147e09b-dafc-4a11-a288-8ae24837e1f2.fullname" . }}
  labels:
    {{- include "go-echof147e09b-dafc-4a11-a288-8ae24837e1f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof147e09b-dafc-4a11-a288-8ae24837e1f2.selectorLabels" . | nindent 6 }}
