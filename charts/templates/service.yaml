apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo739b976b-c805-4471-9f89-403a2e1c9958.fullname" . }}
  labels:
    {{- include "go-echo739b976b-c805-4471-9f89-403a2e1c9958.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo739b976b-c805-4471-9f89-403a2e1c9958.selectorLabels" . | nindent 6 }}
