apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ac4f5b9-ee2e-435c-ace0-ca940d47b7e0.fullname" . }}
  labels:
    {{- include "go-echo3ac4f5b9-ee2e-435c-ace0-ca940d47b7e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ac4f5b9-ee2e-435c-ace0-ca940d47b7e0.selectorLabels" . | nindent 6 }}
