apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6736b86e-1660-42b0-9f3c-8f19435a38cf.fullname" . }}
  labels:
    {{- include "go-echo6736b86e-1660-42b0-9f3c-8f19435a38cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6736b86e-1660-42b0-9f3c-8f19435a38cf.selectorLabels" . | nindent 6 }}
