apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20f13361-0168-499f-baed-b338861c7764.fullname" . }}
  labels:
    {{- include "go-echo20f13361-0168-499f-baed-b338861c7764.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20f13361-0168-499f-baed-b338861c7764.selectorLabels" . | nindent 6 }}
