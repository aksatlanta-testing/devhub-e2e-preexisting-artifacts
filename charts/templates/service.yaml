apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9114c52a-4b44-46f8-8d61-40e1bcc0210c.fullname" . }}
  labels:
    {{- include "go-echo9114c52a-4b44-46f8-8d61-40e1bcc0210c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9114c52a-4b44-46f8-8d61-40e1bcc0210c.selectorLabels" . | nindent 6 }}
