apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31c7506d-844c-46b2-9f1d-9c1761c9eb7b.fullname" . }}
  labels:
    {{- include "go-echo31c7506d-844c-46b2-9f1d-9c1761c9eb7b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31c7506d-844c-46b2-9f1d-9c1761c9eb7b.selectorLabels" . | nindent 6 }}
