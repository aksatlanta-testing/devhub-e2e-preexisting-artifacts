apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03154c61-2de6-42e8-a6f4-552424efad1d.fullname" . }}
  labels:
    {{- include "go-echo03154c61-2de6-42e8-a6f4-552424efad1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03154c61-2de6-42e8-a6f4-552424efad1d.selectorLabels" . | nindent 6 }}
