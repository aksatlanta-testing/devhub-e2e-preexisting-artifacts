apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2654e38d-a0bc-4b0a-9a2c-3c0a7db8100e.fullname" . }}
  labels:
    {{- include "go-echo2654e38d-a0bc-4b0a-9a2c-3c0a7db8100e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2654e38d-a0bc-4b0a-9a2c-3c0a7db8100e.selectorLabels" . | nindent 6 }}
