apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91c088dd-d79e-407d-b642-30990c18014e.fullname" . }}
  labels:
    {{- include "go-echo91c088dd-d79e-407d-b642-30990c18014e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91c088dd-d79e-407d-b642-30990c18014e.selectorLabels" . | nindent 6 }}
