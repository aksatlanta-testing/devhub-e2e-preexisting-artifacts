apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo573639a9-b2e3-4420-8bb6-91c60d0d3f24.fullname" . }}
  labels:
    {{- include "go-echo573639a9-b2e3-4420-8bb6-91c60d0d3f24.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo573639a9-b2e3-4420-8bb6-91c60d0d3f24.selectorLabels" . | nindent 6 }}
