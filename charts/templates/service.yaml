apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c4e6dee-1d79-4b8e-9bc2-83bab18d0717.fullname" . }}
  labels:
    {{- include "go-echo2c4e6dee-1d79-4b8e-9bc2-83bab18d0717.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c4e6dee-1d79-4b8e-9bc2-83bab18d0717.selectorLabels" . | nindent 6 }}
