apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8022185-74e4-4ab1-9871-f0106f8e84cd.fullname" . }}
  labels:
    {{- include "go-echod8022185-74e4-4ab1-9871-f0106f8e84cd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8022185-74e4-4ab1-9871-f0106f8e84cd.selectorLabels" . | nindent 6 }}
