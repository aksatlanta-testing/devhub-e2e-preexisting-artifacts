apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31b68c28-16a6-486f-abdc-fd7fecdca9f1.fullname" . }}
  labels:
    {{- include "go-echo31b68c28-16a6-486f-abdc-fd7fecdca9f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31b68c28-16a6-486f-abdc-fd7fecdca9f1.selectorLabels" . | nindent 6 }}
