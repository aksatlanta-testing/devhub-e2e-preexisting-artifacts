apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7bb51d5-6456-40cf-b82b-6f4c22cadd3d.fullname" . }}
  labels:
    {{- include "go-echoc7bb51d5-6456-40cf-b82b-6f4c22cadd3d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7bb51d5-6456-40cf-b82b-6f4c22cadd3d.selectorLabels" . | nindent 6 }}
