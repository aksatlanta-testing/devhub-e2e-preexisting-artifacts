apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob24f0b58-7fcc-4830-a89d-1c89df0af1dd.fullname" . }}
  labels:
    {{- include "go-echob24f0b58-7fcc-4830-a89d-1c89df0af1dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob24f0b58-7fcc-4830-a89d-1c89df0af1dd.selectorLabels" . | nindent 6 }}
