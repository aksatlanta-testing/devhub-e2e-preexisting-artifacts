apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21b3db31-dc37-44f5-99b2-fb2e7f196d21.fullname" . }}
  labels:
    {{- include "go-echo21b3db31-dc37-44f5-99b2-fb2e7f196d21.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21b3db31-dc37-44f5-99b2-fb2e7f196d21.selectorLabels" . | nindent 6 }}
