apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b099ca1-8e5e-47c0-be91-763383d363c2.fullname" . }}
  labels:
    {{- include "go-echo1b099ca1-8e5e-47c0-be91-763383d363c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b099ca1-8e5e-47c0-be91-763383d363c2.selectorLabels" . | nindent 6 }}
