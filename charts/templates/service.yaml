apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cc40358-a849-44f8-8500-70e0c9981d85.fullname" . }}
  labels:
    {{- include "go-echo7cc40358-a849-44f8-8500-70e0c9981d85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7cc40358-a849-44f8-8500-70e0c9981d85.selectorLabels" . | nindent 6 }}
