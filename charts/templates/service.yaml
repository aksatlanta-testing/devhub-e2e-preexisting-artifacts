apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d43303f-3265-4415-8651-396cd6da5363.fullname" . }}
  labels:
    {{- include "go-echo0d43303f-3265-4415-8651-396cd6da5363.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d43303f-3265-4415-8651-396cd6da5363.selectorLabels" . | nindent 6 }}
