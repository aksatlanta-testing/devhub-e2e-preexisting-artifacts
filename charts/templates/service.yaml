apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0219d1ae-ef19-4798-be10-4b14b2ce369b.fullname" . }}
  labels:
    {{- include "go-echo0219d1ae-ef19-4798-be10-4b14b2ce369b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0219d1ae-ef19-4798-be10-4b14b2ce369b.selectorLabels" . | nindent 6 }}
