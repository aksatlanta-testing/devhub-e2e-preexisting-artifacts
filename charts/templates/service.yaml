apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofee1c1c3-8e51-466f-893f-4b7b8da2952d.fullname" . }}
  labels:
    {{- include "go-echofee1c1c3-8e51-466f-893f-4b7b8da2952d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofee1c1c3-8e51-466f-893f-4b7b8da2952d.selectorLabels" . | nindent 6 }}
