apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c9b41bd-0c2f-4f7a-8335-9927cec65c83.fullname" . }}
  labels:
    {{- include "go-echo5c9b41bd-0c2f-4f7a-8335-9927cec65c83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c9b41bd-0c2f-4f7a-8335-9927cec65c83.selectorLabels" . | nindent 6 }}
