apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe051b67f-c259-46a6-a45f-47ba7c7fa80c.fullname" . }}
  labels:
    {{- include "go-echoe051b67f-c259-46a6-a45f-47ba7c7fa80c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe051b67f-c259-46a6-a45f-47ba7c7fa80c.selectorLabels" . | nindent 6 }}
