apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64052460-62bc-4626-aedc-2bc8dc6754c9.fullname" . }}
  labels:
    {{- include "go-echo64052460-62bc-4626-aedc-2bc8dc6754c9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64052460-62bc-4626-aedc-2bc8dc6754c9.selectorLabels" . | nindent 6 }}
