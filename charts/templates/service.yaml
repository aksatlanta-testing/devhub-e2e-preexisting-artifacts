apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8ec01f4-01f7-4f2d-8c05-4812ad6cde1f.fullname" . }}
  labels:
    {{- include "go-echof8ec01f4-01f7-4f2d-8c05-4812ad6cde1f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8ec01f4-01f7-4f2d-8c05-4812ad6cde1f.selectorLabels" . | nindent 6 }}
