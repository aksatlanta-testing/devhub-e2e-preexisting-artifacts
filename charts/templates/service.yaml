apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd2c9084-9880-40d4-8364-fa903da51d0d.fullname" . }}
  labels:
    {{- include "go-echodd2c9084-9880-40d4-8364-fa903da51d0d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd2c9084-9880-40d4-8364-fa903da51d0d.selectorLabels" . | nindent 6 }}
