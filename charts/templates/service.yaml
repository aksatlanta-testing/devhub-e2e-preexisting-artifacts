apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9ef5dfc-c3ba-493a-ab7e-36a686c9d3d5.fullname" . }}
  labels:
    {{- include "go-echob9ef5dfc-c3ba-493a-ab7e-36a686c9d3d5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9ef5dfc-c3ba-493a-ab7e-36a686c9d3d5.selectorLabels" . | nindent 6 }}
