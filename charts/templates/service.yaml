apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabf3721d-0082-4b2f-9947-4251228c894b.fullname" . }}
  labels:
    {{- include "go-echoabf3721d-0082-4b2f-9947-4251228c894b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabf3721d-0082-4b2f-9947-4251228c894b.selectorLabels" . | nindent 6 }}
