apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7357a00b-89c9-4fde-8d2c-7c9329bd64ee.fullname" . }}
  labels:
    {{- include "go-echo7357a00b-89c9-4fde-8d2c-7c9329bd64ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7357a00b-89c9-4fde-8d2c-7c9329bd64ee.selectorLabels" . | nindent 6 }}
