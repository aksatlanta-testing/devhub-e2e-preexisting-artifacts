apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe13fd563-2eb4-4b17-bb86-8d52c8bc9cb3.fullname" . }}
  labels:
    {{- include "go-echoe13fd563-2eb4-4b17-bb86-8d52c8bc9cb3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe13fd563-2eb4-4b17-bb86-8d52c8bc9cb3.selectorLabels" . | nindent 6 }}
