apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc878dd9-c9b0-4eea-8cd1-7098ff86cfcf.fullname" . }}
  labels:
    {{- include "go-echocc878dd9-c9b0-4eea-8cd1-7098ff86cfcf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc878dd9-c9b0-4eea-8cd1-7098ff86cfcf.selectorLabels" . | nindent 6 }}
