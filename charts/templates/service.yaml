apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo303c0bac-ca0f-4209-a56e-c296c0cec11a.fullname" . }}
  labels:
    {{- include "go-echo303c0bac-ca0f-4209-a56e-c296c0cec11a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo303c0bac-ca0f-4209-a56e-c296c0cec11a.selectorLabels" . | nindent 6 }}
