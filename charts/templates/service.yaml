apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06deced6-6fff-402e-8799-01643cac0285.fullname" . }}
  labels:
    {{- include "go-echo06deced6-6fff-402e-8799-01643cac0285.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06deced6-6fff-402e-8799-01643cac0285.selectorLabels" . | nindent 6 }}
