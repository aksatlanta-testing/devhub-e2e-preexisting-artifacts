apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86e9b09b-9f0f-4b46-ba78-4c563a33d000.fullname" . }}
  labels:
    {{- include "go-echo86e9b09b-9f0f-4b46-ba78-4c563a33d000.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86e9b09b-9f0f-4b46-ba78-4c563a33d000.selectorLabels" . | nindent 6 }}
