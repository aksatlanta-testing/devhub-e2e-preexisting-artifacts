apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97a7a696-7bdb-41a4-9ba4-806c130b84ef.fullname" . }}
  labels:
    {{- include "go-echo97a7a696-7bdb-41a4-9ba4-806c130b84ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97a7a696-7bdb-41a4-9ba4-806c130b84ef.selectorLabels" . | nindent 6 }}
