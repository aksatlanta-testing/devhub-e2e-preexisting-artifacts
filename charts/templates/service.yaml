apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4ba3ad0-003c-4145-86c7-24dd7c90c9bb.fullname" . }}
  labels:
    {{- include "go-echof4ba3ad0-003c-4145-86c7-24dd7c90c9bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4ba3ad0-003c-4145-86c7-24dd7c90c9bb.selectorLabels" . | nindent 6 }}
