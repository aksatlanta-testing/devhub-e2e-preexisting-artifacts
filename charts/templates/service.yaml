apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21af328e-5e17-4b01-95ea-21201da2a614.fullname" . }}
  labels:
    {{- include "go-echo21af328e-5e17-4b01-95ea-21201da2a614.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21af328e-5e17-4b01-95ea-21201da2a614.selectorLabels" . | nindent 6 }}
