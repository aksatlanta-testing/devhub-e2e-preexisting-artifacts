apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31382118-c18b-4ac6-81fa-230ede027895.fullname" . }}
  labels:
    {{- include "go-echo31382118-c18b-4ac6-81fa-230ede027895.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31382118-c18b-4ac6-81fa-230ede027895.selectorLabels" . | nindent 6 }}
