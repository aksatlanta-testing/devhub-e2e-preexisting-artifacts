apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob22e99f8-8454-4419-9ca5-77e4f49b0b1d.fullname" . }}
  labels:
    {{- include "go-echob22e99f8-8454-4419-9ca5-77e4f49b0b1d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob22e99f8-8454-4419-9ca5-77e4f49b0b1d.selectorLabels" . | nindent 6 }}
