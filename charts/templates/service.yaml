apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f805e19-a196-4842-b0d3-62e1f53142e0.fullname" . }}
  labels:
    {{- include "go-echo7f805e19-a196-4842-b0d3-62e1f53142e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f805e19-a196-4842-b0d3-62e1f53142e0.selectorLabels" . | nindent 6 }}
