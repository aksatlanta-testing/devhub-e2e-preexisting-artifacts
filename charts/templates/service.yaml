apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo757c8453-ffad-44b4-a91b-4846e074d8db.fullname" . }}
  labels:
    {{- include "go-echo757c8453-ffad-44b4-a91b-4846e074d8db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo757c8453-ffad-44b4-a91b-4846e074d8db.selectorLabels" . | nindent 6 }}
