apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo213753ad-71de-43e9-aee6-ab362c2ce8dd.fullname" . }}
  labels:
    {{- include "go-echo213753ad-71de-43e9-aee6-ab362c2ce8dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo213753ad-71de-43e9-aee6-ab362c2ce8dd.selectorLabels" . | nindent 6 }}
