apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c824395-04a5-4af6-ae41-4b79b3f4f351.fullname" . }}
  labels:
    {{- include "go-echo1c824395-04a5-4af6-ae41-4b79b3f4f351.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c824395-04a5-4af6-ae41-4b79b3f4f351.selectorLabels" . | nindent 6 }}
