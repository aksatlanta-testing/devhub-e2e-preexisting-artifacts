apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36792c4e-92f6-4171-8a87-596e0ca8cfdb.fullname" . }}
  labels:
    {{- include "go-echo36792c4e-92f6-4171-8a87-596e0ca8cfdb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36792c4e-92f6-4171-8a87-596e0ca8cfdb.selectorLabels" . | nindent 6 }}
