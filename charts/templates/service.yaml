apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6dbe6d3-205f-4763-b39d-7c3feb3d0486.fullname" . }}
  labels:
    {{- include "go-echod6dbe6d3-205f-4763-b39d-7c3feb3d0486.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6dbe6d3-205f-4763-b39d-7c3feb3d0486.selectorLabels" . | nindent 6 }}
