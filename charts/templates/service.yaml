apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12b0ca46-4a39-4298-baa2-858233a229e0.fullname" . }}
  labels:
    {{- include "go-echo12b0ca46-4a39-4298-baa2-858233a229e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12b0ca46-4a39-4298-baa2-858233a229e0.selectorLabels" . | nindent 6 }}
