apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08ac2ee8-163c-4954-8931-3dadad93a14f.fullname" . }}
  labels:
    {{- include "go-echo08ac2ee8-163c-4954-8931-3dadad93a14f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08ac2ee8-163c-4954-8931-3dadad93a14f.selectorLabels" . | nindent 6 }}
