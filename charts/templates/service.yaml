apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo744c1173-72fa-4461-a9f4-6d6f43edd210.fullname" . }}
  labels:
    {{- include "go-echo744c1173-72fa-4461-a9f4-6d6f43edd210.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo744c1173-72fa-4461-a9f4-6d6f43edd210.selectorLabels" . | nindent 6 }}
