apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49725869-ca39-4978-8be4-3b0c7e3a27fd.fullname" . }}
  labels:
    {{- include "go-echo49725869-ca39-4978-8be4-3b0c7e3a27fd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49725869-ca39-4978-8be4-3b0c7e3a27fd.selectorLabels" . | nindent 6 }}
