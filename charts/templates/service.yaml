apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55110978-75b6-4561-b377-53440a11f70d.fullname" . }}
  labels:
    {{- include "go-echo55110978-75b6-4561-b377-53440a11f70d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55110978-75b6-4561-b377-53440a11f70d.selectorLabels" . | nindent 6 }}
