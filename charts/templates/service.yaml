apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8551c80-d3ea-4755-865b-4edb230dc03e.fullname" . }}
  labels:
    {{- include "go-echoe8551c80-d3ea-4755-865b-4edb230dc03e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8551c80-d3ea-4755-865b-4edb230dc03e.selectorLabels" . | nindent 6 }}
