apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1ce6700-ff25-427a-bec6-8b86416c7dc5.fullname" . }}
  labels:
    {{- include "go-echob1ce6700-ff25-427a-bec6-8b86416c7dc5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1ce6700-ff25-427a-bec6-8b86416c7dc5.selectorLabels" . | nindent 6 }}
