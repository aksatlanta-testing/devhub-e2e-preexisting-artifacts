apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc418f443-fb41-47b1-8375-f89149ca1a63.fullname" . }}
  labels:
    {{- include "go-echoc418f443-fb41-47b1-8375-f89149ca1a63.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc418f443-fb41-47b1-8375-f89149ca1a63.selectorLabels" . | nindent 6 }}
