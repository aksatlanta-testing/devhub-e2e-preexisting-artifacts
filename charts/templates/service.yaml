apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fcad886-e7d0-4f97-a0b7-389188c7ca47.fullname" . }}
  labels:
    {{- include "go-echo9fcad886-e7d0-4f97-a0b7-389188c7ca47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fcad886-e7d0-4f97-a0b7-389188c7ca47.selectorLabels" . | nindent 6 }}
