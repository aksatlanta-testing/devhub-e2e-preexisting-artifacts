apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob04dcd2a-900a-4b73-8891-28ea0931255e.fullname" . }}
  labels:
    {{- include "go-echob04dcd2a-900a-4b73-8891-28ea0931255e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob04dcd2a-900a-4b73-8891-28ea0931255e.selectorLabels" . | nindent 6 }}
