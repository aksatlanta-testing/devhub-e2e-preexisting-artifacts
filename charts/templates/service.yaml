apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b097e6c-886d-4af2-9f54-2403bd7c982d.fullname" . }}
  labels:
    {{- include "go-echo0b097e6c-886d-4af2-9f54-2403bd7c982d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b097e6c-886d-4af2-9f54-2403bd7c982d.selectorLabels" . | nindent 6 }}
