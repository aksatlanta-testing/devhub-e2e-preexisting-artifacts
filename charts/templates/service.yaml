apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10e3ef85-032a-435c-b1bb-791c8c893af8.fullname" . }}
  labels:
    {{- include "go-echo10e3ef85-032a-435c-b1bb-791c8c893af8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10e3ef85-032a-435c-b1bb-791c8c893af8.selectorLabels" . | nindent 6 }}
