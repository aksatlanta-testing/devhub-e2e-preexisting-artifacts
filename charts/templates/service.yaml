apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f46a8db-9415-4aea-9d31-943c54e88a22.fullname" . }}
  labels:
    {{- include "go-echo3f46a8db-9415-4aea-9d31-943c54e88a22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f46a8db-9415-4aea-9d31-943c54e88a22.selectorLabels" . | nindent 6 }}
