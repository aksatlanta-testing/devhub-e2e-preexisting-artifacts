apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc19d7486-0f53-490b-be8a-ab3fccf4d3eb.fullname" . }}
  labels:
    {{- include "go-echoc19d7486-0f53-490b-be8a-ab3fccf4d3eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc19d7486-0f53-490b-be8a-ab3fccf4d3eb.selectorLabels" . | nindent 6 }}
