apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7fafaa2-8e16-48bf-ad5d-d9e7a9727cec.fullname" . }}
  labels:
    {{- include "go-echod7fafaa2-8e16-48bf-ad5d-d9e7a9727cec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7fafaa2-8e16-48bf-ad5d-d9e7a9727cec.selectorLabels" . | nindent 6 }}
