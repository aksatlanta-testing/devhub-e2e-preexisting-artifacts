apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe002cda1-3759-4686-8eb2-86b3dc6de907.fullname" . }}
  labels:
    {{- include "go-echoe002cda1-3759-4686-8eb2-86b3dc6de907.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe002cda1-3759-4686-8eb2-86b3dc6de907.selectorLabels" . | nindent 6 }}
