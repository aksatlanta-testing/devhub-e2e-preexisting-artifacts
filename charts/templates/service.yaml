apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b3c9213-2d44-4444-aae8-12ce94bb9f64.fullname" . }}
  labels:
    {{- include "go-echo7b3c9213-2d44-4444-aae8-12ce94bb9f64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b3c9213-2d44-4444-aae8-12ce94bb9f64.selectorLabels" . | nindent 6 }}
