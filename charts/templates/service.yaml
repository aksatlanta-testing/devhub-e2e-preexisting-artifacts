apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c7dbbad-8f35-41f8-b904-f28a9a4b21f1.fullname" . }}
  labels:
    {{- include "go-echo8c7dbbad-8f35-41f8-b904-f28a9a4b21f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c7dbbad-8f35-41f8-b904-f28a9a4b21f1.selectorLabels" . | nindent 6 }}
