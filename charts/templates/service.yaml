apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67546cd6-eb43-4230-a33a-f2ad19bfec3d.fullname" . }}
  labels:
    {{- include "go-echo67546cd6-eb43-4230-a33a-f2ad19bfec3d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67546cd6-eb43-4230-a33a-f2ad19bfec3d.selectorLabels" . | nindent 6 }}
