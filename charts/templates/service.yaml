apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3896a5f3-6dfb-4c32-83d9-ce981b54285f.fullname" . }}
  labels:
    {{- include "go-echo3896a5f3-6dfb-4c32-83d9-ce981b54285f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3896a5f3-6dfb-4c32-83d9-ce981b54285f.selectorLabels" . | nindent 6 }}
