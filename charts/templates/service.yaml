apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo189c4f86-0e9a-44bc-b689-5ef468812028.fullname" . }}
  labels:
    {{- include "go-echo189c4f86-0e9a-44bc-b689-5ef468812028.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo189c4f86-0e9a-44bc-b689-5ef468812028.selectorLabels" . | nindent 6 }}
