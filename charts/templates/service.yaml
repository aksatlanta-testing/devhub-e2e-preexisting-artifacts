apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43bed577-83b8-4a7c-8753-83c41c0a51f0.fullname" . }}
  labels:
    {{- include "go-echo43bed577-83b8-4a7c-8753-83c41c0a51f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43bed577-83b8-4a7c-8753-83c41c0a51f0.selectorLabels" . | nindent 6 }}
