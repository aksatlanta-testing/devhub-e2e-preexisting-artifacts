apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo986d2e23-8e5c-4e1a-a549-4dcb948765eb.fullname" . }}
  labels:
    {{- include "go-echo986d2e23-8e5c-4e1a-a549-4dcb948765eb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo986d2e23-8e5c-4e1a-a549-4dcb948765eb.selectorLabels" . | nindent 6 }}
