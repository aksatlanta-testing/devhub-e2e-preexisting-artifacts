apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3701131-e8ec-4ec0-be66-06a2fc037529.fullname" . }}
  labels:
    {{- include "go-echoa3701131-e8ec-4ec0-be66-06a2fc037529.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3701131-e8ec-4ec0-be66-06a2fc037529.selectorLabels" . | nindent 6 }}
