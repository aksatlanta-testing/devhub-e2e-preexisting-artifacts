apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ae11ccd-6fa6-4219-902c-2c969ea1975f.fullname" . }}
  labels:
    {{- include "go-echo3ae11ccd-6fa6-4219-902c-2c969ea1975f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ae11ccd-6fa6-4219-902c-2c969ea1975f.selectorLabels" . | nindent 6 }}
