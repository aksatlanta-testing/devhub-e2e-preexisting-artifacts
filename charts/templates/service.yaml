apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo942a3035-a460-495c-9f38-c0000bcc0bcc.fullname" . }}
  labels:
    {{- include "go-echo942a3035-a460-495c-9f38-c0000bcc0bcc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo942a3035-a460-495c-9f38-c0000bcc0bcc.selectorLabels" . | nindent 6 }}
