apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3526b547-7505-448c-893d-90b086af99cd.fullname" . }}
  labels:
    {{- include "go-echo3526b547-7505-448c-893d-90b086af99cd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3526b547-7505-448c-893d-90b086af99cd.selectorLabels" . | nindent 6 }}
