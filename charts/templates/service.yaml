apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6f3ff9b-43dc-4a36-887a-b16e4a495caf.fullname" . }}
  labels:
    {{- include "go-echob6f3ff9b-43dc-4a36-887a-b16e4a495caf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6f3ff9b-43dc-4a36-887a-b16e4a495caf.selectorLabels" . | nindent 6 }}
