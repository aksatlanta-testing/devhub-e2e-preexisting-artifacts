apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47677471-2d7a-4840-a87e-17f9eb9ac221.fullname" . }}
  labels:
    {{- include "go-echo47677471-2d7a-4840-a87e-17f9eb9ac221.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47677471-2d7a-4840-a87e-17f9eb9ac221.selectorLabels" . | nindent 6 }}
