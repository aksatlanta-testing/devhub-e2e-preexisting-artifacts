apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20f87067-87a7-406f-91a1-fc008956fe19.fullname" . }}
  labels:
    {{- include "go-echo20f87067-87a7-406f-91a1-fc008956fe19.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20f87067-87a7-406f-91a1-fc008956fe19.selectorLabels" . | nindent 6 }}
