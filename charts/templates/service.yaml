apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod94436ec-ef85-475d-b4d0-6c15f2b7d000.fullname" . }}
  labels:
    {{- include "go-echod94436ec-ef85-475d-b4d0-6c15f2b7d000.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod94436ec-ef85-475d-b4d0-6c15f2b7d000.selectorLabels" . | nindent 6 }}
