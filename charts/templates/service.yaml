apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2bfc88a9-07e6-46b4-a501-d53e228ce668.fullname" . }}
  labels:
    {{- include "go-echo2bfc88a9-07e6-46b4-a501-d53e228ce668.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2bfc88a9-07e6-46b4-a501-d53e228ce668.selectorLabels" . | nindent 6 }}
