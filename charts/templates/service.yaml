apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7413522d-f42e-4849-a25a-364bf97b4cef.fullname" . }}
  labels:
    {{- include "go-echo7413522d-f42e-4849-a25a-364bf97b4cef.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7413522d-f42e-4849-a25a-364bf97b4cef.selectorLabels" . | nindent 6 }}
