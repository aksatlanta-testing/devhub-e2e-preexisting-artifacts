apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo817cc8b4-4bec-4919-b00f-667d44dff6b2.fullname" . }}
  labels:
    {{- include "go-echo817cc8b4-4bec-4919-b00f-667d44dff6b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo817cc8b4-4bec-4919-b00f-667d44dff6b2.selectorLabels" . | nindent 6 }}
