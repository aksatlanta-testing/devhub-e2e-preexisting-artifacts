apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda3d7bef-aa4d-473f-99a2-7523f39a0357.fullname" . }}
  labels:
    {{- include "go-echoda3d7bef-aa4d-473f-99a2-7523f39a0357.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda3d7bef-aa4d-473f-99a2-7523f39a0357.selectorLabels" . | nindent 6 }}
