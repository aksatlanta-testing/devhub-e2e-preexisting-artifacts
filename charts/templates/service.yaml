apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cc8fec6-b1ba-404d-86b3-e47a4c3083e5.fullname" . }}
  labels:
    {{- include "go-echo5cc8fec6-b1ba-404d-86b3-e47a4c3083e5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cc8fec6-b1ba-404d-86b3-e47a4c3083e5.selectorLabels" . | nindent 6 }}
