apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc1066dc-5fd6-44fa-87c4-9a0abd70b5dd.fullname" . }}
  labels:
    {{- include "go-echocc1066dc-5fd6-44fa-87c4-9a0abd70b5dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc1066dc-5fd6-44fa-87c4-9a0abd70b5dd.selectorLabels" . | nindent 6 }}
