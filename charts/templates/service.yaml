apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8beab70-d5b8-4820-a596-b449333e6fc0.fullname" . }}
  labels:
    {{- include "go-echof8beab70-d5b8-4820-a596-b449333e6fc0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8beab70-d5b8-4820-a596-b449333e6fc0.selectorLabels" . | nindent 6 }}
