apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76e5f16e-5241-4a5a-8012-575b9c771d66.fullname" . }}
  labels:
    {{- include "go-echo76e5f16e-5241-4a5a-8012-575b9c771d66.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76e5f16e-5241-4a5a-8012-575b9c771d66.selectorLabels" . | nindent 6 }}
