apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocead2450-3468-44f9-920b-8f811c45fd96.fullname" . }}
  labels:
    {{- include "go-echocead2450-3468-44f9-920b-8f811c45fd96.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocead2450-3468-44f9-920b-8f811c45fd96.selectorLabels" . | nindent 6 }}
