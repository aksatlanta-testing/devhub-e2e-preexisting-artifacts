apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1e3c5c2-e2e0-4bbf-949c-269c68178544.fullname" . }}
  labels:
    {{- include "go-echoc1e3c5c2-e2e0-4bbf-949c-269c68178544.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1e3c5c2-e2e0-4bbf-949c-269c68178544.selectorLabels" . | nindent 6 }}
