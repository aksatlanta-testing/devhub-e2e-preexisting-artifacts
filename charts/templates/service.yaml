apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba75f875-a6d0-4fa3-adef-6a1b53fb5441.fullname" . }}
  labels:
    {{- include "go-echoba75f875-a6d0-4fa3-adef-6a1b53fb5441.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba75f875-a6d0-4fa3-adef-6a1b53fb5441.selectorLabels" . | nindent 6 }}
