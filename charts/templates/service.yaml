apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44fcfdde-9742-49bd-bd71-47157f995028.fullname" . }}
  labels:
    {{- include "go-echo44fcfdde-9742-49bd-bd71-47157f995028.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44fcfdde-9742-49bd-bd71-47157f995028.selectorLabels" . | nindent 6 }}
