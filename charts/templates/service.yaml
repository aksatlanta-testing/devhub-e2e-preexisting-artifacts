apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97520b0e-6104-43ce-9b40-9de6410919de.fullname" . }}
  labels:
    {{- include "go-echo97520b0e-6104-43ce-9b40-9de6410919de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97520b0e-6104-43ce-9b40-9de6410919de.selectorLabels" . | nindent 6 }}
