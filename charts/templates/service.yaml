apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5be613b4-70aa-448c-84b5-961114ae64e7.fullname" . }}
  labels:
    {{- include "go-echo5be613b4-70aa-448c-84b5-961114ae64e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5be613b4-70aa-448c-84b5-961114ae64e7.selectorLabels" . | nindent 6 }}
