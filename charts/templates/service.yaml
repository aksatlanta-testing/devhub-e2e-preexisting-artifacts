apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e22f875-2225-4a4a-abc0-9b09e716305c.fullname" . }}
  labels:
    {{- include "go-echo4e22f875-2225-4a4a-abc0-9b09e716305c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e22f875-2225-4a4a-abc0-9b09e716305c.selectorLabels" . | nindent 6 }}
