apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc582a05-6285-4640-885c-7a00cc79980d.fullname" . }}
  labels:
    {{- include "go-echobc582a05-6285-4640-885c-7a00cc79980d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc582a05-6285-4640-885c-7a00cc79980d.selectorLabels" . | nindent 6 }}
