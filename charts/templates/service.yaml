apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92c9cf55-9aa4-420e-8e09-a237c0c99ae9.fullname" . }}
  labels:
    {{- include "go-echo92c9cf55-9aa4-420e-8e09-a237c0c99ae9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92c9cf55-9aa4-420e-8e09-a237c0c99ae9.selectorLabels" . | nindent 6 }}
