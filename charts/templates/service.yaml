apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof928ac57-a9b1-4636-bb8c-cd32b99fa8a8.fullname" . }}
  labels:
    {{- include "go-echof928ac57-a9b1-4636-bb8c-cd32b99fa8a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof928ac57-a9b1-4636-bb8c-cd32b99fa8a8.selectorLabels" . | nindent 6 }}
