apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5d3bb01-8861-4d96-bd44-01cea8434f46.fullname" . }}
  labels:
    {{- include "go-echoc5d3bb01-8861-4d96-bd44-01cea8434f46.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5d3bb01-8861-4d96-bd44-01cea8434f46.selectorLabels" . | nindent 6 }}
