apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffba414b-23f6-43e1-97f2-c166673aa5fa.fullname" . }}
  labels:
    {{- include "go-echoffba414b-23f6-43e1-97f2-c166673aa5fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffba414b-23f6-43e1-97f2-c166673aa5fa.selectorLabels" . | nindent 6 }}
