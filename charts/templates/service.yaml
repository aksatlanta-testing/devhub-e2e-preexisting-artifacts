apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod36f1c2e-d54e-4178-93b2-633d2075d643.fullname" . }}
  labels:
    {{- include "go-echod36f1c2e-d54e-4178-93b2-633d2075d643.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod36f1c2e-d54e-4178-93b2-633d2075d643.selectorLabels" . | nindent 6 }}
