apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb8d72e6-8630-43fe-a510-d3c1109cda7d.fullname" . }}
  labels:
    {{- include "go-echofb8d72e6-8630-43fe-a510-d3c1109cda7d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb8d72e6-8630-43fe-a510-d3c1109cda7d.selectorLabels" . | nindent 6 }}
