apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a3af436-8b24-42cd-ac6a-5d54e737b91b.fullname" . }}
  labels:
    {{- include "go-echo8a3af436-8b24-42cd-ac6a-5d54e737b91b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a3af436-8b24-42cd-ac6a-5d54e737b91b.selectorLabels" . | nindent 6 }}
