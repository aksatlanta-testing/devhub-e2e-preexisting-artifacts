apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26794bce-9b66-46fb-8240-fa55883ead9b.fullname" . }}
  labels:
    {{- include "go-echo26794bce-9b66-46fb-8240-fa55883ead9b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26794bce-9b66-46fb-8240-fa55883ead9b.selectorLabels" . | nindent 6 }}
