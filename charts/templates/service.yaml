apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacfdee06-49ef-4e9d-93de-de3605eff282.fullname" . }}
  labels:
    {{- include "go-echoacfdee06-49ef-4e9d-93de-de3605eff282.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacfdee06-49ef-4e9d-93de-de3605eff282.selectorLabels" . | nindent 6 }}
