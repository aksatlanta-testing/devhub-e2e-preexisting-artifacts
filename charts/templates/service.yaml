apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo106527bb-153b-42f9-8136-48acc397acb5.fullname" . }}
  labels:
    {{- include "go-echo106527bb-153b-42f9-8136-48acc397acb5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo106527bb-153b-42f9-8136-48acc397acb5.selectorLabels" . | nindent 6 }}
