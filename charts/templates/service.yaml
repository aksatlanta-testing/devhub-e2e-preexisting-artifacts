apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38f36f7a-5d52-4b1c-92c4-0232043cfc35.fullname" . }}
  labels:
    {{- include "go-echo38f36f7a-5d52-4b1c-92c4-0232043cfc35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38f36f7a-5d52-4b1c-92c4-0232043cfc35.selectorLabels" . | nindent 6 }}
