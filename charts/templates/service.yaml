apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e15ae1d-d260-47c8-9f14-879efad90f9f.fullname" . }}
  labels:
    {{- include "go-echo1e15ae1d-d260-47c8-9f14-879efad90f9f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e15ae1d-d260-47c8-9f14-879efad90f9f.selectorLabels" . | nindent 6 }}
