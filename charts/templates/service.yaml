apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d73c2ad-7e94-4d23-96fd-22f006e726c1.fullname" . }}
  labels:
    {{- include "go-echo1d73c2ad-7e94-4d23-96fd-22f006e726c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d73c2ad-7e94-4d23-96fd-22f006e726c1.selectorLabels" . | nindent 6 }}
