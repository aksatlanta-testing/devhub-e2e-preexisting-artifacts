apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d1ebd8a-2d20-4b39-86a1-37723591e893.fullname" . }}
  labels:
    {{- include "go-echo4d1ebd8a-2d20-4b39-86a1-37723591e893.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d1ebd8a-2d20-4b39-86a1-37723591e893.selectorLabels" . | nindent 6 }}
