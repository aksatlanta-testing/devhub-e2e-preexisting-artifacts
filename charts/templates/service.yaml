apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28ca6cdf-7e9f-4608-9a25-f1c262da21ad.fullname" . }}
  labels:
    {{- include "go-echo28ca6cdf-7e9f-4608-9a25-f1c262da21ad.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28ca6cdf-7e9f-4608-9a25-f1c262da21ad.selectorLabels" . | nindent 6 }}
