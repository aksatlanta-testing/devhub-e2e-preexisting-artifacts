apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20bf0d76-8ed3-4a09-9838-d59115647e80.fullname" . }}
  labels:
    {{- include "go-echo20bf0d76-8ed3-4a09-9838-d59115647e80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20bf0d76-8ed3-4a09-9838-d59115647e80.selectorLabels" . | nindent 6 }}
