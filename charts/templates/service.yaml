apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo213c5e72-45f6-4f6b-9bea-e2223d065905.fullname" . }}
  labels:
    {{- include "go-echo213c5e72-45f6-4f6b-9bea-e2223d065905.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo213c5e72-45f6-4f6b-9bea-e2223d065905.selectorLabels" . | nindent 6 }}
