apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo749e2616-c778-4f97-a587-d1b407558877.fullname" . }}
  labels:
    {{- include "go-echo749e2616-c778-4f97-a587-d1b407558877.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo749e2616-c778-4f97-a587-d1b407558877.selectorLabels" . | nindent 6 }}
