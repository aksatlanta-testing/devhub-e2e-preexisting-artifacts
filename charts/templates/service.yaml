apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f647d4d-1a31-4b38-b33b-5f2f628da388.fullname" . }}
  labels:
    {{- include "go-echo7f647d4d-1a31-4b38-b33b-5f2f628da388.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f647d4d-1a31-4b38-b33b-5f2f628da388.selectorLabels" . | nindent 6 }}
