apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe447941e-1d66-4c01-b141-d71534ec522c.fullname" . }}
  labels:
    {{- include "go-echoe447941e-1d66-4c01-b141-d71534ec522c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe447941e-1d66-4c01-b141-d71534ec522c.selectorLabels" . | nindent 6 }}
