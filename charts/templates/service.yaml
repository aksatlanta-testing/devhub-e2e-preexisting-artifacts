apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7d1adcd-460c-43cc-8ab8-21deaa8a0cd5.fullname" . }}
  labels:
    {{- include "go-echoc7d1adcd-460c-43cc-8ab8-21deaa8a0cd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7d1adcd-460c-43cc-8ab8-21deaa8a0cd5.selectorLabels" . | nindent 6 }}
