apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8762cff-0890-400d-877a-f1c2000e4feb.fullname" . }}
  labels:
    {{- include "go-echob8762cff-0890-400d-877a-f1c2000e4feb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8762cff-0890-400d-877a-f1c2000e4feb.selectorLabels" . | nindent 6 }}
