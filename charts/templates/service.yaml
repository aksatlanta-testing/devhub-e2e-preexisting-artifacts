apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fd08610-60d8-4c4b-8c55-8b430faf3ddd.fullname" . }}
  labels:
    {{- include "go-echo4fd08610-60d8-4c4b-8c55-8b430faf3ddd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fd08610-60d8-4c4b-8c55-8b430faf3ddd.selectorLabels" . | nindent 6 }}
