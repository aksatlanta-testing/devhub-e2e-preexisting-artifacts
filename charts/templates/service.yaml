apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fe5920d-be36-4df7-888b-5772b221f052.fullname" . }}
  labels:
    {{- include "go-echo9fe5920d-be36-4df7-888b-5772b221f052.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fe5920d-be36-4df7-888b-5772b221f052.selectorLabels" . | nindent 6 }}
