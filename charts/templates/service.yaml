apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo584d0d76-d38b-403c-b53a-a1192dd00325.fullname" . }}
  labels:
    {{- include "go-echo584d0d76-d38b-403c-b53a-a1192dd00325.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo584d0d76-d38b-403c-b53a-a1192dd00325.selectorLabels" . | nindent 6 }}
