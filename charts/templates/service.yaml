apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4af226a-3ddf-41b5-938d-2e9ab07e43ea.fullname" . }}
  labels:
    {{- include "go-echoe4af226a-3ddf-41b5-938d-2e9ab07e43ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4af226a-3ddf-41b5-938d-2e9ab07e43ea.selectorLabels" . | nindent 6 }}
