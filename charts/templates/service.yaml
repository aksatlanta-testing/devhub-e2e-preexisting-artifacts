apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05749ebd-aea7-4090-9ef1-fbf7e9f7d593.fullname" . }}
  labels:
    {{- include "go-echo05749ebd-aea7-4090-9ef1-fbf7e9f7d593.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05749ebd-aea7-4090-9ef1-fbf7e9f7d593.selectorLabels" . | nindent 6 }}
