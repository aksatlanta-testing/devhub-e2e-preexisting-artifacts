apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76b8a8ad-fcbc-4d12-867e-8e11c1765a98.fullname" . }}
  labels:
    {{- include "go-echo76b8a8ad-fcbc-4d12-867e-8e11c1765a98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76b8a8ad-fcbc-4d12-867e-8e11c1765a98.selectorLabels" . | nindent 6 }}
