apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18bfab1a-98fc-49d7-a8df-acff7a508ea8.fullname" . }}
  labels:
    {{- include "go-echo18bfab1a-98fc-49d7-a8df-acff7a508ea8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18bfab1a-98fc-49d7-a8df-acff7a508ea8.selectorLabels" . | nindent 6 }}
