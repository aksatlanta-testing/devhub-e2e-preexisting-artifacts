apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa389219f-3eeb-460b-9392-90634355bab2.fullname" . }}
  labels:
    {{- include "go-echoa389219f-3eeb-460b-9392-90634355bab2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa389219f-3eeb-460b-9392-90634355bab2.selectorLabels" . | nindent 6 }}
