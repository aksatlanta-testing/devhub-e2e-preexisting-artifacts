apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12a2f764-62b7-49ba-bf5c-ad4a97ea7da0.fullname" . }}
  labels:
    {{- include "go-echo12a2f764-62b7-49ba-bf5c-ad4a97ea7da0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12a2f764-62b7-49ba-bf5c-ad4a97ea7da0.selectorLabels" . | nindent 6 }}
