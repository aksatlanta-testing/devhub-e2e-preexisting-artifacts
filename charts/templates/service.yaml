apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe56b109e-f567-4c31-9c1f-cd046a1c488d.fullname" . }}
  labels:
    {{- include "go-echoe56b109e-f567-4c31-9c1f-cd046a1c488d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe56b109e-f567-4c31-9c1f-cd046a1c488d.selectorLabels" . | nindent 6 }}
