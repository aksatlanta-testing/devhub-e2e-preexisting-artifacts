apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4989c56e-59b2-4239-b056-366055e44672.fullname" . }}
  labels:
    {{- include "go-echo4989c56e-59b2-4239-b056-366055e44672.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4989c56e-59b2-4239-b056-366055e44672.selectorLabels" . | nindent 6 }}
