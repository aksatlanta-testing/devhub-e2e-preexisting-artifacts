apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48d110ab-2080-45cc-add3-4343604d5f57.fullname" . }}
  labels:
    {{- include "go-echo48d110ab-2080-45cc-add3-4343604d5f57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48d110ab-2080-45cc-add3-4343604d5f57.selectorLabels" . | nindent 6 }}
