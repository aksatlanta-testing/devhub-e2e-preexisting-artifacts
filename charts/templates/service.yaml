apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe02522b8-34a1-43db-9abe-b265d04e50dd.fullname" . }}
  labels:
    {{- include "go-echoe02522b8-34a1-43db-9abe-b265d04e50dd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe02522b8-34a1-43db-9abe-b265d04e50dd.selectorLabels" . | nindent 6 }}
