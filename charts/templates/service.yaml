apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod61e6464-b922-427f-b93f-17e5782442ed.fullname" . }}
  labels:
    {{- include "go-echod61e6464-b922-427f-b93f-17e5782442ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod61e6464-b922-427f-b93f-17e5782442ed.selectorLabels" . | nindent 6 }}
