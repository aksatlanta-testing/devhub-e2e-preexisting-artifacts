apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo553847cf-3bfe-4101-bc30-c3d40baad53f.fullname" . }}
  labels:
    {{- include "go-echo553847cf-3bfe-4101-bc30-c3d40baad53f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo553847cf-3bfe-4101-bc30-c3d40baad53f.selectorLabels" . | nindent 6 }}
