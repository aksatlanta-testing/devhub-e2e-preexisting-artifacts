apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo104a3b44-e459-4490-8443-1a8e2968af77.fullname" . }}
  labels:
    {{- include "go-echo104a3b44-e459-4490-8443-1a8e2968af77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo104a3b44-e459-4490-8443-1a8e2968af77.selectorLabels" . | nindent 6 }}
