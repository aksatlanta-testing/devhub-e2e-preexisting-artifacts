apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec1e5b6b-cc49-4ef3-9c85-84d197ac4171.fullname" . }}
  labels:
    {{- include "go-echoec1e5b6b-cc49-4ef3-9c85-84d197ac4171.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec1e5b6b-cc49-4ef3-9c85-84d197ac4171.selectorLabels" . | nindent 6 }}
