apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1630b048-e116-4cc7-afb6-dfa1cf684e1a.fullname" . }}
  labels:
    {{- include "go-echo1630b048-e116-4cc7-afb6-dfa1cf684e1a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1630b048-e116-4cc7-afb6-dfa1cf684e1a.selectorLabels" . | nindent 6 }}
