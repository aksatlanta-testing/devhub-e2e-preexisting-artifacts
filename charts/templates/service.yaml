apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9afff27-b689-4b33-aa68-3562c99c2844.fullname" . }}
  labels:
    {{- include "go-echoc9afff27-b689-4b33-aa68-3562c99c2844.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9afff27-b689-4b33-aa68-3562c99c2844.selectorLabels" . | nindent 6 }}
