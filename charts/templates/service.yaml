apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e2055f9-0d93-4992-91b2-2da8c64e6b0f.fullname" . }}
  labels:
    {{- include "go-echo2e2055f9-0d93-4992-91b2-2da8c64e6b0f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e2055f9-0d93-4992-91b2-2da8c64e6b0f.selectorLabels" . | nindent 6 }}
