apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8a3e3e8-7d7b-4bb2-abd0-4e51247dc0e3.fullname" . }}
  labels:
    {{- include "go-echob8a3e3e8-7d7b-4bb2-abd0-4e51247dc0e3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8a3e3e8-7d7b-4bb2-abd0-4e51247dc0e3.selectorLabels" . | nindent 6 }}
