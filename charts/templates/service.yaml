apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82c033d2-24c0-4614-a5c8-7a10659f8452.fullname" . }}
  labels:
    {{- include "go-echo82c033d2-24c0-4614-a5c8-7a10659f8452.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82c033d2-24c0-4614-a5c8-7a10659f8452.selectorLabels" . | nindent 6 }}
