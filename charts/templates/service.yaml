apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1a2b881-4dfd-49b5-bc78-fb035f86a430.fullname" . }}
  labels:
    {{- include "go-echoe1a2b881-4dfd-49b5-bc78-fb035f86a430.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1a2b881-4dfd-49b5-bc78-fb035f86a430.selectorLabels" . | nindent 6 }}
