apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb897953-d1a7-422b-ada2-7f8be230df83.fullname" . }}
  labels:
    {{- include "go-echofb897953-d1a7-422b-ada2-7f8be230df83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb897953-d1a7-422b-ada2-7f8be230df83.selectorLabels" . | nindent 6 }}
