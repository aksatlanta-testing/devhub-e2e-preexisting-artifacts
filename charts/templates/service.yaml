apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91e7753f-27cf-4d2e-aa4d-c085977098d7.fullname" . }}
  labels:
    {{- include "go-echo91e7753f-27cf-4d2e-aa4d-c085977098d7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91e7753f-27cf-4d2e-aa4d-c085977098d7.selectorLabels" . | nindent 6 }}
