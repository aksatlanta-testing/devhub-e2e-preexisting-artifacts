apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3544057-0df4-4245-bed1-2fe00d70c75e.fullname" . }}
  labels:
    {{- include "go-echoc3544057-0df4-4245-bed1-2fe00d70c75e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3544057-0df4-4245-bed1-2fe00d70c75e.selectorLabels" . | nindent 6 }}
