apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaac7d57c-5ac1-4eb4-a981-596d5649de50.fullname" . }}
  labels:
    {{- include "go-echoaac7d57c-5ac1-4eb4-a981-596d5649de50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaac7d57c-5ac1-4eb4-a981-596d5649de50.selectorLabels" . | nindent 6 }}
