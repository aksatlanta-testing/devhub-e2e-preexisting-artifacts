apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod40d2c9e-3d19-4bc7-a7e8-d0ec6c978b16.fullname" . }}
  labels:
    {{- include "go-echod40d2c9e-3d19-4bc7-a7e8-d0ec6c978b16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod40d2c9e-3d19-4bc7-a7e8-d0ec6c978b16.selectorLabels" . | nindent 6 }}
