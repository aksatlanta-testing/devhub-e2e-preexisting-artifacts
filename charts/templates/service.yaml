apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5f932fc-fbe0-4b47-9d5c-be96ce493cee.fullname" . }}
  labels:
    {{- include "go-echoe5f932fc-fbe0-4b47-9d5c-be96ce493cee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5f932fc-fbe0-4b47-9d5c-be96ce493cee.selectorLabels" . | nindent 6 }}
