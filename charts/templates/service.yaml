apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4423a7b2-d4e1-43e3-8b7c-013253309eb1.fullname" . }}
  labels:
    {{- include "go-echo4423a7b2-d4e1-43e3-8b7c-013253309eb1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4423a7b2-d4e1-43e3-8b7c-013253309eb1.selectorLabels" . | nindent 6 }}
