apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo123f9644-c5b9-4fea-9c71-40e19f1c5a3b.fullname" . }}
  labels:
    {{- include "go-echo123f9644-c5b9-4fea-9c71-40e19f1c5a3b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo123f9644-c5b9-4fea-9c71-40e19f1c5a3b.selectorLabels" . | nindent 6 }}
