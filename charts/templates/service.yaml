apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc3c27d2-2165-46c7-bd44-d690c298a1e4.fullname" . }}
  labels:
    {{- include "go-echofc3c27d2-2165-46c7-bd44-d690c298a1e4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc3c27d2-2165-46c7-bd44-d690c298a1e4.selectorLabels" . | nindent 6 }}
