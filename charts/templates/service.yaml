apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12644911-1ecb-4122-807f-f8743bacb68a.fullname" . }}
  labels:
    {{- include "go-echo12644911-1ecb-4122-807f-f8743bacb68a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12644911-1ecb-4122-807f-f8743bacb68a.selectorLabels" . | nindent 6 }}
