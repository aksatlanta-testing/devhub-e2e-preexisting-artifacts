apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74496446-705c-4e49-933e-80417d011401.fullname" . }}
  labels:
    {{- include "go-echo74496446-705c-4e49-933e-80417d011401.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
