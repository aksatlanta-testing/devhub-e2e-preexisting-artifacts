apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo896aa3f4-c813-4b91-824b-d0ed29f6721e.fullname" . }}
  labels:
    {{- include "go-echo896aa3f4-c813-4b91-824b-d0ed29f6721e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo896aa3f4-c813-4b91-824b-d0ed29f6721e.selectorLabels" . | nindent 6 }}
