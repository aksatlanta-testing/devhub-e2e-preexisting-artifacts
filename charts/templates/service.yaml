apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe761c516-4980-414c-8cb2-63ea8e7929a5.fullname" . }}
  labels:
    {{- include "go-echoe761c516-4980-414c-8cb2-63ea8e7929a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe761c516-4980-414c-8cb2-63ea8e7929a5.selectorLabels" . | nindent 6 }}
