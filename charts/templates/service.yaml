apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc788e83b-f219-407a-8d28-59eb5b760e71.fullname" . }}
  labels:
    {{- include "go-echoc788e83b-f219-407a-8d28-59eb5b760e71.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc788e83b-f219-407a-8d28-59eb5b760e71.selectorLabels" . | nindent 6 }}
