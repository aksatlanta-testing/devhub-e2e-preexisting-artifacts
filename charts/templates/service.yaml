apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof199e68e-7e19-4451-9a03-a87f1f56fd97.fullname" . }}
  labels:
    {{- include "go-echof199e68e-7e19-4451-9a03-a87f1f56fd97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof199e68e-7e19-4451-9a03-a87f1f56fd97.selectorLabels" . | nindent 6 }}
