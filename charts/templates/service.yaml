apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofdce5081-07ef-4e8a-8a1b-8a2afaf9b880.fullname" . }}
  labels:
    {{- include "go-echofdce5081-07ef-4e8a-8a1b-8a2afaf9b880.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofdce5081-07ef-4e8a-8a1b-8a2afaf9b880.selectorLabels" . | nindent 6 }}
