apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7d386be-3cc8-4eea-90b1-b39ce1bcdbfb.fullname" . }}
  labels:
    {{- include "go-echoc7d386be-3cc8-4eea-90b1-b39ce1bcdbfb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7d386be-3cc8-4eea-90b1-b39ce1bcdbfb.selectorLabels" . | nindent 6 }}
