apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb4e67d1-d315-4c4c-82ed-b7bca9e85fe7.fullname" . }}
  labels:
    {{- include "go-echofb4e67d1-d315-4c4c-82ed-b7bca9e85fe7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb4e67d1-d315-4c4c-82ed-b7bca9e85fe7.selectorLabels" . | nindent 6 }}
