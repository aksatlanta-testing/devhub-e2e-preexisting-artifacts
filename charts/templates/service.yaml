apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1baeabbf-2094-44f7-a313-088f84545ecd.fullname" . }}
  labels:
    {{- include "go-echo1baeabbf-2094-44f7-a313-088f84545ecd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1baeabbf-2094-44f7-a313-088f84545ecd.selectorLabels" . | nindent 6 }}
