apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c7860fc-4872-418e-a91e-e1948fe31233.fullname" . }}
  labels:
    {{- include "go-echo1c7860fc-4872-418e-a91e-e1948fe31233.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c7860fc-4872-418e-a91e-e1948fe31233.selectorLabels" . | nindent 6 }}
