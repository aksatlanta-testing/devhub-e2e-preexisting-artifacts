apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7241a84-2830-42b0-8d2f-2d20c42cd360.fullname" . }}
  labels:
    {{- include "go-echob7241a84-2830-42b0-8d2f-2d20c42cd360.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7241a84-2830-42b0-8d2f-2d20c42cd360.selectorLabels" . | nindent 6 }}
