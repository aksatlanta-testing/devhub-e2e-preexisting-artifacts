apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofdd04faf-728b-440d-aaf8-3edee03b7202.fullname" . }}
  labels:
    {{- include "go-echofdd04faf-728b-440d-aaf8-3edee03b7202.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofdd04faf-728b-440d-aaf8-3edee03b7202.selectorLabels" . | nindent 6 }}
