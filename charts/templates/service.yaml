apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a2992b3-5a22-46bd-9de2-206a237ab407.fullname" . }}
  labels:
    {{- include "go-echo0a2992b3-5a22-46bd-9de2-206a237ab407.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a2992b3-5a22-46bd-9de2-206a237ab407.selectorLabels" . | nindent 6 }}
