apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cd3a897-e6d9-4e86-bb7e-746c23ce06a3.fullname" . }}
  labels:
    {{- include "go-echo6cd3a897-e6d9-4e86-bb7e-746c23ce06a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cd3a897-e6d9-4e86-bb7e-746c23ce06a3.selectorLabels" . | nindent 6 }}
