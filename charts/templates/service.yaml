apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37de3019-3092-48ae-aa7b-f1b9096f9ede.fullname" . }}
  labels:
    {{- include "go-echo37de3019-3092-48ae-aa7b-f1b9096f9ede.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37de3019-3092-48ae-aa7b-f1b9096f9ede.selectorLabels" . | nindent 6 }}
