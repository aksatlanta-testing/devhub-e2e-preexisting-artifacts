apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0caafe1a-5e78-4948-8361-9a53dc0bc59e.fullname" . }}
  labels:
    {{- include "go-echo0caafe1a-5e78-4948-8361-9a53dc0bc59e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0caafe1a-5e78-4948-8361-9a53dc0bc59e.selectorLabels" . | nindent 6 }}
