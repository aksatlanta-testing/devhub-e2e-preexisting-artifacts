apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f890d9d-0c11-49d8-9f0d-a8a799245e0f.fullname" . }}
  labels:
    {{- include "go-echo0f890d9d-0c11-49d8-9f0d-a8a799245e0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f890d9d-0c11-49d8-9f0d-a8a799245e0f.selectorLabels" . | nindent 6 }}
