apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8a59c65-d303-4b8e-8d81-1bb4ca4a3325.fullname" . }}
  labels:
    {{- include "go-echoe8a59c65-d303-4b8e-8d81-1bb4ca4a3325.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8a59c65-d303-4b8e-8d81-1bb4ca4a3325.selectorLabels" . | nindent 6 }}
