apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo903dc5cc-ebf9-4031-8e5e-966d19246678.fullname" . }}
  labels:
    {{- include "go-echo903dc5cc-ebf9-4031-8e5e-966d19246678.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo903dc5cc-ebf9-4031-8e5e-966d19246678.selectorLabels" . | nindent 6 }}
