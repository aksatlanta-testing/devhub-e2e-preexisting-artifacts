apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34a95204-818e-4a06-b2eb-8bf7817b5a13.fullname" . }}
  labels:
    {{- include "go-echo34a95204-818e-4a06-b2eb-8bf7817b5a13.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34a95204-818e-4a06-b2eb-8bf7817b5a13.selectorLabels" . | nindent 6 }}
