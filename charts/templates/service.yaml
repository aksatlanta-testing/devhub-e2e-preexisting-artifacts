apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96ed51f3-6e9a-41f3-875b-82eb306bb509.fullname" . }}
  labels:
    {{- include "go-echo96ed51f3-6e9a-41f3-875b-82eb306bb509.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96ed51f3-6e9a-41f3-875b-82eb306bb509.selectorLabels" . | nindent 6 }}
