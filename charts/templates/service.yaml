apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95bd25d9-59f0-44d4-adcf-4edebf1b5c80.fullname" . }}
  labels:
    {{- include "go-echo95bd25d9-59f0-44d4-adcf-4edebf1b5c80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95bd25d9-59f0-44d4-adcf-4edebf1b5c80.selectorLabels" . | nindent 6 }}
