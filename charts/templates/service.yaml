apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9afea10-a021-448b-ba75-b13bc6f11d32.fullname" . }}
  labels:
    {{- include "go-echoa9afea10-a021-448b-ba75-b13bc6f11d32.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9afea10-a021-448b-ba75-b13bc6f11d32.selectorLabels" . | nindent 6 }}
