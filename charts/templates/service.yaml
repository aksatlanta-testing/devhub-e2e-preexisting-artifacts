apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode784c32-cd4d-4ed8-8d41-4123daed92fe.fullname" . }}
  labels:
    {{- include "go-echode784c32-cd4d-4ed8-8d41-4123daed92fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode784c32-cd4d-4ed8-8d41-4123daed92fe.selectorLabels" . | nindent 6 }}
