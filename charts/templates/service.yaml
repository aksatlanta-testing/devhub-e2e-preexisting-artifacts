apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7717375e-11f0-421d-950a-2b9c9a47c79e.fullname" . }}
  labels:
    {{- include "go-echo7717375e-11f0-421d-950a-2b9c9a47c79e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7717375e-11f0-421d-950a-2b9c9a47c79e.selectorLabels" . | nindent 6 }}
