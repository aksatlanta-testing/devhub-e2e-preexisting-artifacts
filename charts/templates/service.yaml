apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2989d05b-6333-43de-ae76-aafa987490d2.fullname" . }}
  labels:
    {{- include "go-echo2989d05b-6333-43de-ae76-aafa987490d2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2989d05b-6333-43de-ae76-aafa987490d2.selectorLabels" . | nindent 6 }}
