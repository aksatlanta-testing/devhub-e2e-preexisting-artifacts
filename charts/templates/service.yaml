apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa62c8246-a4b6-43b6-841c-5c742f87e976.fullname" . }}
  labels:
    {{- include "go-echoa62c8246-a4b6-43b6-841c-5c742f87e976.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa62c8246-a4b6-43b6-841c-5c742f87e976.selectorLabels" . | nindent 6 }}
