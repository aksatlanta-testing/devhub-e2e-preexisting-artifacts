apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa50a79a5-b451-4bc3-83d2-f2f94ff40a8b.fullname" . }}
  labels:
    {{- include "go-echoa50a79a5-b451-4bc3-83d2-f2f94ff40a8b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa50a79a5-b451-4bc3-83d2-f2f94ff40a8b.selectorLabels" . | nindent 6 }}
