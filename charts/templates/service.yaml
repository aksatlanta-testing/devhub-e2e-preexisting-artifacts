apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c54e1fa-ddc2-40cb-a646-a9803844bce0.fullname" . }}
  labels:
    {{- include "go-echo9c54e1fa-ddc2-40cb-a646-a9803844bce0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c54e1fa-ddc2-40cb-a646-a9803844bce0.selectorLabels" . | nindent 6 }}
