apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d7f8842-81f9-4992-ae8f-136e778d7cbd.fullname" . }}
  labels:
    {{- include "go-echo2d7f8842-81f9-4992-ae8f-136e778d7cbd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d7f8842-81f9-4992-ae8f-136e778d7cbd.selectorLabels" . | nindent 6 }}
