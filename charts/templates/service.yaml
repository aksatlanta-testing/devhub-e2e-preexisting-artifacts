apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8f83786-dbd4-4bc0-bb42-6b8e82703d73.fullname" . }}
  labels:
    {{- include "go-echod8f83786-dbd4-4bc0-bb42-6b8e82703d73.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8f83786-dbd4-4bc0-bb42-6b8e82703d73.selectorLabels" . | nindent 6 }}
