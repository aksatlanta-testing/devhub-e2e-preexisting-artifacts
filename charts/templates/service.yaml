apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52c171bf-2429-4b11-99a2-11192a0d082d.fullname" . }}
  labels:
    {{- include "go-echo52c171bf-2429-4b11-99a2-11192a0d082d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52c171bf-2429-4b11-99a2-11192a0d082d.selectorLabels" . | nindent 6 }}
