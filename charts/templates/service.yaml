apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c4635bb-a5fc-48d9-bce6-79dd3f7e8c58.fullname" . }}
  labels:
    {{- include "go-echo8c4635bb-a5fc-48d9-bce6-79dd3f7e8c58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c4635bb-a5fc-48d9-bce6-79dd3f7e8c58.selectorLabels" . | nindent 6 }}
