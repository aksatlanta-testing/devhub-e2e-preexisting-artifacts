apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc9204a8-9802-420c-92fb-41933824a0e3.fullname" . }}
  labels:
    {{- include "go-echobc9204a8-9802-420c-92fb-41933824a0e3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc9204a8-9802-420c-92fb-41933824a0e3.selectorLabels" . | nindent 6 }}
