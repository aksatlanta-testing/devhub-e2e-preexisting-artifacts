apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc94261ec-6a0d-475d-8111-bcddcf0438a3.fullname" . }}
  labels:
    {{- include "go-echoc94261ec-6a0d-475d-8111-bcddcf0438a3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc94261ec-6a0d-475d-8111-bcddcf0438a3.selectorLabels" . | nindent 6 }}
