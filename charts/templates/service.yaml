apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc708c86-0743-403d-8a5d-15e40aa7f154.fullname" . }}
  labels:
    {{- include "go-echocc708c86-0743-403d-8a5d-15e40aa7f154.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc708c86-0743-403d-8a5d-15e40aa7f154.selectorLabels" . | nindent 6 }}
