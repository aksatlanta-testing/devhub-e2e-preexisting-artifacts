apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc4a11c0-2bcd-4049-9909-ba49991c0f95.fullname" . }}
  labels:
    {{- include "go-echofc4a11c0-2bcd-4049-9909-ba49991c0f95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc4a11c0-2bcd-4049-9909-ba49991c0f95.selectorLabels" . | nindent 6 }}
