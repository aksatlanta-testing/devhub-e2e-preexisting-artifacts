apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo310cb5cb-79ce-48ad-bdaa-5c69f6187a58.fullname" . }}
  labels:
    {{- include "go-echo310cb5cb-79ce-48ad-bdaa-5c69f6187a58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo310cb5cb-79ce-48ad-bdaa-5c69f6187a58.selectorLabels" . | nindent 6 }}
