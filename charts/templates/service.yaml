apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa637c8a5-e337-478c-853d-f494064aa08e.fullname" . }}
  labels:
    {{- include "go-echoa637c8a5-e337-478c-853d-f494064aa08e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa637c8a5-e337-478c-853d-f494064aa08e.selectorLabels" . | nindent 6 }}
