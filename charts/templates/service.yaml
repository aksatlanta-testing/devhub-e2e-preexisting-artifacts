apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff5a8e47-cc50-4d8c-8b09-17d758824d37.fullname" . }}
  labels:
    {{- include "go-echoff5a8e47-cc50-4d8c-8b09-17d758824d37.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff5a8e47-cc50-4d8c-8b09-17d758824d37.selectorLabels" . | nindent 6 }}
