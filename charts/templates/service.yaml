apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1957bf73-c973-4aa5-8134-9bdb0e8dcde6.fullname" . }}
  labels:
    {{- include "go-echo1957bf73-c973-4aa5-8134-9bdb0e8dcde6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1957bf73-c973-4aa5-8134-9bdb0e8dcde6.selectorLabels" . | nindent 6 }}
