apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65a7aefb-7c00-4aa3-90cd-5648b6c955ce.fullname" . }}
  labels:
    {{- include "go-echo65a7aefb-7c00-4aa3-90cd-5648b6c955ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65a7aefb-7c00-4aa3-90cd-5648b6c955ce.selectorLabels" . | nindent 6 }}
