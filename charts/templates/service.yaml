apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81c32c24-21f5-4fa0-a0f8-f4fdb6cf2908.fullname" . }}
  labels:
    {{- include "go-echo81c32c24-21f5-4fa0-a0f8-f4fdb6cf2908.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81c32c24-21f5-4fa0-a0f8-f4fdb6cf2908.selectorLabels" . | nindent 6 }}
