apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1b014fe-346a-46c4-9cf7-9829594f8d1e.fullname" . }}
  labels:
    {{- include "go-echod1b014fe-346a-46c4-9cf7-9829594f8d1e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1b014fe-346a-46c4-9cf7-9829594f8d1e.selectorLabels" . | nindent 6 }}
