apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo263361da-95d9-41b4-a687-af636223419d.fullname" . }}
  labels:
    {{- include "go-echo263361da-95d9-41b4-a687-af636223419d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo263361da-95d9-41b4-a687-af636223419d.selectorLabels" . | nindent 6 }}
