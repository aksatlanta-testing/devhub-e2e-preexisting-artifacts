apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo764cbec9-e4a4-48cd-9822-d9b259a21ba8.fullname" . }}
  labels:
    {{- include "go-echo764cbec9-e4a4-48cd-9822-d9b259a21ba8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo764cbec9-e4a4-48cd-9822-d9b259a21ba8.selectorLabels" . | nindent 6 }}
