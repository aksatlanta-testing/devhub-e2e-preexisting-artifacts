apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43b0f2ff-084f-4b43-ba2e-76c0251c79cf.fullname" . }}
  labels:
    {{- include "go-echo43b0f2ff-084f-4b43-ba2e-76c0251c79cf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43b0f2ff-084f-4b43-ba2e-76c0251c79cf.selectorLabels" . | nindent 6 }}
