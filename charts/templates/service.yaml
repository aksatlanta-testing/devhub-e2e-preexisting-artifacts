apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a42eb39-a937-4240-b502-1aff76683336.fullname" . }}
  labels:
    {{- include "go-echo5a42eb39-a937-4240-b502-1aff76683336.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a42eb39-a937-4240-b502-1aff76683336.selectorLabels" . | nindent 6 }}
