apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2d9e2fd-bb74-4844-b6f5-6050e42ab207.fullname" . }}
  labels:
    {{- include "go-echoa2d9e2fd-bb74-4844-b6f5-6050e42ab207.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2d9e2fd-bb74-4844-b6f5-6050e42ab207.selectorLabels" . | nindent 6 }}
