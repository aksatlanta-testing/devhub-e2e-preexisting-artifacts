apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7ae6537-f828-4e92-bbb1-baa5855dce5e.fullname" . }}
  labels:
    {{- include "go-echod7ae6537-f828-4e92-bbb1-baa5855dce5e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7ae6537-f828-4e92-bbb1-baa5855dce5e.selectorLabels" . | nindent 6 }}
