apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37525a1a-eda0-4df8-a2ed-f4ee6a9b01ad.fullname" . }}
  labels:
    {{- include "go-echo37525a1a-eda0-4df8-a2ed-f4ee6a9b01ad.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37525a1a-eda0-4df8-a2ed-f4ee6a9b01ad.selectorLabels" . | nindent 6 }}
