apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45a40bda-7b74-49a8-8b79-4e199a67f869.fullname" . }}
  labels:
    {{- include "go-echo45a40bda-7b74-49a8-8b79-4e199a67f869.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45a40bda-7b74-49a8-8b79-4e199a67f869.selectorLabels" . | nindent 6 }}
