apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb68f121-f667-473e-8b5b-570bb9e2d427.fullname" . }}
  labels:
    {{- include "go-echocb68f121-f667-473e-8b5b-570bb9e2d427.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb68f121-f667-473e-8b5b-570bb9e2d427.selectorLabels" . | nindent 6 }}
