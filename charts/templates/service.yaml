apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6aff21ed-97b7-4e2e-9f02-b807576c2bdd.fullname" . }}
  labels:
    {{- include "go-echo6aff21ed-97b7-4e2e-9f02-b807576c2bdd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6aff21ed-97b7-4e2e-9f02-b807576c2bdd.selectorLabels" . | nindent 6 }}
