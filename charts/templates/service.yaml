apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocef8d723-a406-4146-b984-7823aa82481c.fullname" . }}
  labels:
    {{- include "go-echocef8d723-a406-4146-b984-7823aa82481c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocef8d723-a406-4146-b984-7823aa82481c.selectorLabels" . | nindent 6 }}
