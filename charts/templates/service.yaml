apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc01f9b77-1393-41d5-994a-46b3adc6850b.fullname" . }}
  labels:
    {{- include "go-echoc01f9b77-1393-41d5-994a-46b3adc6850b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc01f9b77-1393-41d5-994a-46b3adc6850b.selectorLabels" . | nindent 6 }}
