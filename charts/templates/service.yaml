apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1b7e94f-20e8-40fe-b346-3ac9f3d5ca20.fullname" . }}
  labels:
    {{- include "go-echof1b7e94f-20e8-40fe-b346-3ac9f3d5ca20.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1b7e94f-20e8-40fe-b346-3ac9f3d5ca20.selectorLabels" . | nindent 6 }}
