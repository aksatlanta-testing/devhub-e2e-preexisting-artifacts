apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46b3f0b0-fb6c-4dbe-a868-955a9ac6ee2d.fullname" . }}
  labels:
    {{- include "go-echo46b3f0b0-fb6c-4dbe-a868-955a9ac6ee2d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46b3f0b0-fb6c-4dbe-a868-955a9ac6ee2d.selectorLabels" . | nindent 6 }}
