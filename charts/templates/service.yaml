apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a697190-da5a-47e5-8520-8ff84ae5380e.fullname" . }}
  labels:
    {{- include "go-echo6a697190-da5a-47e5-8520-8ff84ae5380e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a697190-da5a-47e5-8520-8ff84ae5380e.selectorLabels" . | nindent 6 }}
