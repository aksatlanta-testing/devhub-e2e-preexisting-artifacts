apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabbf314b-2ba6-4a57-9dbd-65f7e012fef3.fullname" . }}
  labels:
    {{- include "go-echoabbf314b-2ba6-4a57-9dbd-65f7e012fef3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabbf314b-2ba6-4a57-9dbd-65f7e012fef3.selectorLabels" . | nindent 6 }}
