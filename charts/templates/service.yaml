apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8787a014-dba2-4baa-b3a0-6bd05a5317c0.fullname" . }}
  labels:
    {{- include "go-echo8787a014-dba2-4baa-b3a0-6bd05a5317c0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8787a014-dba2-4baa-b3a0-6bd05a5317c0.selectorLabels" . | nindent 6 }}
