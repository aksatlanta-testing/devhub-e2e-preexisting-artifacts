apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3fb84db-6da5-44de-ac9d-70f39aaba782.fullname" . }}
  labels:
    {{- include "go-echob3fb84db-6da5-44de-ac9d-70f39aaba782.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3fb84db-6da5-44de-ac9d-70f39aaba782.selectorLabels" . | nindent 6 }}
