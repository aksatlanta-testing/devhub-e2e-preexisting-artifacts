apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91428c11-b799-4287-9008-fab604b65930.fullname" . }}
  labels:
    {{- include "go-echo91428c11-b799-4287-9008-fab604b65930.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91428c11-b799-4287-9008-fab604b65930.selectorLabels" . | nindent 6 }}
