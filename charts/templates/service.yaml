apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6aacd464-27a5-429d-a3bc-9324c21b7558.fullname" . }}
  labels:
    {{- include "go-echo6aacd464-27a5-429d-a3bc-9324c21b7558.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6aacd464-27a5-429d-a3bc-9324c21b7558.selectorLabels" . | nindent 6 }}
