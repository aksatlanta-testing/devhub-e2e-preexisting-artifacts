apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d16c757-9c81-4894-894d-332370784ea1.fullname" . }}
  labels:
    {{- include "go-echo2d16c757-9c81-4894-894d-332370784ea1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d16c757-9c81-4894-894d-332370784ea1.selectorLabels" . | nindent 6 }}
