apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofbb04f29-e93f-418e-ac94-edbb8893a6ac.fullname" . }}
  labels:
    {{- include "go-echofbb04f29-e93f-418e-ac94-edbb8893a6ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofbb04f29-e93f-418e-ac94-edbb8893a6ac.selectorLabels" . | nindent 6 }}
