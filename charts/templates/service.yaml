apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo974e1428-df75-4c4a-8ae7-7e48db2cf357.fullname" . }}
  labels:
    {{- include "go-echo974e1428-df75-4c4a-8ae7-7e48db2cf357.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo974e1428-df75-4c4a-8ae7-7e48db2cf357.selectorLabels" . | nindent 6 }}
