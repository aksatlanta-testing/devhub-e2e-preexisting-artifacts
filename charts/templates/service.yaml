apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b411e5f-30ba-412a-94ee-1694b2d8b950.fullname" . }}
  labels:
    {{- include "go-echo1b411e5f-30ba-412a-94ee-1694b2d8b950.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b411e5f-30ba-412a-94ee-1694b2d8b950.selectorLabels" . | nindent 6 }}
