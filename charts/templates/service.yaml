apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e75d26a-d23c-41e2-bbfa-6ace29f4522b.fullname" . }}
  labels:
    {{- include "go-echo7e75d26a-d23c-41e2-bbfa-6ace29f4522b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e75d26a-d23c-41e2-bbfa-6ace29f4522b.selectorLabels" . | nindent 6 }}
