apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44b0ba20-c532-479d-a0e7-0e6bc87c2828.fullname" . }}
  labels:
    {{- include "go-echo44b0ba20-c532-479d-a0e7-0e6bc87c2828.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44b0ba20-c532-479d-a0e7-0e6bc87c2828.selectorLabels" . | nindent 6 }}
