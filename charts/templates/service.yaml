apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52a7e688-43aa-4ddd-ae5e-59f0c5e02fc3.fullname" . }}
  labels:
    {{- include "go-echo52a7e688-43aa-4ddd-ae5e-59f0c5e02fc3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52a7e688-43aa-4ddd-ae5e-59f0c5e02fc3.selectorLabels" . | nindent 6 }}
