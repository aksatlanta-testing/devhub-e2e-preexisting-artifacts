apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77e5dd73-8467-4e7a-82eb-2c0f3e2229d3.fullname" . }}
  labels:
    {{- include "go-echo77e5dd73-8467-4e7a-82eb-2c0f3e2229d3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77e5dd73-8467-4e7a-82eb-2c0f3e2229d3.selectorLabels" . | nindent 6 }}
