apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49109696-5767-4e1a-8dde-069b4bd84a86.fullname" . }}
  labels:
    {{- include "go-echo49109696-5767-4e1a-8dde-069b4bd84a86.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49109696-5767-4e1a-8dde-069b4bd84a86.selectorLabels" . | nindent 6 }}
