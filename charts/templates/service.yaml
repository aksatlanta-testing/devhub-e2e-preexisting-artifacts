apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05f254d1-2c2e-4266-9330-8ae71aa7dd76.fullname" . }}
  labels:
    {{- include "go-echo05f254d1-2c2e-4266-9330-8ae71aa7dd76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05f254d1-2c2e-4266-9330-8ae71aa7dd76.selectorLabels" . | nindent 6 }}
