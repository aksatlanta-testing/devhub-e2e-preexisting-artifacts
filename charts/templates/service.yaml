apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3bacd5ee-acb2-4332-94c8-4fd448e9326d.fullname" . }}
  labels:
    {{- include "go-echo3bacd5ee-acb2-4332-94c8-4fd448e9326d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3bacd5ee-acb2-4332-94c8-4fd448e9326d.selectorLabels" . | nindent 6 }}
