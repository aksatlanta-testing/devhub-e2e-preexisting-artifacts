apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabf5c7cc-ebc4-4480-969a-06ecf2eb9c5e.fullname" . }}
  labels:
    {{- include "go-echoabf5c7cc-ebc4-4480-969a-06ecf2eb9c5e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabf5c7cc-ebc4-4480-969a-06ecf2eb9c5e.selectorLabels" . | nindent 6 }}
