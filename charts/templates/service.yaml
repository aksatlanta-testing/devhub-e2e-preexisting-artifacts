apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0eb32173-e076-45f9-b2f1-dce31fd4b1f0.fullname" . }}
  labels:
    {{- include "go-echo0eb32173-e076-45f9-b2f1-dce31fd4b1f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0eb32173-e076-45f9-b2f1-dce31fd4b1f0.selectorLabels" . | nindent 6 }}
