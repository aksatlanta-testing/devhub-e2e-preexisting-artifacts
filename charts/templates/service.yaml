apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeea3221d-f565-448f-a0b4-7c9594e16f19.fullname" . }}
  labels:
    {{- include "go-echoeea3221d-f565-448f-a0b4-7c9594e16f19.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeea3221d-f565-448f-a0b4-7c9594e16f19.selectorLabels" . | nindent 6 }}
