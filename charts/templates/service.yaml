apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c96724e-0322-43b3-8ff9-d95d1db836d8.fullname" . }}
  labels:
    {{- include "go-echo8c96724e-0322-43b3-8ff9-d95d1db836d8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c96724e-0322-43b3-8ff9-d95d1db836d8.selectorLabels" . | nindent 6 }}
