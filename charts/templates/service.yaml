apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad3de1bd-3247-44d1-935d-e8b79ac36b55.fullname" . }}
  labels:
    {{- include "go-echoad3de1bd-3247-44d1-935d-e8b79ac36b55.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad3de1bd-3247-44d1-935d-e8b79ac36b55.selectorLabels" . | nindent 6 }}
