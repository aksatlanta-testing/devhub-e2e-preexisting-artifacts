apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27e2503e-4940-4bbf-9fa9-e34542863e91.fullname" . }}
  labels:
    {{- include "go-echo27e2503e-4940-4bbf-9fa9-e34542863e91.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27e2503e-4940-4bbf-9fa9-e34542863e91.selectorLabels" . | nindent 6 }}
