apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2a5e4ff-3521-41a7-8d7b-0a032c9821e9.fullname" . }}
  labels:
    {{- include "go-echob2a5e4ff-3521-41a7-8d7b-0a032c9821e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2a5e4ff-3521-41a7-8d7b-0a032c9821e9.selectorLabels" . | nindent 6 }}
