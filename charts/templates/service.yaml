apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a1b9af9-4d3d-4d47-870a-007b3ae8c87b.fullname" . }}
  labels:
    {{- include "go-echo0a1b9af9-4d3d-4d47-870a-007b3ae8c87b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a1b9af9-4d3d-4d47-870a-007b3ae8c87b.selectorLabels" . | nindent 6 }}
