apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99fbbb1e-d603-4959-b217-30513ddfc686.fullname" . }}
  labels:
    {{- include "go-echo99fbbb1e-d603-4959-b217-30513ddfc686.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99fbbb1e-d603-4959-b217-30513ddfc686.selectorLabels" . | nindent 6 }}
