apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ec5f282-f759-471d-97f7-7bfd798778d8.fullname" . }}
  labels:
    {{- include "go-echo7ec5f282-f759-471d-97f7-7bfd798778d8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ec5f282-f759-471d-97f7-7bfd798778d8.selectorLabels" . | nindent 6 }}
