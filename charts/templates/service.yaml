apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda8a50b9-1b51-429d-a45b-3970a2ec4e2f.fullname" . }}
  labels:
    {{- include "go-echoda8a50b9-1b51-429d-a45b-3970a2ec4e2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda8a50b9-1b51-429d-a45b-3970a2ec4e2f.selectorLabels" . | nindent 6 }}
