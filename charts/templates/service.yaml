apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce86ff63-d5e6-4ecd-8e99-100b0867e0de.fullname" . }}
  labels:
    {{- include "go-echoce86ff63-d5e6-4ecd-8e99-100b0867e0de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce86ff63-d5e6-4ecd-8e99-100b0867e0de.selectorLabels" . | nindent 6 }}
