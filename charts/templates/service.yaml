apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa63d6f7f-644d-4a3c-8995-0aeabb3d9758.fullname" . }}
  labels:
    {{- include "go-echoa63d6f7f-644d-4a3c-8995-0aeabb3d9758.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa63d6f7f-644d-4a3c-8995-0aeabb3d9758.selectorLabels" . | nindent 6 }}
