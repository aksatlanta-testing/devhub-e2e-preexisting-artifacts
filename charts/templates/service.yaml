apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3542e00e-4d5c-4880-b992-536dc470143e.fullname" . }}
  labels:
    {{- include "go-echo3542e00e-4d5c-4880-b992-536dc470143e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3542e00e-4d5c-4880-b992-536dc470143e.selectorLabels" . | nindent 6 }}
