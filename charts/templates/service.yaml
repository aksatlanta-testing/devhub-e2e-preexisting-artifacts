apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fcb6c7e-7b35-481f-9912-1625ad204db8.fullname" . }}
  labels:
    {{- include "go-echo5fcb6c7e-7b35-481f-9912-1625ad204db8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fcb6c7e-7b35-481f-9912-1625ad204db8.selectorLabels" . | nindent 6 }}
