apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod90cb78e-9eac-45bf-b857-7317d2d1babd.fullname" . }}
  labels:
    {{- include "go-echod90cb78e-9eac-45bf-b857-7317d2d1babd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod90cb78e-9eac-45bf-b857-7317d2d1babd.selectorLabels" . | nindent 6 }}
