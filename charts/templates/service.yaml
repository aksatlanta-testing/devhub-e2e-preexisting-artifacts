apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7bc797a2-1e8e-4c2b-8496-341484039100.fullname" . }}
  labels:
    {{- include "go-echo7bc797a2-1e8e-4c2b-8496-341484039100.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7bc797a2-1e8e-4c2b-8496-341484039100.selectorLabels" . | nindent 6 }}
