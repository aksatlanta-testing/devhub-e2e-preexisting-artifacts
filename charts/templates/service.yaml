apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoefb98c7d-bec6-44c5-a1bd-3c3722fc7ede.fullname" . }}
  labels:
    {{- include "go-echoefb98c7d-bec6-44c5-a1bd-3c3722fc7ede.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoefb98c7d-bec6-44c5-a1bd-3c3722fc7ede.selectorLabels" . | nindent 6 }}
