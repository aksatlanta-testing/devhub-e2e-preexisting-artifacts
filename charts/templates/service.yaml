apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c4387e9-fc03-4be5-91f9-2b9735d6a43b.fullname" . }}
  labels:
    {{- include "go-echo5c4387e9-fc03-4be5-91f9-2b9735d6a43b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c4387e9-fc03-4be5-91f9-2b9735d6a43b.selectorLabels" . | nindent 6 }}
