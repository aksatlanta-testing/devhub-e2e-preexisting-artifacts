apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a090f3a-a58d-4019-bcb8-289a8b7bb066.fullname" . }}
  labels:
    {{- include "go-echo5a090f3a-a58d-4019-bcb8-289a8b7bb066.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a090f3a-a58d-4019-bcb8-289a8b7bb066.selectorLabels" . | nindent 6 }}
