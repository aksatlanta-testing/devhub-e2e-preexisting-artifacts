apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46fe6f10-5b54-4f7c-b788-03537c143f91.fullname" . }}
  labels:
    {{- include "go-echo46fe6f10-5b54-4f7c-b788-03537c143f91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46fe6f10-5b54-4f7c-b788-03537c143f91.selectorLabels" . | nindent 6 }}
