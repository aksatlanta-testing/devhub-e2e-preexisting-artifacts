apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe280a9f-7d0d-4c09-8020-33f0893d5e41.fullname" . }}
  labels:
    {{- include "go-echofe280a9f-7d0d-4c09-8020-33f0893d5e41.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe280a9f-7d0d-4c09-8020-33f0893d5e41.selectorLabels" . | nindent 6 }}
