apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63142d23-a401-4e85-9a37-24929b3aef0c.fullname" . }}
  labels:
    {{- include "go-echo63142d23-a401-4e85-9a37-24929b3aef0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63142d23-a401-4e85-9a37-24929b3aef0c.selectorLabels" . | nindent 6 }}
