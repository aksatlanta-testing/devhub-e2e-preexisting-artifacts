apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75dabd98-27a3-4f01-97f2-30b43b3f68f3.fullname" . }}
  labels:
    {{- include "go-echo75dabd98-27a3-4f01-97f2-30b43b3f68f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75dabd98-27a3-4f01-97f2-30b43b3f68f3.selectorLabels" . | nindent 6 }}
