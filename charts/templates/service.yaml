apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80be323e-b98e-4d0e-ad66-24c9ee411144.fullname" . }}
  labels:
    {{- include "go-echo80be323e-b98e-4d0e-ad66-24c9ee411144.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80be323e-b98e-4d0e-ad66-24c9ee411144.selectorLabels" . | nindent 6 }}
