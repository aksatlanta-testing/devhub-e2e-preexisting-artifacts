apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6d25daf-ba3c-498f-a1a7-2005392c2c48.fullname" . }}
  labels:
    {{- include "go-echob6d25daf-ba3c-498f-a1a7-2005392c2c48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6d25daf-ba3c-498f-a1a7-2005392c2c48.selectorLabels" . | nindent 6 }}
