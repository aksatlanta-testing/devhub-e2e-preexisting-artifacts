apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob88c89ef-4c41-4a7c-9095-a184940fe40b.fullname" . }}
  labels:
    {{- include "go-echob88c89ef-4c41-4a7c-9095-a184940fe40b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob88c89ef-4c41-4a7c-9095-a184940fe40b.selectorLabels" . | nindent 6 }}
