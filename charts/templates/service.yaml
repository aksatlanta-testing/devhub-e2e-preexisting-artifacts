apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5752c914-99e6-4ae2-ad60-335513cc2ead.fullname" . }}
  labels:
    {{- include "go-echo5752c914-99e6-4ae2-ad60-335513cc2ead.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5752c914-99e6-4ae2-ad60-335513cc2ead.selectorLabels" . | nindent 6 }}
