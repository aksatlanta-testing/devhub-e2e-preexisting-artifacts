apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9221a83-3fbe-44cd-bd9d-9d5848522661.fullname" . }}
  labels:
    {{- include "go-echoe9221a83-3fbe-44cd-bd9d-9d5848522661.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9221a83-3fbe-44cd-bd9d-9d5848522661.selectorLabels" . | nindent 6 }}
