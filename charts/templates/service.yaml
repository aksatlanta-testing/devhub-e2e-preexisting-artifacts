apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a00e094-da74-40dc-a8ad-e7baa928be15.fullname" . }}
  labels:
    {{- include "go-echo5a00e094-da74-40dc-a8ad-e7baa928be15.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a00e094-da74-40dc-a8ad-e7baa928be15.selectorLabels" . | nindent 6 }}
