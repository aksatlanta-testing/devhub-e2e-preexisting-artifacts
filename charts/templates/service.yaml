apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo179140ad-0ad3-4565-9097-e199641fbd08.fullname" . }}
  labels:
    {{- include "go-echo179140ad-0ad3-4565-9097-e199641fbd08.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo179140ad-0ad3-4565-9097-e199641fbd08.selectorLabels" . | nindent 6 }}
