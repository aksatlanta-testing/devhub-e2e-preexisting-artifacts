apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71219d8b-1338-4da7-be5e-b51a5c2c3902.fullname" . }}
  labels:
    {{- include "go-echo71219d8b-1338-4da7-be5e-b51a5c2c3902.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71219d8b-1338-4da7-be5e-b51a5c2c3902.selectorLabels" . | nindent 6 }}
