apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3449db7b-e63a-4ef1-92eb-de6b85c72510.fullname" . }}
  labels:
    {{- include "go-echo3449db7b-e63a-4ef1-92eb-de6b85c72510.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3449db7b-e63a-4ef1-92eb-de6b85c72510.selectorLabels" . | nindent 6 }}
