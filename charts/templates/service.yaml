apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c86d495-dfe7-47c9-aa05-3d9f826a6277.fullname" . }}
  labels:
    {{- include "go-echo8c86d495-dfe7-47c9-aa05-3d9f826a6277.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c86d495-dfe7-47c9-aa05-3d9f826a6277.selectorLabels" . | nindent 6 }}
