apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b139fee-8372-49a8-8664-43f7c0b91ac4.fullname" . }}
  labels:
    {{- include "go-echo4b139fee-8372-49a8-8664-43f7c0b91ac4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b139fee-8372-49a8-8664-43f7c0b91ac4.selectorLabels" . | nindent 6 }}
