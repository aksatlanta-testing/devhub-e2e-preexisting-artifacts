apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocce106ca-9b4c-40df-a998-c6d0a1076d2d.fullname" . }}
  labels:
    {{- include "go-echocce106ca-9b4c-40df-a998-c6d0a1076d2d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocce106ca-9b4c-40df-a998-c6d0a1076d2d.selectorLabels" . | nindent 6 }}
