apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a4ac1d1-7441-462a-b47b-2acd9718dc8a.fullname" . }}
  labels:
    {{- include "go-echo5a4ac1d1-7441-462a-b47b-2acd9718dc8a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a4ac1d1-7441-462a-b47b-2acd9718dc8a.selectorLabels" . | nindent 6 }}
