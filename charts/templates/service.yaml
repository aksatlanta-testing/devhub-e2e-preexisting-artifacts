apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedc6ad7a-ae65-4783-8fbf-2ba1cf90beec.fullname" . }}
  labels:
    {{- include "go-echoedc6ad7a-ae65-4783-8fbf-2ba1cf90beec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedc6ad7a-ae65-4783-8fbf-2ba1cf90beec.selectorLabels" . | nindent 6 }}
