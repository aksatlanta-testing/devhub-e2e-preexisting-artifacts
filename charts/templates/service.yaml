apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9e9de05-72f7-44b4-a9d2-0c3c116e3a01.fullname" . }}
  labels:
    {{- include "go-echod9e9de05-72f7-44b4-a9d2-0c3c116e3a01.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9e9de05-72f7-44b4-a9d2-0c3c116e3a01.selectorLabels" . | nindent 6 }}
