apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40ba8113-bd5d-48be-b241-6ecb33047961.fullname" . }}
  labels:
    {{- include "go-echo40ba8113-bd5d-48be-b241-6ecb33047961.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40ba8113-bd5d-48be-b241-6ecb33047961.selectorLabels" . | nindent 6 }}
