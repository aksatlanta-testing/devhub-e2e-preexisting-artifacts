apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2862a1a-c402-4bb3-95f6-041a8d9112e1.fullname" . }}
  labels:
    {{- include "go-echoe2862a1a-c402-4bb3-95f6-041a8d9112e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2862a1a-c402-4bb3-95f6-041a8d9112e1.selectorLabels" . | nindent 6 }}
