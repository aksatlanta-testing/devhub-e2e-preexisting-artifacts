apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6f6332a-5e68-4e9f-970b-dc30428268d8.fullname" . }}
  labels:
    {{- include "go-echod6f6332a-5e68-4e9f-970b-dc30428268d8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6f6332a-5e68-4e9f-970b-dc30428268d8.selectorLabels" . | nindent 6 }}
