apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9af99e46-c13a-4403-b12e-2b0b58a9f67f.fullname" . }}
  labels:
    {{- include "go-echo9af99e46-c13a-4403-b12e-2b0b58a9f67f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9af99e46-c13a-4403-b12e-2b0b58a9f67f.selectorLabels" . | nindent 6 }}
