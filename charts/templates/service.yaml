apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6ccc8cf-4018-4323-bcc9-79e170f4b190.fullname" . }}
  labels:
    {{- include "go-echoa6ccc8cf-4018-4323-bcc9-79e170f4b190.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6ccc8cf-4018-4323-bcc9-79e170f4b190.selectorLabels" . | nindent 6 }}
