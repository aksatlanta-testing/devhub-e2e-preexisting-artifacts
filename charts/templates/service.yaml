apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb5def06-66b2-43a9-ab3f-b327390ed6ae.fullname" . }}
  labels:
    {{- include "go-echofb5def06-66b2-43a9-ab3f-b327390ed6ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb5def06-66b2-43a9-ab3f-b327390ed6ae.selectorLabels" . | nindent 6 }}
