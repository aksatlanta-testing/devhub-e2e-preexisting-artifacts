apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e65d2ae-1217-4068-9d5f-1e2267a713e3.fullname" . }}
  labels:
    {{- include "go-echo0e65d2ae-1217-4068-9d5f-1e2267a713e3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e65d2ae-1217-4068-9d5f-1e2267a713e3.selectorLabels" . | nindent 6 }}
