apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob74826c8-365a-463f-b3d5-6382299fc976.fullname" . }}
  labels:
    {{- include "go-echob74826c8-365a-463f-b3d5-6382299fc976.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob74826c8-365a-463f-b3d5-6382299fc976.selectorLabels" . | nindent 6 }}
