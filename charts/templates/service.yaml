apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0da918c6-3906-47d3-b3a7-983a0c600dea.fullname" . }}
  labels:
    {{- include "go-echo0da918c6-3906-47d3-b3a7-983a0c600dea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0da918c6-3906-47d3-b3a7-983a0c600dea.selectorLabels" . | nindent 6 }}
