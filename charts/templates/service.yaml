apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedd22295-68fe-4c7e-a9cc-ea6644a61127.fullname" . }}
  labels:
    {{- include "go-echoedd22295-68fe-4c7e-a9cc-ea6644a61127.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedd22295-68fe-4c7e-a9cc-ea6644a61127.selectorLabels" . | nindent 6 }}
