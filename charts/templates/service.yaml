apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b37498d-6b7a-465c-88ae-41ca2781e40a.fullname" . }}
  labels:
    {{- include "go-echo5b37498d-6b7a-465c-88ae-41ca2781e40a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b37498d-6b7a-465c-88ae-41ca2781e40a.selectorLabels" . | nindent 6 }}
