apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo566f44a1-13a0-447e-8ed1-aa577a310e14.fullname" . }}
  labels:
    {{- include "go-echo566f44a1-13a0-447e-8ed1-aa577a310e14.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo566f44a1-13a0-447e-8ed1-aa577a310e14.selectorLabels" . | nindent 6 }}
