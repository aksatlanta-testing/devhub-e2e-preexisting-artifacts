apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa90ec98e-1bea-41b3-9237-9f2abc245224.fullname" . }}
  labels:
    {{- include "go-echoa90ec98e-1bea-41b3-9237-9f2abc245224.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa90ec98e-1bea-41b3-9237-9f2abc245224.selectorLabels" . | nindent 6 }}
