apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof84e02f5-81ad-46a9-9f40-4f4d607118f7.fullname" . }}
  labels:
    {{- include "go-echof84e02f5-81ad-46a9-9f40-4f4d607118f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof84e02f5-81ad-46a9-9f40-4f4d607118f7.selectorLabels" . | nindent 6 }}
