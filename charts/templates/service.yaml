apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f03bc55-49fc-4149-9a59-7093d32338ed.fullname" . }}
  labels:
    {{- include "go-echo4f03bc55-49fc-4149-9a59-7093d32338ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f03bc55-49fc-4149-9a59-7093d32338ed.selectorLabels" . | nindent 6 }}
