apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2225a8c-fca9-422f-8913-4390e6256c03.fullname" . }}
  labels:
    {{- include "go-echoa2225a8c-fca9-422f-8913-4390e6256c03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2225a8c-fca9-422f-8913-4390e6256c03.selectorLabels" . | nindent 6 }}
