apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a559df9-5823-4b57-a0f3-c18aa7b0c9bf.fullname" . }}
  labels:
    {{- include "go-echo6a559df9-5823-4b57-a0f3-c18aa7b0c9bf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a559df9-5823-4b57-a0f3-c18aa7b0c9bf.selectorLabels" . | nindent 6 }}
