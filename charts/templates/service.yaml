apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo412bd814-b310-4eb7-ba8f-6120ae35b760.fullname" . }}
  labels:
    {{- include "go-echo412bd814-b310-4eb7-ba8f-6120ae35b760.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo412bd814-b310-4eb7-ba8f-6120ae35b760.selectorLabels" . | nindent 6 }}
