apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e1fc6bf-7a64-4915-a514-fa892508f9e6.fullname" . }}
  labels:
    {{- include "go-echo7e1fc6bf-7a64-4915-a514-fa892508f9e6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e1fc6bf-7a64-4915-a514-fa892508f9e6.selectorLabels" . | nindent 6 }}
