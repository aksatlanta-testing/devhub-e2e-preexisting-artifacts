apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a895274-40b9-49ab-bd61-119e5db7c35a.fullname" . }}
  labels:
    {{- include "go-echo0a895274-40b9-49ab-bd61-119e5db7c35a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a895274-40b9-49ab-bd61-119e5db7c35a.selectorLabels" . | nindent 6 }}
