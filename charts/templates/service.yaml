apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a78b0bd-383a-42b7-8fd2-79320a69fc27.fullname" . }}
  labels:
    {{- include "go-echo6a78b0bd-383a-42b7-8fd2-79320a69fc27.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a78b0bd-383a-42b7-8fd2-79320a69fc27.selectorLabels" . | nindent 6 }}
