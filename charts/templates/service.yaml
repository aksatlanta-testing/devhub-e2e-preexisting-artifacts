apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3aa530f0-3787-43db-a032-d0e836d20d32.fullname" . }}
  labels:
    {{- include "go-echo3aa530f0-3787-43db-a032-d0e836d20d32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3aa530f0-3787-43db-a032-d0e836d20d32.selectorLabels" . | nindent 6 }}
