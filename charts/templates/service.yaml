apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc4b8cb8-cadf-43a8-abf5-19f1f91a7bf4.fullname" . }}
  labels:
    {{- include "go-echocc4b8cb8-cadf-43a8-abf5-19f1f91a7bf4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc4b8cb8-cadf-43a8-abf5-19f1f91a7bf4.selectorLabels" . | nindent 6 }}
