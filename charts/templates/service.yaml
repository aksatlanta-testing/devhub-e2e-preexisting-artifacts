apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e2eede5-a280-400e-8d8e-cc622ab8d22e.fullname" . }}
  labels:
    {{- include "go-echo6e2eede5-a280-400e-8d8e-cc622ab8d22e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e2eede5-a280-400e-8d8e-cc622ab8d22e.selectorLabels" . | nindent 6 }}
