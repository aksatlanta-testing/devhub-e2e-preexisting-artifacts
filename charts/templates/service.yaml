apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdef3280-7ef1-402c-a2f5-bff66cfbe77b.fullname" . }}
  labels:
    {{- include "go-echobdef3280-7ef1-402c-a2f5-bff66cfbe77b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdef3280-7ef1-402c-a2f5-bff66cfbe77b.selectorLabels" . | nindent 6 }}
