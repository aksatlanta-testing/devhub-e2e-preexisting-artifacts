apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo04cd5b2a-65b9-4806-8d08-627b6d064e45.fullname" . }}
  labels:
    {{- include "go-echo04cd5b2a-65b9-4806-8d08-627b6d064e45.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo04cd5b2a-65b9-4806-8d08-627b6d064e45.selectorLabels" . | nindent 6 }}
