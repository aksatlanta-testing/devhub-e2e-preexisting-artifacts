apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo317b42a8-30e0-4b2b-8808-14c40266eb50.fullname" . }}
  labels:
    {{- include "go-echo317b42a8-30e0-4b2b-8808-14c40266eb50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo317b42a8-30e0-4b2b-8808-14c40266eb50.selectorLabels" . | nindent 6 }}
