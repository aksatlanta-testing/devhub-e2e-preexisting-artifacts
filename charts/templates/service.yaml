apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo004531ce-cad8-4b39-8ff5-867016e738c1.fullname" . }}
  labels:
    {{- include "go-echo004531ce-cad8-4b39-8ff5-867016e738c1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo004531ce-cad8-4b39-8ff5-867016e738c1.selectorLabels" . | nindent 6 }}
