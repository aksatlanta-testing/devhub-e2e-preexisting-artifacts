apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1fd23f58-306b-4f2c-b021-625f3b83e6da.fullname" . }}
  labels:
    {{- include "go-echo1fd23f58-306b-4f2c-b021-625f3b83e6da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1fd23f58-306b-4f2c-b021-625f3b83e6da.selectorLabels" . | nindent 6 }}
