apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa188e062-0c6f-41a9-afa2-807be58e30c7.fullname" . }}
  labels:
    {{- include "go-echoa188e062-0c6f-41a9-afa2-807be58e30c7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa188e062-0c6f-41a9-afa2-807be58e30c7.selectorLabels" . | nindent 6 }}
