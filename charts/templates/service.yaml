apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4040922b-b56f-444c-985c-063876fca323.fullname" . }}
  labels:
    {{- include "go-echo4040922b-b56f-444c-985c-063876fca323.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4040922b-b56f-444c-985c-063876fca323.selectorLabels" . | nindent 6 }}
