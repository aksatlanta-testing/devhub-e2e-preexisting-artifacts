apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7f575a8-4f59-45e8-8f05-6573d2db68a2.fullname" . }}
  labels:
    {{- include "go-echod7f575a8-4f59-45e8-8f05-6573d2db68a2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7f575a8-4f59-45e8-8f05-6573d2db68a2.selectorLabels" . | nindent 6 }}
