apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoada97b3f-d70c-4f9f-893f-341a3f669ed4.fullname" . }}
  labels:
    {{- include "go-echoada97b3f-d70c-4f9f-893f-341a3f669ed4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoada97b3f-d70c-4f9f-893f-341a3f669ed4.selectorLabels" . | nindent 6 }}
