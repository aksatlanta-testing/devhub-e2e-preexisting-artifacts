apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob98f0d78-163c-4191-958d-520d072a75e5.fullname" . }}
  labels:
    {{- include "go-echob98f0d78-163c-4191-958d-520d072a75e5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob98f0d78-163c-4191-958d-520d072a75e5.selectorLabels" . | nindent 6 }}
