apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3cd9c7d9-9a30-44c2-b2ec-0ac0f12d78cf.fullname" . }}
  labels:
    {{- include "go-echo3cd9c7d9-9a30-44c2-b2ec-0ac0f12d78cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3cd9c7d9-9a30-44c2-b2ec-0ac0f12d78cf.selectorLabels" . | nindent 6 }}
