apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo535033e7-37c4-46e9-8661-0f04a6384d3d.fullname" . }}
  labels:
    {{- include "go-echo535033e7-37c4-46e9-8661-0f04a6384d3d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo535033e7-37c4-46e9-8661-0f04a6384d3d.selectorLabels" . | nindent 6 }}
