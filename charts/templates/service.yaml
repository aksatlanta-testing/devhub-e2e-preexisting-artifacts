apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc144ecdd-73fc-4751-a6e9-698ded1f4ab7.fullname" . }}
  labels:
    {{- include "go-echoc144ecdd-73fc-4751-a6e9-698ded1f4ab7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc144ecdd-73fc-4751-a6e9-698ded1f4ab7.selectorLabels" . | nindent 6 }}
