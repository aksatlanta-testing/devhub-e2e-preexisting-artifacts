apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a747cea-35df-4b62-8707-e956837fd7f7.fullname" . }}
  labels:
    {{- include "go-echo9a747cea-35df-4b62-8707-e956837fd7f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a747cea-35df-4b62-8707-e956837fd7f7.selectorLabels" . | nindent 6 }}
