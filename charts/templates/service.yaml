apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo032c4a0b-fc9a-4996-9b64-a60b66facb4d.fullname" . }}
  labels:
    {{- include "go-echo032c4a0b-fc9a-4996-9b64-a60b66facb4d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo032c4a0b-fc9a-4996-9b64-a60b66facb4d.selectorLabels" . | nindent 6 }}
