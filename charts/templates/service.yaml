apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cba0ca0-d4bf-4cd2-af62-c6f50355ab4a.fullname" . }}
  labels:
    {{- include "go-echo5cba0ca0-d4bf-4cd2-af62-c6f50355ab4a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cba0ca0-d4bf-4cd2-af62-c6f50355ab4a.selectorLabels" . | nindent 6 }}
