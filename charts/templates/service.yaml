apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc51da12a-936b-4df8-afce-953f0172b542.fullname" . }}
  labels:
    {{- include "go-echoc51da12a-936b-4df8-afce-953f0172b542.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc51da12a-936b-4df8-afce-953f0172b542.selectorLabels" . | nindent 6 }}
