apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4086c2b8-e652-4e7c-8b89-615500d0027f.fullname" . }}
  labels:
    {{- include "go-echo4086c2b8-e652-4e7c-8b89-615500d0027f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4086c2b8-e652-4e7c-8b89-615500d0027f.selectorLabels" . | nindent 6 }}
