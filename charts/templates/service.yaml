apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe9cc135-1a26-48cd-869f-dc1ab9d7b66d.fullname" . }}
  labels:
    {{- include "go-echofe9cc135-1a26-48cd-869f-dc1ab9d7b66d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe9cc135-1a26-48cd-869f-dc1ab9d7b66d.selectorLabels" . | nindent 6 }}
