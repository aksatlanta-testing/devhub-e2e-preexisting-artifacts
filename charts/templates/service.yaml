apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a890059-314a-40fa-828b-a442400688ea.fullname" . }}
  labels:
    {{- include "go-echo5a890059-314a-40fa-828b-a442400688ea.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a890059-314a-40fa-828b-a442400688ea.selectorLabels" . | nindent 6 }}
