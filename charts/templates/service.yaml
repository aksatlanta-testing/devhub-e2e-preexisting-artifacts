apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94b618ba-19c3-44e8-aa6e-ca928fb53f47.fullname" . }}
  labels:
    {{- include "go-echo94b618ba-19c3-44e8-aa6e-ca928fb53f47.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94b618ba-19c3-44e8-aa6e-ca928fb53f47.selectorLabels" . | nindent 6 }}
