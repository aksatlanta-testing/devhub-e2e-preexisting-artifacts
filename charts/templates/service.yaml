apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e91150e-55ad-4c8b-bf0f-0c2e5c16f4b2.fullname" . }}
  labels:
    {{- include "go-echo8e91150e-55ad-4c8b-bf0f-0c2e5c16f4b2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e91150e-55ad-4c8b-bf0f-0c2e5c16f4b2.selectorLabels" . | nindent 6 }}
