apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26b28fe1-efae-4b91-ab4f-7f3a4a9f41fc.fullname" . }}
  labels:
    {{- include "go-echo26b28fe1-efae-4b91-ab4f-7f3a4a9f41fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26b28fe1-efae-4b91-ab4f-7f3a4a9f41fc.selectorLabels" . | nindent 6 }}
