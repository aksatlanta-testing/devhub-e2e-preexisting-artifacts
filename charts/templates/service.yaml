apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo254606be-04bf-4b27-89bd-8d51c21c13d4.fullname" . }}
  labels:
    {{- include "go-echo254606be-04bf-4b27-89bd-8d51c21c13d4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo254606be-04bf-4b27-89bd-8d51c21c13d4.selectorLabels" . | nindent 6 }}
