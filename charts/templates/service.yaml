apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob98e4b66-7c48-4e55-8add-54889be26f4e.fullname" . }}
  labels:
    {{- include "go-echob98e4b66-7c48-4e55-8add-54889be26f4e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob98e4b66-7c48-4e55-8add-54889be26f4e.selectorLabels" . | nindent 6 }}
