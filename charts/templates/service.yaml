apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83848b5c-554f-4b1e-9700-224a7d4d6b45.fullname" . }}
  labels:
    {{- include "go-echo83848b5c-554f-4b1e-9700-224a7d4d6b45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83848b5c-554f-4b1e-9700-224a7d4d6b45.selectorLabels" . | nindent 6 }}
