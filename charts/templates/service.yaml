apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6a77796-1cef-4a63-a7b6-9367131386ed.fullname" . }}
  labels:
    {{- include "go-echob6a77796-1cef-4a63-a7b6-9367131386ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6a77796-1cef-4a63-a7b6-9367131386ed.selectorLabels" . | nindent 6 }}
