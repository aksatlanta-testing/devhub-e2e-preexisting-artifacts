apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b8d4e6b-abe4-47ec-bed0-e613f6651ee1.fullname" . }}
  labels:
    {{- include "go-echo9b8d4e6b-abe4-47ec-bed0-e613f6651ee1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b8d4e6b-abe4-47ec-bed0-e613f6651ee1.selectorLabels" . | nindent 6 }}
