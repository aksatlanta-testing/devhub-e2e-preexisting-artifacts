apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8dc9dc90-4427-43de-af61-c6c118db9e63.fullname" . }}
  labels:
    {{- include "go-echo8dc9dc90-4427-43de-af61-c6c118db9e63.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8dc9dc90-4427-43de-af61-c6c118db9e63.selectorLabels" . | nindent 6 }}
