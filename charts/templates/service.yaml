apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce5f182f-b53a-46a0-a8e0-5babf0791167.fullname" . }}
  labels:
    {{- include "go-echoce5f182f-b53a-46a0-a8e0-5babf0791167.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce5f182f-b53a-46a0-a8e0-5babf0791167.selectorLabels" . | nindent 6 }}
