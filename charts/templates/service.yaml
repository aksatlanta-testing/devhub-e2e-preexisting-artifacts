apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo186e9875-c8a8-4c2c-b5d0-4cd00e2ac409.fullname" . }}
  labels:
    {{- include "go-echo186e9875-c8a8-4c2c-b5d0-4cd00e2ac409.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo186e9875-c8a8-4c2c-b5d0-4cd00e2ac409.selectorLabels" . | nindent 6 }}
