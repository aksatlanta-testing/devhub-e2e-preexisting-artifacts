apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2e51188-f92f-4739-ba8c-3124a2c0b9f5.fullname" . }}
  labels:
    {{- include "go-echod2e51188-f92f-4739-ba8c-3124a2c0b9f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2e51188-f92f-4739-ba8c-3124a2c0b9f5.selectorLabels" . | nindent 6 }}
