apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6471aeed-fe54-44c4-8656-45f29021537c.fullname" . }}
  labels:
    {{- include "go-echo6471aeed-fe54-44c4-8656-45f29021537c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6471aeed-fe54-44c4-8656-45f29021537c.selectorLabels" . | nindent 6 }}
