apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31ca9ea6-9ccc-4584-a7c7-ddfcd8b5d83e.fullname" . }}
  labels:
    {{- include "go-echo31ca9ea6-9ccc-4584-a7c7-ddfcd8b5d83e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31ca9ea6-9ccc-4584-a7c7-ddfcd8b5d83e.selectorLabels" . | nindent 6 }}
