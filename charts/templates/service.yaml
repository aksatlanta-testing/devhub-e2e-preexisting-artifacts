apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo863e2570-f417-4548-893e-cdda089ec0fd.fullname" . }}
  labels:
    {{- include "go-echo863e2570-f417-4548-893e-cdda089ec0fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo863e2570-f417-4548-893e-cdda089ec0fd.selectorLabels" . | nindent 6 }}
