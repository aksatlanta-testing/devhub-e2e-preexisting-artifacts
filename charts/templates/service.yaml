apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5cf98a3-e47a-4a9f-8b96-7761c7fbe46a.fullname" . }}
  labels:
    {{- include "go-echob5cf98a3-e47a-4a9f-8b96-7761c7fbe46a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5cf98a3-e47a-4a9f-8b96-7761c7fbe46a.selectorLabels" . | nindent 6 }}
