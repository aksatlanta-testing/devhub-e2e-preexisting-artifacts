apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d8f5f1b-4a9d-4e12-93da-203925ec4a03.fullname" . }}
  labels:
    {{- include "go-echo3d8f5f1b-4a9d-4e12-93da-203925ec4a03.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d8f5f1b-4a9d-4e12-93da-203925ec4a03.selectorLabels" . | nindent 6 }}
