apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe580610-3928-4028-804c-99d3c860e9b7.fullname" . }}
  labels:
    {{- include "go-echobe580610-3928-4028-804c-99d3c860e9b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe580610-3928-4028-804c-99d3c860e9b7.selectorLabels" . | nindent 6 }}
