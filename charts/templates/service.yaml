apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2fc4db4-41db-4c1e-94fb-7d85ac1b0987.fullname" . }}
  labels:
    {{- include "go-echoc2fc4db4-41db-4c1e-94fb-7d85ac1b0987.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2fc4db4-41db-4c1e-94fb-7d85ac1b0987.selectorLabels" . | nindent 6 }}
