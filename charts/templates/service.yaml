apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51d575fa-b651-4d82-bb63-86462f6c5879.fullname" . }}
  labels:
    {{- include "go-echo51d575fa-b651-4d82-bb63-86462f6c5879.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51d575fa-b651-4d82-bb63-86462f6c5879.selectorLabels" . | nindent 6 }}
