apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo200d034d-579a-4e7d-b58a-8db213996d9d.fullname" . }}
  labels:
    {{- include "go-echo200d034d-579a-4e7d-b58a-8db213996d9d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo200d034d-579a-4e7d-b58a-8db213996d9d.selectorLabels" . | nindent 6 }}
