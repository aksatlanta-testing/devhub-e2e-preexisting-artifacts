apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeaf14eab-af2d-4086-8454-ccd5cf9c1fca.fullname" . }}
  labels:
    {{- include "go-echoeaf14eab-af2d-4086-8454-ccd5cf9c1fca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeaf14eab-af2d-4086-8454-ccd5cf9c1fca.selectorLabels" . | nindent 6 }}
