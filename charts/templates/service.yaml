apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo393a73d5-a6fe-4d71-b552-b68f84d0bcd5.fullname" . }}
  labels:
    {{- include "go-echo393a73d5-a6fe-4d71-b552-b68f84d0bcd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo393a73d5-a6fe-4d71-b552-b68f84d0bcd5.selectorLabels" . | nindent 6 }}
