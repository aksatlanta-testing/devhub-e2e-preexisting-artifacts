apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38c5f926-7a6f-43d3-a2b1-caeb369cece6.fullname" . }}
  labels:
    {{- include "go-echo38c5f926-7a6f-43d3-a2b1-caeb369cece6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38c5f926-7a6f-43d3-a2b1-caeb369cece6.selectorLabels" . | nindent 6 }}
