apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo360aa1f9-102d-40d1-90c8-3f94a5581f95.fullname" . }}
  labels:
    {{- include "go-echo360aa1f9-102d-40d1-90c8-3f94a5581f95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo360aa1f9-102d-40d1-90c8-3f94a5581f95.selectorLabels" . | nindent 6 }}
