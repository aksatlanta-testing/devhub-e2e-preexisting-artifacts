apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo938bae60-a881-4669-abfa-e19a20978cb0.fullname" . }}
  labels:
    {{- include "go-echo938bae60-a881-4669-abfa-e19a20978cb0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo938bae60-a881-4669-abfa-e19a20978cb0.selectorLabels" . | nindent 6 }}
