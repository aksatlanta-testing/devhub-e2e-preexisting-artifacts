apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc46ca760-3750-4009-9bc1-8a8d0bbd881a.fullname" . }}
  labels:
    {{- include "go-echoc46ca760-3750-4009-9bc1-8a8d0bbd881a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc46ca760-3750-4009-9bc1-8a8d0bbd881a.selectorLabels" . | nindent 6 }}
