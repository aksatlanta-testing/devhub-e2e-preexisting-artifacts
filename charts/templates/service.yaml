apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45ba7424-1427-4a40-8f72-9ce582585949.fullname" . }}
  labels:
    {{- include "go-echo45ba7424-1427-4a40-8f72-9ce582585949.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45ba7424-1427-4a40-8f72-9ce582585949.selectorLabels" . | nindent 6 }}
