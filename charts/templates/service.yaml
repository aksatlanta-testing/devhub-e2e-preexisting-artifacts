apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9ca17a1-356c-42a5-b450-41a2963f35cf.fullname" . }}
  labels:
    {{- include "go-echof9ca17a1-356c-42a5-b450-41a2963f35cf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9ca17a1-356c-42a5-b450-41a2963f35cf.selectorLabels" . | nindent 6 }}
