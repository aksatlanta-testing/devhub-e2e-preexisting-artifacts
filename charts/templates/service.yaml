apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod712c441-911e-456a-9291-932dd3e96ab0.fullname" . }}
  labels:
    {{- include "go-echod712c441-911e-456a-9291-932dd3e96ab0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod712c441-911e-456a-9291-932dd3e96ab0.selectorLabels" . | nindent 6 }}
