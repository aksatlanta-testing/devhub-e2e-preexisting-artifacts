apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0e8f4eb-5a86-488c-a7e7-e2d15deadcae.fullname" . }}
  labels:
    {{- include "go-echof0e8f4eb-5a86-488c-a7e7-e2d15deadcae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0e8f4eb-5a86-488c-a7e7-e2d15deadcae.selectorLabels" . | nindent 6 }}
