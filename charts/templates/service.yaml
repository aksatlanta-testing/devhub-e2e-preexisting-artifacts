apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof91d4770-521a-448f-a910-f1fc68d5b4b0.fullname" . }}
  labels:
    {{- include "go-echof91d4770-521a-448f-a910-f1fc68d5b4b0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof91d4770-521a-448f-a910-f1fc68d5b4b0.selectorLabels" . | nindent 6 }}
