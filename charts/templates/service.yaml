apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoddf742f8-3291-46a2-afaa-b471891fb507.fullname" . }}
  labels:
    {{- include "go-echoddf742f8-3291-46a2-afaa-b471891fb507.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoddf742f8-3291-46a2-afaa-b471891fb507.selectorLabels" . | nindent 6 }}
