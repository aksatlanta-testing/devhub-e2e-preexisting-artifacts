apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2063ee72-c863-4335-b2f3-1282b9683e8e.fullname" . }}
  labels:
    {{- include "go-echo2063ee72-c863-4335-b2f3-1282b9683e8e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2063ee72-c863-4335-b2f3-1282b9683e8e.selectorLabels" . | nindent 6 }}
