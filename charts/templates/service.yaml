apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb833bea-a30e-44ed-aaa2-9398e19e0fff.fullname" . }}
  labels:
    {{- include "go-echocb833bea-a30e-44ed-aaa2-9398e19e0fff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb833bea-a30e-44ed-aaa2-9398e19e0fff.selectorLabels" . | nindent 6 }}
