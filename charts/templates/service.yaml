apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83ca86d4-ccf4-47b9-8446-ccce457af14d.fullname" . }}
  labels:
    {{- include "go-echo83ca86d4-ccf4-47b9-8446-ccce457af14d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83ca86d4-ccf4-47b9-8446-ccce457af14d.selectorLabels" . | nindent 6 }}
