apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo615e9211-4760-4c6f-9e37-dcc070f0c8eb.fullname" . }}
  labels:
    {{- include "go-echo615e9211-4760-4c6f-9e37-dcc070f0c8eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo615e9211-4760-4c6f-9e37-dcc070f0c8eb.selectorLabels" . | nindent 6 }}
