apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9eb66685-245b-44f7-932e-24a0d5514bd9.fullname" . }}
  labels:
    {{- include "go-echo9eb66685-245b-44f7-932e-24a0d5514bd9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9eb66685-245b-44f7-932e-24a0d5514bd9.selectorLabels" . | nindent 6 }}
