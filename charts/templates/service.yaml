apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87119e0a-b2bc-491e-a826-a9ef375b9eec.fullname" . }}
  labels:
    {{- include "go-echo87119e0a-b2bc-491e-a826-a9ef375b9eec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87119e0a-b2bc-491e-a826-a9ef375b9eec.selectorLabels" . | nindent 6 }}
