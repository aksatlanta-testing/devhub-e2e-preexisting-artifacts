apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64af6bf4-d0b6-41e9-bc05-415ab9fec2c9.fullname" . }}
  labels:
    {{- include "go-echo64af6bf4-d0b6-41e9-bc05-415ab9fec2c9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64af6bf4-d0b6-41e9-bc05-415ab9fec2c9.selectorLabels" . | nindent 6 }}
