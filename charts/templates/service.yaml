apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c82683d-1b05-4829-a7c1-42af6fbcb526.fullname" . }}
  labels:
    {{- include "go-echo8c82683d-1b05-4829-a7c1-42af6fbcb526.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c82683d-1b05-4829-a7c1-42af6fbcb526.selectorLabels" . | nindent 6 }}
