apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a931263-afbc-47f1-b9ee-c2f412afe18d.fullname" . }}
  labels:
    {{- include "go-echo3a931263-afbc-47f1-b9ee-c2f412afe18d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a931263-afbc-47f1-b9ee-c2f412afe18d.selectorLabels" . | nindent 6 }}
