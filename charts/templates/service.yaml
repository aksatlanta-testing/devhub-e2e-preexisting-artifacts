apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3a3d9fd-8209-480a-9b7a-c7404e3233ed.fullname" . }}
  labels:
    {{- include "go-echoe3a3d9fd-8209-480a-9b7a-c7404e3233ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3a3d9fd-8209-480a-9b7a-c7404e3233ed.selectorLabels" . | nindent 6 }}
