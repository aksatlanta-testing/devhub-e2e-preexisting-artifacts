apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a2bd5d3-6b48-4809-883f-302a7d17ad1c.fullname" . }}
  labels:
    {{- include "go-echo9a2bd5d3-6b48-4809-883f-302a7d17ad1c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a2bd5d3-6b48-4809-883f-302a7d17ad1c.selectorLabels" . | nindent 6 }}
