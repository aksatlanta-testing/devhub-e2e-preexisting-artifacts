apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb551ce9-0b93-4787-be38-7ef5c72c9ccc.fullname" . }}
  labels:
    {{- include "go-echobb551ce9-0b93-4787-be38-7ef5c72c9ccc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb551ce9-0b93-4787-be38-7ef5c72c9ccc.selectorLabels" . | nindent 6 }}
