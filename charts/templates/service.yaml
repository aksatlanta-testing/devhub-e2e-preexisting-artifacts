apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2d94503-2de7-4f34-bf60-57608ea6f8e7.fullname" . }}
  labels:
    {{- include "go-echoe2d94503-2de7-4f34-bf60-57608ea6f8e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2d94503-2de7-4f34-bf60-57608ea6f8e7.selectorLabels" . | nindent 6 }}
