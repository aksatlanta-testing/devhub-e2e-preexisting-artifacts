apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cbe4f47-9765-4d3e-959b-a9a417dd58f6.fullname" . }}
  labels:
    {{- include "go-echo4cbe4f47-9765-4d3e-959b-a9a417dd58f6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cbe4f47-9765-4d3e-959b-a9a417dd58f6.selectorLabels" . | nindent 6 }}
