apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c2dd985-dde6-4cfc-bf90-39cbb077148a.fullname" . }}
  labels:
    {{- include "go-echo3c2dd985-dde6-4cfc-bf90-39cbb077148a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c2dd985-dde6-4cfc-bf90-39cbb077148a.selectorLabels" . | nindent 6 }}
