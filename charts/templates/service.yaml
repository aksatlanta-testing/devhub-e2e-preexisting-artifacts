apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodcd5dfc4-2047-4e0d-bc91-f2c551023b2b.fullname" . }}
  labels:
    {{- include "go-echodcd5dfc4-2047-4e0d-bc91-f2c551023b2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodcd5dfc4-2047-4e0d-bc91-f2c551023b2b.selectorLabels" . | nindent 6 }}
