apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9802204-e61d-46de-bf69-53b75147369c.fullname" . }}
  labels:
    {{- include "go-echoa9802204-e61d-46de-bf69-53b75147369c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9802204-e61d-46de-bf69-53b75147369c.selectorLabels" . | nindent 6 }}
