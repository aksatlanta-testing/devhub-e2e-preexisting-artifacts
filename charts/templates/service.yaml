apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b9ada44-796b-4b3a-a6b7-d6658dad7d0b.fullname" . }}
  labels:
    {{- include "go-echo5b9ada44-796b-4b3a-a6b7-d6658dad7d0b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b9ada44-796b-4b3a-a6b7-d6658dad7d0b.selectorLabels" . | nindent 6 }}
