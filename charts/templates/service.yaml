apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe97d7792-45ac-42fd-b635-8d5752cd4ab9.fullname" . }}
  labels:
    {{- include "go-echoe97d7792-45ac-42fd-b635-8d5752cd4ab9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe97d7792-45ac-42fd-b635-8d5752cd4ab9.selectorLabels" . | nindent 6 }}
