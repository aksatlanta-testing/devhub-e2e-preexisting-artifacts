apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo098521ff-052f-41a7-ba5f-f9778ecd2f3b.fullname" . }}
  labels:
    {{- include "go-echo098521ff-052f-41a7-ba5f-f9778ecd2f3b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo098521ff-052f-41a7-ba5f-f9778ecd2f3b.selectorLabels" . | nindent 6 }}
