apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo454fc8bf-9ac2-4643-a962-9d6c11c1b79e.fullname" . }}
  labels:
    {{- include "go-echo454fc8bf-9ac2-4643-a962-9d6c11c1b79e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo454fc8bf-9ac2-4643-a962-9d6c11c1b79e.selectorLabels" . | nindent 6 }}
