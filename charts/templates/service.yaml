apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc0da422-7a8f-4b11-add3-c9a351945fb2.fullname" . }}
  labels:
    {{- include "go-echocc0da422-7a8f-4b11-add3-c9a351945fb2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc0da422-7a8f-4b11-add3-c9a351945fb2.selectorLabels" . | nindent 6 }}
