apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5962b434-ad5f-46f2-a4b2-556774b2a411.fullname" . }}
  labels:
    {{- include "go-echo5962b434-ad5f-46f2-a4b2-556774b2a411.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5962b434-ad5f-46f2-a4b2-556774b2a411.selectorLabels" . | nindent 6 }}
