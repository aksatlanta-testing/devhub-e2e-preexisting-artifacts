apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a92cc58-1278-48ba-861b-288b6927f81c.fullname" . }}
  labels:
    {{- include "go-echo9a92cc58-1278-48ba-861b-288b6927f81c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a92cc58-1278-48ba-861b-288b6927f81c.selectorLabels" . | nindent 6 }}
