apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26f17574-d3f9-4b40-beab-4fe24e1f7911.fullname" . }}
  labels:
    {{- include "go-echo26f17574-d3f9-4b40-beab-4fe24e1f7911.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26f17574-d3f9-4b40-beab-4fe24e1f7911.selectorLabels" . | nindent 6 }}
