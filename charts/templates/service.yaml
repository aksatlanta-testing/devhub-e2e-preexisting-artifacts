apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo718c504b-95c5-4223-8e1e-29087922fc26.fullname" . }}
  labels:
    {{- include "go-echo718c504b-95c5-4223-8e1e-29087922fc26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo718c504b-95c5-4223-8e1e-29087922fc26.selectorLabels" . | nindent 6 }}
