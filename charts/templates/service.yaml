apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfd0f6d8-56d1-4f19-9bd6-a3c1180e12e4.fullname" . }}
  labels:
    {{- include "go-echodfd0f6d8-56d1-4f19-9bd6-a3c1180e12e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfd0f6d8-56d1-4f19-9bd6-a3c1180e12e4.selectorLabels" . | nindent 6 }}
