apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2eaa02e9-cf6c-4b19-bfa9-7f1cec4db8bf.fullname" . }}
  labels:
    {{- include "go-echo2eaa02e9-cf6c-4b19-bfa9-7f1cec4db8bf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2eaa02e9-cf6c-4b19-bfa9-7f1cec4db8bf.selectorLabels" . | nindent 6 }}
