apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5722dbfd-4242-4a34-a907-d94dd4e5a142.fullname" . }}
  labels:
    {{- include "go-echo5722dbfd-4242-4a34-a907-d94dd4e5a142.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5722dbfd-4242-4a34-a907-d94dd4e5a142.selectorLabels" . | nindent 6 }}
