apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo153ed974-61df-4d8a-b605-534d2465192b.fullname" . }}
  labels:
    {{- include "go-echo153ed974-61df-4d8a-b605-534d2465192b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo153ed974-61df-4d8a-b605-534d2465192b.selectorLabels" . | nindent 6 }}
