apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a30f05d-cba3-46a2-9223-5e6bc4dfa2f9.fullname" . }}
  labels:
    {{- include "go-echo1a30f05d-cba3-46a2-9223-5e6bc4dfa2f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a30f05d-cba3-46a2-9223-5e6bc4dfa2f9.selectorLabels" . | nindent 6 }}
