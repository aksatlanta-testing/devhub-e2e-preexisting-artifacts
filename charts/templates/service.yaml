apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3650e527-5ad0-4952-af89-feb7c9f3a206.fullname" . }}
  labels:
    {{- include "go-echo3650e527-5ad0-4952-af89-feb7c9f3a206.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3650e527-5ad0-4952-af89-feb7c9f3a206.selectorLabels" . | nindent 6 }}
