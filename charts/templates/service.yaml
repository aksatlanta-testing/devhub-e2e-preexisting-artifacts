apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8886d71-6148-43c4-8cd6-a7e4b6bca592.fullname" . }}
  labels:
    {{- include "go-echoa8886d71-6148-43c4-8cd6-a7e4b6bca592.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8886d71-6148-43c4-8cd6-a7e4b6bca592.selectorLabels" . | nindent 6 }}
