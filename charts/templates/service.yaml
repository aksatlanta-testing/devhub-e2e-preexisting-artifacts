apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4140fa3-166f-4910-9a63-20552b0ad017.fullname" . }}
  labels:
    {{- include "go-echob4140fa3-166f-4910-9a63-20552b0ad017.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4140fa3-166f-4910-9a63-20552b0ad017.selectorLabels" . | nindent 6 }}
