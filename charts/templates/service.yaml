apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod75a8c59-abce-4279-a4bd-f29c72661e78.fullname" . }}
  labels:
    {{- include "go-echod75a8c59-abce-4279-a4bd-f29c72661e78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod75a8c59-abce-4279-a4bd-f29c72661e78.selectorLabels" . | nindent 6 }}
