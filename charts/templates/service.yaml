apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35066368-e185-4430-9192-65c2c041a83c.fullname" . }}
  labels:
    {{- include "go-echo35066368-e185-4430-9192-65c2c041a83c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35066368-e185-4430-9192-65c2c041a83c.selectorLabels" . | nindent 6 }}
