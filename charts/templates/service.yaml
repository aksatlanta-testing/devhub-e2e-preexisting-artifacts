apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1c1d9da-4674-45a2-8a08-56012625f9b1.fullname" . }}
  labels:
    {{- include "go-echob1c1d9da-4674-45a2-8a08-56012625f9b1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1c1d9da-4674-45a2-8a08-56012625f9b1.selectorLabels" . | nindent 6 }}
