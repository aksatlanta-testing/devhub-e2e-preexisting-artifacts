apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac136518-f12b-4498-a222-c29d1d861d75.fullname" . }}
  labels:
    {{- include "go-echoac136518-f12b-4498-a222-c29d1d861d75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac136518-f12b-4498-a222-c29d1d861d75.selectorLabels" . | nindent 6 }}
