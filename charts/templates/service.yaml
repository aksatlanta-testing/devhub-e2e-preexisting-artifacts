apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a1c42a1-f0cf-4750-8683-225acfe75555.fullname" . }}
  labels:
    {{- include "go-echo3a1c42a1-f0cf-4750-8683-225acfe75555.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a1c42a1-f0cf-4750-8683-225acfe75555.selectorLabels" . | nindent 6 }}
