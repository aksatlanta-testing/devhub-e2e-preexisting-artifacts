apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe178141-b69f-4290-b5c9-9fde27cf34be.fullname" . }}
  labels:
    {{- include "go-echobe178141-b69f-4290-b5c9-9fde27cf34be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe178141-b69f-4290-b5c9-9fde27cf34be.selectorLabels" . | nindent 6 }}
