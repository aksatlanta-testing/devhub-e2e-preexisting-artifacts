apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo157f4efa-0202-4f67-8bf3-485ebd015add.fullname" . }}
  labels:
    {{- include "go-echo157f4efa-0202-4f67-8bf3-485ebd015add.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo157f4efa-0202-4f67-8bf3-485ebd015add.selectorLabels" . | nindent 6 }}
