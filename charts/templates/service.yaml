apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfc16b6e-95e7-4968-ab7d-62bd73f800b1.fullname" . }}
  labels:
    {{- include "go-echodfc16b6e-95e7-4968-ab7d-62bd73f800b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfc16b6e-95e7-4968-ab7d-62bd73f800b1.selectorLabels" . | nindent 6 }}
