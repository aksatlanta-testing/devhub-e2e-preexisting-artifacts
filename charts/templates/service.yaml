apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51910c21-625b-455b-bdad-5387d1a01b93.fullname" . }}
  labels:
    {{- include "go-echo51910c21-625b-455b-bdad-5387d1a01b93.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51910c21-625b-455b-bdad-5387d1a01b93.selectorLabels" . | nindent 6 }}
