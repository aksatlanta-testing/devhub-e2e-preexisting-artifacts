apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod274c8bd-27d9-45e6-bc7d-65c1ba1dc8f3.fullname" . }}
  labels:
    {{- include "go-echod274c8bd-27d9-45e6-bc7d-65c1ba1dc8f3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod274c8bd-27d9-45e6-bc7d-65c1ba1dc8f3.selectorLabels" . | nindent 6 }}
