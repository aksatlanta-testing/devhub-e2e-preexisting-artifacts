apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc90e004-5e21-45e9-957b-a1c5f981232e.fullname" . }}
  labels:
    {{- include "go-echocc90e004-5e21-45e9-957b-a1c5f981232e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc90e004-5e21-45e9-957b-a1c5f981232e.selectorLabels" . | nindent 6 }}
