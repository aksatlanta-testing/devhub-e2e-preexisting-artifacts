apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdf7b10d-b370-4a0e-9f1b-29f4c20dee38.fullname" . }}
  labels:
    {{- include "go-echobdf7b10d-b370-4a0e-9f1b-29f4c20dee38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdf7b10d-b370-4a0e-9f1b-29f4c20dee38.selectorLabels" . | nindent 6 }}
