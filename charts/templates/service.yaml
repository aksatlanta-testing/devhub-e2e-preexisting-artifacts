apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a9f262e-a7e3-4660-a65b-5a5b2296e7ed.fullname" . }}
  labels:
    {{- include "go-echo2a9f262e-a7e3-4660-a65b-5a5b2296e7ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a9f262e-a7e3-4660-a65b-5a5b2296e7ed.selectorLabels" . | nindent 6 }}
