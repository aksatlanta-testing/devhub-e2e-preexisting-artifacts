apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo498622a0-d8e5-483c-ad6d-ded30848272f.fullname" . }}
  labels:
    {{- include "go-echo498622a0-d8e5-483c-ad6d-ded30848272f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo498622a0-d8e5-483c-ad6d-ded30848272f.selectorLabels" . | nindent 6 }}
