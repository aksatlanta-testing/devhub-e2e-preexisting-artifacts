apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob75dd3d2-359f-42c5-a433-32e41fac1d6c.fullname" . }}
  labels:
    {{- include "go-echob75dd3d2-359f-42c5-a433-32e41fac1d6c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob75dd3d2-359f-42c5-a433-32e41fac1d6c.selectorLabels" . | nindent 6 }}
