apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo243f8d10-67b9-4b43-8b87-d90dd73f23ac.fullname" . }}
  labels:
    {{- include "go-echo243f8d10-67b9-4b43-8b87-d90dd73f23ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo243f8d10-67b9-4b43-8b87-d90dd73f23ac.selectorLabels" . | nindent 6 }}
