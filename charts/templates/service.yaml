apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa610df62-02b9-41e6-89de-1ca688518a5b.fullname" . }}
  labels:
    {{- include "go-echoa610df62-02b9-41e6-89de-1ca688518a5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa610df62-02b9-41e6-89de-1ca688518a5b.selectorLabels" . | nindent 6 }}
