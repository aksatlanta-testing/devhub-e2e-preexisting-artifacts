apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c13c1eb-93ca-4a34-9087-7b2c53231760.fullname" . }}
  labels:
    {{- include "go-echo8c13c1eb-93ca-4a34-9087-7b2c53231760.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c13c1eb-93ca-4a34-9087-7b2c53231760.selectorLabels" . | nindent 6 }}
