apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5c1804e-64c5-4f13-9878-9fb9993f0355.fullname" . }}
  labels:
    {{- include "go-echoe5c1804e-64c5-4f13-9878-9fb9993f0355.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5c1804e-64c5-4f13-9878-9fb9993f0355.selectorLabels" . | nindent 6 }}
