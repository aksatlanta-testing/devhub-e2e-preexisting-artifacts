apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa77f4757-13ba-4009-ba29-16ead26d0541.fullname" . }}
  labels:
    {{- include "go-echoa77f4757-13ba-4009-ba29-16ead26d0541.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa77f4757-13ba-4009-ba29-16ead26d0541.selectorLabels" . | nindent 6 }}
