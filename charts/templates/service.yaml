apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34815ffc-67ad-41c4-ae77-824fd2ac439b.fullname" . }}
  labels:
    {{- include "go-echo34815ffc-67ad-41c4-ae77-824fd2ac439b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34815ffc-67ad-41c4-ae77-824fd2ac439b.selectorLabels" . | nindent 6 }}
