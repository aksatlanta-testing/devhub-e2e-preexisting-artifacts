apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc0eeb91d-d428-4e38-9199-6f8fd3211df7.fullname" . }}
  labels:
    {{- include "go-echoc0eeb91d-d428-4e38-9199-6f8fd3211df7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc0eeb91d-d428-4e38-9199-6f8fd3211df7.selectorLabels" . | nindent 6 }}
