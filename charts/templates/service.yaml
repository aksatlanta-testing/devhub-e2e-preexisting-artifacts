apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22bf153b-32d4-4df0-8f9a-e6c1bfac3fc8.fullname" . }}
  labels:
    {{- include "go-echo22bf153b-32d4-4df0-8f9a-e6c1bfac3fc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22bf153b-32d4-4df0-8f9a-e6c1bfac3fc8.selectorLabels" . | nindent 6 }}
