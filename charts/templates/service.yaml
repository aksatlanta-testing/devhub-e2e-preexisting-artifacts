apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24ead7be-ef7d-45bc-810a-43e09d5782ce.fullname" . }}
  labels:
    {{- include "go-echo24ead7be-ef7d-45bc-810a-43e09d5782ce.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24ead7be-ef7d-45bc-810a-43e09d5782ce.selectorLabels" . | nindent 6 }}
