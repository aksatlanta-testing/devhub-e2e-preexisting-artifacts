apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdeb9661-6663-49b8-8a7f-71585b5d5292.fullname" . }}
  labels:
    {{- include "go-echobdeb9661-6663-49b8-8a7f-71585b5d5292.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdeb9661-6663-49b8-8a7f-71585b5d5292.selectorLabels" . | nindent 6 }}
