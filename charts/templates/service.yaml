apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe11e0c3e-54a8-4959-8150-74f3fed95cba.fullname" . }}
  labels:
    {{- include "go-echoe11e0c3e-54a8-4959-8150-74f3fed95cba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe11e0c3e-54a8-4959-8150-74f3fed95cba.selectorLabels" . | nindent 6 }}
