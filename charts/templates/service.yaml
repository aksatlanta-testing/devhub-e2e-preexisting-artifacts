apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocae8e5a1-f504-4f17-b1ad-f048bb7f122e.fullname" . }}
  labels:
    {{- include "go-echocae8e5a1-f504-4f17-b1ad-f048bb7f122e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocae8e5a1-f504-4f17-b1ad-f048bb7f122e.selectorLabels" . | nindent 6 }}
