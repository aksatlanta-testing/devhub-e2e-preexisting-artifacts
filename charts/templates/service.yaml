apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c3a78f8-153b-4bac-a0dd-ce80193e1570.fullname" . }}
  labels:
    {{- include "go-echo8c3a78f8-153b-4bac-a0dd-ce80193e1570.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c3a78f8-153b-4bac-a0dd-ce80193e1570.selectorLabels" . | nindent 6 }}
