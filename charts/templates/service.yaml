apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87131cbb-66bb-4bb6-922c-bf531c8a9326.fullname" . }}
  labels:
    {{- include "go-echo87131cbb-66bb-4bb6-922c-bf531c8a9326.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87131cbb-66bb-4bb6-922c-bf531c8a9326.selectorLabels" . | nindent 6 }}
