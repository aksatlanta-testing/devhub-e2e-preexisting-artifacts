apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1c5cbeb-ee25-45ee-8361-4b91a434dae4.fullname" . }}
  labels:
    {{- include "go-echof1c5cbeb-ee25-45ee-8361-4b91a434dae4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1c5cbeb-ee25-45ee-8361-4b91a434dae4.selectorLabels" . | nindent 6 }}
