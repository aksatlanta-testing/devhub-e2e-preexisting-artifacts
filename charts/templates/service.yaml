apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb1245c3-1b7b-4356-867a-a54c15fcca92.fullname" . }}
  labels:
    {{- include "go-echobb1245c3-1b7b-4356-867a-a54c15fcca92.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb1245c3-1b7b-4356-867a-a54c15fcca92.selectorLabels" . | nindent 6 }}
