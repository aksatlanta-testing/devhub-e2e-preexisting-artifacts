apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21b114a7-eb72-43ac-86f3-4d910300b54a.fullname" . }}
  labels:
    {{- include "go-echo21b114a7-eb72-43ac-86f3-4d910300b54a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21b114a7-eb72-43ac-86f3-4d910300b54a.selectorLabels" . | nindent 6 }}
