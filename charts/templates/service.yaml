apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ccf2804-a00c-4fd5-8485-1f2b4dd5ca86.fullname" . }}
  labels:
    {{- include "go-echo6ccf2804-a00c-4fd5-8485-1f2b4dd5ca86.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ccf2804-a00c-4fd5-8485-1f2b4dd5ca86.selectorLabels" . | nindent 6 }}
