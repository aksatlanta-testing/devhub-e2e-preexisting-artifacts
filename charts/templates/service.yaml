apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4dfbc730-9493-4ed3-a9c0-813d28925b5b.fullname" . }}
  labels:
    {{- include "go-echo4dfbc730-9493-4ed3-a9c0-813d28925b5b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4dfbc730-9493-4ed3-a9c0-813d28925b5b.selectorLabels" . | nindent 6 }}
