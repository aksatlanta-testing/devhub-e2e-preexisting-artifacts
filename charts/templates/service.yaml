apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b6c9192-9a0b-454f-b5f8-95a65e37e745.fullname" . }}
  labels:
    {{- include "go-echo3b6c9192-9a0b-454f-b5f8-95a65e37e745.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b6c9192-9a0b-454f-b5f8-95a65e37e745.selectorLabels" . | nindent 6 }}
