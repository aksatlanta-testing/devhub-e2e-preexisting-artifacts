apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4680ebaa-0a65-40e5-9984-5ea8e38c3553.fullname" . }}
  labels:
    {{- include "go-echo4680ebaa-0a65-40e5-9984-5ea8e38c3553.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4680ebaa-0a65-40e5-9984-5ea8e38c3553.selectorLabels" . | nindent 6 }}
