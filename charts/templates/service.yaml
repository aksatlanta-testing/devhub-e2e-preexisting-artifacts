apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47767f92-b8d4-4ea0-a123-044d8002ab78.fullname" . }}
  labels:
    {{- include "go-echo47767f92-b8d4-4ea0-a123-044d8002ab78.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47767f92-b8d4-4ea0-a123-044d8002ab78.selectorLabels" . | nindent 6 }}
