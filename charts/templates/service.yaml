apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed5818dd-2a00-45c4-a1a6-f5f5027279e3.fullname" . }}
  labels:
    {{- include "go-echoed5818dd-2a00-45c4-a1a6-f5f5027279e3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed5818dd-2a00-45c4-a1a6-f5f5027279e3.selectorLabels" . | nindent 6 }}
