apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01f42dc5-b8c2-4d88-b761-1832d57ed0c3.fullname" . }}
  labels:
    {{- include "go-echo01f42dc5-b8c2-4d88-b761-1832d57ed0c3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01f42dc5-b8c2-4d88-b761-1832d57ed0c3.selectorLabels" . | nindent 6 }}
