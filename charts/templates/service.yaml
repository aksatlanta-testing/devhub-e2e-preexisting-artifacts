apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo447a7fcb-89e4-40a9-a34a-ef041475026f.fullname" . }}
  labels:
    {{- include "go-echo447a7fcb-89e4-40a9-a34a-ef041475026f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo447a7fcb-89e4-40a9-a34a-ef041475026f.selectorLabels" . | nindent 6 }}
