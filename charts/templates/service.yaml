apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9809bf29-8841-41de-945c-09cd3391d80a.fullname" . }}
  labels:
    {{- include "go-echo9809bf29-8841-41de-945c-09cd3391d80a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9809bf29-8841-41de-945c-09cd3391d80a.selectorLabels" . | nindent 6 }}
