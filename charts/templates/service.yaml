apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7608682f-7ed8-4a15-83d4-d4734cdf28f7.fullname" . }}
  labels:
    {{- include "go-echo7608682f-7ed8-4a15-83d4-d4734cdf28f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7608682f-7ed8-4a15-83d4-d4734cdf28f7.selectorLabels" . | nindent 6 }}
