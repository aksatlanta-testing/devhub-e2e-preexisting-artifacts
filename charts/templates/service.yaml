apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef39993f-4f6b-4bea-8d11-ff7352216377.fullname" . }}
  labels:
    {{- include "go-echoef39993f-4f6b-4bea-8d11-ff7352216377.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef39993f-4f6b-4bea-8d11-ff7352216377.selectorLabels" . | nindent 6 }}
