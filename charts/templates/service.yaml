apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80109eb9-2378-4145-aa32-fadbeed1b136.fullname" . }}
  labels:
    {{- include "go-echo80109eb9-2378-4145-aa32-fadbeed1b136.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80109eb9-2378-4145-aa32-fadbeed1b136.selectorLabels" . | nindent 6 }}
