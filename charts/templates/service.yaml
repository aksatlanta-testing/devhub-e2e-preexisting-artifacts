apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa265320d-c104-4140-a6b3-26754f46866b.fullname" . }}
  labels:
    {{- include "go-echoa265320d-c104-4140-a6b3-26754f46866b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa265320d-c104-4140-a6b3-26754f46866b.selectorLabels" . | nindent 6 }}
