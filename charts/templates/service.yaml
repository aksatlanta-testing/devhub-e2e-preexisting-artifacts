apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d28024c-70d8-4dc7-a20f-dc6c446311c7.fullname" . }}
  labels:
    {{- include "go-echo2d28024c-70d8-4dc7-a20f-dc6c446311c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d28024c-70d8-4dc7-a20f-dc6c446311c7.selectorLabels" . | nindent 6 }}
