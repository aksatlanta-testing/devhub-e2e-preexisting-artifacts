apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5212eb8-7768-4a75-bb97-2f1557688cad.fullname" . }}
  labels:
    {{- include "go-echod5212eb8-7768-4a75-bb97-2f1557688cad.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5212eb8-7768-4a75-bb97-2f1557688cad.selectorLabels" . | nindent 6 }}
