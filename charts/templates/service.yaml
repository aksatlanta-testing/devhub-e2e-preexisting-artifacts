apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91d32cad-eb8b-4a07-8f67-99381d6e4ab7.fullname" . }}
  labels:
    {{- include "go-echo91d32cad-eb8b-4a07-8f67-99381d6e4ab7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91d32cad-eb8b-4a07-8f67-99381d6e4ab7.selectorLabels" . | nindent 6 }}
