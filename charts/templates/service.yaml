apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa984bbdd-e9f9-4b69-ba76-e3568ca66b5f.fullname" . }}
  labels:
    {{- include "go-echoa984bbdd-e9f9-4b69-ba76-e3568ca66b5f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa984bbdd-e9f9-4b69-ba76-e3568ca66b5f.selectorLabels" . | nindent 6 }}
