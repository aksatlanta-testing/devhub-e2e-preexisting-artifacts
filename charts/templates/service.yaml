apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2e44d1b-8f95-41b3-8d11-0e6ecd28b67b.fullname" . }}
  labels:
    {{- include "go-echof2e44d1b-8f95-41b3-8d11-0e6ecd28b67b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2e44d1b-8f95-41b3-8d11-0e6ecd28b67b.selectorLabels" . | nindent 6 }}
