apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedc3b405-cb04-405e-a918-708f891ba187.fullname" . }}
  labels:
    {{- include "go-echoedc3b405-cb04-405e-a918-708f891ba187.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedc3b405-cb04-405e-a918-708f891ba187.selectorLabels" . | nindent 6 }}
