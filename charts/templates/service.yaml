apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c1c4ee6-ded3-4d4c-8d78-98e83a0e9ffe.fullname" . }}
  labels:
    {{- include "go-echo7c1c4ee6-ded3-4d4c-8d78-98e83a0e9ffe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c1c4ee6-ded3-4d4c-8d78-98e83a0e9ffe.selectorLabels" . | nindent 6 }}
