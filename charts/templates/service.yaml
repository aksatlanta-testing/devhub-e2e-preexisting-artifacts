apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54cbe2be-c984-4df4-922b-c14a4b52977b.fullname" . }}
  labels:
    {{- include "go-echo54cbe2be-c984-4df4-922b-c14a4b52977b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54cbe2be-c984-4df4-922b-c14a4b52977b.selectorLabels" . | nindent 6 }}
