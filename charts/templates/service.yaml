apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6134c7e-f013-413f-9490-fe07e59e02d7.fullname" . }}
  labels:
    {{- include "go-echoe6134c7e-f013-413f-9490-fe07e59e02d7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6134c7e-f013-413f-9490-fe07e59e02d7.selectorLabels" . | nindent 6 }}
