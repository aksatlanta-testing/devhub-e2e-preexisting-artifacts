apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4e95bc3-3ca0-46ba-851d-d8ae3eb0e4cf.fullname" . }}
  labels:
    {{- include "go-echod4e95bc3-3ca0-46ba-851d-d8ae3eb0e4cf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4e95bc3-3ca0-46ba-851d-d8ae3eb0e4cf.selectorLabels" . | nindent 6 }}
