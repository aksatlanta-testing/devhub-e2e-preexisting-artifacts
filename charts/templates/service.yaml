apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa28252e6-e449-4d4b-8505-8331f4c46aee.fullname" . }}
  labels:
    {{- include "go-echoa28252e6-e449-4d4b-8505-8331f4c46aee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa28252e6-e449-4d4b-8505-8331f4c46aee.selectorLabels" . | nindent 6 }}
