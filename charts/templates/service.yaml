apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c3429f7-f0bd-45fa-ada0-75b28a6f42e6.fullname" . }}
  labels:
    {{- include "go-echo8c3429f7-f0bd-45fa-ada0-75b28a6f42e6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c3429f7-f0bd-45fa-ada0-75b28a6f42e6.selectorLabels" . | nindent 6 }}
