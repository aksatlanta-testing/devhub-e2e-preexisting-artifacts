apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35744e6a-f9d6-46cd-a34f-b3aa81cd7889.fullname" . }}
  labels:
    {{- include "go-echo35744e6a-f9d6-46cd-a34f-b3aa81cd7889.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35744e6a-f9d6-46cd-a34f-b3aa81cd7889.selectorLabels" . | nindent 6 }}
