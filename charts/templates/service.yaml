apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo864590af-a64c-4e8b-8b55-2a4099e5590b.fullname" . }}
  labels:
    {{- include "go-echo864590af-a64c-4e8b-8b55-2a4099e5590b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo864590af-a64c-4e8b-8b55-2a4099e5590b.selectorLabels" . | nindent 6 }}
