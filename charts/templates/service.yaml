apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cb42162-4312-4c62-a003-208c84e5e6ce.fullname" . }}
  labels:
    {{- include "go-echo7cb42162-4312-4c62-a003-208c84e5e6ce.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
