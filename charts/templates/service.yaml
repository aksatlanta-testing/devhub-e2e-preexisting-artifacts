apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fb91808-9076-4bbd-8b33-8f01dc17404e.fullname" . }}
  labels:
    {{- include "go-echo5fb91808-9076-4bbd-8b33-8f01dc17404e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fb91808-9076-4bbd-8b33-8f01dc17404e.selectorLabels" . | nindent 6 }}
