apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d188d96-5fbd-4984-8f3c-7c74ce662723.fullname" . }}
  labels:
    {{- include "go-echo8d188d96-5fbd-4984-8f3c-7c74ce662723.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d188d96-5fbd-4984-8f3c-7c74ce662723.selectorLabels" . | nindent 6 }}
