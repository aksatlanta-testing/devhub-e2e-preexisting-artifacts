apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo788a0a12-c69c-4566-a96b-697c99a4d478.fullname" . }}
  labels:
    {{- include "go-echo788a0a12-c69c-4566-a96b-697c99a4d478.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo788a0a12-c69c-4566-a96b-697c99a4d478.selectorLabels" . | nindent 6 }}
