apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe14f1947-e1a8-4936-82db-239fcbfd5d81.fullname" . }}
  labels:
    {{- include "go-echoe14f1947-e1a8-4936-82db-239fcbfd5d81.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe14f1947-e1a8-4936-82db-239fcbfd5d81.selectorLabels" . | nindent 6 }}
