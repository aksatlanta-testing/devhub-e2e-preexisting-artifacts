apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d06292c-9467-4623-a7eb-e3a0ba46ccdb.fullname" . }}
  labels:
    {{- include "go-echo3d06292c-9467-4623-a7eb-e3a0ba46ccdb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d06292c-9467-4623-a7eb-e3a0ba46ccdb.selectorLabels" . | nindent 6 }}
