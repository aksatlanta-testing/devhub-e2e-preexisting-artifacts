apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9028ec3f-66f6-4b1a-ba69-2e841db7ccde.fullname" . }}
  labels:
    {{- include "go-echo9028ec3f-66f6-4b1a-ba69-2e841db7ccde.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9028ec3f-66f6-4b1a-ba69-2e841db7ccde.selectorLabels" . | nindent 6 }}
