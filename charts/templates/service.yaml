apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo656b687b-6f27-4f5f-9c05-731b0767b120.fullname" . }}
  labels:
    {{- include "go-echo656b687b-6f27-4f5f-9c05-731b0767b120.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo656b687b-6f27-4f5f-9c05-731b0767b120.selectorLabels" . | nindent 6 }}
