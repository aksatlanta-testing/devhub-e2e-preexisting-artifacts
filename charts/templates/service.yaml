apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2b2af0d-91c1-4198-bcdb-87df353c9e6d.fullname" . }}
  labels:
    {{- include "go-echoe2b2af0d-91c1-4198-bcdb-87df353c9e6d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2b2af0d-91c1-4198-bcdb-87df353c9e6d.selectorLabels" . | nindent 6 }}
