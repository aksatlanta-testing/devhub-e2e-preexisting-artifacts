apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo85f05877-6879-4bb9-8a07-d02ac8dc0c09.fullname" . }}
  labels:
    {{- include "go-echo85f05877-6879-4bb9-8a07-d02ac8dc0c09.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo85f05877-6879-4bb9-8a07-d02ac8dc0c09.selectorLabels" . | nindent 6 }}
