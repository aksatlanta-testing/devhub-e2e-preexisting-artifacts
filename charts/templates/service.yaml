apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo932265f9-7619-4a03-81f1-ddcb380f2e68.fullname" . }}
  labels:
    {{- include "go-echo932265f9-7619-4a03-81f1-ddcb380f2e68.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo932265f9-7619-4a03-81f1-ddcb380f2e68.selectorLabels" . | nindent 6 }}
