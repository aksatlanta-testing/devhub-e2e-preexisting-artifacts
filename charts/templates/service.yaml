apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1b2d708-df4f-4778-b4af-65a2d2fef5e2.fullname" . }}
  labels:
    {{- include "go-echod1b2d708-df4f-4778-b4af-65a2d2fef5e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1b2d708-df4f-4778-b4af-65a2d2fef5e2.selectorLabels" . | nindent 6 }}
