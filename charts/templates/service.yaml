apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3b05793-c9e2-4e8f-b41c-a83de2f9b322.fullname" . }}
  labels:
    {{- include "go-echoc3b05793-c9e2-4e8f-b41c-a83de2f9b322.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3b05793-c9e2-4e8f-b41c-a83de2f9b322.selectorLabels" . | nindent 6 }}
