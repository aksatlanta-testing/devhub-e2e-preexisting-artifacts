apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95991378-490e-4f22-9092-adb962caabaf.fullname" . }}
  labels:
    {{- include "go-echo95991378-490e-4f22-9092-adb962caabaf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95991378-490e-4f22-9092-adb962caabaf.selectorLabels" . | nindent 6 }}
