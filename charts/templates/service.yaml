apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15380674-3892-47b7-bb66-b2620c8ee19a.fullname" . }}
  labels:
    {{- include "go-echo15380674-3892-47b7-bb66-b2620c8ee19a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15380674-3892-47b7-bb66-b2620c8ee19a.selectorLabels" . | nindent 6 }}
