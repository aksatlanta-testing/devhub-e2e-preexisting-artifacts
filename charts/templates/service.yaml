apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7039d59a-72b9-482f-9ec5-539848b79c70.fullname" . }}
  labels:
    {{- include "go-echo7039d59a-72b9-482f-9ec5-539848b79c70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7039d59a-72b9-482f-9ec5-539848b79c70.selectorLabels" . | nindent 6 }}
