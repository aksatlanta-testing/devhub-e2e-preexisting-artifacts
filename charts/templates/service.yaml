apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0caa40d3-8768-4625-9a7c-c1cebfd7a7a5.fullname" . }}
  labels:
    {{- include "go-echo0caa40d3-8768-4625-9a7c-c1cebfd7a7a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0caa40d3-8768-4625-9a7c-c1cebfd7a7a5.selectorLabels" . | nindent 6 }}
