apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6aa1f1b4-f63b-4b6d-8223-2da244e2d861.fullname" . }}
  labels:
    {{- include "go-echo6aa1f1b4-f63b-4b6d-8223-2da244e2d861.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6aa1f1b4-f63b-4b6d-8223-2da244e2d861.selectorLabels" . | nindent 6 }}
