apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4afece32-8b94-4a8b-9a2a-2368418fc3e2.fullname" . }}
  labels:
    {{- include "go-echo4afece32-8b94-4a8b-9a2a-2368418fc3e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4afece32-8b94-4a8b-9a2a-2368418fc3e2.selectorLabels" . | nindent 6 }}
