apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9da8dcbc-739f-4e88-bb13-435756fbf94b.fullname" . }}
  labels:
    {{- include "go-echo9da8dcbc-739f-4e88-bb13-435756fbf94b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9da8dcbc-739f-4e88-bb13-435756fbf94b.selectorLabels" . | nindent 6 }}
