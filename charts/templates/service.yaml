apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo56920441-1dc6-4ee4-afbf-dfd2d3543460.fullname" . }}
  labels:
    {{- include "go-echo56920441-1dc6-4ee4-afbf-dfd2d3543460.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo56920441-1dc6-4ee4-afbf-dfd2d3543460.selectorLabels" . | nindent 6 }}
