apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9aa50ff-5a41-42b0-a10e-26ba1cbcd974.fullname" . }}
  labels:
    {{- include "go-echod9aa50ff-5a41-42b0-a10e-26ba1cbcd974.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9aa50ff-5a41-42b0-a10e-26ba1cbcd974.selectorLabels" . | nindent 6 }}
