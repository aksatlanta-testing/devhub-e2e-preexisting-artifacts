apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2ddd1b7-422d-4f1c-88e7-2447fac3c321.fullname" . }}
  labels:
    {{- include "go-echob2ddd1b7-422d-4f1c-88e7-2447fac3c321.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2ddd1b7-422d-4f1c-88e7-2447fac3c321.selectorLabels" . | nindent 6 }}
