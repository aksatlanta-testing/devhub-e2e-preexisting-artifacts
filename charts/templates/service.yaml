apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd58ebe1-9447-461a-a733-65039d4f10f8.fullname" . }}
  labels:
    {{- include "go-echodd58ebe1-9447-461a-a733-65039d4f10f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd58ebe1-9447-461a-a733-65039d4f10f8.selectorLabels" . | nindent 6 }}
