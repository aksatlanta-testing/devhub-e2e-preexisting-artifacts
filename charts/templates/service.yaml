apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed9d5623-4cf9-4575-b538-1cda7934ec7e.fullname" . }}
  labels:
    {{- include "go-echoed9d5623-4cf9-4575-b538-1cda7934ec7e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed9d5623-4cf9-4575-b538-1cda7934ec7e.selectorLabels" . | nindent 6 }}
