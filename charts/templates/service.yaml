apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod67acde6-3bb7-4c83-9e7d-0596ec33c10b.fullname" . }}
  labels:
    {{- include "go-echod67acde6-3bb7-4c83-9e7d-0596ec33c10b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod67acde6-3bb7-4c83-9e7d-0596ec33c10b.selectorLabels" . | nindent 6 }}
