apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f53f5d9-1eb7-407b-8236-7aa6ff2bc378.fullname" . }}
  labels:
    {{- include "go-echo2f53f5d9-1eb7-407b-8236-7aa6ff2bc378.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f53f5d9-1eb7-407b-8236-7aa6ff2bc378.selectorLabels" . | nindent 6 }}
