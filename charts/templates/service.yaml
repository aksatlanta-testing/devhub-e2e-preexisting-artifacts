apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda382d8f-4a0b-4c06-a8d4-9145ae6d7979.fullname" . }}
  labels:
    {{- include "go-echoda382d8f-4a0b-4c06-a8d4-9145ae6d7979.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda382d8f-4a0b-4c06-a8d4-9145ae6d7979.selectorLabels" . | nindent 6 }}
