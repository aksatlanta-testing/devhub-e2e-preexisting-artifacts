apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01140192-559e-4cbd-bc97-4a5eef0076b0.fullname" . }}
  labels:
    {{- include "go-echo01140192-559e-4cbd-bc97-4a5eef0076b0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01140192-559e-4cbd-bc97-4a5eef0076b0.selectorLabels" . | nindent 6 }}
