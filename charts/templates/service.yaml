apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2478310f-581f-438d-ba10-824a1fdedbbc.fullname" . }}
  labels:
    {{- include "go-echo2478310f-581f-438d-ba10-824a1fdedbbc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2478310f-581f-438d-ba10-824a1fdedbbc.selectorLabels" . | nindent 6 }}
