apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe321242b-4f87-43cb-9b5a-168a37c27d96.fullname" . }}
  labels:
    {{- include "go-echoe321242b-4f87-43cb-9b5a-168a37c27d96.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe321242b-4f87-43cb-9b5a-168a37c27d96.selectorLabels" . | nindent 6 }}
