apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b8d8050-1da0-4bf6-ac85-ce5538834a23.fullname" . }}
  labels:
    {{- include "go-echo8b8d8050-1da0-4bf6-ac85-ce5538834a23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b8d8050-1da0-4bf6-ac85-ce5538834a23.selectorLabels" . | nindent 6 }}
