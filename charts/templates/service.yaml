apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29cc9a03-0a07-4723-9054-43b156668028.fullname" . }}
  labels:
    {{- include "go-echo29cc9a03-0a07-4723-9054-43b156668028.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29cc9a03-0a07-4723-9054-43b156668028.selectorLabels" . | nindent 6 }}
