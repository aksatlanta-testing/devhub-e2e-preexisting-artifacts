apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4740e63-748b-43ac-bb8c-6e4920c82ea2.fullname" . }}
  labels:
    {{- include "go-echoc4740e63-748b-43ac-bb8c-6e4920c82ea2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4740e63-748b-43ac-bb8c-6e4920c82ea2.selectorLabels" . | nindent 6 }}
