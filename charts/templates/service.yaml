apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57250ee2-d194-4785-aa7a-8d64f6e79724.fullname" . }}
  labels:
    {{- include "go-echo57250ee2-d194-4785-aa7a-8d64f6e79724.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57250ee2-d194-4785-aa7a-8d64f6e79724.selectorLabels" . | nindent 6 }}
