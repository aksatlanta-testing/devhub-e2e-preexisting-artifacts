apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1560fd1d-61e8-4426-81af-9058f728f4af.fullname" . }}
  labels:
    {{- include "go-echo1560fd1d-61e8-4426-81af-9058f728f4af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1560fd1d-61e8-4426-81af-9058f728f4af.selectorLabels" . | nindent 6 }}
