apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cd4cf59-254c-449b-9ac4-3d869d69bbb1.fullname" . }}
  labels:
    {{- include "go-echo4cd4cf59-254c-449b-9ac4-3d869d69bbb1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cd4cf59-254c-449b-9ac4-3d869d69bbb1.selectorLabels" . | nindent 6 }}
