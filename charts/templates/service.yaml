apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68f8504c-3fad-4e56-b798-c87268eaeb30.fullname" . }}
  labels:
    {{- include "go-echo68f8504c-3fad-4e56-b798-c87268eaeb30.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68f8504c-3fad-4e56-b798-c87268eaeb30.selectorLabels" . | nindent 6 }}
