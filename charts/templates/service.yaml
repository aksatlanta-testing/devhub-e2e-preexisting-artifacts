apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23310afa-5bd2-4eb1-8862-4b011eac205c.fullname" . }}
  labels:
    {{- include "go-echo23310afa-5bd2-4eb1-8862-4b011eac205c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23310afa-5bd2-4eb1-8862-4b011eac205c.selectorLabels" . | nindent 6 }}
