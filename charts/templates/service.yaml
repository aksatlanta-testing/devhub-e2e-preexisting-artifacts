apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa83bd705-ea08-4d62-b4e0-ac7497e568a4.fullname" . }}
  labels:
    {{- include "go-echoa83bd705-ea08-4d62-b4e0-ac7497e568a4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa83bd705-ea08-4d62-b4e0-ac7497e568a4.selectorLabels" . | nindent 6 }}
