apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54115407-c57a-4f80-aee7-65b8e903728b.fullname" . }}
  labels:
    {{- include "go-echo54115407-c57a-4f80-aee7-65b8e903728b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54115407-c57a-4f80-aee7-65b8e903728b.selectorLabels" . | nindent 6 }}
