apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1a15c79-d760-473c-a956-1b772d384032.fullname" . }}
  labels:
    {{- include "go-echob1a15c79-d760-473c-a956-1b772d384032.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
