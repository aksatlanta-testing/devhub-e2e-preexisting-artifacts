apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a590efe-f02b-4c80-925f-8b4216fadfbf.fullname" . }}
  labels:
    {{- include "go-echo4a590efe-f02b-4c80-925f-8b4216fadfbf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a590efe-f02b-4c80-925f-8b4216fadfbf.selectorLabels" . | nindent 6 }}
