apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5941345-f901-4705-87cb-ef229e621df1.fullname" . }}
  labels:
    {{- include "go-echob5941345-f901-4705-87cb-ef229e621df1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5941345-f901-4705-87cb-ef229e621df1.selectorLabels" . | nindent 6 }}
