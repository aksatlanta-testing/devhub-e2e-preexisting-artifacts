apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ea38ca9-2606-4e24-b1f0-4166a3ea20f4.fullname" . }}
  labels:
    {{- include "go-echo6ea38ca9-2606-4e24-b1f0-4166a3ea20f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ea38ca9-2606-4e24-b1f0-4166a3ea20f4.selectorLabels" . | nindent 6 }}
