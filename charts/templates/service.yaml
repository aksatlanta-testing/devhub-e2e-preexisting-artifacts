apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38fb04a0-50c0-48f9-99b4-9d2d80643824.fullname" . }}
  labels:
    {{- include "go-echo38fb04a0-50c0-48f9-99b4-9d2d80643824.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38fb04a0-50c0-48f9-99b4-9d2d80643824.selectorLabels" . | nindent 6 }}
