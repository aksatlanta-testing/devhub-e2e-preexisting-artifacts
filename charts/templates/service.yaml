apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07457b3c-6acc-45d6-a9ad-fe04ba09b8f0.fullname" . }}
  labels:
    {{- include "go-echo07457b3c-6acc-45d6-a9ad-fe04ba09b8f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07457b3c-6acc-45d6-a9ad-fe04ba09b8f0.selectorLabels" . | nindent 6 }}
