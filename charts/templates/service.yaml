apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3130111-3ff9-4672-a3ba-6536d3fdf1f3.fullname" . }}
  labels:
    {{- include "go-echob3130111-3ff9-4672-a3ba-6536d3fdf1f3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3130111-3ff9-4672-a3ba-6536d3fdf1f3.selectorLabels" . | nindent 6 }}
