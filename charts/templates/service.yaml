apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo970feed7-a8c1-4b99-a6d2-7a79e6c7e821.fullname" . }}
  labels:
    {{- include "go-echo970feed7-a8c1-4b99-a6d2-7a79e6c7e821.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo970feed7-a8c1-4b99-a6d2-7a79e6c7e821.selectorLabels" . | nindent 6 }}
