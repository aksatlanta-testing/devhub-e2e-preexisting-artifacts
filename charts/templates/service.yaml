apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48b03e24-00e8-47a9-b3b0-4b9f265c7373.fullname" . }}
  labels:
    {{- include "go-echo48b03e24-00e8-47a9-b3b0-4b9f265c7373.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48b03e24-00e8-47a9-b3b0-4b9f265c7373.selectorLabels" . | nindent 6 }}
