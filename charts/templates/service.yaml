apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ced6612-71b6-4308-ae01-6898394c3ac5.fullname" . }}
  labels:
    {{- include "go-echo2ced6612-71b6-4308-ae01-6898394c3ac5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ced6612-71b6-4308-ae01-6898394c3ac5.selectorLabels" . | nindent 6 }}
