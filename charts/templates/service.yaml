apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94d875f8-a02b-4dd8-aeb2-e4a480516666.fullname" . }}
  labels:
    {{- include "go-echo94d875f8-a02b-4dd8-aeb2-e4a480516666.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94d875f8-a02b-4dd8-aeb2-e4a480516666.selectorLabels" . | nindent 6 }}
