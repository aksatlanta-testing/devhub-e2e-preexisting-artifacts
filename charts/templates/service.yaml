apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2b8fef4-46f5-4fa9-ba88-0da833c188e7.fullname" . }}
  labels:
    {{- include "go-echof2b8fef4-46f5-4fa9-ba88-0da833c188e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2b8fef4-46f5-4fa9-ba88-0da833c188e7.selectorLabels" . | nindent 6 }}
