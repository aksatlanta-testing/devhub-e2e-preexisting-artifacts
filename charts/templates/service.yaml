apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f923078-cd87-41ac-98a0-9c7ed8c42879.fullname" . }}
  labels:
    {{- include "go-echo9f923078-cd87-41ac-98a0-9c7ed8c42879.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f923078-cd87-41ac-98a0-9c7ed8c42879.selectorLabels" . | nindent 6 }}
