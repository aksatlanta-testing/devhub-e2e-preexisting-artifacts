apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84ec9734-a6ac-4e63-9aef-be62fd8aceb2.fullname" . }}
  labels:
    {{- include "go-echo84ec9734-a6ac-4e63-9aef-be62fd8aceb2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84ec9734-a6ac-4e63-9aef-be62fd8aceb2.selectorLabels" . | nindent 6 }}
