apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebe9583a-6573-46ed-aaef-26cbc9bc104a.fullname" . }}
  labels:
    {{- include "go-echoebe9583a-6573-46ed-aaef-26cbc9bc104a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebe9583a-6573-46ed-aaef-26cbc9bc104a.selectorLabels" . | nindent 6 }}
