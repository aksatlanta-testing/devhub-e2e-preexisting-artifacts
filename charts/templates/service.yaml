apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoded0b8e0-c378-4ead-9b28-f5e4ded7e071.fullname" . }}
  labels:
    {{- include "go-echoded0b8e0-c378-4ead-9b28-f5e4ded7e071.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoded0b8e0-c378-4ead-9b28-f5e4ded7e071.selectorLabels" . | nindent 6 }}
