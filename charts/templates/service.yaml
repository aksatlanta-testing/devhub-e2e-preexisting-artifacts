apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41f1c609-0020-457a-a408-a83b1d8f7aa6.fullname" . }}
  labels:
    {{- include "go-echo41f1c609-0020-457a-a408-a83b1d8f7aa6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41f1c609-0020-457a-a408-a83b1d8f7aa6.selectorLabels" . | nindent 6 }}
