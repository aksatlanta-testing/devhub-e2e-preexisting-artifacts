apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa42b26bc-a78f-48f8-b786-c5c787c038c8.fullname" . }}
  labels:
    {{- include "go-echoa42b26bc-a78f-48f8-b786-c5c787c038c8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa42b26bc-a78f-48f8-b786-c5c787c038c8.selectorLabels" . | nindent 6 }}
