apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe395ee73-1480-4907-b0a7-4d3a2d206c7b.fullname" . }}
  labels:
    {{- include "go-echoe395ee73-1480-4907-b0a7-4d3a2d206c7b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe395ee73-1480-4907-b0a7-4d3a2d206c7b.selectorLabels" . | nindent 6 }}
