apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f490535-9bfb-46d3-aa1c-be9058acf3d9.fullname" . }}
  labels:
    {{- include "go-echo5f490535-9bfb-46d3-aa1c-be9058acf3d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f490535-9bfb-46d3-aa1c-be9058acf3d9.selectorLabels" . | nindent 6 }}
