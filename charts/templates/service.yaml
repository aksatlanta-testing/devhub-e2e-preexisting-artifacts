apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7a18250-ad8c-4023-b151-640b4b7c1dfc.fullname" . }}
  labels:
    {{- include "go-echoc7a18250-ad8c-4023-b151-640b4b7c1dfc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7a18250-ad8c-4023-b151-640b4b7c1dfc.selectorLabels" . | nindent 6 }}
