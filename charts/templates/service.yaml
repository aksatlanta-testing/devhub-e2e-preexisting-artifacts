apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob43f9f11-ad60-444e-afa9-53680d024644.fullname" . }}
  labels:
    {{- include "go-echob43f9f11-ad60-444e-afa9-53680d024644.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob43f9f11-ad60-444e-afa9-53680d024644.selectorLabels" . | nindent 6 }}
