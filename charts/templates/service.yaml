apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5eeb127-c1fb-422b-b087-d512ed88d14c.fullname" . }}
  labels:
    {{- include "go-echoc5eeb127-c1fb-422b-b087-d512ed88d14c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5eeb127-c1fb-422b-b087-d512ed88d14c.selectorLabels" . | nindent 6 }}
