apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95540f8d-6ad8-4445-8653-ada408eaea03.fullname" . }}
  labels:
    {{- include "go-echo95540f8d-6ad8-4445-8653-ada408eaea03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95540f8d-6ad8-4445-8653-ada408eaea03.selectorLabels" . | nindent 6 }}
