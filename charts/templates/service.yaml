apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5017fc75-7ddd-4e8d-a192-c00a093078d1.fullname" . }}
  labels:
    {{- include "go-echo5017fc75-7ddd-4e8d-a192-c00a093078d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5017fc75-7ddd-4e8d-a192-c00a093078d1.selectorLabels" . | nindent 6 }}
