apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b8f617d-8f42-4e9f-ad82-83b7d0da3028.fullname" . }}
  labels:
    {{- include "go-echo8b8f617d-8f42-4e9f-ad82-83b7d0da3028.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b8f617d-8f42-4e9f-ad82-83b7d0da3028.selectorLabels" . | nindent 6 }}
