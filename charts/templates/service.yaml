apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb2351a6-08bb-4b56-b425-6bfa397d9415.fullname" . }}
  labels:
    {{- include "go-echobb2351a6-08bb-4b56-b425-6bfa397d9415.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb2351a6-08bb-4b56-b425-6bfa397d9415.selectorLabels" . | nindent 6 }}
