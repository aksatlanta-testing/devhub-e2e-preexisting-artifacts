apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29beba01-0e7f-4014-9033-dda5302fe463.fullname" . }}
  labels:
    {{- include "go-echo29beba01-0e7f-4014-9033-dda5302fe463.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29beba01-0e7f-4014-9033-dda5302fe463.selectorLabels" . | nindent 6 }}
