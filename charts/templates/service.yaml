apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96df70ef-29c7-42d1-acb0-24e4916b6f05.fullname" . }}
  labels:
    {{- include "go-echo96df70ef-29c7-42d1-acb0-24e4916b6f05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96df70ef-29c7-42d1-acb0-24e4916b6f05.selectorLabels" . | nindent 6 }}
