apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90dcaf42-12b8-4b2b-8a78-0a98e7687e98.fullname" . }}
  labels:
    {{- include "go-echo90dcaf42-12b8-4b2b-8a78-0a98e7687e98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90dcaf42-12b8-4b2b-8a78-0a98e7687e98.selectorLabels" . | nindent 6 }}
