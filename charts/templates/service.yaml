apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba01cf69-765a-41b2-863f-ee1e5ca11101.fullname" . }}
  labels:
    {{- include "go-echoba01cf69-765a-41b2-863f-ee1e5ca11101.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba01cf69-765a-41b2-863f-ee1e5ca11101.selectorLabels" . | nindent 6 }}
