apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4dc09d1-9d35-411a-8ad1-5897f75c25f9.fullname" . }}
  labels:
    {{- include "go-echoc4dc09d1-9d35-411a-8ad1-5897f75c25f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4dc09d1-9d35-411a-8ad1-5897f75c25f9.selectorLabels" . | nindent 6 }}
