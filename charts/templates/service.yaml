apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12f795b7-88aa-476c-9b5b-2a1d4ff42534.fullname" . }}
  labels:
    {{- include "go-echo12f795b7-88aa-476c-9b5b-2a1d4ff42534.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12f795b7-88aa-476c-9b5b-2a1d4ff42534.selectorLabels" . | nindent 6 }}
