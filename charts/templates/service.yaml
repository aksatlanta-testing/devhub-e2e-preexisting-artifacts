apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89d0f578-9e71-4284-9e37-0136798186be.fullname" . }}
  labels:
    {{- include "go-echo89d0f578-9e71-4284-9e37-0136798186be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89d0f578-9e71-4284-9e37-0136798186be.selectorLabels" . | nindent 6 }}
