apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39c7ab1e-a450-4cee-9de8-1238ff805378.fullname" . }}
  labels:
    {{- include "go-echo39c7ab1e-a450-4cee-9de8-1238ff805378.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39c7ab1e-a450-4cee-9de8-1238ff805378.selectorLabels" . | nindent 6 }}
