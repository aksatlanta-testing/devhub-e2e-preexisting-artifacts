apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo195f1bd4-7dab-4617-94e8-c7f762abe689.fullname" . }}
  labels:
    {{- include "go-echo195f1bd4-7dab-4617-94e8-c7f762abe689.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo195f1bd4-7dab-4617-94e8-c7f762abe689.selectorLabels" . | nindent 6 }}
