apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f0d231e-e014-4941-beac-1339765a4fbb.fullname" . }}
  labels:
    {{- include "go-echo7f0d231e-e014-4941-beac-1339765a4fbb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f0d231e-e014-4941-beac-1339765a4fbb.selectorLabels" . | nindent 6 }}
