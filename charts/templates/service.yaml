apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a325f75-c28c-474f-a5ca-c63d4146f3ee.fullname" . }}
  labels:
    {{- include "go-echo6a325f75-c28c-474f-a5ca-c63d4146f3ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a325f75-c28c-474f-a5ca-c63d4146f3ee.selectorLabels" . | nindent 6 }}
