apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeeae0d1e-2499-4c31-89c7-51fc5d957fb5.fullname" . }}
  labels:
    {{- include "go-echoeeae0d1e-2499-4c31-89c7-51fc5d957fb5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeeae0d1e-2499-4c31-89c7-51fc5d957fb5.selectorLabels" . | nindent 6 }}
