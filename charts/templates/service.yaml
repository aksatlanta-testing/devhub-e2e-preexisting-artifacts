apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf75431d-2512-4469-916b-2944142b2e67.fullname" . }}
  labels:
    {{- include "go-echocf75431d-2512-4469-916b-2944142b2e67.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf75431d-2512-4469-916b-2944142b2e67.selectorLabels" . | nindent 6 }}
