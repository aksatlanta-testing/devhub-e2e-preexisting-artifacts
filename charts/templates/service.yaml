apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bf4e176-90ed-4e88-acb7-244f4aebe23e.fullname" . }}
  labels:
    {{- include "go-echo0bf4e176-90ed-4e88-acb7-244f4aebe23e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bf4e176-90ed-4e88-acb7-244f4aebe23e.selectorLabels" . | nindent 6 }}
