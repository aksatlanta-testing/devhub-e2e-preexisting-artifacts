apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa32fb824-d7cf-4ae3-90ab-59c2b61b9a0c.fullname" . }}
  labels:
    {{- include "go-echoa32fb824-d7cf-4ae3-90ab-59c2b61b9a0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa32fb824-d7cf-4ae3-90ab-59c2b61b9a0c.selectorLabels" . | nindent 6 }}
