apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob739edb7-1aab-4c28-9da5-4c943a52560a.fullname" . }}
  labels:
    {{- include "go-echob739edb7-1aab-4c28-9da5-4c943a52560a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob739edb7-1aab-4c28-9da5-4c943a52560a.selectorLabels" . | nindent 6 }}
