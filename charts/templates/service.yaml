apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3bb615e-7ae9-403a-9cce-707caf9cec55.fullname" . }}
  labels:
    {{- include "go-echoe3bb615e-7ae9-403a-9cce-707caf9cec55.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3bb615e-7ae9-403a-9cce-707caf9cec55.selectorLabels" . | nindent 6 }}
