apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51f31f03-9afb-4c99-8190-80c4b6aec1e2.fullname" . }}
  labels:
    {{- include "go-echo51f31f03-9afb-4c99-8190-80c4b6aec1e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51f31f03-9afb-4c99-8190-80c4b6aec1e2.selectorLabels" . | nindent 6 }}
