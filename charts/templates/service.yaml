apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f05c05b-8910-4b00-9a7a-e2025db78d4a.fullname" . }}
  labels:
    {{- include "go-echo5f05c05b-8910-4b00-9a7a-e2025db78d4a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f05c05b-8910-4b00-9a7a-e2025db78d4a.selectorLabels" . | nindent 6 }}
