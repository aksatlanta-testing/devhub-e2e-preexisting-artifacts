apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fa0605b-6301-4c50-a45a-d4d1d11a29be.fullname" . }}
  labels:
    {{- include "go-echo6fa0605b-6301-4c50-a45a-d4d1d11a29be.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fa0605b-6301-4c50-a45a-d4d1d11a29be.selectorLabels" . | nindent 6 }}
