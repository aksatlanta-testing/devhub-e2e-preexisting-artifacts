apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2165f968-6de5-46e5-b3cf-1fdf9ff9dc74.fullname" . }}
  labels:
    {{- include "go-echo2165f968-6de5-46e5-b3cf-1fdf9ff9dc74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2165f968-6de5-46e5-b3cf-1fdf9ff9dc74.selectorLabels" . | nindent 6 }}
