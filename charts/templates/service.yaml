apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52a88386-8a5c-4efb-b36e-91cc511c6956.fullname" . }}
  labels:
    {{- include "go-echo52a88386-8a5c-4efb-b36e-91cc511c6956.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52a88386-8a5c-4efb-b36e-91cc511c6956.selectorLabels" . | nindent 6 }}
