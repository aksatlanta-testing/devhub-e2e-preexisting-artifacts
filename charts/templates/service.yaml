apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo743134b7-42d6-4ec4-8504-7c7f9491eb44.fullname" . }}
  labels:
    {{- include "go-echo743134b7-42d6-4ec4-8504-7c7f9491eb44.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo743134b7-42d6-4ec4-8504-7c7f9491eb44.selectorLabels" . | nindent 6 }}
