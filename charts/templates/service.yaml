apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d079da0-2bd1-44e1-ae8e-0b7251f8e2a3.fullname" . }}
  labels:
    {{- include "go-echo8d079da0-2bd1-44e1-ae8e-0b7251f8e2a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d079da0-2bd1-44e1-ae8e-0b7251f8e2a3.selectorLabels" . | nindent 6 }}
