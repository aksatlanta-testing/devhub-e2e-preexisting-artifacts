apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1aea762-c1dd-46a1-ac59-3aa1025ca3ea.fullname" . }}
  labels:
    {{- include "go-echoc1aea762-c1dd-46a1-ac59-3aa1025ca3ea.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1aea762-c1dd-46a1-ac59-3aa1025ca3ea.selectorLabels" . | nindent 6 }}
