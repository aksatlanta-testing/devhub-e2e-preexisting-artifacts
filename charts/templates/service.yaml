apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8748970-247b-4e89-b6ea-8752ef155772.fullname" . }}
  labels:
    {{- include "go-echoc8748970-247b-4e89-b6ea-8752ef155772.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8748970-247b-4e89-b6ea-8752ef155772.selectorLabels" . | nindent 6 }}
