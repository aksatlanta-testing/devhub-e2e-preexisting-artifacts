apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo907ab493-a53a-4cf2-8626-77eadf794247.fullname" . }}
  labels:
    {{- include "go-echo907ab493-a53a-4cf2-8626-77eadf794247.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo907ab493-a53a-4cf2-8626-77eadf794247.selectorLabels" . | nindent 6 }}
