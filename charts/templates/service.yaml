apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2af4cad-8813-46cf-86f3-d0471ea247d5.fullname" . }}
  labels:
    {{- include "go-echod2af4cad-8813-46cf-86f3-d0471ea247d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2af4cad-8813-46cf-86f3-d0471ea247d5.selectorLabels" . | nindent 6 }}
