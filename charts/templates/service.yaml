apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo803500c0-80f6-4a6c-bebd-8580b374575c.fullname" . }}
  labels:
    {{- include "go-echo803500c0-80f6-4a6c-bebd-8580b374575c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo803500c0-80f6-4a6c-bebd-8580b374575c.selectorLabels" . | nindent 6 }}
