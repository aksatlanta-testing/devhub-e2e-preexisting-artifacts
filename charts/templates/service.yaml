apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58c78e2f-73d1-4f15-a955-d84b405781b6.fullname" . }}
  labels:
    {{- include "go-echo58c78e2f-73d1-4f15-a955-d84b405781b6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58c78e2f-73d1-4f15-a955-d84b405781b6.selectorLabels" . | nindent 6 }}
