apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57869548-096f-46e3-bcaa-7be1de145096.fullname" . }}
  labels:
    {{- include "go-echo57869548-096f-46e3-bcaa-7be1de145096.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57869548-096f-46e3-bcaa-7be1de145096.selectorLabels" . | nindent 6 }}
