apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00ca22d9-1109-45e9-9308-ad877e6062ac.fullname" . }}
  labels:
    {{- include "go-echo00ca22d9-1109-45e9-9308-ad877e6062ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00ca22d9-1109-45e9-9308-ad877e6062ac.selectorLabels" . | nindent 6 }}
