apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb3badc2-100b-43ab-bf48-b4bdbb22cf04.fullname" . }}
  labels:
    {{- include "go-echofb3badc2-100b-43ab-bf48-b4bdbb22cf04.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb3badc2-100b-43ab-bf48-b4bdbb22cf04.selectorLabels" . | nindent 6 }}
