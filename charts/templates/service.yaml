apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71193c58-1650-4dd9-a94d-c2ced602e264.fullname" . }}
  labels:
    {{- include "go-echo71193c58-1650-4dd9-a94d-c2ced602e264.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71193c58-1650-4dd9-a94d-c2ced602e264.selectorLabels" . | nindent 6 }}
