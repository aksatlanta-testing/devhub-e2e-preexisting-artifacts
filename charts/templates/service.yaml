apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9121079f-e9f1-4657-885a-3f481a8cb1fa.fullname" . }}
  labels:
    {{- include "go-echo9121079f-e9f1-4657-885a-3f481a8cb1fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9121079f-e9f1-4657-885a-3f481a8cb1fa.selectorLabels" . | nindent 6 }}
