apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21212730-4d27-4303-ae5c-f734ae5cbdd7.fullname" . }}
  labels:
    {{- include "go-echo21212730-4d27-4303-ae5c-f734ae5cbdd7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21212730-4d27-4303-ae5c-f734ae5cbdd7.selectorLabels" . | nindent 6 }}
