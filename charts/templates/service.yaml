apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof502fdb0-3cbc-4b8c-a715-ed6cbbbf5f50.fullname" . }}
  labels:
    {{- include "go-echof502fdb0-3cbc-4b8c-a715-ed6cbbbf5f50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof502fdb0-3cbc-4b8c-a715-ed6cbbbf5f50.selectorLabels" . | nindent 6 }}
