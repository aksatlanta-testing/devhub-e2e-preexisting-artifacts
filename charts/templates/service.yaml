apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo502183af-332a-47bf-94f4-abe48d1edeea.fullname" . }}
  labels:
    {{- include "go-echo502183af-332a-47bf-94f4-abe48d1edeea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo502183af-332a-47bf-94f4-abe48d1edeea.selectorLabels" . | nindent 6 }}
