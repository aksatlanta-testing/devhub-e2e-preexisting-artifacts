apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofeb0d75b-d314-48f6-abba-56ab0ad0070a.fullname" . }}
  labels:
    {{- include "go-echofeb0d75b-d314-48f6-abba-56ab0ad0070a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofeb0d75b-d314-48f6-abba-56ab0ad0070a.selectorLabels" . | nindent 6 }}
