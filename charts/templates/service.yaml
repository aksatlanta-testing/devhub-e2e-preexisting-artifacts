apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo506da6b9-fb74-4703-8ec0-0ce4d83b8cf6.fullname" . }}
  labels:
    {{- include "go-echo506da6b9-fb74-4703-8ec0-0ce4d83b8cf6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo506da6b9-fb74-4703-8ec0-0ce4d83b8cf6.selectorLabels" . | nindent 6 }}
