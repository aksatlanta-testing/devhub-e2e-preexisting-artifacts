apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d30dfbc-b932-4471-8bc1-d56d0412b5eb.fullname" . }}
  labels:
    {{- include "go-echo0d30dfbc-b932-4471-8bc1-d56d0412b5eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d30dfbc-b932-4471-8bc1-d56d0412b5eb.selectorLabels" . | nindent 6 }}
