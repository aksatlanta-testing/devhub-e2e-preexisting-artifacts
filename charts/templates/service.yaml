apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaefb4f17-907a-4718-9854-2fe63e35ffce.fullname" . }}
  labels:
    {{- include "go-echoaefb4f17-907a-4718-9854-2fe63e35ffce.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaefb4f17-907a-4718-9854-2fe63e35ffce.selectorLabels" . | nindent 6 }}
