apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20da842a-63b6-4ac2-b920-baeb9085155c.fullname" . }}
  labels:
    {{- include "go-echo20da842a-63b6-4ac2-b920-baeb9085155c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20da842a-63b6-4ac2-b920-baeb9085155c.selectorLabels" . | nindent 6 }}
