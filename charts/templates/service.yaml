apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo419f9c0b-6838-4014-ac86-24c4e25a5d46.fullname" . }}
  labels:
    {{- include "go-echo419f9c0b-6838-4014-ac86-24c4e25a5d46.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo419f9c0b-6838-4014-ac86-24c4e25a5d46.selectorLabels" . | nindent 6 }}
