apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6613c531-63b4-4e80-b435-f3a8539d5f69.fullname" . }}
  labels:
    {{- include "go-echo6613c531-63b4-4e80-b435-f3a8539d5f69.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6613c531-63b4-4e80-b435-f3a8539d5f69.selectorLabels" . | nindent 6 }}
