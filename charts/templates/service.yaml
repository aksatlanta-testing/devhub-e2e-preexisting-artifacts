apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4c294ca-896d-4414-b00f-cacf53f33ca9.fullname" . }}
  labels:
    {{- include "go-echoe4c294ca-896d-4414-b00f-cacf53f33ca9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4c294ca-896d-4414-b00f-cacf53f33ca9.selectorLabels" . | nindent 6 }}
