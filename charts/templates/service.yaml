apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3a81465-e1a5-4e41-a0f5-b70ce6a5771a.fullname" . }}
  labels:
    {{- include "go-echob3a81465-e1a5-4e41-a0f5-b70ce6a5771a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3a81465-e1a5-4e41-a0f5-b70ce6a5771a.selectorLabels" . | nindent 6 }}
