apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87f25e16-c347-4808-a97c-bbdccd6e09ee.fullname" . }}
  labels:
    {{- include "go-echo87f25e16-c347-4808-a97c-bbdccd6e09ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87f25e16-c347-4808-a97c-bbdccd6e09ee.selectorLabels" . | nindent 6 }}
