apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2045f2ee-177d-4bae-bd04-2568c0e03a51.fullname" . }}
  labels:
    {{- include "go-echo2045f2ee-177d-4bae-bd04-2568c0e03a51.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2045f2ee-177d-4bae-bd04-2568c0e03a51.selectorLabels" . | nindent 6 }}
