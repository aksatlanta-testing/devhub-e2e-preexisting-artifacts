apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4d61403-2686-4de6-981e-6a3b2db4eda8.fullname" . }}
  labels:
    {{- include "go-echob4d61403-2686-4de6-981e-6a3b2db4eda8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4d61403-2686-4de6-981e-6a3b2db4eda8.selectorLabels" . | nindent 6 }}
