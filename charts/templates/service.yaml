apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo286f46b3-b9b4-4b58-9bf5-d340f039417b.fullname" . }}
  labels:
    {{- include "go-echo286f46b3-b9b4-4b58-9bf5-d340f039417b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo286f46b3-b9b4-4b58-9bf5-d340f039417b.selectorLabels" . | nindent 6 }}
