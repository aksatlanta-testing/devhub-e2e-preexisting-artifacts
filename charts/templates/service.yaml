apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo075501ff-8717-4fa8-abcc-1af2529a8e76.fullname" . }}
  labels:
    {{- include "go-echo075501ff-8717-4fa8-abcc-1af2529a8e76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo075501ff-8717-4fa8-abcc-1af2529a8e76.selectorLabels" . | nindent 6 }}
