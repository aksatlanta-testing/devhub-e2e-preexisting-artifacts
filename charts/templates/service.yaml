apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo060e3db0-202f-4e13-8bc4-de2b5119eba4.fullname" . }}
  labels:
    {{- include "go-echo060e3db0-202f-4e13-8bc4-de2b5119eba4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo060e3db0-202f-4e13-8bc4-de2b5119eba4.selectorLabels" . | nindent 6 }}
