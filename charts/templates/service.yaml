apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28d9a5de-b596-4140-b886-0b003c719918.fullname" . }}
  labels:
    {{- include "go-echo28d9a5de-b596-4140-b886-0b003c719918.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28d9a5de-b596-4140-b886-0b003c719918.selectorLabels" . | nindent 6 }}
