apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo09d7a512-1898-47e3-a79f-dade9f696a21.fullname" . }}
  labels:
    {{- include "go-echo09d7a512-1898-47e3-a79f-dade9f696a21.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo09d7a512-1898-47e3-a79f-dade9f696a21.selectorLabels" . | nindent 6 }}
