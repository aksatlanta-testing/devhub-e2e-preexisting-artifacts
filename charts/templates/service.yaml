apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d9c44a0-203b-440a-8ca8-0439d78eb9a6.fullname" . }}
  labels:
    {{- include "go-echo9d9c44a0-203b-440a-8ca8-0439d78eb9a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d9c44a0-203b-440a-8ca8-0439d78eb9a6.selectorLabels" . | nindent 6 }}
