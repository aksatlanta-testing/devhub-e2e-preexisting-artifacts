apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo235874f3-3d03-44e9-ab99-a5d4ee1650aa.fullname" . }}
  labels:
    {{- include "go-echo235874f3-3d03-44e9-ab99-a5d4ee1650aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo235874f3-3d03-44e9-ab99-a5d4ee1650aa.selectorLabels" . | nindent 6 }}
