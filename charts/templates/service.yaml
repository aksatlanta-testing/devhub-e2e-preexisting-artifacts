apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo953befc2-56bd-4d46-83af-2256c8d55a4a.fullname" . }}
  labels:
    {{- include "go-echo953befc2-56bd-4d46-83af-2256c8d55a4a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo953befc2-56bd-4d46-83af-2256c8d55a4a.selectorLabels" . | nindent 6 }}
