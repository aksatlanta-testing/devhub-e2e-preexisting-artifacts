apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8d11b23-02b1-4b51-90dc-6d7466fe2481.fullname" . }}
  labels:
    {{- include "go-echoe8d11b23-02b1-4b51-90dc-6d7466fe2481.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8d11b23-02b1-4b51-90dc-6d7466fe2481.selectorLabels" . | nindent 6 }}
