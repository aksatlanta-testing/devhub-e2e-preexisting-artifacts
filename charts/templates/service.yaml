apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c9a90c3-54f1-45b7-b528-6b2a31ebf290.fullname" . }}
  labels:
    {{- include "go-echo6c9a90c3-54f1-45b7-b528-6b2a31ebf290.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c9a90c3-54f1-45b7-b528-6b2a31ebf290.selectorLabels" . | nindent 6 }}
