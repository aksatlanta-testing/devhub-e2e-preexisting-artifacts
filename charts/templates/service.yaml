apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedaea924-c348-4af2-8c7b-e84640600e0f.fullname" . }}
  labels:
    {{- include "go-echoedaea924-c348-4af2-8c7b-e84640600e0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedaea924-c348-4af2-8c7b-e84640600e0f.selectorLabels" . | nindent 6 }}
