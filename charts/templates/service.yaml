apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ce2bc04-d6b7-477f-8b8b-e3adac5a597b.fullname" . }}
  labels:
    {{- include "go-echo9ce2bc04-d6b7-477f-8b8b-e3adac5a597b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ce2bc04-d6b7-477f-8b8b-e3adac5a597b.selectorLabels" . | nindent 6 }}
