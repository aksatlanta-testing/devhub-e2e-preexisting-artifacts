apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa212057c-2060-49a3-92c3-9710547bf796.fullname" . }}
  labels:
    {{- include "go-echoa212057c-2060-49a3-92c3-9710547bf796.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa212057c-2060-49a3-92c3-9710547bf796.selectorLabels" . | nindent 6 }}
