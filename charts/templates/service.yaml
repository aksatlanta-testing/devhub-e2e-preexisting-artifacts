apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15d339ee-a790-475b-ba66-59544be14976.fullname" . }}
  labels:
    {{- include "go-echo15d339ee-a790-475b-ba66-59544be14976.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15d339ee-a790-475b-ba66-59544be14976.selectorLabels" . | nindent 6 }}
