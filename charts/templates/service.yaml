apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeda915e0-1d12-4efe-8a60-562f6742235e.fullname" . }}
  labels:
    {{- include "go-echoeda915e0-1d12-4efe-8a60-562f6742235e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeda915e0-1d12-4efe-8a60-562f6742235e.selectorLabels" . | nindent 6 }}
