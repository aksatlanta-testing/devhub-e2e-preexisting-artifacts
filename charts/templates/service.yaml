apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod05be742-79ad-4177-a4f1-256002c44e75.fullname" . }}
  labels:
    {{- include "go-echod05be742-79ad-4177-a4f1-256002c44e75.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod05be742-79ad-4177-a4f1-256002c44e75.selectorLabels" . | nindent 6 }}
