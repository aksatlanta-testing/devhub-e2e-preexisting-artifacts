apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob24f5c3f-4c27-42c8-92a9-c5d03608a8a7.fullname" . }}
  labels:
    {{- include "go-echob24f5c3f-4c27-42c8-92a9-c5d03608a8a7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob24f5c3f-4c27-42c8-92a9-c5d03608a8a7.selectorLabels" . | nindent 6 }}
