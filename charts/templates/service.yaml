apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b6bb15c-511c-42b1-9a9c-4dd09db59861.fullname" . }}
  labels:
    {{- include "go-echo2b6bb15c-511c-42b1-9a9c-4dd09db59861.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b6bb15c-511c-42b1-9a9c-4dd09db59861.selectorLabels" . | nindent 6 }}
