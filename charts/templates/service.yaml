apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee793e09-a263-4b46-b5e4-6ed9a2f69235.fullname" . }}
  labels:
    {{- include "go-echoee793e09-a263-4b46-b5e4-6ed9a2f69235.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee793e09-a263-4b46-b5e4-6ed9a2f69235.selectorLabels" . | nindent 6 }}
