apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f553cfa-8bee-411f-8fc4-23a1cc687176.fullname" . }}
  labels:
    {{- include "go-echo5f553cfa-8bee-411f-8fc4-23a1cc687176.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f553cfa-8bee-411f-8fc4-23a1cc687176.selectorLabels" . | nindent 6 }}
