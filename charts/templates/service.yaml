apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c0e1309-e1e1-4645-b364-2fc9dd717167.fullname" . }}
  labels:
    {{- include "go-echo1c0e1309-e1e1-4645-b364-2fc9dd717167.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c0e1309-e1e1-4645-b364-2fc9dd717167.selectorLabels" . | nindent 6 }}
