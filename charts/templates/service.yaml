apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo062d9554-7f35-4fdf-bcf9-662d81a5936f.fullname" . }}
  labels:
    {{- include "go-echo062d9554-7f35-4fdf-bcf9-662d81a5936f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo062d9554-7f35-4fdf-bcf9-662d81a5936f.selectorLabels" . | nindent 6 }}
