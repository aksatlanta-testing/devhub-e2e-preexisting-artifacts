apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a420e23-3dd9-4b92-ac85-8017d6fe127e.fullname" . }}
  labels:
    {{- include "go-echo1a420e23-3dd9-4b92-ac85-8017d6fe127e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a420e23-3dd9-4b92-ac85-8017d6fe127e.selectorLabels" . | nindent 6 }}
