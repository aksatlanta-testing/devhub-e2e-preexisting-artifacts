apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc174435e-8481-48df-9f53-ec9136dd6579.fullname" . }}
  labels:
    {{- include "go-echoc174435e-8481-48df-9f53-ec9136dd6579.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc174435e-8481-48df-9f53-ec9136dd6579.selectorLabels" . | nindent 6 }}
