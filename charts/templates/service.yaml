apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe32cda6-e58d-401d-a02c-777af1f8ca49.fullname" . }}
  labels:
    {{- include "go-echobe32cda6-e58d-401d-a02c-777af1f8ca49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe32cda6-e58d-401d-a02c-777af1f8ca49.selectorLabels" . | nindent 6 }}
