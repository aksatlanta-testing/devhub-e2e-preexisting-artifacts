apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo428171e0-aff7-4764-b61f-44a13600bf15.fullname" . }}
  labels:
    {{- include "go-echo428171e0-aff7-4764-b61f-44a13600bf15.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo428171e0-aff7-4764-b61f-44a13600bf15.selectorLabels" . | nindent 6 }}
