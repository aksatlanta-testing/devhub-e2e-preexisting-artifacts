apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3c37eb4-ddf7-4ef6-a949-b73e608422ec.fullname" . }}
  labels:
    {{- include "go-echob3c37eb4-ddf7-4ef6-a949-b73e608422ec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3c37eb4-ddf7-4ef6-a949-b73e608422ec.selectorLabels" . | nindent 6 }}
