apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40feb46c-1ec2-4280-be82-57999ccd23be.fullname" . }}
  labels:
    {{- include "go-echo40feb46c-1ec2-4280-be82-57999ccd23be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40feb46c-1ec2-4280-be82-57999ccd23be.selectorLabels" . | nindent 6 }}
