apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7803c107-6af8-4388-a3b2-5c521bf5273b.fullname" . }}
  labels:
    {{- include "go-echo7803c107-6af8-4388-a3b2-5c521bf5273b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7803c107-6af8-4388-a3b2-5c521bf5273b.selectorLabels" . | nindent 6 }}
