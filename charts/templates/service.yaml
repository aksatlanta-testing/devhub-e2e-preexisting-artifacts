apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod76f89bb-a81a-442f-b1ca-10dee0526c5c.fullname" . }}
  labels:
    {{- include "go-echod76f89bb-a81a-442f-b1ca-10dee0526c5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod76f89bb-a81a-442f-b1ca-10dee0526c5c.selectorLabels" . | nindent 6 }}
