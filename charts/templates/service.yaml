apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod631710b-7c37-4332-8413-eeee5dbea878.fullname" . }}
  labels:
    {{- include "go-echod631710b-7c37-4332-8413-eeee5dbea878.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod631710b-7c37-4332-8413-eeee5dbea878.selectorLabels" . | nindent 6 }}
