apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo299caab5-341c-45d3-8f8d-da4d955455cc.fullname" . }}
  labels:
    {{- include "go-echo299caab5-341c-45d3-8f8d-da4d955455cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo299caab5-341c-45d3-8f8d-da4d955455cc.selectorLabels" . | nindent 6 }}
