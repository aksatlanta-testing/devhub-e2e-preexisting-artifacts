apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d784ad0-bbe8-4644-b2be-fe8d44e6e784.fullname" . }}
  labels:
    {{- include "go-echo0d784ad0-bbe8-4644-b2be-fe8d44e6e784.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d784ad0-bbe8-4644-b2be-fe8d44e6e784.selectorLabels" . | nindent 6 }}
