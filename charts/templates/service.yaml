apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc137633-a63d-46b9-bde2-fbc6934f1729.fullname" . }}
  labels:
    {{- include "go-echobc137633-a63d-46b9-bde2-fbc6934f1729.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc137633-a63d-46b9-bde2-fbc6934f1729.selectorLabels" . | nindent 6 }}
