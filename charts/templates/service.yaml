apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2988ccb9-b073-44ba-aff1-32af334ae060.fullname" . }}
  labels:
    {{- include "go-echo2988ccb9-b073-44ba-aff1-32af334ae060.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2988ccb9-b073-44ba-aff1-32af334ae060.selectorLabels" . | nindent 6 }}
