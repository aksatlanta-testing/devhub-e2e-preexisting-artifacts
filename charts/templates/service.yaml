apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02ea86dc-e7c3-4767-80ac-d13b31bbc01d.fullname" . }}
  labels:
    {{- include "go-echo02ea86dc-e7c3-4767-80ac-d13b31bbc01d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02ea86dc-e7c3-4767-80ac-d13b31bbc01d.selectorLabels" . | nindent 6 }}
