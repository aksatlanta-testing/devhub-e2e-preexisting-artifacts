apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo218e7932-83c1-4bbe-a2ce-a2f730817019.fullname" . }}
  labels:
    {{- include "go-echo218e7932-83c1-4bbe-a2ce-a2f730817019.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo218e7932-83c1-4bbe-a2ce-a2f730817019.selectorLabels" . | nindent 6 }}
