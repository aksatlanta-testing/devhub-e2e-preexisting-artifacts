apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo719b0938-a16e-4823-93ce-7da24bccb419.fullname" . }}
  labels:
    {{- include "go-echo719b0938-a16e-4823-93ce-7da24bccb419.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo719b0938-a16e-4823-93ce-7da24bccb419.selectorLabels" . | nindent 6 }}
