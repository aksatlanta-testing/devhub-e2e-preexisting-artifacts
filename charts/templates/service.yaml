apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2cccbd77-094c-48f7-a46e-08bcc044448f.fullname" . }}
  labels:
    {{- include "go-echo2cccbd77-094c-48f7-a46e-08bcc044448f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2cccbd77-094c-48f7-a46e-08bcc044448f.selectorLabels" . | nindent 6 }}
