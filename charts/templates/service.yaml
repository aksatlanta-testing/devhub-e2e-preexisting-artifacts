apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6045488a-a999-4b6f-baaa-9efb9acaf988.fullname" . }}
  labels:
    {{- include "go-echo6045488a-a999-4b6f-baaa-9efb9acaf988.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6045488a-a999-4b6f-baaa-9efb9acaf988.selectorLabels" . | nindent 6 }}
