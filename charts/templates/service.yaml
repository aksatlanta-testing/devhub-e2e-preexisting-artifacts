apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f628ccb-6ff9-4e21-b6da-80d201d75765.fullname" . }}
  labels:
    {{- include "go-echo4f628ccb-6ff9-4e21-b6da-80d201d75765.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f628ccb-6ff9-4e21-b6da-80d201d75765.selectorLabels" . | nindent 6 }}
