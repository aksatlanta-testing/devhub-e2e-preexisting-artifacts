apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba5a19bd-4986-4fe4-a2d2-4be077b2bc9a.fullname" . }}
  labels:
    {{- include "go-echoba5a19bd-4986-4fe4-a2d2-4be077b2bc9a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba5a19bd-4986-4fe4-a2d2-4be077b2bc9a.selectorLabels" . | nindent 6 }}
