apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91fcf2bf-a94b-4c27-8cc2-42ccfbf302fb.fullname" . }}
  labels:
    {{- include "go-echo91fcf2bf-a94b-4c27-8cc2-42ccfbf302fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91fcf2bf-a94b-4c27-8cc2-42ccfbf302fb.selectorLabels" . | nindent 6 }}
