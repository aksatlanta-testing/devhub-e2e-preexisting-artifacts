apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo276f0f23-f5d2-4e7a-ae86-1b468ab6f2e0.fullname" . }}
  labels:
    {{- include "go-echo276f0f23-f5d2-4e7a-ae86-1b468ab6f2e0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo276f0f23-f5d2-4e7a-ae86-1b468ab6f2e0.selectorLabels" . | nindent 6 }}
