apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8edf14e9-aa00-47a7-8b10-8173ed10401f.fullname" . }}
  labels:
    {{- include "go-echo8edf14e9-aa00-47a7-8b10-8173ed10401f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8edf14e9-aa00-47a7-8b10-8173ed10401f.selectorLabels" . | nindent 6 }}
