apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef096f02-ed8b-47ab-abe2-9f53ae088e22.fullname" . }}
  labels:
    {{- include "go-echoef096f02-ed8b-47ab-abe2-9f53ae088e22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef096f02-ed8b-47ab-abe2-9f53ae088e22.selectorLabels" . | nindent 6 }}
