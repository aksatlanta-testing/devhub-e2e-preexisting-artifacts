apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof11b9f26-e557-44ce-b6a4-e95be2a7fb39.fullname" . }}
  labels:
    {{- include "go-echof11b9f26-e557-44ce-b6a4-e95be2a7fb39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof11b9f26-e557-44ce-b6a4-e95be2a7fb39.selectorLabels" . | nindent 6 }}
