apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa325ffd1-8276-47ad-bf56-ddfe35495dba.fullname" . }}
  labels:
    {{- include "go-echoa325ffd1-8276-47ad-bf56-ddfe35495dba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa325ffd1-8276-47ad-bf56-ddfe35495dba.selectorLabels" . | nindent 6 }}
