apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo984970d3-04cc-4b26-b2a7-557c13574a05.fullname" . }}
  labels:
    {{- include "go-echo984970d3-04cc-4b26-b2a7-557c13574a05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo984970d3-04cc-4b26-b2a7-557c13574a05.selectorLabels" . | nindent 6 }}
