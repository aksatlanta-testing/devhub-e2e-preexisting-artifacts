apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86c2e826-b865-4380-ac68-99daba74de14.fullname" . }}
  labels:
    {{- include "go-echo86c2e826-b865-4380-ac68-99daba74de14.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86c2e826-b865-4380-ac68-99daba74de14.selectorLabels" . | nindent 6 }}
