apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51fc1eda-d399-4a56-9b9a-ccd9266d9e5d.fullname" . }}
  labels:
    {{- include "go-echo51fc1eda-d399-4a56-9b9a-ccd9266d9e5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51fc1eda-d399-4a56-9b9a-ccd9266d9e5d.selectorLabels" . | nindent 6 }}
