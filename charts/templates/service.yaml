apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4661a02-64db-4906-954b-d65c4c152bf8.fullname" . }}
  labels:
    {{- include "go-echof4661a02-64db-4906-954b-d65c4c152bf8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4661a02-64db-4906-954b-d65c4c152bf8.selectorLabels" . | nindent 6 }}
