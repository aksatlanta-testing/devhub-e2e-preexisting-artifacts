apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40effd2a-19d0-41a4-813d-caf08b54999e.fullname" . }}
  labels:
    {{- include "go-echo40effd2a-19d0-41a4-813d-caf08b54999e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40effd2a-19d0-41a4-813d-caf08b54999e.selectorLabels" . | nindent 6 }}
