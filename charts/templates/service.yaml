apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7cdc315-3561-4af9-896a-14ee680f2f95.fullname" . }}
  labels:
    {{- include "go-echof7cdc315-3561-4af9-896a-14ee680f2f95.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7cdc315-3561-4af9-896a-14ee680f2f95.selectorLabels" . | nindent 6 }}
