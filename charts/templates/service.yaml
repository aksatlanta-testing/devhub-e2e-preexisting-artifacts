apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd1bc290-4f7e-4aa8-9384-fe7beca78731.fullname" . }}
  labels:
    {{- include "go-echobd1bc290-4f7e-4aa8-9384-fe7beca78731.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd1bc290-4f7e-4aa8-9384-fe7beca78731.selectorLabels" . | nindent 6 }}
