apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo173b7c16-4f7b-497d-b7b4-6dbf8473ec7b.fullname" . }}
  labels:
    {{- include "go-echo173b7c16-4f7b-497d-b7b4-6dbf8473ec7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo173b7c16-4f7b-497d-b7b4-6dbf8473ec7b.selectorLabels" . | nindent 6 }}
