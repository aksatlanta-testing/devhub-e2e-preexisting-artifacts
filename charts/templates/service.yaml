apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa12ed097-24f7-4038-bebd-40b05b55abd0.fullname" . }}
  labels:
    {{- include "go-echoa12ed097-24f7-4038-bebd-40b05b55abd0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa12ed097-24f7-4038-bebd-40b05b55abd0.selectorLabels" . | nindent 6 }}
