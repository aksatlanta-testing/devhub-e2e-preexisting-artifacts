apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2859d91-1e76-4eda-a896-69f730d7020a.fullname" . }}
  labels:
    {{- include "go-echoc2859d91-1e76-4eda-a896-69f730d7020a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2859d91-1e76-4eda-a896-69f730d7020a.selectorLabels" . | nindent 6 }}
