apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5bcac9c-1de8-4841-b8ee-d7c4e2148b88.fullname" . }}
  labels:
    {{- include "go-echoa5bcac9c-1de8-4841-b8ee-d7c4e2148b88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5bcac9c-1de8-4841-b8ee-d7c4e2148b88.selectorLabels" . | nindent 6 }}
