apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf434704-fc02-4634-96f0-2cb7ae0ac1fb.fullname" . }}
  labels:
    {{- include "go-echocf434704-fc02-4634-96f0-2cb7ae0ac1fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf434704-fc02-4634-96f0-2cb7ae0ac1fb.selectorLabels" . | nindent 6 }}
