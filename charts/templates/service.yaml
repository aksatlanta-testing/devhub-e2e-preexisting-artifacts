apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae49f8ad-d33d-44d4-ab7a-629ce0a071ea.fullname" . }}
  labels:
    {{- include "go-echoae49f8ad-d33d-44d4-ab7a-629ce0a071ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae49f8ad-d33d-44d4-ab7a-629ce0a071ea.selectorLabels" . | nindent 6 }}
