apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7a3ee6b-ec71-4035-be81-3dffb1489be9.fullname" . }}
  labels:
    {{- include "go-echoc7a3ee6b-ec71-4035-be81-3dffb1489be9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7a3ee6b-ec71-4035-be81-3dffb1489be9.selectorLabels" . | nindent 6 }}
