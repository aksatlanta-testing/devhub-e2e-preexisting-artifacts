apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57b59973-f32a-4cf7-9efb-30ff1c7a9cf6.fullname" . }}
  labels:
    {{- include "go-echo57b59973-f32a-4cf7-9efb-30ff1c7a9cf6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57b59973-f32a-4cf7-9efb-30ff1c7a9cf6.selectorLabels" . | nindent 6 }}
