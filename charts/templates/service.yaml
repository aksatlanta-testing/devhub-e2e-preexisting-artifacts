apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49234885-9c78-494c-937a-c8d2fffb6d97.fullname" . }}
  labels:
    {{- include "go-echo49234885-9c78-494c-937a-c8d2fffb6d97.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
