apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo297ccffa-dde7-4d30-b9fb-003749dd54ae.fullname" . }}
  labels:
    {{- include "go-echo297ccffa-dde7-4d30-b9fb-003749dd54ae.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo297ccffa-dde7-4d30-b9fb-003749dd54ae.selectorLabels" . | nindent 6 }}
