apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71e2d84a-06bd-41fd-b5ea-0bd365679143.fullname" . }}
  labels:
    {{- include "go-echo71e2d84a-06bd-41fd-b5ea-0bd365679143.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71e2d84a-06bd-41fd-b5ea-0bd365679143.selectorLabels" . | nindent 6 }}
