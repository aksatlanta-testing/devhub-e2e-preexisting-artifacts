apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7bdba3c7-e0be-4b44-84f4-f063148c2185.fullname" . }}
  labels:
    {{- include "go-echo7bdba3c7-e0be-4b44-84f4-f063148c2185.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7bdba3c7-e0be-4b44-84f4-f063148c2185.selectorLabels" . | nindent 6 }}
