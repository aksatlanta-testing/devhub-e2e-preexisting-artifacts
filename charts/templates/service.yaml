apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cce9a5f-5c80-452a-9dcf-01f640b70438.fullname" . }}
  labels:
    {{- include "go-echo1cce9a5f-5c80-452a-9dcf-01f640b70438.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cce9a5f-5c80-452a-9dcf-01f640b70438.selectorLabels" . | nindent 6 }}
