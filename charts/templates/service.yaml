apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4530325f-2982-41c5-9c66-9b30a658cf39.fullname" . }}
  labels:
    {{- include "go-echo4530325f-2982-41c5-9c66-9b30a658cf39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4530325f-2982-41c5-9c66-9b30a658cf39.selectorLabels" . | nindent 6 }}
