apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo938545b3-b07e-4f4b-bb2c-82e0adbc87a4.fullname" . }}
  labels:
    {{- include "go-echo938545b3-b07e-4f4b-bb2c-82e0adbc87a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo938545b3-b07e-4f4b-bb2c-82e0adbc87a4.selectorLabels" . | nindent 6 }}
