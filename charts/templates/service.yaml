apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7161c1f-baaf-447f-8313-aeea7a978b95.fullname" . }}
  labels:
    {{- include "go-echoe7161c1f-baaf-447f-8313-aeea7a978b95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7161c1f-baaf-447f-8313-aeea7a978b95.selectorLabels" . | nindent 6 }}
