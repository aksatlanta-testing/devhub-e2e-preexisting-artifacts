apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90d9ffbd-e1fa-4fe1-90f0-8f237cae9fde.fullname" . }}
  labels:
    {{- include "go-echo90d9ffbd-e1fa-4fe1-90f0-8f237cae9fde.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90d9ffbd-e1fa-4fe1-90f0-8f237cae9fde.selectorLabels" . | nindent 6 }}
