apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7d961c9-3fbd-49a9-b501-a2a57b1a50d8.fullname" . }}
  labels:
    {{- include "go-echoc7d961c9-3fbd-49a9-b501-a2a57b1a50d8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7d961c9-3fbd-49a9-b501-a2a57b1a50d8.selectorLabels" . | nindent 6 }}
