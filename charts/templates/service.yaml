apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7fa908c-2fb2-4152-a45f-e5a6469d5bfb.fullname" . }}
  labels:
    {{- include "go-echod7fa908c-2fb2-4152-a45f-e5a6469d5bfb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7fa908c-2fb2-4152-a45f-e5a6469d5bfb.selectorLabels" . | nindent 6 }}
