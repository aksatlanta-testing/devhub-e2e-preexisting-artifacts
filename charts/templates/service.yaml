apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65c03613-4abf-4840-9884-30a7e269e9ac.fullname" . }}
  labels:
    {{- include "go-echo65c03613-4abf-4840-9884-30a7e269e9ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65c03613-4abf-4840-9884-30a7e269e9ac.selectorLabels" . | nindent 6 }}
