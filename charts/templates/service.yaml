apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof366ee8c-b545-4eb5-8e75-9ce78e530f64.fullname" . }}
  labels:
    {{- include "go-echof366ee8c-b545-4eb5-8e75-9ce78e530f64.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof366ee8c-b545-4eb5-8e75-9ce78e530f64.selectorLabels" . | nindent 6 }}
