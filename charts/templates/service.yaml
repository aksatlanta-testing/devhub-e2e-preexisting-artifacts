apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0d02cd7-f629-4b70-a8db-479cae89edb7.fullname" . }}
  labels:
    {{- include "go-echof0d02cd7-f629-4b70-a8db-479cae89edb7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0d02cd7-f629-4b70-a8db-479cae89edb7.selectorLabels" . | nindent 6 }}
