apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81b33c42-3b05-435e-87eb-b71db019ed55.fullname" . }}
  labels:
    {{- include "go-echo81b33c42-3b05-435e-87eb-b71db019ed55.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81b33c42-3b05-435e-87eb-b71db019ed55.selectorLabels" . | nindent 6 }}
