apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b00eac8-b318-4f34-80fa-540f51e00a32.fullname" . }}
  labels:
    {{- include "go-echo1b00eac8-b318-4f34-80fa-540f51e00a32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b00eac8-b318-4f34-80fa-540f51e00a32.selectorLabels" . | nindent 6 }}
