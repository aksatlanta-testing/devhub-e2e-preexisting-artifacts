apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof15546d8-37e9-4279-9d60-f1b14002b660.fullname" . }}
  labels:
    {{- include "go-echof15546d8-37e9-4279-9d60-f1b14002b660.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof15546d8-37e9-4279-9d60-f1b14002b660.selectorLabels" . | nindent 6 }}
