apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo963d1b7d-8763-4acc-ac49-48619e1e67b4.fullname" . }}
  labels:
    {{- include "go-echo963d1b7d-8763-4acc-ac49-48619e1e67b4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo963d1b7d-8763-4acc-ac49-48619e1e67b4.selectorLabels" . | nindent 6 }}
