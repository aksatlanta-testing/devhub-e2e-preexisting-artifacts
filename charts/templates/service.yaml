apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee53997d-0ce7-47e0-a8c2-071c2a445de5.fullname" . }}
  labels:
    {{- include "go-echoee53997d-0ce7-47e0-a8c2-071c2a445de5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee53997d-0ce7-47e0-a8c2-071c2a445de5.selectorLabels" . | nindent 6 }}
