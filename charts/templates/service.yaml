apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02800cb1-0b8a-4652-8340-e9037f5aa995.fullname" . }}
  labels:
    {{- include "go-echo02800cb1-0b8a-4652-8340-e9037f5aa995.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02800cb1-0b8a-4652-8340-e9037f5aa995.selectorLabels" . | nindent 6 }}
