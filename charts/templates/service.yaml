apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ef7cd3c-dbf6-4677-85bb-cc0544675048.fullname" . }}
  labels:
    {{- include "go-echo2ef7cd3c-dbf6-4677-85bb-cc0544675048.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ef7cd3c-dbf6-4677-85bb-cc0544675048.selectorLabels" . | nindent 6 }}
