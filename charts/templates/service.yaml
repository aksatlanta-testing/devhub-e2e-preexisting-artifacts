apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97899af7-92c8-41c8-8a31-65da3148846a.fullname" . }}
  labels:
    {{- include "go-echo97899af7-92c8-41c8-8a31-65da3148846a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97899af7-92c8-41c8-8a31-65da3148846a.selectorLabels" . | nindent 6 }}
