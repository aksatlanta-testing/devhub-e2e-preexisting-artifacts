apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9da04b13-6044-4975-8003-886a863297b8.fullname" . }}
  labels:
    {{- include "go-echo9da04b13-6044-4975-8003-886a863297b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9da04b13-6044-4975-8003-886a863297b8.selectorLabels" . | nindent 6 }}
