apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodcf7a16e-758b-45c3-9229-1f2927b6d125.fullname" . }}
  labels:
    {{- include "go-echodcf7a16e-758b-45c3-9229-1f2927b6d125.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodcf7a16e-758b-45c3-9229-1f2927b6d125.selectorLabels" . | nindent 6 }}
