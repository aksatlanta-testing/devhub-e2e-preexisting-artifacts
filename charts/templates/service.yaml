apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc6cf507-5923-4ad5-ad19-c0e286ad148b.fullname" . }}
  labels:
    {{- include "go-echodc6cf507-5923-4ad5-ad19-c0e286ad148b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc6cf507-5923-4ad5-ad19-c0e286ad148b.selectorLabels" . | nindent 6 }}
