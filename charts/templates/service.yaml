apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f8a47ea-b0d3-4dc8-8323-ffe207863124.fullname" . }}
  labels:
    {{- include "go-echo8f8a47ea-b0d3-4dc8-8323-ffe207863124.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f8a47ea-b0d3-4dc8-8323-ffe207863124.selectorLabels" . | nindent 6 }}
