apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof3ddde5b-74bf-49e2-955a-9ed07c755127.fullname" . }}
  labels:
    {{- include "go-echof3ddde5b-74bf-49e2-955a-9ed07c755127.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof3ddde5b-74bf-49e2-955a-9ed07c755127.selectorLabels" . | nindent 6 }}
