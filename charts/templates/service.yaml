apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a2124da-ed7e-4b93-a709-179e48fa19b0.fullname" . }}
  labels:
    {{- include "go-echo0a2124da-ed7e-4b93-a709-179e48fa19b0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a2124da-ed7e-4b93-a709-179e48fa19b0.selectorLabels" . | nindent 6 }}
