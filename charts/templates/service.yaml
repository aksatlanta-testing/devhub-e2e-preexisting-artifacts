apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3ff4149-3a04-47f9-9ebe-00a99efe3f5e.fullname" . }}
  labels:
    {{- include "go-echoa3ff4149-3a04-47f9-9ebe-00a99efe3f5e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3ff4149-3a04-47f9-9ebe-00a99efe3f5e.selectorLabels" . | nindent 6 }}
