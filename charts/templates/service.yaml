apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee57e3cc-1bf5-49ec-9fbf-25aca3545a12.fullname" . }}
  labels:
    {{- include "go-echoee57e3cc-1bf5-49ec-9fbf-25aca3545a12.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee57e3cc-1bf5-49ec-9fbf-25aca3545a12.selectorLabels" . | nindent 6 }}
