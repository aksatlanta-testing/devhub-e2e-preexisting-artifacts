apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1501bb1-caf5-4b88-89f8-f4b4a92505dc.fullname" . }}
  labels:
    {{- include "go-echoe1501bb1-caf5-4b88-89f8-f4b4a92505dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1501bb1-caf5-4b88-89f8-f4b4a92505dc.selectorLabels" . | nindent 6 }}
