apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d99e5cc-c5c1-44a2-81b5-83cad22fa3a6.fullname" . }}
  labels:
    {{- include "go-echo1d99e5cc-c5c1-44a2-81b5-83cad22fa3a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d99e5cc-c5c1-44a2-81b5-83cad22fa3a6.selectorLabels" . | nindent 6 }}
