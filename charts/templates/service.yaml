apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo56467a31-777d-4360-b708-d6f62c5a8006.fullname" . }}
  labels:
    {{- include "go-echo56467a31-777d-4360-b708-d6f62c5a8006.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo56467a31-777d-4360-b708-d6f62c5a8006.selectorLabels" . | nindent 6 }}
