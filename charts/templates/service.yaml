apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo508378ba-730b-4523-a371-6f0b18f2efeb.fullname" . }}
  labels:
    {{- include "go-echo508378ba-730b-4523-a371-6f0b18f2efeb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo508378ba-730b-4523-a371-6f0b18f2efeb.selectorLabels" . | nindent 6 }}
