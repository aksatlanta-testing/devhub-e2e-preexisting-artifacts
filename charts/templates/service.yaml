apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bac418f-b79f-4444-abf0-4d57881cd7c8.fullname" . }}
  labels:
    {{- include "go-echo0bac418f-b79f-4444-abf0-4d57881cd7c8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bac418f-b79f-4444-abf0-4d57881cd7c8.selectorLabels" . | nindent 6 }}
