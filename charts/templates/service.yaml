apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob16d2c4b-ad72-4717-9312-3f2934cade71.fullname" . }}
  labels:
    {{- include "go-echob16d2c4b-ad72-4717-9312-3f2934cade71.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob16d2c4b-ad72-4717-9312-3f2934cade71.selectorLabels" . | nindent 6 }}
