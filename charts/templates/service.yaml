apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo631b7c02-aba4-4173-8505-d7b9bc94bf2f.fullname" . }}
  labels:
    {{- include "go-echo631b7c02-aba4-4173-8505-d7b9bc94bf2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo631b7c02-aba4-4173-8505-d7b9bc94bf2f.selectorLabels" . | nindent 6 }}
