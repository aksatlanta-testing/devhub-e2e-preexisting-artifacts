apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa464c75f-6868-426d-8a09-08636fc30bb1.fullname" . }}
  labels:
    {{- include "go-echoa464c75f-6868-426d-8a09-08636fc30bb1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa464c75f-6868-426d-8a09-08636fc30bb1.selectorLabels" . | nindent 6 }}
