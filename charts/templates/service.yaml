apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoceda2b7c-3b3e-458c-82fe-989a33a581e1.fullname" . }}
  labels:
    {{- include "go-echoceda2b7c-3b3e-458c-82fe-989a33a581e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoceda2b7c-3b3e-458c-82fe-989a33a581e1.selectorLabels" . | nindent 6 }}
