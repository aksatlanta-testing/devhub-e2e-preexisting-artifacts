apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53472d67-7505-4853-80bf-8a470c731281.fullname" . }}
  labels:
    {{- include "go-echo53472d67-7505-4853-80bf-8a470c731281.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53472d67-7505-4853-80bf-8a470c731281.selectorLabels" . | nindent 6 }}
