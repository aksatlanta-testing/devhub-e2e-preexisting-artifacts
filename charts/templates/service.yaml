apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa18ddad3-3618-43c7-bbb2-edc5d723ee7b.fullname" . }}
  labels:
    {{- include "go-echoa18ddad3-3618-43c7-bbb2-edc5d723ee7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa18ddad3-3618-43c7-bbb2-edc5d723ee7b.selectorLabels" . | nindent 6 }}
