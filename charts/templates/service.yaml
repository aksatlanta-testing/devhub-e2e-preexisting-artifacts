apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffdbc8e4-885f-46ef-864b-80be54a48380.fullname" . }}
  labels:
    {{- include "go-echoffdbc8e4-885f-46ef-864b-80be54a48380.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffdbc8e4-885f-46ef-864b-80be54a48380.selectorLabels" . | nindent 6 }}
