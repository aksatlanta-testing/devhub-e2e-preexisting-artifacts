apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d9ea802-af77-41b1-8f31-67c0c9dba7c6.fullname" . }}
  labels:
    {{- include "go-echo8d9ea802-af77-41b1-8f31-67c0c9dba7c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d9ea802-af77-41b1-8f31-67c0c9dba7c6.selectorLabels" . | nindent 6 }}
