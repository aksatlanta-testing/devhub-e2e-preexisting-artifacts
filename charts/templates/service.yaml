apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45e61a1f-ecd5-4ddd-8434-aababafc0df7.fullname" . }}
  labels:
    {{- include "go-echo45e61a1f-ecd5-4ddd-8434-aababafc0df7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45e61a1f-ecd5-4ddd-8434-aababafc0df7.selectorLabels" . | nindent 6 }}
