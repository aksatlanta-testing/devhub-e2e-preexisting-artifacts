apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f4de38c-ef44-42ce-b5b5-06f6e9ba8159.fullname" . }}
  labels:
    {{- include "go-echo3f4de38c-ef44-42ce-b5b5-06f6e9ba8159.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f4de38c-ef44-42ce-b5b5-06f6e9ba8159.selectorLabels" . | nindent 6 }}
