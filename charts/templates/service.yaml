apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo292986ca-038f-4165-8ec8-8e59e2914950.fullname" . }}
  labels:
    {{- include "go-echo292986ca-038f-4165-8ec8-8e59e2914950.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo292986ca-038f-4165-8ec8-8e59e2914950.selectorLabels" . | nindent 6 }}
