apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97ea4203-a4e7-4aca-bdef-8ae2d7094fb2.fullname" . }}
  labels:
    {{- include "go-echo97ea4203-a4e7-4aca-bdef-8ae2d7094fb2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97ea4203-a4e7-4aca-bdef-8ae2d7094fb2.selectorLabels" . | nindent 6 }}
