apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb31ce82-6ac6-48c2-8fd6-74479596b26f.fullname" . }}
  labels:
    {{- include "go-echocb31ce82-6ac6-48c2-8fd6-74479596b26f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb31ce82-6ac6-48c2-8fd6-74479596b26f.selectorLabels" . | nindent 6 }}
