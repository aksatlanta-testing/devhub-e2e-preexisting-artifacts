apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15cc31db-a710-4b7c-bd13-3a6d949f7b54.fullname" . }}
  labels:
    {{- include "go-echo15cc31db-a710-4b7c-bd13-3a6d949f7b54.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15cc31db-a710-4b7c-bd13-3a6d949f7b54.selectorLabels" . | nindent 6 }}
