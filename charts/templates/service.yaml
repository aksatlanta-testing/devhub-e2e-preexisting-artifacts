apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d1f43b6-93b4-40d5-8307-c35f90d7fbe4.fullname" . }}
  labels:
    {{- include "go-echo7d1f43b6-93b4-40d5-8307-c35f90d7fbe4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d1f43b6-93b4-40d5-8307-c35f90d7fbe4.selectorLabels" . | nindent 6 }}
