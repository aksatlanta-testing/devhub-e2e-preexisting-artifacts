apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5d52c73-5b67-4e3a-94c2-ce9513100249.fullname" . }}
  labels:
    {{- include "go-echoe5d52c73-5b67-4e3a-94c2-ce9513100249.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5d52c73-5b67-4e3a-94c2-ce9513100249.selectorLabels" . | nindent 6 }}
