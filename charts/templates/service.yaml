apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a82854c-a606-4dd5-b276-d98b081aa0ee.fullname" . }}
  labels:
    {{- include "go-echo5a82854c-a606-4dd5-b276-d98b081aa0ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a82854c-a606-4dd5-b276-d98b081aa0ee.selectorLabels" . | nindent 6 }}
