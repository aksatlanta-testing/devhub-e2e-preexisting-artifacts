apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3439000d-a202-43d3-8527-238b74967521.fullname" . }}
  labels:
    {{- include "go-echo3439000d-a202-43d3-8527-238b74967521.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3439000d-a202-43d3-8527-238b74967521.selectorLabels" . | nindent 6 }}
