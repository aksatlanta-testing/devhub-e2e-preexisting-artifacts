apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd84b53f-77b3-40f2-8a4a-ab8d995604f1.fullname" . }}
  labels:
    {{- include "go-echocd84b53f-77b3-40f2-8a4a-ab8d995604f1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd84b53f-77b3-40f2-8a4a-ab8d995604f1.selectorLabels" . | nindent 6 }}
