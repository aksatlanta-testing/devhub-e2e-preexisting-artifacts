apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec326759-c75e-4386-b6b4-dcdf09c5d8b9.fullname" . }}
  labels:
    {{- include "go-echoec326759-c75e-4386-b6b4-dcdf09c5d8b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec326759-c75e-4386-b6b4-dcdf09c5d8b9.selectorLabels" . | nindent 6 }}
