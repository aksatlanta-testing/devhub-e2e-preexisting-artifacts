apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46b4387a-4f87-449b-bd05-2f3a61b1f69e.fullname" . }}
  labels:
    {{- include "go-echo46b4387a-4f87-449b-bd05-2f3a61b1f69e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46b4387a-4f87-449b-bd05-2f3a61b1f69e.selectorLabels" . | nindent 6 }}
