apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo871c4bea-9ebe-4469-82f9-fe358bc6fa60.fullname" . }}
  labels:
    {{- include "go-echo871c4bea-9ebe-4469-82f9-fe358bc6fa60.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo871c4bea-9ebe-4469-82f9-fe358bc6fa60.selectorLabels" . | nindent 6 }}
