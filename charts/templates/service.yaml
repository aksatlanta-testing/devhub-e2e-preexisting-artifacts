apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d01fe5b-58c2-4696-ad56-f8a270062819.fullname" . }}
  labels:
    {{- include "go-echo4d01fe5b-58c2-4696-ad56-f8a270062819.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d01fe5b-58c2-4696-ad56-f8a270062819.selectorLabels" . | nindent 6 }}
