apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44d5b73d-c652-4d73-a520-2026adc3b9ee.fullname" . }}
  labels:
    {{- include "go-echo44d5b73d-c652-4d73-a520-2026adc3b9ee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44d5b73d-c652-4d73-a520-2026adc3b9ee.selectorLabels" . | nindent 6 }}
