apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00fb67bf-254e-4bc8-866f-f936a6c2675a.fullname" . }}
  labels:
    {{- include "go-echo00fb67bf-254e-4bc8-866f-f936a6c2675a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00fb67bf-254e-4bc8-866f-f936a6c2675a.selectorLabels" . | nindent 6 }}
