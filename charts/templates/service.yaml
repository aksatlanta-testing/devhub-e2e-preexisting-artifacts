apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5315a92-228e-4802-b6f2-df7a3541bb76.fullname" . }}
  labels:
    {{- include "go-echof5315a92-228e-4802-b6f2-df7a3541bb76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5315a92-228e-4802-b6f2-df7a3541bb76.selectorLabels" . | nindent 6 }}
