apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd5c0bb0-c120-4c1e-9ab3-14d6599e699b.fullname" . }}
  labels:
    {{- include "go-echobd5c0bb0-c120-4c1e-9ab3-14d6599e699b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd5c0bb0-c120-4c1e-9ab3-14d6599e699b.selectorLabels" . | nindent 6 }}
