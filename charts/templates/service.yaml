apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30fe95dc-e744-4956-a074-ef3ea993f3db.fullname" . }}
  labels:
    {{- include "go-echo30fe95dc-e744-4956-a074-ef3ea993f3db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30fe95dc-e744-4956-a074-ef3ea993f3db.selectorLabels" . | nindent 6 }}
