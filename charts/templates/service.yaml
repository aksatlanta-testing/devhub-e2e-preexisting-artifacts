apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo450b2ca1-0c71-4e30-b896-0a2a0060370d.fullname" . }}
  labels:
    {{- include "go-echo450b2ca1-0c71-4e30-b896-0a2a0060370d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo450b2ca1-0c71-4e30-b896-0a2a0060370d.selectorLabels" . | nindent 6 }}
