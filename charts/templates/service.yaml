apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fd64c83-a1f9-4a74-9ed6-d36e6c6cd152.fullname" . }}
  labels:
    {{- include "go-echo9fd64c83-a1f9-4a74-9ed6-d36e6c6cd152.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fd64c83-a1f9-4a74-9ed6-d36e6c6cd152.selectorLabels" . | nindent 6 }}
