apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ae643ec-93cd-4f4b-b8c7-1d50626023c3.fullname" . }}
  labels:
    {{- include "go-echo6ae643ec-93cd-4f4b-b8c7-1d50626023c3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ae643ec-93cd-4f4b-b8c7-1d50626023c3.selectorLabels" . | nindent 6 }}
