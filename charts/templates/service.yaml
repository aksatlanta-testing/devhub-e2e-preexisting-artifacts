apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34adaddf-df37-4975-a914-2dd4ee268f57.fullname" . }}
  labels:
    {{- include "go-echo34adaddf-df37-4975-a914-2dd4ee268f57.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34adaddf-df37-4975-a914-2dd4ee268f57.selectorLabels" . | nindent 6 }}
