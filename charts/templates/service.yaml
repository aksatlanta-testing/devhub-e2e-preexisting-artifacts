apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof823f0ed-8957-42f1-aead-7a0e3fc5aa00.fullname" . }}
  labels:
    {{- include "go-echof823f0ed-8957-42f1-aead-7a0e3fc5aa00.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof823f0ed-8957-42f1-aead-7a0e3fc5aa00.selectorLabels" . | nindent 6 }}
