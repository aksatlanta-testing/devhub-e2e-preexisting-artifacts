apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b497c4b-a8b6-43ee-8333-9d6f599ce437.fullname" . }}
  labels:
    {{- include "go-echo5b497c4b-a8b6-43ee-8333-9d6f599ce437.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b497c4b-a8b6-43ee-8333-9d6f599ce437.selectorLabels" . | nindent 6 }}
