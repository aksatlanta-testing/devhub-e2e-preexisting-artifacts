apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c39b5e0-4473-4b78-8dfb-bba5878dbf4b.fullname" . }}
  labels:
    {{- include "go-echo2c39b5e0-4473-4b78-8dfb-bba5878dbf4b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c39b5e0-4473-4b78-8dfb-bba5878dbf4b.selectorLabels" . | nindent 6 }}
