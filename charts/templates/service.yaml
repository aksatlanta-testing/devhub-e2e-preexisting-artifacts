apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ad9d9f8-2e05-4e3a-b476-d12a6872c3c2.fullname" . }}
  labels:
    {{- include "go-echo4ad9d9f8-2e05-4e3a-b476-d12a6872c3c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ad9d9f8-2e05-4e3a-b476-d12a6872c3c2.selectorLabels" . | nindent 6 }}
