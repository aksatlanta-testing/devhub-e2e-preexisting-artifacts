apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a4c9024-3fe7-4b70-95b5-e6566988d080.fullname" . }}
  labels:
    {{- include "go-echo2a4c9024-3fe7-4b70-95b5-e6566988d080.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a4c9024-3fe7-4b70-95b5-e6566988d080.selectorLabels" . | nindent 6 }}
