apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobee57dbb-65aa-4764-a118-89e7ae6a874a.fullname" . }}
  labels:
    {{- include "go-echobee57dbb-65aa-4764-a118-89e7ae6a874a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobee57dbb-65aa-4764-a118-89e7ae6a874a.selectorLabels" . | nindent 6 }}
