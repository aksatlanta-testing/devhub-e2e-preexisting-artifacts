apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5abe4c67-9278-4f6c-816c-6e3305b2352b.fullname" . }}
  labels:
    {{- include "go-echo5abe4c67-9278-4f6c-816c-6e3305b2352b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5abe4c67-9278-4f6c-816c-6e3305b2352b.selectorLabels" . | nindent 6 }}
