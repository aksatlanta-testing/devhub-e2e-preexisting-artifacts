apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69e91b9e-fff9-4a7c-a08f-09c5485ffb09.fullname" . }}
  labels:
    {{- include "go-echo69e91b9e-fff9-4a7c-a08f-09c5485ffb09.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69e91b9e-fff9-4a7c-a08f-09c5485ffb09.selectorLabels" . | nindent 6 }}
