apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo382f9183-aaf8-4057-bb20-0e8a7e239055.fullname" . }}
  labels:
    {{- include "go-echo382f9183-aaf8-4057-bb20-0e8a7e239055.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo382f9183-aaf8-4057-bb20-0e8a7e239055.selectorLabels" . | nindent 6 }}
