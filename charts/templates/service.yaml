apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d67b93b-7a64-4d88-8c58-839b7fdc6c81.fullname" . }}
  labels:
    {{- include "go-echo4d67b93b-7a64-4d88-8c58-839b7fdc6c81.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d67b93b-7a64-4d88-8c58-839b7fdc6c81.selectorLabels" . | nindent 6 }}
