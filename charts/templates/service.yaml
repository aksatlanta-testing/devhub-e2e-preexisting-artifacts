apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6db00e6c-e93c-4fa0-bb18-55960d973543.fullname" . }}
  labels:
    {{- include "go-echo6db00e6c-e93c-4fa0-bb18-55960d973543.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6db00e6c-e93c-4fa0-bb18-55960d973543.selectorLabels" . | nindent 6 }}
