apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08bfede5-3a41-4c32-b059-b76b23f79ec4.fullname" . }}
  labels:
    {{- include "go-echo08bfede5-3a41-4c32-b059-b76b23f79ec4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08bfede5-3a41-4c32-b059-b76b23f79ec4.selectorLabels" . | nindent 6 }}
