apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof85f05ab-3782-464f-be58-6c03078439b5.fullname" . }}
  labels:
    {{- include "go-echof85f05ab-3782-464f-be58-6c03078439b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof85f05ab-3782-464f-be58-6c03078439b5.selectorLabels" . | nindent 6 }}
