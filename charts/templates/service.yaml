apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof73173d9-0e7a-4855-9050-b629be0f67aa.fullname" . }}
  labels:
    {{- include "go-echof73173d9-0e7a-4855-9050-b629be0f67aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof73173d9-0e7a-4855-9050-b629be0f67aa.selectorLabels" . | nindent 6 }}
