apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50f1a3fe-7fb5-478b-8749-5e0883356c98.fullname" . }}
  labels:
    {{- include "go-echo50f1a3fe-7fb5-478b-8749-5e0883356c98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50f1a3fe-7fb5-478b-8749-5e0883356c98.selectorLabels" . | nindent 6 }}
