apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6738d9d0-04d7-42b3-951c-96b6243f3416.fullname" . }}
  labels:
    {{- include "go-echo6738d9d0-04d7-42b3-951c-96b6243f3416.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6738d9d0-04d7-42b3-951c-96b6243f3416.selectorLabels" . | nindent 6 }}
