apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ef294fc-f6a3-41e6-9aef-15f4e76e1dd1.fullname" . }}
  labels:
    {{- include "go-echo5ef294fc-f6a3-41e6-9aef-15f4e76e1dd1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ef294fc-f6a3-41e6-9aef-15f4e76e1dd1.selectorLabels" . | nindent 6 }}
