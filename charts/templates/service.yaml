apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod303ed7e-19f5-40ac-9529-2a8fc93c96bb.fullname" . }}
  labels:
    {{- include "go-echod303ed7e-19f5-40ac-9529-2a8fc93c96bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod303ed7e-19f5-40ac-9529-2a8fc93c96bb.selectorLabels" . | nindent 6 }}
