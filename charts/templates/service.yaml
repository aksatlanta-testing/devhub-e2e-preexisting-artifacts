apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0dd0c6ce-6371-4735-b329-7ad8b3ae9b5e.fullname" . }}
  labels:
    {{- include "go-echo0dd0c6ce-6371-4735-b329-7ad8b3ae9b5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0dd0c6ce-6371-4735-b329-7ad8b3ae9b5e.selectorLabels" . | nindent 6 }}
