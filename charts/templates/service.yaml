apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa96156b0-68a7-41c5-b5d8-9ed3a63498fa.fullname" . }}
  labels:
    {{- include "go-echoa96156b0-68a7-41c5-b5d8-9ed3a63498fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa96156b0-68a7-41c5-b5d8-9ed3a63498fa.selectorLabels" . | nindent 6 }}
