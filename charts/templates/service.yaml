apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo09c5b05a-1c6e-4006-8ad4-ce8e935c3074.fullname" . }}
  labels:
    {{- include "go-echo09c5b05a-1c6e-4006-8ad4-ce8e935c3074.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo09c5b05a-1c6e-4006-8ad4-ce8e935c3074.selectorLabels" . | nindent 6 }}
