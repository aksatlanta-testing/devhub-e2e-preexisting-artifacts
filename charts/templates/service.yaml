apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof023a4fc-342c-4a92-aff4-ae7bde47d2e7.fullname" . }}
  labels:
    {{- include "go-echof023a4fc-342c-4a92-aff4-ae7bde47d2e7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof023a4fc-342c-4a92-aff4-ae7bde47d2e7.selectorLabels" . | nindent 6 }}
