apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4a8a5c8-8255-4fe5-aeee-28a6f0a959dc.fullname" . }}
  labels:
    {{- include "go-echod4a8a5c8-8255-4fe5-aeee-28a6f0a959dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4a8a5c8-8255-4fe5-aeee-28a6f0a959dc.selectorLabels" . | nindent 6 }}
