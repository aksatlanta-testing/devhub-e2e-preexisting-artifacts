apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b44144c-63fa-4b53-96da-bbc6f17ed33b.fullname" . }}
  labels:
    {{- include "go-echo8b44144c-63fa-4b53-96da-bbc6f17ed33b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b44144c-63fa-4b53-96da-bbc6f17ed33b.selectorLabels" . | nindent 6 }}
