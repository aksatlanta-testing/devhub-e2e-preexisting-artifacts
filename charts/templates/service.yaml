apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f328643-1e7b-47b3-b736-3e3f57459988.fullname" . }}
  labels:
    {{- include "go-echo2f328643-1e7b-47b3-b736-3e3f57459988.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f328643-1e7b-47b3-b736-3e3f57459988.selectorLabels" . | nindent 6 }}
