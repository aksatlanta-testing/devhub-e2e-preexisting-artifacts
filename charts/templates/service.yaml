apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73eff97c-a322-4e3c-91db-e71c8ae73941.fullname" . }}
  labels:
    {{- include "go-echo73eff97c-a322-4e3c-91db-e71c8ae73941.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73eff97c-a322-4e3c-91db-e71c8ae73941.selectorLabels" . | nindent 6 }}
