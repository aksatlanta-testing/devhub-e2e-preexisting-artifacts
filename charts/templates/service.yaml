apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3d43643-c341-48c5-a7c6-b3b247a29233.fullname" . }}
  labels:
    {{- include "go-echoc3d43643-c341-48c5-a7c6-b3b247a29233.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3d43643-c341-48c5-a7c6-b3b247a29233.selectorLabels" . | nindent 6 }}
