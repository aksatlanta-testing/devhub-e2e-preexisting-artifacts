apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo217b76dc-339b-4d89-af98-3a5ca17d178f.fullname" . }}
  labels:
    {{- include "go-echo217b76dc-339b-4d89-af98-3a5ca17d178f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo217b76dc-339b-4d89-af98-3a5ca17d178f.selectorLabels" . | nindent 6 }}
