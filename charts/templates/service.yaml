apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ff9db1a-07da-446e-b6bd-cb65ba5e0a5b.fullname" . }}
  labels:
    {{- include "go-echo4ff9db1a-07da-446e-b6bd-cb65ba5e0a5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ff9db1a-07da-446e-b6bd-cb65ba5e0a5b.selectorLabels" . | nindent 6 }}
