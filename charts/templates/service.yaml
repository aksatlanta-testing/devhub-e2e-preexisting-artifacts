apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7e9da5d-5676-42a7-88f4-a1933a04c890.fullname" . }}
  labels:
    {{- include "go-echoa7e9da5d-5676-42a7-88f4-a1933a04c890.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7e9da5d-5676-42a7-88f4-a1933a04c890.selectorLabels" . | nindent 6 }}
