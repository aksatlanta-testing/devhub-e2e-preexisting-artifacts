apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8184441e-9f82-42f9-9454-ec4df4f29f9e.fullname" . }}
  labels:
    {{- include "go-echo8184441e-9f82-42f9-9454-ec4df4f29f9e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8184441e-9f82-42f9-9454-ec4df4f29f9e.selectorLabels" . | nindent 6 }}
