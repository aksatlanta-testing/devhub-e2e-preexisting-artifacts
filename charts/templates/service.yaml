apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3dc28566-617f-4132-a2e3-97f113f84100.fullname" . }}
  labels:
    {{- include "go-echo3dc28566-617f-4132-a2e3-97f113f84100.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3dc28566-617f-4132-a2e3-97f113f84100.selectorLabels" . | nindent 6 }}
