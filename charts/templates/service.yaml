apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20752914-70e5-4d45-8204-e0c43c79746b.fullname" . }}
  labels:
    {{- include "go-echo20752914-70e5-4d45-8204-e0c43c79746b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20752914-70e5-4d45-8204-e0c43c79746b.selectorLabels" . | nindent 6 }}
