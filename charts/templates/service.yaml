apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7dd7cbf-537e-4ea2-aa7f-5d9150e677d8.fullname" . }}
  labels:
    {{- include "go-echob7dd7cbf-537e-4ea2-aa7f-5d9150e677d8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7dd7cbf-537e-4ea2-aa7f-5d9150e677d8.selectorLabels" . | nindent 6 }}
