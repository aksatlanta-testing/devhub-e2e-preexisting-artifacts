apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo830067f2-f355-4584-90e4-0594ac22fc0c.fullname" . }}
  labels:
    {{- include "go-echo830067f2-f355-4584-90e4-0594ac22fc0c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo830067f2-f355-4584-90e4-0594ac22fc0c.selectorLabels" . | nindent 6 }}
