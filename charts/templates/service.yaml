apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd257e35-81db-4b0a-9dd6-b6e06a00d99f.fullname" . }}
  labels:
    {{- include "go-echocd257e35-81db-4b0a-9dd6-b6e06a00d99f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd257e35-81db-4b0a-9dd6-b6e06a00d99f.selectorLabels" . | nindent 6 }}
