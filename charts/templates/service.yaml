apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23c2eae9-5930-43f7-996d-bc6f9a342a3e.fullname" . }}
  labels:
    {{- include "go-echo23c2eae9-5930-43f7-996d-bc6f9a342a3e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23c2eae9-5930-43f7-996d-bc6f9a342a3e.selectorLabels" . | nindent 6 }}
