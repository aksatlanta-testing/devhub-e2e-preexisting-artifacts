apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2bdcab4a-4d87-43bf-9bcc-a2204239153f.fullname" . }}
  labels:
    {{- include "go-echo2bdcab4a-4d87-43bf-9bcc-a2204239153f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2bdcab4a-4d87-43bf-9bcc-a2204239153f.selectorLabels" . | nindent 6 }}
