apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23aefdf5-ce0d-4e77-980d-52bd950f6914.fullname" . }}
  labels:
    {{- include "go-echo23aefdf5-ce0d-4e77-980d-52bd950f6914.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23aefdf5-ce0d-4e77-980d-52bd950f6914.selectorLabels" . | nindent 6 }}
