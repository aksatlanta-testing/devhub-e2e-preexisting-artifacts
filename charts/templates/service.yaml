apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae890e48-cdfe-4654-aa9a-8ec4aee761f6.fullname" . }}
  labels:
    {{- include "go-echoae890e48-cdfe-4654-aa9a-8ec4aee761f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae890e48-cdfe-4654-aa9a-8ec4aee761f6.selectorLabels" . | nindent 6 }}
