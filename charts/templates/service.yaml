apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6db02b22-c098-4b0a-9927-2b40d5bb559a.fullname" . }}
  labels:
    {{- include "go-echo6db02b22-c098-4b0a-9927-2b40d5bb559a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6db02b22-c098-4b0a-9927-2b40d5bb559a.selectorLabels" . | nindent 6 }}
