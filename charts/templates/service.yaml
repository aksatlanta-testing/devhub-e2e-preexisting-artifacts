apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod775fa8f-a60d-4a9a-a0dc-36f8baa7aaef.fullname" . }}
  labels:
    {{- include "go-echod775fa8f-a60d-4a9a-a0dc-36f8baa7aaef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod775fa8f-a60d-4a9a-a0dc-36f8baa7aaef.selectorLabels" . | nindent 6 }}
