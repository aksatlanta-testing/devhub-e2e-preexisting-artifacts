apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22d75273-f9ee-4918-8886-5c1cfee7da07.fullname" . }}
  labels:
    {{- include "go-echo22d75273-f9ee-4918-8886-5c1cfee7da07.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22d75273-f9ee-4918-8886-5c1cfee7da07.selectorLabels" . | nindent 6 }}
