apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f74186a-0998-409f-a7d6-eb89cd9ac384.fullname" . }}
  labels:
    {{- include "go-echo1f74186a-0998-409f-a7d6-eb89cd9ac384.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
