apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64ff2f12-b6ac-4199-a888-7bb76a7b39fb.fullname" . }}
  labels:
    {{- include "go-echo64ff2f12-b6ac-4199-a888-7bb76a7b39fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64ff2f12-b6ac-4199-a888-7bb76a7b39fb.selectorLabels" . | nindent 6 }}
