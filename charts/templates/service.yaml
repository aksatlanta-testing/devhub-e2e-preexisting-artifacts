apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00f7f6c2-aeac-41ad-a401-999e9579ab24.fullname" . }}
  labels:
    {{- include "go-echo00f7f6c2-aeac-41ad-a401-999e9579ab24.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00f7f6c2-aeac-41ad-a401-999e9579ab24.selectorLabels" . | nindent 6 }}
