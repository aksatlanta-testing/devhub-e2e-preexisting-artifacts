apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4472e57-9deb-47de-a229-c9bb3723dc16.fullname" . }}
  labels:
    {{- include "go-echod4472e57-9deb-47de-a229-c9bb3723dc16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4472e57-9deb-47de-a229-c9bb3723dc16.selectorLabels" . | nindent 6 }}
