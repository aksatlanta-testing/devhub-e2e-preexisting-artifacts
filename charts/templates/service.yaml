apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe81e1bf8-fe05-49cf-8653-d29243877e47.fullname" . }}
  labels:
    {{- include "go-echoe81e1bf8-fe05-49cf-8653-d29243877e47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe81e1bf8-fe05-49cf-8653-d29243877e47.selectorLabels" . | nindent 6 }}
