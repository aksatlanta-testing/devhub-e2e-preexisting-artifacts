apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65785fc5-1e9e-41b7-bf8f-16952c2857e4.fullname" . }}
  labels:
    {{- include "go-echo65785fc5-1e9e-41b7-bf8f-16952c2857e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65785fc5-1e9e-41b7-bf8f-16952c2857e4.selectorLabels" . | nindent 6 }}
