apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda1b75c8-7f4f-49d9-b656-9e38b1f40335.fullname" . }}
  labels:
    {{- include "go-echoda1b75c8-7f4f-49d9-b656-9e38b1f40335.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda1b75c8-7f4f-49d9-b656-9e38b1f40335.selectorLabels" . | nindent 6 }}
