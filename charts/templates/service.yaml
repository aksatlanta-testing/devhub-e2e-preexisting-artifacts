apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5dc69dd-2a0d-4727-8de4-7788267bd011.fullname" . }}
  labels:
    {{- include "go-echob5dc69dd-2a0d-4727-8de4-7788267bd011.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5dc69dd-2a0d-4727-8de4-7788267bd011.selectorLabels" . | nindent 6 }}
