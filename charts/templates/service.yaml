apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53bd498b-5362-4aeb-9c0c-e4217f13dd25.fullname" . }}
  labels:
    {{- include "go-echo53bd498b-5362-4aeb-9c0c-e4217f13dd25.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53bd498b-5362-4aeb-9c0c-e4217f13dd25.selectorLabels" . | nindent 6 }}
