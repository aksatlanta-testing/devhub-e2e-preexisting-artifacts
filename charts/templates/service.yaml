apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc33a342-acb5-4a14-83b8-eb68bf7a7482.fullname" . }}
  labels:
    {{- include "go-echocc33a342-acb5-4a14-83b8-eb68bf7a7482.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc33a342-acb5-4a14-83b8-eb68bf7a7482.selectorLabels" . | nindent 6 }}
