apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90ba88e5-3ad1-4fad-bdf1-f858e942fdef.fullname" . }}
  labels:
    {{- include "go-echo90ba88e5-3ad1-4fad-bdf1-f858e942fdef.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90ba88e5-3ad1-4fad-bdf1-f858e942fdef.selectorLabels" . | nindent 6 }}
