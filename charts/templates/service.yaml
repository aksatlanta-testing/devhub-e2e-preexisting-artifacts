apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1eab9ed-ff42-4bf9-a013-83c3e4115e97.fullname" . }}
  labels:
    {{- include "go-echod1eab9ed-ff42-4bf9-a013-83c3e4115e97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1eab9ed-ff42-4bf9-a013-83c3e4115e97.selectorLabels" . | nindent 6 }}
