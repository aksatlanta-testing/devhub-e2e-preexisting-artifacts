apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d657f65-8752-4a0b-bb60-8677b1845f78.fullname" . }}
  labels:
    {{- include "go-echo8d657f65-8752-4a0b-bb60-8677b1845f78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d657f65-8752-4a0b-bb60-8677b1845f78.selectorLabels" . | nindent 6 }}
