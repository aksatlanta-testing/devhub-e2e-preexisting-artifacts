apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f726421-bf74-4145-b75d-d7bc4efdabf5.fullname" . }}
  labels:
    {{- include "go-echo3f726421-bf74-4145-b75d-d7bc4efdabf5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f726421-bf74-4145-b75d-d7bc4efdabf5.selectorLabels" . | nindent 6 }}
