apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e38ecca-9f48-4f7a-acf4-017d23f0dd15.fullname" . }}
  labels:
    {{- include "go-echo9e38ecca-9f48-4f7a-acf4-017d23f0dd15.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e38ecca-9f48-4f7a-acf4-017d23f0dd15.selectorLabels" . | nindent 6 }}
