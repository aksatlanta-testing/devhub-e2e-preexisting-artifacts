apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a560857-85a5-414d-8862-b9fdf8876647.fullname" . }}
  labels:
    {{- include "go-echo9a560857-85a5-414d-8862-b9fdf8876647.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a560857-85a5-414d-8862-b9fdf8876647.selectorLabels" . | nindent 6 }}
