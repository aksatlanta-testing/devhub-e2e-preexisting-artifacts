apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91814095-29d3-49b1-ae8c-33eac2640b63.fullname" . }}
  labels:
    {{- include "go-echo91814095-29d3-49b1-ae8c-33eac2640b63.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91814095-29d3-49b1-ae8c-33eac2640b63.selectorLabels" . | nindent 6 }}
