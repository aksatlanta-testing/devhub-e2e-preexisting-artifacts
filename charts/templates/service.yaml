apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99a795eb-beac-4cb9-a34e-56c1201692f3.fullname" . }}
  labels:
    {{- include "go-echo99a795eb-beac-4cb9-a34e-56c1201692f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99a795eb-beac-4cb9-a34e-56c1201692f3.selectorLabels" . | nindent 6 }}
