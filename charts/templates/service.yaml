apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8958c6e-7fbd-473e-8b10-801b2a43809f.fullname" . }}
  labels:
    {{- include "go-echoa8958c6e-7fbd-473e-8b10-801b2a43809f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8958c6e-7fbd-473e-8b10-801b2a43809f.selectorLabels" . | nindent 6 }}
