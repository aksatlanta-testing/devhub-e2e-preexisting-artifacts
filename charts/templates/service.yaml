apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32beb5a2-0f8c-4f4a-b658-be5976e823cd.fullname" . }}
  labels:
    {{- include "go-echo32beb5a2-0f8c-4f4a-b658-be5976e823cd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32beb5a2-0f8c-4f4a-b658-be5976e823cd.selectorLabels" . | nindent 6 }}
