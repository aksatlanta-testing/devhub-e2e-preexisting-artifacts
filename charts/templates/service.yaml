apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5a39187-29ff-4ed4-a76c-74bec9480b9a.fullname" . }}
  labels:
    {{- include "go-echod5a39187-29ff-4ed4-a76c-74bec9480b9a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5a39187-29ff-4ed4-a76c-74bec9480b9a.selectorLabels" . | nindent 6 }}
