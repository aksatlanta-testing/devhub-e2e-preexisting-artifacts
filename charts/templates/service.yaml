apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d2d292f-1baa-4810-b587-4307ad29e923.fullname" . }}
  labels:
    {{- include "go-echo2d2d292f-1baa-4810-b587-4307ad29e923.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d2d292f-1baa-4810-b587-4307ad29e923.selectorLabels" . | nindent 6 }}
