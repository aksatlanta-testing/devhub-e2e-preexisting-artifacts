apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoada2f62e-0b8f-4880-9e83-ae2b3f92366d.fullname" . }}
  labels:
    {{- include "go-echoada2f62e-0b8f-4880-9e83-ae2b3f92366d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoada2f62e-0b8f-4880-9e83-ae2b3f92366d.selectorLabels" . | nindent 6 }}
