apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo098919f1-2e1a-45ef-b4e4-5cd8be9a5460.fullname" . }}
  labels:
    {{- include "go-echo098919f1-2e1a-45ef-b4e4-5cd8be9a5460.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo098919f1-2e1a-45ef-b4e4-5cd8be9a5460.selectorLabels" . | nindent 6 }}
