apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo081e287d-65f8-48c9-bcbd-bb1c013bae58.fullname" . }}
  labels:
    {{- include "go-echo081e287d-65f8-48c9-bcbd-bb1c013bae58.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo081e287d-65f8-48c9-bcbd-bb1c013bae58.selectorLabels" . | nindent 6 }}
