apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0615b3d8-bdf6-4682-a940-e3942e9a9f7b.fullname" . }}
  labels:
    {{- include "go-echo0615b3d8-bdf6-4682-a940-e3942e9a9f7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0615b3d8-bdf6-4682-a940-e3942e9a9f7b.selectorLabels" . | nindent 6 }}
