apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo151539b1-193d-4ac6-aa55-702fa0a9224d.fullname" . }}
  labels:
    {{- include "go-echo151539b1-193d-4ac6-aa55-702fa0a9224d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo151539b1-193d-4ac6-aa55-702fa0a9224d.selectorLabels" . | nindent 6 }}
