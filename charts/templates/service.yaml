apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf2e0458-9f4d-4725-bc70-8af7afc04f79.fullname" . }}
  labels:
    {{- include "go-echodf2e0458-9f4d-4725-bc70-8af7afc04f79.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf2e0458-9f4d-4725-bc70-8af7afc04f79.selectorLabels" . | nindent 6 }}
