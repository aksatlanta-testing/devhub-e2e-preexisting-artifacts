apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01c624bc-c670-43e8-93f1-542e2926ad47.fullname" . }}
  labels:
    {{- include "go-echo01c624bc-c670-43e8-93f1-542e2926ad47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01c624bc-c670-43e8-93f1-542e2926ad47.selectorLabels" . | nindent 6 }}
