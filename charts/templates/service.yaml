apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f7a0dc8-02b0-4ccd-a0e5-02a3dd75fcc9.fullname" . }}
  labels:
    {{- include "go-echo0f7a0dc8-02b0-4ccd-a0e5-02a3dd75fcc9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f7a0dc8-02b0-4ccd-a0e5-02a3dd75fcc9.selectorLabels" . | nindent 6 }}
