apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9119b52-7272-48d1-99b8-69d9e0b4dd6a.fullname" . }}
  labels:
    {{- include "go-echoc9119b52-7272-48d1-99b8-69d9e0b4dd6a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9119b52-7272-48d1-99b8-69d9e0b4dd6a.selectorLabels" . | nindent 6 }}
