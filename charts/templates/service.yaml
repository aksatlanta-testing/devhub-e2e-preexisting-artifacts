apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26dbffe7-f7c2-4015-af4d-cf76b7a61bb8.fullname" . }}
  labels:
    {{- include "go-echo26dbffe7-f7c2-4015-af4d-cf76b7a61bb8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26dbffe7-f7c2-4015-af4d-cf76b7a61bb8.selectorLabels" . | nindent 6 }}
