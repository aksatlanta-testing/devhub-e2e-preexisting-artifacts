apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebd1f8ad-cc81-4c2c-9014-f2e4df8bb8ce.fullname" . }}
  labels:
    {{- include "go-echoebd1f8ad-cc81-4c2c-9014-f2e4df8bb8ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebd1f8ad-cc81-4c2c-9014-f2e4df8bb8ce.selectorLabels" . | nindent 6 }}
