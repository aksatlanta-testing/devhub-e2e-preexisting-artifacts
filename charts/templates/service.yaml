apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f0f617c-a820-4dac-9a35-8ddb988c3835.fullname" . }}
  labels:
    {{- include "go-echo5f0f617c-a820-4dac-9a35-8ddb988c3835.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f0f617c-a820-4dac-9a35-8ddb988c3835.selectorLabels" . | nindent 6 }}
