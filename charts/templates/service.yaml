apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a4bf991-09aa-46ff-bd9d-4dd037721527.fullname" . }}
  labels:
    {{- include "go-echo7a4bf991-09aa-46ff-bd9d-4dd037721527.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a4bf991-09aa-46ff-bd9d-4dd037721527.selectorLabels" . | nindent 6 }}
