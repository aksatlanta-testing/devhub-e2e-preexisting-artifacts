apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo833a2240-2908-4d5c-8b32-3c856932039f.fullname" . }}
  labels:
    {{- include "go-echo833a2240-2908-4d5c-8b32-3c856932039f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo833a2240-2908-4d5c-8b32-3c856932039f.selectorLabels" . | nindent 6 }}
