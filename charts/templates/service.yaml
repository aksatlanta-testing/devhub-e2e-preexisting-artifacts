apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2759d25-1a1a-4488-af0d-0b433a53e3a1.fullname" . }}
  labels:
    {{- include "go-echod2759d25-1a1a-4488-af0d-0b433a53e3a1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2759d25-1a1a-4488-af0d-0b433a53e3a1.selectorLabels" . | nindent 6 }}
