apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61cf7d62-c5c2-435d-a639-c5ad5f21acb8.fullname" . }}
  labels:
    {{- include "go-echo61cf7d62-c5c2-435d-a639-c5ad5f21acb8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61cf7d62-c5c2-435d-a639-c5ad5f21acb8.selectorLabels" . | nindent 6 }}
