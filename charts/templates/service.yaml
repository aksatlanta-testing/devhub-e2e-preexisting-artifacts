apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0625fe44-cc99-40ae-a0ed-91f7620c47a5.fullname" . }}
  labels:
    {{- include "go-echo0625fe44-cc99-40ae-a0ed-91f7620c47a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0625fe44-cc99-40ae-a0ed-91f7620c47a5.selectorLabels" . | nindent 6 }}
