apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe67b5c9b-7225-46d7-a996-df72e7ae2c45.fullname" . }}
  labels:
    {{- include "go-echoe67b5c9b-7225-46d7-a996-df72e7ae2c45.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe67b5c9b-7225-46d7-a996-df72e7ae2c45.selectorLabels" . | nindent 6 }}
