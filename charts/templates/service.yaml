apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58bebe80-104e-4091-b947-b61ec1539708.fullname" . }}
  labels:
    {{- include "go-echo58bebe80-104e-4091-b947-b61ec1539708.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58bebe80-104e-4091-b947-b61ec1539708.selectorLabels" . | nindent 6 }}
