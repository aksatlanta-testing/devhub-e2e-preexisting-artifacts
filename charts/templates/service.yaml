apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f0e15d1-1782-4130-82c0-c770ca5e8c53.fullname" . }}
  labels:
    {{- include "go-echo5f0e15d1-1782-4130-82c0-c770ca5e8c53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f0e15d1-1782-4130-82c0-c770ca5e8c53.selectorLabels" . | nindent 6 }}
