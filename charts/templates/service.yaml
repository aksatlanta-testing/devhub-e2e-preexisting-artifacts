apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6a1139b-3e88-447a-b2f4-22f8af211d87.fullname" . }}
  labels:
    {{- include "go-echoe6a1139b-3e88-447a-b2f4-22f8af211d87.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6a1139b-3e88-447a-b2f4-22f8af211d87.selectorLabels" . | nindent 6 }}
