apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaff641d0-d23b-4435-bd29-09cf57543843.fullname" . }}
  labels:
    {{- include "go-echoaff641d0-d23b-4435-bd29-09cf57543843.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaff641d0-d23b-4435-bd29-09cf57543843.selectorLabels" . | nindent 6 }}
