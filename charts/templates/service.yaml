apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocbed832b-357a-48cf-892f-4e101934a9a3.fullname" . }}
  labels:
    {{- include "go-echocbed832b-357a-48cf-892f-4e101934a9a3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocbed832b-357a-48cf-892f-4e101934a9a3.selectorLabels" . | nindent 6 }}
