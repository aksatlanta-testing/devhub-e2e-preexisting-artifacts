apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34a32ea7-d575-4941-a44e-55c51ac81807.fullname" . }}
  labels:
    {{- include "go-echo34a32ea7-d575-4941-a44e-55c51ac81807.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34a32ea7-d575-4941-a44e-55c51ac81807.selectorLabels" . | nindent 6 }}
