apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0e2bf89-b25e-43c6-9762-94fd29ee3dee.fullname" . }}
  labels:
    {{- include "go-echoe0e2bf89-b25e-43c6-9762-94fd29ee3dee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0e2bf89-b25e-43c6-9762-94fd29ee3dee.selectorLabels" . | nindent 6 }}
