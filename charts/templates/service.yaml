apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc51b1acf-021c-47f9-bf41-2d0f83d936d2.fullname" . }}
  labels:
    {{- include "go-echoc51b1acf-021c-47f9-bf41-2d0f83d936d2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc51b1acf-021c-47f9-bf41-2d0f83d936d2.selectorLabels" . | nindent 6 }}
