apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo287d574c-1e88-42c9-8101-0abacdc2955d.fullname" . }}
  labels:
    {{- include "go-echo287d574c-1e88-42c9-8101-0abacdc2955d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo287d574c-1e88-42c9-8101-0abacdc2955d.selectorLabels" . | nindent 6 }}
