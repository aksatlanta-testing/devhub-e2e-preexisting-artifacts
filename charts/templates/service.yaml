apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64dd1647-5e4c-4808-9dec-7d7e1d470aa1.fullname" . }}
  labels:
    {{- include "go-echo64dd1647-5e4c-4808-9dec-7d7e1d470aa1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64dd1647-5e4c-4808-9dec-7d7e1d470aa1.selectorLabels" . | nindent 6 }}
