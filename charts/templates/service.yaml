apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e4feebc-0c37-47d7-bce6-a19a255d6064.fullname" . }}
  labels:
    {{- include "go-echo1e4feebc-0c37-47d7-bce6-a19a255d6064.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e4feebc-0c37-47d7-bce6-a19a255d6064.selectorLabels" . | nindent 6 }}
