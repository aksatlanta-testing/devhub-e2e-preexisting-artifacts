apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof65e2649-f1e8-49ad-b4a8-fab122e72cc6.fullname" . }}
  labels:
    {{- include "go-echof65e2649-f1e8-49ad-b4a8-fab122e72cc6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof65e2649-f1e8-49ad-b4a8-fab122e72cc6.selectorLabels" . | nindent 6 }}
