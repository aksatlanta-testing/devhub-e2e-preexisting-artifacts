apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc68579a-ecd8-42d6-811c-5e69d2c84951.fullname" . }}
  labels:
    {{- include "go-echobc68579a-ecd8-42d6-811c-5e69d2c84951.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc68579a-ecd8-42d6-811c-5e69d2c84951.selectorLabels" . | nindent 6 }}
