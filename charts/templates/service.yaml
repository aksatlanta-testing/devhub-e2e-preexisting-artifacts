apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e2b3400-3162-4ed3-b411-30807b17a6b4.fullname" . }}
  labels:
    {{- include "go-echo6e2b3400-3162-4ed3-b411-30807b17a6b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e2b3400-3162-4ed3-b411-30807b17a6b4.selectorLabels" . | nindent 6 }}
