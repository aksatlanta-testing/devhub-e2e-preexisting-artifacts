apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08272f60-d732-4ea1-9a7b-7db9e05a13ab.fullname" . }}
  labels:
    {{- include "go-echo08272f60-d732-4ea1-9a7b-7db9e05a13ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08272f60-d732-4ea1-9a7b-7db9e05a13ab.selectorLabels" . | nindent 6 }}
