apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84a34086-3b54-43d2-a5d4-488eecbfec45.fullname" . }}
  labels:
    {{- include "go-echo84a34086-3b54-43d2-a5d4-488eecbfec45.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84a34086-3b54-43d2-a5d4-488eecbfec45.selectorLabels" . | nindent 6 }}
