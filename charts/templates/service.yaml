apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo185f0d96-e295-41e4-b929-80265a129f69.fullname" . }}
  labels:
    {{- include "go-echo185f0d96-e295-41e4-b929-80265a129f69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo185f0d96-e295-41e4-b929-80265a129f69.selectorLabels" . | nindent 6 }}
