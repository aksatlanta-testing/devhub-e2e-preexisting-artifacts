apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9920c04-6721-47d4-a225-9626f5db1cb8.fullname" . }}
  labels:
    {{- include "go-echoa9920c04-6721-47d4-a225-9626f5db1cb8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9920c04-6721-47d4-a225-9626f5db1cb8.selectorLabels" . | nindent 6 }}
