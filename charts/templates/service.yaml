apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5adb01a-1a78-4849-b826-27fa16e3d6dc.fullname" . }}
  labels:
    {{- include "go-echoc5adb01a-1a78-4849-b826-27fa16e3d6dc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5adb01a-1a78-4849-b826-27fa16e3d6dc.selectorLabels" . | nindent 6 }}
