apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a0391d6-74dd-4d78-9cf1-af657874bf69.fullname" . }}
  labels:
    {{- include "go-echo6a0391d6-74dd-4d78-9cf1-af657874bf69.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a0391d6-74dd-4d78-9cf1-af657874bf69.selectorLabels" . | nindent 6 }}
