apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod478d566-3c04-4df3-93ab-4de6014a8cfe.fullname" . }}
  labels:
    {{- include "go-echod478d566-3c04-4df3-93ab-4de6014a8cfe.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod478d566-3c04-4df3-93ab-4de6014a8cfe.selectorLabels" . | nindent 6 }}
