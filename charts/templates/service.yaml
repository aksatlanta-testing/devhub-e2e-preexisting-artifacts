apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo183ac205-fcb5-4ed5-94d9-29dd8f83f4c2.fullname" . }}
  labels:
    {{- include "go-echo183ac205-fcb5-4ed5-94d9-29dd8f83f4c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo183ac205-fcb5-4ed5-94d9-29dd8f83f4c2.selectorLabels" . | nindent 6 }}
