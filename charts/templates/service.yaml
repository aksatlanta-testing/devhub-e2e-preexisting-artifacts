apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe32fb230-6bb4-4121-90cd-f2c61c093638.fullname" . }}
  labels:
    {{- include "go-echoe32fb230-6bb4-4121-90cd-f2c61c093638.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe32fb230-6bb4-4121-90cd-f2c61c093638.selectorLabels" . | nindent 6 }}
