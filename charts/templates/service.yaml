apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2832266b-9cbb-49cb-958d-d242a23e1d6a.fullname" . }}
  labels:
    {{- include "go-echo2832266b-9cbb-49cb-958d-d242a23e1d6a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2832266b-9cbb-49cb-958d-d242a23e1d6a.selectorLabels" . | nindent 6 }}
