apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf01fa08-dae7-49c1-bc9a-7a9029219900.fullname" . }}
  labels:
    {{- include "go-echodf01fa08-dae7-49c1-bc9a-7a9029219900.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf01fa08-dae7-49c1-bc9a-7a9029219900.selectorLabels" . | nindent 6 }}
