apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo386becc6-31a8-4c56-baf8-4183b61afb36.fullname" . }}
  labels:
    {{- include "go-echo386becc6-31a8-4c56-baf8-4183b61afb36.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo386becc6-31a8-4c56-baf8-4183b61afb36.selectorLabels" . | nindent 6 }}
