apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo146eb546-bf50-42e4-8ef1-53c539e1ed19.fullname" . }}
  labels:
    {{- include "go-echo146eb546-bf50-42e4-8ef1-53c539e1ed19.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo146eb546-bf50-42e4-8ef1-53c539e1ed19.selectorLabels" . | nindent 6 }}
