apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod000f3ca-4144-4dc6-9a1a-0d34f6746114.fullname" . }}
  labels:
    {{- include "go-echod000f3ca-4144-4dc6-9a1a-0d34f6746114.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod000f3ca-4144-4dc6-9a1a-0d34f6746114.selectorLabels" . | nindent 6 }}
