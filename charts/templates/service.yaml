apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaefc5606-9e1d-4694-93a8-d21cbc61a161.fullname" . }}
  labels:
    {{- include "go-echoaefc5606-9e1d-4694-93a8-d21cbc61a161.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaefc5606-9e1d-4694-93a8-d21cbc61a161.selectorLabels" . | nindent 6 }}
