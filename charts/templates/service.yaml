apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32b22946-0020-4856-a638-33fd315fcf35.fullname" . }}
  labels:
    {{- include "go-echo32b22946-0020-4856-a638-33fd315fcf35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32b22946-0020-4856-a638-33fd315fcf35.selectorLabels" . | nindent 6 }}
