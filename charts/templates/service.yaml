apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec3d3787-227a-4462-b796-233bc51ff90b.fullname" . }}
  labels:
    {{- include "go-echoec3d3787-227a-4462-b796-233bc51ff90b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec3d3787-227a-4462-b796-233bc51ff90b.selectorLabels" . | nindent 6 }}
