apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42de7813-b7c8-40b4-a697-ab35dd8cef4b.fullname" . }}
  labels:
    {{- include "go-echo42de7813-b7c8-40b4-a697-ab35dd8cef4b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42de7813-b7c8-40b4-a697-ab35dd8cef4b.selectorLabels" . | nindent 6 }}
