apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob19e6fa5-25c8-41dd-8b36-d5c336ec4427.fullname" . }}
  labels:
    {{- include "go-echob19e6fa5-25c8-41dd-8b36-d5c336ec4427.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob19e6fa5-25c8-41dd-8b36-d5c336ec4427.selectorLabels" . | nindent 6 }}
