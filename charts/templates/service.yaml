apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66237e22-312c-4d79-afae-b03b0b7263cb.fullname" . }}
  labels:
    {{- include "go-echo66237e22-312c-4d79-afae-b03b0b7263cb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66237e22-312c-4d79-afae-b03b0b7263cb.selectorLabels" . | nindent 6 }}
