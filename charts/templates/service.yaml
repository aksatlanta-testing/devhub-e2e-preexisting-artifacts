apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9886b5f7-3fe0-44ec-a81c-f934121d6e56.fullname" . }}
  labels:
    {{- include "go-echo9886b5f7-3fe0-44ec-a81c-f934121d6e56.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9886b5f7-3fe0-44ec-a81c-f934121d6e56.selectorLabels" . | nindent 6 }}
