apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod82627ad-f43e-4d97-8474-434f28137fcf.fullname" . }}
  labels:
    {{- include "go-echod82627ad-f43e-4d97-8474-434f28137fcf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod82627ad-f43e-4d97-8474-434f28137fcf.selectorLabels" . | nindent 6 }}
