apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe229dd3-823d-43ef-a984-1bcdf73465bb.fullname" . }}
  labels:
    {{- include "go-echobe229dd3-823d-43ef-a984-1bcdf73465bb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe229dd3-823d-43ef-a984-1bcdf73465bb.selectorLabels" . | nindent 6 }}
