apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodee754e7-6d85-4067-a538-00cdadb64050.fullname" . }}
  labels:
    {{- include "go-echodee754e7-6d85-4067-a538-00cdadb64050.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodee754e7-6d85-4067-a538-00cdadb64050.selectorLabels" . | nindent 6 }}
