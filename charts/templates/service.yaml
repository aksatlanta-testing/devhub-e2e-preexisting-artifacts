apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod346e47f-9ef8-4d74-a946-fb91b9d0a3a5.fullname" . }}
  labels:
    {{- include "go-echod346e47f-9ef8-4d74-a946-fb91b9d0a3a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod346e47f-9ef8-4d74-a946-fb91b9d0a3a5.selectorLabels" . | nindent 6 }}
