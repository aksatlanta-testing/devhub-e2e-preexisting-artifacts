apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac4b4790-486a-4cf3-ba2c-086e1e6ff993.fullname" . }}
  labels:
    {{- include "go-echoac4b4790-486a-4cf3-ba2c-086e1e6ff993.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac4b4790-486a-4cf3-ba2c-086e1e6ff993.selectorLabels" . | nindent 6 }}
