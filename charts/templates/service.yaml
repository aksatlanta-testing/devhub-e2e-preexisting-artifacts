apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode87e0fb-3c82-43b3-855e-fd9498bc9c79.fullname" . }}
  labels:
    {{- include "go-echode87e0fb-3c82-43b3-855e-fd9498bc9c79.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode87e0fb-3c82-43b3-855e-fd9498bc9c79.selectorLabels" . | nindent 6 }}
