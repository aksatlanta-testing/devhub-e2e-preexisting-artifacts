apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70d6cb5e-f82e-4f63-958f-b42642e2f568.fullname" . }}
  labels:
    {{- include "go-echo70d6cb5e-f82e-4f63-958f-b42642e2f568.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70d6cb5e-f82e-4f63-958f-b42642e2f568.selectorLabels" . | nindent 6 }}
