apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo041cdb70-080b-4a45-960e-06433c446f49.fullname" . }}
  labels:
    {{- include "go-echo041cdb70-080b-4a45-960e-06433c446f49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo041cdb70-080b-4a45-960e-06433c446f49.selectorLabels" . | nindent 6 }}
