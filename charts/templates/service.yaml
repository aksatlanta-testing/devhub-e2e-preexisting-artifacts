apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37b02c63-ac72-44c0-97ba-9d35dc029cac.fullname" . }}
  labels:
    {{- include "go-echo37b02c63-ac72-44c0-97ba-9d35dc029cac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37b02c63-ac72-44c0-97ba-9d35dc029cac.selectorLabels" . | nindent 6 }}
