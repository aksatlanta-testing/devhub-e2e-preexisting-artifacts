apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97e1a072-5c84-4319-8b0c-570ee0ce7c60.fullname" . }}
  labels:
    {{- include "go-echo97e1a072-5c84-4319-8b0c-570ee0ce7c60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97e1a072-5c84-4319-8b0c-570ee0ce7c60.selectorLabels" . | nindent 6 }}
