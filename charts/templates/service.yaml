apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebd36872-51a9-4b35-9534-ae3c8a65e540.fullname" . }}
  labels:
    {{- include "go-echoebd36872-51a9-4b35-9534-ae3c8a65e540.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebd36872-51a9-4b35-9534-ae3c8a65e540.selectorLabels" . | nindent 6 }}
