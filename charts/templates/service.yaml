apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo167c6935-2586-4ff4-be94-6ca6c1c6ee1d.fullname" . }}
  labels:
    {{- include "go-echo167c6935-2586-4ff4-be94-6ca6c1c6ee1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo167c6935-2586-4ff4-be94-6ca6c1c6ee1d.selectorLabels" . | nindent 6 }}
