apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9c907c7-7db7-44b4-88ea-68eb2a0b81ad.fullname" . }}
  labels:
    {{- include "go-echof9c907c7-7db7-44b4-88ea-68eb2a0b81ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9c907c7-7db7-44b4-88ea-68eb2a0b81ad.selectorLabels" . | nindent 6 }}
