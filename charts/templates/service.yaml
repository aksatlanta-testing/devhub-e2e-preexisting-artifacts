apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18cde5a6-051b-4425-85da-5d28dd22133d.fullname" . }}
  labels:
    {{- include "go-echo18cde5a6-051b-4425-85da-5d28dd22133d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18cde5a6-051b-4425-85da-5d28dd22133d.selectorLabels" . | nindent 6 }}
