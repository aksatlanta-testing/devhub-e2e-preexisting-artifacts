apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74773f92-7d90-47df-9e00-fc996ba7d46b.fullname" . }}
  labels:
    {{- include "go-echo74773f92-7d90-47df-9e00-fc996ba7d46b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74773f92-7d90-47df-9e00-fc996ba7d46b.selectorLabels" . | nindent 6 }}
