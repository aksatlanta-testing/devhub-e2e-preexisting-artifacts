apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88d780fc-545b-423e-9158-7e868adcd3c8.fullname" . }}
  labels:
    {{- include "go-echo88d780fc-545b-423e-9158-7e868adcd3c8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88d780fc-545b-423e-9158-7e868adcd3c8.selectorLabels" . | nindent 6 }}
