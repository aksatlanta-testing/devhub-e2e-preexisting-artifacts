apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ea3657b-97e8-4b1a-a75b-44d92771a219.fullname" . }}
  labels:
    {{- include "go-echo0ea3657b-97e8-4b1a-a75b-44d92771a219.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ea3657b-97e8-4b1a-a75b-44d92771a219.selectorLabels" . | nindent 6 }}
