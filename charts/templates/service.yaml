apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb54e074-0c32-4fda-8970-5be792fd92aa.fullname" . }}
  labels:
    {{- include "go-echobb54e074-0c32-4fda-8970-5be792fd92aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb54e074-0c32-4fda-8970-5be792fd92aa.selectorLabels" . | nindent 6 }}
