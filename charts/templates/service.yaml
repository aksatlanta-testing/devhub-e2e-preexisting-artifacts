apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5851524-718f-4180-8f70-8dfd9e07fdd0.fullname" . }}
  labels:
    {{- include "go-echod5851524-718f-4180-8f70-8dfd9e07fdd0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5851524-718f-4180-8f70-8dfd9e07fdd0.selectorLabels" . | nindent 6 }}
