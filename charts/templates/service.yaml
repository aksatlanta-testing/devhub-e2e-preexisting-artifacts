apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0322df58-f274-4ee8-9e92-e244b4747805.fullname" . }}
  labels:
    {{- include "go-echo0322df58-f274-4ee8-9e92-e244b4747805.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0322df58-f274-4ee8-9e92-e244b4747805.selectorLabels" . | nindent 6 }}
