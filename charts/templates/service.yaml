apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08cdc34e-fd35-4304-bdd1-e44205740bda.fullname" . }}
  labels:
    {{- include "go-echo08cdc34e-fd35-4304-bdd1-e44205740bda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08cdc34e-fd35-4304-bdd1-e44205740bda.selectorLabels" . | nindent 6 }}
