apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7deffba1-04f5-4dbf-800f-5b7cade22e02.fullname" . }}
  labels:
    {{- include "go-echo7deffba1-04f5-4dbf-800f-5b7cade22e02.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7deffba1-04f5-4dbf-800f-5b7cade22e02.selectorLabels" . | nindent 6 }}
