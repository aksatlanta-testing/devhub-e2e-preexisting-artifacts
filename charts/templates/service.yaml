apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo532bcbe9-b5f5-4d56-857d-19f750520a5b.fullname" . }}
  labels:
    {{- include "go-echo532bcbe9-b5f5-4d56-857d-19f750520a5b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo532bcbe9-b5f5-4d56-857d-19f750520a5b.selectorLabels" . | nindent 6 }}
