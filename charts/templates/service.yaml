apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b58efe5-777f-41d5-bdbe-2e168fb8e6fe.fullname" . }}
  labels:
    {{- include "go-echo6b58efe5-777f-41d5-bdbe-2e168fb8e6fe.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b58efe5-777f-41d5-bdbe-2e168fb8e6fe.selectorLabels" . | nindent 6 }}
