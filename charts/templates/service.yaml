apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7e89adb-b272-4b5c-a42e-429e2efa5aa7.fullname" . }}
  labels:
    {{- include "go-echoa7e89adb-b272-4b5c-a42e-429e2efa5aa7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7e89adb-b272-4b5c-a42e-429e2efa5aa7.selectorLabels" . | nindent 6 }}
