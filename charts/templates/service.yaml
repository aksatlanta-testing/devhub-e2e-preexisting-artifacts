apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b2cf911-a695-4f74-ab84-9537fd37467e.fullname" . }}
  labels:
    {{- include "go-echo0b2cf911-a695-4f74-ab84-9537fd37467e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b2cf911-a695-4f74-ab84-9537fd37467e.selectorLabels" . | nindent 6 }}
