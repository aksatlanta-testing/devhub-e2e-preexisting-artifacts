apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f686f2f-0458-4cf7-a8cc-2bc3c6ddff48.fullname" . }}
  labels:
    {{- include "go-echo1f686f2f-0458-4cf7-a8cc-2bc3c6ddff48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f686f2f-0458-4cf7-a8cc-2bc3c6ddff48.selectorLabels" . | nindent 6 }}
