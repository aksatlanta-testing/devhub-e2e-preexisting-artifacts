apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobfbc0c58-4840-48c5-83c8-c6b8bb3e6098.fullname" . }}
  labels:
    {{- include "go-echobfbc0c58-4840-48c5-83c8-c6b8bb3e6098.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobfbc0c58-4840-48c5-83c8-c6b8bb3e6098.selectorLabels" . | nindent 6 }}
