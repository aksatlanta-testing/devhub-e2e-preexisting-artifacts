apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7d8dc3d-e3cc-439b-86c9-ce9cdbc64790.fullname" . }}
  labels:
    {{- include "go-echod7d8dc3d-e3cc-439b-86c9-ce9cdbc64790.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7d8dc3d-e3cc-439b-86c9-ce9cdbc64790.selectorLabels" . | nindent 6 }}
