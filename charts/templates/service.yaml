apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e8c366d-50f7-4539-bbec-7dfaee139b14.fullname" . }}
  labels:
    {{- include "go-echo4e8c366d-50f7-4539-bbec-7dfaee139b14.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e8c366d-50f7-4539-bbec-7dfaee139b14.selectorLabels" . | nindent 6 }}
