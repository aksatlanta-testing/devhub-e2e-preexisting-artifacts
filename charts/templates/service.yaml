apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d1d8659-98c6-43cd-844c-3c49a9d6bf7c.fullname" . }}
  labels:
    {{- include "go-echo5d1d8659-98c6-43cd-844c-3c49a9d6bf7c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d1d8659-98c6-43cd-844c-3c49a9d6bf7c.selectorLabels" . | nindent 6 }}
