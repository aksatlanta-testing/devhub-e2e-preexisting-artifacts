apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa94a365-c8c1-47bf-977f-fbfc714c9400.fullname" . }}
  labels:
    {{- include "go-echofa94a365-c8c1-47bf-977f-fbfc714c9400.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa94a365-c8c1-47bf-977f-fbfc714c9400.selectorLabels" . | nindent 6 }}
