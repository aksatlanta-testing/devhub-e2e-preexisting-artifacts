apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1195479-3380-4183-9067-3a84f18c9b32.fullname" . }}
  labels:
    {{- include "go-echob1195479-3380-4183-9067-3a84f18c9b32.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1195479-3380-4183-9067-3a84f18c9b32.selectorLabels" . | nindent 6 }}
