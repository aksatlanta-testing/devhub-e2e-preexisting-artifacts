apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10395211-60bb-42a4-bd0d-2faa6bdd406a.fullname" . }}
  labels:
    {{- include "go-echo10395211-60bb-42a4-bd0d-2faa6bdd406a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10395211-60bb-42a4-bd0d-2faa6bdd406a.selectorLabels" . | nindent 6 }}
