apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d30e698-b1fe-4178-9aa2-08c3b267b4f2.fullname" . }}
  labels:
    {{- include "go-echo8d30e698-b1fe-4178-9aa2-08c3b267b4f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d30e698-b1fe-4178-9aa2-08c3b267b4f2.selectorLabels" . | nindent 6 }}
