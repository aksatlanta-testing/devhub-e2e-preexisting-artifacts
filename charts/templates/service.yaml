apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe29a51c3-0366-4ab2-a73f-acf4f4b8cf7c.fullname" . }}
  labels:
    {{- include "go-echoe29a51c3-0366-4ab2-a73f-acf4f4b8cf7c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe29a51c3-0366-4ab2-a73f-acf4f4b8cf7c.selectorLabels" . | nindent 6 }}
