apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffaee2ba-43de-4cf6-b2e3-cc2a8144cf5e.fullname" . }}
  labels:
    {{- include "go-echoffaee2ba-43de-4cf6-b2e3-cc2a8144cf5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffaee2ba-43de-4cf6-b2e3-cc2a8144cf5e.selectorLabels" . | nindent 6 }}
