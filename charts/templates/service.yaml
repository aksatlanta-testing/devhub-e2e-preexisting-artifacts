apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo768ec9b2-fade-4405-91e1-7ee09bd59489.fullname" . }}
  labels:
    {{- include "go-echo768ec9b2-fade-4405-91e1-7ee09bd59489.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo768ec9b2-fade-4405-91e1-7ee09bd59489.selectorLabels" . | nindent 6 }}
