apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f668bf2-81cd-4add-b6c5-e1abcf7e96a8.fullname" . }}
  labels:
    {{- include "go-echo3f668bf2-81cd-4add-b6c5-e1abcf7e96a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f668bf2-81cd-4add-b6c5-e1abcf7e96a8.selectorLabels" . | nindent 6 }}
