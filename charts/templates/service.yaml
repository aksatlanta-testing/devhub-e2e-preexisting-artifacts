apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d639d56-1a23-4ce6-a1af-7c068533e053.fullname" . }}
  labels:
    {{- include "go-echo7d639d56-1a23-4ce6-a1af-7c068533e053.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d639d56-1a23-4ce6-a1af-7c068533e053.selectorLabels" . | nindent 6 }}
