apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedfe35a6-d981-46ad-909c-e23cb9e38d08.fullname" . }}
  labels:
    {{- include "go-echoedfe35a6-d981-46ad-909c-e23cb9e38d08.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedfe35a6-d981-46ad-909c-e23cb9e38d08.selectorLabels" . | nindent 6 }}
