apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d0b2e0c-e2d1-411f-b7ee-67c4af854b46.fullname" . }}
  labels:
    {{- include "go-echo0d0b2e0c-e2d1-411f-b7ee-67c4af854b46.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d0b2e0c-e2d1-411f-b7ee-67c4af854b46.selectorLabels" . | nindent 6 }}
