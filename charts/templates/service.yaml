apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0fefa761-49c4-467f-9fea-107e79bb2c0e.fullname" . }}
  labels:
    {{- include "go-echo0fefa761-49c4-467f-9fea-107e79bb2c0e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0fefa761-49c4-467f-9fea-107e79bb2c0e.selectorLabels" . | nindent 6 }}
