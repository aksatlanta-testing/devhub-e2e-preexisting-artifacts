apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7701adb-a266-4f1a-8b53-844fd99c0309.fullname" . }}
  labels:
    {{- include "go-echod7701adb-a266-4f1a-8b53-844fd99c0309.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7701adb-a266-4f1a-8b53-844fd99c0309.selectorLabels" . | nindent 6 }}
