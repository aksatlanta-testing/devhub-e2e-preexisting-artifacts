apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c4c283c-8a1b-4b62-a48b-0333a5d44899.fullname" . }}
  labels:
    {{- include "go-echo6c4c283c-8a1b-4b62-a48b-0333a5d44899.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c4c283c-8a1b-4b62-a48b-0333a5d44899.selectorLabels" . | nindent 6 }}
