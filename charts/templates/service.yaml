apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8902eda-7c77-4ccb-82d5-ddc6bb6d92b3.fullname" . }}
  labels:
    {{- include "go-echof8902eda-7c77-4ccb-82d5-ddc6bb6d92b3.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8902eda-7c77-4ccb-82d5-ddc6bb6d92b3.selectorLabels" . | nindent 6 }}
