apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof3fdf06b-c4f5-48b6-9b83-5eedf213f425.fullname" . }}
  labels:
    {{- include "go-echof3fdf06b-c4f5-48b6-9b83-5eedf213f425.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof3fdf06b-c4f5-48b6-9b83-5eedf213f425.selectorLabels" . | nindent 6 }}
