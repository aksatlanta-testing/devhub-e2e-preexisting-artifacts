apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65de99f7-f5e7-49aa-aebb-8c183dec7b0b.fullname" . }}
  labels:
    {{- include "go-echo65de99f7-f5e7-49aa-aebb-8c183dec7b0b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65de99f7-f5e7-49aa-aebb-8c183dec7b0b.selectorLabels" . | nindent 6 }}
