apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28f8e0b5-cac4-4f8b-ac4a-0ced6fa4ddc9.fullname" . }}
  labels:
    {{- include "go-echo28f8e0b5-cac4-4f8b-ac4a-0ced6fa4ddc9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28f8e0b5-cac4-4f8b-ac4a-0ced6fa4ddc9.selectorLabels" . | nindent 6 }}
