apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cbbd04d-77ed-470f-a160-7b459b84c446.fullname" . }}
  labels:
    {{- include "go-echo5cbbd04d-77ed-470f-a160-7b459b84c446.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cbbd04d-77ed-470f-a160-7b459b84c446.selectorLabels" . | nindent 6 }}
