apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a5d9495-403f-4465-8641-2ede88697091.fullname" . }}
  labels:
    {{- include "go-echo9a5d9495-403f-4465-8641-2ede88697091.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a5d9495-403f-4465-8641-2ede88697091.selectorLabels" . | nindent 6 }}
