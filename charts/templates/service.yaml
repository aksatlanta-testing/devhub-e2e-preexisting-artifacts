apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3914cd9e-c2ab-4d88-b6e0-ffd44745f24b.fullname" . }}
  labels:
    {{- include "go-echo3914cd9e-c2ab-4d88-b6e0-ffd44745f24b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3914cd9e-c2ab-4d88-b6e0-ffd44745f24b.selectorLabels" . | nindent 6 }}
