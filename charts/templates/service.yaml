apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90b2905a-e860-4930-9d7c-1ef672e98f87.fullname" . }}
  labels:
    {{- include "go-echo90b2905a-e860-4930-9d7c-1ef672e98f87.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90b2905a-e860-4930-9d7c-1ef672e98f87.selectorLabels" . | nindent 6 }}
