apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8961bb7-a47f-4e70-8acc-740b4e103535.fullname" . }}
  labels:
    {{- include "go-echob8961bb7-a47f-4e70-8acc-740b4e103535.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8961bb7-a47f-4e70-8acc-740b4e103535.selectorLabels" . | nindent 6 }}
