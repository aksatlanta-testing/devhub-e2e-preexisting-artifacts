apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob725ac2f-5daa-44fb-bb97-88a52065806e.fullname" . }}
  labels:
    {{- include "go-echob725ac2f-5daa-44fb-bb97-88a52065806e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob725ac2f-5daa-44fb-bb97-88a52065806e.selectorLabels" . | nindent 6 }}
