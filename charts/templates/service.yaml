apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1924cf2-4f9a-4a02-b250-b1d83accc89b.fullname" . }}
  labels:
    {{- include "go-echoa1924cf2-4f9a-4a02-b250-b1d83accc89b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1924cf2-4f9a-4a02-b250-b1d83accc89b.selectorLabels" . | nindent 6 }}
