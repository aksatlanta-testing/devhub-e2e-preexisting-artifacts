apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo561ea968-f993-4ba4-8a88-24d2b5c51624.fullname" . }}
  labels:
    {{- include "go-echo561ea968-f993-4ba4-8a88-24d2b5c51624.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo561ea968-f993-4ba4-8a88-24d2b5c51624.selectorLabels" . | nindent 6 }}
