apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo467ce1c7-b34a-4d3b-948a-4d5b00f84600.fullname" . }}
  labels:
    {{- include "go-echo467ce1c7-b34a-4d3b-948a-4d5b00f84600.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo467ce1c7-b34a-4d3b-948a-4d5b00f84600.selectorLabels" . | nindent 6 }}
