apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode0634bb-92c6-4099-8ceb-69d8c9b6e091.fullname" . }}
  labels:
    {{- include "go-echode0634bb-92c6-4099-8ceb-69d8c9b6e091.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode0634bb-92c6-4099-8ceb-69d8c9b6e091.selectorLabels" . | nindent 6 }}
