apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e1851cf-d0c3-431b-a1b9-c746ee0754ed.fullname" . }}
  labels:
    {{- include "go-echo4e1851cf-d0c3-431b-a1b9-c746ee0754ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e1851cf-d0c3-431b-a1b9-c746ee0754ed.selectorLabels" . | nindent 6 }}
