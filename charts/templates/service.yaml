apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d2565b1-858e-4c21-b3e6-68c80eb61ada.fullname" . }}
  labels:
    {{- include "go-echo9d2565b1-858e-4c21-b3e6-68c80eb61ada.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d2565b1-858e-4c21-b3e6-68c80eb61ada.selectorLabels" . | nindent 6 }}
