apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a7c8238-ee00-4275-9d41-9992db72ab88.fullname" . }}
  labels:
    {{- include "go-echo6a7c8238-ee00-4275-9d41-9992db72ab88.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a7c8238-ee00-4275-9d41-9992db72ab88.selectorLabels" . | nindent 6 }}
