apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9641585-f2b1-447d-a6a6-c621537984c2.fullname" . }}
  labels:
    {{- include "go-echob9641585-f2b1-447d-a6a6-c621537984c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9641585-f2b1-447d-a6a6-c621537984c2.selectorLabels" . | nindent 6 }}
