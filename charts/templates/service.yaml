apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa0cc1417-f28f-4e16-9261-b8214afe00d1.fullname" . }}
  labels:
    {{- include "go-echoa0cc1417-f28f-4e16-9261-b8214afe00d1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa0cc1417-f28f-4e16-9261-b8214afe00d1.selectorLabels" . | nindent 6 }}
