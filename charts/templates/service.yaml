apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8646aa5-818b-4b9f-8912-0b62fc58a6f1.fullname" . }}
  labels:
    {{- include "go-echoe8646aa5-818b-4b9f-8912-0b62fc58a6f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8646aa5-818b-4b9f-8912-0b62fc58a6f1.selectorLabels" . | nindent 6 }}
