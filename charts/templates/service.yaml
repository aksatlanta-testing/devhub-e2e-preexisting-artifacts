apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc99314c4-0cbb-440c-ba27-7eb6be8de000.fullname" . }}
  labels:
    {{- include "go-echoc99314c4-0cbb-440c-ba27-7eb6be8de000.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc99314c4-0cbb-440c-ba27-7eb6be8de000.selectorLabels" . | nindent 6 }}
