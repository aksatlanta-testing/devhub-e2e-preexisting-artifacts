apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa42d56f9-0461-4fcc-b088-7603d598beea.fullname" . }}
  labels:
    {{- include "go-echoa42d56f9-0461-4fcc-b088-7603d598beea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa42d56f9-0461-4fcc-b088-7603d598beea.selectorLabels" . | nindent 6 }}
