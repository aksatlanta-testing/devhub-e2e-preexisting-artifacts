apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ddd02ae-2a61-43f8-8a34-04821775fd9a.fullname" . }}
  labels:
    {{- include "go-echo3ddd02ae-2a61-43f8-8a34-04821775fd9a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ddd02ae-2a61-43f8-8a34-04821775fd9a.selectorLabels" . | nindent 6 }}
