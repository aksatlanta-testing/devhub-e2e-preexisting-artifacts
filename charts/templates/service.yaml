apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc15899d4-1222-4852-86ca-414d085fc3bc.fullname" . }}
  labels:
    {{- include "go-echoc15899d4-1222-4852-86ca-414d085fc3bc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc15899d4-1222-4852-86ca-414d085fc3bc.selectorLabels" . | nindent 6 }}
