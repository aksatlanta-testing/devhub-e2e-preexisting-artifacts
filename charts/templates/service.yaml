apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc92ad6a-e964-49e8-ad38-45d1e3e3a815.fullname" . }}
  labels:
    {{- include "go-echodc92ad6a-e964-49e8-ad38-45d1e3e3a815.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc92ad6a-e964-49e8-ad38-45d1e3e3a815.selectorLabels" . | nindent 6 }}
