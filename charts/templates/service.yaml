apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa11fe349-df2d-4194-9c6e-c5931ea585b9.fullname" . }}
  labels:
    {{- include "go-echoa11fe349-df2d-4194-9c6e-c5931ea585b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa11fe349-df2d-4194-9c6e-c5931ea585b9.selectorLabels" . | nindent 6 }}
