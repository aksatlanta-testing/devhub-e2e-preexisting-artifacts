apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23afc161-0264-4063-8012-d2a704c53f8a.fullname" . }}
  labels:
    {{- include "go-echo23afc161-0264-4063-8012-d2a704c53f8a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23afc161-0264-4063-8012-d2a704c53f8a.selectorLabels" . | nindent 6 }}
