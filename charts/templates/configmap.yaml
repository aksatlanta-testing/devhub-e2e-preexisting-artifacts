apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoc55c9ddd-f478-4e12-988f-04f506ba0c8c.fullname" . }}-config
  labels:
    {{- include "go-echoc55c9ddd-f478-4e12-988f-04f506ba0c8c.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
