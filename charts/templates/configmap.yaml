apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoeee3fedf-fd87-4c7c-bb27-97bccc3dcf2a.fullname" . }}-config
  labels:
    {{- include "go-echoeee3fedf-fd87-4c7c-bb27-97bccc3dcf2a.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
