apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoebd1f8ad-cc81-4c2c-9014-f2e4df8bb8ce.fullname" . }}-config
  labels:
    {{- include "go-echoebd1f8ad-cc81-4c2c-9014-f2e4df8bb8ce.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
