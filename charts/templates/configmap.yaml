apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoa5d9bafb-6ea9-41eb-93ea-a82328244823.fullname" . }}-config
  labels:
    {{- include "go-echoa5d9bafb-6ea9-41eb-93ea-a82328244823.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
