apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echocc1066dc-5fd6-44fa-87c4-9a0abd70b5dd.fullname" . }}-config
  labels:
    {{- include "go-echocc1066dc-5fd6-44fa-87c4-9a0abd70b5dd.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
