  labels:
    {{- include "go-echo28f8e0b5-cac4-4f8b-ac4a-0ced6fa4ddc9.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
