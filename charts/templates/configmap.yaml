  labels:
    {{- include "go-echoc873f792-ad9a-430f-9db1-ad6caceb7df0.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
