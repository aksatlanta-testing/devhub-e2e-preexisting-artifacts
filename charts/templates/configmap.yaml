apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echofce4c8b8-e9c0-4ae7-8864-b9ff8b1d1220.fullname" . }}-config
  labels:
    {{- include "go-echofce4c8b8-e9c0-4ae7-8864-b9ff8b1d1220.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
