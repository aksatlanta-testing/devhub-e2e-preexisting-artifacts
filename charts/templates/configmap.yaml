  labels:
    {{- include "go-echob8cea8e5-cdb4-4b8f-acb3-2be5aca9ef18.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
