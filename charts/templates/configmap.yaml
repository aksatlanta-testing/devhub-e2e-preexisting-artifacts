apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoc73d6cd8-ddf7-45a6-ba90-285aef834d2f.fullname" . }}-config
  labels:
    {{- include "go-echoc73d6cd8-ddf7-45a6-ba90-285aef834d2f.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
