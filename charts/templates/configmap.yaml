apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoa2f5c5bc-2f4c-42ea-af9d-060dba03dd3e.fullname" . }}-config
  labels:
    {{- include "go-echoa2f5c5bc-2f4c-42ea-af9d-060dba03dd3e.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
